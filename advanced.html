<script>
// ==================== 用户界面 ====================
let currentUserData = null;

async function updateUserUI() {
    const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
    const userNameSpan = document.getElementById('userName');
    const userScoreSpan = document.getElementById('userScore');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    
    if (user) {
        userNameSpan.innerText = user.nickname || '芦苇同学';
        let score = user.score || 0;
        if (typeof window.API !== 'undefined' && window.API.getUserScore) {
            const apiScore = await window.API.getUserScore();
            if (apiScore !== undefined) score = apiScore;
        }
        userScoreSpan.innerText = `积分 ${score}`;
        if(loginBtn) loginBtn.style.display = 'none';
        if(logoutBtn) logoutBtn.style.display = 'block';
        currentUserData = user;
    } else {
        userNameSpan.innerText = '未登录';
        userScoreSpan.innerText = '积分 0';
        if(loginBtn) loginBtn.style.display = 'block';
        if(logoutBtn) logoutBtn.style.display = 'none';
        currentUserData = null;
    }
}

async function addScore(amount, reason) {
    if (!currentUserData) return;
    if (typeof window.API !== 'undefined' && window.API.addScore) {
        await window.API.addScore(amount, reason);
        updateUserUI();
    }
}

if(document.getElementById('loginBtn')) {
    document.getElementById('loginBtn').addEventListener('click', () => { if(typeof showLoginModal === 'function') showLoginModal(); });
}
if(document.getElementById('logoutBtn')) {
    document.getElementById('logoutBtn').addEventListener('click', () => { if(typeof logout === 'function') logout(); location.reload(); });
}

window.onLoginSuccess = async function(user) {
    currentUserData = user;
    await updateUserUI();
    if (typeof pullFromCloud === 'function') {
        await pullFromCloud();
    }
};

updateUserUI();

// ==================== 折叠面板功能 ====================
document.querySelectorAll('.section-title').forEach(title => {
    title.addEventListener('click', () => {
        const panelId = title.dataset.panel;
        const panel = document.getElementById(panelId);
        if (panel) {
            if (panel.classList.contains('active')) {
                panel.classList.remove('active');
                title.innerHTML = title.innerHTML.replace('▲', '▼');
            } else {
                panel.classList.add('active');
                title.innerHTML = title.innerHTML.replace('▼', '▲');
            }
        }
    });
});

// ==================== 通用闯关系统 ====================
function createQuizSystem(bankData, containerId, quizPanelId, totalLevels, levelName) {
    let currentLevel = 1;
    let streak = 0;
    let completed = false;
    let currentQuestions = [];
    let currentIndex = 0;
    
    function getStorageKey() { return `quiz_${levelName}_level_${currentUserData?.user_id || 'guest'}`; }
    
    function loadSavedProgress() {
        if (!currentUserData) return;
        const saved = localStorage.getItem(getStorageKey());
        if (saved) currentLevel = parseInt(saved);
        if (currentLevel > totalLevels) currentLevel = totalLevels;
    }
    
    function saveProgress() {
        if (!currentUserData) return;
        localStorage.setItem(getStorageKey(), currentLevel);
    }
    
    function loadLevel() {
        if (currentLevel > totalLevels) {
            const panel = document.getElementById(quizPanelId);
            if (panel) panel.innerHTML = `<div class="feedback">🏆 恭喜完成所有${levelName}！</div>`;
            return;
        }
        streak = 0;
        completed = false;
        let bank = bankData[currentLevel];
        if (!bank || bank.length === 0) {
            const panel = document.getElementById(quizPanelId);
            if (panel) panel.innerHTML = `<div class="feedback">⚠️ 第${currentLevel}关题库完善中～</div>`;
            return;
        }
        currentQuestions = [...bank].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        const panel = document.getElementById(quizPanelId);
        if (panel) {
            panel.innerHTML = `
                <div style="color:#F2C94C; margin-bottom:8px">📚 ${levelName} · 第${currentLevel}/${totalLevels}关 · 连续答对8题过关</div>
                <div id="${containerId}_Q"></div>
                <div id="${containerId}_Feed" class="feedback"></div>
            `;
        }
        nextQuestion();
    }
    
    function nextQuestion() {
        if (completed) return;
        if (streak >= 8) {
            const feed = document.getElementById(`${containerId}_Feed`);
            if (feed) feed.innerHTML = `✅ 恭喜通过第${currentLevel}关！进入下一关 ➡️`;
            completed = true;
            currentLevel++;
            saveProgress();
            addScore(20, `通关${levelName}第${currentLevel-1}关`);
            setTimeout(() => loadLevel(), 1500);
            return;
        }
        if (currentIndex >= currentQuestions.length) {
            currentQuestions = [...currentQuestions].sort(() => Math.random() - 0.5);
            currentIndex = 0;
        }
        const q = currentQuestions[currentIndex++];
        const qDiv = document.getElementById(`${containerId}_Q`);
        if (qDiv) {
            qDiv.innerHTML = `
                <div class="lyric-question">${q.q}</div>
                <div class="lyric-options" id="${containerId}_Opts"></div>
            `;
        }
        const optsDiv = document.getElementById(`${containerId}_Opts`);
        if (optsDiv) {
            optsDiv.innerHTML = "";
            q.opts.forEach((opt, i) => {
                const btn = document.createElement("button");
                btn.className = "lyric-opt-btn";
                btn.innerText = opt;
                btn.onclick = () => {
                    if (i === q.ans) {
                        streak++;
                        const feed = document.getElementById(`${containerId}_Feed`);
                        if (feed) feed.innerHTML = `✅ 正确！ ${streak}/8`;
                        addScore(5, `${levelName}答题正确`);
                        nextQuestion();
                    } else {
                        streak = 0;
                        const feed = document.getElementById(`${containerId}_Feed`);
                        if (feed) feed.innerHTML = `❌ 错误！正确答案：${q.opts[q.ans]}。 ${q.exp}`;
                        nextQuestion();
                    }
                };
                optsDiv.appendChild(btn);
            });
        }
    }
    
    function buildUI() {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = "";
        const btn = document.createElement("button");
        btn.className = "cat-btn";
        btn.innerText = `🎯 ${levelName}（${totalLevels}关）`;
        btn.onclick = () => { loadSavedProgress(); loadLevel(); };
        container.appendChild(btn);
    }
    
    buildUI();
}
