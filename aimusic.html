* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #050505 0%, #0a0a0a 12%, #111111 24%, #1a1a1a 36%, #1a1a3a 46%, #4a4a8a 52%, #6a5a9a 56%, #4a4a8a 60%, #1a1a3a 66%, #1a1a1a 74%, #2a2a2a 82%, #4a4a4a 88%, #2a2a2a 94%, #1a1a1a 100%);
    background-size: 600% 600%;
    color: #e8e9f0;
    padding: 20px 20px 100px;
    animation: bodyGradientFlow 14s ease-in-out infinite alternate;
    min-height: 100vh;
}
@keyframes bodyGradientFlow {
    0% { background-position: 0% 50%; }
    14% { background-position: 14% 50%; }
    28% { background-position: 28% 50%; }
    42% { background-position: 42% 50%; }
    57% { background-position: 57% 50%; }
    71% { background-position: 71% 50%; }
    85% { background-position: 85% 50%; }
    100% { background-position: 100% 50%; }
}
.container { max-width: 1000px; margin: 0 auto; }
.hero {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(200,180,230,0.12) 25%, rgba(160,140,210,0.15) 45%, rgba(120,100,190,0.12) 60%, rgba(160,140,210,0.15) 75%, rgba(200,180,230,0.12) 85%, rgba(255,255,255,0.08) 100%);

    border-radius: 48px;
    margin-bottom: 30px;
    border: 1px solid rgba(200,180,230,0.15);
    backdrop-filter: blur(10px);
    animation: heroCardFlow 8s ease-in-out infinite alternate;
}
@keyframes heroCardFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}
.hero h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, #d4b896, #f0e0c8, #b8a0c8, #d4b896);

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: heroTitleFlow 6s ease-in-out infinite alternate;
}
@keyframes heroTitleFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}
.hero p {
    margin-top: 8px;
    opacity: 0.5;
    color: #d4b896;
    letter-spacing: 1px;
    font-size: 0.9rem;
}
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.tab-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.15);
    padding: 10px 16px;
    border-radius: 40px;
    cursor: pointer;
    text-align: center;
    flex: 1;
    transition: 0.3s;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
    backdrop-filter: blur(4px);
}
.tab-btn:hover { border-color: rgba(212,184,150,0.3); color: rgba(255,255,255,0.7); }
.tab-btn.active {
    background: linear-gradient(135deg, rgba(212,184,150,0.2), rgba(184,160,200,0.2));
    color: #d4b896;
    border-color: rgba(212,184,150,0.4);
    box-shadow: 0 0 30px rgba(212,184,150,0.05);
}
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ===== 卡片基础 ===== */
.rank-card {
    position: relative;
    background: linear-gradient(135deg, rgba(212,184,150,0.10) 0%, rgba(245,230,200,0.06) 8%, rgba(26,58,42,0.20) 25%, rgba(10,30,20,0.30) 40%, rgba(0,0,0,0.35) 50%, rgba(10,30,20,0.30) 60%, rgba(26,58,42,0.20) 75%, rgba(245,230,200,0.06) 88%, rgba(212,184,150,0.10) 94%, rgba(160,140,210,0.12) 100%);
    background-size: 500% 500%;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(212,184,150,0.08);
    transition: 0.4s;
    overflow: hidden;
    animation: cardGradientFlow 10s ease-in-out infinite alternate;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
@keyframes cardGradientFlow {
    0% { background-position: 0% 50%; }
    20% { background-position: 20% 50%; }
    40% { background-position: 40% 50%; }
    60% { background-position: 60% 50%; }
    80% { background-position: 80% 50%; }
    100% { background-position: 100% 50%; }
}

/* ===== 紫红光晕爆发（悬停） ===== */
.rank-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(
        circle at 80% 10%,
        rgba(200, 140, 255, 0.18) 0%,
        rgba(235, 80, 205, 0.16) 18%,
        rgba(180, 140, 220, 0.10) 35%,
        rgba(100, 230, 180, 0.12) 55%,
        rgba(220, 240, 250, 0.06) 75%,
        transparent 100%
    );
    pointer-events: none;
    z-index: 0;
    border-radius: 20px;
    transition: 0.8s ease;
}
.rank-card:hover::before {
    background: radial-gradient(
        circle at 80% 10%,
        rgba(215, 155, 255, 0.42) 0%,
        rgba(250, 110, 220, 0.38) 20%,
        rgba(195, 155, 235, 0.22) 38%,
        rgba(130, 240, 195, 0.22) 58%,
        rgba(235, 248, 255, 0.14) 78%,
        rgba(255, 255, 255, 0.06) 100%
    );
}

/* ===== 流光扫过 ===== */
.rank-card .shimmer {
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
    transform: skewX(-25deg);
    transition: 0.8s;
    pointer-events: none;
    z-index: 1;
}
.rank-card:hover .shimmer { left: 150%; }

/* ===== 粒子飘落 ===== */
.rank-card .particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(200, 150, 255, 0.5);
    box-shadow: 0 0 8px rgba(200, 150, 255, 0.3);
    pointer-events: none;
    z-index: 1;
    animation: particleFall 6s linear infinite, colorCycle 4s ease-in-out infinite alternate;
}
@keyframes colorCycle {
    0% { background: rgba(200, 150, 255, 0.6); box-shadow: 0 0 8px rgba(200, 150, 255, 0.4); }
    33% { background: rgba(140, 220, 200, 0.5); box-shadow: 0 0 8px rgba(140, 220, 200, 0.3); }
    66% { background: rgba(255, 200, 150, 0.5); box-shadow: 0 0 8px rgba(255, 200, 150, 0.3); }
    100% { background: rgba(200, 150, 255, 0.6); box-shadow: 0 0 8px rgba(200, 150, 255, 0.4); }
}
.rank-card .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
.rank-card .particle:nth-child(2) { left: 25%; animation-delay: 1.2s; }
.rank-card .particle:nth-child(3) { left: 40%; animation-delay: 2.4s; }
.rank-card .particle:nth-child(4) { left: 55%; animation-delay: 3.6s; }
.rank-card .particle:nth-child(5) { left: 70%; animation-delay: 4.8s; }
.rank-card .particle:nth-child(6) { left: 85%; animation-delay: 1.8s; }
.rank-card .particle:nth-child(7) { left: 15%; animation-delay: 3.0s; }
.rank-card .particle:nth-child(8) { left: 65%; animation-delay: 0.6s; }
@keyframes particleFall {
    0% { top: -10%; opacity: 0; transform: translateX(0); }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { top: 110%; opacity: 0; transform: translateX(30px); }
}

/* ===== 金色折角 ===== */
.rank-card::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 0 150px 150px;
    border-color: transparent transparent rgba(160,120,220,0.06) transparent;
    pointer-events: none;
    z-index: 2;
    transition: 0.5s ease;
}
.rank-card:hover::after {
    border-color: transparent transparent #b8a0d0 transparent;
    opacity: 0.35;
    filter: drop-shadow(0 0 35px rgba(160,120,220,0.25));
}

/* ===== 音符装饰 ===== */
.rank-note {
    position: absolute;
    bottom: 8px;
    right: 14px;
    font-size: 3rem;
    color: rgba(255, 255, 255, 0.04);
    pointer-events: none;
    z-index: 1;
    transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    font-family: serif;
    user-select: none;
}
.rank-card:hover .rank-note {
    background: linear-gradient(135deg, rgba(200,140,255,0.8), rgba(230,100,200,0.6), rgba(180,140,220,0.4));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transform: rotate(12deg) scale(1.4);
    filter: drop-shadow(0 0 40px rgba(180,140,255,0.2)) drop-shadow(0 0 80px rgba(200,150,255,0.05));
    animation: notePulse 2s ease-in-out infinite;
}
@keyframes notePulse {
    0%, 100% { transform: rotate(12deg) scale(1.4); opacity: 1; }
    50% { transform: rotate(12deg) scale(1.5); opacity: 0.8; }
}

.rank-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    font-size: 1.4rem;
    font-weight: 700;
    background: radial-gradient(circle at 40% 40%, #e8e8e8 0%, #b8b8b8 20%, #666666 40%, #222222 55%, #666666 70%, #b8b8b8 85%, #e8e8e8 100%);
    border-radius: 50%;
    border: 2px solid rgba(212, 184, 150, 0.2);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.4), 0 0 40px rgba(212,184,150,0.04);
    transition: 0.4s;
    flex-shrink: 0;
    margin-right: 14px;
    position: relative;
    animation: cdSpin 8s linear infinite;
}
.rank-number .num {
    background: linear-gradient(135deg, #f5e6c8, #d4b896, #f5e6c8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
    text-shadow: 0 0 20px rgba(212,184,150,0.1);
}
.rank-number::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 35% 30%, rgba(255,255,255,0.15) 0%, transparent 50%);
    pointer-events: none;
}
.rank-number::after {
    content: '';
    position: absolute;
    inset: 50%;
    width: 8px;
    height: 8px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,0,0,0.6), rgba(255,255,255,0.1));
    border: 1px solid rgba(255,255,255,0.05);
    pointer-events: none;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
}
.rank-card:hover .rank-number {
    border-color: rgba(212, 184, 150, 0.35);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.4), 0 0 60px rgba(212,184,150,0.08);
}
@keyframes cdSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ===== TOP 3 奖牌 ===== */
.rank-medal {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 1.6rem;
    z-index: 3;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    animation: medalPulse 2s ease-in-out infinite;
}
@keyframes medalPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

.song-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 8px 0 4px;
    background: linear-gradient(90deg, #d4b896 0%, #f0e0c8 25%, #b8a0c8 50%, #f0e0c8 75%, #d4b896 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: titleFlow 6s ease-in-out infinite alternate;
}
@keyframes titleFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}
.song-artist {
    color: rgba(255,255,255,0.4);
    font-size: 0.9rem;
}
.song-artist span { color: rgba(212,184,150,0.5); }
.demo-badge {
    background: linear-gradient(135deg, rgba(212,184,150,0.2), rgba(184,160,200,0.2));
    color: #d4b896;
    font-size: 0.6rem;
    padding: 2px 12px;
    border-radius: 20px;
    display: inline-block;
    margin-left: 8px;
    font-weight: 600;
    border: 1px solid rgba(212,184,150,0.15);
    vertical-align: middle;
}
.action-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.15);
    padding: 6px 18px;
    border-radius: 40px;
    cursor: pointer;
    margin-right: 10px;
    color: rgba(255,255,255,0.4);
    font-weight: 400;
    transition: 0.3s;
    font-size: 0.85rem;
}
.action-btn:hover {
    background: rgba(212,184,150,0.1);
    border-color: rgba(212,184,150,0.3);
    color: #d4b896;
}

/* ===== 底部播放器 ===== */
audio {
    width: 100%;
    margin: 10px 0;
    border-radius: 30px;
    background: rgba(255,255,255,0.03);
}
audio::-webkit-media-controls-panel {
    background: rgba(26,26,46,0.6);
}

.floating-upload-btn {
    position: fixed;
    bottom: 30px;
    right: 20px;
    background: linear-gradient(135deg, #d4b896, #b8a0c8);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 30px rgba(184,160,200,0.3);
    z-index: 999;
    transition: 0.3s;
}
.floating-upload-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 50px rgba(184,160,200,0.4);
}
.floating-upload-btn span {
    font-size: 32px;
    font-weight: 300;
    color: #1a1a2e;
}

.upload-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}
.upload-modal.active { display: flex; }
.upload-modal-content {
    background: linear-gradient(145deg, #1a1a2e, #2a2a4a);
    max-width: 500px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 28px;

    border: 1px solid rgba(212,184,150,0.1);
}
.close-modal {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 32px;
    cursor: pointer;
    color: rgba(255,255,255,0.2);
    z-index: 10;
}
.close-modal:hover { color: rgba(212,184,150,0.5); }
.upload-modal-content input,
.upload-modal-content select,
.upload-modal-content textarea {
    width: 100%;
    padding: 12px 16px;
    margin-bottom: 14px;
    border-radius: 40px;
    border: 1px solid rgba(212,184,150,0.1);
    background: rgba(255,255,255,0.03);
    color: #e8e9f0;
    font-size: 0.95rem;
    outline: none;
    transition: 0.3s;
}
.upload-modal-content input:focus,
.upload-modal-content select:focus {
    border-color: rgba(212,184,150,0.3);
    background: rgba(255,255,255,0.05);
}
.upload-modal-content button {
    background: linear-gradient(135deg, #d4b896, #b8a0c8);
    border: none;
    padding: 14px 24px;
    border-radius: 40px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 1rem;
    color: #1a1a2e;
    transition: 0.3s;
}
.upload-modal-content button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.upload-modal-content button:hover:not(:disabled) {
    transform: scale(1.02);
    box-shadow: 0 4px 30px rgba(184,160,200,0.2);
}
.upload-modal-content .promise-box {
    background: rgba(212,184,150,0.05);
    padding: 16px;
    border-radius: 16px;
    margin: 16px 0;
}
.upload-modal-content h3 {
    color: #d4b896;
    margin-bottom: 20px;
    font-size: 1.3rem;
}
.upload-progress {
    display: none;
    margin: 10px 0;
}
.upload-progress .progress-track {
    background: rgba(255,255,255,0.05);
    border-radius: 40px;
    height: 4px;
    overflow: hidden;
}
.upload-progress .progress-bar {
    background: linear-gradient(90deg, #d4b896, #b8a0c8);
    width: 0%;
    height: 100%;
    transition: width 0.3s;
}
.upload-progress .progress-text {
    text-align: center;
    margin-top: 8px;
    color: rgba(212,184,150,0.5);
    font-size: 0.85rem;
}
.contact-note {
    text-align: center;
    margin-top: 12px;
    color: rgba(255,255,255,0.2);
    font-size: 0.8rem;
}
.footer {
    text-align: center;
    font-size: 0.7rem;
    margin-top: 40px;
    color: rgba(255,255,255,0.15);
}
.upload-section { display: none; }
.empty-state {
    text-align: center;
    padding: 40px;
    color: rgba(255,255,255,0.15);
    font-size: 0.95rem;
}
.equalizer.active { display: flex !important; }
.equalizer {
    height: 60px !important;
    gap: 3px !important;
    align-items: center;
    justify-content: center;
}
.eq-bar {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(180deg, #aaffaa 0%, #44dd44 30%, #22aa22 60%, #0a5a0a 100%);
    transition: height 0.06s ease;

}
.rank-card.playing {

    background: rgba(68,221,68,0.08) !important;
    box-shadow: 0 0 20px rgba(68,221,68,0.1) !important;
}
    </style>

// ==================== 播放控制 ====================
let currentSongId = null;
let eqAnimationId = null;
let lyricsTimer = null;

function togglePlay(songId, audioUrl, title, artist) {
    let player = document.getElementById('global-audio');
    if (!player) {
        player = document.createElement('audio');
        player.id = 'global-audio';
        player.style.display = 'none';
        document.body.appendChild(player);
    }
    const playBtn = document.querySelector('.play-btn[data-song-id="' + songId + '"]');
    const eqContainer = document.getElementById('equalizer-' + songId);
    const card = document.querySelector('.rank-card[data-song-id="' + songId + '"]');
    if (currentSongId === songId) {
        if (!player.paused) {
            player.pause();
            stopEqualizer(songId);
            if (playBtn) {
                playBtn.textContent = '▶️ 播放';
                playBtn.classList.remove('playing');
            }
            if (card) card.classList.remove('playing');
            hideLyrics(songId);
            return;
        } else {
            player.play();
            if (playBtn) {
                playBtn.textContent = '⏸ 暂停';
                playBtn.classList.add('playing');
            }
            if (card) card.classList.add('playing');
            startEqualizer(songId);
            showLyrics(songId);
            return;
        }
    }
    if (currentSongId) {
        stopEqualizer(currentSongId);
        const oldBtn = document.querySelector('.play-btn[data-song-id="' + currentSongId + '"]');
        if (oldBtn) {
            oldBtn.textContent = '▶️ 播放';
            oldBtn.classList.remove('playing');
        }
        const oldCard = document.querySelector('.rank-card[data-song-id="' + currentSongId + '"]');
        if (oldCard) oldCard.classList.remove('playing');
        hideLyrics(currentSongId);
    }
    currentSongId = songId;
    player.src = audioUrl;
    player.load();
    player.play();
    if (playBtn) {
        playBtn.textContent = '⏸ 暂停';
        playBtn.classList.add('playing');
    }
    if (card) card.classList.add('playing');
    if (eqContainer) {
        eqContainer.style.display = 'flex';
        eqContainer.classList.add('active');
    }
    startEqualizer(songId);
    showLyrics(songId);
    player.onended = function() {
        stopEqualizer(songId);
        if (playBtn) {
            playBtn.textContent = '▶️ 播放';
            playBtn.classList.remove('playing');
        }
        if (card) card.classList.remove('playing');
        currentSongId = null;
        hideLyrics(songId);
    };
}

function startEqualizer(songId) {
    const bars = document.querySelectorAll('#equalizer-' + songId + ' .eq-bar');
    if (!bars.length) return;
    function animateEqualizer() {
        bars.forEach(function(bar, index) {
            const base = 8 + Math.random() * 35;
            const waveOffset = Math.sin(Date.now() / 300 + index * 0.3) * 5;
            let height = base + waveOffset;
            height = Math.max(4, Math.min(55, height));
            bar.style.height = height + 'px';
        });
        eqAnimationId = requestAnimationFrame(animateEqualizer);
    }
    if (eqAnimationId) cancelAnimationFrame(eqAnimationId);
    animateEqualizer();
}

function stopEqualizer(songId) {
    if (eqAnimationId) {
        cancelAnimationFrame(eqAnimationId);
        eqAnimationId = null;
    }
    const eqContainer = document.getElementById('equalizer-' + songId);
    if (eqContainer) {
        eqContainer.style.display = 'none';
        eqContainer.classList.remove('active');
    }
    const bars = document.querySelectorAll('#equalizer-' + songId + ' .eq-bar');
    bars.forEach(function(bar) {
        bar.style.height = (8 + Math.random() * 12) + 'px';
    });
}

function parseLyricsWithTimestamps(text) {
    const lines = text.split('\n').filter(line => line.trim() !== '');
    const result = [];
    const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
    for (const line of lines) {
        const match = line.match(regex);
        if (match) {
            const mins = parseInt(match[1]);
            const secs = parseInt(match[2]);
            const millis = parseInt(match[3]);
            const time = mins * 60 + secs + millis / 1000;
            const text = match[4].trim();
            result.push({ time, text });
        } else {
            result.push({ time: 999999, text: line.trim() });
        }
    }
    return result;
}

function showLyrics(songId) {
    document.querySelectorAll('[id^="lyricsDisplay-"]').forEach(el => {
        if (el.id !== 'lyricsDisplay-' + songId) {
            el.style.display = 'none';
        }
    });
    if (lyricsTimer) {
        clearInterval(lyricsTimer);
        lyricsTimer = null;
    }
    let song = null;
    for (let cat of ['ai', 'hybrid', 'original']) {
        const found = allSongs[cat]?.find(s => s.id === songId);
        if (found) { song = found; break; }
    }
    if (!song) return;
    const display = document.getElementById('lyricsDisplay-' + songId);
    const lineEl = document.getElementById('lyricsLine-' + songId);
    if (!display || !lineEl) return;
    const lyrics = song.lyrics || '纯音乐（无歌词）';
    const lines = parseLyricsWithTimestamps(lyrics);
    display.style.display = 'block';
    if (lines.length === 0 || lines[0].time === undefined || lines[0].time === 999999) {
        lineEl.textContent = lyrics;
        return;
    }
    const audio = document.getElementById('global-audio');
    if (!audio) { lineEl.textContent = ' 加载中...'; return; }
    let currentIndex = 0;
    const currentTime = audio.currentTime || 0;
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].time <= currentTime) {
            currentIndex = i;
        }
    }
    lineEl.textContent = lines[currentIndex]?.text || '';
    lyricsTimer = setInterval(() => {
        if (!audio || audio.paused || audio.ended) return;
        const ct = audio.currentTime;
        let newIndex = currentIndex;
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].time <= ct) {
                newIndex = i;
            }
        }
        if (newIndex !== currentIndex) {
            currentIndex = newIndex;
            lineEl.textContent = lines[currentIndex]?.text || '';
            lineEl.style.opacity = '0.3';
            setTimeout(() => { lineEl.style.opacity = '1'; }, 30);
        }
    }, 200);
}

function hideLyrics(songId) {
    const display = document.getElementById('lyricsDisplay-' + songId);
    if (display) display.style.display = 'none';
    if (lyricsTimer) {
        clearInterval(lyricsTimer);
        lyricsTimer = null;
    }
}

async function handleUpload(container, modal) {
    if (!container) {
        alert('页面加载异常，请刷新重试');
        return;
    }
    const submitBtn = container.querySelector('#submitBtn');
    if (!submitBtn) {
        alert('页面加载异常，请刷新重试');
        return;
    }

    // ===== 排行榜作品数据 =====
    const category = container.querySelector('#category')?.value || 'ai';
    const artist = container.querySelector('#artistName')?.value?.trim() || '';
    const title = container.querySelector('#songTitle')?.value?.trim() || '';
    const audioFile = container.querySelector('#audioFile')?.files?.[0];
    const genre = container.querySelector('#genre')?.value?.trim() || '';
    const contactInfo = container.querySelector('#contactInfo')?.value?.trim() || '';
    const isDemoChecked = container.querySelector('#isDemo')?.checked || false;
    const promiseChecked = container.querySelector('#promise')?.checked || false;

    // ===== 入驻信息 =====
    const alsoJoin = container.querySelector('#alsoJoin')?.checked || false;
    const joinName = container.querySelector('#joinName')?.value?.trim() || '';
    const joinRole = container.querySelector('#joinRole')?.value || '歌手';
    const joinBio = container.querySelector('#joinBio')?.value?.trim() || '';
    const joinWorkTitle = container.querySelector('#joinWorkTitle')?.value?.trim() || '';
    const joinAudioFile = container.querySelector('#joinAudioFile')?.files?.[0];
    const joinLyrics = container.querySelector('#joinLyrics')?.value?.trim() || '纯音乐';

    // ===== 校验 =====
    if (!artist) { alert('请填写艺名'); return; }
    if (!title) { alert('请填写歌名'); return; }
    if (!audioFile) { alert('请选择音频文件'); return; }
    if (!promiseChecked) { alert('请勾选承诺书'); return; }
    if ((category === 'hybrid' || category === 'original') && !contactInfo) {
        alert('人机共创榜 / 原创作品榜 必须填写联系方式');
        return;
    }

    const progressDiv = container.querySelector('#uploadProgress');
    const progressBar = container.querySelector('#progressBar');
    const progressText = container.querySelector('#progressText');
    const originalText = submitBtn.textContent;

    if (progressDiv) progressDiv.style.display = 'block';
    if (progressBar) progressBar.style.width = '0%';
    if (progressText) progressText.textContent = '⏳ 准备上传...';
    submitBtn.textContent = '⏳ 上传中...';
    submitBtn.disabled = true;
    submitBtn.style.opacity = '0.6';

    let musicianId = null;
    let joinAudioUrl = null;

    try {
        const client = await ensureSupabase();
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

        // ===== 1. 上传排行榜音频 =====
        if (progressBar) progressBar.style.width = '20%';
        if (progressText) progressText.textContent = '⏳ 正在上传音频... 20%';
        const fileExt = audioFile.name.split('.').pop();
        const fileName = Date.now() + '_' + Math.random().toString(36).substring(2, 8) + '.' + fileExt;
        const { error: uploadError } = await client.storage.from('audio').upload(fileName, audioFile);
        if (uploadError) {
            alert('音频上传失败: ' + uploadError.message);
            resetBtn();
            return;
        }
        const { data: publicUrlData } = client.storage.from('audio').getPublicUrl(fileName);
        const audioUrl = publicUrlData.publicUrl;

        // ===== 2. 写入排行榜 songs 表 =====
        if (progressBar) progressBar.style.width = '40%';
        if (progressText) progressText.textContent = '⏳ 正在保存作品... 40%';
        const newSong = {
            id: Date.now().toString() + '_' + Math.random().toString(36).substring(2, 6),
            category: category,
            title: title,
            artist: artist,
            genre: genre || '未分类',
            audio_url: audioUrl,
            contact: contactInfo || '',
            is_demo: isDemoChecked,
            likes: 0,
            status: 'pending',
            melody_by: container.querySelector('#melodyBy')?.value || '',
            lyrics_by: container.querySelector('#lyricsBy')?.value || '',
            arrangement_by: container.querySelector('#arrangementBy')?.value || '',
            lyrics: container.querySelector('#lyricsInput')?.value?.trim() || '纯音乐'
        };
        const { error: insertError } = await client.from('songs').insert([newSong]);
        if (insertError) {
            alert('提交失败: ' + insertError.message);
            resetBtn();
            return;
        }
// ===== 3. 如果勾选了入驻 =====
        if (alsoJoin) {
            if (!joinName) {
                alert('请填写艺名（入驻信息）');
                resetBtn();
                return;
            }
            if (!currentUser) {
                alert('请先登录');
                resetBtn();
                return;
            }

            if (progressBar) progressBar.style.width = '60%';
            if (progressText) progressText.textContent = '⏳ 正在提交入驻... 60%';

            musicianId = Date.now().toString() + Math.floor(Math.random() * 1000).toString().padStart(3, '0');

            // 上传入驻作品音频（抄 musician-center.html）
            if (joinAudioFile) {
                try {
                    const fileExt = joinAudioFile.name.split('.').pop();
                    const fileName = `${Date.now()}_${musicianId}.${fileExt}`;
                    const uploadResp = await fetch(
                        `${SUPABASE_URL}/storage/v1/object/audios/${fileName}`,
                        {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': joinAudioFile.type
                            },
                            body: joinAudioFile
                        }
                    );
                    if (uploadResp.ok) {
                        joinAudioUrl = `${SUPABASE_URL}/storage/v1/object/public/audios/${fileName}`;
                        console.log('✅ 入驻作品音频上传成功:', joinAudioUrl);
                    } else {
                        console.warn('入驻作品音频上传失败');
                    }
                } catch (e) {
                    console.warn('入驻作品音频上传异常:', e);
                }
            }

            // ===== 4. 写入 musicians 表 =====
            const musicianData = {
                id: musicianId,
                name: joinName,
                role: joinRole,
                bio: joinBio || '',
                status: 'pending',
                user_id: currentUser.id
            };
            const { error: musicianError } = await client.from('musicians').insert([musicianData]);
            if (musicianError) {
                console.error('入驻申请失败:', musicianError);
                alert('⚠️ 作品已提交，但入驻申请失败，请联系管理员');
            }

            // ===== 5. 写入 works 表（入驻作品） =====
            if (joinAudioFile && joinWorkTitle) {
                const workData = {
                    id: Date.now().toString() + Math.floor(Math.random() * 1000).toString().padStart(3, '0'),
                    musician_id: musicianId,
                    title: joinWorkTitle,
                    audio_url: joinAudioUrl,
                    lyrics: joinLyrics,
                    likes: 0,
                    status: 'pending'
                };
                const { error: workError } = await client.from('works').insert([workData]);
                if (workError) {
                    console.error('入驻作品写入失败:', workError);
                    alert('⚠️ 入驻申请已提交，但作品写入失败，请联系管理员');
                } else {
                    console.log('✅ 入驻作品写入成功');
                }
            }
        }

        if (progressBar) progressBar.style.width = '100%';
        if (progressText) {
            progressText.textContent = '✅ 提交成功！';
            progressText.style.color = '#4CAF50';
        }
        await new Promise(resolve => setTimeout(resolve, 500));

        let msg = '✅ 作品已提交！审核通过后将在排行榜展示。\n\n 作品名称：' + title + '\n 艺名：' + artist;
        // 入驻成功后显示 ID
        if (alsoJoin && musicianId) {
            const userInput = prompt(
                '✅ 入驻申请已提交！\n\n' +
                ' 你的音乐人 ID（请复制保存，用于登录个人中心）：\n' +
                musicianId + '\n\n' +
                ' 请妥善保管此 ID！\n\n' +
                '点击「确定」复制 ID'
            );
            if (userInput !== null) {
                // 用户点击了确定，把 ID 复制到剪贴板
                navigator.clipboard.writeText(musicianId).then(() => {
                    alert('✅ 已复制音乐人 ID 到剪贴板！\n\n请妥善保管');
                }).catch(() => {
                    alert('⚠️ 无法自动复制，请手动复制上面的 ID');
                });
            }
        }

        // 清空表单
        container.querySelector('#artistName').value = '';
        container.querySelector('#songTitle').value = '';
        container.querySelector('#genre').value = '';
        container.querySelector('#audioFile').value = '';
        container.querySelector('#contactInfo').value = '';
        container.querySelector('#isDemo').checked = false;
        container.querySelector('#alsoJoin').checked = false;
        const joinFields = container.querySelector('#joinFields');
        if (joinFields) joinFields.style.display = 'none';
        container.querySelector('#joinName').value = '';
        container.querySelector('#joinBio').value = '';
        container.querySelector('#joinWorkTitle').value = '';
        container.querySelector('#joinAudioFile').value = '';
        container.querySelector('#joinLyrics').value = '';
        container.querySelector('#promise').checked = false;

        modal.classList.remove('active');
        resetBtn();
        await loadSongs();

    } catch (error) {
        console.error('上传失败:', error);
        alert('上传失败，请检查网络后重试');
        resetBtn();
    }

    function resetBtn() {
        submitBtn.textContent = originalText || '✨ 提交审核 ✨';
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        if (progressDiv) {
            setTimeout(() => {
                progressDiv.style.display = 'none';
                if (progressBar) progressBar.style.width = '0%';
                if (progressText) {
                    progressText.textContent = '⏳ 正在上传音频...';
                    progressText.style.color = '#FFD966';
                }
            }, 2000);
        }
    }
}

// ==================== 弹窗逻辑 ====================
function setupModalForm(modal) {
    const originalForm = document.getElementById('originalForm');
    const modalFormContainer = document.getElementById('modalUploadForm');
    if (!originalForm || !modalFormContainer) {
        console.error('找不到表单元素');
        return;
    }
    const clone = originalForm.cloneNode(true);
    clone.style.display = 'block';
    modalFormContainer.innerHTML = '';
    modalFormContainer.appendChild(clone);

    // 勾选展开入驻信息
    const alsoJoin = clone.querySelector('#alsoJoin');
    const joinFields = clone.querySelector('#joinFields');
    if (alsoJoin && joinFields) {
        alsoJoin.onchange = function() {
            joinFields.style.display = this.checked ? 'block' : 'none';
        };
    }

    const categorySelect = clone.querySelector('#category');
    const hybridFields = clone.querySelector('#hybridFields');
    if (categorySelect && hybridFields) {
        categorySelect.onchange = function() {
            hybridFields.style.display = (this.value === 'hybrid' || this.value === 'original') ? 'block' : 'none';
        };
        hybridFields.style.display = (categorySelect.value === 'hybrid' || categorySelect.value === 'original') ? 'block' : 'none';
    }
    const submitBtn = clone.querySelector('#submitBtn');
    if (submitBtn) {
        submitBtn.onclick = function(e) {
            e.preventDefault();
            handleUpload(clone, modal);
        };
    }
}

function initFloatingButton() {
    const floatingBtn = document.getElementById('floatingUploadBtn');
    const modal = document.getElementById('uploadModal');
    const closeBtn = document.getElementById('closeModalBtn');
    if (!floatingBtn || !modal) {
        console.error('找不到悬浮按钮或弹窗');
        return;
    }
    floatingBtn.onclick = function() {
        modal.classList.add('active');
        setupModalForm(modal);
    };
    if (closeBtn) {
        closeBtn.onclick = function() {
            modal.classList.remove('active');
        };
    }
    modal.onclick = function(e) {
        if (e.target === modal) {
            modal.classList.remove('active');
        }
    };
}

// ==================== 启动 ====================
(async function init() {
    try {
        await initSupabase();
        await loadSongs();
        initFloatingButton();
        console.log('✅ 页面初始化完成');
    } catch (error) {
        console.error('❌ 初始化失败:', error);
    }
})();
</script>
</body>
</html>
