* { margin: 0; padding: 0; box-sizing: border-box; }

}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #050505 0%, #0a0a0a 12%, #111111 24%, #1a1a1a 36%, #1a1a3a 46%, #4a4a8a 52%, #6a5a9a 56%, #4a4a8a 60%, #1a1a3a 66%, #1a1a1a 74%, #2a2a2a 82%, #4a4a4a 88%, #2a2a2a 94%, #1a1a1a 100%);
    background-size: 600% 600%;
    color: #e8e9f0;
    padding: 20px 20px 100px;
    animation: bodyGradientFlow 14s ease-in-out infinite alternate;
    min-height: 100vh;
}
@keyframes bodyGradientFlow {
    0% { background-position: 0% 50%; }
    14% { background-position: 14% 50%; }
    28% { background-position: 28% 50%; }
    42% { background-position: 42% 50%; }
    57% { background-position: 57% 50%; }
    71% { background-position: 71% 50%; }
    85% { background-position: 85% 50%; }
    100% { background-position: 100% 50%; }
}
.container { max-width: 1000px; margin: 0 auto; }
.hero {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(200,180,230,0.12) 25%, rgba(160,140,210,0.15) 45%, rgba(120,100,190,0.12) 60%, rgba(160,140,210,0.15) 75%, rgba(200,180,230,0.12) 85%, rgba(255,255,255,0.08) 100%);

    border-radius: 48px;
    margin-bottom: 30px;
    border: 1px solid rgba(200,180,230,0.15);

}
@keyframes heroCardFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}
.hero h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, #d4b896, #f0e0c8, #b8a0c8, #d4b896);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: heroTitleFlow 6s ease-in-out infinite alternate;
}
@keyframes heroTitleFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}
.hero p {
    margin-top: 8px;
    opacity: 0.5;
    color: #d4b896;
    letter-spacing: 1px;
    font-size: 0.9rem;
}
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.tab-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.15);
    padding: 10px 16px;
    border-radius: 40px;
    cursor: pointer;
    text-align: center;
    flex: 1;
    transition: 0.3s;
    font-weight: 500;
    color: rgba(255,255,255,0.4);

}
.tab-btn:hover { border-color: rgba(212,184,150,0.3); color: rgba(255,255,255,0.7); }
.tab-btn.active {
    background: linear-gradient(135deg, rgba(212,184,150,0.2), rgba(184,160,200,0.2));
    color: #d4b896;

}
.tab-content { display: none; }

/* ===== 卡片基础 ===== */
.rank-card {
    position: relative;
    background: linear-gradient(135deg, rgba(212,184,150,0.10) 0%, rgba(245,230,200,0.06) 8%, rgba(26,58,42,0.20) 25%, rgba(10,30,20,0.30) 40%, rgba(0,0,0,0.35) 50%, rgba(10,30,20,0.30) 60%, rgba(26,58,42,0.20) 75%, rgba(245,230,200,0.06) 88%, rgba(212,184,150,0.10) 94%, rgba(160,140,210,0.12) 100%);
    background-size: 500% 500%;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(212,184,150,0.08);
    transition: 0.4s;
    overflow: hidden;
    animation: cardGradientFlow 10s ease-in-out infinite alternate;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
@keyframes cardGradientFlow {
    0% { background-position: 0% 50%; }
    20% { background-position: 20% 50%; }
    40% { background-position: 40% 50%; }
    60% { background-position: 60% 50%; }
    80% { background-position: 80% 50%; }
    100% { background-position: 100% 50%; }
}

/* ===== 紫红光晕爆发（悬停） ===== */
.rank-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(
        circle at 80% 10%,
        rgba(200, 140, 255, 0.18) 0%,
        rgba(235, 80, 205, 0.16) 18%,
        rgba(180, 140, 220, 0.10) 35%,
        rgba(100, 230, 180, 0.12) 55%,
        rgba(220, 240, 250, 0.06) 75%,
        transparent 100%
    );
    pointer-events: none;
    z-index: 0;
    border-radius: 20px;
    transition: 0.8s ease;
}
.rank-card:hover::before {
    background: radial-gradient(
        circle at 80% 10%,
        rgba(215, 155, 255, 0.42) 0%,
        rgba(250, 110, 220, 0.38) 20%,
        rgba(195, 155, 235, 0.22) 38%,
        rgba(130, 240, 195, 0.22) 58%,
        rgba(235, 248, 255, 0.14) 78%,
        rgba(255, 255, 255, 0.06) 100%
    );
}

/* ===== 流光扫过 ===== */
.rank-card .shimmer {
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
    transform: skewX(-25deg);
    transition: 0.8s;
    pointer-events: none;
    z-index: 1;
}
.rank-card:hover .shimmer { left: 150%; }

/* ===== 粒子飘落 ===== */
.rank-card .particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(200, 150, 255, 0.5);
    box-shadow: 0 0 8px rgba(200, 150, 255, 0.3);
    pointer-events: none;
    z-index: 1;
    animation: particleFall 6s linear infinite, colorCycle 4s ease-in-out infinite alternate;
}
@keyframes colorCycle {
    0% { background: rgba(200, 150, 255, 0.6); box-shadow: 0 0 8px rgba(200, 150, 255, 0.4); }
    33% { background: rgba(140, 220, 200, 0.5); box-shadow: 0 0 8px rgba(140, 220, 200, 0.3); }
    66% { background: rgba(255, 200, 150, 0.5); box-shadow: 0 0 8px rgba(255, 200, 150, 0.3); }
    100% { background: rgba(200, 150, 255, 0.6); box-shadow: 0 0 8px rgba(200, 150, 255, 0.4); }
}
.rank-card .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
.rank-card .particle:nth-child(2) { left: 25%; animation-delay: 1.2s; }
.rank-card .particle:nth-child(3) { left: 40%; animation-delay: 2.4s; }
.rank-card .particle:nth-child(4) { left: 55%; animation-delay: 3.6s; }
.rank-card .particle:nth-child(5) { left: 70%; animation-delay: 4.8s; }
.rank-card .particle:nth-child(6) { left: 85%; animation-delay: 1.8s; }
.rank-card .particle:nth-child(7) { left: 15%; animation-delay: 3.0s; }
.rank-card .particle:nth-child(8) { left: 65%; animation-delay: 0.6s; }
@keyframes particleFall {
    0% { top: -10%; opacity: 0; transform: translateX(0); }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { top: 110%; opacity: 0; transform: translateX(30px); }
}

/* ===== 金色折角 ===== */
.rank-card::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 0 150px 150px;
    border-color: transparent transparent rgba(160,120,220,0.06) transparent;
    pointer-events: none;
    z-index: 2;
    transition: 0.5s ease;
}
.rank-card:hover::after {
    border-color: transparent transparent #b8a0d0 transparent;
    opacity: 0.35;
    filter: drop-shadow(0 0 35px rgba(160,120,220,0.25));
}

/* ===== 音符装饰 ===== */
.rank-note {
    position: absolute;
    bottom: 8px;
    right: 14px;
    font-size: 3rem;
    color: rgba(255, 255, 255, 0.04);
    pointer-events: none;
    z-index: 1;
    transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    font-family: serif;
    user-select: none;
}
.rank-card:hover .rank-note {
    background: linear-gradient(135deg, rgba(200,140,255,0.8), rgba(230,100,200,0.6), rgba(180,140,220,0.4));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transform: rotate(12deg) scale(1.4);
    filter: drop-shadow(0 0 40px rgba(180,140,255,0.2)) drop-shadow(0 0 80px rgba(200,150,255,0.05));
    animation: notePulse 2s ease-in-out infinite;
}
@keyframes notePulse {
    0%, 100% { transform: rotate(12deg) scale(1.4); opacity: 1; }
    50% { transform: rotate(12deg) scale(1.5); opacity: 0.8; }
}

.rank-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    font-size: 1.4rem;
    font-weight: 700;
    background: radial-gradient(circle at 40% 40%, #e8e8e8 0%, #b8b8b8 20%, #666666 40%, #222222 55%, #666666 70%, #b8b8b8 85%, #e8e8e8 100%);
    border-radius: 50%;
    border: 2px solid rgba(212, 184, 150, 0.2);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.4), 0 0 40px rgba(212,184,150,0.04);
    transition: 0.4s;
    flex-shrink: 0;
    margin-right: 14px;
    position: relative;
    animation: cdSpin 8s linear infinite;
}
.rank-number .num {
    background: linear-gradient(135deg, #f5e6c8, #d4b896, #f5e6c8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
    text-shadow: 0 0 20px rgba(212,184,150,0.1);
}
.rank-number::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 35% 30%, rgba(255,255,255,0.15) 0%, transparent 50%);
    pointer-events: none;
}
.rank-number::after {
    content: '';
    position: absolute;
    inset: 50%;
    width: 8px;
    height: 8px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,0,0,0.6), rgba(255,255,255,0.1));
    border: 1px solid rgba(255,255,255,0.05);
    pointer-events: none;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
}
.rank-card:hover .rank-number {
    border-color: rgba(212, 184, 150, 0.35);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.4), 0 0 60px rgba(212,184,150,0.08);
}
@keyframes cdSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ===== TOP 3 奖牌 ===== */
.rank-medal {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 1.6rem;
    z-index: 3;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    animation: medalPulse 2s ease-in-out infinite;
}
@keyframes medalPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

.song-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 8px 0 4px;
    background: linear-gradient(90deg, #d4b896 0%, #f0e0c8 25%, #b8a0c8 50%, #f0e0c8 75%, #d4b896 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: titleFlow 6s ease-in-out infinite alternate;
}
@keyframes titleFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}
.song-artist {
    color: rgba(255,255,255,0.4);
    font-size: 0.9rem;
}
.song-artist span { color: rgba(212,184,150,0.5); }
.demo-badge {
    background: linear-gradient(135deg, rgba(212,184,150,0.2), rgba(184,160,200,0.2));
    color: #d4b896;
    font-size: 0.6rem;
    padding: 2px 12px;
    border-radius: 20px;
    display: inline-block;
    margin-left: 8px;
    font-weight: 600;
    border: 1px solid rgba(212,184,150,0.15);
    vertical-align: middle;
}
.action-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.15);
    padding: 6px 18px;
    border-radius: 40px;
    cursor: pointer;
    margin-right: 10px;
    color: rgba(255,255,255,0.4);
    font-weight: 400;
    transition: 0.3s;
    font-size: 0.85rem;
}
.action-btn:hover {
    background: rgba(212,184,150,0.1);
    border-color: rgba(212,184,150,0.3);
    color: #d4b896;
}

/* ===== 底部播放器 ===== */
audio {
    width: 100%;
    margin: 10px 0;
    border-radius: 30px;
    background: rgba(255,255,255,0.03);
}
audio::-webkit-media-controls-panel {
    background: rgba(26,26,46,0.6);
}

.floating-upload-btn {
    position: fixed;
    bottom: 30px;
    right: 20px;
    background: linear-gradient(135deg, #d4b896, #b8a0c8);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 30px rgba(184,160,200,0.3);
    z-index: 999;
    transition: 0.3s;
}
.floating-upload-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 50px rgba(184,160,200,0.4);
}
.floating-upload-btn span {
    font-size: 32px;
    font-weight: 300;
    color: #1a1a2e;
}

.upload-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}
.upload-modal.active { display: flex; }
.upload-modal-content {
    background: linear-gradient(145deg, #1a1a2e, #2a2a4a);
    max-width: 500px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 28px;
    padding: 24px;
    border: 1px solid rgba(212,184,150,0.1);
}
.close-modal {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 32px;
    cursor: pointer;
    color: rgba(255,255,255,0.2);
    z-index: 10;
}
.close-modal:hover { color: rgba(212,184,150,0.5); }
.upload-modal-content input,
.upload-modal-content select,
.upload-modal-content textarea {
    width: 100%;
    padding: 12px 16px;
    margin-bottom: 14px;
    border-radius: 40px;
    border: 1px solid rgba(212,184,150,0.1);
    background: rgba(255,255,255,0.03);
    color: #e8e9f0;
    font-size: 0.95rem;
    outline: none;
    transition: 0.3s;
}
.upload-modal-content input:focus,
.upload-modal-content select:focus {
    border-color: rgba(212,184,150,0.3);
    background: rgba(255,255,255,0.05);
}
.upload-modal-content button {
    background: linear-gradient(135deg, #d4b896, #b8a0c8);
    border: none;
    padding: 14px 24px;
    border-radius: 40px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 1rem;
    color: #1a1a2e;
    transition: 0.3s;
}
.upload-modal-content button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.upload-modal-content button:hover:not(:disabled) {
    transform: scale(1.02);
    box-shadow: 0 4px 30px rgba(184,160,200,0.2);
}
.upload-modal-content .promise-box {
    background: rgba(212,184,150,0.05);
    padding: 16px;
    border-radius: 16px;
    margin: 16px 0;
}
.upload-modal-content h3 {
    color: #d4b896;
    margin-bottom: 20px;
    font-size: 1.3rem;
}
.upload-progress {
    display: none;
    margin: 10px 0;
}
.upload-progress .progress-track {
    background: rgba(255,255,255,0.05);
    border-radius: 40px;
    height: 4px;
    overflow: hidden;
}
.upload-progress .progress-bar {
    background: linear-gradient(90deg, #d4b896, #b8a0c8);
    width: 0%;
    height: 100%;
    transition: width 0.3s;
}
.upload-progress .progress-text {
    text-align: center;
    margin-top: 8px;
    color: rgba(212,184,150,0.5);
    font-size: 0.85rem;
}
.contact-note {
    text-align: center;
    margin-top: 12px;
    color: rgba(255,255,255,0.2);
    font-size: 0.8rem;
}
.footer {
    text-align: center;
    font-size: 0.7rem;
    margin-top: 40px;
    color: rgba(255,255,255,0.15);
}
.upload-section { display: none; }
.empty-state {
    text-align: center;
    padding: 40px;
    color: rgba(255,255,255,0.15);
    font-size: 0.95rem;
}
.equalizer.active { display: flex !important; }
.equalizer {
    height: 60px !important;
    gap: 3px !important;
    align-items: center;
    justify-content: center;
}
.eq-bar {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(180deg, #aaffaa 0%, #44dd44 30%, #22aa22 60%, #0a5a0a 100%);
    transition: height 0.06s ease;
    min-height: 3px;
    max-height: 55px;
    box-shadow: 0 0 15px rgba(68,221,68,0.25);
}
.rank-card.playing {
    border-color: rgba(68,221,68,0.3) !important;
    box-shadow: 0 0 60px rgba(68,221,68,0.06), 0 8px 40px rgba(0,0,0,0.3) !important;

    background: rgba(68,221,68,0.08) !important;
    box-shadow: 0 0 20px rgba(68,221,68,0.1) !important;
}

/* ===== 分享弹窗 ===== */

    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
    z-index: 1001;
    justify-content: center;
    align-items: center;
}
.modal-overlay.show {
    display: flex;
}
.modal-overlay .modal {
    background: linear-gradient(145deg, #1a1a2e, #2a2a4a);
    max-width: 420px;
    width: 92%;
    border-radius: 28px;
    padding: 28px 24px 24px;
    border: 1px solid rgba(212,184,150,0.1);
    position: relative;
    max-height: 90vh;
    overflow-y: auto;

.modal-overlay .modal h3 {
    color: #d4b896;
    margin-bottom: 4px;
    font-size: 1.2rem;
}
.modal-overlay .modal p {
    color: rgba(255,255,255,0.1);
    font-size: 0.8rem;
}
#qrCodeContainer {
    background: white;
    padding: 12px;
    border-radius: 12px;
    display: inline-block;
}
#qrCodeContainer canvas {
    display: block;
}
/* ===== Toast 动画 ===== */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

/* ===== 手机端优化 ===== */
@media (max-width: 480px) {
    .modal-overlay .modal {
        padding: 20px 16px 20px;
        width: 94%;
        border-radius: 20px;
    }
    .modal-overlay .modal h3 {
        font-size: 1rem;
    }
    #qrCodeContainer canvas {
        width: 140px !important;
        height: 140px !important;
    }
    .modal-overlay .modal button {
        font-size: 0.7rem !important;
        padding: 8px 12px !important;
    }
}

/* ===== 搜索框样式 ===== */
.search-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.1);
    border-radius: 40px;
    padding: 12px 20px;

let supabaseClient = null;
let isSupabaseReady = false;

function initSupabase() {
    return new Promise((resolve, reject) => {
        if (isSupabaseReady && supabaseClient) {
            resolve(supabaseClient);
            return;
        }
        if (typeof supabase !== 'undefined' && supabase.createClient) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            isSupabaseReady = true;
            resolve(supabaseClient);
            return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        script.onload = function() {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                isSupabaseReady = true;
                resolve(supabaseClient);
            } else {
                reject(new Error('Supabase 加载失败'));
            }
        };
        script.onerror = function() { reject(new Error('Supabase CDN 加载失败')); };
        document.head.appendChild(script);
    });
}

async function ensureSupabase() {
    if (isSupabaseReady && supabaseClient) return supabaseClient;
    return await initSupabase();
}

async function loadSongs(retryCount = 0) {
    try {

                    .from('songs')

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function renderAll() {
    // ===== 批量查询关注状态和粉丝数（从 lwmusic 抄） =====
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    let followedMap = {};
    let followerCountMap = {};

    // 收集所有歌曲的 artist
    let allArtists = [];
    for (let cat of ['ai', 'hybrid', 'original']) {
        const songs = getFilteredSongs(cat);
        songs.forEach(s => {
            if (s.artist && !allArtists.includes(s.artist)) {
                allArtists.push(s.artist);
            }
        });
    }

    // 异步查询数据库
    (async () => {
        // 查当前用户关注了哪些参赛选手
        if (user.user_id && allArtists.length > 0) {
            try {
                const client = await ensureSupabase();
                const artistIds = allArtists.map(a => 'artist_' + a);
                const { data: follows } = await client
                    .from('follows')
                    .select('following_id')
                    .eq('follower_id', user.user_id)
                    .in('following_id', artistIds);
                if (follows) {
                    follows.forEach(f => { followedMap[f.following_id] = true; });
                }
            } catch (e) {
                console.warn('获取关注状态失败:', e);
            }
        }

        // 查每个参赛选手的粉丝数
        if (allArtists.length > 0) {
            try {
                const client = await ensureSupabase();
                const artistIds = allArtists.map(a => 'artist_' + a);
                const { data: allFollows } = await client
                    .from('follows')
                    .select('following_id')
                    .in('following_id', artistIds);
                if (allFollows) {
                    allFollows.forEach(f => {
                        followerCountMap[f.following_id] = (followerCountMap[f.following_id] || 0) + 1;
                    });
                }
            } catch (e) {
                console.warn('获取粉丝数失败:', e);
            }

        // 渲染卡片
        renderCardsWithFollow(followedMap, followerCountMap);
    })();

window.likeSong = async (id, cat) => {
    const song = allSongs[cat]?.find(s => s.id === id);
    if (!song) return;
    let userId = localStorage.getItem('userId');
    if (!userId) {
        userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
        localStorage.setItem('userId', userId);
    }
    try {
        const client = await ensureSupabase();
        const { data: existing } = await client
            .from('likes')
            .select('*')
            .eq('work_id', id)
            .eq('user_id', userId);
        if (existing && existing.length > 0) {
            alert('⏰ 你已经点过赞啦！每首歌只能点赞一次哦~');
            return;
        }
        await client.from('likes').insert([{ user_id: userId, work_id: id }]);
        const newLikes = (song.likes || 0) + 1;
        await client.from('songs').update({ likes: newLikes }).eq('id', id);
        song.likes = newLikes;
        renderAll();
    } catch (e) {
        console.error('点赞失败:', e);
        alert('点赞失败，请稍后重试');
    }
};

// ==================== 播放控制 ====================
let currentSongId = null;
let eqAnimationId = null;
let lyricsTimer = null;

function togglePlay(songId, audioUrl, title, artist, musicianId) {
    // 🆕 增加播放量（每次播放都加1）
    incrementPlays(songId);
    
    let player = document.getElementById('global-audio');
    if (!player) {
        player = document.createElement('audio');
        player.id = 'global-audio';
        player.style.display = 'none';
        document.body.appendChild(player);
    }
    const playBtn = document.querySelector('.play-btn[data-song-id="' + songId + '"]');
    const eqContainer = document.getElementById('equalizer-' + songId);
    const card = document.querySelector('.rank-card[data-song-id="' + songId + '"]');
    if (currentSongId === songId) {
        if (!player.paused) {
            player.pause();
            stopEqualizer(songId);
            if (playBtn) {
                playBtn.textContent = '▶️ 播放';
                playBtn.classList.remove('playing');
            }
            if (card) card.classList.remove('playing');
            hideLyrics(songId);
            return;
        } else {
            player.play();
            if (playBtn) {
                playBtn.textContent = '⏸ 暂停';
                playBtn.classList.add('playing');
            }
            if (card) card.classList.add('playing');
            startEqualizer(songId);
            showLyrics(songId);
            return;
        }
    }
    if (currentSongId) {
        stopEqualizer(currentSongId);
        const oldBtn = document.querySelector('.play-btn[data-song-id="' + currentSongId + '"]');
        if (oldBtn) {
            oldBtn.textContent = '▶️ 播放';
            oldBtn.classList.remove('playing');
        }
        const oldCard = document.querySelector('.rank-card[data-song-id="' + currentSongId + '"]');
        if (oldCard) oldCard.classList.remove('playing');
        hideLyrics(currentSongId);
    }
    currentSongId = songId;
    player.src = audioUrl;
    player.load();
    player.play();
    if (playBtn) {
        playBtn.textContent = '⏸ 暂停';
        playBtn.classList.add('playing');
    }
    if (card) card.classList.add('playing');
    if (eqContainer) {
        eqContainer.style.display = 'flex';
        eqContainer.classList.add('active');
    }
    startEqualizer(songId);
    showLyrics(songId);
    player.onended = function() {
        stopEqualizer(songId);
        if (playBtn) {
            playBtn.textContent = '▶️ 播放';
            playBtn.classList.remove('playing');
        }
        if (card) card.classList.remove('playing');
        currentSongId = null;
        hideLyrics(songId);
        // 🆕 自动播下一首（根据播放模式）
        const next = getNextSong(songId);
        if (next) {
            togglePlay(next.id, next.audio_url, next.title, next.artist, next.musician_id);
        }
    };
}

function startEqualizer(songId) {
    const bars = document.querySelectorAll('#equalizer-' + songId + ' .eq-bar');
    if (!bars.length) return;
    function animateEqualizer() {
        bars.forEach(function(bar, index) {
            const base = 8 + Math.random() * 35;
            const waveOffset = Math.sin(Date.now() / 300 + index * 0.3) * 5;
            let height = base + waveOffset;
            height = Math.max(4, Math.min(55, height));
            bar.style.height = height + 'px';
        });
        eqAnimationId = requestAnimationFrame(animateEqualizer);
    }
    if (eqAnimationId) cancelAnimationFrame(eqAnimationId);
    animateEqualizer();
}

function stopEqualizer(songId) {
    if (eqAnimationId) {
        cancelAnimationFrame(eqAnimationId);
        eqAnimationId = null;
    }
    const eqContainer = document.getElementById('equalizer-' + songId);
    if (eqContainer) {
        eqContainer.style.display = 'none';
        eqContainer.classList.remove('active');
    }
    const bars = document.querySelectorAll('#equalizer-' + songId + ' .eq-bar');
    bars.forEach(function(bar) {
        bar.style.height = (8 + Math.random() * 12) + 'px';
    });
}

function parseLyricsWithTimestamps(text) {
    const lines = text.split('\n').filter(line => line.trim() !== '');
    const result = [];
    const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
    for (const line of lines) {
        const match = line.match(regex);
        if (match) {
            const mins = parseInt(match[1]);
            const secs = parseInt(match[2]);
            const millis = parseInt(match[3]);
            const time = mins * 60 + secs + millis / 1000;
            const text = match[4].trim();
            result.push({ time, text });
        } else {
            result.push({ time: 999999, text: line.trim() });
        }
    }
    return result;
}

function showLyrics(songId) {
    document.querySelectorAll('[id^="lyricsDisplay-"]').forEach(el => {
        if (el.id !== 'lyricsDisplay-' + songId) {
            el.style.display = 'none';
        }
    });
    if (lyricsTimer) {
        clearInterval(lyricsTimer);
        lyricsTimer = null;
    }
    let song = null;
    for (let cat of ['ai', 'hybrid', 'original']) {
        const found = allSongs[cat]?.find(s => s.id === songId);
        if (found) { song = found; break; }
    }
    if (!song) return;
    const display = document.getElementById('lyricsDisplay-' + songId);
    const lineEl = document.getElementById('lyricsLine-' + songId);
    if (!display || !lineEl) return;
    const lyrics = song.lyrics || '纯音乐（无歌词）';
    const lines = parseLyricsWithTimestamps(lyrics);
    display.style.display = 'block';
    if (lines.length === 0 || lines[0].time === undefined || lines[0].time === 999999) {
        lineEl.textContent = lyrics;
        return;
    }
    const audio = document.getElementById('global-audio');
    if (!audio) { lineEl.textContent = ' 加载中...'; return; }
    let currentIndex = 0;
    const currentTime = audio.currentTime || 0;
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].time <= currentTime) {
            currentIndex = i;
        }
    }
    lineEl.textContent = lines[currentIndex]?.text || '';
    lyricsTimer = setInterval(() => {
        if (!audio || audio.paused || audio.ended) return;
        const ct = audio.currentTime;
        let newIndex = currentIndex;
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].time <= ct) {
                newIndex = i;
            }
        }
        if (newIndex !== currentIndex) {
            currentIndex = newIndex;
            lineEl.textContent = lines[currentIndex]?.text || '';
            lineEl.style.opacity = '0.3';
            setTimeout(() => { lineEl.style.opacity = '1'; }, 30);
        }
    }, 200);
}

function hideLyrics(songId) {
    const display = document.getElementById('lyricsDisplay-' + songId);
    if (display) display.style.display = 'none';
    if (lyricsTimer) {
        clearInterval(lyricsTimer);
        lyricsTimer = null;
    }
}

async function handleUpload(container, modal) {

        alert('页面加载异常，请刷新重试');
        return;
    }
    const submitBtn = container.querySelector('#submitBtn');
    if (!submitBtn) {
        alert('页面加载异常，请刷新重试');
        return;
    }

    // ===== 排行榜作品数据 =====

    const artist = container.querySelector('#artistName')?.value?.trim() || '';
    const title = container.querySelector('#songTitle')?.value?.trim() || '';
    const audioFile = container.querySelector('#audioFile')?.files?.[0];
    const genre = container.querySelector('#genre')?.value?.trim() || '';
    const contactInfo = container.querySelector('#contactInfo')?.value?.trim() || '';
    const isDemoChecked = container.querySelector('#isDemo')?.checked || false;

    const joinLyrics = container.querySelector('#joinLyrics')?.value?.trim() || '纯音乐';

    // ===== 校验 =====
    if (!artist) { alert('请填写艺名'); return; }
    if (!title) { alert('请填写歌名'); return; }
    if (!audioFile) { alert('请选择音频文件'); return; }
    if (!promiseChecked) { alert('请勾选承诺书'); return; }
    if ((category === 'hybrid' || category === 'original') && !contactInfo) {
        alert('人机共创榜 / 原创作品榜 必须填写联系方式');
        return;
    }

    const progressDiv = container.querySelector('#uploadProgress');

    submitBtn.style.opacity = '0.6';

        const user = JSON.parse(localStorage.getItem('currentUser') || '{}');

            return;

        // ===== 2. 写入排行榜 songs 表 =====
        if (progressBar) progressBar.style.width = '40%';
        if (progressText) progressText.textContent = '⏳ 正在保存作品... 40%';
        const newSong = {
    id: Date.now().toString() + '_' + Math.random().toString(36).substring(2, 6),
    user_id: user?.user_id || null,   // ✅ 用 user

    title: title,

            lyrics_by: container.querySelector('#lyricsBy')?.value || '',
            arrangement_by: container.querySelector('#arrangementBy')?.value || '',

            resetBtn();
            return;
        }
// ===== 3. 如果勾选了入驻 =====
        if (alsoJoin) {
            if (!joinName) {

                resetBtn();
                return;
            }
            if (!currentUser) {
                alert('请先登录');

                return;
            }

            if (progressBar) progressBar.style.width = '60%';
            if (progressText) progressText.textContent = '⏳ 正在提交入驻... 60%';

            musicianId = Date.now().toString() + Math.floor(Math.random() * 1000).toString().padStart(3, '0');

            // 上传入驻作品音频（抄 musician-center.html）
            if (joinAudioFile) {
                try {
                    const fileExt = joinAudioFile.name.split('.').pop();
                    const fileName = `${Date.now()}_${musicianId}.${fileExt}`;
                    const uploadResp = await fetch(
                        `${SUPABASE_URL}/storage/v1/object/audios/${fileName}`,
                        {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': joinAudioFile.type
                            },
                            body: joinAudioFile
                        }
                    );
                    if (uploadResp.ok) {

                    }
                } catch (e) {
                    console.warn('入驻作品音频上传异常:', e);
                }
            }

            // ===== 4. 写入 musicians 表 =====
            const musicianData = {
                id: musicianId,
                name: joinName,
                role: joinRole,
                bio: joinBio || '',
                status: 'pending',
                user_id: currentUser.id
            };
            const { error: musicianError } = await client.from('musicians').insert([musicianData]);
            if (musicianError) {
                console.error('入驻申请失败:', musicianError);
                alert('⚠️ 作品已提交，但入驻申请失败，请联系管理员');
            }

            // ===== 5. 写入 works 表（入驻作品） =====
            if (joinAudioFile && joinWorkTitle) {
                const workData = {
                    id: Date.now().toString() + Math.floor(Math.random() * 1000).toString().padStart(3, '0'),
                    musician_id: musicianId,
                    title: joinWorkTitle,
                    audio_url: joinAudioUrl,
                    lyrics: joinLyrics,
                    likes: 0,
                    status: 'pending'
                };
                const { error: workError } = await client.from('works').insert([workData]);
                if (workError) {
                    console.error('入驻作品写入失败:', workError);
                    alert('⚠️ 入驻申请已提交，但作品写入失败，请联系管理员');
                } else {
                    console.log('✅ 入驻作品写入成功');
                }
            }
        }

        if (progressBar) progressBar.style.width = '100%';
        if (progressText) {
            progressText.textContent = '✅ 提交成功！';
            progressText.style.color = '#4CAF50';
        }
        await new Promise(resolve => setTimeout(resolve, 500));

        let msg = '✅ 作品已提交！审核通过后将在排行榜展示。\n\n 作品名称：' + title + '\n 艺名：' + artist;
        // 入驻成功后显示 ID
        if (alsoJoin && musicianId) {
            const userInput = prompt(
                '✅ 入驻申请已提交！\n\n' +
                ' 你的音乐人 ID（请复制保存，用于登录个人中心）：\n' +
                musicianId + '\n\n' +
                ' 请妥善保管此 ID！\n\n' +
                '点击「确定」复制 ID'
            );
            if (userInput !== null) {
                // 用户点击了确定，把 ID 复制到剪贴板
                navigator.clipboard.writeText(musicianId).then(() => {
                    alert('✅ 已复制音乐人 ID 到剪贴板！\n\n请妥善保管');
                }).catch(() => {
                    alert('⚠️ 无法自动复制，请手动复制上面的 ID');
                });
            }
        }

        // 清空表单
        container.querySelector('#artistName').value = '';
        container.querySelector('#songTitle').value = '';
        container.querySelector('#genre').value = '';
        container.querySelector('#audioFile').value = '';
        container.querySelector('#contactInfo').value = '';
        container.querySelector('#isDemo').checked = false;
        container.querySelector('#alsoJoin').checked = false;
        const joinFields = container.querySelector('#joinFields');
        if (joinFields) joinFields.style.display = 'none';
        container.querySelector('#joinName').value = '';
        container.querySelector('#joinBio').value = '';
        container.querySelector('#joinWorkTitle').value = '';
        container.querySelector('#joinAudioFile').value = '';
        container.querySelector('#joinLyrics').value = '';
        container.querySelector('#promise').checked = false;

        modal.classList.remove('active');
        resetBtn();
        await loadSongs();

    } catch (error) {
        console.error('上传失败:', error);
        alert('上传失败，请检查网络后重试');
        resetBtn();
    }

    function resetBtn() {
        submitBtn.textContent = originalText || '✨ 提交审核 ✨';
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        if (progressDiv) {
            setTimeout(() => {

                    progressText.textContent = '⏳ 正在上传音频...';
                    progressText.style.color = '#FFD966';

}

        console.error('找不到表单元素');

    clone.style.display = 'block';
    modalFormContainer.appendChild(clone);

    if (alsoJoin && joinFields) {
        alsoJoin.onchange = function() {
            joinFields.style.display = this.checked ? 'block' : 'none';
        };
    }

    const categorySelect = clone.querySelector('#category');
    const hybridFields = clone.querySelector('#hybridFields');
    if (categorySelect && hybridFields) {
        categorySelect.onchange = function() {
            hybridFields.style.display = (this.value === 'hybrid' || this.value === 'original') ? 'block' : 'none';
        };
        hybridFields.style.display = (categorySelect.value === 'hybrid' || categorySelect.value === 'original') ? 'block' : 'none';
    }
    
    const submitBtn = clone.querySelector('#submitBtn');
    if (submitBtn) {
        submitBtn.onclick = function(e) {
            e.preventDefault();
            handleUpload(clone, modal);

    }

function initFloatingButton() {
    const floatingBtn = document.getElementById('floatingUploadBtn');
    const modal = document.getElementById('uploadModal');
    const closeBtn = document.getElementById('closeModalBtn');
    if (!floatingBtn || !modal) {
        console.error('找不到悬浮按钮或弹窗');
        return;
    }
    
    floatingBtn.onclick = function() {
        modal.classList.add('active');
        modal.style.display = 'flex';
        setupModalForm(modal);
    };
    if (closeBtn) {
        closeBtn.onclick = function() {
            modal.classList.remove('active');
            modal.style.display = 'none';
        };
    }
    modal.onclick = function(e) {
        if (e.target === modal) {
            modal.classList.remove('active');
            modal.style.display = 'none';
        }
    };
}

function openUploadModal() {
    const modal = document.getElementById('uploadModal');
    if (!modal) return;
    modal.style.display = 'flex';
    modal.classList.add('active');
    setupModalForm(modal);
}

        }).catch(() => {
            // 如果 Clipboard API 失败，用备用方案
            fallbackCopy(text);
        });
    } else {
        // 不支持 Clipboard API 的设备
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    // 使用 input 而不是 textarea，减少键盘弹出
    const input = document.createElement('input');
    input.value = text;
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    input.style.top = '-9999px';
    input.style.opacity = '0';
    document.body.appendChild(input);
    input.select();
    
    try {
        document.execCommand('copy');
        showToast('✅ 已复制到剪贴板！');
    } catch (e) {
        // 如果还是失败，提示用户手动复制
        showToast('⚠️ 请长按文案手动复制');
    }
    
    document.body.removeChild(input);
}

                song.title.toLowerCase().includes(keyword.toLowerCase()) ||
                song.artist.toLowerCase().includes(keyword.toLowerCase())) {
                found = song;
                break;
            }
        }
        if (found) break;
    }
    
    if (found) {
        currentSongId = found.id;
        currentSongTitle = found.title;
        locateAndHighlight(found.id);
        showToast('✅ 找到歌曲：' + found.title + ' - ' + found.artist);
    } else {
        showToast('❌ 没找到 "' + keyword + '"，试试其他关键词');
    }
}

// 2. 定位并高亮
function locateAndHighlight(songId) {
    const card = document.querySelector('.rank-card[data-song-id="' + songId + '"]');
    if (!card) {
        showToast('⚠️ 歌曲存在，但还没有加载到页面，请刷新重试');
        return;
    }
    
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    
    card.style.transition = 'all 0.6s ease';
    card.style.border = '4px solid #ffd700';
    card.style.boxShadow = '0 0 80px rgba(255,215,0,0.4), 0 0 160px rgba(255,215,0,0.1)';
    card.style.transform = 'scale(1.03)';
    card.style.zIndex = '10';
    card.style.position = 'relative';
    card.style.background = 'rgba(255,215,0,0.08)';
    
    setTimeout(() => {
        card.style.border = '';
        card.style.boxShadow = '';
        card.style.transform = '';
        card.style.zIndex = '';
        card.style.position = '';
        card.style.background = '';
    }, 4000);
    
    let blinkCount = 0;
    const blinkInterval = setInterval(() => {
        if (blinkCount > 4) {
            clearInterval(blinkInterval);
            return;
        }
        if (blinkCount % 2 === 0) {
            card.style.border = '4px solid #ff6b6b';
            card.style.boxShadow = '0 0 100px rgba(255,100,100,0.3)';
        } else {
            card.style.border = '4px solid #ffd700';
            card.style.boxShadow = '0 0 80px rgba(255,215,0,0.4)';
        }
        blinkCount++;
    }, 400);
    
    if (navigator.vibrate) {
        navigator.vibrate(30);
    }
    
    document.getElementById('locationTip').classList.remove('show');
}

(function() {

    // 微信专用定位函数
    function locateSong() {
        const card = document.querySelector('.rank-card[data-song-id="' + shareSongId + '"]');
        if (card) {
            console.log('✅ 找到卡片！');
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.style.border = '4px solid #ffd700';
            card.style.boxShadow = '0 0 60px rgba(255,215,0,0.5)';

            if (navigator.vibrate) navigator.vibrate(30);
            
            setTimeout(() => {
                card.style.border = '';
                card.style.boxShadow = '';
            }, 4000);
            return true;
        }
        return false;
    }
    
    // 如果是微信，用更长的延迟 + 多次重试
    if (isWechat) {
        let attempts = 0;
        const maxAttempts = 25;
        
        function wechatRetry() {
            attempts++;
            if (locateSong()) return;
            
            if (attempts < maxAttempts) {
                console.log('⏳ 微信重试', attempts);
                setTimeout(wechatRetry, 600);
            } else {
                console.log('❌ 微信定位失败，显示手动按钮');
                // 显示手动定位按钮
                const tip = document.getElementById('shareTip');
                if (tip) tip.style.display = 'block';
            }
        }
        
        // 微信多等一会
        setTimeout(wechatRetry, 2000);
    } else {
        // 非微信环境，正常执行
        setTimeout(() => {
            if (!locateSong()) {
                // 失败后显示手动按钮
                const tip = document.getElementById('shareTip');
                if (tip) tip.style.display = 'block';
            }
        }, 1000);
    }
})();

// 加载比赛列表（用于筛选器和上传下拉）
async function loadContests() {
    try {
        const client = await ensureSupabase();
        const { data, error } = await client
            .from('contests')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (error) throw error;
        return data || [];
    } catch (e) {
        console.error('加载比赛列表失败:', e);
        return [];
    }
}

// 填充比赛筛选器下拉
async function populateContestFilter() {
    const contests = await loadContests();
    const select = document.getElementById('contestFilter');
    const contestSelect = document.getElementById('contestSelect');
    const activeContainer = document.getElementById('contestItems');
    
    if (!select) return;
    
    // 清空并填充筛选器
    select.innerHTML = '<option value="">全部作品</option>';
    if (contestSelect) {
        contestSelect.innerHTML = '<option value=""> 选择参赛（可选）</option>';
    }
    
    let activeHtml = '';
    let hasActive = false;
    
    contests.forEach(c => {
        // 筛选器下拉
        const option = document.createElement('option');
        option.value = c.id;
        option.textContent = c.title;
        select.appendChild(option);
        
        // 上传弹窗下拉
        if (contestSelect) {
            const opt2 = document.createElement('option');
            opt2.value = c.id;
            opt2.textContent = c.title;
            contestSelect.appendChild(opt2);
        }
        
        // 进行中的比赛
        if (c.status === 'active') {
            hasActive = true;
            const now = new Date();
            const end = new Date(c.end_date);
            const daysLeft = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
            const label = daysLeft > 0 ? `剩余${daysLeft}天` : '即将结束';
            activeHtml += `<a href="contest.html?id=${c.id}" title="${c.description || ''}">${c.title} <span style="font-size:0.5rem;opacity:0.5;">${label}</span></a>`;
        }
    });
    
    // 更新进行中的比赛
    if (activeContainer) {
        if (hasActive) {
            activeContainer.innerHTML = activeHtml;
        } else {
            activeContainer.innerHTML = '<span style="color:rgba(255,255,255,0.1);font-size:0.7rem;">暂无进行中的比赛</span>';
        }
    }
    
    // 更新筛选计数
    updateFilterCount();
}

// 加载评论
async function loadComments(workId) {
    try {
        const resp = await fetch(
            `${SUPABASE_URL}/rest/v1/comments?work_id=eq.${workId}&order=likes.desc,created_at.desc`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        const comments = await resp.json();
 // 🆕 加这行：如果返回的不是数组，改成空数组
        if (!Array.isArray(comments)) {
            console.warn('评论数据格式异常:', comments);
            renderComments([]);
            return;
        }
        const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
        commentLikedStatus = {};
        if (user.user_id && comments && comments.length > 0) {
            try {
                const commentIds = comments.map(c => c.id).join(',');
                const likeResp = await fetch(
                    `${SUPABASE_URL}/rest/v1/comment_likes?user_id=eq.${user.user_id}&comment_id=in.(${commentIds})`,
                    { headers: { 'apikey': SUPABASE_KEY } }
                );
                if (likeResp.ok) {
                    const likes = await likeResp.json();
                    likes.forEach(l => { commentLikedStatus[l.comment_id] = true; });
                }
            } catch (e) {
                console.warn('获取点赞状态失败:', e);
            }
        }
        renderComments(comments);
    } catch (e) {
        console.error('加载评论失败:', e);
    }
}

// 渲染评论
function renderComments(comments) {
    const list = document.getElementById('commentList');
    const countEl = document.getElementById('commentCount');
    countEl.textContent = comments.length;

        list.innerHTML = `<div style="text-align: center; color: rgba(255,255,255,0.25); padding: 50px 0; font-size: 0.85rem;"> 还没有评论，说点什么吧～</div>`;
        return;
    }
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    list.innerHTML = comments.map(c => {
        const isMine = c.user_id === user.user_id;
        const time = formatTimeAgo(c.created_at);
        const isLiked = commentLikedStatus[c.id] || false;
        return `
            <div style="padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                            <span style="color: #b8a0c8; font-size: 0.75rem; font-weight: 500;">${escapeHtml(c.user_name || '匿名用户')}</span>
                            <span style="color: rgba(255,255,255,0.2); font-size: 0.6rem;">${time}</span>
                        </div>
                        <div style="color: rgba(255,255,255,0.85); font-size: 0.85rem; line-height: 1.5; word-break: break-word;">${escapeHtml(c.content)}</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 10px;">
                        ${isMine ? `
                            <button onclick="deleteComment(${c.id}, '${c.user_id}')" style="
                                background: none;
                                border: none;
                                color: rgba(255,255,255,0.15);
                                cursor: pointer;
                                font-size: 0.65rem;
                                padding: 2px 6px;
                                border-radius: 4px;
                            " onmouseover="this.style.color='rgba(255,100,100,0.5)'" onmouseout="this.style.color='rgba(255,255,255,0.15)'">删除</button>
                        ` : ''}
                        <button onclick="toggleCommentLike(${c.id})" style="
                            background: none;
                            border: none;
                            color: ${isLiked ? '#e88a8a' : 'rgba(255,255,255,0.25)'};
                            cursor: pointer;
                            font-size: 0.75rem;
                            padding: 2px 4px;
                            border-radius: 4px;
                            display: flex;
                            align-items: center;
                            gap: 2px;
                            transition: 0.2s;
                        " onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                            ${isLiked ? '❤️' : '🤍'} <span style="font-size: 0.6rem;">${c.likes || 0}</span>
                        </button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

// 切换评论点赞
async function toggleCommentLike(commentId) {
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.user_id) {
        alert('请先登录再点赞');
        return;
    }
    try {
        const resp = await fetch(
            `${SUPABASE_URL}/rest/v1/comments?id=eq.${commentId}&select=likes`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        const data = await resp.json();
        const currentLikes = data[0]?.likes || 0;
        const isLiked = commentLikedStatus[commentId] || false;
        const newLikes = isLiked ? Math.max(0, currentLikes - 1) : currentLikes + 1;
        const updateResp = await fetch(
            `${SUPABASE_URL}/rest/v1/comments?id=eq.${commentId}`,
            {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ likes: newLikes })
            }
        );
        if (!updateResp.ok) {
            console.error('更新 likes 失败:', await updateResp.text());
            alert('点赞失败，请重试');
            return;
        }
        if (isLiked) {
            await fetch(
                `${SUPABASE_URL}/rest/v1/comment_likes?comment_id=eq.${commentId}&user_id=eq.${user.user_id}`,
                { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY } }
            );
        } else {
            await fetch(
                `${SUPABASE_URL}/rest/v1/comment_likes`,
                {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comment_id: commentId, user_id: user.user_id })
                }
            ).catch(() => {});
        }
        commentLikedStatus[commentId] = !isLiked;
        await loadComments(currentCommentSongId);
    } catch (e) {
        console.error('点赞失败:', e);
        alert('点赞失败，请重试');
    }
}

// 时间格式化
function formatTimeAgo(timestamp) {
    if (!timestamp) return '刚刚';
    const now = Date.now();
    const time = new Date(timestamp).getTime();
    const diff = Math.floor((now - time) / 1000);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
    return new Date(timestamp).toLocaleDateString();
}

// ============================================================
// ===== 流星雨效果 =====
// ============================================================

let meteorAnimationId = null;
let meteors = [];
let meteorCtx = null;
let meteorCanvas = null;

function initMeteorCanvas() {
    meteorCanvas = document.getElementById('meteorCanvas');
    if (!meteorCanvas) return;
    meteorCtx = meteorCanvas.getContext('2d');
    
    const rect = meteorCanvas.parentElement.getBoundingClientRect();
    meteorCanvas.width = rect.width;
    meteorCanvas.height = rect.height;
    
    meteors = [];
    for (let i = 0; i < 19; i++) {
        meteors.push(createMeteor());
    }
    
    drawMeteors();
}

function createMeteor() {
    const canvas = meteorCanvas;
    return {
        x: Math.random() * canvas.width * 0.8,
        y: Math.random() * canvas.height * 0.3,
        length: Math.random() * 80 + 40,
        speed: Math.random() * 4 + 3,
        angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
        opacity: Math.random() * 0.6 + 0.3,
        life: Math.random() * 120 + 80,
        maxLife: 200,
        delay: Math.random() * 200
    };
}

function drawMeteors() {
    if (!meteorCtx || !meteorCanvas) return;
    const ctx = meteorCtx;
    const canvas = meteorCanvas;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    meteors.forEach(meteor => {
        if (meteor.delay > 0) {
            meteor.delay--;
            return;
        }
        
        meteor.x += Math.cos(meteor.angle) * meteor.speed;
        meteor.y += Math.sin(meteor.angle) * meteor.speed;
        meteor.life--;
        
        const lifeRatio = meteor.life / meteor.maxLife;
        const alpha = meteor.opacity * Math.min(1, lifeRatio * 2);
        
        const tailLength = meteor.length * lifeRatio;
        const gradient = ctx.createLinearGradient(
            meteor.x, meteor.y,
            meteor.x - Math.cos(meteor.angle) * tailLength,
            meteor.y - Math.sin(meteor.angle) * tailLength
        );
        gradient.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
        gradient.addColorStop(0.3, `rgba(255, 240, 220, ${alpha * 0.6})`);
        gradient.addColorStop(1, `rgba(255, 220, 200, 0)`);
        
        ctx.beginPath();
        ctx.moveTo(meteor.x, meteor.y);
        ctx.lineTo(
            meteor.x - Math.cos(meteor.angle) * tailLength,
            meteor.y - Math.sin(meteor.angle) * tailLength
        );
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2;
        ctx.stroke();
        
        const glow = ctx.createRadialGradient(meteor.x, meteor.y, 0, meteor.x, meteor.y, 6);
        glow.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.8})`);
        glow.addColorStop(1, `rgba(255, 255, 255, 0)`);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(meteor.x, meteor.y, 6, 0, Math.PI * 2);
        ctx.fill();
        
        if (meteor.life <= 0) {
            Object.assign(meteor, createMeteor());
            meteor.x = Math.random() * canvas.width * 0.8;
            meteor.y = Math.random() * canvas.height * 0.2;
            meteor.delay = Math.random() * 100 + 50;
        }
    });
    
    meteorAnimationId = requestAnimationFrame(drawMeteors);
}

function startMeteors() {
    const canvas = document.getElementById('meteorCanvas');
    if (canvas) {
        setTimeout(() => {
            initMeteorCanvas();
            window.addEventListener('resize', () => {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            });
        }, 300);
    }
}

function stopMeteors() {
    if (meteorAnimationId) {
        cancelAnimationFrame(meteorAnimationId);
        meteorAnimationId = null;
    }
}

// ============================================================
// =====  播放量功能 ========================================
// ============================================================

// 增加播放量
async function incrementPlays(songId) {
    if (!songId) return;
    try {
        const client = await ensureSupabase();
        const { data } = await client
            .from('songs')
            .select('plays')
            .eq('id', songId)
            .single();
        
        if (data) {
            const newPlays = (data.plays || 0) + 1;
            await client
                .from('songs')
                .update({ plays: newPlays })
                .eq('id', songId);
            
            // 更新内存
            for (let cat of ['ai', 'hybrid', 'original']) {
                const song = allSongs[cat]?.find(s => s.id === songId);
                if (song) {
                    song.plays = newPlays;
                    break;
                }
            }
        }
    } catch (e) {
        console.warn('播放量更新失败:', e);
    }
}

// 格式化播放量
function formatPlayCount(num) {
    if (!num) return '0';
    if (num >= 100000000) return (num / 100000000).toFixed(1) + '亿';
    if (num >= 10000) return (num / 10000).toFixed(1) + '万';
    return num.toString();
}

// ============================================================
// =====  单曲循环功能 ======================================
// ============================================================

let playMode = 'sequential'; // sequential / repeat / shuffle

function togglePlayMode() {
    const modes = ['sequential', 'repeat', 'shuffle'];
    const icons = ['', '', ''];
    let i = (modes.indexOf(playMode) + 1) % modes.length;
    playMode = modes[i];
    const btn = document.getElementById('playModeBtn');
    if (btn) btn.textContent = icons[i];
    showToast('播放模式：' + (playMode === 'sequential' ? '顺序播放' : playMode === 'repeat' ? '单曲循环' : '随机播放'));
}

function getNextSong(currentId) {
    // 收集所有歌曲
    let all = [];
    for (let cat of ['ai', 'hybrid', 'original']) {
        all = all.concat(allSongs[cat] || []);
    }
    if (all.length === 0) return null;
    
    if (playMode === 'repeat') {
        return all.find(s => s.id === currentId) || all[0];
    }
    if (playMode === 'shuffle') {
        const filtered = all.filter(s => s.id !== currentId);
        return filtered.length > 0 ? filtered[Math.floor(Math.random() * filtered.length)] : all[0];
    }
    // sequential
    const idx = all.findIndex(s => s.id === currentId);
    return all[(idx + 1) % all.length];
}

// ============================================================
// =====  关注功能 ==========================================
// ============================================================

async function handleFollow(artistName, btnElement) {
    if (!artistName) {
        showToast('⚠️ 艺名无效');
        return;
    }
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.user_id) {
        alert('请先登录再关注 🌾');
        window.location.href = 'index.html';
        return;
    }

    const targetId = 'artist_' + artistName;

    try {
        const client = await ensureSupabase();
        const { data: existing } = await client
            .from('follows')
            .select('*')
            .eq('follower_id', user.user_id)
            .eq('following_id', targetId);

        if (existing && existing.length > 0) {
            await client
                .from('follows')
                .delete()
                .eq('follower_id', user.user_id)
                .eq('following_id', targetId);
            btnElement.textContent = '🤍 关注';
            btnElement.classList.remove('followed');
            showToast('已取消关注');
        } else {
            await client
                .from('follows')
                .insert([{ follower_id: user.user_id, following_id: targetId }]);
            btnElement.textContent = '❤️ 已关注';
            btnElement.classList.add('followed');
            showToast('✅ 已关注 ' + artistName);
        }

        // 刷新卡片（更新粉丝数和关注状态）
        renderAll();

    } catch (e) {
        console.error('关注操作失败:', e);
        alert('操作失败，请重试');
    }
}
