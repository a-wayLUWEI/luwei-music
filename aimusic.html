<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>芦苇音乐 · AI音乐排行榜</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(
        135deg,
        #050505 0%,
        #0a0a0a 12%,
        #111111 24%,
        #1a1a1a 36%,
        #1a1a3a 46%,
        #4a4a8a 52%,
        #6a5a9a 56%,
        #4a4a8a 60%,
        #1a1a3a 66%,
        #1a1a1a 74%,
        #2a2a2a 82%,
        #4a4a4a 88%,
        #2a2a2a 94%,
        #1a1a1a 100%
    );
    background-size: 600% 600%;
    color: #e8e9f0;
    padding: 20px 20px 100px;
    animation: bodyGradientFlow 14s ease-in-out infinite alternate;
    min-height: 100vh;
}

@keyframes bodyGradientFlow {
    0% { background-position: 0% 50%; }
    14% { background-position: 14% 50%; }
    28% { background-position: 28% 50%; }
    42% { background-position: 42% 50%; }
    57% { background-position: 57% 50%; }
    71% { background-position: 71% 50%; }
    85% { background-position: 85% 50%; }
    100% { background-position: 100% 50%; }
}

.container { max-width: 1000px; margin: 0 auto; }

/* ===== Hero 区域 ===== */
.hero {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(200, 180, 230, 0.12) 25%,
        rgba(160, 140, 210, 0.15) 45%,
        rgba(120, 100, 190, 0.12) 60%,
        rgba(160, 140, 210, 0.15) 75%,
        rgba(200, 180, 230, 0.12) 85%,
        rgba(255, 255, 255, 0.08) 100%
    );
    background-size: 400% 400%;
    border-radius: 48px;
    margin-bottom: 30px;
    border: 1px solid rgba(200, 180, 230, 0.15);
    backdrop-filter: blur(10px);
    animation: heroCardFlow 8s ease-in-out infinite alternate;
}

@keyframes heroCardFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}

.hero h1 {
    font-size: 2rem;
    background: linear-gradient(
        135deg,
        #e8e0f0 0%,
        #c8b8e0 30%,
        #a894d0 55%,
        #8878b8 70%,
        #a894d0 85%,
        #c8b8e0 100%
    );
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: heroTitleFlow 6s ease-in-out infinite alternate;
}

@keyframes heroTitleFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 50% 50%; }
    100% { background-position: 100% 50%; }
}

.hero p {
    margin-top: 8px;
    opacity: 0.5;
    color: #c8b8e0;
    letter-spacing: 1px;
    font-size: 0.9rem;
}
.hero h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, #d4b896, #f0e0c8, #b8a0c8, #d4b896);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: heroTitleFlow 6s ease-in-out infinite alternate;
}
@keyframes heroTitleFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}
.hero p {
    margin-top: 8px;
    opacity: 0.5;
    color: #d4b896;
    letter-spacing: 1px;
    font-size: 0.9rem;
}

/* ===== Tab 按钮 ===== */
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.tab-btn {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(212, 184, 150, 0.15);
    padding: 10px 16px;
    border-radius: 40px;
    cursor: pointer;
    text-align: center;
    flex: 1;
    transition: 0.3s;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(4px);
}
.tab-btn:hover {
    border-color: rgba(212, 184, 150, 0.3);
    color: rgba(255, 255, 255, 0.7);
}
.tab-btn.active {
    background: linear-gradient(135deg, rgba(212, 184, 150, 0.2), rgba(184, 160, 200, 0.2));
    color: #d4b896;
    border-color: rgba(212, 184, 150, 0.4);
    box-shadow: 0 0 30px rgba(212, 184, 150, 0.05);
}
.tab-content {
    display: none;
}
.tab-content.active {
    display: block;
}

/* ===== 排行榜卡片 ===== */
/* ===== 排行榜卡片 ===== */
.rank-card {
    position: relative;
    background: linear-gradient(
        135deg,
        rgba(212, 184, 150, 0.10) 0%,
        rgba(245, 230, 200, 0.06) 8%,
        rgba(26, 58, 42, 0.20) 25%,
        rgba(10, 30, 20, 0.30) 40%,
        rgba(0, 0, 0, 0.35) 50%,
        rgba(10, 30, 20, 0.30) 60%,
        rgba(26, 58, 42, 0.20) 75%,
        rgba(245, 230, 200, 0.06) 88%,
        rgba(212, 184, 150, 0.10) 94%,
        rgba(160, 140, 210, 0.12) 100%
    );
    background-size: 500% 500%;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(212, 184, 150, 0.08);
    transition: 0.4s;
    overflow: hidden;
    animation: cardGradientFlow 10s ease-in-out infinite alternate;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

/* ===== 背景流动动画（新增） ===== */
@keyframes cardGradientFlow {
    0% { background-position: 0% 50%; }
    20% { background-position: 20% 50%; }
    40% { background-position: 40% 50%; }
    60% { background-position: 60% 50%; }
    80% { background-position: 80% 50%; }
    100% { background-position: 100% 50%; }
}

/* ===== 卡片背景微纹理（不单调） ===== */
.rank-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
        radial-gradient(circle at 20% 30%, rgba(212, 184, 150, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(184, 160, 200, 0.03) 0%, transparent 50%),
        repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.005) 2px, rgba(255,255,255,0.005) 4px);
    pointer-events: none;
    z-index: 0;
    border-radius: 20px;
}

/* ===== 底部光晕（高级感） ===== */
.rank-card::after {
    content: '';
    position: absolute;
    bottom: -30%;
    right: -10%;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(212, 184, 150, 0.06), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    transition: 0.6s;
}

.rank-card:hover::after {
    width: 250px;
    height: 250px;
    opacity: 1;
}

/* ===== 悬停流光扫过 ===== */
.rank-card .shimmer {
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
    transform: skewX(-25deg);
    transition: 0.8s;
    pointer-events: none;
    z-index: 1;
}

.rank-card:hover .shimmer {
    left: 150%;
}

/* ===== 卡片内容层级 ===== */
.rank-card > * {
    position: relative;
    z-index: 2;
}

/* ===== TOP 3 奖牌 ===== */
.rank-medal {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 1.6rem;
    z-index: 3;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    animation: medalPulse 2s ease-in-out infinite;
}

@keyframes medalPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

/* ===== 音符装饰 ===== */
.rank-note {
    position: absolute;
    bottom: 12px;
    right: 18px;
    font-size: 1.4rem;
    color: rgba(255, 255, 255, 0.03);
    pointer-events: none;
    z-index: 1;
    transition: 0.4s;
    font-family: serif;
}

.rank-card:hover .rank-note {
    color: rgba(255, 255, 255, 0.06);
    transform: rotate(10deg) scale(1.1);
}

/* ===== 卡片悬停 ===== */
.rank-card:hover {
    border-color: rgba(212, 184, 150, 0.2);
    transform: translateY(-2px);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(212, 184, 150, 0.05);
}

@keyframes cardFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

@keyframes cardFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

/* ===== 顶部金色细线（亮金色） ===== */
.rank-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245, 230, 200, 0.5), transparent);
    opacity: 0;
    transition: 0.4s;
}

.rank-card:hover::before {
    opacity: 1;
}

/* ===== 金色折角（加大版） ===== */
.rank-card::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 0 70px 70px;
    border-color: transparent transparent rgba(212, 184, 150, 0.2) transparent;
    pointer-events: none;
    transition: 0.4s;
}

.rank-card:hover::after {
    border-color: transparent transparent rgba(212, 184, 150, 0.5) transparent;
}

.rank-card:hover {
    border-color: rgba(212, 184, 150, 0.2);
    transform: translateY(-2px);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(212, 184, 150, 0.05);
}

.rank-card:hover::before {
    opacity: 1;
}

.rank-card:hover::after {
    border-color: transparent transparent rgba(212, 184, 150, 0.5) transparent;
}

/* ===== CD 唱片排名 ===== */
.rank-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    font-size: 1.4rem;
    font-weight: 700;
    font-feature-settings: "tnum";
    /* CD 光盘：白色 → 黑色 → 白色 渐变 */
    background: radial-gradient(
        circle at 40% 40%,
        #e8e8e8 0%,
        #b8b8b8 20%,
        #666666 40%,
        #222222 55%,
        #666666 70%,
        #b8b8b8 85%,
        #e8e8e8 100%
    );
    border-radius: 50%;
    border: 2px solid rgba(212, 184, 150, 0.2);
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
    box-shadow: 
        inset 0 0 30px rgba(0,0,0,0.4),
        0 0 40px rgba(212, 184, 150, 0.04);
    transition: 0.4s;
    flex-shrink: 0;
    margin-right: 14px;
    position: relative;
    /* 金色数字 */
    background-image: radial-gradient(
        circle at 40% 40%,
        #e8e8e8 0%,
        #b8b8b8 20%,
        #666666 40%,
        #222222 55%,
        #666666 70%,
        #b8b8b8 85%,
        #e8e8e8 100%
    );
}

/* ===== 数字用金色渐变覆盖 ===== */
.rank-number {
    background: radial-gradient(
        circle at 40% 40%,
        #e8e8e8 0%,
        #b8b8b8 20%,
        #666666 40%,
        #222222 55%,
        #666666 70%,
        #b8b8b8 85%,
        #e8e8e8 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(212, 184, 150, 0.05);
}

/* ===== 金色数字（独立叠加） ===== */
.rank-number .num {
    background: linear-gradient(135deg, #f5e6c8, #d4b896, #f5e6c8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
    text-shadow: 0 0 20px rgba(212, 184, 150, 0.1);
}

/* ===== CD 光盘光泽 ===== */
.rank-number::before {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: radial-gradient(
        ellipse at 35% 30%,
        rgba(255,255,255,0.15) 0%,
        transparent 50%
    );
    pointer-events: none;
}

/* ===== CD 中心小孔 ===== */
.rank-number::after {
    content: '';
    position: absolute;
    inset: 50%;
    width: 8px;
    height: 8px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,0,0,0.6), rgba(255,255,255,0.1));
    border: 1px solid rgba(255,255,255,0.05);
    pointer-events: none;
    box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
}

/* ===== 悬停旋转 ===== */
.rank-card:hover .rank-number {
    animation: cdSpin 6s linear infinite;
    border-color: rgba(212, 184, 150, 0.35);
    box-shadow: 
        inset 0 0 30px rgba(0,0,0,0.4),
        0 0 60px rgba(212, 184, 150, 0.08);
}

@keyframes cdSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ===== 歌曲标题（渐变流动，参考 lwmusic） ===== */
.song-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 8px 0 4px;
    background: linear-gradient(90deg, 
        #d4b896 0%, 
        #f0e0c8 25%, 
        #b8a0c8 50%, 
        #f0e0c8 75%, 
        #d4b896 100%
    );
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: titleFlow 6s ease-in-out infinite alternate;
}
@keyframes titleFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

/* ===== 歌手信息 ===== */
.song-artist {
    color: rgba(255, 255, 255, 0.4);
    font-size: 0.9rem;
}
.song-artist span {
    color: rgba(212, 184, 150, 0.5);
}

/* ===== Demo 标签 ===== */
.demo-badge {
    background: linear-gradient(135deg, rgba(212, 184, 150, 0.2), rgba(184, 160, 200, 0.2));
    color: #d4b896;
    font-size: 0.6rem;
    padding: 2px 12px;
    border-radius: 20px;
    display: inline-block;
    margin-left: 8px;
    font-weight: 600;
    border: 1px solid rgba(212, 184, 150, 0.15);
    vertical-align: middle;
}

/* ===== 音频播放器 ===== */
audio {
    width: 100%;
    margin: 10px 0;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.03);
}
audio::-webkit-media-controls-panel {
    background: rgba(26, 26, 46, 0.6);
}

/* ===== 操作按钮 ===== */
.action-btn {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(212, 184, 150, 0.15);
    padding: 6px 18px;
    border-radius: 40px;
    cursor: pointer;
    margin-right: 10px;
    color: rgba(255, 255, 255, 0.4);
    font-weight: 400;
    transition: 0.3s;
    font-size: 0.85rem;
}
.action-btn:hover {
    background: rgba(212, 184, 150, 0.1);
    border-color: rgba(212, 184, 150, 0.3);
    color: #d4b896;
}

/* ===== 创作信息 ===== */
.extra-info {
    font-size: 0.8rem;
    opacity: 0.4;
    margin: 5px 0;
    color: #b8a0c8;
}

/* ===== 悬浮上传按钮 ===== */
.floating-upload-btn {
    position: fixed;
    bottom: 30px;
    right: 20px;
    background: linear-gradient(135deg, #d4b896, #b8a0c8);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 30px rgba(184, 160, 200, 0.3);
    z-index: 999;
    transition: 0.3s;
}
.floating-upload-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 50px rgba(184, 160, 200, 0.4);
}
.floating-upload-btn span {
    font-size: 32px;
    font-weight: 300;
    color: #1a1a2e;
}

/* ===== 弹窗 ===== */
.upload-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(20px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}
.upload-modal.active {
    display: flex;
}
.upload-modal-content {
    background: linear-gradient(145deg, #1a1a2e, #2a2a4a);
    max-width: 500px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 28px;
    padding: 24px;
    border: 1px solid rgba(212, 184, 150, 0.1);
}
.close-modal {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 32px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.2);
    z-index: 10;
}
.close-modal:hover {
    color: rgba(212, 184, 150, 0.5);
}
.upload-modal-content input,
.upload-modal-content select,
.upload-modal-content textarea {
    width: 100%;
    padding: 12px 16px;
    margin-bottom: 14px;
    border-radius: 40px;
    border: 1px solid rgba(212, 184, 150, 0.1);
    background: rgba(255, 255, 255, 0.03);
    color: #e8e9f0;
    font-size: 0.95rem;
    outline: none;
    transition: 0.3s;
}
.upload-modal-content input:focus,
.upload-modal-content select:focus {
    border-color: rgba(212, 184, 150, 0.3);
    background: rgba(255, 255, 255, 0.05);
}
.upload-modal-content button {
    background: linear-gradient(135deg, #d4b896, #b8a0c8);
    border: none;
    padding: 14px 24px;
    border-radius: 40px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 1rem;
    color: #1a1a2e;
    transition: 0.3s;
}
.upload-modal-content button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.upload-modal-content button:hover:not(:disabled) {
    transform: scale(1.02);
    box-shadow: 0 4px 30px rgba(184, 160, 200, 0.2);
}
.upload-modal-content .promise-box {
    background: rgba(212, 184, 150, 0.05);
    padding: 16px;
    border-radius: 16px;
    margin: 16px 0;
}
.upload-modal-content h3 {
    color: #d4b896;
    margin-bottom: 20px;
    font-size: 1.3rem;
}
.upload-progress {
    display: none;
    margin: 10px 0;
}
.upload-progress .progress-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 40px;
    height: 4px;
    overflow: hidden;
}
.upload-progress .progress-bar {
    background: linear-gradient(90deg, #d4b896, #b8a0c8);
    width: 0%;
    height: 100%;
    transition: width 0.3s;
}
.upload-progress .progress-text {
    text-align: center;
    margin-top: 8px;
    color: rgba(212, 184, 150, 0.5);
    font-size: 0.85rem;
}
.contact-note {
    text-align: center;
    margin-top: 12px;
    color: rgba(255, 255, 255, 0.2);
    font-size: 0.8rem;
}
.footer {
    text-align: center;
    font-size: 0.7rem;
    margin-top: 40px;
    color: rgba(255, 255, 255, 0.15);
}
.upload-section {
    display: none;
}

/* 空状态 */
.empty-state {
    text-align: center;
    padding: 40px;
    color: rgba(255, 255, 255, 0.15);
    font-size: 0.95rem;
}

/* ===== 均衡器 ===== */
.equalizer.active {
    display: flex !important;
}
.equalizer {
    height: 60px !important;
    gap: 3px !important;
    align-items: center;
    justify-content: center;
}

.eq-bar {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(180deg, #aaffaa 0%, #44dd44 30%, #22aa22 60%, #0a5a0a 100%);
    transition: height 0.06s ease;
    min-height: 3px;
    max-height: 55px;
    box-shadow: 0 0 15px rgba(68, 221, 68, 0.25);
}

/* ===== 播放状态 ===== */
.rank-card.playing {
    border-color: rgba(68, 221, 68, 0.3) !important;
    box-shadow: 0 0 60px rgba(68, 221, 68, 0.06), 0 8px 40px rgba(0, 0, 0, 0.3) !important;
}

.play-btn.playing {
    color: #66ff66 !important;
    border-color: rgba(68, 221, 68, 0.4) !important;
    background: rgba(68, 221, 68, 0.08) !important;
    box-shadow: 0 0 20px rgba(68, 221, 68, 0.1) !important;
}

@keyframes medalPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.1) rotate(5deg); }
}
    </style>
</head>
<body>
<script src="checkAuth.js"></script>
<div class="container">
    <div class="hero">
        <h1>🎵 芦苇音乐 · AI音乐排行榜</h1>
<p style="letter-spacing: 2px;">在芦苇深处，治愈自己的思念。</p >
    </div>

<script>
// ==================== 1. Supabase 初始化 ====================
const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

let supabaseClient = null;
let isSupabaseReady = false;

function initSupabase() {
    return new Promise((resolve, reject) => {
        if (isSupabaseReady && supabaseClient) {
            resolve(supabaseClient);
            return;
        }
        if (typeof supabase !== 'undefined' && supabase.createClient) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            isSupabaseReady = true;
            console.log('✅ Supabase 客户端已初始化');
            resolve(supabaseClient);
            return;
        }
        if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            isSupabaseReady = true;
            console.log('✅ Supabase 客户端已初始化 (window)');
            resolve(supabaseClient);
            return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        script.onload = function() {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                isSupabaseReady = true;
                console.log('✅ Supabase 客户端已初始化 (动态加载)');
                resolve(supabaseClient);
            } else {
                reject(new Error('Supabase 加载失败'));
            }
        };
        script.onerror = function() {
            reject(new Error('Supabase CDN 加载失败'));
        };
        document.head.appendChild(script);
    });
}

async function ensureSupabase() {
    if (isSupabaseReady && supabaseClient) {
        return supabaseClient;
    }
    return await initSupabase();
}

// ==================== 2. Tab 切换 ====================
window.switchTab = function(tabId, btnElement) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
};

// ==================== 3. 数据管理 ====================
let allSongs = { ai: [], hybrid: [], original: [] };

async function loadSongs(retryCount = 0) {
    try {
        const client = await ensureSupabase();
        for (let cat of ['ai', 'hybrid', 'original']) {
            try {
                const { data, error } = await client
                    .from('songs')
                    .select('*')
                    .eq('category', cat)
                    .eq('status', 'active');
                if (error) {
                    console.error('加载失败:', error);
                    allSongs[cat] = [];
                } else {
                    allSongs[cat] = data || [];
                }
            } catch(e) {
                console.error('加载异常:', e);
                allSongs[cat] = [];
            }
        }
        renderAll();
    } catch (error) {
        console.error('❌ 加载榜单失败:', error);
        if (retryCount < 3) {
            console.log('⏳ 重试加载... (' + (retryCount + 1) + '/3)');
            setTimeout(() => loadSongs(retryCount + 1), 1000);
        } else {
            for (let cat of ['ai', 'hybrid', 'original']) {
                const container = document.getElementById(cat + '-list');
                if (container) {
                    container.innerHTML = '<div class="rank-card" style="text-align:center; color:rgba(255,255,255,0.2);">⚠️ 数据库连接失败，请刷新页面重试</div>';
                }
            }
        }
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function renderAll() {
    for (let cat of ['ai', 'hybrid', 'original']) {
        const container = document.getElementById(cat + '-list');
        if (!container) continue;
        const songs = allSongs[cat] || [];
        songs.sort((a, b) => (b.likes || 0) - (a.likes || 0));
        if (songs.length === 0) {
            container.innerHTML = '<div class="rank-card" style="text-align:center; color:rgba(255,255,255,0.15);">✨ 暂无作品，快来上传第一首吧 ✨</div>';
            continue;
        }
        
        container.innerHTML = songs.map((s, idx) => {
            let extraInfo = '';
            if (cat === 'hybrid' || cat === 'original') {
                const parts = [];
                if (s.melody_by) parts.push('旋律: ' + escapeHtml(s.melody_by));
                if (s.lyrics_by) parts.push('词: ' + escapeHtml(s.lyrics_by));
                if (s.arrangement_by) parts.push('编曲: ' + escapeHtml(s.arrangement_by));
                if (parts.length) extraInfo = '<div class="extra-info">' + parts.join(' · ') + '</div>';
            }
            const demoBadge = s.is_demo ? '<span class="demo-badge">Demo</span>' : '';
            
            let eqBars = '';
            for (let i = 0; i < 30; i++) {
                const h = 10 + Math.random() * 25;
                eqBars += '<div class="eq-bar" style="height:' + h + 'px;"></div>';
            }
            
            return '<div class="rank-card" data-song-id="' + s.id + '">' +
                '<div class="shimmer"></div>' +
                '<div class="rank-note">♩</div>' +
                (idx === 0 ? '<div class="rank-medal">🥇</div>' : '') +
                (idx === 1 ? '<div class="rank-medal">🥈</div>' : '') +
                (idx === 2 ? '<div class="rank-medal">🥉</div>' : '') +
              '<div class="rank-number"><span class="num">' + (idx + 1) + '</span></div>' +
                '<div class="song-title">' + escapeHtml(s.title) + ' ' + demoBadge + '</div>' +
                '<div class="song-artist">' + escapeHtml(s.artist) + ' <span>·</span> ' + (s.genre || '未分类') + ' <span>·</span> ' + (s.likes || 0) + ' 票</div>' +
                extraInfo +
                '<div class="equalizer" id="equalizer-' + s.id + '" style="display:none; align-items:center; justify-content:center; gap:3px; height:60px; margin:10px 0;">' + eqBars + '</div>' +
                '<div style="margin-top: 12px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">' +
                '   <button class="action-btn play-btn" data-song-id="' + s.id + '" onclick="togglePlay(\'' + s.id + '\', \'' + s.audio_url + '\', \'' + escapeHtml(s.title) + '\', \'' + escapeHtml(s.artist) + '\')">▶️ 播放</button>' +
                '   <button class="action-btn" onclick="window.likeSong(\'' + s.id + '\', \'' + cat + '\')">❤️ 点赞</button>' +
                '   <button class="action-btn" onclick="window.interest(\'' + escapeHtml(s.title) + '\', \'' + escapeHtml(s.artist) + '\')">💎 预留/合作</button>' +
                '</div>' +
                '</div>';
        }).join('');
    }
    renderDemo();
}

function renderDemo() {
    const demos = [
        ...(allSongs.hybrid || []),
        ...(allSongs.original || [])
    ].filter(s => s.is_demo === true);
    demos.sort((a, b) => (b.likes || 0) - (a.likes || 0));

            demoContainer.innerHTML = '<div class="rank-card" style="text-align:center; color:rgba(255,255,255,0.15);">🎧 暂无Demo作品，标记Demo版本会在这里出现~</div>';
        } else {
            demoContainer.innerHTML = demos.map((s, idx) => {

                let eqBars = '';

                    '<div class="song-artist">' + escapeHtml(s.artist) + ' <span>·</span> ' + catLabel + ' <span>·</span> ' + (s.likes || 0) + ' 票</div>' +
                    '<div class="equalizer" id="equalizer-' + s.id + '" style="display:none; align-items:center; justify-content:center; gap:4px; height:40px; margin:10px 0;">' + eqBars + '</div>' +
                    '<div style="margin-top: 12px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">' +
                    '   <button class="action-btn play-btn" data-song-id="' + s.id + '" onclick="togglePlay(\'' + s.id + '\', \'' + s.audio_url + '\', \'' + escapeHtml(s.title) + '\', \'' + escapeHtml(s.artist) + '\')">▶️ 播放</button>' +
                    '   <button class="action-btn" onclick="window.likeSong(\'' + s.id + '\', \'' + s.category + '\')">❤️ 点赞</button>' +
                    '   <button class="action-btn" onclick="window.interest(\'' + escapeHtml(s.title) + '\', \'' + escapeHtml(s.artist) + '\')">💎 预留/合作</button>' +
                    '</div>' +

            }).join('');

// ==================== 4. 点赞功能（防刷） ====================
window.likeSong = async (id, cat) => {
    const song = allSongs[cat]?.find(s => s.id === id);
    if (!song) return;
    
    let userId = localStorage.getItem('userId');
    if (!userId) {
        userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
        localStorage.setItem('userId', userId);
    }
    
    try {
        const client = await ensureSupabase();
        const { data: existing } = await client
            .from('likes')
            .select('*')
            .eq('work_id', id)
            .eq('user_id', userId);
        
        if (existing && existing.length > 0) {
            alert('⏰ 你已经点过赞啦！每首歌只能点赞一次哦~');
            return;
        }
        
        await client.from('likes').insert([{ user_id: userId, work_id: id }]);
        
        const newLikes = (song.likes || 0) + 1;
        await client.from('songs').update({ likes: newLikes }).eq('id', id);
        song.likes = newLikes;
        renderAll();
        console.log('❤️ 点赞成功！');
    } catch (e) {
        console.error('点赞失败:', e);
        alert('点赞失败，请稍后重试');
    }
};

window.interest = (title, artist) => {
    alert('对《' + title + '》- ' + artist + ' 感兴趣？\n请添加芦苇老师微信：jianjiayinyue 协助对接版权/演出/发行。');
};

// ==================== 播放控制 + 均衡器 ====================
let currentSongId = null;
let eqAnimationId = null;

function togglePlay(songId, audioUrl, title, artist) {
    let player = document.getElementById('global-audio');
    if (!player) {
        player = document.createElement('audio');
        player.id = 'global-audio';
        player.style.display = 'none';
        document.body.appendChild(player);
    }
    
    const playBtn = document.querySelector('.play-btn[data-song-id="' + songId + '"]');
    const eqContainer = document.getElementById('equalizer-' + songId);
    const card = document.querySelector('.rank-card[data-song-id="' + songId + '"]');
    
    if (currentSongId === songId) {
        if (!player.paused) {
            player.pause();
            stopEqualizer(songId);
            if (playBtn) {
                playBtn.textContent = '▶️ 播放';
                playBtn.classList.remove('playing');
            }
            if (card) card.classList.remove('playing');
            return;
        } else {
            player.play();
            if (playBtn) {
                playBtn.textContent = '⏸ 暂停';
                playBtn.classList.add('playing');
            }
            if (card) card.classList.add('playing');
            startEqualizer(songId);
            return;
        }
    }
    
    if (currentSongId) {
        stopEqualizer(currentSongId);
        const oldBtn = document.querySelector('.play-btn[data-song-id="' + currentSongId + '"]');
        if (oldBtn) {
            oldBtn.textContent = '▶️ 播放';
            oldBtn.classList.remove('playing');
        }
        const oldCard = document.querySelector('.rank-card[data-song-id="' + currentSongId + '"]');
        if (oldCard) oldCard.classList.remove('playing');
    }
    
    currentSongId = songId;
    player.src = audioUrl;
    player.load();
    player.play();
    
    if (playBtn) {
        playBtn.textContent = '⏸ 暂停';
        playBtn.classList.add('playing');
    }
    if (card) card.classList.add('playing');
    if (eqContainer) {
        eqContainer.style.display = 'flex';
        eqContainer.classList.add('active');
    }
    
    startEqualizer(songId);
    
    player.onended = function() {
        stopEqualizer(songId);
        if (playBtn) {
            playBtn.textContent = '▶️ 播放';
            playBtn.classList.remove('playing');
        }
        if (card) card.classList.remove('playing');
        currentSongId = null;
    };
}

function startEqualizer(songId) {
    const bars = document.querySelectorAll('#equalizer-' + songId + ' .eq-bar');
    if (!bars.length) return;
    
    function animateEqualizer() {
        bars.forEach(function(bar, index) {
            const base = 8 + Math.random() * 35;
            const waveOffset = Math.sin(Date.now() / 300 + index * 0.3) * 5;
            let height = base + waveOffset;
            height = Math.max(4, Math.min(55, height));
            bar.style.height = height + 'px';
        });
        eqAnimationId = requestAnimationFrame(animateEqualizer);
    }
    
    if (eqAnimationId) cancelAnimationFrame(eqAnimationId);
    animateEqualizer();
}

function stopEqualizer(songId) {
    if (eqAnimationId) {
        cancelAnimationFrame(eqAnimationId);
        eqAnimationId = null;
    }
    const eqContainer = document.getElementById('equalizer-' + songId);
    if (eqContainer) {
        eqContainer.style.display = 'none';
        eqContainer.classList.remove('active');
    }
    const bars = document.querySelectorAll('#equalizer-' + songId + ' .eq-bar');
    bars.forEach(function(bar) {
        bar.style.height = (8 + Math.random() * 12) + 'px';
    });
}

// ==================== 5. 上传功能 ====================
async function handleUpload(container, modal) {
    if (!container) {
        console.error('❌ container 为空');
        alert('页面加载异常，请刷新重试');
        return;
    }
    
    const submitBtn = container.querySelector('#submitBtn');
    if (!submitBtn) {
        console.error('❌ 找不到提交按钮');
        alert('页面加载异常，请刷新重试');
        return;
    }
    
    const category = container.querySelector('#category')?.value || 'ai';
    const artist = container.querySelector('#artistName')?.value?.trim() || '';
    const title = container.querySelector('#songTitle')?.value?.trim() || '';
    const audioFile = container.querySelector('#audioFile')?.files?.[0];
    const genre = container.querySelector('#genre')?.value?.trim() || '';
    const contactInfo = container.querySelector('#contactInfo')?.value?.trim() || '';
    const isDemoChecked = container.querySelector('#isDemo')?.checked || false;
    const promiseChecked = container.querySelector('#promise')?.checked || false;
    
    if (!artist) { alert('请填写艺名'); return; }
    if (!title) { alert('请填写歌名'); return; }
    if (!audioFile) { alert('请选择音频文件'); return; }
    if (!promiseChecked) { alert('请勾选承诺书'); return; }
    if ((category === 'hybrid' || category === 'original') && !contactInfo) {
        alert('人机共创榜 / 原创作品榜 必须填写联系方式');
        return;
    }
    
    const progressDiv = container.querySelector('#uploadProgress');
    const progressBar = container.querySelector('#progressBar');
    const progressText = container.querySelector('#progressText');
    const originalText = submitBtn.textContent;
    
    if (progressDiv) progressDiv.style.display = 'block';
    if (progressBar) progressBar.style.width = '0%';
    if (progressText) progressText.textContent = '⏳ 准备上传...';
    submitBtn.textContent = '⏳ 上传中...';
    submitBtn.disabled = true;
    submitBtn.style.opacity = '0.6';
    
    try {
        const client = await ensureSupabase();
        
        if (progressBar) progressBar.style.width = '20%';
        if (progressText) progressText.textContent = '⏳ 正在上传音频... 20%';
        
        const fileExt = audioFile.name.split('.').pop();
        const fileName = Date.now() + '_' + Math.random().toString(36).substring(2, 8) + '.' + fileExt;
        
        const { error: uploadError } = await client.storage.from('audio').upload(fileName, audioFile);
        if (uploadError) {
            alert('音频上传失败: ' + uploadError.message);
            resetBtn();
            return;
        }
        
        if (progressBar) progressBar.style.width = '60%';
        if (progressText) progressText.textContent = '⏳ 正在保存歌曲信息... 60%';
        
        const { data: publicUrlData } = client.storage.from('audio').getPublicUrl(fileName);
        const audioUrl = publicUrlData.publicUrl;
        
        const newSong = {
            id: Date.now().toString() + '_' + Math.random().toString(36).substring(2, 6),
            category: category,
            title: title,
            artist: artist,
            genre: genre || '未分类',
            audio_url: audioUrl,
            contact: contactInfo || '',
            is_demo: isDemoChecked,
            likes: 0,
            status: 'pending',
            melody_by: container.querySelector('#melodyBy')?.value || '',
            lyrics_by: container.querySelector('#lyricsBy')?.value || '',
            arrangement_by: container.querySelector('#arrangementBy')?.value || ''
        };
        
        if (progressBar) progressBar.style.width = '80%';
        if (progressText) progressText.textContent = '⏳ 正在提交审核... 80%';
        
        const { error: insertError } = await client.from('songs').insert([newSong]);
        if (insertError) {
            alert('提交失败: ' + insertError.message);
            resetBtn();
            return;
        }
        
        if (progressBar) progressBar.style.width = '100%';
        if (progressText) {
            progressText.textContent = '✅ 提交成功！';
            progressText.style.color = '#4CAF50';
        }
        
        await new Promise(resolve => setTimeout(resolve, 500));
        
        alert('✅ 提交成功！审核通过后会立刻展示在对应榜单。');
        
        container.querySelector('#artistName').value = '';
        container.querySelector('#songTitle').value = '';
        container.querySelector('#genre').value = '';
        container.querySelector('#audioFile').value = '';
        container.querySelector('#contactInfo').value = '';
        container.querySelector('#isDemo').checked = false;
        if (container.querySelector('#melodyBy')) container.querySelector('#melodyBy').value = '';
        if (container.querySelector('#lyricsBy')) container.querySelector('#lyricsBy').value = '';
        if (container.querySelector('#arrangementBy')) container.querySelector('#arrangementBy').value = '';
        container.querySelector('#promise').checked = false;
        
        modal.classList.remove('active');
        resetBtn();
        await loadSongs();
        
    } catch (error) {
        console.error('上传失败:', error);
        alert('上传失败，请检查网络后重试');
        resetBtn();
    }
    
    function resetBtn() {
        submitBtn.textContent = originalText || '✨ 提交审核 ✨';
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        if (progressDiv) {
            setTimeout(() => {
                progressDiv.style.display = 'none';
                if (progressBar) progressBar.style.width = '0%';
                if (progressText) {
                    progressText.textContent = '⏳ 正在上传音频...';
                    progressText.style.color = '#FFD966';
                }
            }, 2000);
        }
    }
}

// ==================== 6. 弹窗逻辑 ====================
function setupModalForm(modal) {
    const originalForm = document.getElementById('originalForm');
    const modalFormContainer = document.getElementById('modalUploadForm');
    
    if (!originalForm || !modalFormContainer) {
        console.error('找不到表单元素');
        return;
    }
    
    const clone = originalForm.cloneNode(true);
    clone.style.display = 'block';
    modalFormContainer.innerHTML = '';
    modalFormContainer.appendChild(clone);
    
    const categorySelect = clone.querySelector('#category');
    const hybridFields = clone.querySelector('#hybridFields');
    if (categorySelect && hybridFields) {
        categorySelect.onchange = function() {
            hybridFields.style.display = (this.value === 'hybrid' || this.value === 'original') ? 'block' : 'none';
        };
        hybridFields.style.display = (categorySelect.value === 'hybrid' || categorySelect.value === 'original') ? 'block' : 'none';
    }
    
    const submitBtn = clone.querySelector('#submitBtn');
    if (submitBtn) {
        submitBtn.onclick = function(e) {
            e.preventDefault();
            handleUpload(clone, modal);
        };
    }
}

function initFloatingButton() {
    const floatingBtn = document.getElementById('floatingUploadBtn');
    const modal = document.getElementById('uploadModal');
    const closeBtn = document.getElementById('closeModalBtn');
    
    if (!floatingBtn || !modal) {
        console.error('找不到悬浮按钮或弹窗');
        return;
    }
    
    floatingBtn.onclick = function() {
        modal.classList.add('active');
        setupModalForm(modal);
    };
    
    if (closeBtn) {
        closeBtn.onclick = function() {
            modal.classList.remove('active');
        };
    }
    
    modal.onclick = function(e) {
        if (e.target === modal) {
            modal.classList.remove('active');
        }
    };
}

// ==================== 7. 启动 ====================
(async function init() {
    try {
        await initSupabase();
        await loadSongs();
        initFloatingButton();
        console.log('✅ 页面初始化完成');
    } catch (error) {
        console.error('❌ 初始化失败:', error);
    }
})();
</script>
