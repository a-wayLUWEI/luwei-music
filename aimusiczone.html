    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a3a2a 0%, #0e2a1f 100%);
            font-family: 'Segoe UI', 'Poppins', 'Noto Sans SC', system-ui;

        .container { max-width: 800px; margin: 0 auto; }

        .back-bar {
            display: flex;

            gap: 12px;

        .back-bar a {
            color: #AAD4B0;

            font-weight: bold;
        }

        .module-card {
            background: #0f281dcc;
            backdrop-filter: blur(4px);
            border-radius: 24px;
            border: 1px solid #F2C94C;
            padding: 16px 18px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;

            text-decoration: none;
            margin-bottom: 12px;
        }
        .module-card:active { transform: scale(0.98); background: #1a3a2a; }
        .module-icon {
            font-size: 2.2rem;
            width: 55px;
            height: 55px;
            background: #2a4a3a;

            display: flex;
            align-items: center;
            justify-content: center;
        }
        .module-info { flex: 1; }
        .module-name {
            font-size: 1rem;
            font-weight: bold;
            color: #FFD966;
            margin-bottom: 4px;
        }
        .module-desc {
            font-size: 0.65rem;
            color: #C8E6C9;
            line-height: 1.3;
        }
        .module-badge {
            font-size: 0.55rem;
            background: #E69A2E;
            color: #2D1E0C;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
            white-space: nowrap;
        }
        .footer {
            text-align: center;
            color: #b8aa78;
            font-size: 0.55rem;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #F2C94C40;
        }
    </style>
</head>
