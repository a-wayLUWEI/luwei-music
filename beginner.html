<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>芦苇音乐 · 音乐小白学习</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: linear-gradient(145deg, #1a3a2a 0%, #0e2a1f 100%); font-family: 'Segoe UI', 'Poppins', 'Noto Sans SC', system-ui; padding: 20px; position: relative; }
        .home-btn { position: fixed; bottom: 20px; left: 20px; background: #E69A2E; border: none; border-radius: 40px; padding: 8px 16px; z-index: 1000; cursor: pointer; font-weight: bold; color: #2D1E0C; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .home-btn:active { transform: scale(0.96); }
        .back-to-top { position: fixed; bottom: 20px; right: 20px; background: #E69A2E; border: none; border-radius: 40px; padding: 8px 12px; z-index: 1000; cursor: pointer; font-weight: bold; color: #2D1E0C; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .user-bar { background: #0f281dcc; border-radius: 60px; padding: 6px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(4px); border: 1px solid #F2C94C; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: #E69A2E; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .user-name { color: #FFD966; font-size: 0.8rem; font-weight: bold; }
        .user-score { background: #2a4a3a; padding: 3px 10px; border-radius: 40px; font-size: 0.65rem; color: #FFD966; }
        .login-btn { background: #E69A2E; border: none; padding: 5px 14px; border-radius: 40px; color: #2D1E0C; font-weight: bold; cursor: pointer; font-size: 0.7rem; }
        .game-panel { max-width: 800px; margin: 0 auto; background: #0f281d; border-radius: 48px; padding: 18px 20px 28px; }
        .status-bar { display: flex; justify-content: space-between; background: #10271e; padding: 8px 20px; border-radius: 100px; margin-bottom: 20px; }
        .level-badge, .score-badge { background: #2b4a38; padding: 4px 18px; border-radius: 60px; color: #F5ECD7; }
        .level-num, .score-val { font-size: 1.6rem; margin-left: 8px; color: #FFD966; }
        .challenge-area { background: #1a3a2a; border-radius: 40px; padding: 16px; margin-bottom: 20px; text-align: center; border: 1px solid #F2C94C; }
        .chord-name { font-size: 2rem; font-weight: 800; color: #FFD966; background: #00000040; display: inline-block; padding: 6px 24px; border-radius: 60px; }
        .chord-desc { font-size: 0.9rem; background: #1e372bcc; border-radius: 40px; padding: 6px 16px; display: inline-block; margin-top: 8px; color: #F5ECD7; }
        .progression-box { background: #2c4a3abb; border-radius: 28px; padding: 8px; margin-top: 12px; color: #F5ECD7; }
        .piano-stage { background: #0b1812; border-radius: 36px; padding: 16px 8px; margin: 15px 0; overflow-x: auto; }
        .piano-container { display: flex; min-width: max-content; }
        .piano-octave { display: flex; position: relative; height: 190px; margin-right: 4px; }
        .white-key { background: linear-gradient(to bottom, #fef8e7, #f0e7cf); width: 60px; height: 170px; border: 1px solid #8b7a62; border-radius: 0 0 12px 12px; cursor: pointer; z-index: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 14px; font-weight: bold; color: #4a3a2a; font-size: 12px; }
        .black-key { position: absolute; background: linear-gradient(145deg, #2c2c2c, #111); width: 40px; height: 105px; border-radius: 0 0 10px 10px; cursor: pointer; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 8px; color: #FFDE9E; font-size: 9px; pointer-events: auto; }
        .white-key:active, .white-key.active-touch { transform: translateY(3px); background: #ffefbf; }
        .black-key:active, .black-key.active-touch { transform: translateY(2px); background: #5a5a5a; }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 15px 0; }
        button { background: #3C6E4A; border: none; padding: 8px 18px; border-radius: 40px; font-weight: bold; color: white; cursor: pointer; font-family: inherit; transition: all 0.1s ease; }
        button:active { transform: scale(0.96); }
        .btn-primary { background: #E69A2E; color: #2D1E0C; }
        .feedback-bar { background: #0a1f17; border-radius: 28px; padding: 8px; text-align: center; font-size: 0.85rem; color: #C8E6C9; }
        .quiz-area { margin-top: 16px; background: #1a3a2a; border-radius: 32px; padding: 12px; }
        .lyric-question { font-size: 0.85rem; font-weight: bold; margin: 12px 0; color: #F5ECD7; line-height: 1.4; }
        .lyric-options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
        .lyric-opt-btn { background: #3C6E4A; padding: 5px 14px; border-radius: 40px; border: none; color: white; cursor: pointer; font-size: 0.75rem; }
        .lyric-opt-btn:active { transform: scale(0.95); }
        @media (max-width: 768px) {
            .white-key { width: 48px !important; height: 130px !important; }
            .black-key { width: 32px !important; height: 80px !important; }
            .chord-name { font-size: 1.5rem !important; }
            button { min-height: 44px; }
        }
        @media (max-width: 480px) {
            .white-key { width: 40px !important; height: 110px !important; }
            .black-key { width: 26px !important; height: 68px !important; }
        }
    </style>
    <!-- ========== 引入用户系统 ========== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
    <script src="api.js"></script>
    <script src="sync.js"></script>
</head>
<body>
<button class="home-btn" onclick="location.href='index.html'"> 返回首页</button>
<button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆ 顶部</button>
<div class="game-panel">
    <!-- 用户信息栏 -->
    <div class="user-bar" id="userBar">
        <div class="user-info">
            <div class="user-avatar"></div>
            <div>
                <div class="user-name" id="userName">加载中...</div>
                <div class="user-score" id="userScore">积分 0</div>
            </div>
        </div>
        <button class="login-btn" id="loginBtn" style="display:none;"> 登录</button>
        <button class="login-btn" id="logoutBtn" style="display:none;"> 退出</button>
    </div>
    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="level-badge"> 和弦·关卡 <span class="level-num" id="levelValue">1</span></div>
        <div class="score-badge">✨ 智慧积分 <span class="score-val" id="scoreValue">0</span></div>
    </div>
    <!-- 挑战区 -->
    <div class="challenge-area">
        <div class="chord-name" id="chordNameDisplay">C 大三和弦</div>
        <div class="chord-desc" id="chordDesc">大三度+纯五度</div>
        <div class="progression-box"><span> 和弦进行知识点</span><span id="progressionText">I - IV - V - I</span></div>
    </div>
    <!-- 钢琴键盘 -->
    <div class="piano-stage"><div class="piano-container" id="pianoKeyboard"></div></div>
    <!-- 控制按钮 -->
    <div class="controls">
        <button id="checkChordBtn" class="btn-primary">✅ 验证+闯关</button>
        <button id="clearNotesBtn">️ 清空</button>
        <button id="resetGameBtn"> 重置进度</button>
    </div>
    <!-- 乐理闯关区 -->
    <div id="quizArea" class="quiz-area"></div>
    <div class="feedback-bar" id="globalFeedback">✨ 点击钢琴键 → 连续答对8题过关</div>
</div>
<script>
// ==================== 音乐小白学习模块 ====================
// 工具函数
function toStandard(n) { let m = { "C#":"Db", "D#":"Eb", "F#":"Gb", "G#":"Ab", "A#":"Bb" }; return m[n] || n; }
function eqArr(a, b) { if (a.length !== b.length) return false; let sa = a.map(toStandard).sort(), sb = b.map(toStandard).sort(); return sa.every((v,i)=>v===sb[i]); }
function msg(t, c) { let fb = document.getElementById("globalFeedback"); if(fb) { fb.innerHTML = t; fb.style.color = c || "#C8E6C9"; } }
// 更新用户界面
function updateUserUI() {
    const user = getCurrentUser();
    const userNameSpan = document.getElementById('userName');
    const userScoreSpan = document.getElementById('userScore');
    const scoreValueSpan = document.getElementById('scoreValue');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    if (user) {
        userNameSpan.innerText = user.nickname || '芦苇同学';
        userScoreSpan.innerText = `积分 ${user.score || 0}`;
        if (scoreValueSpan) scoreValueSpan.innerText = user.score || 0;
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'block';
    } else {
        userNameSpan.innerText = '未登录';
        userScoreSpan.innerText = '积分 0';
        if (scoreValueSpan) scoreValueSpan.innerText = '0';
        loginBtn.style.display = 'block';
        logoutBtn.style.display = 'none';
    }
}
// 更新云端积分
async function updateCloudScore(amount, reason) {
    const result = await API.addScore(amount, reason);
    if (result.code === 0) {
        const user = getCurrentUser();
        if (user) {
            user.score = result.newScore;
            localStorage.setItem(AUTH_CONFIG.USER_KEY, JSON.stringify(user));
            updateUserUI();
        }
        return result.newScore;
    }
    return null;
}
// 记录通关到云端
async function recordLevelCompletion(levelId, levelScore) {
    const result = await API.completeLevel(levelId, levelScore);
    if (result.code === 0) {
        // 同时更新本地
        const userId = getCurrentUser()?.user_id || "mock_user";
        localStorage.setItem(`level_${levelId}_${userId}`, "true");
    }
    return result;
}
// 和弦题库
const questionBank = {
    1: [
        { q: "C大三和弦的组成音是？", opts: ["C-E-G", "C-D-E", "C-F-A", "C-G-B"], ans: 0, exp: "C大三和弦由C、E、G三个音组成。" },
        { q: "C大三和弦的三音是什么？", opts: ["C", "E", "G", "B"], ans: 1, exp: "三音是E，决定和弦的大小调色彩。" },
        { q: "C大三和弦的五音是什么？", opts: ["C", "E", "G", "B"], ans: 2, exp: "五音是G，起到稳定支撑的作用。" },
        { q: "C到E是几度？", opts: ["三度", "四度", "五度", "二度"], ans: 0, exp: "C-D-E，是大三度。" },
        { q: "大三和弦的情绪是？", opts: ["明亮欢快", "忧郁", "紧张", "科幻"], ans: 0, exp: "大三和弦明亮稳定。" },
        { q: "《稻香》以哪个和弦开头？", opts: ["C", "G", "Am", "F"], ans: 0, exp: "《稻香》以C和弦开始。" },
        { q: "C大三和弦在C大调里是第几级？", opts: ["Ⅰ", "Ⅱ", "Ⅴ", "Ⅵ"], ans: 0, exp: "Ⅰ级主和弦。" }
    ],
    2: [
        { q: "Dm小三和弦的组成音是？", opts: ["D-F-A", "D-F#-A", "D-E-A", "D-G-A"], ans: 0, exp: "Dm由D、F、A组成。" },
        { q: "小三度等于几个半音？", opts: ["2", "3", "4", "5"], ans: 1, exp: "3个半音，比如D到F。" },
        { q: "Dm在C大调中是第几级？", opts: ["Ⅰ", "Ⅱ", "Ⅴ", "Ⅵ"], ans: 1, exp: "Ⅱ级，经常出现在抒情段落。" }
    ],
    3: [
        { q: "G7和弦的组成音是？", opts: ["G-B-D-F", "G-B-D", "G-C-E-F", "G-A-D-F"], ans: 0, exp: "G7由G、B、D、F组成。" },
        { q: "G7在C大调中是第几级？", opts: ["Ⅰ", "Ⅳ", "Ⅴ", "Ⅵ"], ans: 2, exp: "Ⅴ级属七，是流行音乐的动力核心。" }
    ]
};
for(let i=1;i<=3;i++) while(questionBank[i].length<8) questionBank[i].push(questionBank[i][0]);
// 关卡数据
const levels = [
    { id:1, name:"C 大三和弦", target:["C","E","G"], desc:"大三度+纯五度", prog:"I - IV - V - I" },
    { id:2, name:"Dm 小三和弦", target:["D","F","A"], desc:"小三度+纯五度", prog:"I - V - vi - IV" },
    { id:3, name:"G7 属七和弦", target:["G","B","D","F"], desc:"大三+小七", prog:"V7 - I" },
    { id:4, name:"Cmaj7 大七和弦", target:["C","E","G","B"], desc:"大三+大七", prog:"Imaj7 - VIm7 - IIm7 - V7" },
    { id:5, name:"Em 小三和弦", target:["E","G","B"], desc:"小调和弦 · 忧郁感", prog:"Em - C - G - D" },
    { id:6, name:"Am 小三和弦", target:["A","C","E"], desc:"小调和弦 · 深情悲伤", prog:"Am - F - C - G" },
    { id:7, name:"F 大三和弦", target:["F","A","C"], desc:"下属和弦 · 温暖推进", prog:"F - G - C" },
    { id:8, name:"A 大三和弦", target:["A","C#","E"], desc:"明亮推动 · 力量爆发", prog:"A - D - E" },
    { id:9, name:"E 大三和弦", target:["E","G#","B"], desc:"辉煌结尾 · 上扬感", prog:"E - A - B - E" },
    { id:10, name:"D 大三和弦", target:["D","F#","A"], desc:"副歌推动 · 温暖上扬", prog:"D - A - Bm - G" },
    { id:11, name:"G 大三和弦", target:["G","B","D"], desc:"明亮民谣 · 吉他经典", prog:"G - C - D - G" },
    { id:12, name:"Bm 小三和弦", target:["B","D","F#"], desc:"隐藏的悲伤 · 暗流涌动", prog:"Bm - G - D - A" }
];
// 全局变量
let lvl = 0, score = 0, played = [], completed = false, streak = 0, currentQ = null;
let audioCtx = null;
let keys = new Map();
// 从 localStorage 恢复进度（云端优先）
function loadUserProgress() {
    const user = getCurrentUser();
    const userId = user?.user_id || "mock_user";
    // 恢复积分
    if (user?.score !== undefined) {
        score = user.score;
        document.getElementById("scoreValue").innerText = score;
    } else {
        let savedScore = localStorage.getItem(`user_score_${userId}`);
        if (savedScore) score = parseInt(savedScore);
        document.getElementById("scoreValue").innerText = score;
    }
    // 恢复关卡进度
    let savedLevel = localStorage.getItem(`current_level_${userId}`);
    if (savedLevel) {
        lvl = parseInt(savedLevel);
        if (lvl >= levels.length) lvl = levels.length - 1;
    }
    // 检查哪些关卡已通关
    for (let i = 0; i < levels.length; i++) {
        if (localStorage.getItem(`level_${i}_${userId}`) === "true") {
            // 已通关，可以跳过或记录
        }
    }
}
// 保存进度
function saveProgress() {
    const user = getCurrentUser();
    const userId = user?.user_id || "mock_user";
    localStorage.setItem(`current_level_${userId}`, lvl);
    if (user) {
        user.score = score;
        localStorage.setItem(AUTH_CONFIG.USER_KEY, JSON.stringify(user));
    }
}
// 钢琴键盘
function buildPiano() {
    let cont = document.getElementById("pianoKeyboard"); 
    if(!cont) return;
    cont.innerHTML = ""; keys.clear();
    let white = ["C","D","E","F","G","A","B"];
    let blacks = [{a:0,s:"C#",f:"Db"},{a:1,s:"D#",f:"Eb"},{a:3,s:"F#",f:"Gb"},{a:4,s:"G#",f:"Ab"},{a:5,s:"A#",f:"Bb"}];
    [4,5].forEach(oct => {
        let octDiv = document.createElement('div'); octDiv.className = 'piano-octave'; octDiv.style.position = 'relative';
        let wEls = [];
        white.forEach(n => {
            let w = document.createElement('div'); w.className = 'white-key'; 
            w.innerHTML = `<span class="key-label">${n+oct}</span>`;
            w.onmousedown = w.ontouchstart = e => { e.preventDefault(); onPress(n); };
            octDiv.appendChild(w); wEls.push(w);
            if(!keys.has(n)) keys.set(n,[]); keys.get(n).push(w);
        });
        let bc = document.createElement('div'); bc.style.position = 'absolute'; bc.style.top = 0; bc.style.left = 0;
        bc.style.width = '100%'; bc.style.height = '115px'; bc.style.pointerEvents = 'auto';
        octDiv.appendChild(bc); cont.appendChild(octDiv);
        setTimeout(() => {
            blacks.forEach(c => {
                let tw = wEls[c.a]; if(tw) {
                    let rect = tw.getBoundingClientRect(), or = octDiv.getBoundingClientRect();
                    let left = rect.right - or.left - 20;
                    let bk = document.createElement('div'); bk.className = 'black-key'; 
                    bk.style.left = left + 'px'; bk.style.width = '40px';
                    bk.innerHTML = `<span class="key-label">${c.s+oct}</span>`;
                    bk.onmousedown = bk.ontouchstart = e => { e.preventDefault(); e.stopPropagation(); onPress(c.s); };
                    bc.appendChild(bk);
                    if(!keys.has(c.s)) keys.set(c.s,[]); keys.get(c.s).push(bk);
                    if(!keys.has(c.f)) keys.set(c.f,[]); keys.get(c.f).push(bk);
                }
            });
        }, 20);
    });
}
function playSound(n) { 
    const noteMap = {'C':0,'Db':1,'D':2,'Eb':3,'E':4,'F':5,'Gb':6,'G':7,'Ab':8,'A':9,'Bb':10,'B':11};
    if(!audioCtx) audioCtx = new AudioContext(); 
    if(audioCtx.state==='suspended') audioCtx.resume(); 
    let f = 261.63 * Math.pow(2, (noteMap[toStandard(n)]||0)/12); 
    let o = audioCtx.createOscillator(), g = audioCtx.createGain(); 
    o.type = 'sine'; o.frequency.value = f; g.gain.value = 0.28; 
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+1); 
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+1); 
}
function highlight(n, a) { let ks = keys.get(n); if(ks) ks.forEach(k => { if(a) k.classList.add('active-touch'); else k.classList.remove('active-touch'); }); }
function refresh() { for(let [k,arr] of keys) arr.forEach(k => { k.style.filter = ""; k.classList.remove('key-highlight'); }); played.forEach(n => { let ks = keys.get(n); if(ks) ks.forEach(k => { k.style.filter = "brightness(1.2) drop-shadow(0 0 8px gold)"; k.classList.add('key-highlight'); }); }); }
function onPress(n) { 
    if(completed) { msg(" 本关已过"); return; } 
    playSound(n); highlight(n, true); setTimeout(()=>highlight(n,false),150); 
    let std = toStandard(n); 
    if(!played.includes(std)) { played.push(std); refresh(); msg(`➕ 按下 ${n} → ${std} | [${played.join(',')}]`); } 
    else msg(`⚠️ ${std}已存在`); 
}
// 关卡加载
function loadLevel() {
    if(lvl >= levels.length){ document.getElementById("chordNameDisplay").innerHTML=" 和弦大师毕业！"; completed=true; return; }
    let L = levels[lvl];
    document.getElementById("chordNameDisplay").innerHTML = L.name;
    document.getElementById("chordDesc").innerHTML = L.desc;
    document.getElementById("progressionText").innerHTML = L.prog;
    document.getElementById("levelValue").innerHTML = L.id;
    completed = false;
    played = [];
    refresh();
    streak = 0;
    let qa = document.getElementById("quizArea");
    if(qa) qa.innerHTML = '';
    nextQuiz();
}
function nextQuiz() {
    if(completed) return;
    if(streak >= 8){ advance(); return; }
    let qb = questionBank[levels[lvl].id] || questionBank[1];
    currentQ = qb[Math.floor(Math.random() * qb.length)];
    let qa = document.getElementById("quizArea");
    qa.innerHTML = `<div style="color:#F2C94C; margin-bottom:8px"> 乐理闯关 · 第${streak+1}/8题</div><div class="lyric-question">${currentQ.q}</div><div class="lyric-options" id="quizOpts"></div><div id="quizFeed" style="color:#C8E6C9; font-size:0.75rem; text-align:center; margin-top:8px"></div>`;
    let optsDiv = document.getElementById("quizOpts");
    currentQ.opts.forEach((opt,i)=>{
        let btn = document.createElement("button"); btn.className="lyric-opt-btn"; btn.innerText=opt;
        btn.onclick=()=>{
            if(i===currentQ.ans){
                streak++;
                document.getElementById("quizFeed").innerHTML = "✅ 正确！继续下一题";
                msg("✓ 回答正确");
                nextQuiz();
            } else {
                streak=0;
                document.getElementById("quizFeed").innerHTML = `❌ 错误！正确答案：${currentQ.opts[currentQ.ans]}。 ${currentQ.exp}`;
                msg("❌ 连击中断，重新开始8题");
                nextQuiz();
            }
        };
        optsDiv.appendChild(btn);
    });
}
async function advance() {
    if(!eqArr(played, levels[lvl].target)){
        msg("和弦不正确！请重新弹奏");
        streak = 0;
        nextQuiz();
        return;
    }
    let add = 120 + (lvl + 1) * 15;
    score += add;
    document.getElementById("scoreValue").innerText = score;
    completed = true;
    msg(`✨ 闯关成功！ +${add}分 ✨`);
    // 保存到云端
    await updateCloudScore(add, `通关第${lvl+1}关`);
    await recordLevelCompletion(lvl, score);
    saveProgress();
    const quotes = ["和弦是音乐的骨架", "坚持每天10分钟", "慢慢来，比较快", "情绪到位，音乐自然好听"];
    alert(" 芦苇说：" + quotes[Math.floor(Math.random() * quotes.length)]);
    if(lvl + 1 < levels.length){
        lvl++;
        saveProgress();
        loadLevel();
    } else {
        msg(" 和弦大师毕业！恭喜你！");
    }
}
function clearAll(){ played=[]; refresh(); msg("️ 清空所有音符，重新弹奏吧"); }
async function resetAll() {
    if(confirm("确定重置所有进度吗？积分和通关记录将清空")){
        lvl=0; score=0; played=[]; streak=0;
        document.getElementById("scoreValue").innerText="0";
const user = getCurrentUser();
        const userId = user?.user_id || "mock_user";
        for(let i=0; i<levels.length; i++) {
            localStorage.removeItem(`level_${i}_${userId}`);
        }
        localStorage.removeItem(`current_level_${userId}`);
        localStorage.removeItem(`user_score_${userId}`);
        if(user) {
            user.score = 0;
            localStorage.setItem(AUTH_CONFIG.USER_KEY, JSON.stringify(user));
            await updateCloudScore(0, "重置");
        }
        loadLevel();
        refresh();
        msg(" 游戏已重置，从三和弦重新出发！");
    }
}
// 登录/退出
document.getElementById('loginBtn')?.addEventListener('click', () => { showLoginModal(); });
document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); location.reload(); });
// 页面点击启用音频
document.body.onclick = () => { if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };
document.getElementById("checkChordBtn").onclick = () => { if(!completed && streak>=8 && eqArr(played, levels[lvl].target)) advance(); else if(streak<8) msg("请先连续答对8道乐理题"); else msg("和弦不正确"); };
document.getElementById("clearNotesBtn").onclick = clearAll;
document.getElementById("resetGameBtn").onclick = resetAll;
// 登录成功回调
window.onLoginSuccess = function(user) {
    updateUserUI();
    loadUserProgress();
    loadLevel();
};
// 初始化
buildPiano();
updateUserUI();
loadUserProgress();
loadLevel();
</script>
