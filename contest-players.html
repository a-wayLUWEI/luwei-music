<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>参赛选手 · 芦苇音乐</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="follow.js"></script>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #050505 0%, #0a0a0a 12%, #111111 24%, #1a1a1a 36%, #1a1a3a 46%, #4a4a8a 52%, #6a5a9a 56%, #4a4a8a 60%, #1a1a3a 66%, #1a1a1a 74%, #2a2a2a 82%, #4a4a4a 88%, #2a2a2a 94%, #1a1a1a 100%);
    background-size: 600% 600%;
    color: #e8e9f0;
    padding: 20px 20px 100px;
    animation: bodyGradientFlow 14s ease-in-out infinite alternate;
    min-height: 100vh;
}
@keyframes bodyGradientFlow {
    0% { background-position: 0% 50%; }
    14% { background-position: 14% 50%; }
    28% { background-position: 28% 50%; }
    42% { background-position: 42% 50%; }
    57% { background-position: 57% 50%; }
    71% { background-position: 71% 50%; }
    85% { background-position: 85% 50%; }
    100% { background-position: 100% 50%; }
}
.container { max-width: 900px; margin: 0 auto; }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
}
.header h1 {
    font-size: 24px;
    background: linear-gradient(135deg, #d4b896, #f0e0c8, #b8a0c8, #d4b896);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.header .back {
    color: rgba(255,255,255,0.3);
    text-decoration: none;
    font-size: 0.85rem;
    padding: 4px 14px;
    border: 1px solid rgba(212,184,150,0.06);
    border-radius: 30px;
    transition: 0.3s;
}
.header .back:hover {
    color: rgba(255,255,255,0.5);
    border-color: rgba(212,184,150,0.15);
}

.section-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    margin-bottom: 16px;
    letter-spacing: 2px;
}

.player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
}

.player-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.06);
    border-radius: 16px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}
.player-card:hover {
    border-color: rgba(212,184,150,0.15);
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.player-card .avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4b896, #b8a0c8);
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    color: #1a1a2e;
}
.player-card .name {
    font-size: 0.95rem;
    font-weight: 600;
    color: #d4b896;
}
.player-card .count {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.25);
    margin-top: 4px;
}
.player-card .follow-btn {
    margin-top: 10px;
    padding: 4px 16px;
    border-radius: 20px;
    border: 1px solid rgba(212,184,150,0.1);
    background: rgba(255,255,255,0.02);
    color: rgba(255,255,255,0.3);
    font-size: 0.6rem;
    cursor: pointer;
    transition: 0.3s;
    letter-spacing: 1px;
}
.player-card .follow-btn:hover {
    border-color: rgba(212,184,150,0.25);
    color: rgba(255,255,255,0.5);
}
.player-card .follow-btn.followed {
    color: #e88a8a;
    border-color: rgba(232,138,138,0.2);
}

.empty {
    text-align: center;
    color: rgba(255,255,255,0.15);
    padding: 60px 0;
}

.loading {
    text-align: center;
    color: rgba(255,255,255,0.15);
    padding: 60px 0;
}

.footer {
    text-align: center;
    font-size: 0.7rem;
    margin-top: 40px;
    color: rgba(255,255,255,0.1);
}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1> 参赛选手</h1>
        <a href="aimusic.html" class="back">← 返回榜单</a>
    </div>

    <div class="section-title"> 所有参赛选手</div>
    <div class="player-grid" id="playerGrid">
        <div class="loading">加载中...</div>
    </div>

    <div class="footer">© 芦苇音乐 · 在芦苇深处，治愈自己的思念</div>
</div>

<script>
// ===== Supabase 配置 =====
const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

let supabaseClient = null;
let isSupabaseReady = false;

function initSupabase() {
    return new Promise((resolve, reject) => {
        if (isSupabaseReady && supabaseClient) {
            resolve(supabaseClient);
            return;
        }
        if (typeof supabase !== 'undefined' && supabase.createClient) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            isSupabaseReady = true;
            resolve(supabaseClient);
            return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        script.onload = function() {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                isSupabaseReady = true;
                resolve(supabaseClient);
            } else {
                reject(new Error('Supabase 加载失败'));
            }
        };
        script.onerror = function() { reject(new Error('Supabase CDN 加载失败')); };
        document.head.appendChild(script);
    });
}

async function ensureSupabase() {
    if (isSupabaseReady && supabaseClient) return supabaseClient;
    return await initSupabase();
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function showToast(msg) {
    const oldToast = document.getElementById('toast');
    if (oldToast) oldToast.remove();
    const toast = document.createElement('div');
    toast.id = 'toast';
    toast.textContent = msg;
    toast.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(26,26,46,0.95);
        color: #d4b896;
        padding: 14px 28px;
        border-radius: 40px;
        border: 1px solid rgba(212,184,150,0.15);
        backdrop-filter: blur(20px);
        z-index: 9999;
        font-size: 0.9rem;
        animation: fadeInUp 0.3s ease;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        pointer-events: none;
        max-width: 80%;
        text-align: center;
        font-weight: 500;
    `;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 350);
    }, 2200);
}

// ===== 加载参赛选手 =====
async function loadPlayers() {
    const grid = document.getElementById('playerGrid');
    grid.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const client = await ensureSupabase();

        // 1. 从 songs 表按 artist 分组，统计作品数
        const { data: songsData, error: songsError } = await client
            .from('songs')
            .select('artist')
            .eq('status', 'active');

        if (songsError) throw songsError;

        const artistMap = {};
        songsData.forEach(s => {
            if (s.artist) {
                artistMap[s.artist] = (artistMap[s.artist] || 0) + 1;
            }
        });

        const artists = Object.keys(artistMap).map(name => ({
            name: name,
            songCount: artistMap[name]
        }));

        artists.sort((a, b) => b.songCount - a.songCount);

        if (artists.length === 0) {
            grid.innerHTML = '<div class="empty">暂无参赛选手</div>';
            return;
        }

        // 2. 🆕 查询每个选手的粉丝数
        const artistIds = artists.map(a => 'artist_' + a.name);
        let followerCountMap = {};
        try {
            const { data: allFollows } = await client
                .from('follows')
                .select('following_id')
                .in('following_id', artistIds);
            if (allFollows) {
                allFollows.forEach(f => {
                    followerCountMap[f.following_id] = (followerCountMap[f.following_id] || 0) + 1;
                });
            }
        } catch (e) {
            console.warn('获取粉丝数失败:', e);
        }

        // 3. 获取当前用户的关注状态
        const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
        let followedMap = {};
        if (user.user_id && artists.length > 0) {
            try {
                const { data: follows } = await client
                    .from('follows')
                    .select('following_id')
                    .eq('follower_id', user.user_id)
                    .in('following_id', artistIds);
                if (follows) {
                    follows.forEach(f => { followedMap[f.following_id] = true; });
                }
            } catch (e) {
                console.warn('获取关注状态失败:', e);
            }
        }

        // 4. 渲染
        grid.innerHTML = artists.map(a => {
            const targetId = 'artist_' + a.name;
            const isFollowed = followedMap[targetId] || false;
            const followerCount = followerCountMap[targetId] || 0;
            return `
                <div class="player-card" onclick="goToPlayer('${escapeHtml(a.name)}')">
                    <div class="avatar">🎤</div>
                    <div class="name">${escapeHtml(a.name)}</div>
                    <div class="count">${a.songCount} 首参赛作品 · ❤️ ${followerCount} 粉丝</div>
                    <button class="follow-btn ${isFollowed ? 'followed' : ''}" onclick="event.stopPropagation(); handleFollow('${escapeHtml(a.name)}', this)">
                        ${isFollowed ? '❤️ 已关注' : '🤍 关注'}
                    </button>
                </div>
            `;
        }).join('');

    } catch (e) {
        console.error('加载失败:', e);
        grid.innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
    }
}

// ===== 跳转到该选手的参赛作品 =====
function goToPlayer(artistName) {
    window.location.href = `aimusic.html?artist=${encodeURIComponent(artistName)}`;
}

// ===== 关注功能（参赛选手版） =====
async function handleFollow(artistName, btnElement) {
    if (!artistName) {
        showToast('⚠️ 艺名无效');
        return;
    }

    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.user_id) {
        alert('请先登录再关注 ');
        window.location.href = 'index.html';
        return;
    }

    const targetId = 'artist_' + artistName;

    try {
        const client = await ensureSupabase();
        const { data: existing } = await client
            .from('follows')
            .select('*')
            .eq('follower_id', user.user_id)
            .eq('following_id', targetId);

        if (existing && existing.length > 0) {
            // 取消关注
            await client
                .from('follows')
                .delete()
                .eq('follower_id', user.user_id)
                .eq('following_id', targetId);
            btnElement.textContent = '🤍 关注';
            btnElement.classList.remove('followed');
            showToast('已取消关注');
        } else {
            // 关注
            await client
                .from('follows')
                .insert([{ follower_id: user.user_id, following_id: targetId }]);
            btnElement.textContent = '❤️ 已关注';
            btnElement.classList.add('followed');
            showToast('✅ 已关注 ' + artistName);
        }
    } catch (e) {
        console.error('关注操作失败:', e);
        alert('操作失败，请重试');
    }
}

// ===== 启动 =====
document.addEventListener('DOMContentLoaded', function() {
    loadPlayers();
});
</script>

</body>
</html>
