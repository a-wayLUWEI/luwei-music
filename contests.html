<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>比赛列表 · 芦苇音乐</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #050505 0%, #0a0a0a 12%, #111111 24%, #1a1a1a 36%, #1a1a3a 46%, #4a4a8a 52%, #6a5a9a 56%, #4a4a8a 60%, #1a1a3a 66%, #1a1a1a 74%, #2a2a2a 82%, #4a4a4a 88%, #2a2a2a 94%, #1a1a1a 100%);
    background-size: 600% 600%;
    color: #e8e9f0;
    padding: 20px 20px 100px;
    animation: bodyGradientFlow 14s ease-in-out infinite alternate;
    min-height: 100vh;
}
@keyframes bodyGradientFlow {
    0% { background-position: 0% 50%; }
    14% { background-position: 14% 50%; }
    28% { background-position: 28% 50%; }
    42% { background-position: 42% 50%; }
    57% { background-position: 57% 50%; }
    71% { background-position: 71% 50%; }
    85% { background-position: 85% 50%; }
    100% { background-position: 100% 50%; }
}
.container { max-width: 900px; margin: 0 auto; }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
}
.header h1 {
    font-size: 24px;
    background: linear-gradient(135deg, #d4b896, #f0e0c8, #b8a0c8, #d4b896);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.header .back {
    color: rgba(255,255,255,0.3);
    text-decoration: none;
    font-size: 0.85rem;
    padding: 4px 14px;
    border: 1px solid rgba(212,184,150,0.06);
    border-radius: 30px;
    transition: 0.3s;
}
.header .back:hover {
    color: rgba(255,255,255,0.5);
    border-color: rgba(212,184,150,0.15);
}

.section-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    margin-bottom: 16px;
    letter-spacing: 2px;
    margin-top: 24px;
}

.contest-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
}
.contest-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.06);
    border-radius: 16px;
    padding: 20px;
    transition: 0.3s;
    text-decoration: none;
    color: inherit;
    display: block;
}
.contest-card:hover {
    border-color: rgba(212,184,150,0.15);
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.contest-card .cover {
    width: 100%;
    height: 120px;
    border-radius: 8px;
    object-fit: cover;
    background: rgba(255,255,255,0.03);
    margin-bottom: 12px;
}
.contest-card .title {
    font-size: 1rem;
    font-weight: 600;
    color: #d4b896;
}
.contest-card .desc {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.3);
    margin-top: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.contest-card .meta {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.2);
}
.contest-card .status {
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.6rem;
    font-weight: 600;
}
.contest-card .status.active {
    background: rgba(255,215,0,0.15);
    color: #ffd700;
}
.contest-card .status.ended {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.2);
}
.contest-card .status.draft {
    background: rgba(100,100,200,0.1);
    color: rgba(100,100,200,0.5);
}

.empty {
    text-align: center;
    color: rgba(255,255,255,0.15);
    padding: 60px 0;
}
.loading {
    text-align: center;
    color: rgba(255,255,255,0.15);
    padding: 60px 0;
}
.footer {
    text-align: center;
    font-size: 0.7rem;
    margin-top: 40px;
    color: rgba(255,255,255,0.1);
}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1> 比赛列表</h1>
        <a href="aimusic.html" class="back">← 返回榜单</a>
    </div>

    <div id="contestList">
        <div class="loading">加载中...</div>
    </div>

    <div class="footer">© 芦苇音乐 · 在芦苇深处，治愈自己的思念</div>
</div>

<script>
const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

let supabaseClient = null;
let isSupabaseReady = false;

function initSupabase() {
    return new Promise((resolve, reject) => {
        if (isSupabaseReady && supabaseClient) {
            resolve(supabaseClient);
            return;
        }
        if (typeof supabase !== 'undefined' && supabase.createClient) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            isSupabaseReady = true;
            resolve(supabaseClient);
            return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        script.onload = function() {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                isSupabaseReady = true;
                resolve(supabaseClient);
            } else {
                reject(new Error('Supabase 加载失败'));
            }
        };
        script.onerror = function() { reject(new Error('Supabase CDN 加载失败')); };
        document.head.appendChild(script);
    });
}

async function ensureSupabase() {
    if (isSupabaseReady && supabaseClient) return supabaseClient;
    return await initSupabase();
}

function getStatusLabel(status) {
    const map = {
        'active': '进行中',
        'ended': '已结束',
        'draft': '草稿'
    };
    return map[status] || status;
}

function getStatusClass(status) {
    const map = {
        'active': 'active',
        'ended': 'ended',
        'draft': 'draft'
    };
    return map[status] || '';
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return d.toLocaleDateString('zh-CN');
}

async function loadContests() {
    const container = document.getElementById('contestList');
    try {
        const client = await ensureSupabase();
        const { data, error } = await client
            .from('contests')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty">暂无比赛</div>';
            return;
        }

        // 按状态分组
        const active = data.filter(c => c.status === 'active');
        const ended = data.filter(c => c.status === 'ended');
        const draft = data.filter(c => c.status === 'draft');

        let html = '';

        if (active.length > 0) {
            html += `<div class="section-title"> 进行中</div>`;
            html += `<div class="contest-grid">`;
            active.forEach(c => html += renderCard(c));
            html += `</div>`;
        }

        if (ended.length > 0) {
            html += `<div class="section-title"> 已结束</div>`;
            html += `<div class="contest-grid">`;
            ended.forEach(c => html += renderCard(c));
            html += `</div>`;
        }

        if (draft.length > 0) {
            html += `<div class="section-title"> 草稿</div>`;
            html += `<div class="contest-grid">`;
            draft.forEach(c => html += renderCard(c));
            html += `</div>`;
        }

        container.innerHTML = html;

    } catch (e) {
        console.error('加载比赛失败:', e);
        container.innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
    }
}

function renderCard(contest) {
    return `
        <a href="contest.html?id=${contest.id}" class="contest-card">
            ${contest.cover_image ? `<img src="${contest.cover_image}" class="cover" alt="${contest.title}">` : `<div class="cover" style="background:linear-gradient(135deg,rgba(212,184,150,0.05),rgba(184,160,200,0.05));display:flex;align-items:center;justify-content:center;font-size:2rem;"></div>`}
            <div class="title">${escapeHtml(contest.title)}</div>
            <div class="desc">${escapeHtml(contest.description || '')}</div>
            <div class="meta">
                <span>${formatDate(contest.start_date)} - ${formatDate(contest.end_date)}</span>
                <span class="status ${getStatusClass(contest.status)}">${getStatusLabel(contest.status)}</span>
            </div>
        </a>
    `;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

document.addEventListener('DOMContentLoaded', function() {
    loadContests();
});
</script>

</body>
</html>
