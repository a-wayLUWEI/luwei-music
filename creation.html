<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

        .user-score { background: #2a4a3a; padding: 3px 10px; border-radius: 40px; font-size: 0.65rem; color: #FFD966; }
        .login-btn { background: #E69A2E; border: none; padding: 5px 14px; border-radius: 40px; color: #2D1E0C; font-weight: bold; cursor: pointer; font-size: 0.7rem; }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { color: #FFD966; font-size: 1.8rem; margin-bottom: 8px; }
        .header p { color: #AAD4B0; font-size: 0.8rem; }
        .section { background: #0f281dcc; border-radius: 32px; padding: 20px; margin-bottom: 20px; border: 1px solid #F2C94C; }
        .section-title { color: #FFD966; font-size: 1.2rem; font-weight: bold; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-left: 4px solid #E69A2E; padding-left: 12px; cursor: pointer; user-select: none; }

        .btn-primary { background: #E69A2E; color: #2D1E0C; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="api.js"></script>

</head>
<body>
<button class="home-btn" onclick="location.href='index.html'">🏠 返回首页</button>
<button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆ 顶部</button>
<div class="container">
    <div class="user-bar" id="userBar">

        </div>

    <div class="header">

    <!-- 歌词韵脚检测器 -->
    <div class="section">
        <div class="section-title" data-target="rhymeDetectContent">📝 歌词韵脚检测器 ▼</div>
        <div id="rhymeDetectContent" class="content-area">
            <textarea id="lyricRhymeInput" rows="3" placeholder="粘贴你的歌词...&#10;每行一句，会自动检测结尾字的押韵"></textarea>
            <button id="checkRhymeBtn" class="btn-primary" style="margin-top: 8px;">🔍 检测韵脚</button>
            <div id="rhymeResult" class="result-box">粘贴歌词后点击检测～</div>
        </div>
    </div>

    <!-- 原创歌词灵感库 -->
    <div class="section">
        <div class="section-title" data-target="inspirationContent">✨ 原创歌词灵感库 ▼</div>
        <div id="inspirationContent" class="content-area">
            <div class="category-grid" id="inspirationTags">
                <button class="cat-btn" data-cat="rhyme">📚 押韵词库</button>
                <button class="cat-btn" data-cat="golden">✨ 金句素材</button>
                <button class="cat-btn" data-cat="pattern">📐 句式模板</button>
                <button class="cat-btn" data-cat="reed">🌾 芦苇示例</button>

    </div>

    <!-- 和弦进行模板库（完整版）-->
    <div class="section">
        <div class="section-title" data-target="chordTemplateContent">🎸 和弦进行模板库 ▼</div>

        </div>
    </div>

    <!-- 粉丝歌词投稿 -->

        <div class="section-title" data-target="submitContent">✉️ 粉丝歌词发行投稿 ▼</div>

            <input type="text" id="lyricAuthor" placeholder="您的昵称 / 笔名" style="margin-bottom: 8px;">
            <textarea id="lyricContent" rows="4" placeholder="请在这里粘贴您的歌词作品..."></textarea>

        </div>
    </div>
</div>

<script>
// ==================== 用户界面 ====================
let currentUserData = null;

async function updateUserUI() {
    const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
    const userNameSpan = document.getElementById('userName');
    const userScoreSpan = document.getElementById('userScore');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    
    if (user) {
        userNameSpan.innerText = user.nickname || '芦苇同学';
        let score = user.score || 0;
        if (typeof window.API !== 'undefined' && window.API.getUserScore) {
            const apiScore = await window.API.getUserScore();
            if (apiScore !== undefined) score = apiScore;
        }
        userScoreSpan.innerText = `积分 ${score}`;
        if(loginBtn) loginBtn.style.display = 'none';
        if(logoutBtn) logoutBtn.style.display = 'block';
        currentUserData = user;
    } else {
        userNameSpan.innerText = '未登录';
        userScoreSpan.innerText = '积分 0';
        if(loginBtn) loginBtn.style.display = 'block';
        if(logoutBtn) logoutBtn.style.display = 'none';
        currentUserData = null;
    }
}

async function addScore(amount, reason) {
    if (!currentUserData) return;
    if (typeof window.API !== 'undefined' && window.API.addScore) {
        await window.API.addScore(amount, reason);
        updateUserUI();
    }
}

if(document.getElementById('loginBtn')) {
    document.getElementById('loginBtn').addEventListener('click', () => { if(typeof showLoginModal === 'function') showLoginModal(); });
}
if(document.getElementById('logoutBtn')) {
    document.getElementById('logoutBtn').addEventListener('click', () => { if(typeof logout === 'function') logout(); location.reload(); });
}

window.onLoginSuccess = async function(user) {
    currentUserData = user;
    await updateUserUI();
    if (typeof pullFromCloud === 'function') {
        await pullFromCloud();
    }
};

updateUserUI();

// ==================== 折叠面板 ====================
document.querySelectorAll('.section-title').forEach(title => {
    title.addEventListener('click', () => {
        const targetId = title.dataset.target;
        const target = document.getElementById(targetId);
        if(target) {
            if(target.classList.contains('active')) {
                target.classList.remove('active');
                title.innerHTML = title.innerHTML.replace('▲', '▼');
            } else {
                target.classList.add('active');
                title.innerHTML = title.innerHTML.replace('▼', '▲');
            }
        }
    });
    // 默认展开第一个
    if(title.dataset.target === 'rhymeDetectContent') {
        document.getElementById('rhymeDetectContent').classList.add('active');
        title.innerHTML = title.innerHTML.replace('▼', '▲');
    }
});

function buildChordTemplates() {
    const container = document.getElementById("chordProgressContent");
    container.innerHTML = chordTemplates.map(t => `
        <div class="chord-card">
            <strong>${t.name}：</strong>${t.progression}<br>
            <span style="color:#AAD4B0;">🎵 示例：${t.example}</span><br>
            <span style="color:#D4C5A3; font-style:italic;">💬 ${t.say}</span>
        </div>
    `).join("");
}

// 用户收藏
let myInspirations = [];

function loadMyInspirations() {
    const user = currentUserData;
    if (!user) {
        myInspirations = JSON.parse(localStorage.getItem("my_inspirations_temp") || "[]");
        return;
    }
    const userId = user.user_id;
    const saved = localStorage.getItem(`my_inspirations_${userId}`);
    myInspirations = saved ? JSON.parse(saved) : [];
}

function saveMyInspirations() {
    const user = currentUserData;
    if (!user) {
        localStorage.setItem("my_inspirations_temp", JSON.stringify(myInspirations));
        return;
    }
    const userId = user.user_id;
    localStorage.setItem(`my_inspirations_${userId}`, JSON.stringify(myInspirations));
    if (typeof syncToCloud === 'function') syncToCloud();
}

function addToMyInspirations(content, category) {
    if (!myInspirations.some(item => item.content === content)) {
        myInspirations.push({ content, category, time: new Date().toLocaleString() });
        saveMyInspirations();
        addScore(2, "收藏灵感素材");
        return true;
    }
    return false;
}

function showInspirationContent(category) {
    if (category === 'my') {
        if (myInspirations.length === 0) {
            document.getElementById("inspirationDisplay").innerHTML = '<div style="color:#AAD4B0; text-align:center; padding:20px;">⭐ 暂无收藏，去其他分类收藏喜欢的素材吧～</div>';
            return;
        }
        let itemsHtml = '';
        myInspirations.forEach((item, idx) => {
            const escapedItem = item.content.replace(/"/g, '&quot;').replace(/\n/g, '<br>');
            itemsHtml += `
                <div class="inspiration-item" data-content="${item.content.replace(/"/g, '&quot;')}" onclick="copyInspirationText(this)">
                    <div style="color:#F5ECD7; font-size:0.75rem; line-height:1.5;">${escapedItem}</div>
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <button class="copy-btn" data-content="${item.content.replace(/"/g, '&quot;')}" style="background:#3C6E4A; border:none; border-radius:20px; padding:4px 12px; font-size:0.65rem; color:white; cursor:pointer;">📋 复制</button>
                        <button class="remove-btn" data-idx="${idx}" style="background:#8a3a2a; border:none; border-radius:20px; padding:4px 12px; font-size:0.65rem; color:white; cursor:pointer;">🗑️ 删除</button>
                    </div>
                </div>
            `;
        });
        document.getElementById("inspirationDisplay").innerHTML = itemsHtml;
        bindInspirationButtons();
        return;
    }
    const data = megaInspirationDB[category];
    if (!data) return;
    let itemsHtml = '';
    data.items.forEach((item, idx) => {
        const escapedItem = item.replace(/"/g, '&quot;').replace(/\n/g, '<br>');
        itemsHtml += `
            <div class="inspiration-item" data-content="${item.replace(/"/g, '&quot;')}" onclick="copyInspirationText(this)">
                <div style="color:#F5ECD7; font-size:0.75rem; line-height:1.5;">${escapedItem}</div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <button class="copy-btn" data-content="${item.replace(/"/g, '&quot;')}" style="background:#3C6E4A; border:none; border-radius:20px; padding:4px 12px; font-size:0.65rem; color:white; cursor:pointer;">📋 复制</button>
                    <button class="favorite-btn" data-content="${item.replace(/"/g, '&quot;')}" data-category="${category}" style="background:#E69A2E; border:none; border-radius:20px; padding:4px 12px; font-size:0.65rem; color:#2D1E0C; cursor:pointer;">⭐ 收藏</button>
                </div>
            </div>
        `;
    });
    document.getElementById("inspirationDisplay").innerHTML = itemsHtml;
    bindInspirationButtons();
}

function bindInspirationButtons() {
    document.querySelectorAll(".copy-btn").forEach(btn => {
        btn.onclick = (e) => {
            e.stopPropagation();
            const content = btn.dataset.content;
            navigator.clipboard.writeText(content);
            btn.innerText = "✅ 已复制";
            setTimeout(() => { btn.innerText = "📋 复制"; }, 1500);
            addScore(1, "复制灵感素材");
        };
    });
    document.querySelectorAll(".favorite-btn").forEach(btn => {
        btn.onclick = (e) => {
            e.stopPropagation();
            const content = btn.dataset.content;
            if (addToMyInspirations(content, btn.dataset.category)) {
                btn.innerText = "✅ 已收藏";
                setTimeout(() => { btn.innerText = "⭐ 收藏"; }, 1500);
                alert("⭐ 已收藏到「我的收藏」！");
            } else {
                alert("已经收藏过啦～");
            }
        };
    });
    document.querySelectorAll(".remove-btn").forEach(btn => {
        btn.onclick = (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.idx);
            myInspirations.splice(idx, 1);
            saveMyInspirations();
            showInspirationContent('my');
        };
    });
}

window.copyInspirationText = function(el) {
    const content = el.dataset.content;
    if (content) {
        navigator.clipboard.writeText(content);
        alert("✅ 已复制到剪贴板");
        addScore(1, "复制灵感素材");
    }
};

// ==================== 歌词韵脚检测器 ====================
document.getElementById("checkRhymeBtn")?.addEventListener("click", () => {
    const text = document.getElementById("lyricRhymeInput").value;
    if (!text.trim()) {
        document.getElementById("rhymeResult").innerHTML = "⚠️ 请先粘贴歌词～";
        return;
    }
    const lines = text.split("\n").filter(line => line.trim().length > 0);
    const punctuations = "，。！？；：\"\"''（）【】《》…—,.!?;:()[]{}'\"";
    const lastChars = [];
    lines.forEach((line, i) => {
        let cleanLine = line.trim();
        for (let p of punctuations) cleanLine = cleanLine.split(p).join("");
        if (cleanLine.length === 0) {
            lastChars.push({ lineNum: i + 1, char: "（无文字）" });
        } else {
            lastChars.push({ lineNum: i + 1, char: cleanLine.slice(-1) });
        }
    });
    let result = "📊 韵脚分析：\n" + "━".repeat(25) + "\n";
    lastChars.forEach(item => { result += `第${item.lineNum}行结尾字：「${item.char}」\n`; });
    result += "\n" + "━".repeat(25) + "\n";
    let rhymeGroups = [];
    let currentGroup = [];
    for (let i = 0; i < lastChars.length; i++) {
        const char = lastChars[i].char;
        if (char === "（无文字）") continue;
        if (currentGroup.length === 0) currentGroup.push({ lineNum: lastChars[i].lineNum, char: char });
        else if (currentGroup[0].char === char) currentGroup.push({ lineNum: lastChars[i].lineNum, char: char });
        else {
            if (currentGroup.length >= 2) rhymeGroups.push(currentGroup);
            currentGroup = [{ lineNum: lastChars[i].lineNum, char: char }];
        }
    }
    if (currentGroup.length >= 2) rhymeGroups.push(currentGroup);
    if (rhymeGroups.length > 0) {
        result += "🔍 检测到相同韵脚：\n";
        rhymeGroups.forEach(group => { result += `  「${group[0].char}」出现在第 ${group.map(g => g.lineNum).join("、")} 行\n`; });
    } else result += "⚠️ 未检测到相同韵脚\n";
    result += "\n🌾 芦苇说：押韵让歌词更顺口，但不要强行押韵～";
    document.getElementById("rhymeResult").innerHTML = result;
    addScore(2, "使用韵脚检测器");
});
