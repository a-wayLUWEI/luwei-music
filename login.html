<!-- login.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐人登录 · 芦苇音乐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 48px 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .logo { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
        .logo span { color: #4CAF50; }
        .sub { color: #888; font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-login:hover { background: #388E3C; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            color: #c62828;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        .error-msg.show { display: block; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: white;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s;
            z-index: 999;
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #c62828; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🎵 <span>芦苇音乐</span></div>
        <p class="sub">音乐人登录 · 管理你的作品</p >

        <form id="loginForm">
            <div class="form-group">
                <label>音乐人 ID</label>
                <input type="text" id="musicianId" placeholder="输入你的音乐人 ID" required>
                <div class="hint">入驻申请通过后获得的 ID</div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">进入个人中心</button>
            <div class="error-msg" id="errorMsg">❌ 未找到该音乐人，请检查 ID 是否正确</div>
        </form>

        <p style="margin-top:20px;font-size:13px;color:#999;">
            还没有入驻？立即申请 →
        </p >
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

        function showToast(msg, type = '') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + type;
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('musicianId').value.trim();
            if (!id) { showToast('请输入音乐人 ID', 'error'); return; }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '验证中...';
            document.getElementById('errorMsg').classList.remove('show');

            try {
                // 验证该 ID 是否存在且已审核通过
                const resp = await fetch(
                    `${SUPABASE_URL}/rest/v1/musicians?id=eq.${id}&select=id,status`,
                    { headers: { 'apikey': SUPABASE_KEY } }
                );
                const data = await resp.json();

                if (!data || data.length === 0) {
                    document.getElementById('errorMsg').textContent = '❌ 未找到该音乐人，请检查 ID 是否正确';
                    document.getElementById('errorMsg').classList.add('show');
                    showToast('未找到该音乐人', 'error');
                    return;
                }

                const musician = data[0];
                if (musician.status !== 'approved') {
                    document.getElementById('errorMsg').textContent = '⏳ 该账号尚未通过审核，请等待 1-3 个工作日';
                    document.getElementById('errorMsg').classList.add('show');
                    showToast('尚未审核通过', 'error');
                    return;
                }

                // 登录成功：保存 ID 到 localStorage，跳转个人中心
                localStorage.setItem('musician_id', id);
                showToast('✅ 登录成功！', 'success');
                setTimeout(() => {
                    window.location.href = 'musician-center.html';
                }, 500);

            } catch (e) {
                console.error(e);
                document.getElementById('errorMsg').textContent = '❌ 网络错误，请重试';
                document.getElementById('errorMsg').classList.add('show');
                showToast('网络错误', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '进入个人中心';
            }
        });
    </script>
</body>
</html>
