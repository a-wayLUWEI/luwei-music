<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>芦苇音乐</title>
    <style>
@keyframes nameFade {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
}
.artist-card.vip-card::before {
    content: '';
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #d4b896, #f0e0c8, #d4b896, transparent);
    animation: scanLine 4s ease-in-out infinite;
    opacity: 0.6;
}

@keyframes scanLine {
    0% { top: -100%; }
    100% { top: 100%; }
}

@keyframes rippleOut {
    0% { transform: translate(-50%,-50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; }
}
@keyframes floatParticle {
    0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    25% { transform: translateY(-10px) translateX(6px); opacity: 0.7; }
    50% { transform: translateY(-18px) translateX(-4px); opacity: 0.9; }
    75% { transform: translateY(-8px) translateX(10px); opacity: 0.6; }
}
@keyframes textFade {
    0% { opacity: 0.08; }
    50% { opacity: 0.3; }
    100% { opacity: 0.08; }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #e8e8e8, #6a8a9a, #e8e8e8, #8a7a9a, #4a4a5a, #e8e8e8);
    background-size: 400% 400%;
    color: #1a1a2e;
    padding: 20px 20px 100px;
    animation: bodyGradientFlow 12s ease-in-out infinite alternate;
    min-height: 100vh;
}


@keyframes bodyGradientFlow {
    0% { background-position: 0% 50%; }
    20% { background-position: 20% 50%; }
    40% { background-position: 40% 50%; }
    60% { background-position: 60% 50%; }
    80% { background-position: 80% 50%; }
    100% { background-position: 100% 50%; }
}
.container { max-width: 900px; margin: 0 auto; }
.heart { color: #bbb; }

/* VIP 黑金卡 */
.artist-card.vip-card {
    position: relative;
    background: linear-gradient(145deg, #1a1a1a 30%, #3d3520 45%, #5a4a3a 50%, #3d3520 55%, #1a1a1a 70%) !important;
    background-size: 300% 100% !important;
    border: 2px solid rgba(212, 184, 150, 0.4) !important;
    box-shadow: 
        0 0 30px rgba(212, 184, 150, 0.06),
        inset 0 0 30px rgba(212, 184, 150, 0.03),
        inset 0 2px 0 rgba(212, 184, 150, 0.1) !important;
    border-radius: 16px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    overflow: hidden;
    animation: vipCardShift 8s ease-in-out infinite alternate !important;
}

@keyframes vipCardShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

/* 金色折角 */
.artist-card.vip-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #d4b896, #f0e0c8, #d4b896, transparent);
    opacity: 0.4;
}

.artist-card.vip-card::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 0 30px 30px;
    border-color: transparent transparent #d4b896 transparent;
    opacity: 0.5;
    pointer-events: none;
}

.artist-card.vip-card:hover {
    border-color: rgba(212, 184, 150, 0.6) !important;
    box-shadow: 0 0 50px rgba(212, 184, 150, 0.12) !important;
}

/* VIP 卡片名字金色渐变 */
.artist-card.vip-card .name {
    background: linear-gradient(135deg, #d4b896, #f0e0c8, #d4b896) !important;
    -webkit-background-clip: text !important;
    -webkit-text-fill-color: transparent !important;
    font-weight: 700 !important;
    text-shadow: 0 0 30px rgba(212, 184, 150, 0.05);
}

/* VIP 角色和数量金色调 */
.artist-card.vip-card .role {
    color: rgba(212, 184, 150, 0.5) !important;
}

.artist-card.vip-card .count {
    color: rgba(212, 184, 150, 0.4) !important;
}

/* VIP 头像边框金色 */
.artist-card.vip-card .avatar {
    border: 2px solid rgba(212, 184, 150, 0.2) !important;
}




.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid #e8e8e8;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
}
.header h1 {
    font-size: 28px;
    background: linear-gradient(90deg, #3a3a3a, #6a8a9a, #6a5a8a, #6a8a9a, #3a3a3a);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: headerTitleFlow 6s linear infinite;
}

@keyframes headerTitleFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 400% 50%; }
}
.header .sub {
    font-size: 14px;
    color: #ffffff;
    font-weight: 400;
    letter-spacing: 0.5px;
}

.back-btn {
    display: none;
    background: none;
    border: none;
    color: #999;
    font-size: 16px;
    cursor: pointer;
    padding: 8px 0;
    font-weight: 600;
}
.back-btn:hover { color: #666; }

.section-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #bbb;
}

.artist-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
}
.artist-card {
    background: linear-gradient(135deg, #f5f5f0, #4a4a5a, #8a7a9a, #6a8a9a, #4a4a5a);
    background-size: 300% 300%;
    border-radius: 16px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    border: 1px solid #d5d5d5;
    transition: 0.3s;
    animation: artistCardFlow 6s ease-in-out infinite alternate;
}

.artist-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    border-color: #bbb;
}

@keyframes artistCardFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}
.artist-card .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 10px;
    background: #d0d0d0;
    border: 2px solid #ccc;
}
.artist-card .name { font-weight: 700; font-size: 15px; color: #3a3a3a; }
.artist-card .role {
    font-size: 13px;
    color: #ffffff;
    margin-top: 2px;
    opacity: 0.7;
}
.artist-card .count {
    font-size: 12px;
    color: #4a4a5a;
    margin-top: 6px;
    font-weight: 600;
}

.song-list { display: flex; flex-direction: column; gap: 8px; }
.song-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: #f5f5f5;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid #e8e8e8;
}
.song-item:hover { border-color: #ccc; background: #f0f0f0; }
.song-item .play-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #d5d5d5;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
}
.song-item .play-btn:hover { background: #bbb; }
.song-item .info { flex: 1; }
.song-item .info .title {
    font-weight: 600;
    font-size: 15px;
    background: linear-gradient(135deg, #f5f5f0, #4a4a5a, #8a7a9a, #6a8a9a, #4a4a5a);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: songTitleFlow 6s ease-in-out infinite alternate;
}

@keyframes songTitleFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}
.song-item .info .meta { font-size: 13px; color: #bbb; }
.song-item .likes { color: #bbb; font-size: 13px; }
.song-item .info .meta .heart { color: #bbb; }

.player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #f5f5f5;
    padding: 12px 20px;
    box-shadow: 0 -2px 20px rgba(0,0,0,0.04);
    display: none;
    border-top: 1px solid #e8e8e8;
}
.player.show { display: block; }
.player .info {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 900px;
    margin: 0 auto;
}
.player .info .name { font-weight: 600; font-size: 15px; color: #3a3a3a; flex: 1; }
.player .info .artist { font-size: 13px; color: #bbb; }
.player audio { width: 100%; max-width: 400px; }

.loading { text-align: center; padding: 40px; color: #ccc; }
.empty { text-align: center; padding: 40px; color: #ccc; }
.hidden { display: none !important; }

.song-item .idx { color: #ddd; font-size: 14px; width: 28px; text-align: center; }
.cd-icon {
    display: inline-block;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: conic-gradient(#4a4a5a, #6a8a9a, #6a5a8a, #6a8a9a, #1a3a2a, #4a4a5a);
    margin-right: 10px;
    vertical-align: middle;
    box-shadow: 0 0 12px rgba(106, 138, 154, 0.25);
    animation: spin 3s linear infinite;
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
.sub-wrapper {
    display: inline-block;
    background: linear-gradient(135deg, #f5f5f0, #4a4a5a, #8a7a9a, #6a8a9a, #4a4a5a);
    background-size: 300% 300%;
    border-radius: 40px;
    padding: 6px 18px;
    animation: subWrapperFlow 6s ease-in-out infinite alternate;
    box-shadow: 0 0 30px rgba(106, 138, 154, 0.08);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
}

.sub-wrapper:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 50px rgba(106, 138, 154, 0.25);
}

@keyframes subWrapperFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}

.sub {
    font-size: 14px;
    color: #ffffff;
    font-weight: 400;
    letter-spacing: 0.5px;
}
@keyframes zhoutianBgFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 50% 50%; }
    100% { background-position: 100% 50%; }
}
a {
    color: #8a8a8a;
    text-decoration: none;
    transition: 0.3s;
}
a:hover {
    color: #b8b8b8;
}
@keyframes vipShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}
/* 强制 VIP 卡片流动 */
.artist-card.vip-card {
    background: linear-gradient(135deg, #1a1a1a, #3d3520, #d4b896, #3d3520, #1a1a1a) !important;
    background-size: 400% 400% !important;
    animation: vipGlow 8s ease-in-out infinite alternate !important;
    border: 2px solid rgba(212, 184, 150, 0.3) !important;
}

@keyframes vipGlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}
    </style>
</head>
<body>

<div class="container">

    <div class="header">
<h1>
    <span class="cd-icon"></span>

</h1>
<a href="custom.html" class="btn-primary gradient-cool" style="text-decoration: none; display: inline-block; padding: 14px 36px; border-radius: 50px; font-weight: 600; letter-spacing: 1px; text-align: center;">
     歌手定制 · 每个人都可以是周田
</a >
<span class="sub-wrapper">
    <span class="sub">在芦苇深处，治愈自己的思念。</span>
</span>
    </div>

</div>

        <audio controls id="audioPlayer"></audio>
    </div>
</div>

<script>
// ===== 配置 =====
const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

let allArtists = [];
let allSongs = [];

async function loadArtists() {
    const grid = document.getElementById('artistGrid');
    grid.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const resp = await fetch(
            `${SUPABASE_URL}/rest/v1/musicians?status=eq.approved&order=created_at.desc`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        allArtists = await resp.json();

        if (!allArtists || allArtists.length === 0) {
            grid.innerHTML = '<div class="empty">暂无入驻歌手</div>';
            return;
        }

        const wResp = await fetch(
            `${SUPABASE_URL}/rest/v1/works?status=eq.approved&select=musician_id`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        const works = await wResp.json();
        const count = {};
        works.forEach(w => count[w.musician_id] = (count[w.musician_id] || 0) + 1);

        // ===== 分类 =====
        const vipArtists = allArtists.filter(a => a.vip === true);
        const normalArtists = allArtists.filter(a => a.vip !== true);

        let html = '';

// VIP 区域
if (vipArtists.length > 0) {
    html += `<div class="section-title" style="margin-top: 24px; color: #d4b896; font-size: 1.1rem; letter-spacing: 2px;">✦ VIP高级定制歌手 ✦</div>`;
    html += `<div class="artist-grid">`;
    vipArtists.forEach(a => {
        const avatar = a.avatar_url || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2272%22 height=%2272%22%3E%3Crect width=%2272%22 height=%2272%22 fill=%22%23c8e6c9%22/%3E%3Ctext x=%2236%22 y=%2244%22 text-anchor=%22middle%22 font-size=%2232%22 fill=%22%234CAF50%22%3E%3C/text%3E%3C/svg%3E';
        const vipBadge = `<span style="position:absolute;top:6px;right:8px;font-size:0.45rem;background:linear-gradient(135deg,#d4b896,#f0e0c8);color:#1a1a1a;padding:1px 8px;border-radius:10px;font-weight:600;letter-spacing:0.5px;border:1px solid rgba(212,184,150,0.2);">VIP</span>`;
        html += `
<div class="artist-card vip-card" onclick="showSongs('${a.id}')" style="
    position: relative;
    background: linear-gradient(145deg, #1a1a1a 25%, #3d3520 40%, #d4b896 50%, #3d3520 60%, #1a1a1a 75%) !important;
    background-size: 300% 100% !important;
    border: 2px solid rgba(212, 184, 150, 0.4) !important;
    border-radius: 16px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(212, 184, 150, 0.08), inset 0 0 30px rgba(212, 184, 150, 0.02) !important;
    animation: vipShift 6s ease-in-out infinite alternate;
"
onmouseover="this.style.borderColor='rgba(212,184,150,0.7)'; this.style.boxShadow='0 0 50px rgba(212,184,150,0.15)'"
onmouseout="this.style.borderColor='rgba(212,184,150,0.4)'; this.style.boxShadow='0 0 30px rgba(212,184,150,0.08)'">
                ${vipBadge}
<div style="position:absolute; bottom:8px; right:12px; font-size:0.5rem; color:rgba(212,184,150,0.15); font-family:'Georgia', serif; letter-spacing:2px; pointer-events:none; user-select:none; animation: textFade 8s ease-in-out infinite;">JAY·HEBE</div>
                 <div style="position:absolute; top:12%; left:15%; width:3px; height:3px; border-radius:50%; background:rgba(212,184,150,0.35); animation: floatParticle 6s ease-in-out infinite; pointer-events:none;"></div>
                 <div style="position:absolute; top:25%; right:18%; width:2px; height:2px; border-radius:50%; background:rgba(212,184,150,0.25); animation: floatParticle 8s ease-in-out infinite 1.2s; pointer-events:none;"></div>
                 <div style="position:absolute; top:45%; left:10%; width:2px; height:2px; border-radius:50%; background:rgba(212,184,150,0.2); animation: floatParticle 7s ease-in-out infinite 2.5s; pointer-events:none;"></div>
                <div style="position:absolute; bottom:20%; right:12%; width:3px; height:3px; border-radius:50%; background:rgba(212,184,150,0.3); animation: floatParticle 9s ease-in-out infinite 0.8s; pointer-events:none;"></div>
                <div style="position:absolute; top:70%; left:20%; width:2px; height:2px; border-radius:50%; background:rgba(212,184,150,0.15); animation: floatParticle 7s ease-in-out infinite 3.5s; pointer-events:none;"></div>
                <div style="position:absolute; bottom:40%; right:25%; width:2px; height:2px; border-radius:50%; background:rgba(212,184,150,0.2); animation: floatParticle 8s ease-in-out infinite 1.8s; pointer-events:none;"></div>
                <div style="position:absolute; top:55%; right:8%; width:3px; height:3px; border-radius:50%; background:rgba(212,184,150,0.25); animation: floatParticle 6s ease-in-out infinite 0.5s; pointer-events:none;"></div>
                <div style="position:absolute; bottom:10%; left:35%; width:2px; height:2px; border-radius:50%; background:rgba(212,184,150,0.15); animation: floatParticle 10s ease-in-out infinite 4s; pointer-events:none;"></div>
                <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:80px; height:80px; border-radius:50%; border:1.5px solid rgba(212,184,150,0.25); animation: rippleOut 4s ease-out infinite; pointer-events:none;"></div>
                <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:140px; height:140px; border-radius:50%; border:1.5px solid rgba(212,184,150,0.15); animation: rippleOut 4s ease-out infinite 1.5s; pointer-events:none;"></div>

                <div style="position:absolute; top:15%; left:20%; width:3px; height:3px; border-radius:50%; background:rgba(212,184,150,0.3); animation: floatParticle 6s ease-in-out infinite; pointer-events:none;"></div>
                <div style="position:absolute; bottom:25%; right:15%; width:2px; height:2px; border-radius:50%; background:rgba(212,184,150,0.2); animation: floatParticle 8s ease-in-out infinite 2s; pointer-events:none;"></div>
                <div style="position:absolute; top:60%; left:10%; width:2px; height:2px; border-radius:50%; background:rgba(212,184,150,0.15); animation: floatParticle 7s ease-in-out infinite 4s; pointer-events:none;"></div>
                <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#d4b896,#f0e0c8,#d4b896,transparent);opacity:0.6;"></div>
                <div style="position:absolute;bottom:0;right:0;width:0;height:0;border-style:solid;border-width:0 0 28px 28px;border-color:transparent transparent #d4b896 transparent;opacity:0.5;"></div>
                <div style="position:absolute;bottom:0;left:0;width:0;height:0;border-style:solid;border-width:0 0 28px 28px;border-color:transparent transparent rgba(212,184,150,0.08) transparent;opacity:0.3;"></div>
                <img class="avatar" src="${avatar}" alt="${a.artist_name || a.name}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 10px;background:#d0d0d0;border:2px solid rgba(212,184,150,0.2);">
                <div class="name" style="font-weight:700;font-size:15px;color:#d4b896;animation: nameFade 6s ease-in-out infinite;">${a.artist_name || a.name || '未命名'}</div>
                <div class="role" style="font-size:13px;color:rgba(212,184,150,0.5);margin-top:2px;">${a.role || '音乐人'}</div>
                <div class="count" style="font-size:12px;color:rgba(212,184,150,0.4);margin-top:6px;font-weight:600;"> ${count[a.id] || 0} 首歌</div>
            </div>
        `;
    });
    html += `</div>`;
}



        // 普通入驻歌手
        if (normalArtists.length > 0) {
            html += `<div class="section-title" style="margin-top: 24px;"> 入驻歌手</div>`;
            html += `<div class="artist-grid">`;
            normalArtists.forEach(a => {
                const avatar = a.avatar_url || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2272%22 height=%2272%22%3E%3Crect width=%2272%22 height=%2272%22 fill=%22%23c8e6c9%22/%3E%3Ctext x=%2236%22 y=%2244%22 text-anchor=%22middle%22 font-size=%2232%22 fill=%22%234CAF50%22%3E%3C/text%3E%3C/svg%3E';
                html += `
                    <div class="artist-card" onclick="showSongs('${a.id}')">
                        <img class="avatar" src="${avatar}" alt="${a.artist_name || a.name}">
                        <div class="name">${a.artist_name || a.name || '未命名'}</div>
                        <div class="role">${a.role || '音乐人'}</div>
                        <div class="count"> ${count[a.id] || 0} 首歌</div>
                    </div>
                `;
            });
            html += `</div>`;
        }

        grid.innerHTML = html;

    } catch (e) {
        grid.innerHTML = '<div class="empty">加载失败，请刷新</div>';
    }
}

// ===== 显示歌手的歌曲 =====
async function showSongs(artistId) {
    const artist = allArtists.find(a => a.id === artistId);
    if (!artist) return;

    document.getElementById('artistSection').classList.add('hidden');
    document.getElementById('songSection').classList.remove('hidden');
    document.getElementById('backBtn').style.display = 'inline-block';
    // ===== 周田专属判断 =====
const isZhouTian = artistId === '1781898147879639' || artist.artist_name === '周田';

if (isZhouTian) {
    document.getElementById('songSectionTitle').innerHTML = `
        <span style="background: linear-gradient(135deg, #d4b896, #b8a0c8); 
                     -webkit-background-clip: text; 
                     -webkit-text-fill-color: transparent; 
                     font-size: 1.6rem;
                     font-weight: 700;
                     letter-spacing: 2px;">
            ✦ 周田 · 雨天的悬日 ✦
        </span>
        <span style="display: inline-block; background: linear-gradient(135deg, #d4b896, #b8a0c8); color: #1a1a2e; font-size: 0.6rem; padding: 2px 10px; border-radius: 12px; margin-left: 10px; font-weight: 600; vertical-align: middle;">专属</span>
    `;
    document.getElementById('songSection').style.background = 'linear-gradient(135deg, rgba(212, 184, 150, 0.1), rgba(60, 60, 80, 0.15), rgba(106, 90, 138, 0.12))';
    document.getElementById('songSection').style.backgroundSize = '300% 300%';
    document.getElementById('songSection').style.animation = 'zhoutianBgFlow 8s ease-in-out infinite alternate';
    document.getElementById('songSection').style.border = '1px solid rgba(212, 184, 150, 0.15)';
    document.getElementById('songSection').style.borderRadius = '24px';
    document.getElementById('songSection').style.padding = '20px';
    document.getElementById('songSection').style.boxShadow = '0 0 60px rgba(212, 184, 150, 0.04)';
} else {
    document.getElementById('songSectionTitle').textContent = ` ${artist.artist_name || artist.name} 的歌曲`;
    document.getElementById('songSection').style.background = '';
    document.getElementById('songSection').style.border = '';
    document.getElementById('songSection').style.borderRadius = '';
    document.getElementById('songSection').style.padding = '';
    document.getElementById('songSection').style.boxShadow = '';
}

    const list = document.getElementById('songList');
    list.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const resp = await fetch(
            `${SUPABASE_URL}/rest/v1/works?musician_id=eq.${artistId}&status=eq.approved&order=created_at.desc`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        allSongs = await resp.json();

        if (!allSongs || allSongs.length === 0) {
            list.innerHTML = '<div class="empty">暂无已审核的歌曲</div>';
            return;
        }
list.innerHTML = allSongs.map((s, i) => `
    <div class="song-item">
        <span style="color:#bbb;font-size:14px;width:28px;text-align:center;">${String(i+1).padStart(2,'0')}</span>
        <button class="play-btn" id="play-btn-${s.id}" onclick="event.stopPropagation();playSong('${s.id}')">▶</button>
        <div class="info" onclick="openPlayer('${s.id}')" style="cursor:pointer;flex:1;">
            <div class="title">${s.title || '未命名'}</div>
            <span class="likes"><span class="heart">❤️</span> ${s.likes || 0}</span>
        </div>
    </div>
`).join('');

    } catch (e) {
        list.innerHTML = '<div class="empty">加载失败</div>';
    }
}

// ===== 返回 =====
function showArtists() {
    document.getElementById('artistSection').classList.remove('hidden');
    document.getElementById('songSection').classList.add('hidden');
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('player').classList.remove('show');
    document.getElementById('audioPlayer').pause();
}

// ===== 播放歌曲 =====
let currentSongId = null;

function playSong(songId) {
    const song = allSongs.find(s => s.id === songId);
    if (!song) return;

    const audio = document.getElementById('audioPlayer');
    const player = document.getElementById('player');

    if (currentSongId === songId) {
        if (audio.paused) {
            audio.play();
            updatePlayBtn(songId, '⏸');
        } else {
            audio.pause();
            updatePlayBtn(songId, '▶');
        }
        return;
    }

    if (currentSongId) {
        updatePlayBtn(currentSongId, '▶');
    }

    currentSongId = songId;
    document.getElementById('playerName').textContent = song.title || '未命名';
    document.getElementById('playerArtist').textContent = '歌手';
    audio.src = song.audio_url || '';
    player.classList.add('show');

    audio.play();
    updatePlayBtn(songId, '⏸');

    audio.onended = function() {
        updatePlayBtn(songId, '▶');
        currentSongId = null;
    };

    audio.onpause = function() {
        updatePlayBtn(songId, '▶');
    };

    audio.onplay = function() {
        updatePlayBtn(songId, '⏸');
    };
}

function updatePlayBtn(songId, icon) {
    const btn = document.getElementById(`play-btn-${songId}`);
    if (btn) {
        btn.textContent = icon;
    }
}

function openPlayer(songId) {
    window.location.href = `player.html?id=${songId}`;
}

loadArtists();
</script>
