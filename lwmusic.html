    <meta charset="UTF-8">
    <title>芦苇音乐</title>
    <style>
/* 专辑分组里的歌名渐变 */
.album-songs .title {
    font-weight: 600;
    font-size: 0.85rem;
    background: linear-gradient(90deg, 
        #1a1a1a 0%, 
        #6a6a6a 25%, 
        #b8b8b8 50%, 
        #6a6a6a 75%, 
        #1a1a1a 100%
    );
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleGrayFlow 6s ease-in-out infinite alternate;
}

@keyframes titleGrayFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}
.heart-gradient {
    background: linear-gradient(135deg, #f5a0b0, #d4b896, #b8a0c8, #6a5a9a, #f5a0b0);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 0.9rem;
    display: inline-block;
    animation: heartFlow 6s ease-in-out infinite alternate;
}

@keyframes heartFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 50% 50%; }
    100% { background-position: 100% 50%; }
}
.heart-pink {
    background: linear-gradient(135deg, #d4b896, #b8a0c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 0.9rem;
}
.song-item .info .title {
    font-weight: 600;
    font-size: 15px;
    background: linear-gradient(90deg, 
        #1a1a1a 0%, 
        #6a5a9a 35%, 
        #2a4a3a 70%, 
        #1a1a1a 100%
    );
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleColorFlow 6s ease-in-out infinite alternate;
}

@keyframes titleColorFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}
#snow-lw-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}
@keyframes nameFade {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
}
.artist-card.vip-card::before {
    content: '';
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #d4b896, #f0e0c8, #d4b896, transparent);
    animation: scanLine 4s ease-in-out infinite;
    opacity: 0.6;
}

@keyframes scanLine {
    0% { top: -100%; }
    100% { top: 100%; }
}

@keyframes rippleOut {
    0% { transform: translate(-50%,-50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; }
}
@keyframes floatParticle {
    0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    25% { transform: translateY(-10px) translateX(6px); opacity: 0.7; }
    50% { transform: translateY(-18px) translateX(-4px); opacity: 0.9; }
    75% { transform: translateY(-8px) translateX(10px); opacity: 0.6; }
}
@keyframes textFade {
    0% { opacity: 0.08; }
    50% { opacity: 0.3; }
    100% { opacity: 0.08; }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

    content: '';
    position: absolute;

<script>
// ===== 配置 =====
const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

let allArtists = [];
let allSongs = [];

async function loadArtists() {
    const grid = document.getElementById('artistGrid');
    grid.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const resp = await fetch(
            `${SUPABASE_URL}/rest/v1/musicians?status=eq.approved&order=created_at.desc`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        allArtists = await resp.json();

        if (!allArtists || allArtists.length === 0) {
            grid.innerHTML = '<div class="empty">暂无入驻歌手</div>';
            return;
        }

        // 批量获取歌曲数
        const ids = allArtists.map(a => a.id).join(',');
        const wResp = await fetch(
            `${SUPABASE_URL}/rest/v1/works?status=eq.approved&select=musician_id&musician_id=in.(${ids})`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        const works = await wResp.json();
        const count = {};
        works.forEach(w => count[w.musician_id] = (count[w.musician_id] || 0) + 1);

        // 批量获取关注状态（一次请求）
        const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
        let followedMap = {};
        if (user.user_id && allArtists.length > 0) {
            try {
                const followResp = await fetch(
                    `${SUPABASE_URL}/rest/v1/follows?follower_id=eq.${user.user_id}&following_id=in.(${ids})`,
                    { headers: { 'apikey': SUPABASE_KEY } }
                );
                const follows = await followResp.json();
                follows.forEach(f => { followedMap[f.following_id] = true; });
            } catch (e) {
                console.warn('批量获取关注状态失败:', e);
            }
        }

        // ===== 分类 =====
        const vipArtists = allArtists.filter(a => a.vip === true);
        const normalArtists = allArtists.filter(a => a.vip !== true);

        let html = '';

        // VIP 区域
        if (vipArtists.length > 0) {
            html += `<div class="section-title" style="margin-top: 24px; color: #d4b896; font-size: 1.1rem; letter-spacing: 2px;">✦ VIP高级定制歌手 ✦</div>`;
            html += `<div class="artist-grid">`;
            for (const a of vipArtists) {
                const avatar = a.avatar_url || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2272%22 height=%2272%22%3E%3Crect width=%2272%22 height=%2272%22 fill=%22%23c8e6c9%22/%3E%3Ctext x=%2236%22 y=%2244%22 text-anchor=%22middle%22 font-size=%2232%22 fill=%22%234CAF50%22%3E%3C/text%3E%3C/svg%3E';
                const vipBadge = `<span style="position:absolute;top:6px;right:8px;font-size:0.45rem;background:linear-gradient(135deg,#d4b896,#f0e0c8);color:#1a1a1a;padding:1px 8px;border-radius:10px;font-weight:600;letter-spacing:0.5px;border:1px solid rgba(212,184,150,0.2);">VIP</span>`;
                
                const followed = followedMap[a.id] || false;
                const followerCount = a.followers_count || 0;
                
                html += `
<div class="artist-card vip-card" onclick="showSongs('${a.id}')" style="
    position: relative;
    background: linear-gradient(145deg, #1a1a1a 25%, #3d3520 40%, #d4b896 50%, #3d3520 60%, #1a1a1a 75%) !important;
    background-size: 300% 100% !important;
    border: 2px solid rgba(212, 184, 150, 0.4) !important;
    border-radius: 16px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(212, 184, 150, 0.08), inset 0 0 30px rgba(212, 184, 150, 0.02) !important;
    animation: vipShift 6s ease-in-out infinite alternate;
"
onmouseover="this.style.borderColor='rgba(212,184,150,0.7)'; this.style.boxShadow='0 0 50px rgba(212,184,150,0.15)'"
onmouseout="this.style.borderColor='rgba(212,184,150,0.4)'; this.style.boxShadow='0 0 30px rgba(212,184,150,0.08)'">
                ${vipBadge}
<div style="position:absolute; bottom:8px; right:12px; font-size:0.5rem; color:rgba(212,184,150,0.15); font-family:'Georgia', serif; letter-spacing:2px; pointer-events:none; user-select:none; animation: textFade 8s ease-in-out infinite;">JAY·HEBE</div>
                 <div style="position:absolute; top:12%; left:15%; width:3px; height:3px; border-radius:50%; background:rgba(212,184,150,0.35); animation: floatParticle 6s ease-in-out infinite; pointer-events:none;"></div>
                 <div style="position:absolute; top:25%; right:18%; width:2px; height:2px; border-radius:50%; background:rgba(212,184,150,0.25); animation: floatParticle 8s ease-in-out infinite 1.2s; pointer-events:none;"></div>
                 <div style="position:absolute; top:45%; left:10%; width:2px; height:2px; border-radius:50%; background:rgba(212,184,150,0.2); animation: floatParticle 7s ease-in-out infinite 2.5s; pointer-events:none;"></div>

function showArtists() {

// ===== 播放歌曲 =====
let currentSongId = null;

function playSong(songId) {
    const song = allSongs.find(s => s.id === songId);
    if (!song) return;

    const audio = document.getElementById('audioPlayer');
    const player = document.getElementById('player');

    if (currentSongId === songId) {
        if (audio.paused) {
            audio.play();
            updatePlayBtn(songId, '⏸');
        } else {
            audio.pause();
            updatePlayBtn(songId, '▶');
        }
        return;
    }

    if (currentSongId) {
        updatePlayBtn(currentSongId, '▶');
    }

    currentSongId = songId;
    document.getElementById('playerName').textContent = song.title || '未命名';
    document.getElementById('playerArtist').textContent = '歌手';
    audio.src = song.audio_url || '';
    player.classList.add('show');

    audio.play();
    updatePlayBtn(songId, '⏸');

    audio.onended = function() {
        updatePlayBtn(songId, '▶');
        currentSongId = null;
    };

    audio.onpause = function() {
        updatePlayBtn(songId, '▶');
    };

    audio.onplay = function() {
        updatePlayBtn(songId, '⏸');
    };
}

function updatePlayBtn(songId, icon) {
    const btn = document.getElementById(`play-btn-${songId}`);
    if (btn) {
        // 更新图标
        const iconSpan = document.getElementById(`play-icon-${songId}`);
        if (iconSpan) {
            iconSpan.textContent = icon;
        }
        // 播放时按钮微微发光
        if (icon === '⏸') {
            btn.style.boxShadow = '0 0 20px rgba(212,184,150,0.3)';
        } else {
            btn.style.boxShadow = '0 2px 12px rgba(184,160,200,0.15)';
        }
    }
}

// ===== 简单雪花（50颗，带光晕） =====
let snowLWParticles = [];
let snowLWAnimationId = null;

function startSnowLW() {
    const canvas = document.getElementById('snow-lw-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    snowLWParticles = [];
    for (let i = 0; i < 50; i++) {
        snowLWParticles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 4 + 2,
            speed: Math.random() * 0.4 + 0.1,
            wind: (Math.random() - 0.5) * 0.15,
            opacity: Math.random() * 0.3 + 0.1
        });
    }
    drawSnowLW(ctx, canvas);
}

function drawSnowLW(ctx, canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    snowLWParticles.forEach(p => {
        p.y += p.speed;
        p.x += p.wind + Math.sin(p.y / 100) * 0.2;
        if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
        }
        if (p.x < -20) p.x = canvas.width + 20;
        if (p.x > canvas.width + 20) p.x = -20;

        // 光晕
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
        gradient.addColorStop(0, `rgba(255, 255, 255, ${p.opacity})`);
        gradient.addColorStop(0.3, `rgba(255, 255, 255, ${p.opacity * 0.4})`);
        gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * 3, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
    });
    snowLWAnimationId = requestAnimationFrame(() => drawSnowLW(ctx, canvas));
}

function toggleAlbum(albumId) {
    const el = document.getElementById(`album-${albumId}`);
    if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
}

function stopSnowLW() {
    if (snowLWAnimationId) {
        cancelAnimationFrame(snowLWAnimationId);
        snowLWAnimationId = null;
    }
    snowLWParticles = [];
    const canvas = document.getElementById('snow-lw-canvas');
    if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
}
document.addEventListener('DOMContentLoaded', function() {
    startSnowLW();
});

async function handleFollow(musicianId) {
    if (!musicianId) return;
    const result = await Follow.toggle(musicianId);
    // 更新按钮文字和颜色
    const btn = document.getElementById(`follow-btn-${musicianId}`);
    if (btn) {
        btn.textContent = result.followed ? '❤️ 已关注' : '🤍 关注';
        btn.style.color = result.followed ? '#e88a8a' : 'rgba(255,255,255,0.3)';
    }
    // 更新粉丝数显示（找到卡片里的粉丝数元素）
    const card = btn?.closest('.artist-card') || btn?.closest('.vip-card');
    if (card) {
        const countEl = card.querySelector('.count:last-child');
        if (countEl) {
            countEl.textContent = '❤️ ' + result.count + ' 粉丝';
        }
    }
}
// ===== 跳转播放页 =====
async function openPlayer(songId) {
    // 增加播放量
    try {
        // 先获取当前播放量
        const resp = await fetch(
            `${SUPABASE_URL}/rest/v1/works?id=eq.${songId}&select=plays`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        const data = await resp.json();
        const currentPlays = data[0]?.plays || 0;
        // 播放量 +1
        await fetch(
            `${SUPABASE_URL}/rest/v1/works?id=eq.${songId}`,
            {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ plays: currentPlays + 1 })
            }
        );
    } catch (e) {
        console.warn('播放量更新失败:', e);
    }
    // 跳转播放页
    window.location.href = `player.html?id=${songId}`;
}
