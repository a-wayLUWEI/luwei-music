    <style>
@keyframes albumTitleFlow {
    0% { background-position: 0% 50%; }

}
/* 专辑分组里的歌名渐变 */
.album-songs .title {
    font-weight: 600;

        #1a1a1a 0%,

    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleGrayFlow 6s ease-in-out infinite alternate;
}

@keyframes titleGrayFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }

@keyframes heartFlow {

}
.heart-pink {
    background: linear-gradient(135deg, #d4b896, #b8a0c8);

.song-item .info .title {

        #6a5a9a 35%,

@keyframes titleColorFlow {
    0% { background-position: 0% 50%; }

@keyframes scanLine {

.artist-card.vip-card {

    content: '';

<body>
<canvas id="snow-lw-canvas"></canvas>

<div class="container">

    <div class="header">
<h1>
    <span class="cd-icon"></span>
    芦苇音乐
</h1>
<a href="custom.html" class="btn-primary gradient-cool" style="text-decoration: none; display: inline-block; padding: 14px 36px; border-radius: 50px; font-weight: 600; letter-spacing: 1px; text-align: center;">
     歌手定制 · 每个人都可以是周田
</a >
<span class="sub-wrapper">
    <span class="sub">在芦苇深处，治愈自己的思念。</span>
</span>
    </div>

    <button class="back-btn" id="backBtn" onclick="showArtists()">← 返回歌手列表</button>

    <div id="artistSection">
        <div id="artistGrid"></div>
    </div>

    <div id="songSection" class="hidden">
        <div class="section-title" id="songSectionTitle"> 歌曲列表</div>
        <div class="song-list" id="songList"></div>
    </div>

</div>

<div class="player" id="player">
    <div class="info">
        <div>
            <div class="name" id="playerName">歌名</div>
            <div class="artist" id="playerArtist">歌手</div>
        </div>
        <audio controls id="audioPlayer"></audio>
    </div>
</div>

<script>
// ===== 配置 =====
const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

let allArtists = [];
let allSongs = [];

async function loadArtists() {
    const grid = document.getElementById('artistGrid');
    grid.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const resp = await fetch(
            `${SUPABASE_URL}/rest/v1/musicians?status=eq.approved&order=created_at.desc`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        allArtists = await resp.json();

        if (!allArtists || allArtists.length === 0) {
            grid.innerHTML = '<div class="empty">暂无入驻音乐人</div>';
            return;
        }

        // 批量获取歌曲数
        const ids = allArtists.map(a => a.id).join(',');
        const wResp = await fetch(
            `${SUPABASE_URL}/rest/v1/works?status=eq.approved&select=musician_id&musician_id=in.(${ids})`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        const works = await wResp.json();
        const count = {};
        works.forEach(w => count[w.musician_id] = (count[w.musician_id] || 0) + 1);

        // 批量获取关注状态
        const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
        let followedMap = {};
        if (user.user_id && allArtists.length > 0) {
            try {
                const followResp = await fetch(
                    `${SUPABASE_URL}/rest/v1/follows?follower_id=eq.${user.user_id}&following_id=in.(${ids})`,
                    { headers: { 'apikey': SUPABASE_KEY } }
                );
                const follows = await followResp.json();
                follows.forEach(f => { followedMap[f.following_id] = true; });
            } catch (e) {
                console.warn('批量获取关注状态失败:', e);
            }
        }

// ===== 按角色分组 =====
const roleMap = {
    '歌手': ' 歌手',
    '作词人': '✍️ 作词人',
    '作曲人': ' 作曲人',
    '编曲师': ' 编曲师',
    '混音师': '️ 混音师',
    '制作人': '️ 制作人'
};

// 按角色分组
const grouped = {};
allArtists.forEach(a => {
    const role = a.role || '音乐人';
    const key = roleMap[role] || role;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(a);
});

// ===== 定义展示顺序：歌手排最前面 =====
const order = [' 歌手', '✍️ 作词人', ' 作曲人', ' 编曲师', '️ 混音师', '️ 制作人'];

let html = '';

// 先遍历歌手（按 order 顺序）
for (const roleTitle of order) {
    const artists = grouped[roleTitle] || [];
    if (artists.length === 0) continue;

    // 分离 VIP 和普通
    const vipArtists = artists.filter(a => a.vip === true);
    const normalArtists = artists.filter(a => a.vip !== true);

    // VIP 区域
    if (vipArtists.length > 0) {
        html += `<div class="section-title" style="margin-top: 24px; color: #d4b896; font-size: 1.1rem; letter-spacing: 2px;">✦ VIP ${roleTitle} ✦</div>`;
        html += `<div class="artist-grid">`;
        for (const a of vipArtists) {
            html += renderArtistCard(a, count, followedMap);
        }
        html += `</div>`;
    }

    // 普通区域
    if (normalArtists.length > 0) {
        html += `<div class="section-title" style="margin-top: 24px; color: rgba(255,255,255,0.3); font-size: 1rem; letter-spacing: 1px;">${roleTitle}</div>`;
        html += `<div class="artist-grid">`;
        for (const a of normalArtists) {
            html += renderArtistCard(a, count, followedMap);
        }
        html += `</div>`;
    }
}

// 处理其他未分类的角色（不在 order 里的）
for (const [roleTitle, artists] of Object.entries(grouped)) {
    if (order.includes(roleTitle)) continue;
    // ... 同样处理
    const vipArtists = artists.filter(a => a.vip === true);
    const normalArtists = artists.filter(a => a.vip !== true);

    if (vipArtists.length > 0) {
        html += `<div class="section-title" style="margin-top: 24px; color: #d4b896; font-size: 1.1rem; letter-spacing: 2px;">✦ VIP ${roleTitle} ✦</div>`;
        html += `<div class="artist-grid">`;
        for (const a of vipArtists) {
            html += renderArtistCard(a, count, followedMap);
        }
        html += `</div>`;
    }

    if (normalArtists.length > 0) {
        html += `<div class="section-title" style="margin-top: 24px; color: rgba(255,255,255,0.3); font-size: 1rem; letter-spacing: 1px;">${roleTitle}</div>`;
        html += `<div class="artist-grid">`;
        for (const a of normalArtists) {
            html += renderArtistCard(a, count, followedMap);
        }
        html += `</div>`;
    }
}

        grid.innerHTML = html;

    } catch (e) {
        grid.innerHTML = '<div class="empty">加载失败，请刷新</div>';
        console.error(e);
    }
}

// ===== 渲染单个艺术家卡片 =====
function renderArtistCard(a, count, followedMap) {

// ===== 播放歌曲 =====
let currentSongId = null;

function playSong(songId) {
    const song = allSongs.find(s => s.id === songId);
    console.log('找到的歌曲:', song);
    if (!song) return;

    const audio = document.getElementById('audioPlayer');
    const player = document.getElementById('player');

    if (currentSongId === songId) {
        if (audio.paused) {
            audio.play();
            updatePlayBtn(songId, '⏸');
        } else {
            audio.pause();
            updatePlayBtn(songId, '▶');
        }
        return;
    }

    if (currentSongId) {
        updatePlayBtn(currentSongId, '▶');
    }

    currentSongId = songId;
    document.getElementById('playerName').textContent = song.title || '未命名';
    document.getElementById('playerArtist').textContent = '歌手';
    audio.src = song.audio_url || '';
    player.classList.add('show');

    audio.play();
    updatePlayBtn(songId, '⏸');

    audio.onended = function() {
        updatePlayBtn(songId, '▶');
        currentSongId = null;
    };

    audio.onpause = function() {
        updatePlayBtn(songId, '▶');
    };

    audio.onplay = function() {
        updatePlayBtn(songId, '⏸');
    };
}

function updatePlayBtn(songId, icon) {
    const btn = document.getElementById(`play-btn-${songId}`);
    if (btn) {
        // 更新图标
        const iconSpan = document.getElementById(`play-icon-${songId}`);
        if (iconSpan) {
            iconSpan.textContent = icon;
        }
        // 播放时按钮微微发光
        if (icon === '⏸') {
            btn.style.boxShadow = '0 0 20px rgba(212,184,150,0.3)';
        } else {
            btn.style.boxShadow = '0 2px 12px rgba(184,160,200,0.15)';
        }
    }
}

// ===== 简单雪花（50颗，带光晕） =====
let snowLWParticles = [];
let snowLWAnimationId = null;

function startSnowLW() {
    const canvas = document.getElementById('snow-lw-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    snowLWParticles = [];
    for (let i = 0; i < 50; i++) {
        snowLWParticles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 4 + 2,
            speed: Math.random() * 0.4 + 0.1,
            wind: (Math.random() - 0.5) * 0.15,
            opacity: Math.random() * 0.3 + 0.1
        });
    }
    drawSnowLW(ctx, canvas);
}

function drawSnowLW(ctx, canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    snowLWParticles.forEach(p => {
        p.y += p.speed;
        p.x += p.wind + Math.sin(p.y / 100) * 0.2;
        if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
        }
        if (p.x < -20) p.x = canvas.width + 20;
        if (p.x > canvas.width + 20) p.x = -20;

        // 光晕
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
        gradient.addColorStop(0, `rgba(255, 255, 255, ${p.opacity})`);
        gradient.addColorStop(0.3, `rgba(255, 255, 255, ${p.opacity * 0.4})`);
        gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * 3, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
    });
    snowLWAnimationId = requestAnimationFrame(() => drawSnowLW(ctx, canvas));
}

function toggleAlbum(albumId) {
    const el = document.getElementById(`album-${albumId}`);
    if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
}

function stopSnowLW() {
    if (snowLWAnimationId) {
        cancelAnimationFrame(snowLWAnimationId);
        snowLWAnimationId = null;
    }
    snowLWParticles = [];
    const canvas = document.getElementById('snow-lw-canvas');
    if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
}
document.addEventListener('DOMContentLoaded', function() {
    startSnowLW();
});

async function handleFollow(musicianId) {
    if (!musicianId) return;
    const result = await Follow.toggle(musicianId);
    // 更新按钮文字和颜色
    const btn = document.getElementById(`follow-btn-${musicianId}`);
    if (btn) {
        btn.textContent = result.followed ? '❤️ 已关注' : '🤍 关注';
        btn.style.color = result.followed ? '#e88a8a' : 'rgba(255,255,255,0.3)';
    }
    // 更新粉丝数显示（找到卡片里的粉丝数元素）
    const card = btn?.closest('.artist-card') || btn?.closest('.vip-card');
    if (card) {
        const countEl = card.querySelector('.count:last-child');
        if (countEl) {
            countEl.textContent = '❤️ ' + result.count + ' 粉丝';
        }
    }
}

        );
        const data = await resp.json();
        const currentPlays = data[0]?.plays || 0;
        // 播放量 +1
        await fetch(
            `${SUPABASE_URL}/rest/v1/works?id=eq.${songId}`,
            {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ plays: currentPlays + 1 })
            }
        );
    } catch (e) {
        console.warn('播放量更新失败:', e);
    }
    // 跳转播放页
    window.location.href = `player.html?id=${songId}`;
}

</script>
