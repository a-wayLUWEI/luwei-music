<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌词投稿审核 · 芦苇音乐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #121212;
            color: #ddd;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #d4b896;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .sub {
            color: rgba(255,255,255,0.15);
            font-size: 0.7rem;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.2);
        }
        .stats span { background: rgba(255,255,255,0.03); padding: 4px 14px; border-radius: 20px; }
        .stats .num { color: #d4b896; font-weight: 600; }

        .item {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 12px;
            border-left: 3px solid #d4b896;
        }
        .item .title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
        }
        .item .author {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
            margin-left: 8px;
        }
        .item .content {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin: 8px 0 10px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .item .meta {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.12);
        }
        .item .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .item .actions button {
            padding: 6px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-approve { background: rgba(76, 175, 80, 0.15); color: rgba(76, 175, 80, 0.6); }
        .btn-approve:hover { background: rgba(76, 175, 80, 0.25); }
        .btn-reject { background: rgba(229, 57, 53, 0.15); color: rgba(229, 57, 53, 0.6); }
        .btn-reject:hover { background: rgba(229, 57, 53, 0.25); }
        .btn-delete { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.15); }
        .btn-delete:hover { background: rgba(255,255,255,0.06); }

        .empty {
            text-align: center;
            color: rgba(255,255,255,0.08);
            padding: 60px 0;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.55rem;
            padding: 2px 12px;
            border-radius: 20px;
            margin-left: 10px;
            letter-spacing: 1px;
        }
        .status-badge.pending { background: rgba(255, 193, 7, 0.1); color: rgba(255, 193, 7, 0.5); }
        .status-badge.approved { background: rgba(76, 175, 80, 0.1); color: rgba(76, 175, 80, 0.5); }
        .status-badge.rejected { background: rgba(229, 57, 53, 0.1); color: rgba(229, 57, 53, 0.5); }

        .refresh-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.15);
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.6rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .refresh-btn:hover { border-color: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div>
            <h1>📝 歌词投稿审核</h1>
            <div class="sub">所有投稿都会显示在这里，你可以通过或拒绝</div>
        </div>
        <button class="refresh-btn" onclick="loadSubmissions()">🔄 刷新</button>
    </div>

    <div class="stats" id="stats">
        <span>全部 <span class="num" id="totalCount">0</span></span>
        <span>待审 <span class="num" id="pendingCount">0</span></span>
        <span>已通过 <span class="num" id="approvedCount">0</span></span>
    </div>

    <div id="list"></div>
</div>

<script>
const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

async function loadSubmissions() {
    const list = document.getElementById('list');
    list.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.05);">加载中...</div>';

    try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/lyric_submissions?order=created_at.desc`, {
            headers: { 'apikey': SUPABASE_KEY }
        });
        const data = await resp.json();

        if (!data || data.length === 0) {
            list.innerHTML = '<div class="empty">暂无投稿</div>';
            document.getElementById('totalCount').textContent = '0';
            document.getElementById('pendingCount').textContent = '0';
            document.getElementById('approvedCount').textContent = '0';
            return;
        }

        const pending = data.filter(d => d.status === 'pending' || !d.status);
        const approved = data.filter(d => d.status === 'approved');

        document.getElementById('totalCount').textContent = data.length;
        document.getElementById('pendingCount').textContent = pending.length;
        document.getElementById('approvedCount').textContent = approved.length;

        list.innerHTML = data.map(item => {
            const status = item.status || 'pending';
            const statusMap = {
                'pending': '<span class="status-badge pending">⏳ 待审</span>',
                'approved': '<span class="status-badge approved">✅ 已通过</span>',
                'rejected': '<span class="status-badge rejected">❌ 已拒绝</span>'
            };
            return `
                <div class="item" data-id="${item.id}">
                    <div>
                        <span class="title">${item.title || '无标题'}</span>
                        <span class="author">${item.author || ''}</span>
                        ${statusMap[status] || ''}
                    </div>
                    <div class="content">${item.content || ''}</div>
                    <div class="meta">
                        ${item.submitter_name || '匿名'} ·
                        ${item.submitter_email || ''} ·
                        ${item.created_at ? new Date(item.created_at).toLocaleDateString() : ''}
                    </div>
                    ${status === 'pending' ? `
                        <div class="actions">
                            <button class="btn-approve" onclick="updateStatus(${item.id}, 'approved')">✅ 通过</button>
                            <button class="btn-reject" onclick="updateStatus(${item.id}, 'rejected')">❌ 拒绝</button>
                        </div>
                    ` : `
                        <div class="actions">
                            <button class="btn-delete" onclick="deleteSubmission(${item.id})">🗑️ 删除</button>
                        </div>
                    `}
                </div>
            `;
        }).join('');

    } catch (e) {
        list.innerHTML = '<div class="empty">加载失败，请刷新</div>';
        console.error(e);
    }
}

async function updateStatus(id, status) {
    if (!confirm(`确定要${status === 'approved' ? '通过' : '拒绝'}这条投稿吗？`)) return;
    try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/lyric_submissions?id=eq.${id}`, {
            method: 'PATCH',
            headers: {
                'apikey': SUPABASE_KEY,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ status: status })
        });
        if (resp.ok) {
            loadSubmissions();
        } else {
            alert('操作失败，请检查网络');
        }
    } catch (e) {
        alert('操作失败');
    }
}

async function deleteSubmission(id) {
    if (!confirm('确定要删除这条投稿吗？')) return;
    try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/lyric_submissions?id=eq.${id}`, {
            method: 'DELETE',
            headers: { 'apikey': SUPABASE_KEY }
        });
        if (resp.ok) {
            loadSubmissions();
        } else {
            alert('删除失败');
        }
    } catch (e) {
        alert('删除失败');
    }
}

loadSubmissions();
</script>
</body>
</html>
