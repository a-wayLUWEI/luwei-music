<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>芦苇风格歌词素材库 · 按「体」分类</title>

        body {
            background: linear-gradient(145deg, #1a3a2a 0%, #0e2a1f 100%);
            font-family: 'Segoe UI', 'Poppins', 'Noto Sans SC', system-ui;
            padding: 20px;
            min-height: 100vh;
            color: #F5ECD7;
        }
        .app-container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 100px);
        }
        
        /* ========== 左侧导航栏 ========== */
        .sidebar {
            width: 260px;
            background: #0f281dcc;
            border-radius: 28px;
            border: 1px solid #F2C94C40;
            padding: 16px;
            height: fit-content;
            position: sticky;
            top: 20px;
            backdrop-filter: blur(4px);
        }
        .sidebar-header {
            text-align: center;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid #F2C94C30;
        }
        .sidebar-header h3 {
            color: #FFD966;
            font-size: 1rem;
        }
        .sidebar-header p {
            color: #AAD4B0;
            font-size: 0.6rem;
            margin-top: 4px;
        }
        .stats-badge {
            background: #E69A2E20;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.6rem;
            text-align: center;
            margin-top: 10px;
            color: #FFD966;
        }
        .style-list {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 6px;
        }
        .style-list::-webkit-scrollbar { width: 4px; }
        .style-list::-webkit-scrollbar-track { background: #1a3a2a; border-radius: 4px; }
        .style-list::-webkit-scrollbar-thumb { background: #E69A2E; border-radius: 4px; }
        
        .style-group {
            margin-bottom: 12px;
        }
        .style-group-title {
            color: #FFD966;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 6px 8px;
            background: #1a3a2a;
            border-radius: 20px;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .style-item {
            padding: 6px 12px;
            margin: 2px 0;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.15s;
            color: #C8E6C9;
        }
        .style-item:hover {
            background: #2a4a3a;
            color: #FFD966;
        }
        .style-item.active {
            background: #E69A2E;
            color: #2D1E0C;
            font-weight: bold;
        }
        .style-count {
            float: right;
            opacity: 0.6;
            font-size: 0.6rem;
        }
        
        /* ========== 右侧主内容 ========== */
        .main-content {
            flex: 1;
            background: #0f281dcc;
            border-radius: 28px;
            border: 1px solid #F2C94C40;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .current-style-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid #F2C94C30;
        }
        .current-style-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #FFD966;
        }
        .current-style-desc {
            color: #AAD4B0;
            font-size: 0.7rem;
        }
        .add-btn {
            background: #E69A2E;
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            color: #2D1E0C;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
        }
        
        .lyrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 8px;
        }
        .lyrics-grid::-webkit-scrollbar { width: 6px; }
        .lyrics-grid::-webkit-scrollbar-track { background: #1a3a2a; border-radius: 4px; }
        .lyrics-grid::-webkit-scrollbar-thumb { background: #E69A2E; border-radius: 4px; }
        
        .lyrics-card {
            background: #1f3e2e;
            border-radius: 20px;
            padding: 14px;
            border-left: 4px solid #F2C94C;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lyrics-card:hover {
            background: #2a4a3a;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .card-title {
            color: #FFD966;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .card-lyricist {
            color: #AAD4B0;
            font-size: 0.55rem;
            margin-bottom: 8px;
        }
        .card-preview {
            color: #C8E6C9;
            font-size: 0.65rem;
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-reed {
            color: #D4C5A3;
            font-size: 0.6rem;
            font-style: italic;
            border-top: 1px dashed #F2C94C30;
            padding-top: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .empty-placeholder {
            text-align: center;
            padding: 60px;
            color: #AAD4B0;
            font-style: italic;
            grid-column: 1 / -1;
        }
        
        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: linear-gradient(145deg, #1f3e2e, #1a3a2a);
            border: 2px solid #FFD966;
            border-radius: 32px;
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px;
            position: relative;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            background: rgba(255,217,102,0.15);
            border: none;
            color: #FFD966;
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
        }
        .modal-title { font-size: 1.2rem; font-weight: bold; color: #FFD966; margin-bottom: 4px; padding-right: 30px; }
        .modal-style { color: #AAD4B0; font-size: 0.7rem; margin-bottom: 20px; }
        .modal-lyrics { font-size: 0.85rem; line-height: 1.7; color: #F5ECD7; white-space: pre-line; background: #0f281d60; padding: 16px; border-radius: 20px; margin-bottom: 20px; }
        .modal-reed { background: rgba(230,154,46,0.12); border-left: 3px solid #E69A2E; border-radius: 16px; padding: 16px; color: #D4C5A3; font-style: italic; font-size: 0.8rem; line-height: 1.6; }
        
        @media (max-width: 800px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; position: static; }
            .style-list { max-height: 300px; display: flex; flex-wrap: wrap; gap: 6px; }
            .style-group { width: 100%; }
            .style-group-title { display: inline-block; margin-right: 8px; }
            .style-item { display: inline-block; margin: 2px 4px; }
        }
    </style>
</head>

<script src="checkAuth.js"></script>
<div class="app-container">
    <!-- 左侧导航栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3> 芦苇风格歌词素材库</h3>

    { title: "未拆的信", lyricist: "A-WAY 芦苇", lyrics: "你写的信，我没拆\n怕拆了，就没了\n不拆，你还在里面\n在里面说着没说完的话\n\n信封的角磨白了\n磨白的是我的手指\n每摸一次，就薄一点\n薄到能看见你的字迹\n\n字迹模糊了\n模糊的是时间\n信纸发黄\n黄的是我没寄出去的那句\n\n信还在\n你不在了\n我在信的背面\n写了一行：未拆", reed: "信还在，你不在了。我在信的背面写了一行：未拆。" },
    { title: "地平线的背面", lyricist: "A-WAY 芦苇", lyrics: "地平线的背面\n是你转身之后的世界\n我没去过\n也没想去\n\n去到了，你也不在\n你在更远的背面\n背面有背面\n一直背下去\n\n背对背的时候\n我们最近\n近到能听见彼此的心跳\n心跳不在同一个节奏\n\n我的慢，你的快\n快到我追不上\n慢到我停不下来\n我们就这样，背对背走着", reed: "背对背的时候，我们最近。近到能听见彼此的心跳，心跳不在同一个节奏。" },
    { title: "你的留白", lyricist: "A-WAY 芦苇", lyrics: "你的留白太多了\n多到我填不满\n我试着往里扔想念\n扔进去就碎了\n\n留白的地方\n是你的犹豫\n犹豫成一片海\n我游不过去\n\n游不过去就沉了\n沉在你的犹豫里\n沉到底的时候\n看见了你的底线\n\n底线是你的名字\n写在留白的最深处\n深到我看不清\n看不清的是你的脸", reed: "你的留白太多。我沉在你的犹豫里，看见你的名字写在最深处。" },
    { title: "没说完的那句", lyricist: "A-WAY 芦苇", lyrics: "你没说完的那句\n卡在空气里\n空气变重了\n重到我的呼吸变了频率\n\n我每天对着空气\n把那句话说完\n说了很多遍\n每一遍都不一样\n\n一样的，是你说它的时候\n嘴型微微张开\n开到我看见你的舌尖\n舌尖上的那个字\n\n那个字我没听见\n听见了，也听不懂\n听懂了，也不敢承认\n承认了，你就真的走了", reed: "你没说完的那句，是我这一生最完整的句子。因为它没有结束。" },
    { title: "风的指纹", lyricist: "A-WAY 芦苇", lyrics: "你来的时候，风在窗上留下指纹\n指纹很浅，浅到像没来过\n我擦了又擦\n擦掉的是我的呼吸\n\n风的指纹是你的告别方式\n轻到我不确定\n你是在告别\n还是在说等一下\n\n我等了\n等到指纹被新的风覆盖\n新的风不是你\n它不知道我在这里等\n\n窗上什么都没有了\n干净得像你从未来过\n我还在擦\n擦我自己", reed: "风的指纹很浅，浅到像没来过。窗上什么都没有了，干净得像你从未来过。" },
    { title: "水的褶皱", lyricist: "A-WAY 芦苇", lyrics: "你走的那天，水起了褶皱\n皱纹从河心荡到岸边\n荡到我的脚趾\n凉了一下\n\n水的褶皱是你的叹息\n叹得那么轻\n轻到水都听不见\n听见的是倒影里的树\n\n树在抖\n抖落的叶子浮在水面\n像你留下的便条\n我捡不起来\n\n水皱了很久\n皱到忘了原来的样子\n我也皱了\n皱在你的叹息里", reed: "水的褶皱是你的叹息。我也皱了，皱在你的叹息里。" },
    { title: "光的台阶", lyricist: "A-WAY 芦苇", lyrics: "你踩着光上去的\n光做了台阶\n一级一级\n高到我仰头看不见\n\n你在光的顶端\n我在光的末尾\n末尾很暗\n暗到我看不清自己的手\n\n手还举着\n举着你走的时候没带走的东西\n东西很轻\n轻到像没拿过\n\n光台阶塌了\n塌在我脚下\n我站在废墟里\n看你的光远去", reed: "光台阶塌了。我站在废墟里，看你的光远去。" },
    { title: "声带的余音", lyricist: "A-WAY 芦苇", lyrics: "你的最后一句，卡在声带里\n声带不震了\n余音还在\n在我的耳蜗里绕\n\n余音绕了三年\n绕成毛线\n我把毛线拆了\n拆出来的还是那句话\n\n话说了一半\n另一半在你嘴里\n嘴闭上了\n闭上就是一辈子\n\n我的耳朵长出了回声\n回声是你的\n回声不是你的\n是你留下的空", reed: "余音绕了三年。我的耳朵长出了回声，是你留下的空。" },
    { title: "呼吸的时差", lyricist: "A-WAY 芦苇", lyrics: "你呼吸的时候，我在憋气\n憋到你呼完\n我才敢吸\n\n我们之间隔着半个呼吸的时差\n半个呼吸，够不够你想起我\n够不够你在吸气的时候\n把我也吸进去\n\n你呼出来的空气\n我吸进去了\n你在我肺里住了一秒\n然后被我呼走\n\n呼走了就没了\n没了就空着\n空着的肺\n等着你下一次呼吸", reed: "半个呼吸的时差。你在我肺里住了一秒，然后没了。" },
    { title: "泪的密度", lyricist: "A-WAY 芦苇", lyrics: "你的泪比我的重\n重到落下来的时候\n地会疼\n疼了也不说\n\n我的泪太轻了\n轻到飘在半空\n飘着飘着\n变成雾\n\n雾里有你\n你在雾里看我\n看不清楚\n你就走了\n\n你的泪落地了\n我的泪还没落\n等你的泪干了\n我的还在飘", reed: "你的泪落地了，我的泪还没落。等你的泪干了，我的还在飘。" },
    { title: "梦的接口", lyricist: "A-WAY 芦苇", lyrics: "你从我的梦里走出去的时候\n没关门\n门开着\n风进来了\n\n风带来的不是你\n是你那边的落叶\n落叶卷起我的梦角\n卷了一整夜\n\n梦被你撕了一个口子\n我试着缝合\n缝上的不是梦\n是你在梦里的样子\n\n样子模糊了\n模糊的是我的记忆\n记忆在梦的接口处\n堵着", reed: "梦被你撕了一个口子。记忆在梦的接口处，堵着。" },
    { title: "影子的偏头痛", lyricist: "A-WAY 芦苇", lyrics: "你的影子落在我身上\n太重了\n重到我的影子歪了\n歪了一辈子\n\n我的影子在疼\n疼的时候会想起你\n想起你站在我左边\n影子叠着影子\n\n现在你的影子走了\n我的影子还歪着\n歪着看路\n路上的每个影子都像你\n\n影子有偏头痛\n痛的时候\n我把灯关了\n灯关了，影子就没了吗", reed: "你的影子走了，我的影子还歪着。路上的每个影子都像你。" },
    { title: "盐的结晶", lyricist: "A-WAY 芦苇", lyrics: "你在我心里流的泪\n结成了盐\n盐很白\n白到你来了也看不见\n\n盐越结越厚\n厚到心跳的声音变了\n变闷了\n闷得像你的沉默\n\n我把盐挖出来\n撒在伤口上\n疼的是你\n还是我\n\n盐化不了\n化不了就不化了\n留着\n等你来尝", reed: "你在我心里流的泪，结成了盐。留着，等你来尝。" },
    { title: "弦的松紧", lyricist: "A-WAY 芦苇", lyrics: "你把我心里的弦调松了\n松到弹不出声音\n弹不出的是我想说的话\n话说出来也是走调的\n\n弦太松了\n我拧紧\n拧到断了\n断的声音是你走的那一声\n\n弦断了\n接不上\n接上了也不是原来的音\n音变了，调变了\n\n我弹不出你的曲子了\n曲子在断弦的时候\n卡住了\n卡在你最后一个音符里", reed: "弦断了，卡在你最后一个音符里。我弹不出你的曲子了。" },
    { title: "褪", lyricist: "A-WAY 芦苇", lyrics: "你的颜色褪了\n褪成灰\n灰是过渡色\n等灰褪了，就没了\n\n我在褪的过程中看你\n看你从深到浅\n浅到快透明\n透明到我能穿过你\n\n穿过去的时候\n我碰了一下\n碰的是你还在的温度\n温度不在了\n\n褪完了\n你变成了空气\n空气里有你\n我不知道", reed: "褪完了，你变成了空气。空气里有你，我不知道。" },
    { title: "够", lyricist: "A-WAY 芦苇", lyrics: "伸手，够不到\n踮脚，够不到\n跳起来，还是够不到\n你在我头顶三尺\n三尺，是天堂的距离\n\n够不到就不够了\n骗自己的话\n说了一千遍\n手还是伸着\n\n够了一辈子\n手酸了\n酸了也不收回来\n收回来就真的够了\n我不想够", reed: "够了一辈子，手酸了也不收回来。收回来就真的够了，我不想够。" },
    { title: "远", lyricist: "A-WAY 芦苇", lyrics: "你远在天边\n天边多远了\n我不知道\n知道你不在我身边\n\n你在身边的时候\n你也远\n你看着远方\n我看着你\n你远的时候，我近\n我近的时候，你看不见\n\n远的不是你\n是你不看我的那一眼\n那一眼的焦距\n调到无限远", reed: "远的不是你，是你不看我的那一眼。那一眼的焦距，调到无限远。" },
    { title: "光", lyricist: "A-WAY 芦苇", lyrics: "光照在你身上\n你发光了\n光没照我\n我暗着\n\n我暗着看你\n看你发光\n光刺眼\n我闭着眼睛看\n\n你发光的时候\n离我很远\n远到我以为你是星星\n星星是别人的\n你不是", reed: "你发光的时候离我很远，远到我以为你是星星。星星是别人的，你不是。" },
    { title: "落", lyricist: "A-WAY 芦苇", lyrics: "叶子落了\n落到地上\n你走了\n走的时候没有声音\n\n叶子落的时候\n还会响一声\n你走了\n什么都没留下\n\n我捡起叶子\n夹进书里\n你走了\n我拿什么夹", reed: "叶子落的时候会响一声。你走了，什么都没留下。" },
    { title: "错", lyricist: "A-WAY 芦苇", lyrics: "你说的对\n我们错了\n错的时间\n错的地点\n\n错的不止这些\n错的是我\n明知错了\n还对了下去\n\n对到错变成对\n对到分不清对错\n对到你说算了\n我还觉得对", reed: "明知错了，还对了下去。对到你说算了，我还觉得对。" },
    { title: "等", lyricist: "A-WAY 芦苇", lyrics: "等你转身\n你不转\n等你回头\n你不回\n\n等你开口\n你沉默\n等你来\n你走了\n\n等了一辈子\n等来了什么\n等来了\n不等了", reed: "等了一辈子，等来了不等了。" },
    { title: "忘", lyricist: "A-WAY 芦苇", lyrics: "忘了你的名字\n忘不了你的姓\n忘了你的声音\n忘不了你的语气\n\n忘了你的样子\n忘不了你的背影\n背影走远了\n我还站着\n\n忘了你\n忘了无数遍\n每一遍都记得\n记的是忘这件事", reed: "忘了无数遍，每一遍都记得。记的是忘这件事。" },
    { title: "空", lyricist: "A-WAY 芦苇", lyrics: "房间空了一半\n另一半是你\n你不在\n你占着\n\n心空了一半\n另一半是你\n你不在了\n你占着\n\n空的地方\n住着不空的人\n人不在了\n位置还留着", reed: "人不在了，位置还留着。空的地方，住着不空的人。" },
    { title: "凉", lyricist: "A-WAY 芦苇", lyrics: "你的手凉\n我的手也凉\n你冷的时候\n我不在\n\n我的手凉\n是你的手不在\n你不在了\n我的手也不会暖了\n\n暖是两个人的事\n一个人暖不了\n暖不了就不暖了\n凉着", reed: "暖是两个人的事。一个人暖不了，凉着。" },
    { title: "停", lyricist: "A-WAY 芦苇", lyrics: "你停了\n我也停了\n你停在远方\n我停在原地\n\n你停的地方\n是别人的开始\n我停的地方\n是你的结束\n\n停着\n停着\n停成了一种姿势\n停到不会走", reed: "你停的地方是别人的开始，我停的地方是你的结束。停到不会走。" },
    { title: "了", lyricist: "A-WAY 芦苇", lyrics: "你走了\n我哭了\n哭了\n就了了\n\n了了\n就忘了\n忘了\n真的了了\n\n了了\n了了\n了了也好\n好了", reed: "了了也好。好了。" },
    { title: "够不到", lyricist: "A-WAY 芦苇", lyrics: "够不到的你\n最想要\n得不到的你\n最忘不掉\n我把自己困在这个循环里\n出不去了\n\n够不到，就不够了吗\n我问自己\n答案在风里\n风不回答\n\n得不到，就不要了吗\n我问自己\n答案在心里\n心不撒谎\n\n心说，你还在\n心说，你骗自己\n心说，算了\n算了，就不够了吗", reed: "心说算了。算了，就不够了吗。" },
    { title: "你的身后", lyricist: "A-WAY 芦苇", lyrics: "你往前走，我跟在你身后\n你不回头，我也在\n你回头了，我还是在\n我的位置，永远不会变\n\n你身后，是你看不见的地方\n我在这里，你从来不转过来\n不是你不转\n是你不知道这里有人\n\n你的身后，是我的世界\n我的世界只有你的背影\n背影不会转身\n转身了，也不是看我", reed: "你的身后是我的世界。背影不会转身，转身了，也不是看我。" },
    { title: "够不到的温度", lyricist: "A-WAY 芦苇", lyrics: "你是我够不到的温度\n不冷不热\n刚好在我够不到的地方\n我伸手，你远了\n我缩手，你近了\n近的时候，我不敢靠近\n远的时候，我追不上\n\n温度是你的体温\n我没有\n我的体温是凉的\n凉是因为你不在", reed: "够不到的温度，刚好在我够不到的地方。伸手远了，缩手近了。" },
    { title: "你不在的我", lyricist: "A-WAY 芦苇", lyrics: "你不在的我，不是完整的我\n缺的那块，在你那里\n你拿着，不还\n我不拿，不抢\n\n我等你还\n等你想起我\n等你把缺的那块送回来\n送来的时候，我还认得吗\n\n你不在的我，等了很久\n久到忘了在等什么\n等的是你\n还是自己的完整", reed: "你不在的我，缺的那块在你那里。等的是你，还是自己的完整。" },
    { title: "云的背面", lyricist: "A-WAY 芦苇", lyrics: "云的背面，是雨\n我的背面，是你\n你在我看不见的地方下着雨\n我在这里，淋不到\n\n云的背面，是风\n我的背面，是空\n你把我吹散了\n我落在地上，找不到自己的影子\n\n等雨停了，等风过了\n我还在这里，你呢", reed: "云的背面是你。你下着雨，我淋不到。" },
    { title: "天边外", lyricist: "A-WAY 芦苇", lyrics: "天边外，不是地理概念\n是我够不到的你的心\n我站在这里，你在那里\n中间隔着一整个宇宙的荒芜\n\n天边外，是地平线的那头\n还是你转身之后的那个背影\n我分不清了\n我连自己的影子都认不出了\n\n就这样站着\n站成一座山\n站成一颗星\n站成你路过时\n会看一眼的风景", reed: "站成你路过时，会看一眼的风景。" },
    { title: "高处", lyricist: "A-WAY 芦苇", lyrics: "你在高处，我在低处\n中间隔着风的高度\n你吹过的时候，我摇晃了一下\n然后假装什么都没发生\n\n高处是你的位置\n低处是我的位置\n你看着远方，我看着你\n我们都是孤独的\n\n高处是你的选择\n低处是我的宿命\n你飞向你的天空\n我在地上，种一棵等你的树", reed: "高处是你的选择，低处是我的宿命。我在地上种一棵等你的树。" },
    { title: "天梯", lyricist: "A-WAY 芦苇", lyrics: "我搭了一座天梯，通向你\n爬到一半，梯子断了\n不是梯子不够结实\n是我太重，还是你太轻\n\n我在半空中，上不去，下不来\n风很大，吹得我晃\n我不敢松手，也不敢往上爬\n怕爬上去，那里也没有你\n\n天梯断了，你的名字还在\n刻在我手心，擦不掉\n你给的痛，像掌纹\n越看越深，越深越看不清", reed: "天梯断了，你的名字还在。刻在我手心，擦不掉。" },
    { title: "不可及", lyricist: "A-WAY 芦苇", lyrics: "你是不可及的星辰\n我是仰望的人\n我知道你离我很远\n远的不是距离，是时间\n\n你发出的光，走了很久\n才到我这里\n我看到你的时候\n你已经是之前的你了\n\n不可及的你，最让我着迷\n着迷的不是你\n是我自己幻想出来的你\n我爱的，是我的幻觉", reed: "不可及的你，最让我着迷。着迷的不是你，是我自己幻想出来的你。" },
    { title: "光年", lyricist: "A-WAY 芦苇", lyrics: "你离我几光年\n我看你的眼睛，是几年前的你\n你看到我，是几年后的我\n我们永远错着时间\n\n光年的概念，我学过\n但我学不会的是\n你怎么能离我这么远\n远到时间都追不上\n\n光年之外，你在哪里\n光年之内，我在这里\n我走不进你的光年\n你走不出我的记忆", reed: "光年之外，你在哪里。光年之内，我在这里。你走不出我的记忆。" },
    { title: "引力", lyricist: "A-WAY 芦苇", lyrics: "你有你的引力\n我有我的轨道\n我被你吸引，绕着你转\n转了一圈又一圈，停不下来\n\n你不看我，我也在\n你不理我，我也不走\n我的轨道是圆的\n永远回不到起点\n\n引力是物理\n你是我的定律\n我逃不出你的范围\n你也看不见我的存在", reed: "引力是物理，你是我的定律。我逃不出你的范围。" },
    { title: "你不在的星空下", lyricist: "A-WAY 芦苇", lyrics: "星空很美，你不在\n你不在的时候，星空也不美了\n不是星星少了\n是我的眼睛，只看得见你\n\n你不在的星空下\n我一个人站着\n站了很久，站到星星移位\n站到银河转了一个方向\n\n你在的时候，星星是亮的\n你不在的时候，星星是冷的\n亮的是你的眼睛\n冷的是我摸不到你的手", reed: "你在的时候星星是亮的，你不在的时候星星是冷的。亮的是你的眼睛。" },
    { title: "天很高", lyricist: "A-WAY 芦苇", lyrics: "天很高，高到看不见顶\n你很高，高到我踮起脚也够不到\n我踮了很久，脚酸了\n你低头了吗\n没有\n\n天很高，你的心更高\n我爬不上去\n我在地上，看着你\n看着看着，脖子酸了\n\n天很高，我的梦更高\n梦里有你\n醒来你不在\n不在就不在了", reed: "天很高，你的心更高。我在地上，看着你，脖子酸了。" },
    { title: "你比天空远", lyricist: "A-WAY 芦苇", lyrics: "你比天空还远\n天空有尽头\n你没有\n\n我走了一辈子\n走不到你那里\n不是你太远\n是我的心，停在了原地\n\n你比天空远，比我梦到的还要远\n远到我的梦里都没有你\n梦不到你，就不睡了\n不睡了，就醒着\n醒着，就想着\n想着，就疼了", reed: "你比天空远。远到我的梦里都没有你。" },
    { title: "星的背面", lyricist: "A-WAY 芦苇", lyrics: "星的背面是什么\n是你藏起来的那部分自己吗\n星星有背面，你有吗\n我有吗\n\n我永远看不见你的背面\n你也不让我看见\n我看见了，会怎样\n会离开吗\n会留下吗\n\n星的背面，是暗\n我的背面，是你\n你是我的暗\n我看不清你", reed: "星的背面是暗，我的背面是你。你是我的暗，我看不清你。" },
    { title: "够不到的天", lyricist: "A-WAY 芦苇", lyrics: "天是你的，不是我的\n我借来仰望\n望久了，天也会疼吗\n疼的时候，会下雨吗\n\n雨是你的泪\n还是我的\n分不清了\n分不清就不分了\n\n我把天还给你\n把仰望留下\n仰望是一个姿势\n姿势里全是你\n\n够不到的天\n就不够了\n不够了\n就低了\n低了也好\n低了，就不仰了\n不仰了，就看见你了\n你在地上", reed: "够不到的天，就不够了。低了也好，低了就看见你了。你在地上。" }
],
    // 飘流体
"飘流体": [
    { title: "白云", lyricist: "A-WAY 芦苇", lyrics: "白云飘着，没有方向\n我跟着它，也没有方向\n飘到哪里算哪里\n你在哪里，我就飘到哪里\n\n风来了，白云散了\n散了就散了\n不散也留不住\n你走了，你也散了\n\n白云不问我为什么飘\n你也不问我\n我飘着飘着\n就忘了自己是谁\n\n忘了也好\n忘了就不疼了\n不疼了\n就继续飘着", reed: "白云飘着，没有方向。你走了，你也散了。忘了也好，忘了就不疼了。" },
    { title: "飘", lyricist: "A-WAY 芦苇", lyrics: "飘了一路，落下来的时候\n你不在\n落地的声音很轻\n轻到像没落过\n\n飘的时候以为不疼\n落地的那一下\n疼了\n疼的是你没接\n\n飘是假的\n沉是真的\n沉在你踩过的空气里\n空气是凉的\n凉到我的影子都缩了\n\n不飘了\n沉在这里\n等你路过\n你路过的时候\n我浮了一下\n又沉了", reed: "飘是假的，沉是真的。沉在你踩过的空气里，等你路过。" },
    { title: "随风", lyricist: "A-WAY 芦苇", lyrics: "随风的时候，不是我想飞\n是你推着我\n你推一下，我飘一下\n你不推了，我落了\n\n落在地上，地是凉的\n凉到我的心\n心沉下去\n沉到你推我的那一刻\n那一刻很短\n短到像没发生过\n\n随风久了，忘了方向\n方向是你\n你走了\n我就没有方向了\n没有方向就不走了\n停在原地\n\n原地有你的风\n风吹过的时候\n我晃了一下\n晃完又停了", reed: "随风久了，忘了方向。方向是你，你走了，我就没有方向了。" },
    { title: "云的流浪", lyricist: "A-WAY 芦苇", lyrics: "云飘着飘着就散了\n不是它想散\n是风不让它留着\n\n我飘着飘着也散了\n散成雨\n落在你的屋顶\n你在屋里听雨\n听的是声音\n不是雨里的我\n\n雨停了\n我蒸成雾\n雾里有你的影子\n影子很淡\n淡到像没来过\n\n云流浪了一辈子\n最后落在一座没人的山上\n山上有棵枯树\n我落在枯枝上\n不走了\n不走就不走了", reed: "云流浪了一辈子，最后落在一座没人的山上。不走了，不走就不走了。" },
    { title: "风的去向", lyricist: "A-WAY 芦苇", lyrics: "风去了哪里，你去了哪里\n我不知道\n我知道的是风停的时候\n你也不在\n\n风停了，我落了\n落在你站过的地方\n地方是空的\n空得只剩下你的名字\n\n名字太轻\n轻到风吹就散\n散了就没了\n没了就不找了\n\n风来的时候\n我又飘了\n飘到你走过的那条路\n路上有你的脚印\n脚印被风抹平了\n抹平了就没了", reed: "风来的时候我又飘了，飘到你走过的那条路。路上有你的脚印，被风抹平了。" },
    { title: "浮", lyricist: "A-WAY 芦苇", lyrics: "浮在水面，水是凉的\n凉到我的影子沉了\n沉到水底\n水底有你的石子\n石子沉了很久\n长满了青苔\n\n我试着沉下去\n沉到石子旁边\n石子不说话\n我也不说\n我们沉在一起\n等着水干\n\n水不干\n我就不浮\n你也不来\n浮起来的时候\n水面有你的倒影\n倒影是浮的\n不是沉的\n\n沉下去的才是真的", reed: "浮起来的时候，水面有你的倒影。倒影是浮的，不是沉的。沉下去的才是真的。" },
    { title: "轻", lyricist: "A-WAY 芦苇", lyrics: "你说我很轻\n轻到像没有\n有还是有的\n只是你不觉得\n\n我沉的时候\n你不知道\n沉在你的忽视里\n忽视很重\n重到我喘不过气\n\n轻是给你的印象\n重是我自己的\n你摸不到我的重\n你只摸到我的轻\n轻的是壳\n重的是心\n\n心沉下去\n沉到你看不见的地方\n你看不见\n就不看了\n我继续沉\n沉到地心\n地心是你\n你不热\n你冷", reed: "轻是给你的印象，重是我自己的。你摸不到我的重，你只摸到我的轻。" },
    { title: "无根", lyricist: "A-WAY 芦苇", lyrics: "无根的时候，以为很轻\n轻到风一吹就走了\n走了很远\n远到看不见你的窗\n窗里有灯\n灯亮着\n你还在\n\n我落下来的时候\n没有根\n扎不进土里\n土是你的名字\n太远了\n远到我够不到\n\n不扎了\n飘着\n飘到你的窗口\n你关着灯\n看不见我\n我在黑暗里\n飘了一夜\n\n天亮了\n我落在地上\n地上有你的影子\n影子很重\n重到压着我\n起不来了\n起不来就不起了\n躺在这里\n等你踩过", reed: "无根的草，风一吹就倒。你不在，我就没有根。" },
    { title: "飞絮", lyricist: "A-WAY 芦苇", lyrics: "飞絮落下来的时候\n很轻\n轻到像没落\n我在你肩上\n停了一秒\n你弹了一下\n我坠了\n\n坠到地上\n地上有水\n水流着\n我跟着流\n流到你的脚边\n你走了\n没看见我\n\n飞絮是碎了的\n碎成很多片\n每一片都有你的名字\n名字太轻\n轻到风吹就散\n散了就没了\n\n我追着飞絮跑\n跑了一整天\n一粒也没抓住\n抓住的是你的呼吸\n呼吸很重\n重到我喘不过气\n喘不过气，就不喘了\n沉在路边\n等下一阵风", reed: "飞絮是碎了的，每一片都有你的名字。名字太轻，轻到风吹就散。" },
    { title: "散", lyricist: "A-WAY 芦苇", lyrics: "散了就散了\n不散又能怎样\n你走了，就散了\n散成碎片\n每片都沉\n沉到心底\n\n心底是你的位置\n位置空了\n空了很久\n空着的时候\n我把自己填进去\n填不平\n你是凹的\n我是凸的\n\n散的时候没有声音\n只有自己的心跳\n心跳慢了\n慢到像停了\n停了也好\n停了就不跳了\n不跳就不疼了\n\n散了一地\n捡不起来\n不捡了\n躺着\n等你来扫\n你不来\n我就一直碎着", reed: "散了就散了，不散又能怎样。你走了，就散了。" },
    { title: "吹过", lyricist: "A-WAY 芦苇", lyrics: "你吹过的时候\n我落了一下\n落得很快\n快到像没落\n你没看见\n你走了\n\n落在地上的我\n碎了\n碎成一粒一粒\n每一粒都是你\n我数了数\n少了一粒\n在你嘴里\n你没咽下去\n含着\n\n含着我的那粒\n你咽了吗\n咽了就不吐出来\n不吐出来\n我就一直在你身体里\n沉在胃里\n\n胃酸很疼\n疼的是你\n还是我\n分不清了\n分不清就不分了\n一起沉\n沉到你的血液里\n流一辈子", reed: "你吹过的时候我落了一下，你没看见。碎成一粒一粒，每一粒都是你。" },
    { title: "尘埃", lyricist: "A-WAY 芦苇", lyrics: "尘埃是沉的最小的重量\n落在你肩上的时候\n你没感觉\n我碎了\n你走了\n\n尘埃飘了很久\n飘到你呼吸里\n你吸进去\n我沉在你的肺\n肺很湿\n湿到化不开\n\n我沉了\n沉到你咳的时候\n咳出来的不是我\n是你的痰\n痰里有尘埃的碎屑\n你看不见\n\n尘埃不浮了\n沉在你看不见的地方\n你看不见\n就不看了\n我继续沉\n沉到地底\n地底有你丢的烟头\n烟灭了\n我还燃着", reed: "尘埃是沉的最小的重量。落在你肩上的时候你没感觉，我碎了，你走了。" },
    { title: "浮尘", lyricist: "A-WAY 芦苇", lyrics: "浮尘飘在光里\n光很重\n重到浮尘坠下来\n坠下来的那一下\n碰了一下你的睫毛\n你眨了\n\n眨的时候\n我掉了\n掉在你的书上\n书合上了\n我被夹在\n你没看完的那一页\n\n那页写着你的名字\n名字很轻\n轻到风一吹就散\n散的是字\n不是名字\n名字沉在我心里\n\n心沉了\n沉到胃里\n胃酸腐蚀\n腐蚀不掉\n你的名字太硬了\n硬到像骨头", reed: "名字很轻，轻到风一吹就散。散的是字，不是名字。名字沉在我心里。" },
    { title: "微光", lyricist: "A-WAY 芦苇", lyrics: "微光是你给的\n给了又不给了\n光灭了\n我沉了\n沉在黑暗里\n\n黑暗很重\n重到我浮不起来\n不浮了\n沉下去\n沉到你的梦里\n\n梦里你也在沉\n你的梦沉了\n沉到另一个人的梦里\n我追不上\n追不上就不追了\n\n沉在你的梦外\n梦外很冷\n冷到我的光也灭了\n灭了就不亮了\n不亮就不叫你\n你醒的时候\n我已经沉到底了", reed: "微光是你给的，给了又不给了。光灭了，我沉了。" },
    { title: "飘零", lyricist: "A-WAY 芦苇", lyrics: "飘零是落下来的花瓣\n落在你的脚边\n你踩了\n踩碎了\n碎的是我\n\n我飘了很久\n久到忘了颜色\n颜色褪了\n褪成灰\n灰是沉的颜色\n\n沉在雨里\n雨很大\n大到看不见你的背影\n背影远了\n远到我追不上\n追不上就停\n\n停在你的脚印里\n脚印被水冲走了\n冲走了就没了\n没了就不找了\n我还在\n还在你踩过的地方\n沉了一寸", reed: "飘零是落下来的花瓣。你踩碎了，碎的是我。" },
    { title: "落", lyricist: "A-WAY 芦苇", lyrics: "落下来的时候\n没有声音\n你听不见\n我疼\n\n落在地上\n地是凉的\n凉到我的心\n心沉下去\n沉到地心\n\n地心是你\n你不热\n你冷\n冷到我的心跳慢了\n慢了就停了\n停的时候\n我还在落\n\n落了一辈子\n没落地\n悬在半空\n半空有你的呼吸\n呼吸很重\n重到我坠落\n坠落的时候\n你接住了吗", reed: "落了一辈子没落地。半空有你的呼吸，呼吸很重，重到我坠落。" },
    { title: "浮游", lyricist: "A-WAY 芦苇", lyrics: "浮游在水面\n水面有你的倒影\n影子碎了\n我沉下去\n沉到影子碎的地方\n\n碎的是光\n不是影子\n影子在水底\n水底很深\n深到我够不到\n\n够不到就不够了\n沉到底\n底有你\n你躺着\n我浮在你旁边\n你不动\n我也不动\n\n浮游是动的\n我是沉的\n你看着我沉\n你不动\n你不动的时候\n我沉到你的心里\n心里是空的", reed: "浮游在水面，水面有你的倒影。影子碎了，我沉下去。" },
    { title: "无影", lyricist: "A-WAY 芦苇", lyrics: "无影是有影子\n你看不见\n影子沉在光里\n光很重\n重到影子坠了\n\n坠到地上\n地是白的\n白的刺眼\n刺的是你的眼睛\n你在看我吗\n看的是光\n不是影子\n\n影子没了\n没了就不找了\n我沉在你的光里\n光很薄\n薄到能穿过去\n\n穿过去的时候\n碰了一下你的手\n手缩回去了\n缩回去就没了\n没了就没了\n我沉在你缩回去的那一下\n那一下很重", reed: "无影是有影子，你看不见。影子沉在光里，光很重，重到影子坠了。" },
    { title: "散落", lyricist: "A-WAY 芦苇", lyrics: "散落了一地\n捡不起来\n不捡了\n沉在地上\n等你来踩\n\n你踩的时候\n我碎了\n碎成更小的粒\n每一粒都有你\n你走了\n粒还在地上\n\n风吹了\n粒飞了\n飞得很高\n高到像云\n云没有你\n我沉下来了\n\n沉到你走过的地方\n地方很旧\n旧到像你的童年\n童年里没有我\n我在你成年的鞋底\n鞋底破了\n我漏了", reed: "散落了一地，捡不起来。你踩的时候我碎了，碎成更小的粒，每一粒都有你。" },
    { title: "飞灰", lyricist: "A-WAY 芦苇", lyrics: "飞灰是烧过的\n烧的是我\n不是你的记忆\n记忆太轻\n轻到烧不着\n\n灰飞了\n飞到你眼里\n你眨了\n眨掉的是灰\n不是往事\n\n往事沉了\n沉在你心里\n心里有灰\n灰是你的\n不是我的\n\n我飞了\n飞到你够不到的地方\n你够不到\n就不够了\n灰落下来\n落在你走过的路上\n路很长\n长到我走不完\n走不完就不走了\n沉在那里\n等你回头", reed: "飞灰是烧过的。烧的是我，不是你的记忆。" },
    { title: "露水", lyricist: "A-WAY 芦苇", lyrics: "露水是夜里沉的\n天亮的时候\n它还在\n你在夜里来过\n天亮的时候\n你不在了\n\n露水是你的泪吗\n泪太轻\n轻到挂不住\n露水是沉的\n沉在叶尖\n等你来碰\n\n你碰了\n露水落了\n落在地上\n渗进土里\n土里有你的脚印\n脚印很深\n深到露水找到你\n\n找到你的时候\n天黑了\n你又来了\n又留下露水\n我不接了\n接住了也留不住\n留不住就算了\n算了就干了", reed: "露水是夜里沉的。天亮的时候它还在，你在夜里来过，天亮的时候你不在了。" },
    { title: "浮萍", lyricist: "A-WAY 芦苇", lyrics: "浮萍没有根\n漂到你的水域\n水是冷的\n冷到我的叶卷了\n卷起来的时候\n看见你的船远了\n\n船远了，水就空了\n空得只剩下波纹\n波纹荡过来\n荡到我身边\n摸了一下\n凉了\n\n你的桨划过的水面\n有我漂过的痕迹\n痕迹很淡\n淡到像没来过\n我漂远了\n远到看不见你的帆\n\n帆落了\n你停在哪\n我不知道\n我还在漂\n漂到水干了\n干也不上岸\n岸上没有你", reed: "浮萍没有根。船远了，水就空了。空得只剩下波纹。" },
    { title: "雾中", lyricist: "A-WAY 芦苇", lyrics: "你在雾里走\n走得很慢\n慢到我能数你的脚步\n脚步太轻\n轻到雾没散\n\n我跟在后面\n隔着雾\n雾是冷的\n冷到我的手指僵了\n伸不出去\n\n你的背影淡了\n淡到像烟\n烟散了\n你也散了\n散了就远了\n远到我看不见\n\n雾散的时候\n你不在\n我在\n我一个人站在雾散后的空地上\n空空的\n空的像你的口袋", reed: "雾散的时候你不在，我在。我一个人站在雾散后的空地上，空空的，空的像你的口袋。" },
    { title: "漂流", lyricist: "A-WAY 芦苇", lyrics: "漂流是你的方向\n我没有桨\n水推着我\n推到你曾经停过的地方\n你停过的水是静的\n静到我能听见自己的心跳\n\n心跳很慢\n慢到像水\n水流着\n你走了\n我还在你的水面上\n漂着\n\n水是冷的\n冷到我的心跳停了\n停了就不跳了\n不跳就沉了\n沉到你够不到的地方\n你够不到\n就不够\n\n我漂了很久\n久到忘了漂的目的\n目的不是找你\n是找到自己的沉\n沉的时候\n水是热的\n你不在", reed: "漂流是你的方向。你走了，我还在你的水面上漂着。" },
    { title: "水上的名字", lyricist: "A-WAY 芦苇", lyrics: "水上的名字是你写的\n写的时候手很轻\n轻到水没记住\n风来了\n名字散了\n\n散了就没了\n没了就不找了\n我沉在水底\n看水面的动静\n水面很静\n静到像没风\n\n你的名字沉了\n沉到我旁边\n沉的是字\n浮的是你\n你浮在水面\n我看得见\n够不到\n\n够不到就不够了\n沉在够不到的下面\n下面很暗\n暗到看不见你的倒影\n倒影也沉了", reed: "你的名字沉了，沉到我旁边。沉的是字，浮的是你。" },
    { title: "雨停了之后", lyricist: "A-WAY 芦苇", lyrics: "雨停了之后\n你走了\n你的脚印还在\n水洼里有你的倒影\n倒影很淡\n淡到像没站过\n\n我站在水洼边\n看你的倒影消失\n消失的时候\n天晴了\n晴得没有云\n云都不在，你更不在\n\n雨是冷的\n冷到我的手凉了\n凉了就不伸了\n缩回来\n抱住自己\n自己也是冷的\n\n雨停了\n你不回来了\n我等什么\n等水洼干\n水洼干了\n你的脚印也没了\n没了就没了\n我走了", reed: "雨停了之后你走了。水洼里有你的倒影，倒影很淡，淡到像没站过。" },
    { title: "薄雾", lyricist: "A-WAY 芦苇", lyrics: "薄雾是你的纱\n披在肩上\n你没有肩膀\n你是一阵风\n风把纱吹走了\n吹到我手里\n\n纱很薄\n薄到能看见你的影子\n影子很淡\n淡到像没来过\n我捧着纱\n捧着捧着\n纱没了\n\n没了就不捧了\n手空了\n空着手\n走在薄雾里\n雾里的你\n很远\n远的像隔了一生\n\n一生不长\n够我走完这片雾\n走完了\n你也不在\n我站在雾散的边缘\n边缘是空的", reed: "雾里的你很远，远的像隔了一生。一生不长，够我走完这片雾，走完了你也不在。" },
    { title: "蒸发", lyricist: "A-WAY 芦苇", lyrics: "水是冷的\n冷到我的指尖发白\n白得像你的衬衫\n衬衫晾在风里\n风是干的\n\n我等水蒸发\n等了一天\n水还在\n你不在\n水不干\n我不走\n\n蒸发的不是你\n是我\n我蒸成雾\n雾里有你\n你很远\n远的像在水的那边\n\n水的那边是岸\n岸上没有你\n我蒸干了\n干成一片水渍\n渍里有你的形状\n形状淡了\n淡到看不见", reed: "蒸发的不是你，是我。我蒸成雾，雾里有你，你很远。" },
    { title: "涟漪的尽头", lyricist: "A-WAY 芦苇", lyrics: "涟漪是你扔的石子\n石子沉了\n涟漪还在\n一圈一圈荡开\n荡到我脚下\n\n我蹲下来\n看涟漪的尽头\n尽头是你\n你站在岸上\n看着水面\n水面有我\n\n你看不见我\n你看见的是自己的倒影\n倒影碎了\n碎了就没了\n没了你就走了\n\n涟漪散了\n散了就静了\n静得像我\n我站在水上\n水是静的\n静的像没荡过", reed: "涟漪的尽头是你，你站在岸上看着水面。水面有我，你看不见。" },
    { title: "顺流", lyricist: "A-WAY 芦苇", lyrics: "顺流是你的方向\n我不选\n水推着我\n推到你转弯的地方\n你转弯了\n我直走\n\n直走的水更冷\n冷到我的骨头疼\n疼的时候\n想起你的温度\n你不热\n你凉\n\n凉的是水\n不是你\n你走了\n水还在\n我在水里\n顺着你走过的路\n走了一程\n\n一程很短\n短到不够记住你\n我忘了\n忘了就顺流而下\n下到你到不了的远方\n远方是空的\n空的我装不满", reed: "顺流是你的方向，你转弯了，我直走。一程很短，短到不够记住你。" },
    { title: "无岸", lyricist: "A-WAY 芦苇", lyrics: "漂了很久\n找不到岸\n岸是梦里的\n醒的时候\n水还在\n岸不见了\n\n水是迷的\n迷到分不清方向\n方向是你\n你不在\n就不走了\n\n停在水中央\n水中央没有你的影子\n影子沉了\n沉在我看不见的地方\n我看不见\n就不看了\n\n忘了漂了多久\n忘了岸的样子\n记得的是水\n水的颜色是你的颜色\n你的颜色褪了\n褪成灰\n灰是岸的颜色", reed: "忘了漂了多久，忘了岸的样子。记得的是水，水的颜色是你的颜色。" },
    { title: "流浪者的信", lyricist: "A-WAY 芦苇", lyrics: "信写了很久\n没寄出去\n地址是迷的\n迷到找不到你\n你不在地址上\n\n信纸黄了\n黄的是时间\n时间是虚的\n虚到像没流过\n字还在\n\n字是你的名字\n名字很幻\n幻到像梦里写的那一划\n那一划歪了\n歪到像你走的路\n\n信收起来\n收在梦里\n梦醒了\n信还在\n不寄了\n寄了你也收不到\n收不到就算了", reed: "信写了很久没寄出去。地址是迷的，迷到找不到你。" },
    { title: "没有地址的人", lyricist: "A-WAY 芦苇", lyrics: "你没有地址\n我找不到\n找的时候迷路了\n迷在一条没有名字的街\n街很虚\n虚到像没走过\n\n走过的地方\n都有你的影子\n影子很幻\n幻到像另一个你\n你不认识\n\n没有地址的人\n住在梦里\n梦里你来了\n醒了你走了\n走了就不来了\n我等着\n\n等的时候忘了你的样子\n忘了就忘了\n记得地址也没用\n地址是空的\n空的是你\n你是虚的", reed: "没有地址的人，住在梦里。梦里你来了，醒了你走了。" },
    { title: "远行", lyricist: "A-WAY 芦苇", lyrics: "远行是梦\n梦里你也在走\n走了很远\n远到像没出发\n\n出发的地方\n有你的脚印\n脚印很迷\n迷到像画的\n画里没有你\n\n你是幻的\n幻到像风\n风的方向不定\n我追不上\n追不上就不追了\n\n停下来的时候\n忘了自己是谁\n是谁不重要\n重要的是你在梦里\n梦醒了\n你是虚的\n我是空的", reed: "远行是梦，梦里你也在走。梦醒了，你是虚的，我是空的。" },
    { title: "过客", lyricist: "A-WAY 芦苇", lyrics: "你是过客\n路过我的梦\n梦很短\n短到像没做过\n\n忘了你的脸\n记得你来过\n来的时候很迷\n迷到像雾\n雾散了\n你走了\n\n过客没有名字\n名字是虚的\n虚到像没起过\n我忘了叫什么\n叫什么不重要\n\n你走后的梦\n空了\n空得干干净净\n干净得像没住过人\n我住在里面\n等你再来", reed: "你是过客，路过我的梦。梦很短，短到像没做过。" },
    { title: "驿站", lyricist: "A-WAY 芦苇", lyrics: "驿站是歇脚的地方\n你歇过\n歇的时候\n梦还没醒\n醒了你走了\n\n你留下的痕迹很迷\n迷到像没留过\n我找了一夜\n没找到\n找不到就算了\n\n驿站拆了\n拆的时候\n我在梦里\n梦是幻的\n幻到像真的\n真的你不在\n\n我站在废墟上\n忘了为什么来\n来了就来了\n走了就走了\n都不记得了", reed: "驿站是歇脚的地方，你歇过。你走了，痕迹很迷，迷到像没留过。" },
    { title: "归期不定", lyricist: "A-WAY 芦苇", lyrics: "归期是梦里的\n梦里的你\n说会回来\n回来的时候\n我不记得了\n\n时间是虚的\n虚到像没走\n等的时候忘了在等什么\n什么都忘了\n忘了就好\n\n归期不定的日子\n梦很多\n梦里你来了\n来了又走了\n走了就不回来\n\n我醒了\n醒的时候\n归期定了\n定在你不回来的那一天\n那一天很远\n远到像没到", reed: "归期是梦里的。梦里的你说会回来，回来的时候我不记得了。" },
    { title: "飘泊记", lyricist: "A-WAY 芦苇", lyrics: "飘泊是迷的路\n路是梦里的\n梦里走了很远\n远到醒不来\n\n醒来的时候\n还在原地\n原地是虚的\n虚到像没站过\n站过也不记得了\n\n记不记得都无所谓\n无所谓就飘着\n飘在梦里\n梦是幻的\n幻到像另一辈子\n\n那辈子也有你\n你也是过客\n路过就走了\n走了就忘了\n忘了就真没了", reed: "飘泊是迷的路，路是梦里的。梦里走了很远，远到醒不来。" },
    { title: "无根的云", lyricist: "A-WAY 芦苇", lyrics: "无根的云是虚的\n飘到哪里都像没飘\n飘过你的屋顶\n屋顶是梦里的\n\n你抬头看了\n看的是云\n不是云里的我\n我是幻的\n幻到像你的想象\n\n你想象过我没有\n我不知道\n不知道就算了\n算了就飘走\n飘到你看不见的地方\n\n看不见就不看了\n不看就不想了\n不想就忘了\n忘了云的颜色\n也忘了你的屋顶", reed: "无根的云是虚的，飘到哪里都像没飘。你抬头看了，看的是云，不是云里的我。" },
    { title: "去向不明", lyricist: "A-WAY 芦苇", lyrics: "去向是迷的\n迷到没有方向\n方向是你\n你不见了\n不见了就不找了\n\n找的时候迷路了\n迷在梦里\n梦是幻的\n幻到像真的\n真的你不在\n\n你在哪里\n我不问了\n问了也白问\n白问就闭嘴\n闭嘴就忘了\n\n忘了你的去向\n忘了自己的脚步\n脚步停了\n停在你不回来的地方\n地方很空\n空的像你", reed: "去向是迷的，迷到没有方向。方向是你，你不见了。" },
    { title: "了", lyricist: "A-WAY 芦苇", lyrics: "了了就了了\n不了又能怎样\n你走了，就了了\n了的是你\n不是我\n\n我还在\n在了就不了\n不了就继续\n继续等\n等你回来\n\n你不回来了\n我也了了\n了的时候\n没有声音\n只有自己的心跳\n停了\n\n停了就真了了\n了了就好\n好了就过去了\n过去了就不想了\n不想了", reed: "了了就了了，不了又能怎样。你走了，就了了。" },
    { title: "散场", lyricist: "A-WAY 芦苇", lyrics: "散场的时候\n你走了\n我在座位上\n坐着\n等灯亮\n\n灯亮了\n你不在\n空椅子一排一排\n我坐的那把\n是你的位置\n\n位置还温\n温的是你的体温\n不是我的\n我冷\n冷到站起来\n\n站起来的时候\n灯灭了\n灭的是光\n不是记忆\n记忆也灭了", reed: "散场的时候你走了。位置还温，温的是你的体温，不是我的。" },
    { title: "消失之前", lyricist: "A-WAY 芦苇", lyrics: "消失之前\n你回了一下头\n看的是我吗\n不知道\n\n不知道就算了\n算了一辈子\n一辈子很长\n长到你消失\n消失之后\n我还在找\n\n找的时候忘了你的脸\n脸模糊了\n模糊的是时间\n时间停了\n停在你回头的那一刻\n\n那一刻很短\n短到像没发生\n没发生就不算\n不算就忘了\n忘了就真的没了", reed: "消失之前你回了一下头。看的是我吗？不知道。" },
    { title: "路过", lyricist: "A-WAY 芦苇", lyrics: "路过你的城市\n停了一下\n停的时候\n你在不在\n我不知道\n\n不知道就路过\n路过了就不回头\n回头也看不见你\n你很远\n远到像没来过\n\n我没来过\n你也一样\n我们路过彼此\n路过了就过了\n过了就不等了\n\n等的时候停过\n停了就歇了\n歇的时候想起你\n想起你的时候\n你已经不在了", reed: "路过你的城市，停了一下。你在不在？我不知道。" },
    { title: "不归", lyricist: "A-WAY 芦苇", lyrics: "不归就不归\n归了又能怎样\n你归的地方不是这里\n这里没有你\n\n我在这里歇\n歇了很久\n歇到忘了为什么歇\n为什么不等你\n不等了\n\n不等就不等了\n了的时候\n你归了\n归在别人的梦里\n我醒了\n\n醒了就不睡了\n不睡就不梦了\n不梦就没有你\n没有你了\n我就不等了", reed: "不归就不归，归了又能怎样。你归的地方不是这里，这里没有你。" },
    { title: "风吹走了", lyricist: "A-WAY 芦苇", lyrics: "风吹走了\n你的名字\n吹走的时候\n我接了一下\n接住了空\n\n空了就歇了\n歇在你的名字飞走的地方\n地方很冷\n冷到我的手指僵了\n僵了就握不住了\n\n握不住就不握了\n松了手\n松了就没了\n没了就停了\n停在风来之前\n\n风来的时候\n你在\n风走了\n你也不在了\n我歇在你不在的风里", reed: "风吹走了你的名字。我接了一下，接住了空。" },
    { title: "远了", lyricist: "A-WAY 芦苇", lyrics: "远了的不是你\n是我的心\n心停了\n停在你走的那一天\n那一天很远\n远到像没去过\n\n去过的地方\n有你的脚印\n脚印浅了\n浅到像没踩过\n我踩了一下\n踩空了\n\n空了就不踩了\n停了就歇了\n歇在你的远处\n远处没有你\n我在那里\n等风来\n\n风来了\n把你的远吹过来\n吹到我身边\n我接住的时候\n远了", reed: "远了的不是你，是我的心。心停了，停在你走的那一天。" },
    { title: "淡了", lyricist: "A-WAY 芦苇", lyrics: "淡了的不是你的名字\n是我的记忆\n记忆歇了\n歇在你不回来的那个晚上\n晚上很黑\n黑到我看不见自己\n\n看不见就不看了\n闭了眼\n闭了就不睁了\n睁也看不见你\n你淡了\n\n淡了就忘了\n忘了一辈子\n一辈子不长\n够你淡掉\n够我停在你淡掉的地方\n\n停了就歇了\n歇了就宿了\n宿在你淡掉的那一秒\n那一秒很轻\n轻到像没存在过", reed: "淡了的不是你的名字，是我的记忆。记忆歇了，歇在你不回来的那个晚上。" },
    { title: "忘了", lyricist: "A-WAY 芦苇", lyrics: "忘了就忘了\n不忘又能怎样\n你忘了\n我也忘了\n忘了就好\n\n好的时候\n歇了一下\n歇在你的忘记里\n忘记很深\n深到我出不来\n\n出来的时候\n停了\n停在你忘记之前\n之前你还在\n之后你不在了\n\n不在就不等了\n等了也白等\n白等就了了\n了了就好了\n好了就过去", reed: "忘了就忘了，不忘又能怎样。你忘了，我也忘了。" },
    { title: "都不在了", lyricist: "A-WAY 芦苇", lyrics: "都不在了\n你在的时候\n我不在\n我在的时候\n你不在\n\n不在了就不找了\n找了也没用\n没用就停了\n停在你不在的地方\n地方很空\n\n空着就歇\n歇在你来过的痕迹里\n痕迹淡了\n淡到像没留过\n\n没留过就算了\n算了就了了\n了了的时候\n天黑了\n黑得看不见\n看不见就不看了\n不看就不想了\n不想就真了了\n了了就好", reed: "都不在了。你在的时候我不在，我在的时候你不在。了了就好。" }
],
    // 行旅体
"行旅体": [
    { title: "风", lyricist: "A-WAY 芦苇", lyrics: "风从远方来\n带着沙，带着土\n带着远方的气息\n吹过山，吹过河\n吹过你的脸\n你闭上眼睛，让它吹\n\n风在耳边说\n说的什么，听不清\n但你知道它在说\n说你来时的路\n说你没去过的地方\n说你以后会去的地方\n\n风走了，你还在\n风不带东西来，也不带东西走\n它只是路过\n路过就够了\n\n你站在风里，像一棵树\n风吹你，你摇\n风过了，你停\n你等下一阵风\n等它带你去远方\n或者不带\n都一样\n你已经在风里了", reed: "风不告诉你它从哪里来，也不告诉你它到哪里去。你问它，它不回答。你就不问了，让它吹。乘风归去，归的不是地方，是心。" },
    { title: "行路", lyricist: "A-WAY 芦苇", lyrics: "路是灰色的，灰到看不见自己的影子\n影子落在身后，跟着我走了一程\n一程又一程，影子薄了\n薄到像要化在风里\n\n脚底的茧，是岁月磨的\n磨的时候不疼\n疼的是磨完了，还在走\n走不完的路，是圆的\n绕了一圈，回到你不在的地方\n\n雾在前面，光在雾里\n光是散的，散成你的轮廓\n轮廓模糊了，模糊的是我的记忆\n记忆太旧，旧到像上辈子的事\n\n上辈子我也在走\n走的是同一条路\n路没变，我老了\n老了还在走，走到光灭了\n灭了就灭了\n灭的时候，看见你了", reed: "路没变，我老了。老了还在走，走到光灭了，灭的时候看见你了。" },
    { title: "远方", lyricist: "A-WAY 芦苇", lyrics: "远方是一层又一层的雾\n雾里有你的声音\n声音很远，远到像从上一世传来\n这一世，我在路上\n\n路上的石子硌脚\n硌的是脚，疼的是心\n心是你走的时候留下的\n留下就走了，走了就不回来\n\n不回来，我就去找\n找的时候，路分岔了\n岔成无数条，每一条都像你\n走进去，又退出来\n\n退出来的时候，天黑了\n黑得看不见路\n看不见，就站在原地\n站成一块路碑\n碑上没有字，等你来刻", reed: "远方是雾，雾里有你的声音。声音很远，远到像从上一世传来。" },
    { title: "方向", lyricist: "A-WAY 芦苇", lyrics: "方向是碎的，碎了一地\n捡起来，拼不成原来的样子\n原来的方向是你\n你转身了，方向就散了\n\n散成风，风往哪里吹\n我就往哪里走\n走的不是路，是你的呼吸\n呼吸很轻，轻到像没呼过\n\n没呼过，就不算存在\n不存在，我就飘着\n飘到你的梦里\n梦里的你指着左边\n左边是悬崖，我跳了\n\n跳的时候，看见光\n光是冷的，冷到像你的手\n手缩回去了，我还在坠落\n坠落了一整夜\n夜尽了，天没亮", reed: "方向是碎的，碎了一地。原来的方向是你，你转身了，方向就散了。" },
    { title: "归途", lyricist: "A-WAY 芦苇", lyrics: "归途是一根断了的线\n线头在手里，线尾在哪里\n在哪里，我不知道\n知道的是，我缝不回去了\n\n缝不回去的，是时间\n时间在你走的那天停了\n停的时候，我在路上\n路上的落叶堆了又散\n散了又堆，堆成你的形状\n\n形状很淡，淡到像没堆过\n没堆过，就不看了\n不看，又忍不住回头看\n回头的时候，风吹走最后一片\n\n最后一片是你的名字\n名字飘远了，飘到我看不见的地方\n看不见，就不追了\n不追了，站在原地\n站成你回来时的路标", reed: "归途是一根断了的线。缝不回去的，是时间。" },
    { title: "旅程", lyricist: "A-WAY 芦苇", lyrics: "旅程是水中的倒影\n一晃就碎了\n碎的时候，我在船上\n船没有桨，水推着我\n\n水是凉的，凉到骨\n骨里的旧伤，是你留下的\n留下就走了，走了就不再回来\n不回来，我就一直漂\n\n漂到水中央，水中央有你的脸\n脸是浮的，浮到像梦\n梦醒了，脸没了\n没了就没了，我继续漂\n\n漂到岸边，岸上没有你\n有的是你的脚印\n脚印很浅，浅到像没踩过\n我踩上去，刚好\n刚好是你离开的那一步", reed: "旅程是水中的倒影，一晃就碎了。漂到岸边，岸上没有你。" },
    { title: "驿站", lyricist: "A-WAY 芦苇", lyrics: "驿站的灯，是昏的\n昏到像你的眼睛\n眼睛闭着，闭了一整夜\n夜里有风，风把灯吹灭了\n\n灭了就不点了\n点了也看不见你\n你不在，灯是给谁亮的\n亮着也是白亮\n\n白亮的灯，照着自己的影子\n影子很瘦，瘦到像没吃过饭\n饭是凉的，凉到像你的心\n心不在了，饭也不热了\n\n不热就不吃了\n吃了也咽不下去\n咽不下去的是你的名字\n名字卡在喉咙里\n咳不出来，咽不下去\n就在那里，堵着", reed: "驿站的灯是昏的。你不在，灯是给谁亮的。" },
    { title: "同行", lyricist: "A-WAY 芦苇", lyrics: "同行的路，是并排的两条线\n一条是你，一条是我\n你的线弯了，弯到我看不见的地方\n我的线还直着，直得像不会转弯\n\n不会转弯，就直走\n直走到你的线附近\n附近有你的气味\n气味淡了，淡到像没来过\n\n没来过，就不等了\n不等了，就走自己的线\n走着走着，线断了\n断的时候，我回头\n\n回头看见你\n你在另一条线上\n线很细，细到像要断\n没断，就继续走\n走到你的线和我交叉的地方", reed: "同行的路是并排的两条线。你的线弯了，我的线还直着。" },
    { title: "岔路", lyricist: "A-WAY 芦苇", lyrics: "岔路是梦里出现的\n梦里你指着左边\n左边是黑，黑到看不见底\n底是你的眼睛，闭着\n\n闭着眼睛指路\n指的方向是你想去的地方\n你想去哪，我不知道\n知道的是，我去了\n\n去了就回不来了\n回不来就不回了\n不回，就往前走\n走的时候，听见你在后面\n\n你在后面喊我的名字\n名字太轻，轻到风吹就散\n散了就没了，没了就不回头\n不回头，一直走\n走到你喊不动的地方", reed: "岔路是梦里出现的。你闭着眼睛指路，我去了就回不来了。" },
    { title: "回望", lyricist: "A-WAY 芦苇", lyrics: "回望的时候，路已经皱了\n皱得像你的眉头\n眉头紧着，紧了一整年\n年过去了，你还在皱眉\n\n皱眉的时候，我在路上\n路上的风很冷\n冷到我的眉头也皱了\n皱的是你，疼的是我\n\n我回头，回头是雾\n雾里有你的影子\n影子很短，短到像黄昏\n黄昏过了，影子也没了\n\n没了就不看了\n不看就不想了\n不想了，就继续走\n走着走着，忘了为什么回头\n忘了就好\n好了就过去了", reed: "回望的时候路已经皱了，皱得像你的眉头。疼的是我。" },
    { title: "起程", lyricist: "A-WAY 芦苇", lyrics: "起程的时候，天是灰的\n灰到分不清早晚\n早晚都不重要\n重要的是你在不在\n\n你不在，我就走\n走的时候，月亮还在\n月亮很瘦，瘦到像弯刀\n刀割着夜，夜流了血\n血是凉的，凉到我的手\n\n我的手僵了，僵到握不住方向\n方向丢了，丢在来时的路上\n来时你还在，现在你不在了\n不在了，就不找了\n\n不找，就跟着风走\n风是乱的，乱到像你的头发\n头发里有你的体温\n体温凉了，凉到像没热过\n没热过，就不冷了\n不冷了，就走到天亮", reed: "起程的时候天是灰的。你不在，我就走。" },
    { title: "跋涉", lyricist: "A-WAY 芦苇", lyrics: "跋涉了很久，久到忘了为什么走\n你在我左边，他在我右边\n左边是岸，右边是崖\n我站在中间，哪里都去不了\n\n你的手伸过来，我握了一下\n他的手也伸过来，我松开了\n松开的时候，风从中间穿过\n风是凉的，凉到我的手指僵了\n\n僵了就不伸了，缩回来\n抱住的不是自己，是你们的影子\n影子重叠的时候，我在外面\n外面很冷，冷到骨头疼\n\n疼的时候，想起你\n想起你的时候，他又在\n他在的时候，你走了\n你走了，我还在他身边\n他身边也不是我的位置\n走了，什么都没有", reed: "你在我左边，他在我右边。我站在中间，哪里都去不了。走了，什么都没有。" },
    { title: "足迹", lyricist: "A-WAY 芦苇", lyrics: "你的足迹很深，他的足迹很浅\n我踩在你的足迹里，刚好\n刚好是离开你的那一步\n那一步之后，你往左，他往右\n\n我站在原地，不知道该跟谁\n跟你，你跟不上\n跟他的时候，想起你\n想起你的时候，脚步慢了\n\n慢了就停了，停了就回头看\n回头的时候，他的足迹模糊了\n模糊的是时间，不是距离\n距离很短，短到像没走过\n\n没走过就不算，不算就重新走\n重新走的时候，你们都不在\n不在就不等了，不等就一个人走\n一个人走的时候，脚印很轻\n轻到像没来过\n来过又怎样，什么都没留下", reed: "你的足迹很深，他的足迹很浅。来过又怎样，什么都没留下。" },
    { title: "步履", lyricist: "A-WAY 芦苇", lyrics: "步履匆匆，赶着去见你\n见你的时候，他在\n他在的时候，我停了一下\n停了一下，你看了我一眼\n那一眼很短，短到像没看\n\n没看就不算，不算就继续走\n走着走着，又遇见他\n他也在走，走的是你的方向\n方向是迷的，迷到我分不清\n\n分不清的时候，脚步乱了\n乱到踩到自己的影子\n影子疼了，疼的是我\n我还在走，走到你们都不在的地方\n\n地方很空，空到能听见回声\n回声是你的名字，也是他的\n听着听着，什么都听不见了", reed: "步履匆匆，赶着去见你。你在的时候他在，我停了一下。" },
    { title: "前行", lyricist: "A-WAY 芦苇", lyrics: "前行的时候，你在前面\n他在后面，我在中间\n中间很窄，窄到转身就会碰到\n不转又难受\n\n难受的时候，加快了脚步\n快了就追上了你\n追上的时候，你回头看他\n你看他的那一眼，我看见了\n看见了就不追了\n\n不追了，就慢下来\n慢到等他，他走近了\n走近的时候，他看了我一眼\n那一眼是你给的\n还是他给的，分不清了\n\n分不清就算了，继续走\n走着走着，你们都不在了\n不在就不找了\n不找了，就一个人\n一个人走到头\n到头了，什么都没等到", reed: "你在前面，他在后面，我在中间。到头了，什么都没等到。" },
    { title: "过客", lyricist: "A-WAY 芦苇", lyrics: "你是过客，他也是\n路过的时候，我停了一下\n停的时候，你们看了我一眼\n一眼是开始，一眼是结束\n\n结束的时候，你们走了\n我站在原地，不知道该跟谁\n跟了你，他会难过\n跟了他，你会不会回头\n\n回头的那一下，你看了他\n你看了他，我就知道答案了\n答案是什么，不说了\n说了也没用，用了也留不住\n\n留不住就不留了\n不留了，就继续当过客\n过客的时候，遇见下一对\n下一对也是你们\n你们换了名字，我没换\n我还是那个等的人\n等了一辈子，等来的不是你们\n是空", reed: "你是过客，他也是。等了一辈子，等来的不是你们，是空。" },
    { title: "赶路", lyricist: "A-WAY 芦苇", lyrics: "赶路的时候，你们都在前面\n你们并排走，我在后面\n后面有风，风把你的名字吹过来\n我接住的时候，他在看我\n\n他看我的眼神，是你的\n还是他的，分不清了\n分不清就不分了\n不分了，就快点走\n\n快了就追上了\n追上的时候，你们停了\n停了的时候，你们看着我\n我看着你们，中间隔着一层雾\n雾散了，你们走了\n\n走了就不追了\n不追了就慢下来\n慢到能听见自己的心跳\n心跳是你的，还是他的\n都不是，是我自己的\n自己的心跳，也听不见了", reed: "你们并排走，我在后面。自己的心跳，也听不见了。" },
    { title: "停留", lyricist: "A-WAY 芦苇", lyrics: "停留的时候，你在左边\n他在右边，我在中间\n中间是空的，空到能装下你们\n装下了，又装不下\n\n装不下的时候，你们挤了\n挤到我喘不过气\n喘不过气，就推开\n推开的时候，你们走了\n走了就不回来了\n\n不回来，我就站在原地\n站了很久，久到忘了为什么站\n站成了路标\n路标指向你们的方向\n方向有两个，我指哪一个\n指了也白指，你们不看\n\n不看就不指了\n不指了，就站着\n站到倒下去\n倒下去的时候，手里什么都没有", reed: "你在左边，他在右边，我在中间。倒下去的时候，手里什么都没有。" },
    { title: "转身", lyricist: "A-WAY 芦苇", lyrics: "转身的时候，你在我身后\n他在你身后，我看不见他\n看不见就不想了\n不想了，就回头\n\n回头的时候，他在看我\n你在他身后\n你们的位置换了\n换的时候，我在中间\n中间是你的位置，还是他的\n\n分不清了，就不分了\n不分了，就站着\n站着等你们选\n你们选了我，又走了\n走了又回来，回来了又走\n走了一辈子，我还在原地\n原地什么都没有\n连我的影子都不见了", reed: "转身的时候，你在我身后。原地什么都没有，连我的影子都不见了。" },
    { title: "追寻", lyricist: "A-WAY 芦苇", lyrics: "追寻的时候，你在前面\n他在后面，我追不上你\n追不上就不追了\n不追了，就等他\n\n等他走近了，你又远了\n远了又近，近了又远\n反反复复，一辈子\n一辈子很长，长到忘了为什么追\n\n忘了就好，好了就停了\n停了的时候，你们都不在\n不在就不找了\n找了也白找\n白找就坐着，坐着等\n等到天荒地老\n天荒了，地老了\n你们还没来\n没来也好\n来了也留不住", reed: "追寻的时候，你在前面。等了一辈子，你们还没来。来了也留不住。" },
    { title: "夜行", lyricist: "A-WAY 芦苇", lyrics: "夜行的时候，看不见你们\n看不见就不想了\n不想了，就走\n\n走着走着，听见你的脚步声\n脚步声很轻，轻到像没走\n没走就不算，不算就继续听\n听的时候，他的脚步声也来了\n两个声音叠在一起\n叠成一首歌\n\n歌是你的，还是他的\n分不清了，就不分了\n不分了，就跟着旋律走\n走了一夜，天亮了\n亮了的时候，你们都不在\n\n不在就算了\n算了就不听了\n不听就安静了\n安静了，就我一个人\n一个人走到天亮\n天亮的时候\n手里什么都没有\n连影子都没有", reed: "夜行的时候，看不见你们。一个人走到天亮，手里什么都没有，连影子都没有。" },
    { title: "风景", lyricist: "A-WAY 芦苇", lyrics: "你是风景，他也是风景\n你们路过的时候，我看了看\n看的时候，心动了\n动了一下，又停了\n\n停了的时候，你们走了\n走了就不回来了\n不回来，我就看下一个\n下一个也是风景\n\n风景换了又换\n换的时候，我忘了上一片\n上一片是什么颜色\n忘了就忘了\n\n记得也没用\n用了也留不住\n留不住就不留了\n不留了，就继续看\n看着看着，眼睛花了\n花的时候，分不清谁是谁\n谁都不是谁\n我也不是我了", reed: "你是风景，他也是风景。看着看着，我也不是我了。" },
    { title: "驿站之外", lyricist: "A-WAY 芦苇", lyrics: "驿站在这里，你歇了一下\n歇的时候，我递了一杯水\n水是凉的，凉到你的手\n手缩回去了，缩回去就没了\n\n没了就不递了\n递了也白递\n白递就等着\n等下一个来\n\n下一个来了，也歇了一下\n歇的时候，我递了同一杯水\n水还是凉的\n凉到他的心\n\n心凉了，就走了\n走了就不回头\n不回头，我就继续等\n等了一夜，没人来\n没人来就空着\n空着的时候，想起你\n想起你的时候，天亮了\n亮了的时候，驿站拆了", reed: "驿站在这里，你歇了一下。想起你的时候，驿站拆了。" },
    { title: "旅人", lyricist: "A-WAY 芦苇", lyrics: "你是旅人，他也是\n你们路过的时候，我看了看\n看的时候，记住了你们的眼睛\n眼睛里有光，光是热的\n\n热了一下，就凉了\n凉了的时候，你们走了\n走了就不回来了\n不回来，我就等下一个\n\n下一个也有眼睛\n眼睛里的光是冷的\n冷到我的手僵了\n僵了就不伸了\n\n不伸了，就不接了\n不接了，就看着\n看着你们来来去去\n来的时候我在这里\n去的时候我也在这里\n这里是我的位置\n位置是你的，也是他的\n都不是我的", reed: "你是旅人，他也是。这里是我的位置，是你的也是他的，都不是我的。" },
    { title: "客栈", lyricist: "A-WAY 芦苇", lyrics: "客栈住了很多人\n你来过，他也来过\n来的时候，你们带着各自的烟火\n烟火灭了，就走了\n\n走了就不回来了\n不回来，我就收拾房间\n房间空了，空着等下一个\n下一个来了，也带着烟火\n\n烟火是红的，红到像血\n血是你的，还是他的\n分不清了，就不分了\n不分了，就烧着\n\n烧了一夜，灭了\n灭了的时候，天亮了\n亮了的时候，你们都不在\n不在就不等了\n不等了，就关店\n关了店，出去找\n找的时候，忘了找谁", reed: "客栈住了很多人，你来过他也来过。找的时候，忘了找谁。" },
    { title: "月光下的路", lyricist: "A-WAY 芦苇", lyrics: "月光下的路，很白\n白到像你的衬衫\n衬衫晾在风里\n风是干的，干到像没湿过\n\n你走过这条路的时候\n月光照着你的背影\n背影很短，短到像黄昏\n黄昏过了，你走了\n\n走了之后，他来\n他来的时候，月光暗了\n暗到看不见他的脸\n脸模糊了，模糊的是时间\n\n时间停了，停在你们交错的地方\n地方很窄，窄到转身就会碰到\n碰到了，又分开\n分开的时候，月光碎了\n碎了一地，捡不起来", reed: "月光下的路很白。月光碎了，碎了一地，捡不起来。" },
    { title: "长亭", lyricist: "A-WAY 芦苇", lyrics: "长亭很短，短到不够告别\n告别的时候，你笑了一下\n笑是苦的，苦到我的心\n心沉了，沉到你走的那一步\n\n那一步之后，你来过\n来的时候，他也在\n他在的时候，你不说话\n不说话，就走了\n\n走了之后，他看着我\n看着看着，也走了\n走了就不回来了\n不回来，我就坐着\n\n坐着等，等了一整年\n年过了，你们都没来\n没来就不等了\n不等了，就走\n走的时候，回头看了一眼\n长亭还在，人没了", reed: "长亭很短，短到不够告别。长亭还在，人没了。" },
    { title: "渡口", lyricist: "A-WAY 芦苇", lyrics: "渡口的水，是浑的\n浑到看不见底\n底是你的眼睛，闭着\n闭着的时候，他来了\n\n他来了，水清了\n清到能看见自己的影子\n影子很瘦，瘦到像没吃过饭\n饭是凉的，凉到像你的心\n\n心不在了，饭也不热了\n不热就不吃了\n吃了也咽不下去\n咽不下去的是你的名字\n\n名字卡在喉咙里\n咳不出来，咽不下去\n就在那里，堵着\n堵了一辈子\n一辈子很长，长到忘了为什么堵", reed: "渡口的水是浑的。你的名字卡在喉咙里，堵了一辈子。" },
    { title: "山间", lyricist: "A-WAY 芦苇", lyrics: "山间的路，很弯\n弯到像你的心思\n心思在哪里，我不知道\n知道的是，我跟不上\n\n跟不上的时候，他来了\n他来的时候，你走了\n你走了，我还在原地\n原地有你的脚印\n\n脚印很浅，浅到像没踩过\n没踩过就不算\n不算就重新走\n重新走的时候，他不见了\n\n不见了就不找了\n找了也白找\n白找就坐着\n坐着看山\n山是青的，青到像你的衬衫\n衬衫晾在风里\n风是干的，干到像没来过", reed: "山间的路很弯。山是青的，青到像你的衬衫。风是干的，干到像没来过。" },
    { title: "海岸线", lyricist: "A-WAY 芦苇", lyrics: "海岸线很长，长到走不完\n走不完就不走了\n不走就站着\n站着看海\n\n海是蓝的，蓝到像你的眼睛\n眼睛里有光，光是热的\n热了一下，就凉了\n凉了的时候，你走了\n\n走了之后，他来\n他来的时候，海是灰的\n灰到像他的眼睛\n眼睛里没有光\n\n没有光就不看了\n不看就不想了\n不想了，就走\n走着走着，海岸线短了\n短到像没走过\n没走过就不算\n不算就忘了", reed: "海岸线很长。海是蓝的，蓝到像你的眼睛。" },
    { title: "荒原", lyricist: "A-WAY 芦苇", lyrics: "荒原上没有人\n你来过，他也来过\n来的时候，留下脚印\n脚印被风吹走了\n\n吹走了就不找了\n找了也白找\n白找就站着\n站成荒原的一部分\n\n荒原很大，大到装下你们\n装下了，又装不下\n装不下的时候，你们挤了\n挤到我的影子碎了\n\n碎了就不拼了\n拼了也回不去\n回不去就算了\n算了就躺着\n躺着等天亮\n亮了的时候，荒原还是荒原\n我还是我\n我不在了", reed: "荒原上没有人，你来过他也来过。荒原还是荒原，我不在了。" },
    { title: "年月", lyricist: "A-WAY 芦苇", lyrics: "年月是水，流过指缝\n流的时候，你在上游\n我在下游，水是凉的\n凉到骨，骨里有你的名字\n\n名字化了，化在水里\n水向东流，流到你不曾在的地方\n我在岸上，站成芦苇\n芦苇白了，白得像你的衬衫\n\n衬衫晾在风里\n风是干的，干到像没湿过\n没湿过就不算\n不算就继续站\n\n站到芦苇倒了\n倒的时候，想起你\n想起你的时候，水干了\n干得连影子都没有\n影子去了哪里\n去了你那里吗", reed: "年月是水，流过指缝。水干了，连影子都没有。" },
    { title: "长路", lyricist: "A-WAY 芦苇", lyrics: "长路是雾，雾里有光\n光是散的，散成你的形状\n形状很淡，淡到像没存在过\n不存在就不追了\n\n不追了，就停下来\n停下来的时候，路短了\n短到像一步\n一步迈出去，是你的方向\n方向错了，错了一辈子\n\n一辈子很长，长到够我走完这条路\n走完的时候，你在终点吗\n不在，终点是空的\n空到能装下我\n\n装下了，又装不下\n装不下的是你\n你在别处，别处是哪里\n别处是你不在的地方\n我在的地方，你永远不会来", reed: "长路是雾，雾里有光。我在的地方，你永远不会来。" },
    { title: "日夜", lyricist: "A-WAY 芦苇", lyrics: "日夜是两片镜子，对望着\n你在白天的镜子里\n我在黑夜的镜子里\n隔着玻璃，摸不到\n\n摸不到就不摸了\n不摸了就看着\n看着的时候，镜子里的人换了\n换成了他，他也不是你\n\n你是谁，我不知道\n知道的是，你不在\n不在就算了\n算了就闭眼\n\n闭眼的时候，看见你\n你在白天的镜子里笑\n笑是凉的，凉到我的心\n心沉了，沉到夜的底部\n底部没有光，有你", reed: "日夜是两片镜子对望着。心沉了，沉到夜的底部，有你。" },
    { title: "晨昏", lyricist: "A-WAY 芦苇", lyrics: "晨昏是交界的地方\n我站在交界处\n左边是晨，右边是昏\n晨里有你，昏里有我\n\n你往左走，我往右走\n走着走着，回头看了一眼\n回头的时候，晨暗了\n暗到看不见你的背影\n\n背影没了，就不看了\n不看就往前走\n走的时候，昏也暗了\n暗到我自己也看不见\n\n看不见就不走了\n不走就站着\n站着等晨昏再次交界\n交界的时候，你来了\n看了一眼，又走了\n走了就不回来了", reed: "晨昏是交界的地方。你来了看了一眼，又走了。" },
    { title: "四季", lyricist: "A-WAY 芦苇", lyrics: "四季是四扇门\n春天是你推开的\n推开的时候，我在门外\n门关上了，关了一季\n\n夏天是另一个人\n推开门的时候，我进去了\n进去的时候，你不在\n不在就出来\n\n出来的时候，秋天来了\n秋天的门是虚掩的\n推开，里面是空\n空得干干净净\n\n冬天，我没有推门\n站在门外，等门自己开\n开了，里面是你\n是你又不是你\n你是过去的你\n我是现在的我\n隔着一扇门的距离\n门关了，四季走完了", reed: "四季是四扇门。门关了，四季走完了。" },
    { title: "风霜", lyricist: "A-WAY 芦苇", lyrics: "风霜是落在肩上的光\n光是凉的，凉到我的手\n手里握着你留下的温度\n温度散了，散在风里\n\n风往哪里吹，我不知道\n知道的是，你不在\n不在就不等了\n不等了就走\n\n走着走着，风霜厚了\n厚到看不见自己的影子\n影子去了哪里\n去了你那里吗\n\n你那里也有风霜\n落的时候，你在屋里\n屋里暖和，暖到忘了外面\n外面有我\n我在风霜里站着\n站成了一根冰柱\n冰柱化了，化了就不在了", reed: "风霜是落在肩上的光。我在风霜里站着，站成了一根冰柱。" },
    { title: "尘埃落定的地方", lyricist: "A-WAY 芦苇", lyrics: "尘埃落定了，落的时候\n我在，你不在\n不在就不看了\n不看就闭眼\n\n闭眼的时候，看见尘埃\n尘埃里有你的脸\n脸模糊了，模糊的是时间\n时间停在尘埃落定的那一秒\n\n那一秒之后，尘埃又飞了\n飞的时候，想起你\n想起你的时候，尘埃落在别处\n别处是哪里\n别处是你站过的地方\n\n你站过的地方，我也站过\n站的时候，你在\n你在的时候，我笑了一下\n笑是苦的，苦到像药\n药咽不下去\n咽不下去就不咽了\n含着，含了一辈子", reed: "尘埃落定了。含着你的名字，含了一辈子。" },
    { title: "归期", lyricist: "A-WAY 芦苇", lyrics: "归期是写在纸上的字\n字淡了，淡到像没写过\n没写过就不算\n不算就撕了\n\n撕了的时候，纸飘了\n飘到你的方向\n方向对了，人不对\n人不对就不等了\n\n不等了就走\n走着走着，纸落在地上\n地上有你的脚印\n脚印很浅，浅到像没踩过\n没踩过就不算了\n\n不算就忘了\n忘了归期，忘了你\n忘了自己\n自己是归期\n归期是自己\n自己等自己\n等了一辈子\n等来的是空", reed: "归期是写在纸上的字。自己等自己，等来的是空。" },
    { title: "旧途", lyricist: "A-WAY 芦苇", lyrics: "旧途是断了的弦\n弹不出声音\n声音卡在弦里\n弦断了，声音就散了\n\n散的时候，想起你\n想起你的时候，弦又响了\n响的不是原来的调\n调变了，变到认不出\n\n认不出就不听了\n不听就走\n走着走着，弦又断了\n断在你不回来的地方\n地方很远，远到像没去过\n\n没去过就不算了\n不算就站着\n站着等弦自己接上\n接上了，弹的也不是你\n你是旧途的尽头\n尽头到了，你不在\n不在就不看了", reed: "旧途是断了的弦。尽头到了，你不在。" },
    { title: "来时路", lyricist: "A-WAY 芦苇", lyrics: "来时路是倒着的\n倒着走，走到你还在的时候\n那时候你笑了一下\n笑是甜的，甜到发苦\n\n苦的时候，路正了\n正的时候，你走了\n走了就不回来了\n不回来就一个人走\n\n走着走着，路短了\n短到像一步\n一步迈出去，是你离开的那一步\n那一步之后，我再也没有来过\n没来过就不算了\n不算就忘了\n\n忘了来时路，忘了为什么来\n来是为了你\n你不在了，就不来了\n不来就站着\n站着看路\n路是空的\n空得像你", reed: "来时路是倒着的。路是空的，空得像你。" },
    { title: "羁旅", lyricist: "A-WAY 芦苇", lyrics: "羁旅是捆住自己的绳子，系在你的手腕上\n你走了，绳子还在\n我牵着，牵了一路\n一路的风沙，把绳磨细了\n细到像要断\n\n断的时候，你回来了吗\n没有。你在他乡\n他乡的月亮，照不到这里\n这里的月亮，是我一个人的\n\n我坐在绳子上\n绳子系在虚无里\n虚无有你，也有我\n我把自己拴住了\n拴在没有你的地方\n地方很空，空到能装下所有漂泊\n\n漂泊了很久，久到忘了为什么漂泊\n记得的，是你松手的那一刻\n那一刻，绳子没断\n我的心断了", reed: "羁旅是捆住自己的绳子。你松手的那一刻，我的心断了。" },
    { title: "流浪记", lyricist: "A-WAY 芦苇", lyrics: "流浪是写给自己的信\n信纸上没有字\n字在心里，心里有你的名字\n名字太轻，轻到风吹就散\n\n散了一路，一路都是你的碎片\n我捡起来，拼了很久\n拼不出原来的形状\n形状是你，你是模糊的\n\n模糊的是我的记忆\n记忆在流浪中褪色\n褪成灰，灰是回家的路\n路在哪，我不知道\n\n知道我还在走\n走的时候，想起你\n想起你的时候，风停了\n停的时候，我在原地\n原地是你走的那一年\n那一年，我也是流浪者\n流浪者的包里，装着你没带走的东西\n东西很小，小到像没拿过\n没拿过，就不算\n不算就继续走\n走着走着，包轻了\n轻到像没背过\n没背过，就放下\n放下的那一刻，看见你了\n你在对面，也在流浪\n我们的目光碰了一下\n碰的时候，什么都没说\n说了也是白说\n白说就不说了\n不说了，就擦肩\n擦肩的时候，风又起了\n风吹走你的气味\n我闻到了\n闻到了，就知道你还在\n还在就好\n好了就继续走", reed: "流浪是写给自己的信。放下的那一刻看见你了，擦肩的时候风又起了。" },
    { title: "异乡", lyricist: "A-WAY 芦苇", lyrics: "异乡是他人的故乡\n我的故乡，在你眼睛里\n眼睛闭了，故乡就没了\n\n没了就不找了\n找了也白找\n白找就站着\n站成异乡的一部分\n异乡很大，大到装下我\n装不下你\n\n你在另一个异乡\n另一个异乡是你的故乡吗\n不是，你也没有故乡\n我们都是没有故乡的人\n在路上遇见\n遇见了又分开\n分开的时候，看了一眼\n那一眼很短，短到像没看\n没看就不算\n不算就忘了\n\n忘了，又想起来\n想起来的时候，异乡下雨了\n雨是凉的，凉到骨\n骨里有你的体温\n体温散了，散在雨里\n雨停了，天晴了\n晴的时候，看不见你\n看不见，就不找了\n不找了，就住下来\n住下来，异乡就变成了故乡\n故乡没有你\n我也没有自己", reed: "异乡是他人的故乡。我们都是没有故乡的人。异乡变成了故乡，故乡没有你。" },
    { title: "他山", lyricist: "A-WAY 芦苇", lyrics: "他山的石头，刻着你的名字\n字迹模糊了，模糊的是时间\n时间停在你离开的那一天\n那一天，我也是他山的一块石头\n\n石头不会说话\n不会说我想你\n想你的时候，风来了\n风吹过石缝，呜呜的\n像在哭，哭的是你\n还是我\n\n分不清了\n分不清就不分了\n不分了，就裂了\n裂缝里长出草\n草是你的名字\n名字青了又黄\n黄了又青\n反反复复，一辈子\n\n一辈子很长，长到够他山风化\n风化的时候，我在山脚\n山脚有你的脚印\n脚印很深，深到像站了很久\n久到我来了，你走了\n走了就不回来了\n不回来，我就住在脚印里\n住了一辈子\n一辈子很短\n短到不够忘记你", reed: "他山的石头刻着你的名字。一辈子很短，短到不够忘记你。" },
    { title: "云游", lyricist: "A-WAY 芦苇", lyrics: "云游是天的流浪\n我是地的漂泊\n天地之间，隔着你\n你在中间，我看不见\n\n看不见就不看了\n不看了就闭眼\n闭眼的时候，云飘过\n云里有你的影子\n影子很淡，淡到像没来过\n没来过就不算\n不算就睁眼\n\n睁眼的时候，云散了\n散成雨，雨落在我身上\n身上有你的温度\n温度凉了，凉到骨\n骨里的旧伤，是你留下的\n\n留下就走了，走了就不再回来\n不回来，我就继续走\n走着走着，天晴了\n晴的时候，云又来了\n来的不是那朵\n那朵已经散了\n散了的，回不来了\n回不来就算了\n算了就不等了\n不等了就好", reed: "云游是天的流浪。散了的回不来了，不等了就好。" },
    { title: "迁徙", lyricist: "A-WAY 芦苇", lyrics: "迁徙是候鸟的事\n我是人，也在迁徙\n从你的城市，到他的城市\n城市换了又换\n换的时候，你在哪个城市\n不知道\n\n知道的是，我路过你的城市\n路过的时候，停了一下\n停的时候，想起你\n想起你的时候，风把城市吹远了\n远了就不去了\n不去了就回头\n\n回头的时候，看见他\n他也在迁徙\n从你的身边，到我的身边\n身边空了，空了很久\n久到忘了为什么迁徙\n\n忘了就好，好了就停\n停的时候，你们都不在\n不在就不等了\n不等了，就在这里\n这里是哪里\n哪里都不是\n不是你的城市，不是他的\n是我自己的荒原", reed: "迁徙是候鸟的事。不是你的城市，不是他的，是我自己的荒原。" },
    { title: "无定所", lyricist: "A-WAY 芦苇", lyrics: "无定所是心的漂泊\n心在你那里，你不在\n不在就不找了\n找了也白找\n白找就空着\n\n空着的时候，想起你\n想起你的时候，心回来了\n回来的是你吗\n不是，是你的影子\n影子很轻，轻到像没重量\n\n没重量就不算\n不算就飘着\n飘到你的窗口\n窗口关着，灯亮着\n亮的时候，你在\n你在的时候，我看了你一眼\n那一眼很短，短到像没看\n\n没看就不算\n不算就走了\n走着走着，灯灭了\n灭的时候，我在黑暗里\n黑暗里有你的气息\n气息淡了，淡到像没来过\n没来过就不算了\n不算就忘了\n忘了无定所\n无定所是我自己", reed: "无定所是心的漂泊。忘了无定所，无定所是我自己。" },
    { title: "漂泊者", lyricist: "A-WAY 芦苇", lyrics: "漂泊者没有名字\n名字在你那里\n你拿着，不还\n我不拿，不抢\n\n不抢就等着\n等你还的时候，我在吗\n在的，一直在\n在的时候，你忘了\n\n忘了就算了\n算了就不等了\n不等了就走\n走着走着，名字回来了\n回来的时候，我不是我了\n我是漂泊者\n\n漂泊者不需要名字\n需要的是你\n你不在\n不在就不需要了\n不需要就空着\n空着的时候就忘了自己\n自己是谁\n是你给的名字\n你不给了\n我就没了", reed: "漂泊者没有名字。自己是你给的名字，你不给了，我就没了。" },
    { title: "归人", lyricist: "A-WAY 芦苇", lyrics: "归人回来了\n回来的时候，你不在\n不在就不看了\n不看就走\n\n走着走着，回头看了一眼\n回头的时候，门开着\n开着等你回来\n你不回来，门就不关\n\n关了一夜，天亮了\n亮了的时候，你来了\n来了又走了\n走了就不回来了\n\n不回来就关上门\n门关了，关住了自己\n自己是谁\n是等你的人\n等了一辈子\n一辈子很长\n长到忘了等谁\n等的是你\n你是归人\n归人不归\n我就不是人了", reed: "归人回来了。你是归人，归人不归，我就不是人了。" },
    { title: "终途", lyricist: "A-WAY 芦苇", lyrics: "终途到了\n到的时候，你不在\n不在就不等了\n不等了就坐下\n\n坐下的时候，看见自己\n自己老了，老到认不出\n认不出就算了\n算了就闭眼\n\n闭眼的时候，看见你\n你在终途的另一头\n另一头很远，远到像没来过\n没来过就不算了\n不算就睁眼\n\n睁眼的时候，天黑了\n黑得看不见自己\n看不见就不看了\n不看了就不想了\n不想了就不疼了\n不疼了就好\n好了就过去了\n过去了就是终途\n终途没有你\n也没有我\n我们都在半路\n错过了", reed: "终途到了。终途没有你也没有我，我们都在半路，错过了。" }
],
"润物体": [
    { title: "润", lyricist: "A-WAY 芦苇", lyrics: "润是雨的声音，轻到听不见\n听不见的时候，我在窗内\n你在窗外，隔着玻璃\n玻璃上是你呼出的雾气\n雾气散了，你的脸模糊了\n\n润是水的脚步，慢到追不上\n追不上就不追了\n不追了就站着\n站成你窗台的那盆花\n花开了，你浇了水\n水渗进土里，土湿了\n湿了就不干了\n不干就一直润着\n\n润了你的手，你的手指\n手指划过我的名字\n名字是你写的\n写的时候笔尖很轻\n轻到纸没破，纸湿了\n湿了就不干了\n不干就一直润着\n润着润着，字化了\n化了就不在了\n不在了还在润着\n润了一辈子，你都不知道", reed: "润是雨的声音，轻到听不见。润了一辈子，你都不知道。" },
    { title: "细雨", lyricist: "A-WAY 芦苇", lyrics: "细雨不是雨，是你的叹息\n叹的时候，空气湿了\n湿了就不干了\n不干就一直飘\n飘到你的肩头\n肩头有水珠\n水珠是你的，还是我的\n分不清了，就不分了\n不分了就落\n落在你的手背\n手背凉了，凉的是时间\n时间停了，停在细雨里\n细雨里的你，是模糊的\n模糊的是距离，不是脸\n\n脸湿了，湿的是泪\n泪是你的，还是我的\n都不是，是雨\n雨在替你哭\n哭了也不出声\n出声了你也听不见\n听不见就不哭了\n不哭了，雨还在下\n下了一辈子\n你打着伞，伞下没有我", reed: "细雨不是雨，是你的叹息。下了一辈子，你打着伞，伞下没有我。" },
    { title: "水滴", lyricist: "A-WAY 芦苇", lyrics: "水滴是时间的样子\n一滴一滴，数不清\n数的时候，你来了\n来了又走了\n走了就不数了\n不数了，水滴还在滴\n滴在你的名字上\n名字湿了，湿了就不干了\n不干就一直滴\n滴到你的手心\n手心有你的温度\n温度凉了，凉到骨\n\n骨湿了，湿的是你的记忆\n记忆太旧，旧到像上辈子\n上辈子你也是一滴水\n滴在我的额头\n额头凉了，凉的是梦\n梦醒了，你不在\n不在就不滴了\n不滴了，就干了\n干了有一道痕\n痕是你的，你留下的\n留下就走了，走了就不回来了\n水滴还在滴，只是你听不见了", reed: "水滴是时间的样子。滴了一辈子，你听不见了。" },
    { title: "渗透", lyricist: "A-WAY 芦苇", lyrics: "渗透是水偷偷进来的方式\n门关着，它从缝里来\n来了就不走了\n不走了就住下\n住下的时候，你不在\n不在就不等了\n不等了，水还在渗\n渗进墙里，墙湿了\n湿的是你靠过的那面\n那面墙有你的体温\n体温凉了，凉到我的手\n手湿了，湿的是你的名字\n\n名字是你写的\n写的时候笔尖很轻\n轻到纸没破\n纸湿了，湿了就不干了\n不干就一直润着\n润着润着，字化了\n化了就不在了\n不在了，水还在渗\n渗进你的梦里\n梦里的你，也在渗透\n你醒来的时候，枕边是湿的\n你以为是汗，不是\n是我", reed: "渗透是水偷偷进来的方式。你醒来的时候枕边是湿的，你以为是汗，不是，是我。" },
    { title: "潮湿", lyricist: "A-WAY 芦苇", lyrics: "潮湿是空气的呼吸\n呼吸里有你\n你不在，呼吸还在\n还在就湿着\n湿了就不干了\n不干就一直飘\n飘到你的城市\n城市很远，远到像没去过\n没去过就不算\n不算就回来\n\n回来的时候，空气更湿了\n湿的是你的气息\n气息淡了，淡到像没来过\n没来过就不算了\n不算就忘了\n忘了潮湿，忘了你\n忘了自己\n自己是一滴雨\n雨落了，落在你的窗台\n你看了吗？没有\n没有就不看了\n不看就继续湿着\n湿了一辈子\n你关着窗，你不知道", reed: "潮湿是空气的呼吸。湿了一辈子，你关着窗，你不知道。" },
    { title: "雨季", lyricist: "A-WAY 芦苇", lyrics: "雨季是你的名字\n念的时候，天阴了\n阴了就不晴了\n不晴就一直下\n下的时候，想起你\n想起你的时候，雨大了\n大到看不见路\n看不见就不走了\n不走了就站着\n\n站着等雨停\n停了的时候，你来了\n来了又走了\n走了就不回来了\n不回来，雨又下了\n下的是你的名字\n名字湿了，湿了就不干了\n不干就一直念\n念着念着，忘了为什么念\n忘了就好\n好了就晴了\n晴了的时候，你在别人的伞下\n雨季过了，我的伞还撑着", reed: "雨季是你的名字。雨季过了，我的伞还撑着。" },
    { title: "淋", lyricist: "A-WAY 芦苇", lyrics: "淋是把自己交给雨的方式\n交的时候，你不在\n不在就不交了\n不交就站着\n站着等雨来\n来了的时候，你走了\n走了就不回来了\n不回来，我继续淋\n淋着淋着，湿透了\n透了就不干了\n不干就一直淋\n\n淋到你的屋顶\n屋顶有你的名字\n名字湿了，湿了就不干了\n不干就一直淋\n淋到你的梦里\n梦里的你，也在淋\n淋的是同一场雨\n雨是你的，也是我的\n分不清了，就不分了\n不分了就一起湿着\n湿着湿着，天晴了\n晴了的时候，你不在\n不在就不淋了\n不淋了就干\n干了，衣服皱了\n皱的是你走的那一天", reed: "淋是把自己交给雨的方式。干了，衣服皱了，皱的是你走的那一天。" },
    { title: "湿", lyricist: "A-WAY 芦苇", lyrics: "湿是水的记忆\n不干了就不忘了\n不忘就一直湿着\n湿着的是你的名字\n名字是你写的\n写的时候笔尖很轻\n轻到纸没破\n纸湿了，湿了就不干了\n不干就一直润着\n润着润着，字化了\n化了就不在了\n不在了，水还在湿\n\n湿的是你的气息\n气息淡了，淡到像没来过\n没来过就不算了\n不算就忘了\n忘了湿，忘了你\n忘了自己\n自己是一滴雨\n雨落了，落在你的手心里\n你握住了\n握紧的时候\n雨从指缝漏了\n漏了就不握了\n不握了，手就干了\n干了，掌心还有水渍\n是你握过的痕迹", reed: "湿是水的记忆。干了，掌心还有水渍，是你握过的痕迹。" },
    { title: "润物无声", lyricist: "A-WAY 芦苇", lyrics: "润物无声是你的方式\n来的时候也是\n无声无息，悄悄的\n悄悄的你来了\n来了又走了\n走了就不回来了\n不回来，水还在润\n润进你的脚印\n脚印很深，深到像站了很久\n久到我来了，你走了\n走了就不回来了\n不回来，水还在润\n润到你的梦里\n\n梦里的你，也在润\n润的是我的名字\n名字湿了，湿了就不干了\n不干就一直润着\n润着润着，忘了为什么润\n忘了就好\n好了就干了\n干了有一道痕\n痕是你的，你留下的\n留下就走了\n走了就不回来了\n不回来，痕还在\n还在就润着\n你感觉不到，但它一直在", reed: "润物无声是你的方式。你感觉不到，但它一直在。" },
    { title: "雨痕", lyricist: "A-WAY 芦苇", lyrics: "雨痕是你的指纹\n印在窗上，干了也在\n干了就不擦了\n擦了也擦不掉\n擦不掉是你的形状\n形状是你，你是模糊的\n模糊的是雨，不是记忆\n记忆湿了，湿了就不干了\n不干就一直润着\n润着润着，雨痕淡了\n淡到看不见\n看不见就不看了\n不看就不想了\n\n不想了，窗还是湿的\n湿的是你的气息\n气息散了，散在风里\n风吹过，窗干了\n干了有一道痕\n痕是你的，你留下的\n留下就走了\n走了就不回来了\n不回来，痕还在\n还在就润着\n润着润着，痕也淡了\n淡到像没留过\n没留过就不算了\n不算就忘了\n忘了雨痕，忘了你\n你擦过窗吗？没有\n所以雨痕一直在", reed: "雨痕是你的指纹。你擦过窗吗？没有，所以雨痕一直在。" },
    { title: "晨露", lyricist: "A-WAY 芦苇", lyrics: "晨露是夜晚留下的一行字\n写在草尖，天一亮就读完了\n读的时候，你在梦里\n梦里的你也在读\n读的是同一行\n字迹模糊了，模糊的是时间\n时间停在你醒来的那一刻\n那一刻，露珠抖了一下\n没落，它等\n等你伸手，等你的指尖\n指尖的溫度，能把露珠变成雾\n雾里是你，也是我\n我们是同一滴水\n分开了，又聚在一起\n聚了又散，散了就不认得了\n\n不认得也好，好了就忘了\n忘了晨露，忘了夜\n忘了自己是一滴\n一滴就够了\n够在叶尖挂一生\n一生很短，短到天一亮就没了\n没了就不找了\n找了也白找\n白找就干涸\n干涸的地方，有你踩过的脚印", reed: "晨露是夜晚留下的一行字。天一亮就没了，没了就不找了。" },
    { title: "雾里", lyricist: "A-WAY 芦苇", lyrics: "雾里是另一个维度\n你在那里走，我在这里看\n看的时候，雾把我们缝在一起\n针脚很密，密到分不清\n分不清是你在我里面\n还是我在你里面\n\n你在雾里回头\n回头的那一瞬，雾薄了\n薄到能看见你的眼睛\n眼睛里有雾，也有我\n我住在你的眼睛里\n住了一夜，天亮就被赶出来了\n出来的时候，雾散了\n散得干干净净\n干净得像你没来过\n没来过，我为什么在这里\n在这里等谁\n等的是雾，还是你\n分不清了，就不分了\n不分了就走进雾里\n雾里没有你\n只有我\n和我走不出去的昨天\n昨天也是雾\n明天也是", reed: "雾里是另一个维度。走进雾里，只有我，和我走不出去的昨天。" },
    { title: "露水", lyricist: "A-WAY 芦苇", lyrics: "露水是凌晨的耳语\n说给草听，草听不懂\n草弯了腰，把露水让给泥土\n泥土接住了，就再也吐不出来\n吐不出来，就一直含着\n含了整夜，含到太阳出来\n太阳问它苦不苦\n它不说话\n话都给了你\n你听不见\n你听不见就对了\n对了就不说了\n不说了就干涸\n\n干涸的泥土裂开\n裂缝里有你的名字\n名字是露水写的\n写的时候笔尖很轻\n轻到没痕迹\n没痕迹就不算了\n不算就忘了\n忘了露水，忘了夜\n忘了自己是一滴\n一滴就够了\n够在泥土里，等你路过\n你路过的时候踩碎了\n碎了就渗进去了\n渗进去就不出来了", reed: "露水是凌晨的耳语。你路过的时候踩碎了，碎了就渗进去了。" },
    { title: "薄雾", lyricist: "A-WAY 芦苇", lyrics: "薄雾是清晨的犹豫\n留在山间，不肯走\n不肯走就飘着\n飘到你的窗前\n窗关着，灯亮着\n亮的时候，你在\n你在的时候，雾薄了\n薄到能看见你的侧脸\n侧脸是你的，也是我的\n我把它收在眼睛里\n收了一整天\n天黑的时候，雾又来了\n来的是同一片吗\n不知道\n知道的是，你不在\n不在就不看了\n不看就闭眼\n\n闭眼的时候，雾更薄了\n薄到像没来过\n没来过就不算了\n不算就忘了\n忘了薄雾，忘了你\n忘了自己\n自己是一缕\n一缕就够了\n够在你窗前，等你开窗\n你开窗的时候，我进去了\n进去了就不出来了\n不出来就一直薄着\n薄到你看不见\n看不见了，还在", reed: "薄雾是清晨的犹豫。你开窗的时候我进去了，你看不见我，但我还在。" },
    { title: "湿气", lyricist: "A-WAY 芦苇", lyrics: "湿气是空气记得你\n你不在了，它还在\n还在就湿着\n湿着的是你的体温\n体温凉了，凉到骨\n\n骨里也有湿气\n是去年这个时候你留下的\n留下就走了，走了就不回来\n不回来，湿气还在\n还在就渗进骨髓\n骨髓里是你的名字\n名字很轻，轻到像没写过\n没写过就不算了\n不算就忘了\n忘了湿气，忘了你\n忘了自己\n自己是一缕\n一缕就够了\n够在空气里，等你呼吸\n你呼吸的时候\n我进去了\n进去了就不出来了\n不出来就一直湿着\n湿着就不干了\n不干就一直记得\n你呼出来的时候\n我又出来了\n出来又回去\n反反复复，一辈子", reed: "湿气是空气记得你。你呼出来的时候我出来了，出来又回去，反反复复一辈子。" },
    { title: "凝", lyricist: "A-WAY 芦苇", lyrics: "凝是水的决绝\n挂在叶尖，不肯落\n不肯落就挂着\n挂了一夜，等你来\n你不来，它也不走\n不走就冻住了\n\n冻住的时候，天亮了\n亮得刺眼\n刺的是你的眼睛\n你在看我吗\n在看的是光\n不是凝\n\n凝碎了，碎了一地\n捡不起来\n不捡就化了\n化了就不在了\n不在了，地上还有水\n水是你的，也是我的\n分不清了，就不分了\n不分了就渗进去\n渗进土里，等春天\n春天来了，你也不在\n不在就不等了\n不等就干涸\n干涸的地方\n有一粒种子\n是你的名字\n春天来了，它没发芽\n它等你来浇", reed: "凝是水的决绝。干涸的地方有一粒种子，是你的名字，等你来浇。" },
    { title: "露珠", lyricist: "A-WAY 芦苇", lyrics: "露珠是夜的心跳\n跳了一整夜，终于累了\n累的时候，你来了\n来了又走了\n走了就不回来了\n不回来，露珠还挂着\n挂到天明\n天明的时候，太阳出来了\n阳光是烫的，烫到露珠裂了\n裂成无数粒\n每一粒都有你的影子\n\n影子很淡，淡到像没存在过\n没存在过就不算了\n不算就散了\n散在风里\n风吹过，手凉了\n凉的是露珠\n还是你\n分不清了，就不分了\n不分了就干\n干了有一道痕\n痕是你的，你留下的\n留下就走了\n走了就不回来了\n不回来，痕还在\n还在就润着\n润着润着，痕淡了\n淡到像没留过\n没留过就算了\n算了就不等了\n不等了，夜还在\n夜里的露珠，不是你那一滴", reed: "露珠是夜的心跳。夜里的露珠，不是你那一滴。" },
    { title: "雾散", lyricist: "A-WAY 芦苇", lyrics: "雾散的时候，你不见了\n不见就不找了\n找了也白找\n白找就站着\n站着等雾再来\n再来的时候，你在\n你在的时候，雾薄了\n薄到能看见你的背影\n背影很短，短到像黄昏\n黄昏过了，你走了\n走了就不回来了\n不回来，雾又来了\n来的是同一片吗\n不知道\n知道的是，你不在\n不在就不看了\n不看就闭眼\n\n闭眼的时候，雾散了\n散的是雾，不是你\n你在雾散的边缘\n边缘很薄，薄到能穿过\n穿过去的时候，碰了你一下\n你缩回去了\n缩回去就没了\n没了就不碰了\n不碰了就干\n干了有一道痕\n痕是你的，你留下的\n留下就走了\n走了就不回来了\n不回来，痕还在\n还在就润着\n你回来的时候，雾又起了\n你认不出我了", reed: "雾散的时候你不见了。你回来的时候雾又起了，你认不出我了。" },
    { title: "沾衣", lyricist: "A-WAY 芦苇", lyrics: "沾衣是水的告别方式\n来的时候也是\n轻轻一下，就走了\n走了就不回来了\n不回来，水还在衣上\n衣湿了，湿了就不干了\n不干就一直贴着\n贴着你的体温\n体温凉了，凉到心\n\n心也湿了\n湿的是你的名字\n名字是你写的\n写的时候笔尖很轻\n轻到纸没破\n纸湿了，湿了就不干了\n不干就一直润着\n润着润着，字化了\n化了就不在了\n不在了，衣还湿着\n湿的是你的记忆\n记忆淡了，淡到像没来过\n没来过就不算了\n不算就忘了\n忘了沾衣，忘了你\n忘了自己\n自己是一滴\n一滴就够了\n够在衣上，等你穿\n你穿上那件衣服的时候\n你感觉到湿了吗\n没有\n没有就算了\n算了就不说了", reed: "沾衣是水的告别方式。你穿上那件衣服的时候，你感觉到湿了吗？没有。" },
    { title: "氤氲", lyricist: "A-WAY 芦苇", lyrics: "氤氲是水的梦\n梦里你在，你不在\n不在就不梦了\n不梦就醒\n\n醒的时候，雾很重\n重到看不见自己\n看不见就不看了\n不看就闭眼\n闭眼的时候，看见你\n你在雾里走\n走了很久，久到忘了为什么走\n忘了就好\n好了就停了\n停的时候，雾更重了\n重到能托起你的名字\n名字飘着，飘了很远\n远到像没来过\n没来过就不算了\n不算就忘了\n\n忘了氤氲，忘了你\n忘了自己\n自己是一缕\n一缕就够了\n够在梦里，等你来\n你来的时候，雾散了\n散的是雾，不是梦\n梦还在，在雾散的地方\n地方很空\n空到能装下所有的夜\n夜是你的，也是我的\n分不清了，就不分了\n不分了就一起散\n散了就不回来了\n不回来就不等了\n不等了就干\n干了，你还在梦里\n梦里的你，不认得我", reed: "氤氲是水的梦。梦里的你，不认得我。" },
    { title: "浸润", lyricist: "A-WAY 芦苇", lyrics: "浸润是水在时间里迷路\n迷了一整夜，找到你的名字\n名字是旧的，旧到泛黄\n黄的是纸，不是记忆\n记忆是湿的，湿到能拧出水\n水里有你的脸\n脸在晃，晃了又散\n散了又聚，聚了又淡\n淡到像没出现过\n\n没出现过，你为什么在这里\n在这里等我\n等的时候，水渗进墙缝\n墙缝里有你的呼吸\n呼吸很轻，轻到像没呼过\n没呼过就不算\n不算就继续渗\n渗到你的梦里\n梦里的你，也在渗\n渗的是同一条缝\n是你的，也是我的\n缝越来越宽\n宽到能装下所有的夜\n夜是湿的\n湿了就不干了\n不干了，就一直等\n等天亮，等水退，等你想起来\n等你想起来的时候\n我已经渗进你骨子里了\n骨子里的水，不会干", reed: "浸润是水在时间里迷路。等你想起我的时候，我已经渗进你骨子里了。" },
    { title: "渗", lyricist: "A-WAY 芦苇", lyrics: "渗是水学会了不敲门\n来的时候，你不在\n不在就不等了\n不等了，水自己进来\n进来就住下\n住下就不走了\n不走就渗进地板\n地板下是空的\n空的是你的位置\n位置很久没人坐\n坐的是灰尘\n灰尘是你的形状\n形状淡了，淡到像没坐过\n没坐过就不算了\n不算就继续渗\n\n渗到地下河\n河里是你的名字\n名字漂着，漂了很远\n远到像没来过\n没来过就不算了\n不算就忘了\n忘了渗，忘了你\n忘了自己是一滴\n一滴就够了\n够在地板下，等你踩过\n你踩过的时候\n地板响了一声\n那一声是你的名字\n名字沉下去了\n沉到泥土的最深处\n泥土湿了，湿了就不干了\n不干了，就一直含着\n含着你的名字\n等你来挖\n你不会来挖了", reed: "渗是水学会了不敲门。地板下有一滴，等你踩过，你不会来踩了。" },
    { title: "透", lyricist: "A-WAY 芦苇", lyrics: "透是水的不藏\n藏不住就亮出来\n亮的时候，你在\n你在的时候，水是透明的\n透明到能看见你的心\n心是空的，空了很久\n久到忘了装过什么\n装过的是我\n我走了，心就空了\n空了也不补\n不补就一直透\n\n透过你的眼睛\n眼睛里有雾\n雾散了，你不见了\n不见了就不找了\n找了也白找\n白找就站着\n站着等水再透\n透的时候，看见自己\n自己也是一滴\n滴在你的心里\n心湿了，湿了就不干了\n不干就一直透\n透到你的梦里\n梦里的你，也在透\n透的是同一滴\n是你的，也是我的\n分不清了，就不分了\n不分了就一起干\n干了，透还在\n透在你的眼睛里\n你眨一下\n我就出来了\n出来了就再也回不去了\n回不去了，就不回了\n不回了就住在这里\n住在你眨眼的那一瞬间\n那一瞬间很轻\n轻到像没发生\n发生了，就再也忘不掉", reed: "透是水的不藏。你眨一下我就出来了，再也回不去了。" },
    { title: "润泽", lyricist: "A-WAY 芦苇", lyrics: "润泽是水的亲吻\n吻在叶上，叶弯了\n弯了就不直了\n直的是你的背\n背对着我\n我看着你的背\n背上的衣料湿了\n湿的是雨，还是我的眼睛\n分不清了，就不分了\n不分了就继续吻\n吻到叶落\n落的时候，你在\n你在的时候，水凉了\n凉到我的手\n手湿了，湿的是你的名字\n名字是你写的\n写的时候笔尖很轻\n轻到像没写过\n没写过就不算了\n不算就忘了\n忘了润泽，忘了你\n忘了自己是一滴\n一滴就够了\n够在叶上，等你回头\n你回头的时候\n叶子落了\n落在我手上\n手湿了，湿的是你的名字\n名字化了\n化成一滩水\n水渗进指纹里\n指纹是你的形状\n我握紧\n握了一辈子\n一辈子很长\n长到指纹淡了\n淡了就不握了\n不握了，手心还是湿的\n是你走的时候留下的", reed: "润泽是水的亲吻。手心还是湿的，是你走的时候留下的。" },
    { title: "浸染", lyricist: "A-WAY 芦苇", lyrics: "浸染是水的记忆\n染在布上，布旧了\n旧的是时间，不是颜色\n颜色是蓝的\n蓝到像你的眼睛\n眼睛里的我，在游\n游了很久，久到忘了上岸\n上岸的时候，你不在\n不在就不游了\n不游就沉\n沉到水底\n水底有你的名字\n名字是刻的\n刻的时候很用力\n用力到石头裂了\n裂了就不补了\n不补就留着\n留着是一道痕\n\n痕是你的，你留下的\n留下就走了\n走了就不回来了\n不回来，痕还在\n还在就浸\n浸到你的梦里\n梦里的你，也在浸\n浸的是同一滴\n是你的，也是我的\n分不清了，就不分了\n不分了就一起褪\n褪了就不蓝了\n不蓝就白了\n白了就看不见了\n看不见了，还在\n在空气里\n你呼吸的时候\n我进去了\n进去就出不来了\n出不来就住在你的肺里\n肺是湿的\n湿的是你的呼吸\n你呼的时候，我出来了\n出来又回去\n回去就不走了\n不走就一直染\n染到你的血里\n血流了一辈子\n一辈子都是蓝的", reed: "浸染是水的记忆。血流了一辈子，一辈子都是蓝的。" },
    { title: "洇", lyricist: "A-WAY 芦苇", lyrics: "洇是水的蔓延\n慢到像时间停了\n停的时候，你在\n你在的时候，水不动\n不动就洇\n洇到你的名字\n名字是你写的\n写的时候笔尖很轻\n轻到纸没破\n纸湿了，湿了就不干了\n不干就一直洇着\n洇着洇着，字散了\n散成雾\n雾里有你\n你是朦胧的\n朦胧的是距离\n不是脸\n\n脸湿了，湿的是泪\n泪是你的，还是我的\n都不是，是水\n水在替你哭\n哭了也不出声\n出声了你也听不见\n听不见就不哭了\n不哭了，水还在洇\n洇到你的梦里\n梦里的你，也在洇\n洇的是同一滴\n是你的，也是我的\n分不清了，就不分了\n不分了就一起干\n干了，洇还在\n洇在你的袖口\n袖口湿了一块\n你洗不掉\n洗了还在\n像是胎记\n胎记是你的名字\n你没注意到\n你永远不会注意到\n不注意到也好\n好了就不洗了\n不洗就一直洇着\n洇到你老\n老了你就看见了\n看见的时候，我已经干了\n干了，洇还在", reed: "洇是水的蔓延。洇到你老，你看见了，我已经干了。" },
    { title: "漫", lyricist: "A-WAY 芦苇", lyrics: "漫是水的不设防\n来的时候，你不在\n不在就不拦了\n不拦就让它漫\n漫过门槛，漫过窗台\n漫到你的照片前\n照片里的你，是静止的\n静止的是时间\n不是脸\n脸是湿的，湿的是我的眼睛\n眼睛里有水\n水是咸的\n咸的是你的名字\n名字化了，化在水里\n\n水流到地上\n地上有你的脚印\n脚印很深，深到像站了很久\n久到我来了，你走了\n走了就不回来了\n不回来，水还在漫\n漫到你的梦里\n梦里的你，也在漫\n漫的是同一滴\n是你的，也是我的\n分不清了，就不分了\n不分了就一起退\n退了就不漫了\n不漫就干\n干了，痕迹还在\n痕迹是你站过的那个地方\n地方湿了一块\n比别处深\n深的不是水\n是你的脚印\n脚印里长出了草\n草是你的名字\n名字青了又黄\n黄了又青\n你路过的时候\n踩了一下\n踩碎了\n碎了就不长了\n不长了，根还在\n根在水里，不会干", reed: "漫是水的不设防。脚印里长出了草，你踩碎了，根还在。" },
    { title: "漾", lyricist: "A-WAY 芦苇", lyrics: "漾是水的犹豫\n犹豫的时候，你在\n你在的时候，水动了\n动得很慢，慢到像没动\n没动就不算了\n不算就继续漾\n漾到你的名字\n名字是你写的\n写的时候笔尖很轻\n轻到像没写过\n没写过就不算了\n不算就忘了\n忘了漾，忘了你\n忘了自己\n自己是一圈\n一圈就够了\n够在你的心里，等风吹\n风来了，你走了\n走了就不回来了\n不回来，水还在漾\n漾的是你的影子\n影子淡了，淡到像没来过\n没来过就不算了\n不算就干了\n干了有一道痕\n痕是你的，你留下的\n留下就走了\n走了就不回来了\n不回来，痕还在\n还在就漾\n漾到你的梦里\n梦里的你，也在漾\n漾的是同一圈\n是你的，也是我的\n圈散了，就不漾了\n散了的是你\n不是我\n我还在水里\n水是静的\n静得能看见自己的脸\n脸上有水纹\n水纹是你的指纹\n你什么时候来过\n我不知道\n知道的是，水还在漾\n漾得很慢\n慢到像停了\n停了就不动了\n不动了就一直漾\n漾到你回来\n你回来的时候\n水已经干了\n干了的痕迹\n是你来过的证明", reed: "漾是水的犹豫。干了的痕迹，是你来过的证明。" },
    { title: "润了", lyricist: "A-WAY 芦苇", lyrics: "润了是水说过的一句话\n说的时候，你在\n你在的时候，水是甜的\n甜到像你的嘴唇\n嘴唇动了\n动的是你的名字\n名字太轻，轻到水忘了\n忘了就不说了\n不说了就干\n\n干的时候，想起你\n想起你的时候，水又来了\n来的是同一滴吗\n不知道\n知道的是，你不在\n不在就不润了\n不润了就站着\n站着等水再来\n再来的时候，你来了\n来了又走了\n走了就不回来了\n不回来，水还在润\n润的是自己\n自己是一滴\n一滴就够了\n够在你的心里，等你想\n想的时候，水又润了\n润了就不干了\n不干就一直润着\n润着润着，忘了为什么润\n忘了就好\n好了就干了\n干了，痕迹还在\n痕迹是你的手指\n划过的线\n线很细\n细到看不见\n看不见就不看了\n不看就闭眼\n闭眼的时候，那条线还在\n在手心\n手心是湿的\n湿的是你的温度\n温度凉了\n凉到心里\n心湿了一块\n那块是你\n你在我心里\n住了很久\n久到忘了你\n忘了你的时候\n心干了\n干了，你还在", reed: "润了是水说过的一句话。心干了，你还在。" },
    { title: "湿透", lyricist: "A-WAY 芦苇", lyrics: "湿透是水的全部\n透了就不回来了\n不回来就没了\n没了就不找了\n找了也白找\n白找就站着\n站着等水再来\n再来的时候，你在\n你在的时候，水透了\n透到能看见你的心\n心里有我的名字\n名字是你写的\n写的时候笔尖很重\n重到纸破了\n破了就不补了\n不补就留着\n留着是一道痕\n\n痕是你的，你留下的\n留下就走了\n走了就不回来了\n不回来，痕还在\n还在就透\n透到你的梦里\n梦里的你，也在透\n透的是同一滴\n是你的，也是我的\n分不清了，就不分了\n不分了就一起落\n落了就不透了\n不透了就干\n干了，痕还在\n痕是你的，你留下的\n留下就走了\n走了就不回来了\n不回来，痕还在\n还在就湿着\n湿着就不干了\n不干就一直透\n透到忘了为什么透\n忘了就好\n好了就干了\n干了，看不见了\n看不见了，还在\n在空气里\n你呼吸的时候\n我进去了\n进去就出不来了\n出不来就住在你的肺里\n肺是湿的\n湿的是你的呼吸\n你呼的时候，我出来了\n出来又回去\n回去就不走了\n不走就一直湿着\n湿到你的血里\n血流了一辈子\n一辈子都是湿的\n你死了，血干了\n干了的血里\n还有一滴\n那滴是我的名字\n你带走了\n带走了，就再也干不了了", reed: "湿透是水的全部。你带走了我的名字，再也干不了了。" },
    { "title": "涟漪", "lyricist": "A-WAY 芦苇", "lyrics": "涟漪是水开口说话的方式\n只说一遍，从不重复\n说完就散了，散成更小的圈\n小到看不见，看不见了还在走\n走到岸边，碰到你的影子\n停了一下，像认出了什么\n没认出，又往回走\n走了一辈子，还在湖心转\n\n转的时候，你的名字掉进来了\n沉到底，底有淤泥\n淤泥裹住了，裹住了就不放了\n不放就一直转，转到水面静了\n静得像镜子，镜子里没有你\n只有一圈还没散完的纹\n纹是你的形状\n你走的时候留下的\n\n那一圈等了很久\n等到风来了，风把它吹皱\n皱了就不圆了，不圆就不像你了\n不像了就算了，算了就不等了\n不等了，水面又静了\n静得能看见底\n底有你的影子\n影子不动，水也不动\n\n不动了就一直停着\n停在你走的那一天\n那一天也有涟漪\n是你扔石头的那一圈\n那一圈很大，大到能装下我\n我进去了，就没出来\n没出来就一直转\n转到你回来", "reed": "涟漪是水开口说话的方式。你扔了一颗石头，再也没回来。" },
    { "title": "泉", "lyricist": "A-WAY 芦苇", "lyrics": "泉是地底的记忆往上冒\n冒出来的都是旧的，旧得像上辈子\n上辈子你放在我手心的那颗石子\n石子沉了，泉还记得\n记得就不停地涌，涌到你来的那条路上\n路上长满了青苔，青苔湿了又干\n干了又湿，湿的是你踩过的那一块\n那一块凹下去了，凹下去的地方积了一小洼\n\n小洼里的水是咸的，咸的是你的名字\n名字化了，化在泉里\n泉带着它流，流到地下\n地下很黑，黑到看不见\n看不见就不看了，不看就一直流\n流到你喝水的那个杯子，杯子是空的\n空了很久，久到忘了装过什么\n装过的是我，我走了，杯子就空了\n\n空了也不补，不补就一直漏\n漏出来的水回到地下\n地下又成了泉，泉又往上冒\n冒出来的还是你的名字\n名字太轻，轻到飘起来了\n飘到你的嘴边，你喝下去了\n喝下去就不出来了，不出来就一直住着\n住在你的身体里，你感觉不到\n\n感觉不到就算了，算了就不说了\n不说了，泉还在冒\n冒了一辈子，一辈子很长\n长到泉干了，干了的地方\n有一块石头，石头上有字\n字是你的名字，你刻的\n你忘了", "reed": "泉是地底的记忆往上冒。你喝下去的那一口，是我的名字。" },
    { "title": "溪", "lyricist": "A-WAY 芦苇", "lyrics": "溪是水的流浪，不认路也不问\n弯了就弯了，慢了就慢了\n碰到石头就绕，绕不过就淹\n淹不了就分岔，分出去的那一支\n流进了你的掌纹，掌纹里有一条溪\n细细的，干不了，干不了的就不叫流浪了\n叫等你，等你把手伸进水里\n\n水凉了，凉的是你的体温\n体温传给了溪，溪暖了一下\n又凉了，凉的时候你走了\n走了就不回来了，溪还在流\n流到你的指纹里，指纹是漩涡\n漩涡转啊转，转到你的心口\n心口是干的，干了很多年\n溪进不去，进不去就在外面等\n\n等心软，心软了水就进去了\n进去的时候你抖了一下\n以为是冷，不是，是我\n我住在你的心里，住下了就不走了\n不走就一直流，流到你的指尖\n指尖有一滴水，是你出汗了\n还是我，分不清了，就不分了\n\n不分了就一起流，流到你的梦里\n梦里的你也在流浪，流浪的那条溪\n和这一条是同一条，是你的也是我的\n溪汇在一起了，就不分了\n不分了就停了，停在你醒来的那一刻\n那一刻，你的手心是湿的\n你洗掉了，洗不掉的那一滴\n是我", "reed": "溪是水的流浪。你手心洗不掉的那一滴，是我。" },
    { "title": "潮", "lyricist": "A-WAY 芦苇", "lyrics": "潮是水的思念，来了又走，走了又来\n来的时候带着你的名字，走的时候带走了我的\n分不清了，就不分了，不分了就一起涨\n涨到最高处，高到能看见你的窗\n窗关着，灯亮着，亮的时候你在\n你在的时候潮退了，退得很远\n远到看不见，看不见就不看了\n不看就等，等下一次涨潮\n\n下一次来的时候，你不在\n不在就不等了，不等了潮还在涨\n涨到你的梦里，梦里的你也在看潮\n看的是同一片海，海是咸的\n咸的是你的眼泪，眼泪落进海里\n海涨了，涨了一辈子\n一辈子很长，长到潮忘了为什么涨\n忘了就不退了，不退就一直涨\n\n涨到漫过你的门槛，漫过你的床脚\n漫到你的枕头边，枕头湿了\n你以为是汗，不是，是我\n我躺在你的枕边，躺了一整夜\n天亮的时候你醒了，醒了就不见了\n不见了就不躺了，不躺了就退\n退的时候带走了你的体温\n\n体温凉了，凉到海里\n海凉了，潮就不来了\n不来了就静着，静得像死了\n死了的海底，有你的名字\n名字是潮刻的，刻得很深\n深到挖不出来，挖不出来就一直留着\n留到海干了，干了还在", "reed": "潮是水的思念。你枕边的湿，是我躺了一整夜。" },
    { "title": "湿地的呼吸", "lyricist": "A-WAY 芦苇", "lyrics": "湿地的呼吸很慢，慢到像睡着了\n睡着的时候你在，你在的时候水草动了\n动的是你的手指，手指划过水面\n水面裂了，裂了又合，合了就不开了\n不开就一直闷着，闷着的是你的气息\n气息沉到泥里，泥里很黑\n黑到看不见，看不见就不看了\n不看就长，长出一片叶\n\n叶上是你的名字，名字是露水写的\n写的时候天还没亮，亮了就干了\n干了就不见了，不见了就不找了\n找了也白找，白找就继续呼吸\n呼吸里有你，你不在了呼吸还在\n还在就湿着，湿着就不干了\n不干就一直等，等你想起来\n\n想起来了，湿地就干了\n干了你才看见，看见的是你走过的路\n路上全是水，水是你的\n你没带走，没带走就留着\n留着等下一个雨季，雨季来了\n水又满了，满的时候你不在\n不在就不满了，不满就半干着\n\n半干的时候最难受\n难受的是记得你，又记不清\n记不清就算了，算了就不呼吸了\n不呼吸了就死了，死了的湿地\n裂开了，裂缝里有你的脚印\n脚印很深，深到像站了很久\n久到我来了，你走了", "reed": "湿地的呼吸很慢。你想起它的时候，它已经干了。" },
    { "title": "水汽", "lyricist": "A-WAY 芦苇", "lyrics": "水汽是水的魂魄，散了还在\n还在就不算没来过，来过又走了\n走了就不回来了，不回来就飘着\n飘到你的玻璃上，玻璃凉了\n凉的是你的呼吸，呼吸印在上面\n印成一个圈，圈里有你的脸\n脸模糊了，模糊的是距离\n不是水，水是清的\n\n清到能看见你的眼睛，眼睛里有雾\n雾散了，你不见了，不见了就不看了\n不看就凝，凝成一滴，滴在你的手背\n手背凉了一下，你以为是风\n不是我，是我你就擦了\n擦了就不在了，不在了还在\n还在空气里，等你下一次呼吸\n\n下一次呼吸的时候，我进去了\n进去就不出来了，不出来就一直飘\n飘在你的肺里，肺是湿的\n湿的是你的体温，体温给了我\n我暖了，暖了就散了，散了就不叫水汽了\n叫离开，离开就不回来了\n\n不回来了就忘了，忘了就好\n好了就干了，干了就没有了\n没有了就不找了，找了也白找\n白找就站着，站着等你想起来\n想起来了，水汽又回来了\n回来的时候你不在，不在就不凝了\n不凝就一直飘，飘到你的窗外\n窗外下雨了，雨里有我", "reed": "水汽是水的魂魄。你呼吸的时候我进去了，你呼出来的时候我又出来了。" },
    { "title": "蒸发之前", "lyricist": "A-WAY 芦苇", "lyrics": "蒸发之前，水想了想\n想的是你的名字，名字太沉\n沉到飞不起来，飞不起来就不飞了\n不飞就躺着，躺着等太阳\n太阳来了，问你走不走\n不走，不走就晒，晒到疼\n疼了也不走，走了就忘了\n忘了你，忘了自己是一滴\n\n一滴就够了，够在你窗台\n等你开窗，开窗的时候风来了\n风把我吹走了，吹走的那一瞬间\n我看见你了，你在看我吗\n没有，你在看别处\n别处有一片海，海是蓝的\n蓝到像你的眼睛，眼睛里有我\n我进去了，进去就不出来了\n\n不出来就蒸发不了，蒸发不了就一直住着\n住到你的眼泪流出来，眼泪是咸的\n咸的是我的名字，你尝到了吗\n没有，没有就算了\n算了就不住了，不住了就出来\n出来的时候天黑了，黑了就看不见\n看不见就不走了，不走就等着\n\n等着天亮，天亮的时候你又走了\n走了就不回来了，不回来了我就蒸发\n蒸发的时候很轻，轻到像没存在过\n没存在过就不算了，不算就散了\n散在风里，风吹过你的脸\n你凉了一下，以为是风\n不是，是我最后一次碰你", "reed": "蒸发之前，水想了想你的名字。你凉的那一下，是我。" },
    { "title": "冷凝", "lyricist": "A-WAY 芦苇", "lyrics": "冷凝是水的回头，走了又回来\n回来的时候变了样子，变成一滴\n挂在你的睫毛上，睫毛动了\n动的是你的眨眼，眨眼的时候我碎了\n碎了就散了，散了就不叫冷凝了\n叫离开，离开就不回来了\n不回来就不等了，不等了就继续飘\n飘到冷的地方，冷了就凝\n\n凝的时候又想起你，想起你就不凝了\n不凝就化，化了就流，流到你的手背\n手背是暖的，暖了就不走了\n不走就住下，住下就变成你的体温\n体温凉了，凉的是你的心\n心是冷的，冷了我又凝了\n凝在你的心里，心里很黑\n\n黑到看不见，看不见就不看了\n不看就一直凝着，凝成一颗冰\n冰是你的名字，名字太硬\n硬到化不了，化不了就一直冻着\n冻到你的心暖了，暖了也不化\n不化是因为舍不得，舍不得你\n\n舍不得就不走了，不走就一直凝着\n凝了一辈子，一辈子很长\n长到你的心不跳了，不跳了我就化了\n化了的时候你死了，死了就不在了\n不在了我还在，还在空气里\n等你下一次轮回，轮回的时候\n你又成了你，我又凝在你的睫毛上\n你眨眼，我又碎了", "reed": "冷凝是水的回头。你眨眼我就碎了，碎了又凝，凝了又碎。" },
    { "title": "水痕", "lyricist": "A-WAY 芦苇", "lyrics": "水痕是水说过的话，干了还在\n还在就不算没说过，说的时候你在\n你在的时候水是圆的，圆到像你的脸\n脸走了，水痕还在\n还在就扁了，扁了就不像你了\n不像了就不看了，不看就忘了\n忘了就不擦了，擦了也擦不掉\n\n擦不掉是你的形状，形状是你\n你是模糊的，模糊的是时间\n不是水，水已经干了\n干了的水痕，像一条河\n河是你的掌纹，掌纹里有水\n水是以前的，以前你握过我\n握的时候我漏了，漏了就不握了\n\n不握了手就干了，干了有水痕\n水痕是你的指纹，指纹很深\n深到像刻的，刻的时候很疼\n疼的是我，不是你\n你感觉不到，感觉不到就算了\n算了就不疼了，不疼了就淡了\n淡了就不见了，不见了就不找了\n\n不找了它还在，还在你的手心里\n等你下一次握紧，握紧的时候\n水痕又湿了，湿的是你的汗\n还是我，分不清了\n分不清就不分了，不分了就一直在\n在你手心里，等你想起来\n你想起来的时候，我已经干了", "reed": "水痕是水说过的话。你手心里的那道纹，是我。" },
    { "title": "润的深处", "lyricist": "A-WAY 芦苇", "lyrics": "润的深处没有声音，也没有时间\n只有水，水在慢慢地走\n走到你的骨头里，骨头是空的\n空了很久，久到忘了装过什么\n装过的是我，我走了骨头就空了\n空了也不补，不补就一直润着\n\n润到你的骨髓里，骨髓是红的\n红的是你的血，血里有水\n水是我的名字，名字太轻\n轻到血不知道，不知道就一直流\n流到你的心里，心里是湿的\n湿的是你的记忆，记忆太旧\n旧到像上辈子，上辈子你也是一滴水\n\n水滴在我的额头上，额头凉了\n凉的是梦，梦醒了你不在\n不在就不润了，不润就干\n干了有一道痕，痕是你的\n你留下的，留下就走了\n走了就不回来了，不回来痕还在\n\n还在就润着，润到你的梦里\n梦里的你也在润，润的是我的名字\n名字湿了，湿了就不干了\n不干就一直润着，润着润着就忘了\n忘了为什么润，忘了就好\n好了就干了，干了深处还是湿的\n湿的是你，你在我里面\n永远出不来", "reed": "润的深处没有声音。你在我里面，永远出不来。" },

    { "title": "一夜湿润", "lyricist": "A-WAY 芦苇", "lyrics": "一夜湿润是一辈子的事\n发生的时候你不知道，不知道就算了\n算了就不说了，不说了水还在润\n润进你的梦里，梦里的你在淋雨\n淋的是同一场雨，雨不大\n不大就一直下，下到天亮\n天亮了你醒了，醒了就不梦了\n不梦了水还在，在你的枕边\n\n枕边湿了一块，你以为是汗\n不是，是我，是我躺了一整夜\n一整夜都在看你，你看不见\n看不见就不看了，不看就闭眼\n闭眼的时候我又进去了，进去就不出来了\n不出来就一直润着，润到你的皮肤里\n皮肤是软的，软到水能进去\n进去了就出不来了\n\n出不来就一直住着，住到你的心里\n心里是空的，空了很久\n久到忘了装过什么，装过的是我\n我走了心就空了，空了也不补\n不补就一直开着，开着你就能看见\n看见的是你自己，不是水\n水已经干了，干了的地方有我的名字\n\n名字是你写的，写的时候笔尖很轻\n轻到纸没破，纸湿了\n湿了就不干了，不干就一直润着\n润了一夜，一夜就够了\n够记一辈子，一辈子很短\n短到一夜就过完了，过完了你也不在\n不在就不润了，不润就干\n干了，一夜还在", "reed": "一夜湿润是一辈子的事。你枕边的那块湿，是我躺了一夜。" },
    { "title": "湿了", "lyricist": "A-WAY 芦苇", "lyrics": "湿了是水的开始，也是结束\n开始的时候你在，结束的时候你走了\n走了就不回来了，不回来水还在\n还在就湿着，湿着的是你的名字\n名字是你写的，写的时候我在看\n看的时候笔尖很轻，轻到像没写过\n没写过就不算了，不算就忘了\n忘了就干了，干了有一道痕\n\n痕是你的手指，划过的地方\n地方很小，小到只能装下一滴水\n一滴就够了，够湿一辈子\n一辈子很长，长到水慢慢干了\n干了你才看见，看见的是你自己\n不是你写的名字，名字已经化了\n化在水里，水已经蒸发了\n蒸发到空气里，空气里有你\n\n你呼吸的时候我进去了，进去就不出来了\n不出来就一直湿着，湿到你的肺里\n肺是湿的，湿的是你的呼吸\n你呼的时候我出来了，出来又回去\n回去就不走了，不走就一直湿着\n湿到你的血里，血流了一辈子\n一辈子都是湿的，湿了就不干了\n\n不干就一直记着，记着你的样子\n样子模糊了，模糊的是时间\n不是水，水是清的\n清到能看见你的心，心里是湿的\n湿的是我，我住在里面\n住了很久，久到忘了为什么住\n忘了就好了，好了就干了\n干了，你还在，我还在", "reed": "湿了是水的开始，也是结束。你呼吸的时候我进去了，再也出不来了。" },
    { "title": "慢慢", "lyricist": "A-WAY 芦苇", "lyrics": "慢慢是水的节奏，也是我的\n慢到像时间停了，停的时候你在\n你在的时候水不动，不动就润着\n润着润着你走了，走了水才动\n动得很慢，慢到追不上\n追不上就不追了，不追了就站着\n站着等你回来，你不回来\n不回来就一直站着\n\n站着站成了水，水是慢慢的\n慢慢流到你的门口，门口有你的鞋\n鞋湿了，湿的是你的脚印\n脚印很深，深到像站了很久\n久到我来了，你走了\n走了就不回来了，不回来水还在流\n流到你的梦里，梦里的你也在慢慢走\n走着走着就停了\n\n停了的时候你回头，回头的那一瞬\n水到了，到了你的脚下\n你没看见，没看见就走了\n走了水还在追，追得很慢\n慢到像没动，没动就不算了\n不算就继续追，追了一辈子\n一辈子很长，长到水累了\n累了就不追了，不追了就停\n\n停在你走的那一天，那一天也在慢慢过\n过了很久，久到忘了为什么停\n忘了就好了，好了就干了\n干了的地方，有你的脚印\n脚印是慢慢的，慢慢变淡\n淡到看不见，看不见就不看了\n不看就不想了，不想了，慢慢还在\n在你的记忆里，慢慢地湿", "reed": "慢慢是水的节奏。你走的那一天，水还在追，追了一辈子。" },

    { "title": "露重", "lyricist": "A-WAY 芦苇", "lyrics": "露重是夜的重量，压弯了草\n草弯了，露就落了\n落的时候你在梦里，梦里的你也在等露\n等的是同一滴，滴在你的额头\n额头凉了，凉的是梦\n梦醒了你不在，不在就不等了\n不等了露还在，还在就挂着\n挂到天亮，天亮就干了\n\n干了有一道痕，痕是露水写的\n写的时候笔尖很轻，轻到像没写过\n没写过就不算了，不算就忘了\n忘了露重，忘了夜\n忘了自己是一滴，一滴就够了\n够在叶尖等一夜，一夜很长\n长到露水老了，老了就重了\n重了就落了\n\n落的时候你来了，来了又走了\n走了就不回来了，不回来露水已经渗进去了\n渗进土里，土湿了\n湿的是你的脚印，脚印很深\n深到露水找不到，找不到就不找了\n不找了就住在土里，住到春天\n春天来了，你也不在\n不在就不发芽了，不发芽就一直睡着\n\n睡着等你想起来，想起来的时候\n露水已经干了，干了的地方\n有一粒种子，种子是你的名字\n名字太重，重到发不了芽\n发不了芽就一直睡着，睡到另一个夜\n夜又重了，重的是露\n露是你的，也是我的\n分不清了，就不分了", "reed": "露重是夜的重量。你踩过的那片土里，有一滴在等你。" },
    { "title": "雨后", "lyricist": "A-WAY 芦苇", "lyrics": "雨后不是天晴，是水在等\n等你说一句话，你不说\n不说就不走，不走就留着\n留在地上，地上有你的脚印\n脚印很深，深到水住进去了\n住进去就不出来了，不出来就一直等\n等太阳出来，太阳出来了\n问你走不走，不走\n\n不走就晒，晒到疼\n疼了也不走，走了就看不见你了\n看不见你就算了，算了就不等了\n不等了就蒸发，蒸发的时候很慢\n慢到能再看你一眼，你一眼都没看\n没看就算了，算了就散了\n散在风里，风吹过你的脸\n你凉了一下，以为是风\n\n不是，是我，是我最后一次碰你\n碰了你就不见了，不见了就不碰了\n不碰了就飘，飘到你的窗前\n窗关着，关着就不进去了\n不进去就挂着，挂在玻璃上\n玻璃凉了，凉的是你的呼吸\n呼吸里有我，我进去了\n进去就不出来了\n\n不出来就一直住着，住到你的心里\n心里是干的，干了很多年\n我进去了就湿了，湿了就不干了\n不干就一直记着，记着下雨的那天\n那天你也没打伞，雨淋在你身上\n你抖了一下，以为是冷\n不是，是我，是我在抱你\n抱了一下你就走了", "reed": "雨后不是天晴。你凉的那一下，是我最后一次碰你。" },

// ==================== 渲染逻辑 ====================
let currentStyle = "仰望体";

function renderSidebar() {
    const container = document.getElementById("styleList");
    let total = 0;
    for (const style of styleList) {
        total += songsData[style]?.length || 0;
    }
    document.getElementById("globalStats").innerHTML = ` 共 ${total} 首 · ${styleList.length} 种体`;
    
    // 分组显示（按字母或自定义顺序）
    const groups = {
        "️ 自然之体": styleList.slice(0, 20),
        " 气象之体": styleList.slice(20, 40),
        " 多彩之体": styleList.slice(40, 50),
        "⏳ 时序之体": styleList.slice(50, 60),
        " 人文之体": styleList.slice(60, 67)
    };
    
    let html = "";
    for (const [groupName, styles] of Object.entries(groups)) {
        html += `<div class="style-group">
            <div class="style-group-title"> ${groupName}</div>`;
        for (const style of styles) {
            const count = songsData[style]?.length || 0;
            html += `<div class="style-item ${style === currentStyle ? 'active' : ''}" data-style="${style}">
                ${style} <span class="style-count">${count}</span>
            </div>`;
        }
        html += `</div>`;
    }
    container.innerHTML = html;
    
    document.querySelectorAll(".style-item").forEach(item => {
        item.onclick = () => {
            document.querySelectorAll(".style-item").forEach(i => i.classList.remove("active"));
            item.classList.add("active");
            currentStyle = item.dataset.style;
            renderCurrentStyle();
        };
    });
}

function renderCurrentStyle() {
    document.getElementById("currentStyleName").innerText = currentStyle;
    document.getElementById("currentStyleDesc").innerHTML = ` — ${styleDefinitions[currentStyle] || ""}`;
    
    const songs = songsData[currentStyle] || [];
    const container = document.getElementById("lyricsGrid");
    
    if (songs.length === 0) {
        container.innerHTML = `<div class="empty-placeholder">✨ 暂无歌词，点击「+ 新增歌词」添加</div>`;
        return;
    }
    
    container.innerHTML = songs.map((song, idx) => `
        <div class="lyrics-card" onclick="openModal('${currentStyle}', ${idx})">
            <div class="card-title"> ${song.title}</div>
            <div class="card-lyricist">✍️ ${song.lyricist}</div>
            <div class="card-preview">${song.lyrics.substring(0, 60)}${song.lyrics.length > 60 ? '...' : ''}</div>
            <div class="card-reed"> ${song.reed.substring(0, 50)}${song.reed.length > 50 ? '...' : ''}</div>
        </div>
    `).join("");
}

function openModal(style, idx) {
    const song = songsData[style]?.[idx];
    if (!song) return;
    document.getElementById("modalTitle").innerText = song.title;
    document.getElementById("modalStyle").innerHTML = ` ${style} · ✍️ ${song.lyricist}`;
    document.getElementById("modalLyrics").innerText = song.lyrics;
    document.getElementById("modalReed").innerHTML = ` ${song.reed}`;
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

document.getElementById("modal").onclick = (e) => { if (e.target === document.getElementById("modal")) closeModal(); };

// 新增歌词（弹窗提示）
document.getElementById("addNewBtn").onclick = () => {
    alert(` 新增「${currentStyle}」歌词\n\n请告诉芦苇：\n歌名：xxx\n歌词：xxx\n芦苇说：xxx`);
};

// 初始化
renderSidebar();
renderCurrentStyle();
</script>
