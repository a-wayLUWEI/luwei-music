<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芦苇音乐学堂 · MIDI转简谱专业版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a3a2a 0%, #0e2a1f 100%);
            font-family: system-ui, 'Segoe UI', sans-serif;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .back-home { margin-bottom: 20px; }
        .back-home a {
            color: #AAD4B0;
            text-decoration: none;
            background: #0f281dcc;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #F2C94C;
        }
        .card {
            background: #0f281dcc;
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 30px;
            border: 1px solid #F2C94C;
        }
        h1 { color: #FFD966; font-size: 1.8rem; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .sub { color: #AAD4B0; margin-bottom: 24px; }
        .upload-area {
            border: 2px dashed #F2C94C;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .upload-area:hover { background: #1a3a2a; }
        .upload-area input { display: none; }
        .btn {
            background: #E69A2E;
            color: #2D1E0C;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 12px;
        }
        .btn:active { transform: scale(0.97); }
        .loading {
            text-align: center;
            padding: 40px;
            color: #AAD4B0;
            display: none;
        }
        .result-area {
            margin-top: 30px;
            display: none;
        }
        .key-badge {
            background: #2a4a3a;
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 20px;
            color: #FFD966;
        }
        .sheet-image {
            background: white;
            border-radius: 16px;
            padding: 20px;
            overflow-x: auto;
            text-align: center;
            margin-bottom: 20px;
        }
        .sheet-image img {
            max-width: 100%;
            border-radius: 8px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #1a3a2a;
            padding: 12px 20px;
            border-radius: 16px;
            color: #C8E6C9;
        }
        .stat-card span { color: #FFD966; font-weight: bold; font-size: 1.3rem; }
        .export-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .footer {
            text-align: center;
            color: #b8aa78;
            font-size: 0.55rem;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #F2C94C40;
        }
        @media (max-width: 600px) {
            .card { padding: 20px; }
            .upload-area { padding: 30px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back-home">
        <a href="index.html">← 返回首页</a>
    </div>
    <div class="card">
        <h1>
            <span></span> MIDI 转简谱
            <span style="font-size: 0.7rem; background: #E69A2E; color: #2D1E0C; padding: 4px 12px; border-radius: 20px;">专业版</span>
        </h1>
        <div class="sub">支持多声部 · 自动识别调性 · 智能音名拼写 · 装饰音检测 · 导出图片/PDF</div>

        <div class="upload-area" id="uploadArea">
            <div> 点击或拖拽上传 MIDI 文件</div>
            <div style="font-size: 0.7rem; margin-top: 8px;">支持复杂MIDI、多轨、多声部</div>
            <input type="file" id="fileInput" accept=".mid,.midi">
        </div>

        <div class="loading" id="loading">
            <div>⏳ 正在分析 MIDI 文件...</div>
            <div style="font-size: 0.7rem; margin-top: 8px;">（复杂乐曲可能需要2-3秒）</div>
        </div>

        <div class="result-area" id="resultArea">
            <div class="stats" id="statsArea"></div>
            <div class="key-badge" id="keyBadge"></div>
            <div class="sheet-image" id="sheetImage"></div>
            <div class="export-btns" id="exportBtns">
                <button class="btn" id="exportPdfBtn"> 导出 PDF</button>
                <button class="btn" id="exportPngBtn">️ 保存为图片</button>
            </div>
        </div>
    </div>
    <div class="footer">
        © 芦苇音乐学堂 · MIDI转简谱专业版<br>
        后端基于 Partitura 引擎，支持调性估计(Krumhansl)、音名拼写(ps13s1)、声部分离(VoSA)
    </div>
</div>

<script>
    let currentResult = null;

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const loading = document.getElementById('loading');
    const resultArea = document.getElementById('resultArea');

    uploadArea.onclick = () => fileInput.click();
    uploadArea.ondragover = (e) => e.preventDefault();
    uploadArea.ondrop = (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file && (file.name.endsWith('.mid') || file.name.endsWith('.midi'))) {
            convertMidi(file);
        } else {
            alert('请上传 .mid 或 .midi 文件');
        }
    };
    fileInput.onchange = (e) => {
        if (e.target.files[0]) convertMidi(e.target.files[0]);
    };

    async function convertMidi(file) {
        loading.style.display = 'block';
        resultArea.style.display = 'none';

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('http://82.157.46.131:5001/convert', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (data.success) {
                currentResult = data;
                displayResult(data);
            } else {
                alert('转换失败：' + data.error);
            }
        } catch (err) {
            alert('连接服务器失败：' + err.message + '\n\n请确保后端服务已启动：cd ~/midi2sheet && python3 app.py');
        } finally {
            loading.style.display = 'none';
        }
    }

    function displayResult(data) {
        // 统计信息
        document.getElementById('statsArea').innerHTML = `
            <div class="stat-card"> 音符数 <span>${data.total_notes}</span></div>
            <div class="stat-card">️ 声部数 <span>${data.voice_count}</span></div>
        `;
        document.getElementById('keyBadge').innerHTML = ` 检测调性：${data.key}`;

        // 显示简谱图片
        document.getElementById('sheetImage').innerHTML = `<img src="${data.svg_image}" alt="简谱">`;

        resultArea.style.display = 'block';
    }

    // 导出 PDF
    document.getElementById('exportPdfBtn').onclick = async () => {
        if (!currentResult) return;
        
        const response = await fetch('http://82.157.46.131:5001/export-pdf', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                notes: currentResult.notes,
                key: currentResult.key
            })
        });
        
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'jianpu.pdf';
        a.click();
        URL.revokeObjectURL(url);
    };

    // 保存图片
    document.getElementById('exportPngBtn').onclick = () => {
        if (!currentResult) return;
        const img = document.querySelector('#sheetImage img');
        if (img) {
            const a = document.createElement('a');
            a.href = img.src;
            a.download = 'jianpu.png';
            a.click();
        }
    };
</script>
</body>
</html>
