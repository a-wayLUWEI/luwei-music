<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>我的参赛 · 芦苇音乐</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="checkAuth.js"></script>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #050505 0%, #0a0a0a 12%, #111111 24%, #1a1a1a 36%, #1a1a3a 46%, #4a4a8a 52%, #6a5a9a 56%, #4a4a8a 60%, #1a1a3a 66%, #1a1a1a 74%, #2a2a2a 82%, #4a4a4a 88%, #2a2a2a 94%, #1a1a1a 100%);
    background-size: 600% 600%;
    color: #e8e9f0;
    padding: 20px 20px 100px;
    animation: bodyGradientFlow 14s ease-in-out infinite alternate;
    min-height: 100vh;
}
@keyframes bodyGradientFlow {
    0% { background-position: 0% 50%; }
    14% { background-position: 14% 50%; }
    28% { background-position: 28% 50%; }
    42% { background-position: 42% 50%; }
    57% { background-position: 57% 50%; }
    71% { background-position: 71% 50%; }
    85% { background-position: 85% 50%; }
    100% { background-position: 100% 50%; }
}
.container { max-width: 900px; margin: 0 auto; }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
}
.header h1 {
    font-size: 24px;
    background: linear-gradient(135deg, #d4b896, #f0e0c8, #b8a0c8, #d4b896);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.header .back {
    color: rgba(255,255,255,0.3);
    text-decoration: none;
    font-size: 0.85rem;
    padding: 4px 14px;
    border: 1px solid rgba(212,184,150,0.06);
    border-radius: 30px;
    transition: 0.3s;
}
.header .back:hover {
    color: rgba(255,255,255,0.5);
    border-color: rgba(212,184,150,0.15);
}
.header .user-name {
    color: rgba(255,255,255,0.2);
    font-size: 0.8rem;
}

.section-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    margin-bottom: 16px;
    letter-spacing: 2px;
}

.song-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.song-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.06);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    transition: 0.3s;
}
.song-item:hover {
    border-color: rgba(212,184,150,0.12);
}
.song-item .info {
    flex: 1;
}
.song-item .info .title {
    font-weight: 600;
    color: #d4b896;
    font-size: 1rem;
}
.song-item .info .artist {
    color: rgba(255,255,255,0.3);
    font-size: 0.8rem;
    margin-top: 2px;
}
.song-item .info .meta {
    color: rgba(255,255,255,0.15);
    font-size: 0.7rem;
    margin-top: 4px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
.song-item .status {
    padding: 2px 12px;
    border-radius: 12px;
    font-size: 0.6rem;
    font-weight: 600;
    white-space: nowrap;
}
.song-item .status.pending {
    background: rgba(255,200,0,0.1);
    color: #ffd700;
}
.song-item .status.active {
    background: rgba(68,221,68,0.1);
    color: #44dd44;
}
.song-item .status.rejected {
    background: rgba(255,100,100,0.1);
    color: #ff6b6b;
}
.song-item .stats {
    display: flex;
    gap: 16px;
    color: rgba(255,255,255,0.2);
    font-size: 0.7rem;
}

.empty {
    text-align: center;
    color: rgba(255,255,255,0.15);
    padding: 60px 0;
}
.loading {
    text-align: center;
    color: rgba(255,255,255,0.15);
    padding: 60px 0;
}
.footer {
    text-align: center;
    font-size: 0.7rem;
    margin-top: 40px;
    color: rgba(255,255,255,0.1);
}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1> 我的参赛记录</h1>
        <div>
            <span class="user-name" id="userName"></span>
            <a href="aimusic.html" class="back">← 返回榜单</a>
        </div>
    </div>

    <div id="songList">
        <div class="loading">加载中...</div>
    </div>

    <div class="footer">© 芦苇音乐 · 在芦苇深处，治愈自己的思念</div>
</div>

<script>
const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

let supabaseClient = null;
let isSupabaseReady = false;

function initSupabase() {
    return new Promise((resolve, reject) => {
        if (isSupabaseReady && supabaseClient) {
            resolve(supabaseClient);
            return;
        }
        if (typeof supabase !== 'undefined' && supabase.createClient) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            isSupabaseReady = true;
            resolve(supabaseClient);
            return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        script.onload = function() {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                isSupabaseReady = true;
                resolve(supabaseClient);
            } else {
                reject(new Error('Supabase 加载失败'));
            }
        };
        script.onerror = function() { reject(new Error('Supabase CDN 加载失败')); };
        document.head.appendChild(script);
    });
}

async function ensureSupabase() {
    if (isSupabaseReady && supabaseClient) return supabaseClient;
    return await initSupabase();
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function getStatusLabel(status) {
    const map = {
        'pending': '审核中',
        'active': '已通过',
        'rejected': '已拒绝'
    };
    return map[status] || status;
}

function getStatusClass(status) {
    const map = {
        'pending': 'pending',
        'active': 'active',
        'rejected': 'rejected'
    };
    return map[status] || '';
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

async function loadMySongs() {
    const container = document.getElementById('songList');
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
    const userId = currentUser.user_id;

    // checkAuth.js 已经拦截了未登录用户，这里不需要再判断

    document.getElementById('userName').textContent = ' ' + userId;

    try {
        const client = await ensureSupabase();
        const { data, error } = await client
            .from('songs')
            .select('*')
            .eq('user_id', userId)
            .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    <p>还没有参赛作品</p>
                    <p style="font-size:0.8rem;margin-top:8px;color:rgba(255,255,255,0.08);">去 <a href="aimusic.html" style="color:#d4b896;">榜单</a> 上传你的第一首作品吧</p>
                </div>
            `;
            return;
        }

        const total = data.length;
        const pending = data.filter(s => s.status === 'pending').length;
        const active = data.filter(s => s.status === 'active').length;
        const rejected = data.filter(s => s.status === 'rejected').length;

        container.innerHTML = `
            <div style="display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap;font-size:0.75rem;color:rgba(255,255,255,0.15);">
                <span> 共 ${total} 首</span>
                <span style="color:#ffd700;">⏳ 审核中 ${pending}</span>
                <span style="color:#44dd44;">✅ 已通过 ${active}</span>
                <span style="color:#ff6b6b;">❌ 已拒绝 ${rejected}</span>
            </div>
            <div class="song-list">
                ${data.map(s => `
                    <div class="song-item">
                        <div class="info">
                            <div class="title">${escapeHtml(s.title)}</div>
                            <div class="artist">${escapeHtml(s.artist)} · ${escapeHtml(s.genre || '未分类')}</div>
                            <div class="meta">
                                <span> ${formatDate(s.created_at)}</span>
                                <span>❤️ ${s.likes || 0} 票</span>
                                <span>▶️ ${s.plays || 0} 次播放</span>
                                ${s.contest_id ? `<span>️ 已参赛</span>` : ''}
                            </div>
                        </div>
                        <div class="stats">
                            <span class="status ${getStatusClass(s.status)}">${getStatusLabel(s.status)}</span>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;

    } catch (e) {
        console.error('加载失败:', e);
        container.innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    loadMySongs();
});
</script>

</body>
</html>
