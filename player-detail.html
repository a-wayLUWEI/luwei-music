<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>参赛选手详情 · 芦苇音乐</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #050505 0%, #0a0a0a 12%, #111111 24%, #1a1a1a 36%, #1a1a3a 46%, #4a4a8a 52%, #6a5a9a 56%, #4a4a8a 60%, #1a1a3a 66%, #1a1a1a 74%, #2a2a2a 82%, #4a4a4a 88%, #2a2a2a 94%, #1a1a1a 100%);
    background-size: 600% 600%;
    color: #e8e9f0;
    padding: 20px 20px 120px;
    animation: bodyGradientFlow 14s ease-in-out infinite alternate;
    min-height: 100vh;
}
@keyframes bodyGradientFlow {
    0% { background-position: 0% 50%; }
    14% { background-position: 14% 50%; }
    28% { background-position: 28% 50%; }
    42% { background-position: 42% 50%; }
    57% { background-position: 57% 50%; }
    71% { background-position: 71% 50%; }
    85% { background-position: 85% 50%; }
    100% { background-position: 100% 50%; }
}
.container { max-width: 800px; margin: 0 auto; }

/* ===== 头部 ===== */
.header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 24px;
    flex-wrap: wrap;
}
.header .back {
    color: rgba(255,255,255,0.3);
    text-decoration: none;
    font-size: 0.85rem;
    padding: 6px 18px;
    border: 1px solid rgba(212,184,150,0.06);
    border-radius: 30px;
    transition: 0.3s;
    flex-shrink: 0;
}
.header .back:hover { color: rgba(255,255,255,0.5); border-color: rgba(212,184,150,0.15); }

/* ===== 选手信息 ===== */
.player-info {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.06);
    border-radius: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}
.player-info .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(212,184,150,0.15);
    flex-shrink: 0;
}
.player-info .avatar-placeholder {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4b896, #b8a0c8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: #1a1a2e;
    flex-shrink: 0;
}
.player-info .info .name {
    font-size: 1.4rem;
    font-weight: 600;
    color: #d4b896;
}
.player-info .info .bio {
    color: rgba(255,255,255,0.35);
    font-size: 0.9rem;
    margin-top: 4px;
}
.player-info .info .stats {
    display: flex;
    gap: 20px;
    margin-top: 8px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.2);
}
.player-info .info .stats strong { color: rgba(255,255,255,0.4); }

/* ===== 歌曲列表 ===== */
.section-title {
    font-size: 1rem;
    font-weight: 600;
    color: rgba(255,255,255,0.25);
    margin-bottom: 14px;
    letter-spacing: 2px;
}
.song-grid { display: flex; flex-direction: column; gap: 12px; }
.song-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.06);
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    transition: 0.3s;
}
.song-item:hover { border-color: rgba(212,184,150,0.12); }
.song-item .info .title {
    font-size: 1rem;
    font-weight: 500;
    color: #e8e9f0;
}
.song-item .info .meta {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.2);
    margin-top: 2px;
}
.song-item .info .meta .demo { color: #d4b896; }
.song-item .actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}
.song-item .actions .play-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(212,184,150,0.06);
    border-radius: 20px;
    padding: 4px 16px;
    color: rgba(255,255,255,0.3);
    cursor: pointer;
    font-size: 0.75rem;
    transition: 0.3s;
}
.song-item .actions .play-btn:hover {
    border-color: rgba(212,184,150,0.2);
    color: rgba(255,255,255,0.6);
}
.song-item .actions .play-btn.playing {
    color: #66ff66;
    border-color: rgba(68,221,68,0.3);
}
.empty {
    text-align: center;
    color: rgba(255,255,255,0.15);
    padding: 40px 0;
}
.loading {
    text-align: center;
    color: rgba(255,255,255,0.15);
    padding: 40px 0;
}
.footer {
    text-align: center;
    font-size: 0.7rem;
    margin-top: 40px;
    color: rgba(255,255,255,0.08);
}

/* ===== 底部歌词框 ===== */
#bottomLyrics {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 800px;
    max-height: 600px;
    background: rgba(20, 20, 40, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 16px 20px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    z-index: 99999;
    display: none;
    overflow-y: auto;
    transition: none;
}
#dragHandle {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 32px;
    cursor: grab;
    border-radius: 20px 20px 0 0;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.1);
    font-size: 0.6rem;
    letter-spacing: 4px;
}
#dragHandle:hover { color: rgba(255,255,255,0.2); }
#bottomLyricsTitle {
    color: rgba(255,255,255,0.4);
    font-size: 0.75rem;
    letter-spacing: 1px;
}
#bottomLyricsContent {
    column-count: 3;
    column-gap: 16px;
    font-size: 0.75rem;
    line-height: 1.8;
    color: rgba(255,255,255,0.7);
    max-height: 460px;
    overflow-y: auto;
    padding-right: 4px;
}
#bottomLyricsContent::-webkit-scrollbar { width: 2px; }
#bottomLyricsContent::-webkit-scrollbar-track { background: transparent; }
#bottomLyricsContent::-webkit-scrollbar-thumb { background: rgba(212,184,150,0.15); border-radius: 4px; }
#bottomLyricsContent .lrc-line {
    transition: all 0.3s ease;
    padding: 1px 0;
    display: inline-block;
    width: 100%;
}
#bottomLyricsContent .lrc-line.past {
    opacity: 0.2;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.1);
    filter: blur(0.5px);
}
#bottomLyricsContent .lrc-line.active {
    opacity: 1;
    font-size: 0.95rem;
    color: #ffffff;
    font-weight: 600;
    text-shadow: 0 0 30px rgba(212,184,150,0.1);
}
#bottomLyricsContent .lrc-line.future {
    opacity: 0.4;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.3);
}
#bottomLyrics::-webkit-scrollbar { width: 3px; }
#bottomLyrics::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 4px; }
#bottomLyrics::-webkit-scrollbar-thumb { background: rgba(212,184,150,0.2); border-radius: 4px; }

/* ===== Toast ===== */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

<script>
// ============================================================
// Supabase 配置
// ============================================================
const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

let supabaseClient = null;
let isSupabaseReady = false;

function initSupabase() {
    return new Promise((resolve, reject) => {
        if (isSupabaseReady && supabaseClient) {
            resolve(supabaseClient);
            return;
        }
        if (typeof supabase !== 'undefined' && supabase.createClient) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            isSupabaseReady = true;
            resolve(supabaseClient);
            return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        script.onload = function() {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                isSupabaseReady = true;
                resolve(supabaseClient);
            } else {
                reject(new Error('Supabase 加载失败'));
            }
        };
        script.onerror = function() { reject(new Error('Supabase CDN 加载失败')); };
        document.head.appendChild(script);
    });
}

async function ensureSupabase() {
    if (isSupabaseReady && supabaseClient) return supabaseClient;
    return await initSupabase();
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function showToast(msg) {
    const oldToast = document.getElementById('toast');
    if (oldToast) oldToast.remove();
    const toast = document.createElement('div');
    toast.id = 'toast';
    toast.textContent = msg;
    toast.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(26,26,46,0.95);
        color: #d4b896;
        padding: 14px 28px;
        border-radius: 40px;
        border: 1px solid rgba(212,184,150,0.15);
        backdrop-filter: blur(20px);
        z-index: 9999;
        font-size: 0.9rem;
        animation: fadeInUp 0.3s ease;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        pointer-events: none;
        max-width: 80%;
        text-align: center;
        font-weight: 500;
    `;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 350);
    }, 2200);
}

// ============================================================
// 数据
// ============================================================
let artistName = '';
let songs = [];
let currentSongId = null;
let audio = null;
let lyricsTimer = null;

// ===== 从 URL 获取选手名 =====
function getArtistFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get('artist') || '';
}

// ===== 加载数据 =====
async function loadData() {
    artistName = getArtistFromURL();
    if (!artistName) {
        document.getElementById('playerName').textContent = '未知选手';
        document.getElementById('songGrid').innerHTML = '<div class="empty">请从参赛选手列表进入</div>';
        return;
    }

    try {
        const client = await ensureSupabase();

        // 查询该选手的所有歌曲
        const { data, error } = await client
            .from('songs')
            .select('*')
            .eq('artist', artistName)
            .eq('status', 'active')
            .order('created_at', { ascending: false });

        if (error) throw error;

        songs = data || [];
        renderPlayerInfo();
        renderSongs();

    } catch (e) {
        console.error('加载失败:', e);
        document.getElementById('songGrid').innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
    }
}

// ===== 渲染选手信息 =====
function renderPlayerInfo() {
    if (songs.length === 0) {
        document.getElementById('playerName').textContent = artistName;
        document.getElementById('playerBio').textContent = '暂无作品';
        document.getElementById('songCount').textContent = '0';
        document.getElementById('totalLikes').textContent = '0';
        return;
    }

    const first = songs[0];
    document.getElementById('playerName').textContent = first.artist || artistName;

    // 头像
    const avatarContainer = document.getElementById('avatarContainer');
    if (first.avatar_url) {
        avatarContainer.innerHTML = `<img src="${first.avatar_url}" class="avatar">`;
    } else {
        avatarContainer.innerHTML = `<div class="avatar-placeholder"></div>`;
    }

    // 简介
    const bio = first.bio || '这位参赛选手还没有简介';
    document.getElementById('playerBio').textContent = bio;

    // 统计
    document.getElementById('songCount').textContent = songs.length;
    const totalLikes = songs.reduce((sum, s) => sum + (s.likes || 0), 0);
    document.getElementById('totalLikes').textContent = totalLikes;
}

// ===== 渲染歌曲列表 =====
function renderSongs() {
    const grid = document.getElementById('songGrid');

    if (songs.length === 0) {
        grid.innerHTML = '<div class="empty">该选手还没有参赛作品</div>';
        return;
    }

    grid.innerHTML = songs.map(s => `
        <div class="song-item">
            <div class="info">
                <div class="title">${escapeHtml(s.title)} ${s.is_demo ? '<span class="demo">[Demo]</span>' : ''}</div>
                <div class="meta">
                    ❤️ ${s.likes || 0} 票 · ▶️ ${s.plays || 0} 次播放
                    ${s.status === 'pending' ? ' · ⏳ 审核中' : ''}
                </div>
            </div>
            <div class="actions">
                <button class="play-btn" data-song-id="${s.id}" onclick="togglePlay('${s.id}')">▶️ 播放</button>
            </div>
        </div>
    `).join('');
}

// ============================================================
// 播放控制
// ============================================================
function togglePlay(songId) {
    const song = songs.find(s => s.id === songId);
    if (!song) return;

    // 如果点击的是同一首歌
    if (currentSongId === songId && audio && !audio.paused) {
        audio.pause();
        updatePlayButton(songId, false);
        closeBottomLyrics();
        return;
    }

    // 停止之前的播放
    if (audio) {
        audio.pause();
        if (currentSongId) updatePlayButton(currentSongId, false);
    }

    // 播放新歌
    audio = new Audio(song.audio_url);
    audio.currentSongId = songId;
    currentSongId = songId;

    audio.play();
    updatePlayButton(songId, true);

    // 显示底部歌词框
    showBottomLyrics(songId);

    audio.onended = function() {
        updatePlayButton(songId, false);
        closeBottomLyrics();
        currentSongId = null;
    };

    audio.onerror = function() {
        showToast('❌ 音频加载失败');
    };
}

function updatePlayButton(songId, isPlaying) {
    const btn = document.querySelector(`.play-btn[data-song-id="${songId}"]`);
    if (btn) {
        btn.textContent = isPlaying ? '⏸ 暂停' : '▶️ 播放';
        btn.classList.toggle('playing', isPlaying);
    }
}

// ============================================================
// 底部歌词框（从 aimusic.html 复刻）
// ============================================================
function showBottomLyrics(songId) {
    const song = songs.find(s => s.id === songId);
    if (!song) return;

    const container = document.getElementById('bottomLyrics');
    const content = document.getElementById('bottomLyricsContent');
    const title = document.getElementById('bottomLyricsTitle');

    title.textContent = ' ' + song.title + ' · ' + song.artist;
    container.style.display = 'block';

    // 生成歌词
    let lyricsHtml = '';
    const lrcData = parseLrc(song.lyrics || '');
    if (lrcData && lrcData.length > 0) {
        lyricsHtml = lrcData.map((item, index) =>
            `<div class="lrc-line" data-time="${item.time}" data-index="${index}">${escapeHtml(item.text)}</div>`
        ).join('');
    } else if (song.lyrics && song.lyrics.trim() && song.lyrics.trim() !== '纯音乐') {
        const plainLines = song.lyrics.split('\n').filter(line => line.trim());
        lyricsHtml = plainLines.map(line =>
            `<div class="lrc-line">${escapeHtml(line.trim())}</div>`
        ).join('');
    } else {
        lyricsHtml = `<div style="text-align:center;color:rgba(255,255,255,0.2);width:100%;"> 纯音乐 / 暂无歌词</div>`;
    }
    content.innerHTML = lyricsHtml;

    startLyricsSync(songId);
}

function closeBottomLyrics() {
    const container = document.getElementById('bottomLyrics');
    if (container) container.style.display = 'none';
    if (lyricsTimer) {
        clearInterval(lyricsTimer);
        lyricsTimer = null;
    }
}

function parseLrc(text) {
    if (!text) return [];
    const lines = text.split('\n');
    const result = [];
    const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
    for (const line of lines) {
        const match = line.match(regex);
        if (match) {
            const mins = parseInt(match[1]);
            const secs = parseInt(match[2]);
            const millis = parseInt(match[3].padEnd(3, '0'));
            const time = mins * 60 + secs + millis / 1000;
            const text = match[4].trim();
            if (text) {
                result.push({ time, text });
            }
        }
    }
    return result;
}

function startLyricsSync(songId) {
    if (lyricsTimer) {
        clearInterval(lyricsTimer);
        lyricsTimer = null;
    }

    const content = document.getElementById('bottomLyricsContent');
    if (!content) return;

    const song = songs.find(s => s.id === songId);
    if (!song) return;

    const lrcData = parseLrc(song.lyrics || '');
    const lines = content.querySelectorAll('.lrc-line');
    if (!lines.length || !lrcData || lrcData.length === 0) {
        lines.forEach(line => {
            line.style.opacity = '0.7';
            line.style.color = 'rgba(255,255,255,0.5)';
        });
        return;
    }

    let activeIndex = -1;

    function updateLyrics() {
        if (!audio || audio.paused || audio.ended) return;
        const currentTime = audio.currentTime;
        let newActiveIndex = -1;
        for (let i = 0; i < lrcData.length; i++) {
            if (currentTime >= lrcData[i].time) {
                newActiveIndex = i;
            }
        }
        if (newActiveIndex !== activeIndex) {
            activeIndex = newActiveIndex;
            lines.forEach((line, index) => {
                line.classList.remove('active', 'past', 'future');
                if (index < activeIndex) {
            line.classList.add('past');
                } else if (index === activeIndex) {
                    line.classList.add('active');
                } else {
                    line.classList.add('future');
                }
            });
            if (activeIndex >= 0) {
                const activeLine = lines[activeIndex];
                if (activeLine) {
                    const lineTop = activeLine.offsetTop;
                    const containerHeight = content.clientHeight;
                    const lineHeight = activeLine.clientHeight;
                    const targetScroll = lineTop - containerHeight / 2 + lineHeight / 2;
                    const maxScroll = content.scrollHeight - containerHeight;
                    const clampedTarget = Math.max(0, Math.min(targetScroll, maxScroll));
                    if (Math.abs(content.scrollTop - clampedTarget) > 5) {
                        content.scrollTop = clampedTarget;
                    }
                }
            }
        }
    }

    updateLyrics();
    lyricsTimer = setInterval(updateLyrics, 200);
}

// ============================================================
// 歌词框拖拽（从 aimusic.html 复刻）
// ============================================================
(function() {
    const container = document.getElementById('bottomLyrics');
    const handle = document.getElementById('dragHandle');
    if (!container || !handle) return;

    let isDragging = false;
    let offsetX = 0, offsetY = 0;

    handle.addEventListener('mousedown', function(e) {
        isDragging = true;
        const rect = container.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        container.style.transform = 'none';
        container.style.left = rect.left + 'px';
        container.style.top = rect.top + 'px';
        container.style.bottom = 'auto';
        container.style.cursor = 'grabbing';
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        let newX = e.clientX - offsetX;
        let newY = e.clientY - offsetY;
        const rect = container.getBoundingClientRect();
        const maxX = window.innerWidth - rect.width;
        const maxY = window.innerHeight - 30;
        newX = Math.max(0, Math.min(newX, maxX));
        newY = Math.max(0, Math.min(newY, maxY));
        container.style.left = newX + 'px';
        container.style.top = newY + 'px';
    });

    document.addEventListener('mouseup', function() {
        if (isDragging) {
            isDragging = false;
            container.style.cursor = 'default';
        }
    });

    handle.addEventListener('touchstart', function(e) {
        const touch = e.touches[0];
        const rect = container.getBoundingClientRect();
        isDragging = true;
        offsetX = touch.clientX - rect.left;
        offsetY = touch.clientY - rect.top;
        container.style.transform = 'none';
        container.style.left = rect.left + 'px';
        container.style.top = rect.top + 'px';
        container.style.bottom = 'auto';
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
        if (!isDragging) return;
        const touch = e.touches[0];
        let newX = touch.clientX - offsetX;
        let newY = touch.clientY - offsetY;
        const rect = container.getBoundingClientRect();
        const maxX = window.innerWidth - rect.width;
        const maxY = window.innerHeight - 30;
        newX = Math.max(0, Math.min(newX, maxX));
        newY = Math.max(0, Math.min(newY, maxY));
        container.style.left = newX + 'px';
        container.style.top = newY + 'px';
    }, { passive: true });

    document.addEventListener('touchend', function() {
        isDragging = false;
    });
})();

// ============================================================
// 启动
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    loadData();
});
</script>
</body>
</html>
