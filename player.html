    <style>
/* 评论弹窗背景流动 */
@keyframes commentBgFlow {
    0% { background-position: 0% 0%; }
    25% { background-position: 50% 100%; }
    50% { background-position: 100% 50%; }
    75% { background-position: 50% 0%; }
    100% { background-position: 0% 100%; }
}
#volumeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4b896, #b8a0c8);
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 20px rgba(184,160,200,0.15);
}
@keyframes floatGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 50% 50%; }
    100% { background-position: 100% 50%; }
}
#sakura-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    display: none;
}
#reed-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}
/* 大雪 - 一种所谓拒绝的善意 */
#snow-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}
/* 微光粒子 - 悬日的云彩黯淡了 */
#glow-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}
/* ===== 暗涌错位专属效果 ===== */

/* 暗涌光影 - 明暗交替层 */
#ripple-light {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    display: none;
    background: radial-gradient(ellipse at center, rgba(180, 160, 200, 0.03), transparent 60%);
    animation: rippleBreath 6s ease-in-out infinite alternate;
}

@keyframes rippleBreath {
    0% { opacity: 0.2; transform: scale(0.95); }
    100% { opacity: 0.8; transform: scale(1.05); }
}

/* 夜色流动 - 底层缓慢流动 */
#night-flow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    display: none;
    background: linear-gradient(180deg, 
        rgba(20, 25, 40, 0) 0%,
        rgba(20, 25, 40, 0.03) 30%,
        rgba(20, 25, 40, 0.06) 50%,
        rgba(20, 25, 40, 0.03) 70%,
        rgba(20, 25, 40, 0) 100%
    );
    animation: nightFlowMove 12s ease-in-out infinite alternate;
}

@keyframes nightFlowMove {
    0% { transform: translateX(-3%) scale(1); opacity: 0.4; }
    100% { transform: translateX(3%) scale(1.03); opacity: 0.9; }
}

/* 冷色光晕 - 底部 */
#cold-glow-ripple {
    position: fixed;
    bottom: -50px;
    left: 0;
    width: 100%;
    height: 200px;
    pointer-events: none;
    z-index: 0;
    display: none;
    background: radial-gradient(ellipse at bottom center, rgba(100, 120, 180, 0.12), transparent 70%);
    animation: rippleGlowPulse 5s ease-in-out infinite alternate;
}

@keyframes rippleGlowPulse {
    0% { opacity: 0.3; transform: scale(0.9); }
    100% { opacity: 0.7; transform: scale(1.1); }
}

/* 金色碎片 - 粒子层 */
#gold-fragments-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    display: none;
}
/* 雨丝效果 */
#rain-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
    display: none;
}

/* 雾气层 */
#fog-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    display: none;
    background: linear-gradient(180deg, 
        rgba(150, 180, 200, 0) 0%,
        rgba(150, 180, 200, 0.05) 30%,
        rgba(150, 180, 200, 0.08) 50%,
        rgba(150, 180, 200, 0.05) 70%,
        rgba(150, 180, 200, 0) 100%
    );
    animation: fogMove 15s ease-in-out infinite alternate;
}

@keyframes fogMove {
    0% { transform: translateX(-5%) scale(1); opacity: 0.6; }
    100% { transform: translateX(5%) scale(1.05); opacity: 1; }
}

/* 冷色光晕 - 底部 */
#cold-glow {
    position: fixed;
    bottom: -50px;
    left: 0;
    width: 100%;
    height: 200px;
    pointer-events: none;
    z-index: 0;
    display: none;
    background: radial-gradient(ellipse at bottom center, rgba(100, 140, 180, 0.15), transparent 70%);
    animation: glowPulse 4s ease-in-out infinite alternate;
}

@keyframes glowPulse {
    0% { opacity: 0.4; transform: scale(0.95); }
    100% { opacity: 0.8; transform: scale(1.05); }
}
/* 星星粒子层 - 仅限特定歌曲 */
#stars-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
    display: none;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e8e8e8, #6a8a9a, #e8e8e8, #8a7a9a, #4a4a5a, #e8e8e8);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: bodyGradientFlow 12s ease-in-out infinite alternate;
        }

        @keyframes bodyGradientFlow {
            0% { background-position: 0% 50%; }
            20% { background-position: 20% 50%; }
            40% { background-position: 40% 50%; }
            60% { background-position: 60% 50%; }
            80% { background-position: 80% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            25% { background-position: 25% 50%; }
            50% { background-position: 50% 50%; }
            75% { background-position: 75% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes armDrop {
            0% { transform: rotate(30deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes armLift {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(30deg); }
        }

        .back-btn {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 16px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .back-btn:hover {
            color: #fff;
        }

        .cd-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 10px auto 16px;
        }

        .cd-disc {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: conic-gradient(#4a4a5a, #6a8a9a, #6a5a8a, #6a8a9a, #1a3a2a, #4a4a5a);
            animation: spin 4s linear infinite;
            box-shadow: 0 0 40px rgba(106, 138, 154, 0.3);
            position: relative;
        }

        .cd-disc.paused {
            animation-play-state: paused;
        }

        .cd-disc::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #1a1a2e;
            border: 3px solid #6a8a9a;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .tonearm {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 130px;
            transform-origin: top right;
        }

        .tonearm.playing {
            animation: armDrop 0.6s ease-out forwards;
        }

        .tonearm.paused {
            animation: armLift 0.6s ease-out forwards;
        }

        .tonearm-base {
            position: absolute;
            top: 0;
            right: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(#c0c0c0, #888);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .tonearm-arm {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 70px;
            height: 2px;
            background: linear-gradient(90deg, #888, #ccc);
            transform-origin: top right;
            transform: rotate(-20deg);
        }

        .tonearm-head {
            position: absolute;
            bottom: 4px;
            right: -4px;
            width: 16px;
            height: 24px;
            background: linear-gradient(180deg, #aaa, #666);
            border-radius: 2px 2px 4px 4px;
        }

        .tonearm-needle {
            position: absolute;
            bottom: -10px;
            right: 2px;
            width: 2px;
            height: 18px;
            background: #ddd;
            transform: rotate(10deg);
            border-radius: 1px;
        }

        .tonearm.playing .tonearm-needle {
            height: 50px;
        }

        .song-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-top: 6px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .song-artist {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-top: 2px;
        }

        .progress-bar {
            margin-top: 16px;
        }

        .progress-bar input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            outline: none;
        }

        .progress-bar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }

        .controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
            padding: 4px;
        }

        .controls button:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .controls .play-main {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.8rem;
            opacity: 1;
        }

        .controls .play-main:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== 歌词模式：三列 ===== */
.lyrics-mode {
    column-count: 3;
    column-gap: 14px;
    font-size: 0.75rem;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.85);
    padding: 0 8px;
    word-wrap: break-word;
    max-width: 100%;
}

        /* ===== 治愈说模式：一列 ===== */
        .healing-mode {
            column-count: 1;
            font-size: 1rem;
            line-height: 2.2;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            padding: 0 10px;
            word-wrap: break-word;
            max-width: 100%;
        }

#lyricsDisplay {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
}

        .healing-line {
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 1.2s ease, transform 1.2s ease;
            padding: 4px 0;
        }

        .lrc-line {
            transition: all 0.3s ease;
            padding: 2px 0;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                align-items: center;
            }
            .main-layout {
                flex-direction: column !important;
                align-items: center !important;
            }
            .player-container {
                flex: 0 0 auto !important;
                max-width: 100% !important;
                min-height: 560px;
                width: 100% !important;
            }
            .healing-side {
                min-height: 560px !important;
                width: 100% !important;
                overflow: hidden;
                word-wrap: break-word;
            }
        }
/* 已唱过的歌词：光影缥缈效果 */
.lrc-line.past {
    opacity: 0.2;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.15);
    filter: blur(0.5px);
    transform: translateY(-2px);
    transition: all 0.6s ease;
}
@keyframes pastLyricGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 50% 50%; }
    100% { background-position: 100% 50%; }
}
@keyframes watermarkPulse {
    0% { opacity: 0.04; filter: grayscale(0.8) blur(3px) contrast(0.8); }
    100% { opacity: 0.12; filter: grayscale(0.6) blur(1px) contrast(1); }
}
@keyframes beamFloat {
    0% {
        transform: translateX(-30%) scale(0.8);
        opacity: 0;
    }
    30% {
        opacity: 1;
    }
    70% {
        opacity: 1;
    }
    100% {
        transform: translateX(30%) scale(1.2);
        opacity: 0;
    }
}

/* JAY·HEBE 淡入动画 */
@keyframes jayhebeFadeIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* JAY·HEBE 颜色渐变流动 */
@keyframes jayhebeFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}
    </style>
</head>
<body>
<canvas id="sakura-canvas"></canvas>
<canvas id="reed-canvas"></canvas>
<canvas id="snow-canvas"></canvas>
<canvas id="glow-canvas"></canvas>
<div id="ripple-light"></div>
<div id="night-flow"></div>
<div id="cold-glow-ripple"></div>
<canvas id="gold-fragments-canvas"></canvas>
<canvas id="rain-canvas"></canvas>
<div id="fog-layer"></div>
<div id="cold-glow"></div>
<canvas id="stars-canvas"></canvas>
    <div style="display: flex; gap: 40px; max-width: 1100px; width: 100%; margin: 0 auto; align-items: stretch; padding: 20px;">

        <!-- ===== 左边：播放器 ===== -->
<div class="player-container" style="flex: 0 0 400px; background: linear-gradient(135deg, #f5f5f0, #4a4a5a, #8a7a9a, #6a8a9a, #4a4a5a); background-size: 300% 300%; border-radius: 32px; padding: 32px 24px 28px; animation: bgFlow 6s ease-in-out infinite alternate; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;">

    <!-- 返回按钮（顶部） -->
<button class="back-btn" id="backBtn" onclick="goBackToArtist()">← 返回</button>

    <!-- 中间放 CD（如果有） -->
    <div class="cd-wrapper" style="flex-shrink: 0;">
        <div class="cd-disc" id="cdDisc"></div>
        <div class="tonearm playing" id="tonearm">
            <div class="tonearm-base"></div>
            <div class="tonearm-arm"></div>
            <div class="tonearm-head">
                <div class="tonearm-needle"></div>
            </div>
        </div>
    </div>

    <!-- 底部：歌名 + 控制区 -->
    <div style="flex-shrink: 0; width: 100%;">
        <div class="song-title" id="songTitle">加载中...</div>
        <div class="song-artist" id="songArtist">-</div>

        <div class="progress-bar">
            <input type="range" id="progressSlider" value="0" step="0.01">
            <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="prevSong()">⏮</button>
            <button class="play-main" id="playMainBtn" onclick="togglePlay()" style="position:relative; overflow:hidden; border-radius:50%; width:56px; height:56px; background: conic-gradient(#d4b896, #b8a0c8, #6a5a8a, #d4b896); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #fff; box-shadow: 0 0 30px rgba(212,184,150,0.2);">
                <span id="playIcon" style="position:relative; z-index:1;">▶</span>
            </button>
            <button onclick="nextSong()">⏭</button>
        </div>
    </div>
</div>

<button id="playModeBtn" onclick="togglePlayMode()" style="

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('id');

        let currentSong = null;
        let allSongs = [];
        let audio = new Audio();
        let healingInterval = null;
        let usedHealingIndexes = [];
        let lrcData = [];

        function getRandomHealing() {
            if (usedHealingIndexes.length >= healingWords.length) {
                usedHealingIndexes = [];
            }
            let randomIndex;
            let attempts = 0;
            do {
                randomIndex = Math.floor(Math.random() * healingWords.length);
                attempts++;
            } while (usedHealingIndexes.includes(randomIndex) && attempts < 50);
            usedHealingIndexes.push(randomIndex);
            return healingWords[randomIndex];
        }

        function showHealingText() {
            const container = document.getElementById('healingDisplay');
            if (!container) return;
            const text = getRandomHealing();
            const div = document.createElement('div');
            div.className = 'healing-line';
            div.textContent = text;
            container.appendChild(div);
            requestAnimationFrame(() => {
                div.style.opacity = '1';
                div.style.transform = 'translateY(0)';
            });
            const lines = container.querySelectorAll('.healing-line');
            if (lines.length > 6) {
                const oldest = lines[0];
                oldest.style.opacity = '0';
                oldest.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    oldest.remove();
                }, 1500);
            }
        }

        function startHealingWords() {
            if (healingInterval) {
                clearInterval(healingInterval);
                healingInterval = null;
            }
            const container = document.getElementById('healingDisplay');
            if (!container) return;
            container.innerHTML = '';
            showHealingText();
            healingInterval = setInterval(showHealingText, 4000);
        }

        function setPlayingState() {
            const cd = document.getElementById('cdDisc');
            const arm = document.getElementById('tonearm');
            const btn = document.getElementById('playMainBtn');
            if (!audio.paused) {
                btn.textContent = '⏸';
                cd.classList.remove('paused');
                arm.classList.remove('paused');
                arm.classList.add('playing');
            } else {
                btn.textContent = '▶';
                cd.classList.add('paused');
                arm.classList.remove('playing');
                arm.classList.add('paused');
            }
        }

    document.getElementById('songArtist').textContent = isZhouTian ? '周田' : (song.musician_name || '歌手');

    const isInstrumental = !song.lyrics || song.lyrics.trim() === '' || song.lyrics.includes('纯音乐');

    if (isInstrumental) {
        lyricsEl.style.display = 'none';
        healingEl.style.display = 'block';
        healingEl.className = 'healing-mode';
        audio.src = song.audio_url || '';
        audio.load();
        audio.play().then(() => {
            setPlayingState();
            startHealingWords();
        }).catch(() => {
            setPlayingState();
            startHealingWords();
        });
    } else {
        lyricsEl.style.display = 'block';
        healingEl.style.display = 'none';
        lyricsEl.className = 'lyrics-mode';
        const hasLRC = /\[\d{2}:\d{2}/.test(song.lyrics);
        if (hasLRC) {
            const lines = song.lyrics.split('\n');
            let parsed = [];
            lines.forEach(line => {
                const match = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseInt(match[2]);
                    const ms = parseInt(match[3].padEnd(3, '0'));
                    const time = minutes * 60 + seconds + ms / 1000;
                    const text = line.replace(/\[\d{2}:\d{2}\.\d{2,3}\]/, '').trim();
                    if (text) {
                        parsed.push({ time, text });
                    }
                }
            });
            lrcData = parsed;
            lyricsEl.innerHTML = lrcData.map((item, index) =>
                `<div class="lrc-line" data-time="${item.time}" data-index="${index}">${item.text}</div>`
            ).join('');
        } else {
            lyricsEl.innerHTML = song.lyrics.replace(/\n/g, '<br>');
        }
        audio.src = song.audio_url || '';
        audio.load();
        audio.play().then(() => {
            setPlayingState();
        }).catch(() => {
            setPlayingState();
        });
    }
}

let starsAnimationId = null;
let starParticles = [];

function initStars() {
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 生成520颗星星
    starParticles = [];
    for (let i = 0; i < 520; i++) {
        starParticles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.3 + 0.1,
            opacity: Math.random() * 0.5 + 0.2,
            direction: Math.random() * Math.PI * 2
        });
    }
    drawStars(ctx, canvas);
}

function drawStars(ctx, canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    starParticles.forEach(star => {
        // 移动
        star.x += Math.cos(star.direction) * star.speed;
        star.y += Math.sin(star.direction) * star.speed;
        // 边界回弹
        if (star.x < 0 || star.x > canvas.width) star.direction = Math.PI - star.direction;
        if (star.y < 0 || star.y > canvas.height) star.direction = -star.direction;

        // 绘制
        const opacity = star.opacity * (0.7 + 0.3 * Math.sin(Date.now() / 2000 + star.x));
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 180, ${opacity})`;
        ctx.fill();

        // 光晕
        if (star.radius > 1.5) {
            const gradient = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.radius * 4);
            gradient.addColorStop(0, `rgba(255, 215, 180, ${opacity * 0.3})`);
            gradient.addColorStop(1, `rgba(255, 215, 180, 0)`);
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius * 4, 0, Math.PI * 2);
            ctx.fill();
        }
    });
    starsAnimationId = requestAnimationFrame(() => drawStars(ctx, canvas));
}

function startStars() {
    const canvas = document.getElementById('stars-canvas');
    canvas.style.display = 'block';
    initStars();
}

function stopStars() {
    const canvas = document.getElementById('stars-canvas');
    canvas.style.display = 'none';
    if (starsAnimationId) {
        cancelAnimationFrame(starsAnimationId);
        starsAnimationId = null;
    }
    starParticles = [];
}

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    for (let i = 0; i < 60; i++) {
        goldFragments.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 4 + 1,
            speedX: (Math.random() - 0.5) * 0.3,
            speedY: (Math.random() - 0.5) * 0.3,
            opacity: Math.random() * 0.3 + 0.1,
            rotation: Math.random() * Math.PI * 2,
            rotationSpeed: (Math.random() - 0.5) * 0.02
        });
    }
    drawFragments(ctx, canvas);
}

function drawFragments(ctx, canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    goldFragments.forEach(f => {
        f.x += f.speedX;
        f.y += f.speedY;
        f.rotation += f.rotationSpeed;
        if (f.x < 0 || f.x > canvas.width) f.speedX *= -1;
        if (f.y < 0 || f.y > canvas.height) f.speedY *= -1;

        const opacity = f.opacity * (0.6 + 0.4 * Math.sin(Date.now() / 3000 + f.x));

        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rotation);
        ctx.fillStyle = `rgba(212, 184, 150, ${opacity})`;
        ctx.shadowColor = `rgba(212, 184, 150, ${opacity * 0.3})`;
        ctx.shadowBlur = 10;
        // 小菱形碎片
        ctx.beginPath();
        ctx.moveTo(0, -f.size);
        ctx.lineTo(f.size, 0);
        ctx.lineTo(0, f.size);
        ctx.lineTo(-f.size, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });

    fragmentsAnimationId = requestAnimationFrame(() => drawFragments(ctx, canvas));
}

function startSnow() {

            rotSpeed: (Math.random() - 0.5) * 0.02
        });
    }
    drawSnow(ctx, canvas);

function drawSnowflake(ctx, x, y, size, opacity, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.globalAlpha = opacity;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = 'rgba(255, 255, 255, 0.05)';
    ctx.shadowBlur = 4;

    // 六条主臂
    for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * size, Math.sin(angle) * size);
        ctx.stroke();

        // 小分支
        const branchLength = size * 0.4;
        const branchPos = size * 0.6;
        for (let j = -1; j <= 1; j += 2) {
            const branchAngle = angle + j * 0.6;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * branchPos, Math.sin(angle) * branchPos);
            ctx.lineTo(
                Math.cos(angle) * branchPos + Math.cos(branchAngle) * branchLength,
                Math.sin(angle) * branchPos + Math.sin(branchAngle) * branchLength
            );
            ctx.stroke();
        }
    }
    ctx.restore();
}

function drawSnow(ctx, canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    snowParticles.forEach(p => {
        p.y += p.speed;
        p.x += p.wind + Math.sin(p.y / 100) * 0.3;
        p.rotation += p.rotSpeed;
        if (p.y > canvas.height) {
            p.y = -20;
            p.x = Math.random() * canvas.width;
        }
        if (p.x < -20) p.x = canvas.width + 20;
        if (p.x > canvas.width + 20) p.x = -20;

        drawSnowflake(ctx, p.x, p.y, p.size, p.opacity, p.rotation);
    });
    snowAnimationId = requestAnimationFrame(() => drawSnow(ctx, canvas));
}

function stopSnow() {
    if (snowAnimationId) {
        cancelAnimationFrame(snowAnimationId);
        snowAnimationId = null;
    }
    snowParticles = [];
    const canvas = document.getElementById('snow-canvas');
    if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
}

function drawReed(ctx, canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const time = Date.now() / 1000;
    reedParticles.forEach(r => {
        const sway = Math.sin(time * r.speed + r.phase) * 20;
        ctx.beginPath();
        const offsetX = canvas.width * 0.7; // 右移
const offsetY = canvas.height * 0.1; // 上移
ctx.moveTo(r.x + offsetX, r.y + offsetY);

        ctx.strokeStyle = `rgba(180, 170, 150, ${r.opacity})`;
        ctx.lineWidth = r.width;
        ctx.stroke();

        // 芦穗
        ctx.beginPath();
        ctx.ellipse(r.x + sway * 1.2, r.y - r.height, r.width * 3, r.width * 2, sway * 0.02, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180, 170, 150, ${r.opacity * 0.5})`;
        ctx.fill();
    });
    reedAnimationId = requestAnimationFrame(() => drawReed(ctx, canvas));
}

function stopReed() {
    if (reedAnimationId) {
        cancelAnimationFrame(reedAnimationId);
        reedAnimationId = null;
    }
    reedParticles = [];
    const canvas = document.getElementById('reed-canvas');
    if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
}

// ===== 樱花飘落（周田专属） =====
let sakuraParticles = [];
let sakuraAnimationId = null;

function startSakura() {
    const canvas = document.getElementById('sakura-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.display = 'block';

    sakuraParticles = [];
    const colors = ['#f5d6d6', '#e8d6f5', '#f0c4c4', '#dcc4f0', '#fae0e0', '#f0e0fa'];
    for (let i = 0; i < 52; i++) {
        sakuraParticles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 11 + 7,
            speed: Math.random() * 0.3 + 0.15,
            wind: (Math.random() - 0.5) * 0.2,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.02,
            color: colors[Math.floor(Math.random() * colors.length)],
            opacity: Math.random() * 0.25 + 0.15,
            sway: Math.random() * 1.5 + 0.5,
            phase: Math.random() * Math.PI * 2
        });
    }
    drawSakura(ctx, canvas);
}

function drawSakura(ctx, canvas) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const time = Date.now() / 1000;
    
    sakuraParticles.forEach(p => {
        p.y += p.speed;
        p.x += p.wind + Math.sin(time * 0.5 + p.phase) * p.sway * 0.2;
        p.rotation += p.rotSpeed;
        
        if (p.y > canvas.height) {
            p.y = -15;
            p.x = Math.random() * canvas.width;
        }
        if (p.x < -15) p.x = canvas.width + 15;
        if (p.x > canvas.width + 15) p.x = -15;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = p.opacity;
        ctx.shadowColor = `rgba(200, 180, 220, 0.03)`;
        ctx.shadowBlur = 4;

        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
            const petalSize = p.size * (0.7 + 0.3 * Math.sin(time + p.phase + i));
            ctx.beginPath();
            ctx.ellipse(
                Math.cos(angle) * p.size * 0.5,
                Math.sin(angle) * p.size * 0.5,
                petalSize * 0.7,
                petalSize * 0.4,
                angle,
                0,
                Math.PI * 2
            );
            ctx.fillStyle = p.color;
            ctx.fill();
        }
        ctx.restore();
    });
    sakuraAnimationId = requestAnimationFrame(() => drawSakura(ctx, canvas));
}

function stopSakura() {
    if (sakuraAnimationId) {
        cancelAnimationFrame(sakuraAnimationId);
        sakuraAnimationId = null;
    }
    sakuraParticles = [];
    const canvas = document.getElementById('sakura-canvas');
    if (canvas) {
        canvas.style.display = 'none';
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
}

let currentVolume = 80; // 0-100

const volumePopup = document.getElementById('volumePopup');
const volumeTrack = document.getElementById('volumeTrack');
const volumeFill = document.getElementById('volumeFill');
const volumeThumb = document.getElementById('volumeThumb');
const volumeLabel = document.getElementById('volumeLabel');

// 更新音量显示
function updateVolume(value) {
    value = Math.max(0, Math.min(100, value));
    value = Math.round(value); // ← 加上这一行，取整
    currentVolume = value;
    const percent = value + '%';
    
    if (volumeFill) volumeFill.style.height = percent;
    if (volumeThumb) volumeThumb.style.bottom = percent;
    if (volumeLabel) volumeLabel.textContent = value + '%';
    
    localStorage.setItem('playerVolume', value);
    
    if (audio) {
        audio.volume = value / 100;
    }
}

// 从鼠标/触摸事件获取音量值
function getVolumeFromEvent(e) {
    const rect = volumeTrack.getBoundingClientRect();
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    if (!clientY) return currentVolume;
    
    let relativeY = (clientY - rect.top) / rect.height; // 0~1
    relativeY = Math.max(0, Math.min(1, relativeY));
    return (1 - relativeY) * 100; // 顶部=100, 底部=0
}

let isDragging = false;

// 开始拖拽
function startDrag(e) {
    e.preventDefault();
    isDragging = true;
    const value = getVolumeFromEvent(e);
    updateVolume(value);
    
    function onMove(moveEvent) {
        moveEvent.preventDefault();
        const newValue = getVolumeFromEvent(moveEvent);
        updateVolume(newValue);
    }
    
    function onEnd() {
        isDragging = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
    }
    
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
}

// 点击轨道直接跳转（只有不是拖拽时才触发）
function handleTrackClick(e) {
    if (isDragging) return; // 拖拽时不触发点击
    const value = getVolumeFromEvent(e);
    updateVolume(value);
}

// 绑定事件
volumeTrack.addEventListener('mousedown', startDrag);
volumeTrack.addEventListener('touchstart', startDrag, { passive: false });
volumeTrack.addEventListener('click', handleTrackClick);

let commentLikedStatus = {};

// 打开评论弹窗

// 加载评论
async function loadComments(workId) {
    try {
        const resp = await fetch(
            `${SUPABASE_URL}/rest/v1/comments?work_id=eq.${workId}&order=likes.desc,created_at.desc`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        const comments = await resp.json();

        // 获取点赞状态
        const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
        commentLikedStatus = {};
        if (user.user_id && comments && comments.length > 0) {
            try {
                const commentIds = comments.map(c => c.id).join(',');
                const likeResp = await fetch(
                    `${SUPABASE_URL}/rest/v1/comment_likes?user_id=eq.${user.user_id}&comment_id=in.(${commentIds})`,
                    { headers: { 'apikey': SUPABASE_KEY } }
                );
                if (likeResp.ok) {
                    const likes = await likeResp.json();
                    likes.forEach(l => { commentLikedStatus[l.comment_id] = true; });
                }
            } catch (e) {
                console.warn('获取点赞状态失败:', e);
            }
        }

        renderComments(comments);
    } catch (e) {
        console.error('加载评论失败:', e);
    }
}

// 渲染评论
function renderComments(comments) {
    const list = document.getElementById('commentList');
    const countEl = document.getElementById('commentCount');
    countEl.textContent = comments.length;

    if (!comments || comments.length === 0) {
        list.innerHTML = `<div style="text-align: center; color: rgba(255,255,255,0.25); padding: 50px 0; font-size: 0.85rem;"> 还没有评论，说点什么吧～</div>`;
        return;
    }

    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');

    list.innerHTML = comments.map(c => {
        const isMine = c.user_id === user.user_id;
        const time = formatTimeAgo(c.created_at);
        const isLiked = commentLikedStatus[c.id] || false;
        
        return `
            <div style="padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                            <span style="color: #b8a0c8; font-size: 0.75rem; font-weight: 500;">${c.user_name || '匿名用户'}</span>
                            <span style="color: rgba(255,255,255,0.2); font-size: 0.6rem;">${time}</span>
                        </div>
                        <div style="color: rgba(255,255,255,0.85); font-size: 0.85rem; line-height: 1.5; word-break: break-word;">${c.content}</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 10px;">
                        ${isMine ? `
                            <button onclick="deleteComment(${c.id}, '${c.user_id}')" style="
                                background: none;
                                border: none;
                                color: rgba(255,255,255,0.15);
                                cursor: pointer;
                                font-size: 0.65rem;
                                padding: 2px 6px;
                                border-radius: 4px;
                            " onmouseover="this.style.color='rgba(255,100,100,0.5)'" onmouseout="this.style.color='rgba(255,255,255,0.15)'">删除</button>
                        ` : ''}
                        <button onclick="toggleCommentLike(${c.id})" style="
                            background: none;
                            border: none;
                            color: ${isLiked ? '#e88a8a' : 'rgba(255,255,255,0.25)'};
                            cursor: pointer;
                            font-size: 0.75rem;
                            padding: 2px 4px;
                            border-radius: 4px;
                            display: flex;
                            align-items: center;
                            gap: 2px;
                            transition: 0.2s;
                        " onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                            ${isLiked ? '❤️' : '🤍'} <span style="font-size: 0.6rem;">${c.likes || 0}</span>
                        </button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

// 删除评论
async function deleteComment(commentId, userId) {
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');

        alert('只能删自己的');
        return;
    }

            headers: { 'apikey': SUPABASE_KEY }

        await loadComments(currentSong.id);

        console.error('删除失败:', e);
        alert('删除失败');

// 切换评论点赞（最简化版）
async function toggleCommentLike(commentId) {
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.user_id) {
        alert('请先登录再点赞');
        return;
    }

    try {
        // 1. 获取当前点赞数
        const resp = await fetch(
            `${SUPABASE_URL}/rest/v1/comments?id=eq.${commentId}&select=likes`,
            { headers: { 'apikey': SUPABASE_KEY } }
        );
        const data = await resp.json();
        const currentLikes = data[0]?.likes || 0;
        const isLiked = commentLikedStatus[commentId] || false;
        const newLikes = isLiked ? Math.max(0, currentLikes - 1) : currentLikes + 1;

        // 2. 更新 comments 表的 likes
        const updateResp = await fetch(
            `${SUPABASE_URL}/rest/v1/comments?id=eq.${commentId}`,
            {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ likes: newLikes })
            }
        );

        if (!updateResp.ok) {
            console.error('更新 likes 失败:', await updateResp.text());
            alert('点赞失败，请重试');
            return;
        }

        // 3. 更新 comment_likes 表
        if (isLiked) {
            await fetch(
                `${SUPABASE_URL}/rest/v1/comment_likes?comment_id=eq.${commentId}&user_id=eq.${user.user_id}`,
                { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY } }
            );
        } else {
            await fetch(
                `${SUPABASE_URL}/rest/v1/comment_likes`,
                {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comment_id: commentId, user_id: user.user_id })
                }
            ).catch(() => {});
        }

        // 4. 更新本地状态
        commentLikedStatus[commentId] = !isLiked;

        // 5. 刷新评论列表
        await loadComments(currentSong.id);

    } catch (e) {
        console.error('点赞失败:', e);
        alert('点赞失败，请重试');
    }
}

// 时间格式化
function formatTimeAgo(timestamp) {
    if (!timestamp) return '刚刚';
    const now = Date.now();
    const time = new Date(timestamp).getTime();
    const diff = Math.floor((now - time) / 1000);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
    return new Date(timestamp).toLocaleDateString();
}
// ============================================================
// ===== 流星雨效果 =====
// ============================================================

let meteorAnimationId = null;
let meteors = [];
let meteorCtx = null;
let meteorCanvas = null;

function initMeteorCanvas() {
    meteorCanvas = document.getElementById('meteorCanvas');
    if (!meteorCanvas) return;
    meteorCtx = meteorCanvas.getContext('2d');
    
    // 设置 canvas 尺寸
    const rect = meteorCanvas.parentElement.getBoundingClientRect();
    meteorCanvas.width = rect.width;
    meteorCanvas.height = rect.height;
    
    // 生成流星
    meteors = [];
    for (let i = 0; i < 19; i++) {
        meteors.push(createMeteor());
    }
    
    drawMeteors();
}

function createMeteor() {
    const canvas = meteorCanvas;
    return {
        x: Math.random() * canvas.width * 0.8,
        y: Math.random() * canvas.height * 0.3,
        length: Math.random() * 80 + 40,
        speed: Math.random() * 4 + 3,
        angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
        opacity: Math.random() * 0.6 + 0.3,
        life: Math.random() * 120 + 80,
        maxLife: 200,
        delay: Math.random() * 200
    };
}

function drawMeteors() {
    if (!meteorCtx || !meteorCanvas) return;
    const ctx = meteorCtx;
    const canvas = meteorCanvas;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    meteors.forEach(meteor => {
        // 延迟
        if (meteor.delay > 0) {
            meteor.delay--;
            return;
        }
        
        // 更新位置
        meteor.x += Math.cos(meteor.angle) * meteor.speed;
        meteor.y += Math.sin(meteor.angle) * meteor.speed;
        meteor.life--;
        
        // 透明度渐变（尾部渐隐）
        const lifeRatio = meteor.life / meteor.maxLife;
        const alpha = meteor.opacity * Math.min(1, lifeRatio * 2);
        
        // 画流星尾巴
        const tailLength = meteor.length * lifeRatio;
        const gradient = ctx.createLinearGradient(
            meteor.x, meteor.y,
            meteor.x - Math.cos(meteor.angle) * tailLength,
            meteor.y - Math.sin(meteor.angle) * tailLength
        );
        gradient.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
        gradient.addColorStop(0.3, `rgba(255, 240, 220, ${alpha * 0.6})`);
        gradient.addColorStop(1, `rgba(255, 220, 200, 0)`);
        
        ctx.beginPath();
        ctx.moveTo(meteor.x, meteor.y);
        ctx.lineTo(
            meteor.x - Math.cos(meteor.angle) * tailLength,
            meteor.y - Math.sin(meteor.angle) * tailLength
        );
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // 流星头部光晕
        const glow = ctx.createRadialGradient(meteor.x, meteor.y, 0, meteor.x, meteor.y, 6);
        glow.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.8})`);
        glow.addColorStop(1, `rgba(255, 255, 255, 0)`);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(meteor.x, meteor.y, 6, 0, Math.PI * 2);
        ctx.fill();
        
        // 重置
        if (meteor.life <= 0) {
            Object.assign(meteor, createMeteor());
            meteor.x = Math.random() * canvas.width * 0.8;
            meteor.y = Math.random() * canvas.height * 0.2;
            meteor.delay = Math.random() * 100 + 50;
        }
    });
    
    meteorAnimationId = requestAnimationFrame(drawMeteors);
}

function startMeteors() {
    const canvas = document.getElementById('meteorCanvas');
    if (canvas) {
        // 等弹窗显示后再初始化
        setTimeout(() => {
            initMeteorCanvas();
            // 窗口变化时重置尺寸
            window.addEventListener('resize', () => {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            });
        }, 300);
    }
}

function stopMeteors() {
    if (meteorAnimationId) {
        cancelAnimationFrame(meteorAnimationId);
        meteorAnimationId = null;
    }
}
