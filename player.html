<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>正在播放 · 芦苇音乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e8e8e8, #6a8a9a, #e8e8e8, #8a7a9a, #4a4a5a, #e8e8e8);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: bodyGradientFlow 12s ease-in-out infinite alternate;
        }

        @keyframes bodyGradientFlow {
            0% { background-position: 0% 50%; }
            20% { background-position: 20% 50%; }
            40% { background-position: 40% 50%; }
            60% { background-position: 60% 50%; }
            80% { background-position: 80% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            25% { background-position: 25% 50%; }
            50% { background-position: 50% 50%; }
            75% { background-position: 75% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes armDrop {
            0% { transform: rotate(30deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes armLift {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(30deg); }
        }

        .back-btn {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 16px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .back-btn:hover {
            color: #fff;
        }

        .cd-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 10px auto 16px;
        }

        .cd-disc {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: conic-gradient(#4a4a5a, #6a8a9a, #6a5a8a, #6a8a9a, #1a3a2a, #4a4a5a);
            animation: spin 4s linear infinite;
            box-shadow: 0 0 40px rgba(106, 138, 154, 0.3);
            position: relative;
        }

        .cd-disc.paused {
            animation-play-state: paused;
        }

        .cd-disc::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #1a1a2e;
            border: 3px solid #6a8a9a;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .tonearm {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 130px;
            transform-origin: top right;
        }

        .tonearm.playing {
            animation: armDrop 0.6s ease-out forwards;
        }

        .tonearm.paused {
            animation: armLift 0.6s ease-out forwards;
        }

        .tonearm-base {
            position: absolute;
            top: 0;
            right: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(#c0c0c0, #888);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .tonearm-arm {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 70px;
            height: 2px;
            background: linear-gradient(90deg, #888, #ccc);
            transform-origin: top right;
            transform: rotate(-20deg);
        }

        .tonearm-head {
            position: absolute;
            bottom: 4px;
            right: -4px;
            width: 16px;
            height: 24px;
            background: linear-gradient(180deg, #aaa, #666);
            border-radius: 2px 2px 4px 4px;
        }

        .tonearm-needle {
            position: absolute;
            bottom: -10px;
            right: 2px;
            width: 2px;
            height: 18px;
            background: #ddd;
            transform: rotate(10deg);
            border-radius: 1px;
        }

        .tonearm.playing .tonearm-needle {
            height: 50px;
        }

        .song-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-top: 6px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .song-artist {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-top: 2px;
        }

        .progress-bar {
            margin-top: 16px;
        }

        .progress-bar input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            outline: none;
        }

        .progress-bar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }

        .controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
            padding: 4px;
        }

        .controls button:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .controls .play-main {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.8rem;
            opacity: 1;
        }

        .controls .play-main:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== 歌词模式：三列 ===== */
.lyrics-mode {
    column-count: 3;
    column-gap: 50px;
    font-size: 0.95rem;
    line-height: 2.4;
    color: rgba(255, 255, 255, 0.85);
    padding: 0 10px;
    word-wrap: break-word;
    max-width: 100%;
    position: relative;
    z-index: 1;
}

        /* ===== 治愈说模式：一列 ===== */
        .healing-mode {
            column-count: 1;
            font-size: 1rem;
            line-height: 2.2;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            padding: 0 10px;
            word-wrap: break-word;
            max-width: 100%;
        }

#lyricsDisplay {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
}

        .healing-line {
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 1.2s ease, transform 1.2s ease;
            padding: 4px 0;
        }

        .lrc-line {
            transition: all 0.3s ease;
            padding: 2px 0;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                align-items: center;
            }
            .main-layout {
                flex-direction: column !important;
                align-items: center !important;
            }
            .player-container {
                flex: 0 0 auto !important;
                max-width: 100% !important;
                min-height: 560px;
                width: 100% !important;
            }
            .healing-side {
                min-height: 560px !important;
                width: 100% !important;
                overflow: hidden;
                word-wrap: break-word;
            }
        }
/* 已唱过的歌词：光影缥缈效果 */
.lrc-line.past {
    opacity: 0.2;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.15);
    filter: blur(0.5px);
    transform: translateY(-2px);
    transition: all 0.6s ease;
}
@keyframes pastLyricGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 50% 50%; }
    100% { background-position: 100% 50%; }
}
@keyframes watermarkPulse {
    0% { opacity: 0.04; filter: grayscale(0.8) blur(3px) contrast(0.8); }
    100% { opacity: 0.12; filter: grayscale(0.6) blur(1px) contrast(1); }
}
@keyframes beamFloat {
    0% {
        transform: translateX(-30%) scale(0.8);
        opacity: 0;
    }
    30% {
        opacity: 1;
    }
    70% {
        opacity: 1;
    }
    100% {
        transform: translateX(30%) scale(1.2);
        opacity: 0;
    }
}

/* JAY·HEBE 淡入动画 */
@keyframes jayhebeFadeIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* JAY·HEBE 颜色渐变流动 */
@keyframes jayhebeFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 50%; }
    50% { background-position: 50% 50%; }
    75% { background-position: 75% 50%; }
    100% { background-position: 100% 50%; }
}
    </style>

                const hasLRC = /\[\d{2}:\d{2}/.test(song.lyrics);
                if (hasLRC) {
                    const lines = song.lyrics.split('\n');
                    let parsed = [];
                    lines.forEach(line => {
                        const match = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/);
                        if (match) {
                            const minutes = parseInt(match[1]);
                            const seconds = parseInt(match[2]);
                            const ms = parseInt(match[3].padEnd(3, '0'));
                            const time = minutes * 60 + seconds + ms / 1000;
                            const text = line.replace(/\[\d{2}:\d{2}\.\d{2,3}\]/, '').trim();
                            if (text) {
                                parsed.push({ time, text });
                            }
                        }
                    });
                    lrcData = parsed;
                    lyricsEl.innerHTML = lrcData.map((item, index) =>
                        `<div class="lrc-line" data-time="${item.time}" data-index="${index}">${item.text}</div>`
                    ).join('');
                } else {
                    lyricsEl.innerHTML = song.lyrics.replace(/\n/g, '<br>');
                }
                audio.src = song.audio_url || '';
                audio.load();
                audio.play().then(() => {
                    setPlayingState();
                }).catch(() => {
                    setPlayingState();
                });
            }
        }

} else {

                // ===== 歌词判断 =====
                const isInstrumental = !currentSong.lyrics || currentSong.lyrics.trim() === '' || currentSong.lyrics.includes('纯音乐');

                if (isInstrumental) {
                    lyricsEl.style.display = 'none';
                    healingEl.style.display = 'block';
                    healingEl.className = 'healing-mode';
                } else {
                    lyricsEl.style.display = 'block';
                    healingEl.style.display = 'none';
                    lyricsEl.className = 'lyrics-mode';

                    const hasLRC = /\[\d{2}:\d{2}/.test(currentSong.lyrics);
                    if (hasLRC) {
                        const lines = currentSong.lyrics.split('\n');
                        let parsed = [];
                        lines.forEach(line => {
                            const match = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\]/);
                            if (match) {
                                const minutes = parseInt(match[1]);
                                const seconds = parseInt(match[2]);
                                const ms = parseInt(match[3].padEnd(3, '0'));
                                const time = minutes * 60 + seconds + ms / 1000;
                                const text = line.replace(/\[\d{2}:\d{2}\.\d{2,3}\]/, '').trim();
                                if (text) {
                                    parsed.push({ time, text });
                                }
                            }
                        });
                        lrcData = parsed;
                        lyricsEl.innerHTML = lrcData.map((item, index) =>
                            `<div class="lrc-line" data-time="${item.time}" data-index="${index}">${item.text}</div>`
                        ).join('');
                    } else {
                        lyricsEl.innerHTML = currentSong.lyrics.replace(/\n/g, '<br>');
                    }
                }

                audio.src = currentSong.audio_url || '';
                audio.load();

                audio.ontimeupdate = updateProgress;
                audio.onloadedmetadata = function() {
                    document.getElementById('totalTime').textContent = formatTime(audio.duration);
                };
                audio.onended = function() {
                    setPlayingState();
                    if (healingInterval) {
                        clearInterval(healingInterval);
                        healingInterval = null;
                    }
                    nextSong();
                };
                audio.onpause = function() {
                    setPlayingState();
                    if (healingInterval) {
                        clearInterval(healingInterval);
                        healingInterval = null;
                    }
                };
                audio.onplay = function() {
                    setPlayingState();
                    if (isInstrumental) {
                        startHealingWords();
                    }
                };

                audio.play().then(() => {
                    setPlayingState();
                    if (isInstrumental) {
                        startHealingWords();
                    }
                }).catch(() => {
                    setPlayingState();
                    if (isInstrumental) {
                        startHealingWords();
                    }
                });

            } catch (e) {
                console.error(e);
                document.getElementById('songTitle').textContent = '加载失败';
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
            setPlayingState();
        }

        function prevSong() {
            if (!allSongs.length || !currentSong) return;
            const currentIndex = allSongs.findIndex(s => s.id === currentSong.id);
            if (currentIndex <= 0) return;
            playSongById(allSongs[currentIndex - 1].id);
        }

        function nextSong() {
            if (!allSongs.length || !currentSong) return;
            const currentIndex = allSongs.findIndex(s => s.id === currentSong.id);
            if (currentIndex >= allSongs.length - 1) return;
            playSongById(allSongs[currentIndex + 1].id);
        }

function updateProgress() {
    if (!audio.duration) return;
    const currentTime = audio.currentTime;
    const percent = (currentTime / audio.duration) * 100;
    document.getElementById('progressSlider').value = percent;
    document.getElementById('currentTime').textContent = formatTime(currentTime);

    const lines = document.querySelectorAll('.lrc-line');
    if (lines.length && lrcData && lrcData.length > 0) {
        let activeIndex = -1;
        for (let i = 0; i < lrcData.length; i++) {
            if (currentTime >= lrcData[i].time) {
                activeIndex = i;
            }
        }

        lines.forEach((line, index) => {
            // 重置所有样式
            line.style.opacity = '';
            line.style.fontSize = '';
            line.style.color = '';
            line.style.fontWeight = '';
            line.style.filter = '';
            line.style.transform = '';
            line.style.background = '';
            line.style.backgroundSize = '';
            line.style.webkitBackgroundClip = '';
            line.style.webkitTextFillColor = '';
            line.style.animation = '';

            if (index < activeIndex) {
                // 已唱过的：浅灰→蓝紫→紫金→白色 渐变流动
                line.style.opacity = '0.5';
                line.style.fontSize = '0.75rem';
                line.style.background = 'linear-gradient(90deg, rgba(200,200,210,0.4), rgba(160,140,190,0.4), rgba(212,184,150,0.4), rgba(255,255,255,0.3))';
                line.style.backgroundSize = '300% 100%';
                line.style.webkitBackgroundClip = 'text';
                line.style.webkitTextFillColor = 'transparent';
                line.style.filter = 'blur(0.3px)';
                line.style.transform = 'translateY(-2px)';
                line.style.animation = 'pastLyricGlow 5s ease-in-out infinite alternate';
            } else if (index === activeIndex) {
                // 当前高亮
                line.style.opacity = '1';
                line.style.fontSize = '1rem';
                line.style.color = '#ffffff';
                line.style.fontWeight = '600';
            } else {
                // 未唱到的：半透明
                line.style.opacity = '0.5';
                line.style.fontSize = '0.85rem';
                line.style.color = 'rgba(255,255,255,0.4)';
            }
        });

        // ===== JAY·HEBE 最后两秒淡入（稳定版） =====
        const timeLeft = audio.duration - currentTime;
        if (timeLeft <= 2 && timeLeft > 0) {
            if (!window._jayhebeShown) {
                window._jayhebeShown = true;
                const cdWrapper = document.querySelector('.cd-wrapper');
                const cdRect = cdWrapper ? cdWrapper.getBoundingClientRect() : { left: 20, top: 20 };
                const cdX = cdRect.left + 30;
                const cdY = cdRect.top + 30;

                const overlay = document.createElement('div');
                overlay.id = 'jayhebe-overlay';
overlay.style.cssText = `
    position: fixed;
    top: ${cdY + 4}px;
    left: ${cdX + 90}px;
    pointer-events: none;
    z-index: 99999;
`;

                const jh = document.createElement('div');
                jh.textContent = 'JAY · HEBE';
                jh.style.cssText = `
                    font-size: 0.8rem;
                    font-weight: 400;
                    font-family: 'Georgia', 'Times New Roman', 'Songti SC', serif;
                    letter-spacing: 4px;
                    opacity: 0;
                    background: linear-gradient(90deg, #f5f5f0, #ffffff, #d4b896, #b8a0c8, #d4b896, #f5f5f0);
                    background-size: 300% 100%;
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    animation: jayhebeFlow 3s ease-in-out infinite alternate, jayhebeFadeIn 2s ease-out forwards;
                    filter: drop-shadow(0 0 20px rgba(212, 184, 150, 0.05));
                    text-align: center;
                `;

                overlay.appendChild(jh);
                document.body.appendChild(overlay);
            }
        } else {
            // 这里不重置 _jayhebeShown，让它保留
        }

        // ===== 滚动 =====
        if (activeIndex >= 0) {
            const activeLine = lines[activeIndex];
            if (activeLine) {
                const container = document.getElementById('lyricsDisplay');
                if (container && container.style.display !== 'none') {
                    const lineTop = activeLine.offsetTop;
                    const containerHeight = container.clientHeight;
                    const lineHeight = activeLine.clientHeight;
                    const targetScroll = lineTop - containerHeight / 2 + lineHeight / 2;
                    const maxScroll = container.scrollHeight - containerHeight;
                    const clampedTarget = Math.max(0, Math.min(targetScroll, maxScroll));
                    if (Math.abs(container.scrollTop - clampedTarget) > 5) {
                        container.scrollTop = clampedTarget;
                    }
                }
            }
        }
    }
}

        document.getElementById('progressSlider').addEventListener('input', function() {
            if (!audio.duration) return;
            const percent = this.value / 100;
            audio.currentTime = percent * audio.duration;
        });

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + s.toString().padStart(2, '0');
        }

        document.addEventListener('DOMContentLoaded', loadSong);
    </script>
