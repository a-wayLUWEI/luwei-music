<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>正在播放 · 芦苇音乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e8e8e8, #6a8a9a, #e8e8e8, #8a7a9a, #4a4a5a, #e8e8e8);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: bodyGradientFlow 12s ease-in-out infinite alternate;
        }

        @keyframes bodyGradientFlow {
            0% { background-position: 0% 50%; }
            20% { background-position: 20% 50%; }
            40% { background-position: 40% 50%; }
            60% { background-position: 60% 50%; }
            80% { background-position: 80% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            25% { background-position: 25% 50%; }
            50% { background-position: 50% 50%; }
            75% { background-position: 75% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes armDrop {
            0% { transform: rotate(30deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes armLift {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(30deg); }
        }

        .back-btn {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 16px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .back-btn:hover {
            color: #fff;
        }

        .cd-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 10px auto 16px;
        }

        .cd-disc {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: conic-gradient(#4a4a5a, #6a8a9a, #6a5a8a, #6a8a9a, #1a3a2a, #4a4a5a);
            animation: spin 4s linear infinite;
            box-shadow: 0 0 40px rgba(106, 138, 154, 0.3);
            position: relative;
        }

        .cd-disc.paused {
            animation-play-state: paused;
        }

        .cd-disc::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #1a1a2e;
            border: 3px solid #6a8a9a;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .tonearm {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 130px;
            transform-origin: top right;
        }

        .tonearm.playing {
            animation: armDrop 0.6s ease-out forwards;
        }

        .tonearm.paused {
            animation: armLift 0.6s ease-out forwards;
        }

        .tonearm-base {
            position: absolute;
            top: 0;
            right: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(#c0c0c0, #888);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .tonearm-arm {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 70px;
            height: 2px;
            background: linear-gradient(90deg, #888, #ccc);
            transform-origin: top right;
            transform: rotate(-20deg);
        }

        .tonearm-head {
            position: absolute;
            bottom: 4px;
            right: -4px;
            width: 16px;
            height: 24px;
            background: linear-gradient(180deg, #aaa, #666);
            border-radius: 2px 2px 4px 4px;
        }

        .tonearm-needle {
            position: absolute;
            bottom: -10px;
            right: 2px;
            width: 2px;
            height: 18px;
            background: #ddd;
            transform: rotate(10deg);
            border-radius: 1px;
        }

        .tonearm.playing .tonearm-needle {
            height: 50px;
        }

        .song-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-top: 6px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .song-artist {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-top: 2px;
        }

        .progress-bar {
            margin-top: 16px;
        }

        .progress-bar input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            outline: none;
        }

        .progress-bar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }

        .controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
            padding: 4px;
        }

        .controls button:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .controls .play-main {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.8rem;
            opacity: 1;
        }

        .controls .play-main:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== 歌词模式：三列 ===== */
        .lyrics-mode {
            column-count: 3;
            column-gap: 20px;
            font-size: 0.9rem;
            line-height: 2.4;
            color: rgba(255, 255, 255, 0.85);
            padding: 0 10px;
            word-wrap: break-word;
            max-width: 100%;
        }

        /* ===== 治愈说模式：一列 ===== */
        .healing-mode {
            column-count: 1;
            font-size: 1rem;
            line-height: 2.2;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            padding: 0 10px;
            word-wrap: break-word;
            max-width: 100%;
        }

        .healing-line {
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 1.2s ease, transform 1.2s ease;
            padding: 4px 0;
        }

        .lrc-line {
            transition: all 0.3s ease;
            padding: 2px 0;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                align-items: center;
            }
            .main-layout {
                flex-direction: column !important;
                align-items: center !important;
            }
            .player-container {
                flex: 0 0 auto !important;
                max-width: 100% !important;
                min-height: 560px;
                width: 100% !important;
            }
            .healing-side {
                min-height: 560px !important;
                width: 100% !important;
                overflow: hidden;
                word-wrap: break-word;
            }
        }
    </style>
</head>

        function getRandomHealing() {
            if (usedHealingIndexes.length >= healingWords.length) {
                usedHealingIndexes = [];
            }
            let randomIndex;
            let attempts = 0;
            do {
                randomIndex = Math.floor(Math.random() * healingWords.length);
                attempts++;
            } while (usedHealingIndexes.includes(randomIndex) && attempts < 50);
            usedHealingIndexes.push(randomIndex);
            return healingWords[randomIndex];
        }

        function showHealingText() {
            const container = document.getElementById('healingDisplay');
            if (!container) return;
            const text = getRandomHealing();
            const div = document.createElement('div');
            div.className = 'healing-line';
            div.textContent = text;
            container.appendChild(div);
            requestAnimationFrame(() => {
                div.style.opacity = '1';
                div.style.transform = 'translateY(0)';
            });
            const lines = container.querySelectorAll('.healing-line');
            if (lines.length > 6) {

                oldest.style.opacity = '0';
                oldest.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    oldest.remove();

            }

        async function loadAllSongs(musicianId) {
            try {

                audio.play().then(() => {
                    setPlayingState();
                }).catch(() => {

                };

                audio.play().then(() => {
                    setPlayingState();
                    if (isInstrumental) {
                        startHealingWords();
                    }
                }).catch(() => {
                    setPlayingState();
                    if (isInstrumental) {
                        startHealingWords();
                    }
                });

            } catch (e) {
                console.error(e);
                document.getElementById('songTitle').textContent = '加载失败';
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
            setPlayingState();
        }

        function prevSong() {
            if (!allSongs.length || !currentSong) return;
            const currentIndex = allSongs.findIndex(s => s.id === currentSong.id);
            if (currentIndex <= 0) return;
            playSongById(allSongs[currentIndex - 1].id);
        }

        function nextSong() {
            if (!allSongs.length || !currentSong) return;
            const currentIndex = allSongs.findIndex(s => s.id === currentSong.id);
            if (currentIndex >= allSongs.length - 1) return;
            playSongById(allSongs[currentIndex + 1].id);
        }

        function updateProgress() {
            if (!audio.duration) return;
            const percent = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progressSlider').value = percent;
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);

            const lines = document.querySelectorAll('.lrc-line');
            if (lines.length && lrcData.length > 0) {
                const currentTime = audio.currentTime;
                let activeIndex = -1;
                for (let i = 0; i < lrcData.length; i++) {
                    if (currentTime >= lrcData[i].time) {
                        activeIndex = i;
                    }
                }

                lines.forEach((line, index) => {
                    if (index < activeIndex) {
                        line.style.opacity = '0.25';
                        line.style.fontSize = '0.75rem';
                        line.style.color = 'rgba(255,255,255,0.2)';
                    } else if (index === activeIndex) {
                        line.style.opacity = '1';
                        line.style.fontSize = '1.1rem';
                        line.style.color = '#ffffff';
                        line.style.fontWeight = '600';
                    } else {
                        line.style.opacity = '0.5';
                        line.style.fontSize = '0.85rem';
                        line.style.color = 'rgba(255,255,255,0.4)';
                    }
                });

                if (activeIndex >= 0) {
                    const activeLine = lines[activeIndex];
                    if (activeLine) {
                        const container = document.getElementById('lyricsDisplay');
                        if (container && container.style.display !== 'none') {
                            const lineTop = activeLine.offsetTop;
                            const containerHeight = container.clientHeight;
                            const lineHeight = activeLine.clientHeight;
                            const targetScroll = lineTop - containerHeight / 2 + lineHeight / 2;
                            const maxScroll = container.scrollHeight - containerHeight;
                            const clampedTarget = Math.max(0, Math.min(targetScroll, maxScroll));
                            if (Math.abs(container.scrollTop - clampedTarget) > 2) {
                                container.scrollTo({
                                    top: clampedTarget,
                                    behavior: 'smooth'
                                });
                            }
                        }
                    }
                }
            }
        }

        document.getElementById('progressSlider').addEventListener('input', function() {
            if (!audio.duration) return;
            const percent = this.value / 100;
            audio.currentTime = percent * audio.duration;
        });

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + s.toString().padStart(2, '0');
        }

        document.addEventListener('DOMContentLoaded', loadSong);
    </script>

</body>
</html>
