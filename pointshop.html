// 月份计数器
function getMonthKey() {
    const now = new Date();
    return now.getFullYear() * 12 + now.getMonth();
}

function loadMonthUsage() {
    const key = `exchange_month_${getMonthKey()}`;
    const usage = localStorage.getItem(key);
    if (usage) {
        const data = JSON.parse(usage);
        for (let id in data) {
            if (GOODS[id]) GOODS[id].monthUsed = data[id];
        }
    }
}

function saveMonthUsage() {
    const usage = {};
    for (let id in GOODS) {
        if (GOODS[id].monthLimit > 0) {
            usage[id] = GOODS[id].monthUsed || 0;
        }
    }
    localStorage.setItem(`exchange_month_${getMonthKey()}`, JSON.stringify(usage));
}

// 加载库存
function loadStocks() {
    for (let id in GOODS) {
        if (GOODS[id].stock > 0) {
            const saved = localStorage.getItem(`stock_${id}`);
            if (saved) GOODS[id].stock = parseInt(saved);
        }
    }
}

// ==================== 用户积分 ====================
let currentUser = null;
let currentPoints = 0;

async function loadUser() {
    // 1. 优先使用现有的 getCurrentUser（来自 auth.js 或 api.js）
    if (window.getCurrentUser) {
        currentUser = await window.getCurrentUser();
    } 
    // 2. 如果 ShopAPI 存在，用它获取用户
    else if (window.ShopAPI && window.ShopAPI.getUser) {
        currentUser = await window.ShopAPI.getUser();
    } 
    // 3. 最后从 localStorage 读取
    else {
        const local = localStorage.getItem('currentUser');
        if (local) currentUser = JSON.parse(local);
    }
    
    if (currentUser) {
        document.getElementById('userName').innerText = currentUser.nickname || currentUser.email?.split('@')[0] || '芦苇同学';
        await updatePoints();
    } else {
        document.getElementById('userName').innerText = '未登录';
        document.getElementById('userPoints').innerText = '积分: 0';
        document.getElementById('totalPoints').innerText = '0';
    }
}

async function updatePoints() {
    if (!currentUser) {
        currentPoints = 0;
        document.getElementById('userPoints').innerText = '积分: 0';
        document.getElementById('totalPoints').innerText = '0';
        renderGoods();
        return;
    }
    
    // 使用和首页完全相同的汇总逻辑（直接从 localStorage 计算）
    const userId = currentUser.user_id;
    let total = 0;
    
    // 和首页 getTotalScore 一模一样的计算方式
    const modules = ['beginner', 'theory', 'style', 'advanced'];
    modules.forEach(module => {
        // 尝试两种 key 格式
        let val = localStorage.getItem(`${userId}${module}Score`);
        if (!val) val = localStorage.getItem(`${userId}_${module}_score`);
        if (val) total += parseInt(val);
    });
    
    // 加上没有 userId 前缀的 theory_score
    const legacyScore = localStorage.getItem('theory_score');
    if (legacyScore) total += parseInt(legacyScore);
    
    currentPoints = total;
    
    document.getElementById('userPoints').innerText = `积分: ${currentPoints}`;
    document.getElementById('totalPoints').innerText = currentPoints;
    renderGoods();
}

// ==================== 订单管理 ====================
function getOrders() {
    const userId = currentUser?.user_id || 'guest';
    const key = `exchange_orders_${userId}`;
    const orders = localStorage.getItem(key);
    return orders ? JSON.parse(orders) : [];
}

function saveOrder(order) {
    const userId = currentUser?.user_id || 'guest';
    const key = `exchange_orders_${userId}`;
    const orders = getOrders();
    orders.unshift(order);
    localStorage.setItem(key, JSON.stringify(orders));
}

// 商品图片渲染辅助
function getGoodsImageHtml(good) {
    if (good.img) {
        return `<img src="${good.img}" class="goods-img" onerror="this.style.display='none'; this.parentElement.innerHTML='${good.icon}'">`;
    }
    return `<div class="goods-img" style="font-size:2.5rem;">${good.icon}</div>`;
}

async function exchangeGood(goodId) {
    const good = GOODS[goodId];
    if (!good) return;
    
    if (!currentUser) {
        alert('请先登录');
        if (window.showLoginModal) window.showLoginModal();
        return;
    }
    
    if (currentPoints < good.points) {
        alert(`积分不足！需要 ${good.points} 积分，当前 ${currentPoints} 积分`);
        return;
    }
    
    if (good.stock > 0 && good.stock <= 0) {
        alert('该商品已售罄');
        return;
    }
    
    if (good.monthLimit > 0 && good.monthUsed >= good.monthLimit) {
        alert(`本月该商品已兑换完，下个月再来吧~`);
        return;
    }
    
    if (good.type === 'physical') {
        showAddressModal(good);
        return;
    }
    
    await doExchange(good, null);
}

function showAddressModal(good) {
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = `
        <div class="modal-content">
            <div class="modal-title"> 填写收货信息</div>
            <input type="text" id="addrName" placeholder="收货人姓名" autocomplete="off">
            <input type="tel" id="addrPhone" placeholder="手机号码" autocomplete="off">
            <input type="text" id="addrProvince" placeholder="省份" autocomplete="off">
            <input type="text" id="addrCity" placeholder="城市" autocomplete="off">
            <input type="text" id="addrDetail" placeholder="详细地址" autocomplete="off">
            <div class="modal-buttons">
                <button class="btn-confirm" id="confirmAddr">确认兑换</button>
                <button class="btn-cancel" id="cancelAddr">取消</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    
    document.getElementById('confirmAddr').onclick = async () => {
        const name = document.getElementById('addrName').value;
        const phone = document.getElementById('addrPhone').value;
        const province = document.getElementById('addrProvince').value;
        const city = document.getElementById('addrCity').value;
        const detail = document.getElementById('addrDetail').value;
        
        if (!name || !phone || !province || !city || !detail) {
            alert('请填写完整收货信息');
            return;
        }
        
        const address = { name, phone, province, city, detail };
        await doExchange(good, address);
        modal.remove();
    };
    
    document.getElementById('cancelAddr').onclick = () => modal.remove();
}

async function doExchange(good, address) {
    if (window.API && window.API.addScore) {
        await window.API.addScore(-good.points, `兑换：${good.name}`);
    }
    
    currentPoints -= good.points;
    document.getElementById('totalPoints').innerText = currentPoints;
    document.getElementById('userPoints').innerText = `积分: ${currentPoints}`;
    
    if (good.stock > 0) {
        good.stock--;
        localStorage.setItem(`stock_${good.id}`, good.stock);
    }
    if (good.monthLimit > 0) {
        good.monthUsed = (good.monthUsed || 0) + 1;
        saveMonthUsage();
    }
    
    let code = '';
    let content = '';
    if (good.type === 'coupon') {
        code = `LWE${Date.now()}${Math.floor(Math.random()*1000)}`;
        content = `优惠券码：${code}`;
    } else if (good.type === 'virtual') {
        code = `LWV${Date.now()}${Math.floor(Math.random()*1000)}`;
        content = `激活码：${code}`;
    } else {
        content = `已安排发货，请注意查收`;
    }
    
    const order = {
        id: Date.now(),
        goodsId: good.id,
        name: good.name,
        points: good.points,
        type: good.type,
        code: code,
        content: content,
        address: address,
        status: good.type === 'physical' ? 'shipped' : 'delivered',
        createTime: new Date().toLocaleString()
    };
    saveOrder(order);
    
    showToast(`✅ 兑换成功！${good.name} 已发放`);
    renderGoods();
    if (document.getElementById('ordersPanel').style.display !== 'none') {
        renderOrders();
    }
}
// 渲染商品
let currentCategory = 'all';

function renderGoods() {
    const grid = document.getElementById('goodsGrid');
    if (!grid) return;
    
    let goodsList = Object.values(GOODS);
    if (currentCategory !== 'all') {
        goodsList = goodsList.filter(g => g.category === currentCategory);
    }
    
    if (goodsList.length === 0) {
        grid.innerHTML = '<div style="text-align:center; color:#AAD4B0; padding:40px;">暂无商品</div>';
        return;
    }
    
    grid.innerHTML = goodsList.map(good => {
        const isSoldOut = good.stock === 0;
        const canExchange = currentPoints >= good.points && !isSoldOut && (!good.monthLimit || good.monthUsed < good.monthLimit);
        const stockText = good.stock > 0 ? `库存: ${good.stock}` : (good.stock === -1 ? '不限量' : '已售罄');
        const monthText = good.monthLimit > 0 ? `本月剩余: ${good.monthLimit - (good.monthUsed || 0)}` : '';
        
        // 图片html（如果图片加载失败自动显示emoji）
        const imgHtml = good.img ? 
            `<img src="${good.img}" class="goods-img" onerror="this.style.display='none'; this.parentElement.innerHTML='${good.icon}'">` : 
            `<div class="goods-img" style="font-size:2.5rem;">${good.icon}</div>`;
        
        return `
            <div class="goods-card ${isSoldOut ? 'sold-out' : ''}">
                ${good.hot ? '<div class="goods-badge hot"> 热门</div>' : ''}
                ${good.monthLimit > 0 ? '<div class="goods-badge limited"> 月限</div>' : ''}
                ${imgHtml}
                <div class="goods-name">${good.name}</div>
                <div class="goods-points">${good.points.toLocaleString()} <small>积分</small></div>
                <div class="goods-stock">${stockText} ${monthText}</div>
                <button class="exchange-btn" onclick="exchangeGood('${good.id}')" ${!canExchange ? 'disabled' : ''}>
                    ${isSoldOut ? '已售罄' : (canExchange ? '立即兑换' : '积分不足')}
                </button>
            </div>
        `;
    }).join('');
}

function renderOrders() {
    const orders = getOrders();
    const container = document.getElementById('ordersList');
    if (!container) return;
    
    if (orders.length === 0) {
        container.innerHTML = '<div class="empty-orders">暂无兑换记录，快去商城逛逛吧~</div>';
        return;
    }
    
    container.innerHTML = orders.map(order => {
        let statusClass = '';
        let statusText = '';
        switch(order.status) {
            case 'delivered': statusClass = 'status-delivered'; statusText = '已兑换'; break;
            case 'shipped': statusClass = 'status-shipped'; statusText = '已发货'; break;
            default: statusClass = 'status-delivered'; statusText = '已完成';
        }
        
        let extraInfo = '';
        if (order.code) {
            extraInfo = `<div style="font-size:0.65rem; color:#E69A2E; margin-top:4px;">兑换码: ${order.code}</div>`;
        }
        if (order.address) {
            extraInfo = `<div style="font-size:0.65rem; color:#AAD4B0; margin-top:4px;">收货: ${order.address.name} ${order.address.phone}</div>`;
        }
        
        return `
            <div class="order-item">
                <div class="order-info">
                    <div class="order-name">${order.name}</div>
                    <div class="order-meta">${order.createTime}</div>
                    ${extraInfo}
                </div>
                <div class="order-points">-${order.points} 积分</div>
                <div class="order-status ${statusClass}">${statusText}</div>
            </div>
        `;
    }).join('');
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}

function showShop() {
    document.getElementById('shopPanel').style.display = 'block';
    document.getElementById('ordersPanel').style.display = 'none';
    document.getElementById('shopBtn').classList.add('active');
    document.getElementById('ordersBtn').classList.remove('active');
    renderGoods();
}

function showOrders() {
    document.getElementById('shopPanel').style.display = 'none';
    document.getElementById('ordersPanel').style.display = 'block';
    document.getElementById('ordersBtn').classList.add('active');
    document.getElementById('shopBtn').classList.remove('active');
    renderOrders();
}

function initCategories() {
    const container = document.getElementById('categoryTabs');
    container.innerHTML = CATEGORIES.map(cat => `
        <button class="category-tab ${cat.id === currentCategory ? 'active' : ''}" data-cat="${cat.id}">
            ${cat.icon} ${cat.name}
        </button>
    `).join('');
    
    document.querySelectorAll('.category-tab').forEach(btn => {
        btn.onclick = () => {
            currentCategory = btn.dataset.cat;
            initCategories();
            renderGoods();
        };
    });
}

function checkMonthReset() {
    const current = getMonthKey();
    const saved = localStorage.getItem('exchange_month_key');
    if (saved && parseInt(saved) !== current) {
        for (let id in GOODS) {
            if (GOODS[id].monthLimit > 0) GOODS[id].monthUsed = 0;
        }
        saveMonthUsage();
    }
    localStorage.setItem('exchange_month_key', current);
}

async function init() {
    checkMonthReset();
    loadMonthUsage();
    loadStocks();
    await loadUser();
    initCategories();
    renderGoods();
    
    document.getElementById('shopBtn').onclick = showShop;
    document.getElementById('ordersBtn').onclick = showOrders;
}

window.exchangeGood = exchangeGood;
init();
</script>
</body>
