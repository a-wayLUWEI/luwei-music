<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title> 流行席 · 芦苇·雅集·音会</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            background: #0A0A1A;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px;
        }

        .app {
            max-width: 800px;
            width: 100%;
            background: linear-gradient(180deg, #1A1A3E 0%, #0A0A1A 40%, #0A0A1A 100%);
            border-radius: 24px;
            border: 1px solid rgba(201, 169, 110, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 95vh;
            max-height: 820px;
            box-shadow: 0 8px 60px rgba(0, 0, 0, 0.6);
        }

        /* ===== 顶部导航 ===== */
        .topbar {
            padding: 16px 20px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: rgba(26, 26, 62, 0.6);
            backdrop-filter: blur(8px);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            transition: 0.2s;
        }

        .btn-back:hover {
            color: #C9A96E;
        }

        .topbar-title {
            display: flex;
            flex-direction: column;
        }

        .topbar-title .name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 2px;
        }

        .topbar-title .name .icon {
            margin-right: 6px;
        }

        .topbar-title .sub {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 4px;
            margin-top: 1px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .online-count {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            text-align: right;
            line-height: 1.3;
        }

        .online-count strong {
            color: #66ff66;
            font-weight: 600;
            display: block;
            font-size: 0.85rem;
        }

        /* ===== 快捷功能区 ===== */
        .quick-bar {
            padding: 12px 20px 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0;
            background: rgba(10, 10, 26, 0.4);
        }

        .quick-tag {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: 0.25s;
            white-space: nowrap;
        }

        .quick-tag:hover {
            background: rgba(255, 107, 157, 0.08);
            border-color: rgba(255, 107, 157, 0.15);
            color: #FF6B9D;
        }

        .quick-tag.active {
            background: rgba(255, 107, 157, 0.10);
            border-color: rgba(255, 107, 157, 0.2);
            color: #FF6B9D;
        }

        .quick-tag.gold {
            color: #C9A96E;
            border-color: rgba(201, 169, 110, 0.1);
        }

        .quick-tag.gold:hover {
            border-color: rgba(201, 169, 110, 0.25);
            color: #E8D5B7;
        }

        /* ===== 消息流 ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px 8px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(10, 10, 26, 0.3);
        }

        .messages::-webkit-scrollbar {
            width: 3px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: rgba(201, 169, 110, 0.2);
            border-radius: 10px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 0.85rem;
            letter-spacing: 2px;
        }

        .empty-state .big {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 12px;
        }

        .empty-state a {
            color: #C9A96E;
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid rgba(201, 169, 110, 0.15);
            padding: 6px 20px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 10px;
            transition: 0.2s;
        }

        .empty-state a:hover {
            background: rgba(201, 169, 110, 0.05);
            border-color: rgba(201, 169, 110, 0.25);
        }

        /* ===== 今日话题 ===== */
        .topic-card {
            background: rgba(255, 107, 157, 0.04);
            border: 1px solid rgba(255, 107, 157, 0.08);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .topic-card:hover {
            background: rgba(255, 107, 157, 0.06);
            border-color: rgba(255, 107, 157, 0.12);
        }

        .topic-card .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topic-card .icon {
            font-size: 1.2rem;
        }

        .topic-card .text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
        }

        .topic-card .text strong {
            color: #FF6B9D;
            font-weight: 600;
        }

        .topic-card .count {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.6rem;
            white-space: nowrap;
        }

        /* ===== 消息条目 ===== */
        .msg {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1A1A2E;
            background: linear-gradient(135deg, #C9A96E, #E8D5B7);
            border: 1px solid rgba(201, 169, 110, 0.15);
        }

        .msg .body {
            flex: 1;
            min-width: 0;
        }

        .msg .body .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
            flex-wrap: wrap;
        }

        .msg .body .meta .name {
            font-size: 0.75rem;
            font-weight: 600;
            color: #FFFFFF;
        }

        .msg .body .meta .time {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .msg .body .meta .badge-artist {
            font-size: 0.45rem;
            padding: 1px 8px;
            border-radius: 20px;
            background: rgba(201, 169, 110, 0.12);
            color: #C9A96E;
            border: 1px solid rgba(201, 169, 110, 0.08);
        }

        .msg .body .content {
            font-size: 0.82rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.75);
            word-break: break-word;
        }

        /* ===== 歌曲卡片 ===== */
        .song-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 12px 16px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            cursor: pointer;
        }

        .song-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(201, 169, 110, 0.1);
        }

        .song-card .cover {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #C9A96E, #8A7A6A);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .song-card .info {
            flex: 1;
            min-width: 0;
        }

        .song-card .info .title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #FFFFFF;
        }

        .song-card .info .artist {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.25);
        }

        .song-card .info .stats {
            display: flex;
            gap: 12px;
            margin-top: 2px;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .song-card .btn-play {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 107, 157, 0.10);
            color: #FF6B9D;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.25s;
            flex-shrink: 0;
        }

        .song-card .btn-play:hover {
            background: rgba(255, 107, 157, 0.2);
            transform: scale(1.05);
        }

        /* ===== 合作标签 ===== */
        .tag-coop {
            display: inline-block;
            font-size: 0.5rem;
            padding: 1px 10px;
            border-radius: 20px;
            background: rgba(255, 107, 157, 0.08);
            color: #FF6B9D;
            border: 1px solid rgba(255, 107, 157, 0.06);
            margin-top: 4px;
        }

        /* ===== 底部输入区 ===== */
        .input-area {
            padding: 12px 20px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
            background: rgba(10, 10, 26, 0.6);
            backdrop-filter: blur(8px);
        }

        .input-area .input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            padding: 2px 2px 2px 16px;
            transition: 0.2s;
        }

        .input-area .input-wrap:focus-within {
            border-color: rgba(201, 169, 110, 0.15);
        }

        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #FFFFFF;
            font-size: 0.8rem;
            padding: 8px 0;
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .input-area .btn-share-song {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 10px;
            transition: 0.2s;
        }

        .input-area .btn-share-song:hover {
            color: #C9A96E;
        }

        .input-area .btn-send {
            background: linear-gradient(135deg, #C9A96E, #8A7A6A);
            border: none;
            border-radius: 30px;
            padding: 8px 22px;
            font-weight: 600;
            color: #FFFFFF;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.25s;
            white-space: nowrap;
        }

        .input-area .btn-send:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(201, 169, 110, 0.08);
        }

        /* ===== 分享歌曲弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: linear-gradient(145deg, #1A1A3E, #0A0A1A);
            border: 1px solid rgba(201, 169, 110, 0.08);
            border-radius: 24px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal .header h3 {
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 600;
        }

        .modal .header .close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal .song-item {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal .song-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(201, 169, 110, 0.1);
        }

        .modal .song-item .title {
            color: #FFFFFF;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .modal .song-item .artist {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.65rem;
        }

        .modal .empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.12);
            font-size: 0.75rem;
            padding: 30px 0;
        }

        .modal .empty a {
            color: #C9A96E;
            text-decoration: none;
        }

        /* ===== 热歌榜模块 ===== */
        .hot-songs {
            padding: 8px 20px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            flex-shrink: 0;
            background: rgba(10, 10, 26, 0.2);
        }

        .hot-songs .label {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 4px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hot-songs .label .fire {
            color: #FF6B9D;
        }

        .hot-songs .list {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .hot-songs .list::-webkit-scrollbar {
            height: 2px;
        }
        .hot-songs .list::-webkit-scrollbar-thumb {
            background: rgba(201, 169, 110, 0.15);
            border-radius: 10px;
        }

        .hot-item {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 8px 14px;
            min-width: 140px;
            cursor: pointer;
            transition: 0.2s;
        }

        .hot-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(201, 169, 110, 0.06);
        }

        .hot-item .rank {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.1);
            font-weight: 600;
        }

        .hot-item .rank.gold {
            color: #C9A96E;
        }

        .hot-item .h-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-top: 2px;
        }

        .hot-item .h-artist {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.2);
        }

        .hot-item .h-likes {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.1);
            margin-top: 2px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            .app {
                border-radius: 0;
                height: 100vh;
                max-height: 100vh;
            }
            .topbar {
                padding: 12px 16px 10px;
            }
            .topbar-title .name {
                font-size: 0.95rem;
            }
            .messages {
                padding: 10px 14px 6px;
            }
            .input-area {
                padding: 10px 14px 14px;
            }
            .hot-item {
                min-width: 110px;
                padding: 6px 10px;
            }
            .quick-bar {
                padding: 8px 14px 6px;
                gap: 6px;
            }
            .quick-tag {
                font-size: 0.55rem;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== 顶部导航 ===== -->
        <div class="topbar">
            <div class="topbar-left">
                <button class="btn-back" onclick="goBack()">←</button>
                <div class="topbar-title">
                    <div class="name"><span class="icon"></span>流行席</div>
                    <div class="sub">都市节拍 · 时代之声</div>
                </div>
            </div>
            <div class="topbar-right">
                <div class="online-count">
                    <strong id="onlineCount">0</strong> 人在场
                </div>
            </div>
        </div>

        <!-- ===== 快捷功能区 ===== -->
        <div class="quick-bar">
            <span class="quick-tag gold" onclick="filterByTag('全部')">️ 全部</span>
            <span class="quick-tag" onclick="filterByTag('华语流行')"> 华语流行</span>
            <span class="quick-tag" onclick="filterByTag('欧美流行')"> 欧美流行</span>
            <span class="quick-tag" onclick="filterByTag('都市情歌')"> 都市情歌</span>
            <span class="quick-tag" onclick="filterByTag('创作分享')">✍️ 创作分享</span>
            <span class="quick-tag" onclick="filterByTag('歌词交流')"> 歌词交流</span>
        </div>

        <!-- ===== 热歌榜 ===== -->
        <div class="hot-songs" id="hotSongs">
            <div class="label"><span class="fire"></span>本周热歌榜</div>
            <div class="list" id="hotList">
                <div style="color:rgba(255,255,255,0.08);font-size:0.65rem;padding:6px 0;">加载中...</div>
            </div>
        </div>

        <!-- ===== 消息流 ===== -->
        <div class="messages" id="messageContainer">
            <!-- 由 JS 渲染 -->
        </div><!-- ===== 底部输入 ===== -->
        <div class="input-area">
            <div class="input-wrap">
                <input type="text" id="msgInput" placeholder="以音会友..." maxlength="500" />
                <button class="btn-share-song" onclick="openShareModal()" title="分享歌曲"></button>
            </div>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>

    </div>

    <!-- ===== 分享歌曲弹窗 ===== -->
    <div class="modal-overlay" id="shareModal">
        <div class="modal">
            <div class="header">
                <h3> 选择要分享的歌曲</h3>
                <button class="close" onclick="closeShareModal()">✕</button>
            </div>
            <div id="mySongsList">
                <div class="empty">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // Supabase 配置
        // ============================================================
        const SUPABASE_URL = 'https://alzbseigpxxtlqqseczx.supabase.co';
        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsemJzZWlncHh4dGxxcXNlY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTUyNzEsImV4cCI6MjA5NTM5MTI3MX0.4jpb-o-dnoqzLli9o1rDA-vcThWZWR7vmAxjzZkIdJ4';

        let supabase = null;
        let currentUser = null;
        let allMessages = [];
        let allMySongs = [];

        // ============================================================
        // 返回展廊
        // ============================================================
        function goBack() {
            window.location.href = 'index-yajiyinhui.html';
        }

        // ============================================================
        // 初始化
        // ============================================================
        async function init() {
            supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

            if (!currentUser) {
                document.getElementById('messageContainer').innerHTML = `
                    <div class="empty-state">
                        <span class="big"></span>
                        请先登录才能加入流行席
                        <a href="index.html">前往登录 →</a>
                    </div>
                `;
                document.querySelector('.input-area').style.display = 'none';
                return;
            }

            await loadMessages();
            await loadHotSongs();
            await loadMySongs();
            await updateOnlineCount();

            // 实时订阅
            subscribeMessages();

            // 在线人数心跳
            setInterval(updateOnlineCount, 30000);

            // 回车发送
            document.getElementById('msgInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // 发送按钮状态
            const input = document.getElementById('msgInput');
            const sendBtn = document.getElementById('sendBtn');
            input.addEventListener('input', function() {
                sendBtn.disabled = !this.value.trim();
            });
            sendBtn.disabled = true;
        }

        // ============================================================
        // 加载消息
        // ============================================================
        async function loadMessages() {
            try {
                const { data, error } = await supabase
                    .from('chat_messages')
                    .select('*')
                    .eq('room', '流行席')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;
                allMessages = data.reverse();
                renderMessages();
            } catch (e) {
                console.warn('加载消息失败:', e);
                document.getElementById('messageContainer').innerHTML = `
                    <div class="empty-state">
                        <span class="big"></span>
                        暂无消息，来分享你的第一首流行作品吧
                    </div>
                `;
            }
        }

        // ============================================================
        // 渲染消息
        // ============================================================
        function renderMessages() {
            const container = document.getElementById('messageContainer');

            if (!allMessages || allMessages.length === 0) {
                container.innerHTML = `
                    <div class="topic-card" onclick="joinTopic()">
                        <div class="left">
                            <span class="icon"></span>
                            <span class="text"><strong>今日话题：</strong>你心中最经典的华语流行专辑是？</span>
                        </div>
                        <span class="count"> 24人参与</span>
                    </div>
                    <div class="empty-state">
                        <span class="big"></span>
                        还没有消息，来分享你的第一首流行作品吧
                    </div>
                `;
                return;
            }

            let html = `
                <div class="topic-card" onclick="joinTopic()">
                    <div class="left">
                        <span class="icon"></span>
                        <span class="text"><strong>今日话题：</strong>你心中最经典的华语流行专辑是？</span>
                    </div>
                    <span class="count"> 24人参与</span>
                </div>
            `;

            allMessages.forEach(msg => {
                const avatar = msg.user_avatar || msg.user_name?.charAt(0) || '';
                const isMine = msg.user_id === currentUser?.user_id;

                let songCard = '';
                if (msg.song_id) {
                    songCard = `
                        <div class="song-card" onclick="playSong('${msg.song_id}')">
                            <div class="cover"></div>
                            <div class="info">
                                <div class="title">${escapeHtml(msg.song_title || '未命名')}</div>
                                <div class="artist">${escapeHtml(msg.song_artist || '未知歌手')}</div>
                                <div class="stats">
                                    <span>❤️ ${msg.song_likes || 0}</span>
                                    <span>▶️ ${msg.song_plays || 0}</span>
                                </div>
                            </div>
                            <button class="btn-play">▶</button>
                        </div>
                    `;
                }

                let coopTag = '';
                if (msg.content && msg.content.includes('找合作')) {
                    coopTag = `<span class="tag-coop">🤝 找合作</span>`;
                }

                html += `
                    <div class="msg" style="${isMine ? 'flex-direction:row-reverse;' : ''}">
                        <div class="avatar" style="${isMine ? 'background:linear-gradient(135deg,#FF6B9D,#C9A96E);' : ''}">
                            ${avatar}
                        </div>
                        <div class="body" style="${isMine ? 'text-align:right;' : ''}">
                            <div class="meta">
                                <span class="name">${escapeHtml(msg.user_name || '匿名用户')}</span>
                                <span class="time">${formatTime(msg.created_at)}</span>
                                ${msg.is_artist ? '<span class="badge-artist"> 音乐人</span>' : ''}
                            </div>
                            <div class="content">
                                ${escapeHtml(msg.content)}
                                ${coopTag}
                                ${songCard}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // 发送消息
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = '发送中...';

            try {
                const msg = {
                    room: '流行席',
                    user_id: currentUser.user_id,
                    user_name: currentUser.nickname || currentUser.username || '用户',
                    user_avatar: currentUser.avatar_url || currentUser.nickname?.charAt(0) || '',
                    content: content,
                    created_at: new Date().toISOString()
                };

                const { error } = await supabase.from('chat_messages').insert([msg]);
                if (error) throw error;

                input.value = '';
                sendBtn.disabled = true;
            } catch (e) {
                console.error('发送失败:', e);
                alert('发送失败，请重试');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        // ============================================================
        // 实时订阅
        // ============================================================
        function subscribeMessages() {
            supabase
                .channel('chat_messages')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'chat_messages',
                    filter: 'room=eq.流行席'
                }, payload => {
                    const newMsg = payload.new;
                    if (allMessages.some(m => m.id === newMsg.id)) return;
                    allMessages.push(newMsg);
                    if (allMessages.length > 50) {
                        allMessages = allMessages.slice(-50);
                    }
                    renderMessages();
                })
                .subscribe();
        }

        // ============================================================
        // 热歌榜（从 songs 表读取）
        // ============================================================
        async function loadHotSongs() {
            try {
                const { data, error } = await supabase
                    .from('songs')
                    .select('*')
                    .eq('status', 'active')
                    .eq('genre', '流行')
                    .order('likes', { ascending: false })
                    .limit(3);

                if (error) throw error;

                const list = document.getElementById('hotList');
                if (!data || data.length === 0) {
                    list.innerHTML = `
                        <div style="color:rgba(255,255,255,0.08);font-size:0.65rem;padding:6px 0;">
                            暂无流行作品上榜，快来上传吧 
                        </div>
                    `;
                    return;
                }

                list.innerHTML = data.map((song, idx) => {
                    const rankClass = idx === 0 ? 'gold' : '';
                    const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉';
                    return `
                        <div class="hot-item" onclick="window.open('aimusic.html?song=${song.id}')">
                            <div class="rank ${rankClass}">${medal} #${idx + 1}</div>
                            <div class="h-title">${escapeHtml(song.title)}</div>
                            <div class="h-artist">${escapeHtml(song.artist)}</div>
                            <div class="h-likes">❤️ ${song.likes || 0} 票</div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.warn('加载热歌榜失败:', e);
                document.getElementById('hotList').innerHTML = `
                    <div style="color:rgba(255,255,255,0.08);font-size:0.65rem;padding:6px 0;">
                        ⚠️ 加载失败，请刷新
                    </div>
                `;
            }
        }

        // ============================================================
        // 加载我的歌曲（分享弹窗用）
        // ============================================================
        async function loadMySongs() {
            if (!currentUser) return;
            try {
                const { data, error } = await supabase
                    .from('songs')
                    .select('id, title, artist')
                    .eq('user_id', currentUser.user_id)
                    .eq('status', 'active')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allMySongs = data || [];
            } catch (e) {
                console.warn('加载我的歌曲失败:', e);
                allMySongs = [];
            }
        }

        // ============================================================
        // 分享歌曲弹窗
        // ============================================================
        function openShareModal() {
            if (!currentUser) {
                alert('请先登录');
                window.location.href = 'index.html';
                return;
            }
            const modal = document.getElementById('shareModal');
            modal.classList.add('show');

            const list = document.getElementById('mySongsList');
            if (allMySongs.length === 0) {
                list.innerHTML = `
                    <div class="empty">
                         你还没有作品<br>
                        <a href="aimusic.html">去上传一首 →</a>
                    </div>
                `;
                return;
            }

            list.innerHTML = allMySongs.map(song => `
                <div class="song-item" onclick="shareSongToChat('${song.id}', '${escapeHtml(song.title)}', '${escapeHtml(song.artist)}')">
                    <div>
                        <div class="title"> ${escapeHtml(song.title)}</div>
                        <div class="artist">${escapeHtml(song.artist)}</div>
                    </div>
                    <span style="color:rgba(255,255,255,0.08);font-size:0.6rem;">选择 →</span>
                </div>
            `).join('');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.remove('show');
        }

        function shareSongToChat(songId, title, artist) {
            const input = document.getElementById('msgInput');
            input.value = ` 分享我的作品 《${title}》 - ${artist}，欢迎大家收听！`;
            closeShareModal();
            input.focus();
            document.getElementById('sendBtn').disabled = false;
        }

        // ============================================================
        // 在线人数
        // ============================================================
        async function updateOnlineCount() {
            try {
                const fiveMinAgo = new Date(Date.now() - 5 * 60 * 1000).toISOString();
                const { count, error } = await supabase
                    .from('chat_messages')
                    .select('user_id', { count: 'exact', head: true })
                    .eq('room', '流行席')
                    .gt('created_at', fiveMinAgo);

                if (!error) {
                    document.getElementById('onlineCount').textContent = count || 0;
                }
            } catch (e) {
                // 静默失败
            }
        }

        // ============================================================
        // 话题参与
        // ============================================================
        function joinTopic() {
            const input = document.getElementById('msgInput');
            input.value = ' 今日话题：我心中最经典的华语流行专辑是...';
            input.focus();
        }

        // ============================================================
        // 标签筛选
        // ============================================================
        function filterByTag(tag) {
            currentFilter = tag;
            document.querySelectorAll('.quick-tag').forEach(el => {
                el.classList.toggle('active', el.textContent.includes(tag) || (tag === '全部' && el.textContent
                .includes('️')));
            });
            // 简单过滤：如果有标签筛选，只显示包含该标签的消息
            if (tag === '全部') {
                renderMessages();
                return;
            }
            // 重新渲染，过滤消息
            const filtered = allMessages.filter(m => m.content && m.content.includes(tag));
            const container = document.getElementById('messageContainer');
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="topic-card" onclick="joinTopic()">
                        <div class="left">
                            <span class="icon"></span>
                            <span class="text"><strong>今日话题：</strong>你心中最经典的华语流行专辑是？</span>
                        </div>
                        <span class="count"> 24人参与</span>
                    </div>
                    <div class="empty-state">
                        <span class="big"></span>
                        没有找到包含「${tag}」的消息
                    </div>
                `;
                return;
            }
            // 临时渲染过滤后的消息
            const originalMessages = allMessages;
            allMessages = filtered;
            renderMessages();
            allMessages = originalMessages;
        }

        // ============================================================
        // 播放歌曲
        // ============================================================
        function playSong(songId) {
            window.open(`aimusic.html?song=${songId}`, '_blank');
        }

        // ============================================================
        // 工具函数
        // ============================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatTime(timestamp) {
            if (!timestamp) return '刚刚';
            const now = Date.now();
            const time = new Date(timestamp).getTime();
            const diff = Math.floor((now - time) / 1000);
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            return new Date(timestamp).toLocaleDateString();
        }

        // ============================================================
        // 启动
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
