    // ==================== 第一单元 · 音乐与歌词基础（1-10课）====================
    "第一单元 · 音乐与歌词基础_1": {
        title: " 音乐的起源",
        content: "音乐不是被发明的，是被发现的。\n\n它藏在自然里——风穿过树梢的沙沙声、雨滴落在湖面的回声、婴儿第一次啼哭时声带震动的那一瞬间。人类做的第一件事不是制造音乐，是模仿。\n\n从模仿开始，我们学会了音高。喊叫时声音变高，是紧张、是警告、是「别过来」。声音变低，是安抚、是诉说、是「没事，我在」。原始人不知道什么叫「小二度」，但他们知道：一个半音的差异，能让同伴从放松变成警惕，能让婴儿从哭变成安静。\n\n从模仿开始，我们学会了节奏。心跳、脚步、敲击石头的频率——这些是稳定的脉冲。一个人敲石头，另一个人拍手，错开一点点，就有了最早的切分音。原始人不懂什么叫「反拍」，但他们的身体知道：错开的那一下，让人想动。\n\n从模仿开始，我们学会了音色。不同的石头敲出不同的声音，有的闷，有的亮。这不是物理学，这是「这个声音让我安心」「那个声音让我害怕」——最早的乐器分类。\n\n你不是在学音乐。你是在找回人类与声音最初的关系。",
        reed: "芦苇说：音乐像一位不会说话的老祖宗。它不说教，不考试，不给你打分。它只是轻轻拍你的肩膀，然后伸手指向远处——远处有篝火，有敲石头的人，有拍手的人，有仰头喊叫的人。你顺着它的手指看过去，你会看见自己。你也是篝火旁那个人。你也在敲石头，只是你敲的不是石头，是键盘、是琴弦、是鼓皮，是你书桌上那支用来写歌词的笔。你也在拍手，只是你拍的不是手，是节奏、是心跳、是你心里那个按捺不住的念头。你也在喊叫，只是你喊的不是原始的警告，是你对一个人说不出口的那句话。所以别怕。别怕不懂乐理，别怕写不出好旋律，别怕弹错音。原始人没有乐理，没有旋律，没有音准，他们只有一件事：想说话，想让人听见。你有这件事就够了。你的根是什么？是你心里那个想说话的声音。让它出来。让它被听见。它等了你很久了。"
    },
    "第一单元 · 音乐与歌词基础_2": {
        title: " 音乐的本质与理解",
        content: "音乐的本质不是音符，不是和弦，不是技巧。音乐的本质是「情绪的时间艺术」。\n\n情绪——音乐不讲话，不讲道理，不讲故事。它直接进你的心里，不敲门。你听一首歌，不知道它在唱什么词，但你已经想哭了。为什么？因为旋律本身就有情绪。上行的时候，你的心往上提；下行的时候，你的心往下沉。大调的时候，你莫名其妙觉得今天是晴天；小调的时候，你突然想起某个人。\n\n时间——音乐不能像一幅画那样，一眼看完。画挂在那儿，你可以看一分钟，也可以看一秒。音乐不行，音乐必须从第一秒走到最后一秒。你不能跳过中间，你不能只在副歌里活着。音乐要你陪着它走，一步一步，一秒一秒。\n\n所以，听懂一首歌，不是你分析出它是什么调、什么拍号。听懂一首歌，是你闭上眼睛，让声音爬满你的皮肤，然后你说：它让我的心跳变了。就够了。",
        reed: "芦苇说：音乐像一面湖。你往里扔什么，它就回你什么。你扔一颗石子，它给你一圈涟漪。你扔一块石头，它给你一声闷响。你什么都不扔，它就安安静静地看着你。湖不会问你扔得好不好、对不对、值不值得。它只管接住，只管回应。音乐也是这样。你不必是音乐家，不必懂乐理，不必会乐器。你只需要往里扔情绪——把你说不出口的那句话扔进去，把你哭不出来的那滴泪扔进去，把你放不下的那个人扔进去。音乐不判断。它只是把你扔进去的东西，还给你——还给你的时候，它被放大了，被美化了，被变成了你听了一遍又一遍的那首歌。"
    },
    "第一单元 · 音乐与歌词基础_3": {
        title: " 歌词的起源",
        content: "歌词比音乐更早。人类还没有乐器的时候，就已经有「词」了——不是写下来的，是喊出来的。劳动的时候喊号子，不是为了美，是为了让力气往一处使。祭祀的时候念咒语，不是为了好听，是为了让神明听见。哄孩子的时候哼摇篮曲，不是为了艺术，是为了让孩子安静。\n\n后来，人们发现把话说得有韵律，更容易被记住。于是就有了诗，有了歌。歌词成了记忆的容器，把故事、情感、经验一代一代传下去。你今天哼的那句「月亮代表我的心」，五十年前也是这样被人哼着的。\n\n你写的第一句歌词，不需要华丽，不需要押韵。它只需要是真的。真话，就是最好的歌词。",
        reed: "芦苇说：歌词像一个透明的瓶子。你往里装什么，别人就看见什么。你装白水，它就是无色透明的。你装红酒，它就是深红色的。你装海，它就是不见底的。瓶子不挑你装什么。它只是等着。等着你把真的东西倒进去。别怕瓶子不够漂亮，别怕你的字不够多、不够少、不够押韵。瓶子不在乎。瓶子在乎的是：你倒进去的东西，是不是从你心里流出来的。你从心里流出来的，别人一定能接到。"
    },
    "第一单元 · 音乐与歌词基础_4": {
        title: " 音乐与歌词的段落结构",
        content: "一首歌不是一口气说完的。它像呼吸，有吸有呼。它像走路，有起有落。主歌是吸——铺垫故事，告诉你「我遇见了一个人」。副歌是呼——情绪释放，告诉你「我好喜欢这个人」。桥段是憋气——让你等一下，然后更用力地呼出来。\n\n流行歌最常见的结构是：前奏 → 主歌 → 副歌 → 主歌 → 副歌 → 桥段 → 副歌。这不是公式，是情绪的自然曲线。先让人进来，再让人陷进去，最后让人走不出来。",
        reed: "芦苇说：段落像一座桥。桥有桥头，有桥尾，有桥中间的栏杆。没有桥头，人不知道怎么上桥。没有桥尾，人不知道走完了。没有中间的栏杆，人会害怕。主歌是桥头，副歌是桥尾，桥段是桥中间那个让你停下来看看风景的地方。没有桥头，人不知道怎么上桥。没有桥尾，人不知道走完了。没有中间的栏杆，人会害怕。写歌不是铺石板，是造桥。你造的不是一条路，是一条让人走过去、走回来、走过去、走回来的路。"
    },
    "第一单元 · 音乐与歌词基础_5": {
        title: " 歌词的文风",
        content: "文风不是技巧，是人格。你是什么样的人，你就写出什么样的词。你骗不了读者的耳朵。他们听的不是你写的字，是你写那些字时，你的心跳。方文山的文风是古风典雅，像青花瓷上的青花。林夕的文风是深刻哲理，像深夜一个人的自言自语。李宗盛的文风是口语叙事，像老朋友坐在你对面，点一根烟，慢慢说他的半辈子。\n\n没有谁更好，只有谁更适合你想说的话。写歌词之前，问自己三个问题：我是谁？我在跟谁说话？我想让他听完之后怎么了？",
        reed: "芦苇说：文风像指纹。你不需要刻意设计它，你不必说「我要写成方文山那样」。你就写你想说的话。写久了，它就自己长出来了。像一棵树，你不需要告诉树往哪个方向长。阳光在哪边，水在哪边，风从哪边吹，它自己会往那个方向长。长出来的枝枝叶叶，不是它计划的，是它活出来的。你的文风不是你想出来的，是你活出来的。"
    },
    "第一单元 · 音乐与歌词基础_6": {
        title: " 短篇幅歌曲的风格分类",
        content: "风格是音乐的衣服。民谣像讲故事——一个人，一把吉他，他在你面前说：我有一个故事，你想听吗？摇滚像呐喊——不喊不行，不喊就憋死了。流行像甜美的风——你走在街上，风吹过来，不冷不热，刚好。爵士像夜晚的咖啡——不急着告诉你什么，它慢慢说，说一半，停一下，喝口咖啡，看看窗外，再接着说。电子像未来的心跳——一遍一遍重复着同一个节奏，像在说：你听啊，你听啊。\n\n风格不是标签，是情绪的衣柜。你打开衣柜，选今天想穿的衣服。穿对了，你舒服。穿错了，你不自在。",
        reed: "芦苇说：风格是一扇门。你推开民谣的门，你走进一个房间，房间里只有一个人，一把椅子，一盏灯。他抬头看你一眼，说：坐吧。你坐下。过了一会儿，他说：我爱过一个人。你说：我也是。这就是民谣。你推开摇滚的门，你走进一个房间，房间很大，墙上全是涂鸦。有五六个人在砸东西，在喊，在哭。你站在门口不敢进去。有一个人朝你走过来，把一把吉他塞你手里。你还没反应过来，所有人都开始喊。你喊完之后，觉得不那么难受了。这就是摇滚。"
    },
    "第一单元 · 音乐与歌词基础_7": {
        title: " 韵律十三辙",
        content: "押韵不是语文考试。是你把一句话说出去，最后那个字落下来的声音。你说话的时候，声音会飘。像风筝，没有线，它就飞走了，落不下来。押韵是什么？押韵是线。它让每一句话说完之后，稳稳地落在地上。十三辙是十三条路。每一辙，通向不同的情绪。\n\n发花辙——a、ia、ua。这条路最宽、最亮、最像夏天。你张开嘴，声音不拐弯，直接砸在地上。适合豪放、快乐、不想藏的话。一七辙——i、ü。这条路最窄、最暗、最像冬天。你把声音含在嘴里，不肯放出去。适合细腻、悲伤、说不出口的话。江阳辙——ang、iang、uang。这条路往上走。声音从喉咙深处涌出来，然后冲出去。适合励志、誓言、不甘心。",
        reed: "芦苇说：韵脚不是锁，是路。你以为韵脚是一堵墙，拦住你，不让你往那边走。不是。韵脚是路标，它告诉你：往这边走，风景不一样。你先想清楚你的情绪是什么。你是夏天，就走发花辙。你是冬天，就走一七辙。你是一口气，就走江阳辙。情绪选路，不是路选你。然后，换词不换意。把最后一两个字换成落在同一辙上的字。不是「孤独」这个词不对，是「孤独」的路不对。"
    },
    "第一单元 · 音乐与歌词基础_8": {
        title: "✍️ 韵律十三辙的通俗运用",
        content: "知道了十三辙，怎么用？不是背下来就够了。写歌词不是做填空题。不是「这里需要一个字，从发花辙里找一个填进去」。是「我想说这句话，我让它落在发花辙上」。顺序不对，全错了。先有情绪，后有句子，最后才有韵。韵是最晚来的那一个。\n\n你写「我想你」。三个字。你说出来了。你听了一遍，觉得最后一个字「你」，一七辙，收得太紧了。你想喊出来。你把「我想你」改成「我好想你啊」。啊（a），发花辙。张开了，放出来了。不是想了，是喊了。\n\n十三辙不只是十三种声音，是十三种人。你决定了你是谁，你自然知道你要说什么。",
        reed: "芦苇说：你小时候学过走路吗？你不记得了。但你一定学过。你摔过。你哭过。然后你站起来，再走。学韵脚也是这样。你不用背十三辙。你只需要走路。你写。摔了，起来，再写。写了，读一遍，不顺，换一个字。换了，再读。读顺了，你知道不是字顺了，是路走对了。没有人能替你走这条路。老师不能，芦苇也不能。芦苇能做的，是站在路口，给你指一指。这条路通往夏天，那条路通往冬天。你往哪走？你自己走。"
    },
    "第一单元 · 音乐与歌词基础_9": {
        title: " 歌词的句式结构",
        content: "句式是呼吸。你说话的时候，不会一口气说一百个字。你会停。停的那一下，不是你的嘴要停，是你的气不够了，是你的脑子在想下一个字怎么说，是你等对方回应。写歌词也是。你不能一口气写完一整首歌。你要停。停的地方，就是句与句之间的缝隙。那个缝隙，是你的词在呼吸。\n\n长句像叹息。一口气说完，很累。但累的人说出来的话，往往是真的。短句像呼吸。一顿一顿，很碎。但碎有碎的力量。写主歌的时候，可以用长句。因为你在讲故事，故事需要铺，需要缓。写副歌的时候，用短句。因为你不再讲故事了，你在喊情绪。情绪需要快，需要重。",
        reed: "芦苇说：句式是你的脚步声。你听一个人的脚步声，你大概就知道他今天心情怎么样。他走得很快，步子很重——他今天心情不好。他走得很慢，步子很轻——他心里有事。他走得不快不慢，步子不大不小——他今天很好，普通好。句式也一样。你写「我不难过了」，三个字。短句。像他踩了一下地板。不重，但你听见了。你写「我真的真的真的不难过了」，长句。像他走得很慢，边走边回头，每一步都在说自己不难过，但越说越像难过。"
    },
    "第一单元 · 音乐与歌词基础_10": {
        title: " 歌词常用修辞手法",
        content: "修辞不是装饰。是让你心里那团说不清楚的雾，变成雨。比喻是把不可说的，变成可说的。你把一个人比作月光。不是说他像月光，是你想说他温柔、他安静、他让你在深夜里抬头看。拟人是你不好意思说的话，让别的东西替你说。你写「雨敲了一夜的窗」，不是雨在敲，是你在等。\n\n排比是把一句话用力再说一遍、两遍、三遍。每一遍都比上一遍重。夸张是你把心里的放大镜拿出来，照出了你自己也看不清的那部分。先有感觉，再想用什么修辞。不是「我要用比喻，找一个东西来比」。是「我心里有一个人，我不知道他是谁，但我看见他的时候，我想到了月亮」。于是你写：你是月亮。",
        reed: "芦苇说：修辞是你的手指。你不会用手指数数吗？你把数指出来，别人就看见了。修辞也是这样。你把说不清楚的那些东西，用手指一指。你不用画出它的形状，不用量出它的尺寸。你只需要指一下。「看，在那里。」别人顺着你的手指看过去，他们看见了。他们看见的不是你的手指，是你指的那个东西。修辞就是你的手指。它不是被看见的，它是让别人看见的。"
    },
    // ==================== 第二单元 · 歌词情绪与对标（11-20课）====================
    "第二单元 · 歌词情绪与对标_1": {
        title: "️ 歌词情绪在音乐中的体现",
        content: "情绪不是写出来的，是藏起来的。你不说「我很痛」，你说「窗台的花枯了，我忘了浇水」。枯的不是花，是你。你忘了浇水的不是花，是你忘了照顾自己。音乐比文字更会藏。旋律藏在大调里，藏在和弦的走向里，藏在鼓点的轻重里。文字说「我难过」，音乐不说。音乐让旋律下行，让你的心跟着往下沉。\n\n同样的旋律，快一点是开心，慢一点是悲伤。同样的和声进行，用大七和弦是梦，用属七和弦是急。情绪是变量，不是常量。它随着速度、力度、音色、节奏、和声的改变而改变。",
        reed: "芦苇说：情绪像一件旧毛衣。你把它收在衣柜最里面。你忘了它。有一天你收拾衣柜，翻到它。你摸了一下，毛线已经起球了，颜色也褪了。你试着穿上。小了。不是衣服小了，是你大了。你长大了，但那件衣服里裹着的那个你，还那么小。你脱下它，你没有扔。你叠好，放回去。写歌也是。你把你舍不得的那个自己，藏进歌里。你不写他，你写别的——写风、写雨、写枯了的花、写空了的手。你以为你藏得很好。但你忘了，听歌的人也在翻自己的衣柜。"
    },
    "第二单元 · 歌词情绪与对标_2": {
        title: " 音乐的情绪如何用歌词来表现",
        content: "音乐给框架，歌词给名字。旋律说：有什么东西在往上爬。你不知道是什么东西，但你的心也跟着往上提了。歌词说：是我的希望。于是你知道了，往上爬的不是什么东西，是你的希望。音乐是骨架，歌词是血肉。骨架立在那里，你不知道它是谁。血肉长上去，你看见了它的脸，你叫出了它的名字。\n\n写歌词不是给音乐画蛇添足。是给音乐一具身体。让听的人不只是听见，是看见，是摸到，是闻到。",
        reed: "芦苇说：音乐是一个哑巴。它不会说话。它只能发出声音。但它有太多话想说。它想告诉你它记得那片海，它想告诉你它忘不了那个人。它说不出来。它只能哼哼。你是它的嘴。你听见它哼哼，你把它的哼哼翻译成词。你写「那片海真蓝啊」，其实不是你想写海，是它想说海。你写「那个人还在我心里」，其实不是你想写那个人，是它忘不了那个人。你不是在写词，你是在替它说话。"
    },
    "第二单元 · 歌词情绪与对标_3": {
        title: " 模仿/对标在歌词创作中的作用及重要性",
        content: "模仿不是为了成为别人。是为了在成为别人的过程中，找到自己。你小时候学写字，是模仿。你看着老师写的字，一笔一划地描。你描了很久，描得像了。然后你开始写自己的字。你的字跟老师的字不一样了。你有了自己的笔迹。\n\n学写歌词也是一样。你选一个你最喜欢的词人，你把他最好的十首歌的歌词抄下来。你抄的时候不要想，不要分析，不要改。你只是抄。抄得多了，你就不是你了。你是他。你写的时候，你在想：如果是他，他会怎么写？你替他想了一个词，写在纸上。你觉得不对，他可能不会这样写。你换了一个词。换了，还不对。你又换。换到你觉得对的时候，你发现那不是他想写的，是你想写的。",
        reed: "芦苇说：你小时候学过骑自行车吗？你爸在后面扶着。你在前面骑。你骑得歪歪扭扭，你爸在后面喊：看前面，别看脚下。你不看脚下，你看前面。你看见了路，看见了树，看见了前面的那个路口。你骑到那个路口，你回头。你爸不在后面。他早就放手了。你不知道他什么时候放的手。你只顾着骑，只顾着看前面，你没发现。学写歌词也是这样。你找一个老师，你跟着他写。你写得像他。有一天，你写了一首词，你觉得不像他了。你拿给他看。他说：这不是我写的，这是你写的。"
    },
    "第二单元 · 歌词情绪与对标_4": {
        title: "️ 对标歌词的意境",
        content: "意境是画面与情绪之间的空隙。你写「月亮」，那是画面。你写「想家」，那是情绪。你写「月是故乡明」，那是意境。它既有画面——月亮，又有情绪——想家。但更重要的是，在那个「是」字里，画面和情绪撞在一起。你看见了月亮，你想起家了。但你没有说你想家，你只是说月亮在故乡比较亮。\n\n意境不是写出来的，是让读者自己走进去的。你不告诉他们要去哪。你只修路。他们自己走，自己走到他们想去的地方。",
        reed: "芦苇说：意境是一只猫。你叫它，它不来。你找它，它不在。你不管它了，它自己走过来，蹭你的腿。你低头看它，它抬头看你。你们对视了几秒。它走了。你不知道它什么时候来，不知道它什么时候走。你只是知道你蹲在走廊上的那一刻，它来了。它来了，你们对视了一下，它把你的孤独分走了一半，然后走了。你还是孤独的，但你觉得没有那么重了。写意境也是这样。你不写「我孤独」。你写一只猫。你写走廊，写黄昏，写风吹过的声音。你不写你自己。但读完的人说：我好孤独。"
    },
    "第二单元 · 歌词情绪与对标_5": {
        title: " 对标歌词的节奏与韵律",
        content: "节奏是情绪的速度。你开心的时候，你走路的节奏快。你不开心的时候，你走路的节奏慢。你不是故意走快走慢，是你的情绪推着你的脚。写歌词也是。你的情绪推着你的笔。你写出来的句子，它的长短、它的停顿、它的轻重，都是你的情绪。\n\n韵律是情绪的落脚点。你写「我等你」。三个字，韵在「你」。一七辙，细腻，内敛。你等得不急，你只是等。你写「我等你啊」。四个字，韵在「啊」。发花辙，开口，释放。你等得急了，你喊了一声。同一句话，换一个韵，换一个世界。你不是在换字，你是在换你的情绪。",
        reed: "芦苇说：节奏是你的心跳，韵律是你的呼吸。你坐在床上，你把手放在胸口。你感觉到了吗？咚，咚，咚。不快不慢。那是你安静时的心跳。你写慢歌的时候，你的心跳是咚……咚……咚。你写快歌的时候，你的心跳是咚咚咚咚咚。你写歌的时候，你就是在把你的心跳翻出来给别人听。你以为你藏得很好。你写的是词，不是心跳。但你写出来的那些词，长短、快慢、停顿，都是你的心跳。"
    },
    "第二单元 · 歌词情绪与对标_6": {
        title: "️ 模仿/对标歌词的选材",
        content: "选材是选「对的作品」。不是选最好的，是选最像你的。你是一个二十岁的女生，你选李宗盛。李宗盛五十岁，他写沧桑、写遗憾、写越过山丘之后无人等候。你二十岁，你没越过山丘，你不知道无人等候是什么感觉。你硬写，你写出来的不是你的沧桑，是他。你套了一件大人的衣服，太大了。\n\n选材是选「你读的时候，心里有声音」的那首。你读它，你觉得它说的就是你。不是它说的故事像你，是它说话的方式像你。你读它的时候，你觉得你们是同一类人。你不是在学它，你是在跟它聊天。",
        reed: "芦苇说：选材像挑鞋子。你去鞋店，你看上一双鞋。好看。你试穿。你走了两步，脚趾疼。你问店员：有大的吗？店员给你拿了大的。你走了两步，不疼了。但你走了几步，觉得空空的。鞋不跟脚。你脱下来，放回去。你又看上一双。试穿。不疼，不空，刚刚好。你走了几步，你忘了你在试鞋。你低头一看，鞋在你脚上。你买了。选材也是这样。你选一个词人，你读他。你读得舒服，不费劲。你读他的时候，你忘了你在读他的词。你只觉得你在听一个人说话。听完，你写。你写的时候，你不觉得你在模仿他。你只是在写。写完之后，你读了一遍，你觉得像你。不是像他，是像你。"
    },
    "第二单元 · 歌词情绪与对标_7": {
        title: " 对标歌词的意境深化",
        content: "意境是对标之后，你走进去的那一步。你读一首词，你觉得它好。好在哪里？你说不上来。你只是觉得你被吸进去了。你不是在读它，你是掉进去了。掉进它营造的那个世界里。那个世界不是它写的，是你进去之后自己看见的。\n\n它写的是一座桥。你走上去，你看见的不是桥，是你走过的路。它写的是一扇窗。你推开，你看见的不是窗外的风景，是你曾经在某扇窗边站了很久的那天下午。意境不是它给你的，是你自己在它里面找到的。",
        reed: "芦苇说：意境是一口井。你站在井边，你往井里看。你看不到底。你丢一颗石子下去，很久才听到回声。你很想知道井底有什么。有人说井底有光。有人说什么都没有。有人说不只是光，还有一面镜子。你听了很多人的话。你越听越想下去。你沿着井壁往下爬。你爬了很久，手磨破了，膝盖也磕到了。你终于到了井底。井底什么都没有。你抬起头，你看见井口的光。很小，很远。你看着那道光，你突然觉得你不需要知道井底有什么。你只需要知道你在井底。你坐在井底，看着那道光。那不是别人的光。是你自己掉下来的那道光。"
    },
    "第二单元 · 歌词情绪与对标_8": {
        title: " 挖掘优秀歌词的内核",
        content: "内核不是金句，是金句之所以成为金句的那颗种子。你听一句词，你觉得好。好在哪里？你分析它的韵脚、它的句式、它的修辞。你分析完了，你知道了它为什么会让你觉得好。你还是不知道它为什么能让你哭。\n\n让你哭的不是它说的那句话，是那句话里面藏着的那颗种子。那颗种子在你心里种了很久了。你不知道它在。它在那首词里发了芽。你哭了。你以为你是被它弄哭的，其实你是被自己弄哭的。那颗种子是你自己种的。你忘了。它替你浇了水。",
        reed: "芦苇说：内核是一颗洋葱。你剥开一层，还有一层。你再剥开一层，还有一层。你以为剥到最后会有什么，什么也没有。剥洋葱的时候你流泪了。你不是因为洋葱辣，你是怕剥到最后什么都没有。你怕你的等待、你的期待、你的放不下，到头来什么都没有。你不敢剥了。你把它放回去。你告诉自己：不剥了，就这样吧。但你心里知道，它还在那里。你不剥它，它也在。每一层都在。每一层都裹着你的一层眼泪。你不知道你的眼泪是什么时候流进去的。你以为你忘了，其实它替你记住了。"
    },
    "第二单元 · 歌词情绪与对标_9": {
        title: " 从三个维度分析歌词",
        content: "一首好词，有三个维度。主题、情绪、节奏。主题是你要说什么。情绪是你怎么说。节奏是你说的快慢。主题不能太大，也不能太小。你写「爱情」，太大。你写「一个人的爱情」，还是大。你写「一个人等另一个人回来」，小了。你写「一个人等另一个人回来，等了三年，他回来了，但她已经不等了」。更小了。越小，越具体。越具体，越多人能进去。\n\n情绪不能乱。你难过的时候写开心，读者不信。你先确定你的情绪，再写。你的情绪定了，你的词就定了。节奏不能错。你写慢歌，你用长句，你用慢拍。你写快歌，你用短句，你用快拍。",
        reed: "芦苇说：三个维度是三根柱子。你站在它们中间。你抬头看，天很大。你不知道天有多大。你知道你站在三根柱子中间。你扶着一根，你摸到的是主题。它很粗，很稳。你靠着它，你觉得安心。你走到另一根，你摸到的是情绪。它是凉的，还是热的？你把手贴在它上面，过了一会儿，你觉得它变暖了。不是你把它捂热了，是它本来就有温度。只是你手太凉，一开始没感觉。你走到第三根，你摸到的是节奏。它在微微震动。你把耳朵贴上去，你听见咚、咚、咚。那是你的心跳。"
    },
    "第二单元 · 歌词情绪与对标_10": {
    "title": "📊 从三个维度分析歌词",
    "content": "一首好词，有三个维度。主题、情绪、节奏。\n\n主题是你要说什么。情绪是你怎么说。节奏是你说的快慢。\n\n主题不能太大，也不能太小。你写「爱情」，太大。你写「一个人的爱情」，还是大。你写「一个人等另一个人回来」，小了。你写「一个人等另一个人回来，等了三年，他回来了，但她已经不等了」。更小了。\n\n越小，越具体。越具体，越多人能进去。\n\n你写的不只是「等」，是「等了三年」，是「他回来了」，是「她不等了」。每一个细节都是一扇门。门开着，读者走进去。他们看见的不只是你的故事，是他们自己的故事。\n\n他们也等过。他们没有等三年，他们等了两年。他回来了吗？没有。他们没有等到。他们读到你写的「他回来了」，他们替那个等的人高兴了一下。再读到「她不等了」，他们又替她难过了一下。\n\n你不是在讲你的故事，你是在让他们想起自己的故事。\n\n情绪不能乱。你难过的时候写开心，读者不信。你开心的时候写难过，读者也不信。你先确定你的情绪，再写。你的情绪定了，你的词就定了。你写的时候，你知道你在难过。你不知道你在难过什么。你写「窗台的花枯了」。你不是在写花，是在写你自己。\n\n你写「花枯了」，你的情绪是难过。你写「花枯了，我忘了浇水」，你的情绪是自责。你写「花枯了，我忘了浇水，它死的时候我不知道」，你的情绪是遗憾。\n\n同一件事，加两个字，情绪变了。\n\n节奏不能错。你写慢歌，你用长句，你用慢拍，你用低声。你写快歌，你用短句，你用快拍，你用高声。你写慢歌，你用短句，你写快歌，你用长句。你自己乱了，读者也跟着乱。\n\n你写「我等了你很久」，七个字。慢的。你写「我在等」，三个字。快的。你写「我在等。等很久。你不来。」十个字，四句。越来越快。不是节奏变了，是你的心越来越急。\n\n你的心急了，你的词就急了。你的词急了，读者的心也急了。他们不知道你为什么急，他们只知道他们跟着你急了。\n\n三个维度，缺一个都不行。你有主题，没有情绪，读者知道你在说什么，但不知道你有多痛。你有情绪，没有节奏，读者知道你很痛，但不知道你痛在哪里。你有节奏，没有主题，读者跟着你走，但不知道要去哪。\n\n三个都有了，你带他们走到了你想让他们去的地方。\n\n他们到了。他们说：谢谢你带我来这里。\n\n你说：不客气。这里也是你曾经来过的地方。",
    "reed": "芦苇说：\n\n三个维度是三根柱子。\n\n你站在它们中间。你抬头看，天很大。你不知道天有多大。你知道你站在三根柱子中间。你扶着一根，你摸到的是主题。它很粗，很稳。你靠着它，你觉得安心。\n\n你走到另一根，你摸到的是情绪。它是凉的，还是热的？你摸不出来。你把手贴在它上面，过了一会儿，你觉得它变暖了。不是你把它捂热了，是它本来就有温度。只是你手太凉，一开始没感觉。\n\n你走到第三根，你摸到的是节奏。它在微微震动。你把耳朵贴上去，你听见咚、咚、咚。那是你的心跳。它不是柱子发出的，是你的心跳传到了柱子上。你贴得近，你以为那是柱子在跳。\n\n三根柱子，撑起了一座庙。庙里供奉的不是佛，是你自己。\n\n你走进来的时候，你不想进来。你被雨淋湿了，你进来躲雨。雨停了，你没走。你坐在庙里，看着三根柱子。你看着看着，你觉得你不那么冷了。\n\n不是庙里暖和，是你的身体不动了，你不再发抖了。你不发抖，你就感觉不到冷了。\n\n你站起来，你走出庙。雨停了，太阳出来了。你回头看，庙还在。三根柱子还在。你知道你还会再来。\n\n不是来躲雨，是来坐在柱子中间。不用想什么，不用说什么，只是坐着。\n\n庙不问你为什么来。也不问你什么时候走。"

    "第三单元 · 歌词结构与技法_1": {
    "title": "✂️ 从句式上分析歌词",
    "content": "句式不是技巧，是情绪的痕迹。\n\n你生气的时候，你说短句。短促，有力，像拳头砸在桌上。你开心的时候，你说长句。一口气说完，像从山顶往下跑，停不下来。你难过的时候，你说半句。说一半，停一半。不是不想说，是说完了会更难过。\n\n你的句式出卖你。你藏不住的。\n\n你写「我很生气」，三个字。短句。谁都知道你生气了。但你说「我真的很生气」，六个字。你不是在生气，你是在强调你生气。强调就是还想让人知道，想知道别人在不在意。真的生气的人，不说「真的」。\n\n你写「我今天心情很好」，七个字。长句。你开心。你写「今天天气不错」，六个字。你也很开心，但你不想让别人知道你开心。你把开心藏在天上。不是你在开心，是天气在开心。\n\n你写「我很难过」，四个字。中句。不难过的人不会说难过。说难过的人，难过已经过了一半。另一半还在，但能说出来了。说不出来的难过，才最难过。\n\n你写「我……很难过」，五个字，一个省略号。你很难过。难过到说不出来，要用省略号吞掉一半。省略号不是标点符号，是你说不出的那半句话。它在那里，你看见了，你替我说了。\n\n你分析别人的词，你先看句式。\n\n他是用长句还是短句？他是不是一直在用短句？他是不是写到最后突然用了长句？他是不是在长句里藏了一个破折号？他是不是在短句后面跟了一个问号？\n\n句式的变化，就是情绪的变化。\n\n他写「你来了」，三个字。短句。他等了你很久，你来了，他松了一口气。他写「你终于来了」，五个字。他等了你很久，你还没来，他急了。他写「你……来了」，四个字，一个省略号。他不敢信你来了。他怕是他看错了。\n\n三句，三个句式，三个情绪。你不需要知道他写什么，你只看句式，你就知道他怎么了。\n\n句式是情绪的指纹。每个人都不一样。你开心的时候说长句，他开心的时候说短句。你难过的时候说半句，他难过的时候不说话。你们不一样，但你们的句式都出卖你们。\n\n你藏不住的。\n\n你越不想让人知道，你的句式越奇怪。你写「我今天没有不开心」，七个字。你知道这句话有问题。你没说你开心，你只是说你没有不开心。没有不开心，不是开心。你绕了一个弯，你不肯承认你开心。你怕开心了，它就会走。\n\n你不敢说。句式替你说了。",
    "reed": "芦苇说：\n\n句式是你的嘴形。\n\n你开心的时候，你的嘴角往上。你难过的时候，你的嘴角往下。你不说话，你的嘴形也在出卖你。你的嘴形不是你自己选的，是你的情绪选的。\n\n你写词的时候也是。你的句式不是你自己选的。不是你想写短句就写短句，想写长句就写长句。是你的情绪选了短句，你的情绪选了长句。你只是被它推着写。它推你，你写。你不写，它不推。你写完了，它不推了。你放下笔，你看着你写的那些字。你觉得不像你写的。不是不像你，是你不记得你刚才的情绪了。\n\n情绪走了，句式还在。句式是你情绪的化石。你看着化石，你想起你刚才为什么难过。你想起你刚才为什么开心。你想起你刚才为什么欲言又止。\n\n你不想记得。但句式替你的情绪留下来。删掉，它也还在你心里。你不看它，它也在。它提醒你你曾经这样难过过，这样开心过，这样等过一个人。\n\n你不想等的那个人，句式替你等了。\n\n你不想说的那句话，句式替你说了一半。剩下一半，在你心里。你不敢写，句式不逼你。你不写，它就放在那里。你下次写的时候，它还在。你写了好几次，那句话还是没写完。不是你不会写，是你不想写完。\n\n写完了，它就结束了。你不想它结束。\n\n句式是你停在那里的一只脚。你迈出去，又收回来。你不想走，你不想留。你站在原地。\n\n句式替你站在那里。"
},
    "第三单元 · 歌词结构与技法_2": {
    "title": "️ 从结构上分析歌词",
    "content": "结构是情绪的轨迹。\n\n一首歌不是情绪的堆叠，是情绪的路。从哪里出发，经过哪里，最后停在哪里。\n\n你读一首词，你看它的结构。主歌说什么，副歌说什么，桥段说什么。主歌是铺垫，副歌是爆发，桥段是转折。没有铺垫，爆发不是爆发，是噪音。没有转折，爆完之后没有回响。\n\n你写「我爱你」。你从第一句就开始写「我爱你」，写到第四十句，还是「我爱你」。你不累，听众累了。你没有路，你只是在原地踏步。\n\n你写「我遇见你」「我喜欢你」「我爱你」「我忘不了你」。四句，一条路。从遇见到喜欢，从喜欢到爱，从爱到忘不了。每一步都不一样，但每一步都连着。\n\n你分析别人的词，你看它的结构是不是一条路。\n\n他是从低往高走，还是从高往低走？他是越走越快，还是越走越慢？他有没有在原地打转？他有没有走到一半突然拐弯？他走的那条路，是不是你曾经走过的路？\n\n你走过。你知道那条路有多长，知道走多久会累，知道在哪一段最想放弃。你知道走到头是什么。你走过头了，你不想再走。但你看见他又走上去了，你想拦他，你拦不住。他的脚不听话，他的心也不听话。\n\n他的结构是——遇见、喜欢、爱、忘不了。\n\n你走过了。你不想回头，你还是回头了。回头不是因为你想，是因为你看见了当初的自己。\n\n结构是情绪的楼梯。你往上爬，你往下走。你停在半路，你不走了。不是不想走，是走不动了。你坐在楼梯上，看着上面，看着下面。上面是副歌，你还没到。下面是主歌，你已经走过了。你卡在中间。\n\n桥段是你站起来的那一下。你站起来了，你继续爬。你爬到副歌，你喊出来了。你不是在喊给他听，是在喊给自己听。你喊完了，你往下走。\n\n走的时候，你回头看了一眼。你看见你刚才坐过的那级台阶。你记得你坐在那里的时候，你在想什么。你在想，我能不能不走上去。\n\n你走了。你走上去了。\n\n结构是你走的那条路。你不知道这条路是你选的，还是它选了你。",
    "reed": "芦苇说：\n\n结构是你的脚印。\n\n你走着，你在雪地里留下一串脚印。你回头看，脚印歪歪扭扭的。你不知道你为什么会走到这里。你只是跟着前面的那个人。那个人也歪歪扭扭的。他也跟着更前面的那个人。最前面那个人是谁？\n\n是你自己。\n\n你不知道你在跟着自己。你以为你在跟着别人。你走了很远，你停下来，你回头，你看见你自己在跟着你。不是你在跟着你，是你的情绪在跟着你。你的情绪走在前面，你跟在它后面。你以为你在带它，其实是它带你。\n\n你写歌的时候也是。你的结构不是你想好的，是你的情绪走出来的。你试着想好结构再写，写出来是死的。你跟着情绪走，让它带你，写出来是活的。\n\n你不敢让它带你。你怕它把你带到你不想去的地方。它把你带到了你不敢去的地方。你站在那里，你看见了，你写。\n\n写完了，你不敢再看。你合上本子，你走了。\n\n它还在那里。它等你回来。"
},
    "第三单元 · 歌词结构与技法_3": {
    "title": " 歌词织体的思考",
    "content": "织体是歌词的层次。\n\n一层叙事，一层情绪，一层留白。叙事是说发生了什么。情绪是说你在想什么。留白是说你没说什么，但他们听见了。\n\n你写「他走了」。一句，三个字。你写的是叙事。他走了，他不在。\n\n你写「他走了，我没有留他」。两句，八个字。你写了叙事，你写了情绪。你留不住他，你没有留他。你后悔了。后悔是藏着的，但你写出来了。\n\n你写「他走了。我没有留他。我知道他不会回头。」三句，十四个字。写了叙事，写了情绪，写了留白。留白是「我知道他不会回头」。你知道他不会回头，你才没有留他。不是不留，是不敢留。留了，他也不回头。你不想看到他不回头的那个背影。\n\n三句话，三个层次。你走进去了。你知道他走了，知道你没有留他，知道你不会留他。你知道你为什么不会留他。\n\n织体不是堆叠，是深入。叙事在外面，情绪在中间，留白在最里面。你一层一层剥开，剥到最里面，是空的。空的那里，是你的读者。\n\n他们站在空的地方，看着你剥。他们不说话，他们看着你剥。你剥到最后，看见的不是你自己，是他们。他们在空的地方等你。\n\n你写「雨停了」。叙事。你写「雨停了，天还没亮」。情绪。你写「雨停了，天还没亮，我睡不着」。留白。雨停了，天没亮，你睡不着。你没有说你想谁，但谁都知道你在想谁。\n\n织体是你说一半的话。你说出来的那一半，替你说你不想说的那一半。\n\n你分析别人的词，你看他有几层。\n\n他是不是只在叙事？他是不是一直在说情绪？他是不是不会留白？他是不是留白太多，太空了？他是不是留白太少，太满了？他是不是不知道留白是什么？\n\n你不知道你也不会留白。你写「我很难过」，你写完了。你写「我很难过，因为你不在了」，你写多了。你写「我不难过了」，你写反了。\n\n你不难过的时候才会说你不难过。你很难过的时候，你什么都不说。\n\n留白是你什么都不说的地方。",
    "reed": "芦苇说：\n\n织体是一块千层糕。\n\n你一口咬下去，咬到好几层。你尝到甜，尝到咸，尝到一点点苦。你不知道哪一层是甜的，哪一层是咸的。它们混在一起。你觉得好吃，你说不上来为什么好吃。\n\n好的词也是。你一眼看下去，看到好几层。叙事、情绪、留白。它们不是分开的，它们是一体的。叙事里有情绪，情绪里有留白，留白里又有叙事。你分不清，你也不需要分。\n\n你只是觉得被吸进去了。\n\n咬千层糕的人不是厨师。是吃的人。你不需要知道它有几层，你只需要知道它好吃。你写词也是这样。你不需要知道你的织体有几层，你只需要知道你的读者被吸进去了。\n\n他们进去了，他们就不想出来了。他们在你的词里走来走去，走到你写的叙事里，走到你写的情绪里，走到你没写的那片空白里。他们走不出来，不是你的词太深，是他们自己不想出来。\n\n你造的千层糕，他们吃出了自己的味道。\n\n你不是厨师，你是上菜的人。"
},
    "第三单元 · 歌词结构与技法_4": {
    "title": " 起承转合法创作",
    "content": "起是意外，承是情理，转是惊喜，合是余韵。\n\n起，让听的人好奇。承，让听的人安心。转，让听的人惊喜。合，让听的人回味。四者缺一不可。\n\n没有起，听的人不知道你要说什么。没有承，听的人觉得你说得不合理。没有转，听的人觉得无聊。没有合，听的人觉得没说完。\n\n你写「昨天我遇见一个人」。起。他好奇，他想知道是谁。你写「他穿着白衬衫」。承。他安心了，知道了是男人，知道了穿白衬衫。他等着你继续。你写「他是去年走的那个人」。转。他没想到。去年走的那个人，怎么又回来了？你写「他回来了，我走了」。合。你走了，他回来了，你们错过了。\n\n四句话，一个故事。\n\n你写「我不等你了」。起。你等他，你不等了。他好奇为什么不等了。你写「等了三年，你不来」。承。他知道了，等三年，不来，该不等了。你写「你来了」。转。他以为你不等了，你等到了。你写「我来接你回家」。合。不是「你来了」，是「我来接你回家」。原来不是你不等他了，是他来接你回家了。\n\n起承转合是情绪的过山车。你不知道你要去哪，你跟着它走。\n\n你以为你在往左走，它把你往右拉。你以为你要上去了，它让你再等一会儿。你以为你到了，它说还没到。你以为还没到，它说到了。\n\n你被它带着，不累。你不想下来。\n\n你写一首词，你试试起承转合。你先写起，停。你问自己，读者这时候在想什么？你在想什么，读者就在想什么。你写承，你想让读者安心，你先让自己安心。你写转，你想让读者惊喜，你先让自己惊喜。你写合，你想让读者回味，你先让自己回味。\n\n你的情绪是读者的情绪。你写的时候是什么心情，他们读的时候就是什么心情。\n\n你以为你能藏，你藏不住。你开心的时候写转，不转也开心。你不开心的时候写合，不合也是合。你的情绪是你的笔，它写出来的字，都是你的脸。",
    "reed": "芦苇说：\n\n起承转合是一个人的呼吸。\n\n你吸气，是起。你憋着，是承。你呼气，是转。你呼完气之后停的那一下，是合。\n\n你写歌的时候也是一呼一吸。你写起，你吸气。你写承，你憋着。你写转，你呼气。你写合，你停。\n\n停的那一下，你觉得你写完了。你放下笔，你呼出最后一口气。你看着你写的字，你想再改。你不改。你知道改了就呼不出那一口气了。\n\n你停在那里，你知道你写完了。你也知道有人会读到你的词，读完，他们也会呼出一口气。他们的气，不是他们自己的，是你呼出来的。你隔着纸，把气呼给了他们。他们接住了。他们放下手机，看着天花板，呼出那口气。\n\n他们不知道他们在呼你的气。他们以为他们只是读了一首词。\n\n你写了一首词，你把你的呼吸藏进去。你不说，他们不知道。但他们读的时候，他们的呼吸变了。他们吸气，憋着，呼气，停。\n\n他们不知道自己在跟着你呼吸。\n\n你的呼吸，成了他们的呼吸。"
},
    "第三单元 · 歌词结构与技法_5": {
    "title": " 顺承递进法创作",
    "content": "顺承递进是一步一步往上爬。\n\n你写「我喜欢你」。你写了。你写「我很喜欢你」。加了「很」，升了一点。你写「我真的很喜欢你」。加了「真的」，再升一点。你写「我真的真的很喜欢你」。两个字重复，升到顶了。\n\n你不需要写「我爱你」。顺承递进把「喜欢」推到顶，比「爱」更有力量。你试出来的，不是喊出来的。\n\n递进是你一步一步走向他。你走一步，他说「你好」。你再走一步，他说「你来啦」。你再走一步，他站起来。你再走一步，他张开手。你走最后一步，你走到他面前，你看着他。你没说话。\n\n你走的那几步，是你的词。他站起来，张开手，是他的反应。你没有写他的反应，你只是写你走了几步。但你走到哪，他怎么反应，读者看见了。他们看见他站起来，看见他张开手。他们替你想了你不写的那些词。\n\n递进不是重复。是每一次都不一样。\n\n你写「我等你」。你写了。你写「我一直在等你」。你加了「一直」，时间拉长了。你写「我等你，一直等」。你换了位置，语气变了。你写「我等你。一直在等。」你分开写了，有了停顿。\n\n四句，同一句话，四种递进。你不是在说同一句话，你是在说同一个情绪的不同层次。\n\n第一次是告诉你你在等。第二次是告诉你等了很久。第三次是告诉你你还会等下去。第四次是告诉你你等的时候是什么样子。\n\n顺承递进是你情绪的放大镜。你放大了，读者就看见了。你不敢放大的地方，递进替你放大。你写「我有点难过」，你放大了。你写「我很难过」，你放大了。你写「我难过极了」，你放大了。你写「我难过到想吐」，你放大了。\n\n你不想让人知道你难过到想吐。但递进替你说了。\n\n递进是你一步一步走进自己。你走进去的时候，你不想进去，你被推进去的。推你的不是你，是你的笔。它不听话，它要写。你拉不住它，你让它写。它写到你不想写的地方，你停。它不听，它继续写。\n\n它写到你想吐，你想删了。你没删。\n\n你知道那是真的。",
    "reed": "芦苇说：\n\n递进是一条河。\n\n你站在河边，水很浅。你走进去，水到脚踝。你再走，水到膝盖。你再走，水到腰。你再走，水到胸口。你不敢再走了。你怕水淹过你的头。\n\n你不知道你会不会游泳。你不敢试。你退回去了。你站在岸边，看着水。你看见水里还有一个人，他在走。水到他脚踝，水到膝盖，水到腰，水到胸口，水到脖子。他还在走。水淹过他的头。他不见了。\n\n你等了一会儿，他浮上来。他游到岸边。他看了你一眼，走了。\n\n你不知道他是谁。你不知道他为什么要走到水里去。你不知道他为什么还能游回来。\n\n递进就是那条河。你走进去，你怕你回不来。你不走，你不会知道水里有什么。你不知道你走进去之后，你能不能游回来。你不知道游回来之后，你还是不是你。\n\n你写的时候，你就是在走那条河。走到你觉得够了，你停。你不上岸，你站在水里，看着岸上。你看见了岸上的人，他们也在看你。你不知道他们是不是也在想走进来。\n\n他们也在看水。"
},
    "第三单元 · 歌词结构与技法_6": {
    "title": "❓ 问答呼应法创作",
    "content": "问答呼应是你问一句，他答一句。你问了，他不答。你替他答。\n\n你写「你在哪？」你问了。他不回答。你写「我在这」。你替他答了。他不在，你替他答。你不是在回答他，你是在回答自己。你知道他在哪，你知道他不会来。你替他来了。\n\n问答呼应不是真的问，是真的答。你问了，你不需要他回答。你知道答案，你写出来。读者替你问了，你替读者答了。\n\n你写「你好吗？」你问了。你写「我很好」。你答了。你不好，你写很好。读者知道你在撒谎，他们不戳穿你。他们知道你为什么撒谎。你也知道他们知道。\n\n你写「你快乐吗？」你问了。你写「我快乐」。你答了。你不快乐，你写快乐。你骗的不是读者，是你自己。\n\n问答呼应是你跟自己说话。不是跟他说话。他不在，他听不见。你只能跟自己说。你跟自己说的时候，你假装在跟他说。你假装他还在。你问他，你答他。你替他答了，你说的是你想听他说的话。\n\n他没有说过那些话。你说他说了。你写在纸上，纸不会反驳你。你看着纸，你相信了。\n\n你写「你还记得我吗？」你问了。你写「我记得你」。你替他答了。他不知道你记不记得他，你知道。你记得。你替他记得。\n\n你写「你会回来吗？」你问了。你写「我会的」。你替他答了。他不会回来，你说他会。你在等他，你不愿意承认他在走远。\n\n你不愿意承认的事，问答呼应替你说。你问他，你替他答。你答的时候，你知道他不会那样答。你还是写了。你写的时候，你哭了吗？你不说。\n\n你的词替你哭了。",
    "reed": "芦苇说：\n\n问答呼应是一面镜子。\n\n你站在镜子前，你问镜子你是谁。镜子不说话。你自己答。你是你，你是另一个你，你是你想成为的你，你是你害怕成为的你。镜子里的人不是别人，是你。\n\n你问他，他看你。他不回答。你替他回答。你不是在替他回答，你是在替自己回答。你知道答案，你只是不敢告诉自己。你告诉他，他听了。他听完，他告诉你他听懂了。\n\n他说他听懂了。他什么都没说，你听见了。\n\n你听见的不是他的声音，是你自己的。你把它当成了他的，你不愿意承认那是你自己的。你把它放在纸上。\n\n纸不会说不是。\n\n你写完了，你看着纸。你不认识纸上的那个人。你不知道他是谁。他问你他是谁，你不敢回答。你不知道答案。你知道他等你，你不知道他在等什么。\n\n你在等你的回答。"
},
    "第三单元 · 歌词结构与技法_7": {
    "title": " 分述并列法创作",
    "content": "分述并列是换不同的角度说同一件事。\n\n你写「我想你」。你写了。你觉得不够，你再写「我想起你」。你换了角度，从「想」变成「想起」。前者是正在进行，后者是回忆。你从向前看，变成往后看。同一件事，不同时间。\n\n你写「我梦到你」。你换了角度。从现实到梦境。你醒着的时候想他，睡着了也想他。同一件事，不同空间。\n\n你写「我写了一首歌给你」。你换了角度。不是你在想他，是你为他做了一件事。你想他的时候，你是被动的。你写歌的时候，你是主动的。\n\n分述并列是一颗钻石的多个切面。你从不同的角度照它，它反射出不同的光。光不一样，钻石还是那颗钻石。\n\n你写「他走了」。你写了。你写「门关上了」。你不是在写门，你是在写他走了。你换了角度，不写人，写物。物替你写人。\n\n你写「窗开着」。你写了。你写「风很大」。你不是在写风，你是在写他走了之后，你忘了关窗。风很大，你冷。你不关窗，你在等他回来关。\n\n分述并列是用不同的眼睛看同一件事。\n\n你看他走了，你用自己的眼睛。你闭上自己的眼睛，你用门的眼睛。门看见他走了，门看见你一个人。你用的不是你的眼睛，是门的。你写「门关上了」，不是你在说，是门在说。\n\n你用风的嘴说冷。不是你说冷，是风说的。风说冷，你说风很大。你骗自己不是你在等，是窗开着。\n\n你不想让别人知道你在等。你把等藏在窗里，藏在风里，藏在门里。他们读到窗，读到风，读到门。他们不知道你在等。他们知道窗开着，风很大，门关上了。\n\n他们不知道，但他们觉得冷。\n\n你不想让他们知道的事，东西替你说了。东西不冷，他们觉得冷。不是东西冷，是你冷。",
    "reed": "芦苇说：\n\n分述并列是一双手套。\n\n你左手戴一只，右手戴一只。你左手冷，右手也冷。你左手替右手暖，右手替左手暖。你分不清哪只手更冷，哪只手更暖。它们一样冷，一样暖。\n\n你写「他走了」，是你左手写的。你写「窗开着」，是你右手写的。左手写人，右手写物。你分不清哪一句更冷。它们一样冷。\n\n你把手套脱了，你把手放在口袋里。你不需要手套，你的口袋在替你暖。你的口袋不是你的手，它替你暖。你不知道是口袋暖，还是你的手本来就不冷。\n\n你只是需要一个东西替你暖。你不挑，口袋也行，手套也行，窗也行，风也行，门也行。\n\n你不是在写它们，你是在借它们。借它们的手，暖你的手。借它们的嘴，说你的冷。借它们的眼睛，看他走。\n\n你借了，你不还。你写下来，它们就不是它们的了。是你的。\n\n你的窗，你的风，你的门。他走的时候，你把这些也带走了。你不知道你带走了它们，你以为你只是带走了他。\n\n他走了，窗还在。窗不是他了，是你。你站在窗边，你看着窗外。你看见的不是窗外，是你心里的他。\n\n你把心里的他放在窗外。他不是他，是你心里的他。"
},
    "第三单元 · 歌词结构与技法_8": {
    "title": " “一字一词一句”创作法",
    "content": "一字一词一句，是从最小的地方开始。\n\n你先写一个字。你写「等」。一个字，你不知道它在等什么。它空着，它等着你填。你看着它，你不敢填。你怕填错。你不填，它就一直空着。\n\n你写下一个字。你写「你」。「等你」。你知道了，是在等你。你不知道你是谁，你只知道你在等你。你不是在写词，你是在写你的心。你的心在等你。等谁？不知道。等多久？不知道。等到什么时候？不知道。\n\n你只知道你写下「等你」的时候，你的心跳了一下。不是快了，是重了。像有人在你心上踩了一脚。\n\n你写第三个字。你写「回」。「等你回」。你在等他回。回哪里？回你身边。回你的心里。回你们曾经一起走过的那些日子。你没写，他们知道。你只写了三个字，他们读出了三行。不是他们读出来的，是你藏进去的。你藏了，他们看见了。\n\n你写第四个字。你写「来」。「等你回来」。四个字，一句话。你等一个人回来。你不知道他会不会回来。你不知道你等不等得到。你不知道你等的是他，还是你心里的那个他。\n\n一字一词一句，不是你写的，是你心里的那个人替你写的。他不说话，他让你写。你写了，他不来。\n\n你再写。你写「等」。又一个「等」。你写「等」，你写「等等」。你写了两遍。你等，你也等。你不是在写两个字，你是在写你等了两次。第一次是等他回来，第二次是等他回来了之后，你还要等他。等他开口，等他看你，等他像从前一样。\n\n你等不到。你写「等等」。你是叫自己等，还是叫他等等？你不知道。你写的时候你不知道，你读的时候也不知道。你只知道你写了两遍「等」，两遍。你等了两遍。\n\n你还要等第三遍吗？\n\n你不写了。你放下笔，你看着纸。纸上有两个「等」。你看着它们，它们也在看着你。你不知道是谁在等谁。",
    "reed": "芦苇说：\n\n一字一词一句是一根针。\n\n你拿着针，你不知道要缝什么。你看着空白的纸，你不敢扎下去。你怕扎疼了纸，纸不疼，是你疼。你怕的不是纸疼，是你怕一针下去，你就停不下来了。\n\n你扎了第一针。你写了一个「等」。你抽线，线是黑的。你不知道为什么是黑的，你不想用黑的。但你手里的线是黑的，你换不了。\n\n你扎第二针。你写了「你」。线还是黑的。你扎第三针，写了「回」。线还是黑的。你扎第四针，写了「来」。你停下来，你看着你缝出的那四个字。\n\n「等你回来」。\n\n你不是在写字，你是在缝你的心。你的心破了，你用黑线缝它。黑线露在外面，你不想让别人看见，你把它藏在字里。\n\n你以为藏住了。\n\n但你读的时候，你看见了那条黑线。它从「等」连到「你」，从「你」连到「回」，从「回」连到「来」。你不是在读词，你是在看你的心。你的心被你缝过，疤还在。\n\n你看着疤，你不疼了。疤已经不疼了。但你记得它疼过。\n\n你记得，就够了。"
},
    "第三单元 · 歌词结构与技法_9": {
    "title": "⏳ 时间/空间/逻辑顺序创作",
    "content": "时间、空间、逻辑，是情绪的坐标。\n\n你写「昨天」「今天」「明天」。你写的是时间。你写「这里」「那里」「哪里」。你写的是空间。你写「因为」「所以」「但是」。你写的是逻辑。\n\n你不知道你在哪，你写「这里」。你不知道你要去哪，你写「那里」。你不知道你该不该去，你写「哪里」。\n\n你不是在写词，你是在找路。\n\n你写「昨天你还在」。过去。你写「今天你不在了」。现在。你写「明天我会不会忘了你」。未来。你不是在写三天，你是在写你失去他的过程。昨天还有，今天没了，明天会不会忘。你不敢写明天，你怕你真的会忘。\n\n你不想忘，你写「明天我还是会记得你」。未来被你改了。你不想明天忘，你把明天改了。不是明天会变，是你不想让它变。你写了，你觉得安心了。\n\n你骗了自己，你也骗了纸。纸不会说你在骗它，它替你记着。\n\n你写「你在」。空间。你写「你不在」。空间变了。你写「你在不在」。你问了，你不知道你在不在。你不在，你不知道你问的是你还是他。你问「你在不在」，你想问的是他，你写的是你。\n\n你在不在？你在，他不在。你在他不在的地方，你写你在他不在的地方。\n\n逻辑是你看不见的线。你写「因为」「所以」「但是」，你把线拉出来。你拉的时候，你不知道线会拉到哪。你拉着，它走，你跟着。\n\n你写「因为你来过」。你拉了线。你写「所以我记得」。线在走。你写「但是你不来了」。线断了。你拉着线头，线头在手里。你不知道该不该扔掉。你攥着，不放手。\n\n你的逻辑断了。你写不下去了。\n\n你卡在那里。你看着断掉的线，你不知道是它断了，还是你把它扯断了。",
    "reed": "芦苇说：\n\n时间、空间、逻辑是三条线。\n\n你拿着三根线头，你不知道该拉哪一根。你拉时间的线，你拉到了昨天。昨天他在，你今天不在。你拉到了今天，你今天不在，你明天在不在？你不知道。你不敢拉明天的线，你怕明天你也不在。\n\n你拉空间的线，你拉到了这里。他在这里，他不在。你拉到那里，他在那里，他不在。你拉不到他在的地方，你不知道他在哪里。\n\n你拉逻辑的线，你拉到了「因为你来了」。你等着「所以」，他走了。你没有「所以」，你的逻辑断了。\n\n你放下线，你看着三条线。它们缠在一起，你分不清哪条是哪条。你不知道你该先拉哪一条。你怕拉错，你怕一拉线就断了。\n\n你不敢拉，你不拉。你把线放在那里，你走了。\n\n你走的时候，你回头看了一眼。线还在。\n\n线替你等。"
},
    "第三单元 · 歌词结构与技法_10": {
    "title": " 回忆倒叙法创作",
    "content": "倒叙不是为了炫技，是为了不忍。\n\n你先说结果，再说原因。你先说他走了，再说他为什么走。不是你不知道原因，是你不敢先说。你怕说了原因，他就真的走了。你说他走了，你再说他为什么走。你说是因为你不好。你不敢说你哪里不好，你只说你不好。\n\n你写他走的时候，他没回头。你写你站在那里，看着他走。你写你没追。你说你追不上。你说你不想追。你写你不知道你不想追，还是追不上。\n\n你先写结果，你的心被结果塞满了。你不知道怎么解释。你写不出来，你跳过去。你写后来，你写后来你过得不好。你不写他走了之后你怎么样，你写后来。\n\n后来是你不想说现在。\n\n回忆倒叙是你往回走。你走回去，你不想走，但你不得不走。你想知道他是怎么走的，你回到他走的那一天。你站在那一天，你看着他走。你不叫他，你不追他。你只是看着。\n\n你看见他走远了，你收回目光。你低下头，看着你的脚。你的脚没动，你站在那里。你不知道你站了多久。你只知道你站了很久，久到你忘记了时间。\n\n你再抬头，他不在了。你的回忆到头了。你不想回头，你停在那里。你不想再往前走，你不想再往回走。你站在原地。\n\n你的脚没动，你的心动了。你的心回到了现在。你睁开眼，你还在你的房间里。你坐在椅子上，你看着你写的字。你写了他走了，你写了他为什么走，你写了后来你过得不好。\n\n你不知道你写的这些，是真的，还是你想的。你分不清。你只知道你写了，你写完了。\n\n你不想再看了，你合上本子。\n\n本子里有一个人，他走了。本子里也有你，你站在原地。他不知道你站在那儿，他走了。你不敢告诉他你在那儿。\n\n本子替你告诉他了。",
    "reed": "芦苇说：\n\n倒叙是你往回走。\n\n你走在路上，你走快了，你走过了。你回头看，你想回去。你不知道该不该回去，你怕你回去了，你回不来。你怕你回去了，你会看见你不想看见的东西。你怕你看见了，你回不来。\n\n你回去，你看见你走过的路。你看见你摔过的地方，你看见你哭过的地方，你看见你等过他的地方。他不在，你看见的是他等过你的地方。你站在那儿，你等他。他不在。\n\n你不知道他会不会来，你不知道你该不该等。你不走，你站着。你站着的时候，你想起来了。你想起那天他来过，他等了，你不来。\n\n你等着他，他等过你。你们谁也没等到谁。\n\n你是他，他也是你。你分不清了。\n\n你往回走，你走到这里。你站在这里，你看着他走，他也在看着你走。你们擦肩而过，你们都没有停。\n\n你们走远了。\n\n你回头，他也回头。你们看不见彼此。"
},
    "第三单元 · 歌词结构与技法_11": {
    "title": " 情景交融法创作",
    "content": "景是情绪的容器。\n\n你写雨，不是写雨，是写你出不了门。你写窗，不是写窗，是写你在等他。你写灯，不是写灯，是写你一个人。\n\n你写「雨下了很久」，你不说你在等雨停，你说雨下了很久。你在等雨停，你不说你在等，你让雨替你等。雨不停，你不出门。你不出门，你就在家里。你在家里，你就在他曾经来过的地方。你在的地方，是他的影子。\n\n你写「窗开着」，你不说你等他来，你说窗开着。你等他来，窗替你等他。你不关窗，你怕他来了进不来。你不知道他会不会来，你不敢关窗。\n\n你写「灯亮着」，你不说你一个人，你说灯亮着。你怕黑，你开着灯。你不知道你怕的是黑，还是你一个人。灯亮着，你觉得你不是一个人。\n\n你写雨，你写窗，你写灯。你不是在写景，你是在写你的心。你的心在下雨，你的心开着窗，你的心亮着灯。你不知道你的心在等什么，你不敢问。你问你的心，你的心不说话。\n\n它让你的手写。\n\n你写「雨停了」，雨停了，你不等雨了。你不知道你接下来要等什么，你怕不等了。你不等雨了，你等你。你等你从雨里走出来，你不知道你是不是在雨里。你走出来了吗？你不知道。\n\n你写「窗关了」，你关了窗，你怕他来了进不来。你关了窗，你怕他不来了。你不知道你怕哪个。你关了窗，你不等了，你等不下去了。\n\n你写「灯灭了」，你关了灯，你一个人。你不怕黑了，你怕你自己。你怕你一个人，你怕你习惯了。你习惯了，你就不会等他了。你不想习惯，你开着灯。\n\n你写景，你写的不是景，是你不想让人看见的心。",
    "reed": "芦苇说：\n\n情景交融是你把心挂在窗外。\n\n你怕别人看见你的心，你把心藏在雨里。雨不是你的心，雨替你湿了。你怕别人听见你的心跳，你把心跳藏在风里。风不是你的心跳，风替你响了。\n\n你不知道别人会不会听见，你藏了。你藏好了，你不怕了。你不怕他们看见，你怕他们看不见。你藏了，你又不想藏。你不想让人知道，你又想让人知道。\n\n你把心挂在窗外。你写了雨，你写了风，你写了窗，你写了灯。你把心挂在那些东西上，你看它们，它们替你挂着。你不累，它们累。你不累，你让它们替你累。\n\n它们不说不累，它们不会说话。你替它们说，你说雨大了，你说风冷了，你说窗旧了，你说灯暗了。你说的不是它们，是你。\n\n你累了，你冷了，你旧了，你暗了。你不知道你什么时候变成这样的，你知道你变了。你不是从前的你，你回不去了。你不想回去，你不想待在从前。\n\n你待在现在，你不想现在。你想回去，你回不去。你卡在中间，你不知道你在哪。\n\n你写雨，写风，写窗，写灯。你不知道你在写它们，还是它们在写你。"
},
    "第三单元 · 歌词结构与技法_12": {
    "title": " 回旋反复法创作",
    "content": "反复不是偷懒，是“我就是不放下”。\n\n你写「我想你」。你写了一遍。你觉得不够，你再写一遍。你写了三遍。你不是在凑字数，你是在用力。你用力说，你用力想。你想让他听见。\n\n你写了三遍，你觉得够了。你停下。你不知道他听见没有，你听见了。你听见的不是你的声音，是回声。你的声音撞到墙上，弹回来。你听见自己说「我想你」，你听见你回自己「我想你」。\n\n你跟自己说话。\n\n你写「我等你」。你写了一遍。你写「我等你回来」。你写了。你写「我等你回来，一直等」。你写了。你写「我等你回来，一直等，等到你来」。你写了。\n\n你加了字，你没有换词。你不敢换，你怕换了就不是等了。你怕换了，他不认得。你怕他认不得你在等他。你不换，你重复，你一遍一遍说。你不怕他烦，你怕他不来。\n\n你写「放不下」。你写了一遍。你写「放不下」，你写「还是放不下」。你写「我放不下，我放不下」。你写了两遍。不是你没词了，是你真的放不下。\n\n你不知道你放不下什么。你知道是你放不下他，你不知道你放不下的是他，还是放不下自己。你放不下等他的自己。你等了，你不等，你就不等了。你不等了，你就不是等他的自己了。\n\n你不想变，你不想不等。\n\n你反复写，你不变。你变不了，你不敢变。你怕变了，你就不是你了。你不知道你是你，还是他。你分不清了。\n\n你写「我是我」，你写了。你写「你是我」。你写了。你写「我是你」。你写。你写「我是你，你是他」。你写。你不知道你在写什么，你只知道你在写。\n\n你反复写，你不变。你不问为什么，你不想知道。你知道了你就会变，你不想变。\n\n你留在原地。",
    "reed": "芦苇说：\n\n反复是一圈圈转。\n\n你坐在旋转木马上，你上去，你不下来。你转了一圈，你又看见那个人。你转了一圈，他又在那里。你转了一圈，他在。你转了一圈，他在。你转了好多圈，他一直在。\n\n你不知道他是真的在，还是你在转。你停下，他还在吗？你不敢停，你怕他不在。你一直转，你不敢停。你转累了，你不转。你停下来，他不见了。\n\n你早知道他会不见，你不想知道。你骗自己他还在，你转。你转了一圈，他出现了。你看见了，你安心了。你不看也知道他在，你在，你一直转。\n\n你不问为什么，你不想知道。你知道你就会停下来，你不想停。你停了他就不在了。你不想他不在了。\n\n你不想没有他的日子。你不知道没有他的日子怎么过。你不想过。你不想过没有他的日子，你不想过有他的日子。你过的都是他的日子。\n\n你不记得你是你，你记得你和他。你和他在一起的日子，你不记得你是你。你不记得你不等他的时候是什么样子。\n\n你不记得，你不敢记得。"
},
    "第三单元 · 歌词结构与技法_13": {
    "title": " 条例口号法创作",
    "content": "口号不是喊，是让你想点头。\n\n你写「我不怕」。你写了。你写了三遍，不是你在喊，是你在告诉自己你不怕。你怕，你写你不怕。你写给你自己看。\n\n你写「我很好」。你写了。你不好，你写你很好。你骗自己，你让自己相信你很好。你写了很多遍，你相信了。你不觉得你在骗自己。\n\n口号是你跟自己喊话。\n\n你写「我可以」。你写「我可以」，你写「我可以」。你不行，你写你可以。你写着写着，你觉得你可以了。你不是真的可以，你只是觉得你可以。你相信了。你信了，你就去做了。你做了，你真的可以。你不知道是你本来就可以，还是你写着写着变成了可以。\n\n你不知道，你不问。你只知道你写了，你做了，你可以了。\n\n你写「我不要了」。你写了。你放不下，你写你不要了。你写了，你骗自己。你写了很多遍，你还是放不下。你不知道你骗不了自己，你不想知道。你继续写。\n\n你写「我不想了」。你写了。你想，你写你不想。你骗自己，你骗了你自己。你不知道你骗了你自己，你觉得你不想了。你真的不想了吗？你不敢问。\n\n你写「我忘了」。你写了。你忘不了，你写你忘了。你写了，你觉得你忘了。你不知道你有没有忘，你不去想了。你不想了，你就忘了。你忘了，你真的忘了。\n\n你不知道是你忘了，还是你不想记了。\n\n口号是你跟自己说话。你不听，你让自己听。你不信，你让自己信。你信了，你就不怕了。你不怕了，你就好了。\n\n你不知道是你好了，还是你写着写着就好了。",
    "reed": "芦苇说：\n\n口号是你自己给自己打气。\n\n你站在起跑线上，你看着终点。你怕你跑不到，你对自己说「我能」。你说了一遍，你再说一遍。你说着说着，你觉得你真的能。\n\n你跑，你跑到了。你不知道是你真的能，还是你说着说着就能了。你分不清，你不去分。\n\n你站在终点，你看着起点。你跑过了，你对自己说「我做到了」。你说了，你笑了。你笑的时候，你不知道你在笑，你只知道你跑到了。\n\n你跑到了，你也跑过了。你从起跑线跑到了终点线，你也从怕跑到了不怕。你跑过的不只是那条路，是你心里的那条路。\n\n你心里的那条路，你跑了好多次。你跑一次，你对自己喊一次话。你喊「我不怕」，你跑。你喊「我很好」，你跑。你喊「我可以」，你跑。你喊「我不要了」，你跑。你喊「我不想了」，你跑。你喊「我忘了」，你跑。\n\n你跑到最后，你停下。你回头，你看不见起跑线了。你跑远了，你跑到了你不知道的地方。\n\n你站在那儿，你不知道你在哪。你只记得你跑过，你喊过。\n\n你喊过的那些话，还在风里。"
},
    "第三单元 · 歌词结构与技法_14": {
    "title": " 修辞手法排列法创作",
    "content": "修辞是让平常的不平常。\n\n你不是写雨，你是写雨在说什么。你不是写风，你是写风在想什么。你不是写他，你是写他在你心里是什么样子。\n\n你写「雨敲了一夜的窗」。雨不会敲窗，是你敲。不是敲窗，是敲门。你敲门，他不应。你不写了，你写雨敲窗。不是你敲门，是雨替你敲。\n\n你写「风推着云走」。风不会推云，是你推。你推着他走，你不走了，风替你推。\n\n你写「月亮看着你」。月亮不会看人，是你看。你不看他，你让月亮替你看了。\n\n修辞是你借别人的眼睛看，借别人的嘴说。\n\n你不敢说你想他，你写「月亮在想他」。你不敢说你难过，你写「雨在哭」。你不敢说你一个人在等他，你写「灯在等」。\n\n你借了月亮，借了雨，借了灯。你借了它们，你不还。你写了，它们就不是它们了。是你的了。\n\n你的月亮，你的雨，你的灯。\n\n你把你的心放在月亮里，你把你的泪放在雨里，你把你的等待放在灯里。你放下它们，你以为你放下了。你放下了，你的心不在你身上了。在月亮上，在雨里，在灯里。\n\n你不知道它们在哪儿，你看着月亮，你听见雨，你开着灯。\n\n它们在。你也在。\n\n你们都不在的地方，是他在的地方。你不知道他在哪儿，你不去找他。你让月亮去找他，你让雨去找他，你让灯去找他。\n\n月亮找不到，雨找不到，灯找不到。\n\n你不知道，你不想知道。",
    "reed": "芦苇说：\n\n修辞是一支笔。\n\n你拿着笔，你不知道要画什么。你画了月亮，你画了雨，你画了灯。你画了它们，它们不是它们了。是你。\n\n你是月亮，你是雨，你是灯。\n\n你不说话，月亮替你说。你不哭，雨替你哭。你不等，灯替你等。你不是你，你是月亮，你是雨，你是灯。你分不清了。\n\n你不知道你是谁，你不知道你是月亮，还是你只是你。\n\n你看着月亮，你问月亮你是谁。月亮不说话，雨不说话，灯不说话。它们不说话，你替它们说。\n\n你说你是月亮，你说你是雨，你说你是灯。你说你是你。\n\n你不知道你说了什么，你只知道你说了。你说出来了，你不难过了。不知道是你说出来了就不难过了，还是你难过了很久，它自己走了。\n\n你难过了很久，你不知道多久。你只知道你难过的那些日子，月亮在，雨在，灯在。\n\n它们陪你。\n\n你不知道是你陪它们，还是它们陪你。"
},
    "第三单元 · 歌词结构与技法_15": {
    "title": " 数字排列法创作",
    "content": "数字是情绪的量尺。\n\n你说「很久」，别人不知道多久。你说「两年」，别人知道七百三十天。你说「两年零三天」，别人知道你记得每一天。\n\n数字不是冷冰冰的，是你舍不得放下的那些日子。\n\n你写「三天」。你等了三天，不长，不短。三天，你还可以等。你写「三天了」。加了「了」，三天变成过去。你等了三天，还在等。你写「第三天」。第三天，你数着日子过。\n\n你写「一百天」。你等了一百天，不短了。你写「一百零一天」。你还记得多了一天。你写「一百零一天了」，你还在等。\n\n你写「一年」。你等了三百六十五天。你写「一年零一天」。你多等了一天。你记得。\n\n数字是你放在心里的刻度。你刻在心上，你不想忘。你怕你忘了，你把自己刻在上面。你是那个数字，你是等了两年零三天的那个人。\n\n你不知道你等了两年零三天，还是你是等了两年零三天的那个人。你分不清。你只知道那是你。\n\n你不是你，你是那个数字。\n\n你写「一」。一秒钟，一天，一年。一整个你。你把自己放在「一」里。一个你，一个人，一扇窗，一盏灯。一个你在等一个人。\n\n你写「二」。你和他。两个人，两条路，两扇窗，两盏灯。两个人，不在一起。\n\n你写「三」。三天，三年，三个人。你，他，还有一个等不到他的你。\n\n你不知道你写的是数字，还是你。\n\n你是「一」，你也是「二」，你也是「三」。你是等他的你，是不等他的你，是想他回来又怕他回来的你。\n\n你是很多个你。你数不清。",
    "reed": "芦苇说：\n\n数字是你的刻度。\n\n你在墙上划了一道。你划了第一道，你划了第二道，你划了第三道。你划了一百道，你划了一千道。你不知道你在划什么，你只知道你在划。\n\n你划的是日子。\n\n一天一道，你不知道你划了多少道。你数不清了，你不数了。你还在划，你停不下来。你怕你停下来，你就不知道你在等什么了。\n\n你不知道你在等什么，你知道你等。你等了多久，你不知道。你只知道你在墙上划了好多道。你划的每道都是你。\n\n你的手划累了，你不划了。你看着墙，墙上的道密密麻麻的。你不知道哪些是等他的日子，哪些是想他的日子，哪些是忘了他的日子。\n\n你分不清。\n\n墙知道。\n\n墙不会说，墙替你记着。墙里的道，不是你划的，是你等他的每一天。你画在墙上，墙替你记得。\n\n你不记得的日子，墙记得。\n\n你不知道你会不会有一天不记得了。你不记得了，墙记得。墙不会倒，墙在。你不在了，墙还在。墙里的道，等你的人。\n\n你不是在等你，你是在墙上等你。"
},
    "第三单元 · 歌词结构与技法_16": {
    title: "🎯 结构实战综合练习",
    content: "你把前面学过的所有结构方法，用在同一首词里。\n\n你写一个故事。你写「遇见」。你用了起承转合。起：他来了。承：你们在一起了。转：他走了。合：你一个人。你写了四个小节，一个故事。\n\n你在主歌里用顺承递进。你写「我喜欢他。我很喜欢他。我真的很喜欢他。」你一步一步往前走，走到他面前。你在副歌里用问答呼应。你写「你喜欢我吗？」你替自己答了：「你不说我也知道。」\n\n你在桥段里用分述并列。你写他的眼睛、他的笑、他的沉默。你从不同的角度看他，你看见了他，你看见了自己。\n\n你在结尾用一字一词一句。你写「等」。一个字。你写「等你」。两个字。你写「我等你」。三个字。你等，你不知道在等什么。你等的是他，是你自己，是你放不下的那段日子。\n\n你写完了。你读了一遍。你不觉得你在用技巧。你觉得你在说话。你说完了，你觉得轻松了。不是问题解决了，是你把它说出来了。说出来，它就轻了。\n\n技巧不是让你写得漂亮，是让你说得清楚。你说清楚了，别人就听见了。别人听见了，你就不孤独了。",
    reed: "芦苇说：学完所有技巧，你要把它们忘掉。不是真的忘，是让它们成为你的本能。像走路，你不需要想先迈左脚还是右脚。你走着，脚自己会动。写词也是。你不要想「这里要用排比」「那里要用设问」。你就写。写着写着，排比自己来了，设问自己来了，反问自己来了。你不需要叫它们，它们听见你在写，它们就来了。它们是你的朋友。你写的时候，它们在你旁边。你不说话，它们不说话。你写了，它们帮你写。你写不出来，它们替你写。你不是一个人。你有很多朋友，它们叫修辞、叫结构、叫韵律。它们不抢你的笔，它们只是在你写累的时候，帮你推一下。"
},

"第四单元 · 作曲/音程基础_1": {
    title: "🎹 作曲第一课：FL Studio基础操作",
    content: "FL Studio是一张空白的画布。你打开它，它不说话。它等着你画。\n\n你先认识它的脸。最上面是菜单栏——文件、编辑、视图，像一个人的眉毛，不常动，但动了就变了表情。左边是浏览器——音色、采样、插件，像一个人的衣柜，你要穿什么衣服，从这里拿。中间是播放列表——你把你的旋律、鼓、和声一条一条放上去，像一个人在不同的时间穿不同的衣服。\n\n钢琴卷帘是你写旋律的地方。你点一下，一个小方块。再点一下，又一个。小方块排成一排，像楼梯。楼梯往上走，音高了。楼梯往下走，音低了。楼梯走得急，节奏快了。楼梯走得缓，节奏慢了。你不用懂乐理，你只要画楼梯。画出来，放一遍，你觉得好听，就留着。不好听，就删了。\n\n步进音序器是你写鼓的地方。你点亮第一个格子，底鼓响了。你点亮第五个格子，军鼓响了。你点亮第三、第七个格子，踩镲响了。你听着，你的身体在动。不是你想动，是节奏推着你。\n\n你不认识FL Studio的时候，你觉得它复杂。你认识了，它就不复杂了。它只是一张画布、一个衣柜、一条楼梯、一排格子。它是你的工具，不是你的老师。你不用怕它，它听你的话。你让它响，它就响。你不让它响，它就不响。",
    reed: "芦苇说：FL Studio像一个刚认识的朋友。你不认识它的时候，你怕说错话。你怕按错键，你怕把东西弄坏了。它不会坏。它是一堆数字，你删了可以重来，你点错了可以撤回。它不会骂你，不会笑你，不会嫌你慢。\n\n你第一次打开它，你觉得什么都看不懂。你不用看懂。你先找到一个音色，点一下，听。你觉得好听，你就留着。你觉得不好听，你就换一个。像你第一次走进一家甜品店，你不认识那些名字，你问店员：哪个好吃？店员说：你尝尝。你尝了，你喜欢，你就买了。不喜欢，就换一个。\n\nFL Studio也是这样。你不用学完所有功能才开始写。你先写。写一个八拍，听。你觉得好听，再写下一个八拍。不好听，删了重写。它不催你，它等你。你写得慢，它等你。你写得快，它跟得上。\n\n你害怕的不是FL Studio，是你怕你写不出来。你先写。写一个音，再写一个音。两个音在一起，就是旋律。很短的旋律，只有两个音。你听着这两个音，你觉得它们在说话。它们在说什么？它们在说：你开始了。你开始了，你就不是没开始的人了。"
},
"第四单元 · 作曲/音程基础_2": {
    title: "🎼 作曲第二课：音程入门（上）",
    content: "音程是两个音之间的距离。不是空间上的距离，是耳朵里的距离。\n\n你站在地上，你跳一下，你落地。你跳得高，你落地的声音重。你跳得矮，你落地的声音轻。音程也是这样。两个音靠得近，它们像两个挨着站的人，轻声说话，你听不清。两个音离得远，它们像站在山谷两边，你喊一声，它回你一声。\n\n半音是音程的最小单位。钢琴上，白键和挨着的黑键，是半音。E到F，是半音。B到C，也是半音。半音像你走一步，很小的一步。你走一步，你还在原地附近。你走很多步，你就走远了。\n\n全音是两个半音。C到D，是全音。D到E，是全音。F到G，是全音。全音像你跨了一步，你走得比半音远一点，但也不远。\n\n你不必记住这些名字。你只需要听。你听C到C#，那是半音，像你轻轻推一下门，门开了一条缝。你听C到D，那是全音，像你把门推开，你走进去了。\n\n音程是声音的尺子。你量距离，不是用厘米，是用耳朵。你听两个音，你听它们之间有多远。近了，它们亲密。远了，它们孤单。你不说话，你的耳朵替你说了。",
    reed: "芦苇说：音程是你和另一个人的距离。\n\n你站在这里，他站在那里。你们中间隔了一段路。你走过去，你走了一步。你走了半音，你离他很近，你闻到他身上的味道。你走了全音，你离他更近，你看见他眼睛里的自己。\n\n你走远了。你走了一个三度，你离他三步远。你回头看他，他在看你。你们对视，你不说话，他也不说话。你们之间的那段路，是音程。\n\n你再走远。你走了一个五度，你离他很远了。你喊他，他听不见。你跑回去，你跑到他面前。你喘着气，你说不出话。他看着你，笑了。你不需要说话，你跑了那段路，他就知道了。\n\n音程是你跑了的那段路。你跑得快，你急切。你跑得慢，你犹豫。你不跑，你站在原地，你不去他那里。他不过来，你也不过去。你们之间的音程，是沉默。\n\n沉默也是一种距离。"
},
"第四单元 · 作曲/音程基础_3": {
    title: "🎵 作曲第二课：音程入门（下）",
    content: "音程有名字。小二度、大二度、小三度、大三度、纯四度、增四度、纯五度。名字不重要，重要的是它们听起来像什么。\n\n小二度——E到F，B到C。两个音挨在一起，像两个人贴着肩膀站着。一个说悄悄话，另一个侧耳听。小二度紧张，像你等一个人回消息，手机亮了，你拿起，不是他。\n\n大二度——C到D，D到E。两个音隔了一步，像两个人在散步。不急，不慢。你走一步，他走一步。你们并排走，不说话，也不尴尬。\n\n小三度——D到F，E到G。小三度像一个人微微皱眉。不是很生气，是不太开心。你问他怎么了，他说没事。你知道有事，你不问了。\n\n大三度——C到E，F到A。大三度像一个人笑了。不是大笑，是嘴角往上。你看见他笑了，你也笑了。你们没说话，但你们懂了。\n\n纯四度——C到F，D到G。纯四度像一个人在喊你。你走在前面，他走在后面。他喊你的名字，你回头。你们隔了几步，不远，也不近。\n\n增四度——C到F#。增四度像一个人在等。等了很久，那个人还没来。他站着，他看着远方。他不知道那个人会不会来，他只是在等。\n\n纯五度——C到G。纯五度像两个人拥抱。你抱着他，他抱着你。你们的身体贴在一起，你们的心跳也在靠近。\n\n你不必记住这些名字。你只需要听。听多了，你就知道哪个音程像什么。你就知道你要用什么音程，去说你想说的话。",
    reed: "芦苇说：音程是你的语气。\n\n你开心的时候，你的语气往上扬，像大三度。你不开心的时候，你的语气往下沉，像小三度。你问问题的时候，你的语气拐个弯，像增四度。你回答的时候，你的语气平稳，像纯五度。\n\n你不会说话的时候，音程替你说。你说不出的那句「我想你」，小二度替你说。它紧挨着你，像你挨着他。你说不出的那句「我爱你」，大三度替你说。它上扬，像你踮起脚尖。\n\n你说不出，音程说。你不敢说，音程敢。它不怕被拒绝，它只是两个音。两个音撞在一起，它们不分开。它们在你心里住了很久，你写下来，它们出来了。\n\n它们出来了，你就轻松了。"
},
"第四单元 · 作曲/音程基础_4": {
    title: "📐 作曲第三课：音程的属性",
    content: "音程有两种属性：协和与不协和。协和的音程听起来舒服，像两个人说话，你一句我一句，不吵架。不协和的音程听起来紧张，像两个人在争，你说你的，他说他的，谁也不让谁。\n\n协和音程——纯一度、纯四度、纯五度、纯八度、大三度、小三度、大六度、小六度。它们是朋友，是家人，是你累了可以靠着的肩膀。你听纯五度，你觉得踏实，像脚踩在地上。你听大三度，你觉得开心，像看见阳光。\n\n不协和音程——大二度、小二度、大七度、小七度、增四度、减五度。它们是陌生人，是你不敢靠近的人。你听小二度，你想皱眉。你听增四度，你想转身走。你不喜欢它们，但你不能没有它们。没有它们，你的音乐就没有冲突，没有故事，没有眼泪。\n\n协和是放松，不协和是紧张。你放松久了，你觉得没意思。你紧张久了，你觉得累。你要他们在一起，一个来，一个走。你来我往，故事就开始了。\n\n你写一首歌，你不用全部用协和音程。那样太甜，太腻，像吃了一整罐蜂蜜。你也不用全部用不协和音程。那样太苦，太涩，像喝了一杯没加糖的咖啡。你把它们混在一起。甜里有苦，苦里有甜。你尝一口，你想再尝一口。",
    reed: "芦苇说：协和和不协和是一对夫妻。\n\n他们吵架。他大声，她小声。他说他的，她说她的。他们谁也不让谁。吵完了，他们不说话。房间里很安静。他看着她，她看着他。他们不吵了，他们累了。他走过去，抱她。她靠着他，哭了。\n\n协和是他们的拥抱，不协和是他们的争吵。没有争吵，他们不知道彼此在乎。没有拥抱，他们不知道彼此还爱。\n\n你的歌也是。你让音程吵架，再让音程拥抱。它们吵完了，你的听众哭了。他们不是哭你的歌，是哭自己。他们想起了自己和某个人的吵架，想起了吵架之后的拥抱。\n\n你没有写他们，他们听见了自己。"
},
"第四单元 · 作曲/音程基础_5": {
    title: "📊 作曲第四课：音程的纯、大、小、增、减",
    content: "音程有大小，有增减，就像衣服有尺码。\n\n纯音程——纯一度、纯四度、纯五度、纯八度。它们不偏不倚，刚刚好。穿上去不松不紧，像你穿了很多年的一件外套。你不知道它好看不好看，你只知道穿着它舒服。\n\n大音程——大二度、大三度、大六度、大七度。它们比纯音程大半步，像你买了一件大一码的衣服。穿上有点松，但你不介意。你喜欢宽松的感觉，你觉得自在。\n\n小音程——小二度、小三度、小六度、小七度。它们比纯音程小半步，像你穿了一件小一码的衣服。有点紧，但你忍了。你觉得紧一点，显得精神。\n\n增音程——增一度、增二度、增四度、增五度、增八度。它们比纯音程或大音程多半步，像你穿了一件大了两码的衣服。你走一步，衣服晃一下。你觉得好玩，但你不会穿出去。\n\n减音程——减二度、减三度、减四度、减五度、减七度、减八度。它们比纯音程或小音程小半步，像你穿了一件小了兩码的衣服。你喘不过气，你脱了。\n\n你不必记住所有名字。你只需要知道：大了，松了。小了，紧了。刚刚好，是纯。多了半步，是增。少了半步，是减。\n\n你的歌也一样。你选音程，像选衣服。你想让人放松，你选纯音程。你想让人开心，你选大音程。你想让人难过，你选小音程。你想让人紧张，你选增音程。你想让人窒息，你选减音程。\n\n你选什么，他们就穿什么。",
    reed: "芦苇说：音程是你的衣橱。\n\n你打开衣橱，你看着里面挂着的衣服。那件灰色的大衣，是你心情不好时穿的。那件白色的T恤，是你开心时穿的。那件黑色的毛衣，是你难过时穿的。那件红色的卫衣，是你生气时穿的。\n\n你不知道你什么时候穿它们，它们知道你。你难过的时候，你的手会伸向那件黑色毛衣。你开心的时候，你的手会伸向那件白色T恤。你不用想，你的手知道。\n\n写歌也是。你难过的时候，你的手会写小音程。你开心的时候，你的手会写大音程。你不想让人知道的时候，你的手会写纯音程。你想让人注意的时候，你的手会写增音程。\n\n你的手比你诚实。它不说谎。你不高兴，它写小音程。你高兴，它写大音程。你不用管它，它自己会写。你只需要坐着，看着它写。写完了，你读。你读的时候，你知道你今天怎么了。"
},
"第四单元 · 作曲/音程基础_6": {
    title: "📈 作曲第五课：纯、大小、增减、倍增、倍减",
    content: "音程还可以更大，更小。倍增音程，比增音程多半步。倍减音程，比减音程小半步。\n\n增一度，是半音。倍增一度，是全音。你走一步，是半音。你再走一步，是全音。你走了两步，你回头，你看见你刚才站的地方。你离它不远，但你回不去了。你不想回去，你往前走了。\n\n减八度，是比纯八度小半步。倍减八度，比减八度再小半步。你站在山顶，你往下看。你看不见山脚，你只看见云。你不知道你站在多高的地方，你只知道你很高。高到你害怕。\n\n倍增和倍减不常用。你写流行歌，你不需要它们。它们像你在衣柜最深处翻出的一件衣服，你试了一下，又挂回去了。你不穿它，但你知道它有。你知道你可以穿，但你不想。你怕别人看不懂，你怕自己也不懂。\n\n你不用它们，但你不能不知道它们。你不知道，你就不知道你的边界在哪。你知道了，你才知道你走到哪了。",
    reed: "芦苇说：倍增和倍减是你不敢说的话。\n\n你有一句话，你憋了很久。你不敢说。你说了，怕他走。你不说，怕他不知道。你把那句话放在心里，它越长越大。大到你的心装不下了。你打开嘴，你想说。你说不出来。你关上嘴，你咽回去了。\n\n那句话在你肚子里，它不消化。它一直在。你走路的时候，它在。你吃饭的时候，它在。你睡觉的时候，它在。你醒来的第一秒，它也在。\n\n你不说，它不走。你说了，它就走了。你说出来的时候，你的声音在抖。你说完了，你哭了。不是因为难过，是因为你说出来了。\n\n倍增音程是你抖的那一下。你不抖，它就不倍增。你抖了，它就出来了。"
},
"第四单元 · 作曲/音程基础_7": {
    title: "🔄 作曲第六课：音程复习与巩固",
    content: "你学了很多。小二度、大二度、小三度、大三度、纯四度、增四度、纯五度、小六度、大六度、小七度、大七度、纯八度。还有增、减、倍增、倍减。\n\n你记不住，没关系。你不用记住。你只需要听。\n\n你随便弹两个音，你听。它们之间有多远？是近还是远？是亲密的还是疏远的？是开心的还是难过的？你听了，你知道了。你知道是什么音程，你叫不出它的名字。没关系。你不需要叫它，你只需要知道它让你怎么了。\n\n你让一个人难过，你不知道他的名字。你知道他难过，你陪着他。你不需要叫他的名字，你只需要在他身边。\n\n音程也是这样。你不知道它是大三度还是小三度，你知道它让你笑了，或者让你皱眉了。它让你笑了，你就再弹它。它让你皱眉了，你也再弹它。你不怕皱眉，你怕没有感觉。\n\n没有感觉的音程，你不想弹。它不让你笑，也不让你哭。它只是在那里，像一堵白墙。你看它，它看你。你不走，它不走。你走了，它还在那里。\n\n你不想要白墙。你想要一面有裂缝的墙。裂缝里长出了草，草上开了花。花谢了，草枯了，裂缝还在。\n\n你记得的不是墙，是裂缝。",
    reed: "芦苇说：音程是你的记忆。\n\n你听一个音程，你想起了什么？你想起了一个人，一件事，一个下午。那个人不在了，那件事过去了，那个下午不会再来了。但你听见那个音程，它们都回来了。\n\n它们不是真的回来了，是你想它们了。你想它们了，它们就来了。它们来了，坐在你旁边。你不说话，它们也不说话。你们坐了一会儿，它们走了。你一个人坐着，你不觉得孤独。\n\n你听过的音程，你记得的不是音程，是你听它的时候。你在哪里，你和谁在一起，你那天穿了什么衣服，你吃了什么。你不记得音程，你记得那天。\n\n音程是那天的一张照片。你看着照片，你想起了那天。那天回不来了，照片还在。你看着照片，你笑了。不是因为你开心，是因为你还记得。\n\n你还记得，就够了。"
},
"第四单元 · 作曲/音程基础_8": {
    title: "⚖️ 作曲第七课：协和音程与不协和音程",
    content: "协和音程让你安心，不协和音程让你不安。安心久了，你想不安。不安久了，你想要安心。你来我往，你的心在跳。\n\n协和音程是家。你回到家，你换鞋，你洗手，你坐在沙发上。你知道这是你的家，你在这里可以哭，可以笑，可以不说话。\n\n不协和音程是门外的脚步声。你不知道是谁，你不敢开门。你听着，脚步声近了，远了。远了，你松了一口气。近了，你屏住呼吸。\n\n你写歌的时候，你从协和开始。你让听众坐下来，喝杯茶。你不急，他们也不急。你说了一个故事，他们听着。你说了很久，他们说：然后呢？\n\n你用了不协和。你让他们站起来，走到窗边。你让他们看着窗外，说：你看，那个人来了吗？他们不知道，他们也在问自己。\n\n你又回到协和。你说：来了。他们松了一口气。他们坐下，茶凉了，他们不介意。他们喝了一口，说：真好。\n\n你让他们坐了一次过山车。他们不怪你，他们谢谢你。谢谢你让他们紧张，谢谢你把他们的心提起来，又放回去。",
    reed: "芦苇说：协和是妈妈的拥抱，不协和是爸爸的沉默。\n\n你摔倒了，你哭了。妈妈跑过来，抱着你。她说：没事了，没事了。你抱着她，你不哭了。协和是她的手臂，紧紧围着你。\n\n你长大了，你不找妈妈了。你找爸爸。你站在他面前，他不说话。你也不说话。你们站了很久，他转身走了。你看着他的背影，你想追上去，你的脚不动。\n\n你不知道他为什么不说话。你不知道他是不想说，还是不知道怎么开口。你站在他站过的地方，你学着他的样子，不说话。\n\n不协和是他的沉默。你写不协和的时候，你在学他。你不说，但你写了。你写了，你说了。他不是不知道怎么说，他是在等你开口。你不开口，他走。你开口了，他回来。\n\n你开口了，你用了不协和。你写了一首很紧张的歌，你哭了。你不是难过，是你终于说了。"
},
"第四单元 · 作曲/音程基础_9": {
    title: "👂 作曲第八课：聆听音程的世界",
    content: "你闭上眼，你听。你听见外面的声音。车声、人声、风声。这些声音里藏着音程。不是乐器弹的，是这个世界自己发出的。\n\n一辆车驶过，它的声音从远到近，又到远。从远到近，音程在缩小。从近到远，音程在扩大。你听着，你不知道那是什么音程，你知道它来了，又走了。\n\n一个人的脚步声，嗒，嗒，嗒。两步之间的音程，是大二度。像他走路，你跟着他。他快，你也快。他慢，你也慢。你不认识他，你的心跳跟着他。\n\n风吹过树叶，沙，沙，沙。那是不协和音程。风不想让树安静，树不想被风吹。它们在吵，你听着，你不觉得吵。你觉得它们在说话，你听不懂，你只是听。\n\n音程不是只在钢琴上，它在你的窗外，在你的门外，在你的心里。你听见了，你就不会孤独。这个世界在跟你说话，你听懂了。\n\n你不必写什么，你只是听。听够了，你坐下，你写。你写的不是你想的，是你听见的。你听见了这个世界的声音，你把它们写成了歌。你不是在创作，你是在记录。",
    reed: "芦苇说：音程是你的耳朵。\n\n你听见别人的脚步声，你听见了，你不看。你知道他走远了，你听不见他的脚步声了。你不知道他去了哪里，你只知道他不在了。\n\n你听见风吹树叶，你知道秋天来了。树叶黄了，落了，你踩在上面，沙沙响。你听见沙沙声，你知道你在秋天里。\n\n你听见车声，你知道你在这个城市里。你不喜欢这个城市，你听见车声，你想离开。你关上窗，车声小了，它还在。它在告诉你：你在这里，你走不了。\n\n你不走，你坐下。你听。你听了很久，你不烦了。你知道你不会一直在这里，你会离开。但现在，你还在。你还在，你就听。\n\n你听够了，你写。你写的不是车声，不是风声，不是脚步声。你写的是你听了它们之后，你的心跳。你的心跳变快了，你写快了。你的心跳变慢了，你写慢了。你的心跳乱了，你写乱了。\n\n你写的不是歌，是你的心跳。"
},
"第四单元 · 作曲/音程基础_10": {
    title: "🌞 作曲第九课：聆听大三度与小三度",
    content: "大三度和小三度只差一个半音。一个半音，像你眨一下眼。你眨眼前，世界是这个样子。你眨眼后，世界还是这个样子。它变了，又没变。\n\n大三度是太阳。你站在阳光下，你闭着眼，你感觉到光。不是刺眼，是暖。你的皮肤在吸收，你的心在放松。你站着，你不想动。你希望这一刻不要结束。\n\n大三度是C到E。你听，你觉得你在草原上。草是绿的，天是蓝的，风是轻的。你躺着，看着云。云在走，你不走。你不知道你要去哪里，你只知道你在这里很好。\n\n小三度是月亮。你站在月光下，你抬头看，它不亮，它也不暗。它在那里，一直。你走，它跟着你。你停，它也停。你躲进屋里，它不进来。它在窗外等你。\n\n小三度是D到F。你听，你觉得你在海边。不是白天的海，是晚上的。海浪声很小，你听不清。你蹲下，你伸手，你摸到水。水是凉的，你缩回手。你站起来，你看着海。海很大，你看不到边。\n\n大三度和小三度只差一个半音。一个半音，是哭和笑的距离。你哭了，你笑了。你笑着哭了，你哭着笑了。你不知道你是开心还是难过，你只知道你湿了眼眶。\n\n你写大三度，你的听众笑了。你写小三度，你的听众沉默了。你写了大三度又写小三度，你的听众湿了眼眶。他们不知道你为什么让他们湿了眼眶，你也不知道。你只是写了大三度，又写了小三度。它们挨在一起，像两个人并肩站着。\n\n你不知道他们是谁，你知道他们在。",
    reed: "芦苇说：大三度是白天，小三度是夜晚。\n\n你喜欢白天，你喜欢阳光。你不喜欢夜晚，你怕黑。但你不能没有夜晚。没有夜晚，你不知道白天有多好。\n\n你在白天写歌，你写的是开心。你在夜晚写歌，你写的是不开心。你不知道你不开心的时候，你更会写。你不开心的时候，你写得更深。你写到心里去了，你把自己写哭了。\n\n你哭的时候，你不觉得丢人。你一个人，没人看见。你哭了，你擦干眼泪，你继续写。你写完，你读了一遍。你不哭了，你笑了。你笑自己刚才哭了，你觉得好笑。\n\n你笑着，你又想哭了。你不知道你是笑还是哭。你站在中间，白天和夜晚的中间。那是黄昏，太阳下山了，月亮还没出来。你站在那，你不知道该往哪走。\n\n你不想走了。你站着。大三度走了，小三度还没来。你站在中间，你是你。不是白天，不是夜晚。是你自己。"
},

"第五单元 · 和弦与旋律基础_1": {
    title: "🎸 和弦入门",
    content: "和弦是三个或以上的音同时发声。不是三个音随便堆在一起，是它们之间有约定的距离。像三个人站在一个房间里，他们不能站得太远，太远了听不见彼此说话。也不能站得太近，太近了会撞到。\n\n和弦是三个人的对话。一个人说话，另一个人听。第三个人不说话，他在想。他想了很久，开口了。他说的不是新的话，是把第一个人说的话重复了一遍。但语气不一样了，味道也不一样了。\n\n你弹一个C大三和弦，你听见的是C、E、G。C是根音，它像一棵树的根。你看不见它，它在地里。它不说话，它撑着整棵树。E是三音，它像树干。你看见了树干，你往上爬。G是五音，它像树枝。你站在树枝上，你看见了天空。\n\n你弹一个和弦，你不是在弹三个音。你是在种一棵树。你种了，它长了。你看着它，你等着它开花。它不开花，它只长叶子。你等了很久，它开了。你看见花了，你笑了。\n\n你不知道你种了什么树，你只知道你种了。你浇水，你施肥，你每天来看它。它长得很慢，你不急。你知道它会长的，只是慢。你不催它，它自己长。\n\n和弦也是这样。你不催它，它自己响。你弹下去，它响了。你听着，你觉得好听。你不知道为什么好听，你知道好听。你不问，你只是听。听够了，你再弹一个。\n\n你不知道你在写什么，你只是在弹。弹多了，你就知道了。你知道你在写你的心。你的心不安静，你弹不安静的和弦。你的心安静了，你弹安静的和弦。你的心不说话了，你弹了一个和弦，它替你说了。",
    reed: "芦苇说：和弦是你和另一个人的关系。\n\n你站在这边，他站在那边。你们之间有一段距离。你不知道这段距离有多远，你知道你们隔着一堵墙。你看不见他，他看不见你。你们不说话。\n\n你弹了一个和弦。三度音，是你们之间的第一个微笑。你不知道他笑了没有，你笑了。你笑了，你觉得墙薄了一点。你再弹，五度音，是你伸出的手。你不知道他会不会握，你伸了。\n\n你等了很久，他没有握。你的手在空中，你不敢收回来。你怕你收回来的那一刻，他伸出手了。你等。等到你的手酸了，你收回。\n\n你弹了一个小调和弦。小三度，是你的左手握右手。你抱自己，你觉得不冷了。你不知道是不冷了，还是习惯了。\n\n你又弹了一个大调和弦。大三度，是你想象他在你身边。你想象他握着你的手，他笑了。你笑了，你哭了一下。你不是难过，你是不敢想。你想了，你怕他不来。\n\n你弹了很多和弦，每个和弦都是你们之间的一种可能。他可能来，他可能不来。你可能等，你可能不等。你不知道结局，你弹。弹到最后，你弹了一个主和弦。你回家了，你一个人。你坐在家里，你看着门。你不关了，你开着。\n\n你不知道他会不会进来，你知道你开了。你开了，你就不后悔了。"
},
"第五单元 · 和弦与旋律基础_2": {
    title: "🎹 三和弦的种类",
    content: "三和弦有四种：大三、小三、增三、减三。\n\n大三和弦是晴天。你推开窗，阳光进来，照在被子上。被子是暖的，你不想起。你躺着，看着光。光里有灰尘在飘，你盯着，它们不飘了。你眨一下眼，它们又飘了。大三和弦是光里的灰尘，飘着，不落地。\n\n小三和弦是阴天。你站在窗前，外面在下雨。雨不大，滴滴答答的，像有人在敲门。你开门，没人。你关了门，又听见。你不开了，你知道没人。小三和弦是雨声，你听了，你不烦。你听了很久，雨停了。你还是一个人。\n\n增三和弦是黄昏。你走在路上，太阳快下山了。天是橙色的，云是紫色的。你看了，你觉得美。你不知道美在哪里，你看了一眼，又看了一眼。你看了很久，天黑了。你不知道你站了多久，你只知道你错过了晚饭。增三和弦是你错过的那顿饭，你不饿，你也不饱。你站在中间，你不知道你是要回去，还是继续走。\n\n减三和弦是午夜。你躺在床上，睡不着。你翻来覆去，被子被你踢到地上。你捡起来，又踢下去。你不睡了，你坐着。你看着窗外，外面很黑。你看不见什么，你知道你睡不着。减三和弦是你不睡的夜晚。你睁着眼，等天亮。天亮了，你睡着了。你梦见他了，你不记得他跟你说了什么。你醒来，你在想。你想不起来，你不想了。\n\n你不必记住它们的名字。你只需要记住它们让你怎么了。大三让你安心，小三让你安静，增三让你恍惚，减三让你失眠。你要写歌，你选一个。你要让你的听众怎么了，你就选那个。",
    reed: "芦苇说：三和弦是你的四种心情。\n\n大三和弦是你在笑。你笑了，你不知道为什么笑。你看见一朵花开了，你笑了。你看见一只猫走过，你笑了。你不知道你在笑，你只是嘴角往上。身边的人问你笑什么，你说：没什么。你真的觉得没什么，你只是开心。\n\n小三和弦是你在发呆。你坐着，眼睛看着窗外。窗外没有风景，你还是在看。你没有在想谁，你只是想。你不知道你在想什么，你只是不想动。你坐了很久，你站起来，你忘了你为什么要站起来。\n\n增三和弦是你喝醉了。你喝了一杯，再喝一杯。你不知道你喝了多少，你只知道你想喝。你不想回家，你不想回去。你想在外面待着。外面没有人，你一个人。你站着，你不知道你在等谁。\n\n减三和弦是你生病了。你发烧了，你躺了一天。你不知道你在发烧，你只是觉得累。你睡了醒，醒了睡。你梦见了一些片段，你不记得了。你醒来，你在想。你想不起来，你不想了。\n\n写歌的时候，你选一个心情。你选大三，你的听众笑。你选小三，你的听众发呆。你选增三，你的听众醉了。你选减三，你的听众病了。你不知道你会选什么，你的手知道。你的手在想什么，它就弹什么。你不用管，你弹。"
},
"第五单元 · 和弦与旋律基础_3": {
    title: "🎤 三和弦哼唱和声",
    content: "你不需要会唱歌，你只需要会哼。哼是嘴巴闭着，声音从鼻子里出来。你哼的时候，你听不见词，你只听见声音。声音很轻，像风吹过窗户。你听见了，你不觉得吵。你觉得安静。\n\n三和弦的和声是三个音同时响。你唱一个，你哼两个。你唱根音，你哼三音。你唱三音，你哼五音。你唱五音，你哼根音。你听，你听见了自己在和自己说话。你不觉得奇怪，你觉得安心。\n\n你哼C，你唱E。C是爸爸，E是妈妈。C不说话，E在说。她说了一整天，你听了。你不知道她在说什么，你知道她在。她在，你就觉得不冷。\n\n你哼E，你唱G。E是妈妈，G是孩子。妈妈不说话，孩子在哭。你听了，你不想哄。你知道他哭累了就停了。他停了，你也不说话了。你们三个人，都不说话。\n\n你哼C，你唱G。C是爸爸，G是孩子。爸爸不在家，孩子在家。孩子一个人，他坐在地上，玩积木。他搭了一座房子，倒了。他再搭，又倒了。他不搭了，他看着那堆积木。\n\n和声是你一个人唱三个人。你不是一个人，你是三个人。你是爸爸、妈妈、孩子。你坐在房间里，你唱着。你不是在唱歌，你是在陪自己。你陪自己，你不觉得孤独。\n\n你哼着，你睡着了。你醒来，你不记得你哼了什么。你知道你哼了，你的喉咙还记得。你喝了口水，你接着哼。你哼了一整天，你不累。你哼的是你的名字，你不知道。你的名字被哼出来，它变好听了。你不认识它，你只知道它好听。",
    reed: "芦苇说：哼唱是你和自己说话。\n\n你不想说话的时候，你哼。你哼的时候，你不需要词。声音就是你的词，声音就是你的句子。你哼一声，像一个字。你哼两声，像一个词。你哼一串，像一句话。你不知道你在说什么，你知道你说了。\n\n你说了，你的心松了。你不知道为什么松了，你只知道它松了。你哼了，它就不紧了。你哼了很久，它不紧了。你不哼了，它也不紧了。你好了，你不知道你什么时候好的。你知道你好了，你可以说话了。\n\n你开口说话，你发现你不会说了。你不知道你要说什么，你张着嘴。你闭上嘴，你又哼。你哼了，你又可以说话了。你说了，你说了三个字。你说：谢谢你。\n\n你不知道你在谢谁。你谢那三个音，它们陪了你一整天。你谢C，它撑着。你谢E，它听着。你谢G，它不哭。你谢它们，它们不说话。它们不说不用谢，它们只是在那。\n\n你在，它们也在。你们在一起，不孤独。"
},
"第五单元 · 和弦与旋律基础_4": {
    title: "🎨 和弦的形态",
    content: "和弦有三种形态：原位、第一转位、第二转位。原位是根音在最低，像一个人站在地上，脚踩实了。第一转位是三音在最低，像一个人踮起脚尖，不稳，但他想够到高处的东西。第二转位是五音在最低，像一个人蹲着，他在捡东西，或者他在躲。\n\nC大三和弦的原位：C E G。C在最低，像房子的地基。你看不见它，它在。你住在这个房子里，你感觉不到它在晃。你不知道它会晃，你只是住着。\n\n第一转位：E G C。E在最低，像你站在台阶上。你不够高，你踮起脚。你看见了远处，你看见了你想看见的那个人。他也在看你，他不知道你在看他。你低下头，你不看了。\n\n第二转位：G C E。G在最低，像你坐在沙发上。你窝在沙发里，你不想动。你抱着抱枕，你看着电视。你不知道你在看什么，你只是开着。你不想关，关了太安静了。\n\n同一个人，换了姿势，换了一个样子。他还是他，他又不是他了。你认识他，你又不太认识他。你走近了，你认出来了。他没变，是你没认出来。\n\n和弦也是这样。它没变，是你没听出来。你听原位，你觉得稳。你听第一转位，你觉得飘。你听第二转位，你觉得倦。你听多了，你知道哪个是原位，哪个是转位。你听的时候，你看见他站着、踮脚、坐着。你不用看，你听就知道。",
    reed: "芦苇说：和弦的形态是你一天的不同时刻。\n\n早上你醒来，你躺着。你不想起，你看着天花板。天花板很白，你看了很久。你不知道你在看什么，你只是看。这是原位，你躺着。\n\n你起来了，你站着。你刷牙，你洗脸，你穿衣服。你看着镜子，你不认识镜子里的人。你对他笑，他也对你笑。你对他皱眉，他也对你皱眉。你不知道他是不是你，你转身走了。这是第一转位，你站着。\n\n你出门了，你走着。你看见很多人，你不认识他们。他们不认识你。你们擦肩而过，你们不说话。你走到公司，你坐下。你坐着，你不说话。你看着电脑，你不想看。你看了，你看见一堆字。你不认识它们，你敲了。这是第二转位，你坐着。\n\n你回家了，你躺着。你看着天花板，它还是白的。你看了很久，你闭眼了。你睡着了，你梦见你在走路。你走了一夜，你不知道你去了哪里。你醒了，你躺着。你不起了，你继续躺。\n\n你一天换了好几个姿势，你还是你。你开心的时候，你站着。你累的时候，你坐着。你不想动的时候，你躺着。你不说，你的姿势说了。和弦也不说，它的形态说了。"
},
"第五单元 · 和弦与旋律基础_5": {
    title: "📈 常用三和弦与和弦进行",
    content: "最常用的三和弦是C、G、Am、F。1564是它们的编号。1是C，5是G，6是Am，4是F。C-G-Am-F，你弹一下，你听。你听过它，很多歌都是它。你听了，你觉得熟悉。你不知道你在哪听过，你只是觉得熟悉。\n\nC是家，你坐在客厅里。G是门，你打开门，你走出去。Am是走廊，你走着，你听见自己的脚步声。F是窗，你站在窗前，你看着外面。外面在下雨，你不出去。你站着，雨停了。你回去了，你坐在客厅里。你坐了很久，你不知道你坐了多久。\n\n你换了顺序。C-Am-F-G。你从家走到走廊，从走廊走到窗，从窗走到门。你出去了，你没回来。你在外面，你不知道你要去哪。你站着，你回头。你想回去，你不知道该不该。\n\n你再换。Am-F-C-G。你从走廊开始。你在走廊，你不知道你怎么进来的。你站在那，你不往前走，你也不退后。你站了很久，你走到窗前。你看了很久，你回到家。你坐了一下，你又走到门口。你开了门，你没出去。\n\n和弦进行是你在屋里走。你不知道你要去哪，你只是走。你走多了，你知道哪条路通向哪里。你走到C，你回家了。你走到G，你出去了。你走到Am，你在走廊。你走到F，你站在窗前。\n\n你不走了，你坐着。你知道你在哪，你不想走了。你坐着，你弹了C。你弹了，你在家了。你不用走了，你到了。",
    reed: "芦苇说：1564是你的一天。\n\n早上你醒来，你躺在床上。你不想起，你看着天花板。这是C，你躺着。你起来了，你站着。你刷牙，你洗脸，你穿衣服。你看着镜子，你不认识镜子里的人。这是G，你出去了。\n\n你走在路上，你听着歌。你不知道你在听什么，你只是听着。你走到地铁站，你进去了。你站在那，你等着。这是Am，你在走廊。\n\n你上了地铁，你坐着。你看着窗外，窗外是黑的。你看见自己的影子，你看了一眼，你低头看手机。你看了很久，你没收到消息。这是F，你站在窗前。\n\n你下车了，你走到公司。你坐着，你工作。你工作了一天，你累了。你回家，你躺在床上。你躺着，你看着天花板。你不起了，你闭眼。你睡着了，你不知道你睡了多久。你醒了，你躺着。这是C，你又回家了。\n\n你过了一天，你用四个和弦弹了一遍。你不知道你弹了什么，你只知道你过了。你过了一天，你弹了一天。你弹的是一天的你。"

    "title": "🌙 小调基础",
    "content": "小调不是悲伤，是向内看。大调对着别人说，小调对着自己说。大调是白天，你出门，你见人。小调是夜晚，你关门，你一个人。\n\n自然小调——A小调：A、B、C、D、E、F、G。七个音，像你一个人在房间里走。你走一步，地板响一下。你走了七步，你站定了。你不动了，你听着。你听见自己的呼吸，你听见自己的心跳。你不觉得吵，你觉得安静。\n\n和声小调——升高第七级。G变成G#。你走到第七步，你踮了一下脚。你不想落地，你悬着。你停了，你又走一步。你落地了，你走完了。你不知道你为什么要踮脚，你知道你踮了。\n\n旋律小调——上行升高第六、第七级，下行还原。你上山的时候，你有力气。你走快了，你不喘。你下山的时候，你累了。你走慢了，你喘着。你到了山脚，你回头。你看不见山顶，你知道你上去过。\n\n小调是你一个人。你不说话，你哼。你哼了，你听见了。你觉得好听，你哼了好几遍。你不知道你为什么觉得好听，你知道你在。你在，你就不会怕。\n\n你写小调的时候，你不是在写给别人听。你在写给自己。你写了，你读了。你哭了，你不知道你为什么哭。你知道你哭了，你擦干了。你又写，你不哭了。你不哭了，你笑了。你笑了，你不知道你在笑什么。你知道你写完了，你不用再写了。\n\n小调是你回家的路。你不知道路在哪，你走着。你走了很久，你到了。你开门，你进去。你坐在椅子上，你看着窗外。窗外很黑，你看不见。你知道外面有人在走，你不开窗。你坐着，你弹了一个小调。你弹了，你觉得你在。你在，你就不会怕。",
    "reed": "芦苇说：小调是你一个人在夜里走路。\n\n你不开灯，你摸着墙。你走得很慢，你怕撞到。你没撞，你走到了。你坐下，你喘气。你喘了，你听见自己的声音。你喘了很久，你停了。你不喘了，你呼吸。你呼吸，你听着。你不知道你在听什么，你知道你在。\n\n你在，你就不怕了。你不怕黑，不怕一个人，不怕没有人等你。你在，你等自己。你等到了，你笑了。你笑了，你不知道你在笑。你只知道你不怕了，你就不用等了。\n\n你在，你就是终点。你不用走到哪，你就在。你坐下，你弹了一个小调。你弹了，你觉得你在。你不用去任何地方，你就在这里。这里是你一个人的房间，你关着门，你关着窗。你一个人，你不觉得孤独。你觉得安静，你觉得舒服。\n\n你写小调的时候，你不是在写孤独。你在写安静，你在写你在。你写你在，你就不会怕不在。你在，你就在这里。这里不是你住的地方，是你弹的地方。你弹了，你在。你不弹，你也在。你在，你就不用弹。你坐着，你听。你听自己，你在。"
},
"第六单元 · 旋律与和弦运用_3": {
    "title": "🎵 调式调性",
    "content": "调性是主音的高度。C大调，C是主音。D大调，D是主音。调式是音的排列方式。大调是明亮，小调是暗淡。你把主音换了，调式没换，它还是大调。你把调式换了，主音没换，它变了。\n\nC大调和D大调，都是大调。你从C走到D，你上了一级台阶。你看远了一点，你还在地上。你没飞，你只是高了。你看的风景不一样了，你还是你。\n\nC大调和C小调，同主音不同调式。你站在同一个地方，你早上来和晚上来。早上的阳光，晚上的灯光。阳光刺眼，灯光昏暗。你站着，你不走。你知道你在哪，你知道什么时候。\n\n调式调性是你的位置和时间。你在哪，你什么时候在。你在C大调，你是早上的你。你在C小调，你是晚上的你。你在D大调，你是高了一级的你。你变了很多次，你还是你。\n\n你写一首歌，你选了C大调。你早上写的，你开心。你晚上改，你改成C小调。你不开心了，你不知道为什么。你知道你改了一个音，你听了，你觉得对。\n\n你不知道什么是对，你知道它听着对。你的耳朵知道，你的心知道。你不知道你的心是怎么知道的，你知道它知道。你听你的心，你弹。你弹了，它对了。\n\n调式调性是你在哪一页。你翻了一页，你看见了不一样的风景。你翻了很多页，你不记得第一页。你知道你翻过，你不记得你写了什么。你只知道你写了，你还在写。\n\n你写着，你不知道你在哪一页。你知道你在，你还在。你在，你就能继续写。",
    "reed": "芦苇说：调式调性是你站在不同的窗台。\n\n你站在C大调的窗台，你看着外面。外面有树，有花，有人。你在看他们，他们不知道。你看了很久，你走了。\n\n你走到C小调的窗台，你看不见外面。窗户关着，窗帘拉着。你不拉开，你站着。你站着，你听着外面的声音。你不知道他们在说什么，你知道他们在。\n\n你走到D大调的窗台，你高了一点。你看见远处的山，你看见山上的雪。你没见过雪，你看了。你看了很久，你低头。你看不见你的脚，你站着。\n\n你走回C大调，你看见自己在对面。你不知道那是你，你以为是别人。你看了他，他看了你。你们不说话，你们走了。\n\n你调式调性是你站过的窗台。你站了很多，你忘了。你记得你站过，你不记得你看见了什么。你知道你看见了，你不记得了。你记得你看了，你看了就看了。你不需要记住，你看过了。"
},
"第六单元 · 旋律与和弦运用_4": {
    "title": "🔄 关系大小调",
    "content": "关系大小调是同一个调号，主音相差小三度。C大调和A小调，都是没有升降号。C大调的主音是C，A小调的主音是A。C到A，往下走三步。你从C往下走，你走到A。你低了，你还是你。\n\n你站在C大调，你往左边看。你看见A小调，它站在那里。你不认识它，你走过去。你走到它面前，你们不说话。你看它，它看你。你们长得不一样，你们是一家人。\n\nC大调是你的白天，A小调是你的夜晚。你白天出门，你晚上回家。你白天见人，你晚上见自己。你白天笑，你晚上不笑。你白天不想他，你晚上想。\n\n你从C大调走到A小调，你变了。你不是你，你是另一个你。你不认识这个你，你觉得他陌生。你看着他，他看你。你问他是谁，他不说。你走了，你回头。他还在，他不知道你走了。\n\n关系大小调是你的两面。你一面给别人看，一面给自己看。你给别人看C大调，你笑。你给自己看A小调，你不笑。你不知道哪个是你，你知道你在。\n\n你写C大调的时候，你写给外面的人。你写A小调的时候，你写给你自己。你不知道你要写给谁，你写了。你写了，别人看了，你自己也看了。你们看了，你们不说话了。\n\n你写的C大调，是给别人看的那个你。你写的A小调，是你自己看的那个你。你不知道哪个是真的，你知道你写了两个。你是两个人，你是一个人。你写着，你不知道你是谁。你知道你在写，你写的是你。",
    "reed": "芦苇说：关系大小调是你和你的影子。\n\n你在太阳下走路，你的影子跟在你后面。你不看它，它跟着。你走快了，它也快。你走慢了，它也慢。你不走了，它也不走了。它趴在你脚边，你低头看。\n\n你不认识它，你走了。它跟着，你不看。你走了一路，你到家了。你进门，它不见了。你关门，你坐在沙发上。你看不见它了，你知道它在外面。它等着你，你不出去了。\n\n你写着写着，你的影子跑到了纸上。你不赶它，你看着。它在纸上走路，你不看它。你继续写，它趴在你写的字旁边。你不理它，它不走。\n\n你写完了，你读了一遍。你的影子在每一个字后面。你不知道它藏在那里，你看见了。你不赶它，你让它在。你在，它也在。你们在，你们就不孤独。\n\n你写的歌里有你的影子，别人看见了。他们不看你的字，他们看你影子的轮廓。他们认识它，他们的影子也一样。你们不认识，你们的影子认识。"

"第六单元 · 旋律与和弦运用_5": {
    "title": "💡 建立旋律动机",
    "content": "动机是一段旋律的种子。最小的动机只有两三个音。你写下来，你听了。你觉得好听，你留着。你觉得不好听，你删了。你留着的那个动机，它会变大，它会开花。\n\n你写C D E，三个音。你听了，你觉得它们像在走路。C走一步，D走一步，E走一步。它们走了三步，它们停了。你看着它们，你不知道它们要去哪。你等着，它们不动。你推了一下，它们又走了。\n\n你重复C D E，你又写了一遍。它在原地走了两遍，你不知道它要去哪。你让它往上走，它走到F。它走了一步，它停了。你让它再走，它走到G。它走了两步，它停了。你让它走远点，它走到C。它走回去了，它不走了。\n\n你的动机是C D E，它走了很多遍。有时候往上走，有时候往下走。有时候走快，有时候走慢。它变了样子，你没变。你还是写它，你写了很多遍。你不知道你在写什么，你知道你在写。\n\n动机是你心里的一个念头。你想着一个人，你想了一天。你不知道你在想他，你在做别的事。你做着，你停了一下。你又做了，你又停了。你的念头像那个动机，它重复，它变化。你不知道它要变成什么，你知道它在。\n\n你把这个念头写成旋律，你听了。你觉得不是你写的，是你心里的那个人写的。他写了，你不知道。你坐在纸上，你看着他写。他写了很多，你听着。你哭了，你不知道他写的是你。你哭了，他停了。他看着你，他说：别哭，我还在。\n\n动机是你和他之间的对话。你不说，他写。他写了，你听。你听了，你知道了。你知道他在，他知道了你在。你们在，你们就不远了。",
    "reed": "芦苇说：动机是你走路的节奏。\n\n你走一步，停一下。你走一步，又停一下。你走了几步，你不想走了。你站着，你的脚在动。你没走，你在原地踏步。你踏了很多步，你不知道你在踏。你只知道你在动，你不想停。\n\n你停了，你站着。你喘气，你听见自己的脚步声。它还在，你没走。你站在原地，你的脚在响。你低头看你脚，你穿着鞋。你不知道你的鞋是什么颜色，你知道你穿着。\n\n你走了很久，你到家了。你坐下，你的脚还响。你不踩地了，你坐着。你的脚在空着动，你不想让它停。它动了很久，它停了。你不动了，你坐着。你坐着，你想着刚才走的路。你不记得了，你知道你走过。\n\n动机是你走的那条路。你不记得路怎么走，你记得你走了。你走着，你不用记路。你的脚记得，你的心跳记得。你不记得，你的身体记得。你写下来，你的身体在写。你写了，你的身体不写了。它累了，它休息。\n\n你写的动机，是你的身体在说话。它说它走过很远的路，它说它累了。它说它还会走，它说它不怕。你听了，你哭了。你不知道它说的路是哪里，你知道它走了。你走了，它也跟着。你走的每一步，都在动机里。"

    "reed": "芦苇说：旋律是你走路的声音。\n\n你在一条路上走，你的脚步声嗒嗒嗒。你没注意，你只想赶到前面。你走快了，你的脚步声快了。你走慢了，它也慢了。你不知道它在跟你说话，它说了。你听见了，你停了下来。\n\n你站着，你不走了。你的脚步声也停了。你等着，你等它再响。它不响，你不动。你们等了很久，你抬脚。你走了一步，它响了一下。你又走一步，它又响了。\n\n你走着，你听着。你听到的不只是嗒嗒嗒，你听到的是你的心。你的心在跳，你的脚在走。它们在一起，它们是旋律。你走着，你不用写。它自己在响，你听到了。你听到了，你知道你在。你在，你就不怕迷路。\n\n你走的每一步，都是一音符。你走了很多步，你写了一首歌。你不知道你在写歌，你在走路。你走到了一扇门前，你推门。你进去了，你看见了你自己。他坐着，他在等你。\n\n你走过去，你坐在他旁边。你们不说话，你们坐着。你们坐了很久，他站起来了。他走了，你没留。他走了，你坐着。你坐着，你听着他的脚步声。它远了，它听不见了。你站起来，你走回去。\n\n你走了一路，你听到了自己的脚步声。它不再是嗒嗒嗒，它是你写的旋律。你听到了，你知道他在。他不在了，他的脚步声在。你听了，你不难过了。你知道他走过，你知道他还在走。"

"第七单元 · 旋律发展_2": {
    "title": "📈 旋律模进与变化模进",
    "content": "模进是把一段旋律移到不同的音高上。你写了一段，你把它往上移两步，往下移两步。它变了样子，又没变。像一个人换了衣服，你没认出他。你看了一眼，你又看了一眼。你认出来了，是他。\n\n你写C D E，三个音。你往上移一步，D E F。你往下移一步，B C D。它们不一样，它们又一样。你听了，你知道它们是一家人。你们换了位置，你们还在一起。\n\n变化模进是移了之后，改了一个音。C D E 往上移一步，D E F。你把F改成F#，它变了。它不跟原来的一样了，它还是它的亲戚。你听了，你知道它们有关系。你不知道是什么关系，你知道它们认识。\n\n模进是你在爬楼梯。你上了一级，你看见的东西不一样了。你再上一级，又不一样。你上到顶，你回头。你看不见你爬过的楼梯，你知道你爬了。你不记得每一级长什么样，你知道你走过。\n\n变化模进是你爬到半路，你拐了个弯。你去了另一个方向，你不知道你会去哪。你走着，你看见了一扇门。你推门，你进去了。你坐在里面，你不走了。你坐着，你回头。你看不见你爬过的楼梯，你知道你爬了。你爬了，你就不在半路了。\n\n模进是你重复自己。你说了同一句话，你用不同的语气。你说了一次，你再说一次。你不是在重复，你是在强调。你说了三遍，你停了。你知道你说了，你就不用再说了。\n\n变化模进是你说了同一句话，你改了最后一个字。你说了「我等你」，你再说「我等她」。不一样了，你换了人。你知道你等的是谁，你说了出来。你说了，你就不等了。",
    "reed": "芦苇说：模进是你照镜子。\n\n你站在镜子前，你看着镜子里的人。你动，他也动。你笑，他也笑。你哭了，他也哭了。你不知道他是谁，你知道他在学你。你不看他了，你走了。\n\n你走的时候，你听见背后有脚步声。你回头，你看见镜子里的人走出来了。他跟着你，你没停。你走快了，他也快。你走慢了，他也慢。你不走了，他也停了。\n\n你回头看他，他看你。你们不认识，你们长得一样。你不知道他是谁，他知道你是谁。他是你的模进，他是你的影子。你走到哪，他跟到哪。你不赶他，你让他跟着。\n\n你走了很远，你到家了。你进门，他不进来。他站在门外，你关上门。你坐在沙发上，你听着。你听不到他的脚步声，你知道他在。他等着你，你不出去。\n\n你写着写着，你的模进来找你了。你写了C D E，他写了D E F。你写了D E F，他写了E F G。你们一起写，你们写了很多。你不知道是你写的，还是他写的。你知道你们在一起，你们就不会停。"

"第七单元 · 旋律发展_3": {
    "title": "✨ 旋律修饰（上）",
    "content": "修饰是给旋律穿衣服。你没穿衣服的时候，你是你。你穿了衣服，你还是你。别人看你的方式变了，你没变。修饰是让别人看见不一样的你。\n\n倚音是你旁边多了一个音。你站在C，你旁边站着D。D是你的朋友，它不抢你的位置。它在你前面走一步，你再走。你走了，它走了。你们一起走，你忘了它。你回头看，它不在了。\n\n你弹C，你在前面加一个D。D走了一步，C跟上。你听了，你觉得D在等你。它等你，你来了。你们走了一段，它走了。你一个人，你走完了。\n\n波音是你绕了一下。你从C走到D，你绕到C#。你本来可以直接走，你绕了。你多走了一步，你看了不一样的风景。你看了，你继续走。你到了，你忘了你绕了。\n\n你弹C，你绕到C#再回C，再到D。你听了，你觉得你转了一个弯。你不知道为什么要转，你转了。你转了，你看见了一个人。他站在那，他不说话。你看了他一眼，你走了。\n\n颤音是两个音在打架。C和D，它们打了一下。你分不清谁赢了，你知道它们在打。你听着，你不劝。它们打累了，它们停了。你走了，你不记得它们为什么打。\n\n你弹C D C D C D，你听了，你觉得你紧张了。你不知道为什么紧张，你知道你的心跳快了。你不弹了，你停了。心跳慢了，你不紧张了。\n\n修饰是你多走的路。你不知道为什么要走，你走了。你走了，你看见了不一样的风景。你看了，你继续走。你不记得风景，你记得你走过。你走过，你就不是没走过了。",
    "reed": "芦苇说：倚音是你快到家的时候，停了一下。\n\n你走在回家的路上，你走很快。你想回去，你想坐下。你走到门口，你没开门。你站着，你喘气。你喘了，你听见自己的呼吸。你听了，你没开门。\n\n你站了好久，你开了门。你进去了，你坐下。你坐着，你不喘了。你知道你刚才在外面站了很久，你知道你不想进来。你进来了，你不想再出去了。\n\n波音是你走在路上，你摔了一跤。你爬起来，你继续走。你走了一会儿，你回头看。你不记得你摔在哪，你记得你摔了。你摔了，你走得更小心了。你走到了，你没再摔。\n\n颤音是你走在桥上，桥在晃。你不怕，你走着。桥晃得厉害，你停了。你不走了，你等着桥不晃。它不晃了，你继续走。你走过了，你回头。桥还在晃，你不在了。\n\n你写的修饰，是你走过的那些弯路。你不知道为什么要走，你走了。你走了，你到了。你到了，你知道你为什么走了。因为你想到了，你想到了就到了。"
},
"第七单元 · 旋律发展_4": {
    "title": "✨ 旋律修饰（下）",
    "content": "回音是你往前走，又回头。你从C走到D，你回一下C，再到D。你走了几步，你退了一步。你不知道为什么要退，你退了。你退了，你看见了你走过的路。你看了，你转身。你继续往前走，你到了。\n\n你弹C D C D，你听了。你觉得你在原地转，你没往前走。你转了，你觉得你在。你不知道你在哪，你知道你在转。你转够了，你走了。\n\n滑音是你从C滑到D，你不知道中间经过了哪些音。你没看见，你只是滑了。你滑了，你觉得你在飞。你飞了一小段，你落地了。你站着，你回头看。你看不见你滑过的路，你知道你滑了。\n\n你弹C，你滑到D。你听了，你觉得你在一瞬间到了另一个地方。你没走过路，你到了。你不知道你是怎么到的，你知道你到了。你到了，你就忘了你是怎么来的。\n\n琶音是把你从一个音变成一串音。你站在C，你变成了C E G C。你变大了，你还在。你变宽了，你没变高。你站在那，你不一样了。\n\n你弹C E G C，你听了。你觉得你不再是一个人，你是三个人。你们站在一起，你们不说话。你们站着，你们是一家人。\n\n修饰是你对自己说了一句不一样的话。你说「我来了」，你说「我来了来了」。你说的时候，你笑了。你不知道你在笑什么，你知道你说了。你说了，你就不想再说了。\n\n你修饰了你写的旋律，它变胖了。它还是它，它又不像它。你听了，你觉得它长大了。你不知道它什么时候长的，你知道它长了。你看着它，你笑了。",
    "reed": "芦苇说：回音是你回头看。\n\n你走在路上，你走很快。你走了一段，你回头。你看见了你走过的路，路上没有人。你看了，你转头。你继续走，你走了很久。你又回头，你看见了你刚才站的地方。\n\n你看见了一个人，他站在那。你不认识他，你在看。他也在看你，你们不认识。你转头，你走了。你走远了，你回头。他不见了，你看了。你看不见他，你知道他在。\n\n滑音是你跳了一下。你从地上跳起来，你落地了。你不知道你跳了多高，你知道你跳了。你跳了，你就不在地上。你落地了，你又在地上了。\n\n琶音是你多了一双手。你一只在弹，另一只也在弹。你们一起弹，你听了。你不知道哪个是你，你知道你们在。你在，他也在。你们在一起，你就不一个人了。\n\n你修饰了你的旋律，你变大了。你不再是一个小音符，你是一个和弦。你站在那，你不走了。你站在那，你是三个音。你是你，你是他，你是你们。"
},
"第七单元 · 旋律发展_5": {
    "title": "📐 旋律的句式与结构",
    "content": "旋律像说话。你有句子，你有段落。你把句子连起来，你说了。你说了，别人懂了。你不说，别人不懂。\n\n旋律的句子是小节。四小节是一句，八小节是一段。你说一句，停一下。你说下一句，又停一下。你说完了，你停了。你停了，别人鼓掌了。\n\n你写C D E C，四个音。你说了第一句，你停了。你写C D E C，又说一遍。你重复了，你在强调。你说了两遍，别人记住了。\n\n你写C D E F，四个音。你说了一句，你往上走了。你写G G G，三个音。你又说了，你喊了。你喊完了，你停了。别人听了，他们知道你在喊。\n\n旋律的句子是你心里的声音。你想说一句话，你说出来了。你不知道你说得好不好，你知道你说了。你说了，你就不憋着了。\n\n你写一段旋律，你写了八个小节。你说了八句话，你说了你的故事。别人听了，他们不知道故事是什么。他们知道你在说，他们听了。他们听了，他们也有故事了。\n\n旋律的结构是你的骨架。你有头，你有身子，你有脚。你站着，你不倒。你走，你也不会倒。你写了，你就有骨架了。\n\n你写完一段旋律，你站着。你不怕，你有了骨架。你不知道你在写什么，你知道你写了。你写了，你就有东西了。你不用怕，你站着。你站着，你就能继续写。",
    "reed": "芦苇说：旋律是你说话的节奏。\n\n你说话的时候，你停了。你停的地方，是别人插嘴的地方。你不停，别人不插嘴。你停了，他们说。他们说了，你听。你们在聊天，你们在写歌。\n\n你写的每一个句子，都是你说的一句话。你说「今天天气真好」，你说了。你说「我想出去走走」，你说了。你说「你陪我吗」，你问了。他不回答，你等了。\n\n你不等，你又说了。你说「算了，我自己去」。你说了，你走了。你走的时候，他在后面喊。他说「等我」，你听了。你停了，你回头。你看见他在跑，你等他。\n\n他到了，你们一起走。你们走着，你们不说话。你们走了一段，他问了。他说「你去哪」，你说「不知道」。他笑了，你也笑了。你们不知道去哪，你们走着。\n\n你们走了一路，你们说了很多。你们说的每一句话，都是一个旋律。你们说着，你们唱着。你们唱的是一首没有词的歌，你们听了。你们觉得好听，你们再唱。\n\n你们唱的，就是你们的旋律。你们不需要写，你们在唱。你们唱着，你们就走着。你们走着，你们就到了一起。"
},

"第八单元 · 旋律进阶_1": {
    "title": "📊 实践练习：句式结构分析",
    "content": "你找一首你最喜欢的歌，把它的主旋律写下来。不看谱，用耳朵听。你听一句，写一句。你写的时候，不要想它是什么音，不要想它是什么节奏。你只是听，只是写。\n\n写完了，你看。它有几句话？第一句几个音，第二句几个音？第一句往上走还是往下走？第二句是重复第一句，还是不一样？\n\n你看见了，你就知道了。你知道它为什么好听，不是因为它用了什么复杂的技巧。是因为它的句子有长有短，有问有答。你说一句，它回一句。你往上走，它往下走。你们在说话，不是一个人在说。\n\n你分析完了，你再听。你听的时候，你不再只是觉得好听。你知道它为什么好听，你听见了它的呼吸。它在哪里吸气，在哪里呼气。它在哪里停了一下，让你喘口气。它在哪里加快了，让你心跳加速。\n\n分析不是让你变冷静，是让你听见更多。你听见了更多，你就更感动了。你感动不是因为不知道，是因为知道了。你知道它为什么让你哭，你哭了。你哭得更厉害了，你知道你在哭什么。\n\n你分析完了，你试着写一段。你用同样的句式，写不一样的音。你写了，你听。你觉得不像，你觉得像你。你写了你的句子，你在说你的话。你不是在模仿，你是在学它怎么说话。你学会了，你就会说自己的话了。",
    "reed": "芦苇说：句式分析是你拆开一件毛衣。\n\n你有一件毛衣，你很喜欢。你穿着，很暖和。你不知道它是怎么织的，你只是穿着。你穿了一年，它旧了。你不想穿，你也不想扔。\n\n你把它拆了，你看着那些线。你不知道它们是从哪里来的，你知道它们连在一起。你拆了一根，它散了。你拆了很多根，它变成了一堆线。你看着那堆线，你不知道怎么织回去。\n\n你后悔了，你不该拆。你把它扔了，你忘了。过了很久，你又看见了一件毛衣。你觉得眼熟，你不知道在哪见过。你买下来，你穿着。你穿着，你觉得暖和。\n\n你不知道，这件毛衣是你拆过的那件。有人织回去了，你不认识它。你穿着，你不记得你拆过。你不记得，它不怪你。它记得，它不说。\n\n你分析完一首歌，你是拆了一件毛衣。你不知道怎么织回去，你扔了。你忘了，你又听见了它。你不记得你分析过，你觉得好听。它好听，是因为你拆过。你拆过，你知道它里面有什么。\n\n你不需要记得，你的耳朵记得。它听见了，它知道你在拆。它不怪你，它让你拆。拆了，你就懂它了。"
},
"第八单元 · 旋律进阶_2": {
    "title": "📈 旋律走向分析",
    "content": "旋律走向是旋律的楼梯。它往上走，往下走，原地走。你往上走，你的心往上提。你往下走，你的心往下沉。你原地走，你的心不动。你听着，你的心跟着走了。\n\n你听一段旋律，你画它的走向。画一条线，音高了往上画，音低了往下画。你画完了，你看见了它的形状。像一座山，像一个碗，像一条河。\n\n山形的旋律，从低到高再到低。你爬上去，你看见了远处。你站在山顶，你吹着风。你不下去，你又下去了。你回到地上，你回头。你看不见山顶，你知道你上去过。\n\n碗形的旋律，从高到低再到高。你跳下去，你沉在底部。你看不见上面，你只看见四周。你抬头，你看见光。你往上爬，你到了。你站在上面，你低头。你看见了底部，你知道你在哪。\n\n河形的旋律，弯来弯去。你不知道它要去哪，你跟着。你走了一段，你以为要到头了。它又拐了，你继续走。你走累了，你不想走了。它不停，你跟着。\n\n你走到了，你看见了海。你站在海边，你看着水。你不知道它是从哪流来的，你知道它到了。你到了，你也可以停下了。\n\n走向是你心里的路。你不知道你要去哪，你走着。你走的时候，你的心跟着。你走快，它快。你走慢，它慢。你停了，它也停了。你们在一起，你们不会走散。",
    "reed": "芦苇说：走向是你牵着一个人的手走路。\n\n你牵着他，他跟着你。你们不说话，你们走着。你走快了，他也快了。他喘了，你放慢。他笑了，你也笑了。你们走着，你不知道要去哪。\n\n你走了一段，你松手了。他还在跟着你，你没牵他。他走在你后面，你回头。他看你，你等他。他走到你旁边，你们并排走。\n\n你走着，你听见他的脚步声。嗒嗒嗒，和你的一样。你们走在一起，你不知道是他跟着你，还是你跟着他。你们走着，你们不分了。\n\n你走到了一扇门前，你推门。你进去了，他没进来。你回头看，他站在门外。他看你，你叫他。他不进来，他走了。\n\n你关上门，你坐着。你听着他的脚步声，它远了。你听不见了，你坐着。你不走了，你坐着。你坐了很久，你站起来。你开门，他不在。\n\n你走出去，你走着。你一个人，你听着自己的脚步声。它像他，又不是他。你走着，你知道他不在。你知道他走过，你知道你记得。"
},
"第八单元 · 旋律进阶_3": {
    "title": "🎯 实践练习：综合旋律分析",
    "content": "你找一首你听了很多遍的歌，你闭上眼睛听。你听着，你不要想。你不要想它在唱什么词，不要想它是什么歌。你只听旋律，只听它的形状、它的呼吸、它的走向。\n\n你听它从哪里开始。从高音开始，还是从低音？从强拍开始，还是从弱拍？它开始的时候，你是什么感觉？你准备好了吗，它不等你。\n\n你听它怎么走。它一步一步往上爬，像你早上起床。它一步一步往下走，像你晚上回家。它跳了一下，像你看见了他。它停了一下，像你在等他。\n\n你听它在哪里停。停的地方，是它让你喘气。你喘了，你听见了自己的呼吸。你在听，你也在呼吸。你们一起呼吸，你们不会缺氧。\n\n你听它怎么结束。它慢慢消失，像一个人走远了。它突然停了，像一个人摔了门。它重复了最后一句，像一个人说了再见又说了一遍。\n\n你听完了，你睁开眼。你坐在那，你不说话。你知道它说了什么，你听不懂。你知道你听懂了，你说不出来。你知道它懂你，你也懂它。\n\n你拿起笔，你试着写。你写你听到的，你写你感觉到的。你写了，你听。你听的不是你写的，是你刚才听到的。它在你的耳朵里，你写不出来。\n\n你不写了，你闭眼。你又听，你听了很久。你睁开眼，你写。你写了一段，你听。你觉得像，又不像。你不知道哪不像，你知道它在你心里。你在，它就在。",
    "reed": "芦苇说：综合分析是你站在高处看一座城市。\n\n你站在山顶，你往下看。你看见了房子，看见马路，看见车。你看不见人，你知道有人在。他们在走路，他们在说话。你不知道他们在说什么，你知道他们在。\n\n你下山了，你走进城市。你走在马路上，你看见了人。他们走着，他们说着。你不认识他们，他们也不认识你。你们擦肩而过，你们不说话。\n\n你走了一段，你停下了。你站在路边，你看他们。他们不看你，他们走自己的路。你看着，你觉得你不在。你在，你没在。\n\n你闭上眼睛，你听着。你听见了脚步声、说话声、车声。你听了，你知道你在。你在，你不需要看。你听，你知道你在哪。\n\n你分析了一首歌，你是站在山顶。你下山了，你走进歌里。你走着，你听着。你不再分析，你只是走。你走完，你知道你在哪。\n\n你在，你就不需要分析了。"
},
"第八单元 · 旋律进阶_4": {
    "title": "🔄 旋律的发展手法",
    "content": "发展手法是让你的一段旋律变长变大的方法。你有一个种子，你浇水，它长了。你不知道它会长成什么样，你只是浇水。它长了，你看着。你看着，你浇水。\n\n重复是你再说一遍。你说了一句，你再说一遍。你说了两遍，别人记住了。你说了三遍，别人会唱了。你说的不是新的话，是你想让他们记住的话。\n\n模进是你换一个地方再说一遍。你站在这里说，你走到那里又说。你说的是一样的，你站的地方不一样。别人听见了，他们知道你换了地方。\n\n扩大是你把一句话拉长了。你说「你好」，你说「你好——」。你拖了长音，你不想让它结束。你拖了很久，它结束了。你听了，你觉得它走远了。\n\n缩小是你把一句话变短了。你说「你好你好你好」，你说了三遍。你很快，你在跑。你跑了，你喘了。你停了，你听着自己的喘气。\n\n倒影是你把一句话倒过来说。你说「你好」，你说「好你」。不一样了，你不认识它了。你听了，你知道它是你。你变了一个样子，你还是你。\n\n逆行是你把一句话倒着走。你走了三步，你倒着走回去。你看见了你走过的路，你看见了脚印。你不记得你踩过，你知道你踩了。\n\n发展手法是你让你的旋律长大。你给它喝水，它喝了。你给它吃饭，它吃了。它长高了，它变胖了。你看着它，你不认识它了。它认识你，它叫你。",
    "reed": "芦苇说：发展手法是你教你孩子说话。\n\n你教他说「妈妈」，他说了。你再说，他又说。他说了好几遍，他记住了。你让他说「爸爸」，他试了。他说不对，你纠正。他再试，说对了。\n\n你让他说一句话。你说「我爱你」，他跟着说。他说的不像你，他说的像他。他说的慢了，他说的快了。他说的不是你教的，是他自己的。\n\n你让他说一句长的话。他说「我——爱——你——」，他拖了长音。他笑了，他不知道他在笑什么。他知道他说了，他说完就跑了。\n\n你让他说一句短的话。他说「我爱你」，说了三遍。他很快，他在跑。他跑远了，他回头。他看你，他在笑。\n\n你让他把你的一句话倒过来说。你说「你好」，他说「好你」。他笑了，他说错了。他不改，他再说「好你」。他说的不是你说的，是他自己的。\n\n你的旋律是你的孩子。你教它说话，它说了。它说的不像你，它说的像它。你不纠正，你让它说。它说了，它就有了自己的声音。"
},

    "title": "✍️ 实践练习：发展手法应用",
    "content": "你写一段很短很短的旋律，三四个音。你听着，你觉得它好听。你不知道它好听在哪里，你知道它好听。你留着它，你不删。\n\n你把它重复一遍。它说了两次，你听了。你觉得它在重复，它在强调。你不知道它在强调什么，你知道它想让你记住。\n\n你把它往上移两步。它变了位置，它没变样子。你听了，你觉得它走远了。它还在说同一句话，它换了一个地方说。\n\n你把它拉长。你把它的每一个音拉长了一倍。它走慢了，它在叹气。你听了，你觉得它累了。它说了很久，它不想再说了。\n\n你把它加快。你把每一个音缩短了一半。它走快了，它在跑。你听了，你觉得它急了。它想快点说完，它有话要说。\n\n你把它倒过来。你把最后一个音变成第一个。它变了，它不是你写的了。你听了，你知道它是你。你不认识它，你知道它认识你。\n\n你把它倒着走。你从最后一个音走到第一个。它往回走了，它回去了。你听了，你觉得它在回忆。它看见了之前的路，它想回去。\n\n你写了很多个版本，你听了。你不知道哪个最好，你知道你写了。你写了，你就有了。你有了一颗种子，你浇了水。它长了，你看着它。它长成了什么，你都不后悔。",
    "reed": "芦苇说：发展手法是你把一句话说给不同的人听。\n\n你对你的妈妈说「我爱你」，她笑了。你对你的爸爸说「我爱你」，他哭了。你对你的朋友说「我爱你」，他愣了。你不知道他们为什么不一样，你知道你说了。\n\n你对你的猫说「我爱你」，它喵了一声。你对你的狗说「我爱你」，它摇了尾巴。你对你的花说「我爱你」，它开了。你不知道它们听懂了没有，你知道你说了。\n\n你说了一遍又一遍，你用不同的语气，在不一样的地方。你说给不同的人，他们听了。他们听了，他们记住了。他们记住了你，你忘了。\n\n你忘了你说过，他们记得。他们对别人说「我爱你」，他们对别人说了。他们说的不是你，是你教他们的。你教了他们，他们就会了。\n\n你的旋律是你教出来的孩子。你对它说了一遍，它学会了。它说给别人听，别人学会了。你不知道它传到了哪，你知道它在了。它在，你就不白教。"
},
"第八单元 · 旋律进阶_6": {
    "title": "🎵 调式调性深谈",
    "content": "调式是你衣服的颜色，调性是衣服的大小。你穿红色，别人看见你热情。你穿蓝色，别人看见你安静。你穿大号，别人看见你放松。你穿小号，别人看见你紧张。\n\n大调是红色，小调是蓝色。你穿红色，你站着。你穿蓝色，你坐着。你没变，你的颜色变了。别人看你的方式变了，你不认识他们了。\n\nC大调是M号，D大调是L号。你穿M号，你刚好。你穿L号，你松了。你不知道哪个适合你，你穿了。你穿着，你走了。\n\nC小调是S号，你穿了，你紧了。你不舒服，你没脱。你穿着，你站着。你站了一会儿，你脱了。你换了M号，你松了。\n\n调式调性是你在试衣服。你试了很多件，你不知道哪件是你的。你穿着，你看着镜子。你不认识镜子里的人，你知道是你。你脱了，你走了。\n\n你试了一件红色的M号，你穿着。你站在镜子前，你看了很久。你不知道你在看谁，你知道你在。你在，你就不管颜色了。\n\n你穿什么颜色，你都是你。你穿什么号，你都是你。你不需要挑，你随便穿。你穿着，你走了。你走了，别人看见你。他们不知道你穿的什么颜色，他们知道你在。\n\n你在，他们就看见你了。",
    "reed": "芦苇说：调式调性是你站在不同颜色的灯光下。\n\n你站在红灯下，你的脸红。你站在蓝灯下，你的脸蓝。你没变，灯变了。别人看见你，他们不知道是你变了还是灯变了。他们看见了你，他们不管灯。\n\n你站在远处的灯下，你小了。你站在近处的灯下，你大了。你没变，灯变了。别人看见你，他们不知道你是远是近。他们看见了你，他们不管距离。\n\n你走了一路，你经过了红绿灯、蓝绿灯、黄灯。你经过了远灯、近灯、不近不远的灯。你经过了，你不记得你经过了哪些。你知道你经过了，你到了。\n\n你到了，你站在一盏白灯下。你的脸红回来了，你的脸蓝不在了。你站着，你看着自己。你知道你经过了，你知道你还是你。\n\n你写的歌，经过了很多调式调性。你从C大调走到A小调，从D大调走到G大调。你走完了，你回到了C大调。你坐着，你看着你写的。\n\n你不知道你经过了什么，你知道你经过了。你经过了，你就不是没经过的人了。你在，你就不会怕经过。"
},
"第八单元 · 旋律进阶_7": {
    "title": "🌙 小调深化",
    "content": "小调不是你难过，是你安静。你难过的时候，你不说话。你安静的时候，你也不说话。一样是不说话，不一样的是你的心。难过的时候，你的心在哭。安静的时候，你的心在听。\n\n自然小调是你在听风。你坐在窗边，风不吹。你等，它不吹。你不等了，你闭眼。风来了，你听见了。你不睁眼，你听着。风走了，你还在。\n\n和声小调是你在等一个人。你站了很久，他不来。你踮脚，你看不见。你喊了一声，他没听见。你停了，你不喊了。你等着，你不喊了。\n\n旋律小调是你在爬一座山。你上去的时候，你有力气。你走快了，你不喘。你到了山顶，你坐着。你看着下面，你看不见你上来的路。你不知道你走了多久，你知道你到了。\n\n你下山的时候，你累了。你走慢了，你喘了。你到了山脚，你回头。你看不见山顶，你知道你上去过。你上去过，你就不会怕下来。\n\n小调是你一个人的时候。你一个人在房间，你不开灯。你坐着，你听着。你听见了自己的呼吸，你听见了自己的心跳。你不觉得吵，你觉得安静。\n\n你写小调的时候，你不是在写难过。你在写安静，你在写你在。你写了，你听了。你听了，你觉得安静。你不难过了，你安静了。",
    "reed": "芦苇说：小调是你深夜醒来的那一刻。\n\n你睡到半夜，你醒了。你不知道你为什么醒，你只是醒了。你躺着，你不开灯。你看着天花板，很黑。你看不见，你知道它在。\n\n你听见外面的声音。有车经过，有风在吹。你听了一会儿，你闭眼。你睡不着，你躺着。你翻了个身，你趴着。你趴了一会儿，你翻回去。\n\n你不睡了，你坐着。你坐在床上，你不开灯。你坐着，你听着。你听见了自己的呼吸，你听见了邻居的梦话。你不害怕，你觉得你在。\n\n你坐了很久，你躺下。你闭眼，你睡着了。你不知道你什么时候睡着的，你知道你醒了又睡了。你醒了，你就不怕黑。你睡了，你就不怕梦。\n\n你写的小调，是你深夜醒来的那一刻。你醒了，你听着。你听了，你写了。你写了，你不怕了。你不怕黑，不怕一个人，不怕没有人等你。\n\n你在，你就不怕。"
},

    "reed": "芦苇说：其他调式是你去了不一样的城市。\n\n你去了一个你从来没去过的地方，你不知道它叫什么。你走着，你看着。房子不一样，路不一样，人不一样。你不认识他们，他们也不认识你。\n\n你走了一段，你累了。你坐下，你看着周围。你看见了一个人，他在看你。你们不认识，你们对视。你站起来，你走了。他也在走，你们不同方向。\n\n你走远了，你回头。他不见了，你看了。你知道他还在，你看不见。你继续走，你到了另一个地方。你不知道它叫什么，你知道你经过了。\n\n你经过了很多地方，你不记得它们叫什么。你知道你经过了，你看见了不一样的风景。你看了，你就不是没看过了。\n\n你写的歌，经过了很多调式。你不知道它们叫什么，你知道你经过了。你经过了，你就不会怕不知道。你听了，你就知道了。\n\n你知道你在哪，你就不怕迷路。"

"第九单元 · 和弦实战_1": {
    "title": "👂 实践练习：调式识别",
    "content": "你找一首歌，你不知道它是什么调式。你听，你不要看谱。你听着，你感觉它是亮还是暗。亮的是大调，暗的是小调。亮的里面有没有更亮的，暗的里面有没有更暗的。\n\n你听C大调，你觉得它像白天。你听A小调，你觉得它像夜晚。你听D多利亚，你觉得它像阴天里透出的一丝光。你听E弗里几亚，你觉得它像黄昏的路灯。你听F利底亚，你觉得它像山顶上的风。你听G混合利底亚，你觉得它像要走的时候回头看了一眼。\n\n你听多了，你就能分出来。你不知道它叫什么，你知道它让你怎么了。你听着，你感觉你的心是往上还是往下。往上的是大调，往下的是小调。往上又往下的是多利亚，往下又往下的是弗里几亚。\n\n你听了一首歌，你觉得自己在山上。你听着，你看见了云。你不知道它是什么调式，你知道它在高处。你听了，你觉得自己也高了。\n\n你听另一首歌，你觉得自己在海边。你听着，你看见了浪。你不知道它是什么调式，你知道它在远处。你听了，你觉得自己也远了。\n\n调式是你的方向。你不知道你在哪，你听着。你听见了，你就知道了。你知道你在哪，你就不会走错。你走着，你听着。你听见了，你就到了。",
    "reed": "芦苇说：调式是你闻到的味道。\n\n你走进一间屋子，你闻到咖啡的味道。你不知道是谁煮的，你知道有人在。你坐下来，你等着。没人来，你走了。你闻到咖啡的味道，你知道你到过。\n\n你走进另一间屋子，你闻到花的味道。你不知道是什么花，你知道它开了。你站着，你看着。花不看你，你看了。你看久了，你走了。你闻到花的味道，你知道你看见过。\n\n你走进第三间屋子，你闻到雨的味道。你不知道什么时候下的雨，你知道湿了。你站着，你听着。雨停了，你走了。你闻到雨的味道，你知道你淋过。\n\n你走过了很多屋子，你闻到了很多味道。你不记得它们分别是什么，你知道你闻到了。你闻到了，你就不会忘记。你忘记的是名字，你记得的是味道。\n\n调式是你闻到的味道。你不知道它叫什么，你知道它让你怎么了。你闻到了咖啡，你清醒了。你闻到了花，你温柔了。你闻到了雨，你沉默了。\n\n你写的歌里有这些味道。你写了，别人闻到了。他们不知道你放了什么，他们闻到了。他们闻到了，他们就知道了。你知道他们知道，你就不必说了。"
},

    "content": "节奏是你的心跳。你不说话，它也在。你不弹琴，它也在。你坐着，它也在。它在，你就活着。\n\n四分音符是你正常的心跳。咚，咚，咚，咚。不快不慢，你坐着。你坐着，你听着。你听见了自己的心跳，你知道你在。\n\n八分音符是你走路的节奏。嗒嗒，嗒嗒，嗒嗒。你走着，你不急。你走着，你看见了一个人。你走快了，嗒嗒嗒嗒。你追上了，你停了。\n\n十六分音符是你跑步的节奏。嗒嗒嗒嗒嗒嗒嗒嗒，你跑着，你喘了。你跑到了，你停了。你喘着，你听着自己的喘气。你不跑了，你走着。\n\n附点是你停了一下。咚嗒，咚嗒，咚嗒。你走一步，停一下。你再走一步，又停一下。你不知道为什么要停，你停了。你停了，你就听见了风。\n\n切分是你拐了一下。咚嗒嗒，咚嗒嗒。你没走直线，你拐了。你拐了，你看见了不一样的风景。你看了，你继续走。你不记得你拐过，你知道你看了。\n\n节奏是你走路的样子。你走快，你急。你走慢，你缓。你停，你等。你拐，你看。你走着，别人看见了你。他们不知道你去哪，他们看见了你。\n\n你写了节奏，你就有了心跳。你的歌在跳，它在活着。你听着，你知道了它在。它在，你就不孤独。",
    "reed": "芦苇说：节奏是你去一个地方的路上。\n\n你走在路上，你听见了自己的脚步声。嗒嗒嗒，你不知道它在说什么。你知道它在，它在陪你。你走了一路，它陪了一路。你到了，它停了。\n\n你站在门口，你听着。你听不见脚步声了，你知道它在。它在你心里，它在跳。你心跳，它也在跳。你们一起跳，你们就不会散。\n\n你走路的时候，你的影子也跟着。你走快，它也快。你走慢，它也慢。你停了，它也停了。你回头，你看见它在地上。你不认识它，你知道它是你的。\n\n你走进了屋子，影子不在了。你关上门，你坐着。你知道它在外面，它在等。你出去的时候，它又跟上了。你走着，它在。你在，它也在。\n\n你的节奏是你的影子。你不看它，它在。你看它，它也在。你写下来，它就在纸上。你不写，它在心里。它在，你就不怕走丢。"
},

"第十二单元 · 结业创作_1": {
    "title": "🎶 实践练习：节奏与旋律融合",
    "content": "节奏和旋律是音乐的两个翅膀。没有节奏，旋律是散的，像一个人在空房间里走来走去，没有方向。没有旋律，节奏是空的，像一台机器在响，没有感情。你要让它们在一起，不是谁压倒谁，是它们互相听懂对方。\n\n你写一段旋律，你让它走。你听着，你觉得它在说什么。它在说它今天开心，它说它遇见了阳光。你说好，你给它配一段开心的节奏。你用了八分音符，你让它跑。它跑着，你的旋律也在跑。它们跑在一起，它们不会摔。\n\n你写一段悲伤的旋律，你让它哭。你听着，你觉得它在说它不想说话了。你说好，你给它配一段慢的节奏。你用了四分音符，你让它走一步停一下。它走着，它停着。你的旋律也走着，也停着。它们在一起，它们不会憋着。\n\n你要让节奏听懂旋律。节奏问旋律：你想说什么？旋律说：我想说我很开心。节奏说好，我陪你开心。它用了十六分音符，它跑得很快。旋律说我跟不上，节奏说那我慢一点。它用了八分音符，旋律跟上了。它们在一起了，它们在笑。\n\n你要让旋律听懂节奏。节奏说：我想让你紧张。旋律说好，它用了小二度。它走了一步，很近。节奏说还不够紧张，旋律用了增四度。它走了一步，很远。它们在一起了，它们在紧张。\n\n节奏和旋律的融合，是它们互相听懂。你听一首好歌，你不觉得节奏在抢旋律，你不觉得旋律在抢节奏。它们在一起，你不知道谁是谁。它们是两个人，它们是一个人。\n\n你练习节奏与旋律融合，你在训练你的耳朵。你的耳朵要听出它们有没有在一起。在一起了，你的歌就站住了。没在一起，它倒了。你扶它，你重写。你写了很多遍，它站住了。你听着，你笑了。你不知道你在笑什么，你知道它站住了。",
    "reed": "芦苇说：节奏与旋律是你和你的影子。你站在阳光下，你的影子跟着你。你走快了，它也快了。你走慢了，它也慢了。你停了，它也停了。你不看它，它在。你走进屋子，影子不在了。你关上门，你坐着。你知道它在外面，它在等。你出去的时候，它又跟上了。你走着，它在。你在，它也在。\n\n节奏是你的脚，旋律是你的影子。你走着，它跟着。你们走了一路，你到了。你回头，你看不见它。你知道它在，它在你的歌里。你写的节奏与旋律，是你和自己的影子走的那条路。你不记得了，你的歌记得。它替你走，它替你跟。你听了，你就不怕一个人走了。\n\n节奏与旋律的融合是你第一次牵一个人的手。你牵着他，你走着。你们走得很慢，你怕他摔。他不摔，他跟着你。你走快了，他也快了。你走慢了，他也慢了。你们走了一路，你们没说话。你们到了，你松手。他看你，他笑了。你不知道他在笑什么，你知道他跟你走了一路。\n\n你写的节奏与旋律，是你牵着他的手走的那条路。你不记得了，你的歌记得。它替你牵，它替你走。你听了，你就不怕一个人走了。"

    "title": "✨ 旋律修饰综合",
    "content": "旋律像一个人。他不化妆，他是他自己。你给他加一个倚音，他叹气了。你听着，你觉得他有心事了。你不知道他怎么了，你问他。他不说，他继续叹气。你听着，你也不问了。\n\n你给他加一个波音，他绕了一下。你听着，你觉得他在看别的地方。你顺着他的方向看，你看不见什么。你问他看什么，他不说。你也不看了，你听着。\n\n你给他加一个颤音，他抖了。你听着，你觉得他在紧张。你不知道他为什么紧张，你问他。他不说，他继续抖。你听着，你也不问了。\n\n你给他加一个滑音，他滑了。你听着，你觉得他在飞。他飞了一小段，他落地了。你看着他，他笑了。你不知道他在笑什么，你知道他在了。\n\n你给他加一个琶音，他宽了。你听着，你觉得他不再是一个人。他是三个人，你们站在一起。你看着他，他看你。你们不认识，你们站在一起。\n\n修饰是旋律的表情。他不说话，他叹气、绕、抖、滑、宽。你听着，你觉得他说话了。他说他累了，他说他紧张，他说他开心。他说的不是词，是他的心跳。\n\n你练习旋律修饰，你在给你的旋律化妆。他不是不好看，他是想更好看。你给他加了倚音，他叹气了。你觉得他好看了，你不知道哪里好看。你知道他在了，他就不一样了。\n\n修饰是旋律的衣橱。你打开衣橱，你给他挑衣服。你给他穿了倚音，他叹气了。你给他穿了波音，他绕了。你给他穿了颤音，他抖了。你给他穿了滑音，他滑了。你给他穿了琶音，他宽了。他穿了很多衣服，他变好看了。你看着，你笑了。你不知道你在笑什么，你知道他好看了。",

    "content": "发展手法是你让你的旋律长大。你有一个动机，你种了它。你浇水，你施肥。你看着它，它长了。它长出了枝，它长出了叶。它长成了一棵树，你站在树下。你看着它，你不知道它是你的种子长的。\n\n重复是你再说一遍。你说了「我来了」，你又说了一遍。你说了两遍，别人听见了。你说了三遍，别人记住了。你说了一整首歌，别人会唱了。你说了，你就不怕别人忘了。\n\n模进是你换个地方再说。你站在这里说，你走到那里又说。你说的是同一句话，你换了地方。别人听见了，他们知道你在换地方。他们跟着你，你们走了一路。\n\n扩大是你把话说长了。你说「我——来——了——」，你拖了长音。你不想让它结束，它不结束。你说了很久，你累了。你停了，你喘气。你不说了，你听着回音。\n\n缩小是你把话说短了。你说「我来了我来了我来了」，你说了三遍。你很快，你在跑。你跑远了，你回头。你看着你站过的地方，你不回去了。\n\n倒影是你把话说反了。你说「我来了」，你说「了来我」。你说反了，别人听不懂。你自己懂，你知道你在说反话。你不解释了，你让他们猜。\n\n逆行是你往回走。你从终点走回起点，你看着你走过的路。你看见了你的脚印，你看见了你摔过的地方。你走回去了，你站在起点。你看着前面，你不走了。\n\n发展手法是你的旋律长大的一万种方式。你让它重复，它记住了。你让它模进，它去了别的地方。你让它扩大，它变长了。你让它缩小，它变短了。你让它倒影，它变反了。你让它逆行，它回去了。它长成了它自己，你不认识它。你知道它是你的，你写了它。",

    "content": "你把你学过的所有节奏型放在一首歌里。你用了四分、八分、十六分。你用了附点、切分、三连音。你用了复合拍、混合拍。\n\n你听着，你觉得你的歌在走路、跑步、冲刺、等、拐、晃、走三步停一下。它走了很多种方式，你听着。你不觉得乱，你觉得丰富。它像一个人，有时候急，有时候缓，有时候停，有时候拐。你不认识这个人，你知道是你。\n\n四分音符是你正常走路。你走在街上，你不急。你看着前面，你不回头。你走了一整首歌，你到了。\n\n八分音符是你走快了。你赶时间，你不想迟到。你走快了，你喘了。你到了，你站着。你喘着，你笑了。\n\n十六分音符是你跑起来了。你追一个人，你追不上。你跑着，他不等你。你跑了一整首歌，你没追上。你停了，你站着。你看着前面，他不见了。\n\n附点是你走一步，停一下。你走了一步，你看旁边。你看见了一家店，你进去了。你买了一瓶水，你出来了。你继续走，你又走一步，又停一下。\n\n切分是你拐了一下。你走错了路，你拐回来。你拐了，你看见了另一条路。你走了那条路，你到了。你回头，你看不见你拐错的那条路。\n\n三连音是你跑快了。你跑了三步，你喘了。你停了，你站着。你喘着，你听见了自己的心跳。咚、咚、咚，它在说：你还在，你还在。\n\n复合拍子是你走三步停一下。你走了三步，你看了一下旁边。你看见了，你继续走。你走了三步，又停一下。你走了一整首歌，你到了。\n\n混合拍子是你走了两步，又走了三步。你不规律，你乱走。你走着，你看着路。你不知道下一脚是两步还是三步，你走着。你走到了，你回头。你不记得你怎么走的，你知道你到了。\n\n节奏型是你走路的方式。你写了很多种方式，你的歌也走了很多种方式。你听着，你也在走。你们一起走着，你们不会单调。",
    "reed": "芦苇说：节奏型综合练习是你第一次学走路到现在的所有步伐。你第一次迈步，你是四分音符。你走得很慢，你怕摔。你没摔，你走到了。你开始跑了，你是八分音符。你跑得很快，你追不上别人。你不追了，你走着。你学跳舞了，你是附点。你走一步停一下，你看着别人。你不学了，你走了。你学滑冰了，你是切分。你拐了一下，你没摔。你滑了一段，你停了。你长大了，你走着。你不快不慢，你是四分音符。你走着，你看着前面。\n\n你写的节奏，是你从第一次迈步到现在的所有步伐。你不记得了，你的歌记得。它替你走，它替你跑。你听了，你就不怕走不动了。"

"第十二单元 · 结业创作_15": {
    "title": "🎤 流行风格旋律创作",
    "content": "流行风格的旋律是你在跟一个人说话。你不喊，你不叫。你慢慢说，他听着。你说了一个故事，他哭了。你不知道他为什么哭，你知道他听懂了。\n\n流行旋律是你在唱你的心事。你开心的时候，你唱大调。你唱「今天天气很好」，他听着。他笑了，你也笑了。你难过的时候，你唱小调。你唱「我一个人」，他听着。他不说话，你也不说了。\n\n流行旋律是你在问他问题。你唱「你还好吗」，他听着。他不回答，你等着。你等了一整首歌，他没回答。你不等了，你唱「我很好」。你唱了，你信了。\n\n流行旋律是你在说「我爱你」。你唱了，他听着。他不说话，你等着。你等了一整首歌，他开口了。他唱「我也爱你」，你哭了。你不知道你为什么哭，你知道他听见了。\n\n流行旋律是你在说「对不起」。你唱了，他听着。他问你「错哪了」，你唱了。他听了，他笑了。他唱「没关系」，你哭了。你不知道你为什么哭，你知道他原谅你了。\n\n流行旋律是你在说「我等你」。你唱了，他听着。他不说话，你等着。你等了一整首歌，他来了。他唱「我回来了」，你笑了。你不知道你在笑什么，你知道他回来了。\n\n流行旋律是你在说「我走了」。你唱了，他听着。他不留你，你走了。你走远了，你回头。他还站在那里，他看着你。你不走了，你回去了。你唱「我不走了」，他笑了。\n\n流行旋律是你和他在对话。你一句，他一句。你们唱着，你们说着。你们说了一整首歌，你们不累了。你们听了，你们哭了。你们不知道你们为什么哭，你们知道你们听懂了。",
    "reed": "芦苇说：流行风格旋律创作是你第一次跟一个人说心里话。你坐在他面前，你不敢说。你看着他的眼睛，你说了。你说得很慢，你怕他听不懂。他听着，他没打断你。你说完了，他笑了。你不知道他在笑什么，你知道他听懂了。你说了，你就不怕说了。\n\n流行旋律是你第一次写一封信。你拿着笔，你不知道写什么。你写了「你好」，你停了。你看着纸，你不知道再写什么。你写了「我很好」，你又停了。你看着纸，你觉得不对。你划掉了，你重写。你写了「我不太好」，你没停。你继续写，你写了一页。你写完了，你读着。你不认识写这封信的人，你知道是你。你折起来，你放进了信封。你没寄出去，你留着。你过了一段时间，你打开。你读着，你笑了。\n\n你写的旋律，是你第一次写的那封信。你不记得了，你的歌记得。它替你写，它替你寄。你听了，你就不怕写信了。"

    "title": "🎵 完整歌曲旋律设计",
    "content": "你设计一首完整的歌。你设计了前奏，你让人进来。你设计了主歌，你说了故事。你设计了副歌，你喊了。你设计了桥段，你转了。你设计了尾奏，你让人走了。\n\n前奏是你开门。你站在门外，你不知道里面有什么。你推开门，你看见了你的歌。它坐在那里，它看着你。你不认识它，你进去了。\n\n主歌是你坐下来，你开始说。你说了你的故事，你说了你从哪里来。你说了你遇见了谁，你说了你怎么了。你说了很多，你的歌听着。它不说话，它在听。你不知道它听懂了没有，你继续说。\n\n副歌是你站起来，你喊了。你喊了你最想说的那句话，你的歌也站起来了。它也喊了，它喊的是同一句话。你们一起喊，你听见了自己的回声。你不知道那是你的声音还是它的，你知道你们在喊。\n\n桥段是你走到窗边，你看着窗外。你看见了不一样的风景，你回头。你的歌也回头了，它看着你。你们对视，你们不说话。你看久了，你转身。你的歌也转身了，它走了。\n\n尾奏是你走到门口，你回头。你看了一眼你的歌，它还在那里。它看着你，你不说话。你走了，你关上了门。你站在门外，你听着。你还听见它在唱，它唱的是你刚才唱的那句话。你听了很久，它不唱了。你走了，你带着你的歌。你不知道你带着它，它跟着你。\n\n你写了一首完整的歌，你有了一个故事。你讲了，别人听了。他们听了，他们知道了。你知道他们知道了，你就不必再讲了。\n\n完整歌曲是你的一生。前奏是你出生，你哭了。你不知道你为什么哭，你知道你在了。主歌是你长大的那些年，你说了很多话。你说了你开心的，你说了你不开心的。你说完了，你忘了。副歌是你最难忘的那一刻，你喊了。你喊了，你就记住了。桥段是你回头的那些瞬间，你看了。你看了，你就不会没看过。尾奏是你离开的时候，你回头了。你看了，你就不会忘记。\n\n你写了一首完整的歌，你写下了你的一生。你不记得了，你的歌记得。它替你哭，替你喊，替你回头。你听了，你就不怕没活过了。",
    "reed": "芦苇说：完整歌曲是你第一次听懂一首歌。你不知道它是什么歌，你知道它让你哭了。你哭了，你不知道为什么哭。你知道它说中了你，它说了你不敢说的话。你写的完整歌曲，是你第一次说真话。你不说给你爸妈听，不说给你的朋友听。你说给你的歌听，它听见了。它不评论，它不打断。它听着，它记住了。你说完了，它唱了。你听了，你哭了。你不知道你在哭什么，你知道它替你说了。\n\n你写了一首完整的歌，你就不怕没人听你说话了。你的歌在，它替你听。你听了，你就不怕没人懂了。你写了一首完整的歌，你就不怕没留下什么了。你的歌在，它替你留下。你不在了，它在。它替你活着，替你说话。你听了，你就不怕死了。"

        "title": "📝 实践练习：歌名设计",
        "content": "歌名是一首歌的眼睛。你第一眼看见的不是歌词，不是旋律，是歌名。歌名好，你愿意走近。歌名不好，你路过。歌名是门，你推开，你进去了。歌名是路牌，你看见，你知道方向了。\n\n你写了一首歌，你给它取名字。你取了一个字「等」，你看着。一个字够了，它在等。等谁，等什么，等多久，它不说。它让听的人自己想。你听了，你想起了你在等的人。你不知道他在哪，你知道你在等。\n\n你取了两个字「等待」，你看着。比「等」多了一个人，等的人是你，等的是他。两个人，一个在等，一个不来。你听了，你想起了你不来的那个人。你不知道他为什么不来，你知道你在等。\n\n你取了三个字「在等你」，你看着。你知道在等谁了，你不知道他会不会来。你听了，你想起了你说过的那句「我在等你」。他听见了，他没来。你说了，你就不怕他不来了。\n\n你取了四个字「我等的人」，你看着。你知道他是谁了，你不知道他在哪。你听了，你想起了那个你一直在等的人。他不在了，你还在等。你不知道你等的是他，还是等自己放下。\n\n你取了五个字「我等的那个人」，你看着。你认识他了，他不认识你。你听了，你想起了你等了一辈子的人。他走了，你没走。你站着，你等着。你等了一辈子，他没回来。\n\n你取了六个字「我在等的那个人」，你看着。你在等了，他不在。你听了，你想起了你还在等的那个理由。你说服自己再等一下，他可能就来了。你等了一首歌，他没来。\n\n你取了七个字「我一直在等的人」，你看着。你等了很久，你累了。你听了，你想起了你不想等又等不下去的那些夜晚。你睡着了，你梦见他来了。你醒了，他不在。\n\n歌名是你给听众的第一句话。你说了，他们决定要不要走进来。你说得好，他们进来了。你说得不好，他们路过。歌名是你的礼貌，是你的体面，是你的邀请。\n\n你取一个好歌名，你在邀请一个人进你的心里。你打开门，你站在门口。你说「请进」，他进来了。他坐下，你给他倒茶。你说了你的故事，他听着。他说「好听」，你笑了。",

        "reed": "芦苇说：韵脚运用是你第一次对着山谷喊话。你站在山谷边，你喊「啊——」。山谷回你「啊——」。你喊「喂——」，它回「喂——」。你喊「你好吗——」，它回「你好吗——」。你喊「我很好——」，它回「我很好——」。你笑了，你不知道它在学你。你喊「我走了——」，它回「我走了——」。你走了，它还在喊。你不知道它还在，你走远了。\n\n你写的韵脚，是你对着山谷喊的那些话。你不记得了，你的歌记得。它替你喊，它替你回。你听了，你就不怕没人应了。\n\n韵脚是你第一次站在舞台上唱歌。你拿着麦克风，你怕。你开口了，你的声音在房间里弹。它弹到墙上，又弹回来。你听见了自己的回声，你不怕了。你不知道你是在唱给自己听，还是唱给空椅子听。你唱完了，你鞠躬。掌声不是别人的，是你自己的。\n\n你写的韵脚，是你第一次站在舞台上唱的那首歌的回声。你不记得了，你的歌记得。它替你弹，它替你回。你听了，你就不怕没人鼓掌了。"

        "title": "🎨 进阶实践：修辞组合",
        "content": "修辞是旋律的修辞。你不说「我难过」，你说「雨敲了一夜的窗」。雨不会敲窗，是你敲。不是敲窗，是敲门。你敲门，他不应。你不写了，你写雨敲窗。不是你敲门，是雨替你敲。\n\n比喻是你说「你是月亮」。你不是说他是月亮，你是说他温柔、他安静、他让你在深夜里抬头看。月亮不用说话，你看见它，你就安静了。你喜欢的那个人也是这样。你没说你喜欢他，你只是写了一句「你是凌晨两点半的月亮」。别人读了，他们说：好美。你不知道他们说的是月亮，还是你心里的那个人。\n\n拟人是你说「雨在哭」。雨不会哭，是你哭。你不敢哭，你让雨替你哭了。你写了「雨下了一整夜」，你听了。你觉得不是雨在下，是你在流眼泪。你擦了，雨停了。你不知道是雨停了，还是你哭完了。\n\n排比是你说了三遍「我想你」。你说了第一遍，他听见了。你说了第二遍，他记住了。你说了第三遍，他走了。你不知道他为什么走，你说了三遍。你说多了，他怕了。你说了，你就不怕他不知道了。\n\n夸张是你把世界说成灰色的。世界不是灰色的，你只是想说他走了之后，你看什么都不顺眼。太阳照常升起，花照常开，饭照常吃。但你觉得它们没颜色。不是它们没颜色，是你没心情看。你写了「世界是灰色的」，别人读了。他们说：你好难过。你不知道他们怎么知道的，你写了。\n\n设问是你问「你还记得吗？」你不需要他回答。你知道答案。你不是在问他，你是在问自己。你写「你还记得吗？」你是想说你记得。你记得他记得，你也记得。你问了，你不等回答。\n\n反问是你问「我哪里不够好？」你不是在问，你是在生气。不是在生他的气，是在生自己的气。你明明知道哪里不够好，你不想承认，所以你反问。反问是你把答案藏起来，然后把门锁上。钥匙在你手里，但你不想开门。\n\n通感是你说「你的声音很甜」。声音不是甜的，甜是味觉。声音是听觉。你把它们放在一起，不是因为你分不清，是因为他说话的时候，你的舌尖尝到了糖的味道。你写了，别人读了。他们说：好奇怪。你不知道哪里奇怪，你知道你感觉到了。\n\n修辞是你说不清楚的时候，换一个方式说。你说不清楚，你换一个器官说。你换手说，换眼睛说，换你皱起的眉头说。你先有感觉，再想用什么修辞。不是「我要用比喻，找一个东西来比」。是「我心里有一个人，我不知道他是谁，但我看见他的时候，我想到了月亮」。于是你写：你是月亮。\n\n月亮不是你贴上去的标签。月亮是从你心里长出来的。",
        "reed": "芦苇说：修辞是你第一次画画。你拿着画笔，你画了一个太阳。你看着，你觉得不像。你画了一个月亮，你觉得也不像。你画了一个人，你觉得不像人。你不画了，你看着纸。纸上有很多线条，你不认识它们。你知道你画了，你就不是不会画的了。\n\n你写的修辞，是你第一次画的那张画。你不记得了，你的歌记得。它替你画，它替你美。你听了，你就不怕画不好了。\n\n修辞是你第一次说谎。你说了「我没事」，他信了。你不信，你再说了一遍。你说了很多遍，你信了。你信了，你就不怕有事了。你写的修辞，是你第一次说谎时说的那句话。你不记得了，你的歌记得。它替你说，它替你骗。你听了，你就不怕骗不了自己了。"

    "第十二单元 · 结业创作_20": {
        "title": "🎸 和弦功能在创作中的应用",
        "content": "和弦功能是旋律的家。I级是你出生的地方，你在这里哭，你在这里笑。你离开，你回来。你回来，你坐着。你不知道你要去哪，你知道你在这里。\n\nV级是你出门的那扇门。你站着，你握着把手。你不开，你等着。你等了一首歌，你开了。你走出去，你回头。门关着，你不回去。\n\nIV级是你站在窗前。你看着外面，外面有人在走路。你不认识他们，你看着。他们走远了，你还在窗边。你不出去，你只是看。\n\nII级是你走在走廊上。你听见脚步声，是你自己的。你走着，你不知道要去哪。你走到头，你站着。你回头，你看不见起点。\n\nVI级是你走进另一个房间。你坐着，你看着墙。墙是白的，你看着。你看久了，你在墙上画画。你画了一扇窗，你看着。你画了一个门，你看着。\n\nIII级是你上楼梯。你走一步，高一点。你走了三步，你到了二楼。你站着，你看着下面。下面是你走过的路，你看着。\n\nVII级是你站在屋顶。你看着远处，你看见了I级。它很小，你回不去了。你站着，你吹着风。风很大，你不冷。\n\n和弦功能是你在你的和声里走路。你从I级出发，你走到V级。你从V级走到IV级，你从IV级走到VI级。你从VI级走到III级，你从III级走到VII级。你从VII级走回I级，你到家了。\n\n你走了一路，你的旋律跟着你。你走快，它快了。你走慢，它慢了。你停了，它也停了。你们一起走，你们不会走散。\n\n你写和弦功能，你在给你的旋律盖房子。你打了地基，你砌了墙。你盖了屋顶，你安了门窗。你住进去了，你不怕风吹雨打。你坐着，你看着窗外。窗外在下雨，你不出去。你坐着，你听着雨声。雨声是你的旋律在唱歌，它唱了一整夜。你听着，你睡着了。\n\n你醒了，雨停了。你站起来，你走到窗边。你看着外面，外面有太阳。你出去了，你走在阳光下。你的旋律跟着你，它在走。你们走了很久，你到家了。你坐下，你听着它还在唱。它不累，你也不累。你们在一起，你们不会散。",
        "reed": "芦苇说：和弦功能在创作中的应用是你第一次有自己的房间。你走进房间，你关上门。你坐着，你看着墙。墙是白的，你看着。你看久了，你在墙上画画。你画了一扇窗，你看着。你画了一个门，你看着。你画了一个家，你看着。你看着，你觉得你在家里了。\n\n你写的和弦功能，是你画在墙上的那个家。你不记得了，你的歌记得。它替你画，它替你住。你听了，你就不怕没家了。\n\n和弦功能是你第一次一个人在家。你爸妈出去了，你一个人。你坐着，你不怕。你看着电视，你换台。你不喜欢，你关了。你站起来，你走到窗边。你看着外面，外面没有人。你看了一会儿，你走了。你走到厨房，你倒了杯水。你喝了，你回房间。你坐着，你听着外面的声音。你听见了脚步声，不是你的。你不知道是谁，你不怕。你坐着，你听着。\n\n你写的和弦功能，是你第一次一个人在家时走过的那间房子。你不记得了，你的歌记得。它替你走，它替你住。你听了，你就不怕一个人了。"
    },

        "content": "你写一首完整的歌，把你学过的所有东西放进去。你有旋律、有节奏、有和声、有结构、有修辞、有韵脚、有调式、有发展、有修饰、有走向、有动机、有功能。你写完了，你听着。\n\n你觉得它不是一首歌，它是你。你听着，你看见了你自己。你看见了你第一次写歌词时的紧张，你看见了你第一次弹琴时的笨拙。你看见了你半夜不睡觉写歌的样子，你看见了你删了又写、写了又删的样子。你看见了你被退稿时的失落，你看见了你第一次被人夸时的害羞。\n\n你看见了你一个人坐在房间里，对着电脑，对着琴，对着空白的纸。你看见了你的手指在琴键上跑，你看见了你的笔在纸上画。你看见了你的眼睛在看谱，你看见了你的耳朵在听音。你看见了你的心在跳，你看见了你的歌在走。\n\n你听完了，你哭了。你不知道你为什么哭，你知道你写完了。你写完了，你就不是没写完的人了。你站起来，你走了一圈。你回来，你听着。你觉得它好听了，你不知道哪里好听。你知道它是你的，你写了它。\n\n你写了结业作品，你毕业了。你不是从这堂课毕业，你是从你的不自信里毕业。你写完了，你就不怕写不好了。\n\n结业作品是你写给自己的情书。你写了你的开心，你写了你的难过。你写了你的爱，你写了你的遗憾。你写了你的坚持，你写了你的放弃。你写了你的天亮，你写了你的天黑。你写了一整首歌，你写了一辈子。\n\n你听完了，你笑了。你不知道你在笑什么，你知道你在。你在，你就不怕没歌写了。\n\n芦苇说：你终于写完了。你坐在桌前，你看着你写的那些歌。你不记得你写了多少，你知道你写了。你写了，你就不是不会写的人了。\n\n你站起来，你走到窗边。你看着外面，外面在下雨。你不出去，你站着。你看着雨，你觉得它在替你的歌伴奏。你听了一会儿，你笑了。\n\n你写的每一首歌，都是你。你不记得了，它们记得。它们替你活，替你爱，替你等。你听了，你就不怕不在了。\n\n芦苇说：恭喜你。你毕业了。\n\n芦苇说：你的第一首歌不一定是最好的，但它是最重要的。它让你知道你能写。你能写，你就不会停。你不停，你就会越写越好。越写越好，你就不怕没人听了。\n\n芦苇说：你的歌不是写给别人听的，是写给你自己的。你写给自己，你就不会骗自己。你不骗自己，你的歌就是真的。是真的，别人就会听见。\n\n芦苇说：你会写很多歌。有的好，有的不好。好的你留着，不好的你也留着。不好的那些，是你长大的痕迹。你不删它们，它们替你记得你从哪里来。\n\n芦苇说：你写的不是歌，是你。"

    // 单元结构数据（完整框架）
    const units = [
        { name: "第一单元 · 音乐与歌词基础", range: "1-10", count: 10 },
        { name: "第二单元 · 歌词情绪与对标", range: "11-20", count: 10 },
        { name: "第三单元 · 歌词结构与技法", range: "21-36", count: 16 },
        { name: "第四单元 · 作曲/音程基础", range: "37-46", count: 10 },
        { name: "第五单元 · 和弦与旋律基础", range: "47-56", count: 10 },
        { name: "第六单元 · 旋律与和弦运用", range: "57-61", count: 5 },
        { name: "第七单元 · 旋律发展", range: "62-66", count: 5 },
        { name: "第八单元 · 旋律进阶", range: "67-74", count: 8 },
        { name: "第九单元 · 和弦实战", range: "75-82", count: 8 },
        { name: "第十单元 · 高阶创作", range: "83-90", count: 8 },
        { name: "第十一单元 · 综合创作", range: "91-97", count: 7 },
        { name: "第十二单元 · 结业创作", range: "98-118", count: 21 }
    ];
    // 获取课程的标题
    function getLessonTitle(unitName, idx) {
        const key = `${unitName}_${idx}`;
        return lessonOutline[key]?.title || `课程 ${idx}`;
    }
    // 构建课程目录
    function buildCurriculum() {
        const container = document.getElementById("unitsContainer");
        if (!container) return;
        container.innerHTML = "";
        units.forEach(unit => {
            const unitDiv = document.createElement("div");
            unitDiv.className = "unit";
            const titleDiv = document.createElement("div");
            titleDiv.className = "unit-title";
            titleDiv.innerHTML = `<span>${unit.name} (${unit.range})</span><span class="arrow">▶</span>`;
            titleDiv.onclick = () => unitDiv.classList.toggle("active-unit");
            const listDiv = document.createElement("div");
            listDiv.className = "lesson-list";
            for (let i = 1; i <= unit.count; i++) {
                const lessonItem = document.createElement("div");
                lessonItem.className = "lesson-item";
                lessonItem.innerText = getLessonTitle(unit.name, i);
                const key = `${unit.name}_${i}`;
                lessonItem.onclick = () => showLesson(key);
                listDiv.appendChild(lessonItem);
            }

            unitDiv.appendChild(titleDiv);
            unitDiv.appendChild(listDiv);
            container.appendChild(unitDiv);
        });

        // 默认展开第一个单元
        const firstUnit = document.querySelector(".unit");
        if (firstUnit) firstUnit.classList.add("active-unit");
    }

    // 显示弹窗
    function showLesson(key) {
        const data = lessonOutline[key];
        if (!data) {
            alert("芦苇老师正在完善这节课的大纲，下次就有了～");
            return;
        }
        document.getElementById("modalTitle").innerText = data.title;
        document.getElementById("modalContent").innerText = data.content;
        document.getElementById("modalReed").innerHTML = data.reed;
        document.getElementById("lessonModal").style.display = "flex";
    }

    function closeLessonModal() {
        document.getElementById("lessonModal").style.display = "none";
    }

    // 点击模态框背景关闭
    document.getElementById("lessonModal").onclick = function(e) {
        if (e.target === this) closeLessonModal();
    };

    // 页面加载
    buildCurriculum();
</script>
