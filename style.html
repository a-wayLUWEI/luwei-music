<script>
// ==================== 用户界面 ====================
let currentUserData = null;

async function updateUserUI() {
    const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
    const userNameSpan = document.getElementById('userName');
    const userScoreSpan = document.getElementById('userScore');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    
    if (user) {
        userNameSpan.innerText = user.nickname || '芦苇同学';
        let score = user.score || 0;
        if (typeof window.API !== 'undefined' && window.API.getUserScore) {
            const apiScore = await window.API.getUserScore();
            if (apiScore !== undefined) score = apiScore;
        }
        userScoreSpan.innerText = `积分 ${score}`;
        if(loginBtn) loginBtn.style.display = 'none';
        if(logoutBtn) logoutBtn.style.display = 'block';
        currentUserData = user;
    } else {
        userNameSpan.innerText = '未登录';
        userScoreSpan.innerText = '积分 0';
        if(loginBtn) loginBtn.style.display = 'block';
        if(logoutBtn) logoutBtn.style.display = 'none';
        currentUserData = null;
    }
}

async function addScore(amount, reason) {
    if (!currentUserData) return;
    if (typeof window.API !== 'undefined' && window.API.addScore) {
        await window.API.addScore(amount, reason);
        updateUserUI();
    }
}

if(document.getElementById('loginBtn')) {
    document.getElementById('loginBtn').addEventListener('click', () => { if(typeof showLoginModal === 'function') showLoginModal(); });
}
if(document.getElementById('logoutBtn')) {
    document.getElementById('logoutBtn').addEventListener('click', () => { if(typeof logout === 'function') logout(); location.reload(); });
}

window.onLoginSuccess = async function(user) {
    currentUserData = user;
    await updateUserUI();
    if (typeof pullFromCloud === 'function') {
        await pullFromCloud();
    }
};

updateUserUI();

// ==================== 保存通关记录 ====================
function saveStyleComplete(style) {
    if (!currentUserData) return;
    const userId = currentUserData.user_id;
    localStorage.setItem(`style_${style}_${userId}`, "true");
    if (typeof syncToCloud === 'function') syncToCloud();
}

function saveMasterComplete(artist) {
    if (!currentUserData) return;
    const userId = currentUserData.user_id;
    localStorage.setItem(`master_${artist}_${userId}`, "true");
    if (typeof syncToCloud === 'function') syncToCloud();
}

function saveFolkComplete(unit) {
    if (!currentUserData) return;
    const userId = currentUserData.user_id;
    localStorage.setItem(`folk_${unit}_${userId}`, "true");
    if (typeof syncToCloud === 'function') syncToCloud();
}

function saveGufengComplete(song) {
    if (!currentUserData) return;
    const userId = currentUserData.user_id;
    localStorage.setItem(`gufeng_${song}_${userId}`, "true");
    if (typeof syncToCloud === 'function') syncToCloud();
}

let currentStyle = null, styleStreak = 0, styleQuestions = [];
let currentArtist = null, masterStreak = 0, masterQuestions = [], masterIdx = 0;

// 风格闯关
function loadStyle(style) {
    if (!styleBank[style]) { alert(`《${style}》风格题库完善中～`); return; }
    currentStyle = style;
    styleStreak = 0;
    styleQuestions = [...styleBank[style]].sort(() => 0.5 - Math.random()).slice(0, 5);
    document.getElementById("styleQuizPanel").innerHTML = `
        <div style="color:#F2C94C; margin-bottom:8px">🎸 ${style} · 连续答对5题通关</div>
        <div id="styleQ"></div>
        <div id="styleFeed" class="feedback"></div>
    `;
    nextStyleQuestion();
}
function nextStyleQuestion() {
    if (styleStreak >= styleQuestions.length) {
        document.getElementById("styleFeed").innerHTML = "🏆 获得风格勋章！";
        saveStyleComplete(currentStyle);
        addScore(30, `通关风格：${currentStyle}`);
        return;
    }
    const q = styleQuestions[styleStreak];
    document.getElementById("styleQ").innerHTML = `
        <div class="lyric-question">${q.q}</div>
        <div class="lyric-options" id="styleOpts"></div>
    `;
    const optsDiv = document.getElementById("styleOpts");
    optsDiv.innerHTML = "";
    q.opts.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "lyric-opt-btn";
        btn.innerText = opt;
        btn.onclick = () => {
            if (i === q.ans) {
                styleStreak++;
                document.getElementById("styleFeed").innerHTML = `✅ 正确！${styleStreak}/${styleQuestions.length}`;
                addScore(5, `${currentStyle}答题正确`);
                nextStyleQuestion();
            } else {
                styleStreak = 0;
                document.getElementById("styleFeed").innerHTML = `❌ 错误！正确答案：${q.opts[q.ans]}。 ${q.exp}`;
                nextStyleQuestion();
            }
        };
        optsDiv.appendChild(btn);
    });
}

// 大师鉴赏
function loadMaster(artist) {
    if (!masterBank[artist]) { alert(`《${artist}》题库完善中～`); return; }
    masterStreak = 0;
    currentArtist = artist;
    masterQuestions = [...masterBank[artist]].sort(() => 0.5 - Math.random()).slice(0, 6);
    masterIdx = 0;
    document.getElementById("masterQuizPanel").innerHTML = `
        <div style="color:#F2C94C; margin-bottom:8px">🌟 ${artist} · 连续答对6题得勋章</div>
        <div id="masterQ"></div>
        <div id="masterFeed" class="feedback"></div>
    `;
    nextMaster();
}
function nextMaster() {
    if (masterStreak >= 6) {
        document.getElementById("masterFeed").innerHTML = "🏆 芦苇大师勋章！";
        saveMasterComplete(currentArtist);
        addScore(50, `通关大师：${currentArtist}`);
        return;
    }
    if (masterIdx >= masterQuestions.length) {
        masterQuestions = [...masterBank[currentArtist]].sort(() => 0.5 - Math.random()).slice(0, 6);
        masterIdx = 0;
    }
    const q = masterQuestions[masterIdx++];
    document.getElementById("masterQ").innerHTML = `
        <div class="lyric-question">${q.q}</div>
        <div class="lyric-options" id="masterOpts"></div>
    `;
    const optsDiv = document.getElementById("masterOpts");
    optsDiv.innerHTML = "";
    q.opts.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "lyric-opt-btn";
        btn.innerText = opt;
        btn.onclick = () => {
            if (i === q.ans) {
                masterStreak++;
                document.getElementById("masterFeed").innerHTML = `✅ 正确！${masterStreak}/6`;
                addScore(5, `${currentArtist}鉴赏答题正确`);
                nextMaster();
            } else {
                masterStreak = 0;
                masterIdx = 0;
                masterQuestions = [...masterBank[currentArtist]].sort(() => 0.5 - Math.random()).slice(0, 6);
                document.getElementById("masterFeed").innerHTML = `❌ 错误！重新开始`;
                nextMaster();
            }
        };
        optsDiv.appendChild(btn);
    });
}
