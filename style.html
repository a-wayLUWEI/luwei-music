<script>
// ==================== 用户界面 ====================
function updateUserUI() {
    const user = getCurrentUser();
    const userNameSpan = document.getElementById('userName');
    const userScoreSpan = document.getElementById('userScore');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    if (user) {
        userNameSpan.innerText = user.nickname || '芦苇同学';
        userScoreSpan.innerText = `积分 ${user.score || 0}`;
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'block';
    } else {
        userNameSpan.innerText = '未登录';
        userScoreSpan.innerText = '积分 0';
        loginBtn.style.display = 'block';
        logoutBtn.style.display = 'none';
    }
}
// 登录/退出
document.getElementById('loginBtn')?.addEventListener('click', () => { showLoginModal(); });
document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); location.reload(); });
// 登录成功回调
window.onLoginSuccess = function(user) {
    updateUserUI();
};
// 保存风格通关状态
function saveStyleComplete(style) {
    const user = getCurrentUser();
    if (!user) return;
    const userId = user.user_id;
    localStorage.setItem(`style_${style}_${userId}`, "true");
    // 同步到云端（可选）
    syncToCloud();
}
// 检查风格是否已通关
function isStyleComplete(style) {
    const user = getCurrentUser();
    if (!user) return false;
    const userId = user.user_id;
    return localStorage.getItem(`style_${style}_${userId}`) === "true";
}
// 保存大师通关状态
function saveMasterComplete(artist) {
    const user = getCurrentUser();
    if (!user) return;
    const userId = user.user_id;
    localStorage.setItem(`master_${artist}_${userId}`, "true");
    syncToCloud();
}

        return;

    const q = styleQuestions[styleStreak];

        <div class="lyric-options" id="styleOpts"></div>
    `;

    optsDiv.innerHTML = "";
    q.opts.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "lyric-opt-btn";
        btn.innerText = opt;
        btn.onclick = () => {
            if (i === q.ans) {
                styleStreak++;
                document.getElementById("styleFeed").innerHTML = `✅ 正确！${styleStreak}/${styleQuestions.length}`;
