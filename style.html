<script>
// ==================== 用户界面 ====================
let currentUserData = null;

async function updateUserUI() {
    const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
    const userNameSpan = document.getElementById('userName');
    const userScoreSpan = document.getElementById('userScore');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    
    if (user) {
        userNameSpan.innerText = user.nickname || '芦苇同学';
        let score = user.score || 0;
        if (typeof window.API !== 'undefined' && window.API.getUserScore) {
            const apiScore = await window.API.getUserScore();
            if (apiScore !== undefined) score = apiScore;
        }
        userScoreSpan.innerText = `积分 ${score}`;
        if(loginBtn) loginBtn.style.display = 'none';
        if(logoutBtn) logoutBtn.style.display = 'block';
        currentUserData = user;
    } else {
        userNameSpan.innerText = '未登录';
        userScoreSpan.innerText = '积分 0';
        if(loginBtn) loginBtn.style.display = 'block';
        if(logoutBtn) logoutBtn.style.display = 'none';
        currentUserData = null;
    }
}

async function addScore(amount, reason) {
    if (!currentUserData) return;
    if (typeof window.API !== 'undefined' && window.API.addScore) {
        await window.API.addScore(amount, reason);
        updateUserUI();
    }
}

if(document.getElementById('loginBtn')) {
    document.getElementById('loginBtn').addEventListener('click', () => { if(typeof showLoginModal === 'function') showLoginModal(); });
}
if(document.getElementById('logoutBtn')) {
    document.getElementById('logoutBtn').addEventListener('click', () => { if(typeof logout === 'function') logout(); location.reload(); });
}

window.onLoginSuccess = async function(user) {
    currentUserData = user;
    await updateUserUI();
    if (typeof pullFromCloud === 'function') {
        await pullFromCloud();
    }
};

updateUserUI();

// ==================== 保存通关记录 ====================
function saveStyleComplete(style) {
    if (!currentUserData) return;
    const userId = currentUserData.user_id;
    localStorage.setItem(`style_${style}_${userId}`, "true");
    if (typeof syncToCloud === 'function') syncToCloud();
}

function saveMasterComplete(artist) {
    if (!currentUserData) return;
    const userId = currentUserData.user_id;
    localStorage.setItem(`master_${artist}_${userId}`, "true");
    if (typeof syncToCloud === 'function') syncToCloud();
}

function saveFolkComplete(unit) {
    if (!currentUserData) return;
    const userId = currentUserData.user_id;
    localStorage.setItem(`folk_${unit}_${userId}`, "true");
    if (typeof syncToCloud === 'function') syncToCloud();
}

function saveGufengComplete(song) {
    if (!currentUserData) return;
    const userId = currentUserData.user_id;
    localStorage.setItem(`gufeng_${song}_${userId}`, "true");
    if (typeof syncToCloud === 'function') syncToCloud();
}

    { q: "《暖风》这首歌的主题是什么？", opts: ["暖风", "冷风", "热风", "凉风"], ans: 0, exp: "暖风，是温暖。芦苇说：暖风，吹进心里。" },

"莫文蔚": [
    { q: "《阴天》开篇「阴天 在不开灯的房间」营造了什么氛围？", opts: ["孤独与压抑", "快乐与放松", "热闹与喧嚣", "平静与安详"], ans: 0, exp: "不开灯的房间暗示不愿面对外界，阴天加重了沉闷感。芦苇说：阴天不开灯，是不想看清自己，也不想被看清。" },
    { q: "《阴天》中「开始总是分分钟都妙不可言」用了什么修辞手法？", opts: ["夸张", "比喻", "拟人", "对仗"], ans: 0, exp: "「分分钟」夸张了热恋时时间的飞速感，与后面的「新鲜感一消失」形成对比。芦苇说：热恋时一秒像一分钟，平淡后一分钟像一秒。" },
    { q: "《阴天》的旋律有什么特点？", opts: ["半说半唱的慵懒感", "高亢激昂", "快速跳跃", "古典庄重"], ans: 0, exp: "介于说话和唱歌之间的音高，像一个人在房间里自言自语。芦苇说：有些话说不出口，就用唱的。" },
    { q: "《阴天》中「感情不就是你情我愿」这句用了什么和弦色彩？", opts: ["属七和弦的张力", "大三和弦的明亮", "小三和弦的暗淡", "减七和弦的紧张"], ans: 0, exp: "属七和弦制造「话还没说完」的感觉，像在等一个回应。芦苇说：你情我愿，但谁先说出口？" },
    { q: "《阴天》的作词人是李宗盛，他的歌词风格在这首歌中如何体现？", opts: ["口语化、像在聊天", "华丽辞藻堆砌", "古风诗意", "抽象难懂"], ans: 0, exp: "「开始总是分分钟都妙不可言」像朋友在跟你吐槽感情。芦苇说：李宗盛的词，像一个人在跟你讲故事。" },
    { q: "《阴天》中「除了激情褪去后的那一点点倦」的「倦」字有什么深意？", opts: ["不只是身体的累，更是心的疲惫", "单纯的困了", "对感情的厌恶", "无所谓"], ans: 0, exp: "激情褪去后的倦，是对重复、平淡、无话可说的无奈。芦苇说：最累的不是吵架，是无话可说。" },
    { q: "《阴天》的副歌最高音落在哪个字？为什么？", opts: ["「点」字，强调那一点点倦", "「天」字，点题", "「妙」字，强调热恋", "「情」字，强调感情"], ans: 0, exp: "最高音落在「点」字上，像在说「就那么一点点，也让人受不了」。芦苇说：最大的重量，往往是最小的一点点。" },
    { q: "《忽然之间》这首歌的创作背景是什么？", opts: ["纪念台湾921大地震", "写给前男友", "写给妈妈", "电影主题曲"], ans: 0, exp: "为纪念921大地震而作，表达人在灾难面前的渺小与珍惜。芦苇说：忽然之间，才知道什么最重要。" },
    { q: "《忽然之间》中「分不开」重复三次，用了什么修辞手法？", opts: ["反复", "排比", "对仗", "拟人"], ans: 0, exp: "重复三次像在说服自己，也像在祈祷。芦苇说：越怕失去，越要反复说。" },
    { q: "《忽然之间》的和弦进行有什么特点？", opts: ["大量使用挂留和弦制造悬疑感", "全是三和弦", "没有和弦变化", "全是七和弦"], ans: 0, exp: "挂留和弦不解决，像灾难来临前的未知与恐惧。芦苇说：悬在半空的感觉，最折磨人。" },
    { q: "《忽然之间》中「我为什么总在非常脆弱的时候 怀念你」这句的心理逻辑是什么？", opts: ["人在脆弱时需要安全感", "脆弱的时候容易记仇", "脆弱的时候想报复", "脆弱的时候想独处"], ans: 0, exp: "脆弱时最需要依靠，所以会想起那个给过你安全感的人。芦苇说：不是还爱，是需要爱。" },
    { q: "《忽然之间》的旋律走向有什么特点？", opts: ["波浪形上下起伏", "一直上行", "一直下行", "平直无变化"], ans: 0, exp: "波浪形旋律像情绪的高低起伏，也像地震的波动。芦苇说：活着，就是起起落落。" },
    { q: "《忽然之间》的编曲为什么以钢琴为主？", opts: ["钢琴的纯净能表达脆弱感", "吉他太吵", "没有其他乐器", "随便选的"], ans: 0, exp: "钢琴的纯净和空旷，像一个人在废墟中独自思考。芦苇说：声音越少，心越清晰。" },
    { q: "《如果没有你》歌名的「如果」二字有什么深意？", opts: ["假设性思考，暗示已经失去", "对未来充满希望", "表达确定", "没有意义"], ans: 0, exp: "「如果」是最无力的词，因为假设的前提是「已经不在了」。芦苇说：说如果的人，都在后悔。" },
    { q: "《如果没有你》中「Hey 我真的好想你」的「Hey」有什么作用？", opts: ["像在对空气说话，增加孤独感", "只是语气词", "叫别人的名字", "没有意义"], ans: 0, exp: "「Hey」像对着空房间喊了一声，没有人回应。芦苇说：最孤独的，是对着空气说话。" },
    { q: "《如果没有你》的副歌旋律最高音表达了什么情绪？", opts: ["思念的呐喊", "快乐的欢呼", "平静的叙述", "愤怒的爆发"], ans: 0, exp: "最高音像在喊一个名字，喊完又沉下去，像叹息。芦苇说：最高的音，是最想说的话。" },
    { q: "《如果没有你》中「太多的情绪 没适当的表情」这句歌词揭示了什么？", opts: ["情绪复杂到无法用表情表达", "没有情绪", "表情太多", "不想表达"], ans: 0, exp: "当情绪太多太乱，反而什么都表现不出来。芦苇说：最痛的时候，是哭不出来的。" },
    { q: "《爱》这首歌的开头「你还记得吗」用了什么修辞？", opts: ["设问", "反问", "夸张", "排比"], ans: 0, exp: "设问句像在试探，也在自问。芦苇说：问别人的时候，也在问自己。" },
    { q: "《爱》中「因为我会想起你」和「因为我会忘记你」的矛盾表达了什么？", opts: ["爱与痛的纠缠", "确定的爱", "确定的恨", "无所谓"], ans: 0, exp: "想忘掉又忘不掉，想起又觉得痛，是爱的本质。芦苇说：爱一个人，就是想忘也忘不掉。" },
    { q: "《爱》的作词人李焯雄在这首歌中用了什么结构技巧？", opts: ["对比与矛盾反复出现", "平铺直叙", "倒叙", "插叙"], ans: 0, exp: "「想起」和「忘记」、「快乐」和「寂寞」反复对比，像在拉扯。芦苇说：爱就是一边想靠近，一边想逃离。" },
    { q: "《爱》中「那寂寞的海」和「那狂烈的爱」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把寂寞比作海，把爱比作狂烈的风，都是自然的意象。芦苇说：寂寞像海，无边无际。" },
    { q: "《爱》的旋律为什么在中低音区徘徊？", opts: ["表达压抑与克制", "高音唱不上去", "随便写的", "模仿别人"], ans: 0, exp: "中低音区的旋律像在压抑情绪，想喊又不敢喊。芦苇说：最深的爱，往往说不出口。" },
    { q: "《爱》中「也许我根本喜欢被你浪费」这句歌词的哲学是什么？", opts: ["爱是不计代价的付出", "爱要计较得失", "爱是交易", "爱是负担"], ans: 0, exp: "真正的爱是「浪费」也愿意，因为那个人值得。芦苇说：爱一个人，就是愿意为他浪费时间。" },
    { q: "《广岛之恋》的歌名灵感来自哪里？", opts: ["同名法国电影", "日本地名", "爱情故事", "战争故事"], ans: 0, exp: "取自法国电影《广岛之恋》，讲述一段短暂的异国恋情。芦苇说：有些爱，注定只有一夜。" },
    { q: "《广岛之恋》中「你早就该拒绝我」这句歌词用了什么时态？", opts: ["过去虚拟", "现在进行", "将来时", "完成时"], ans: 0, exp: "「早就该」是过去虚拟，暗示已经来不及了。芦苇说：最痛的，是「早知道」。" },
    { q: "《广岛之恋》的男女对唱形式有什么意义？", opts: ["表现两个人的内心独白", "为了好听", "随便安排的", "模仿别人"], ans: 0, exp: "两个人的声音交替，像在对话又像在自言自语。芦苇说：有些话，不敢对你说，只能唱给自己听。" },
    { q: "《广岛之恋》中「不够时间好好来爱你」和「不够时间好好来恨你」的矛盾表达了什么？", opts: ["爱与恨的纠缠，时间不够", "确定的爱", "确定的恨", "无所谓"], ans: 0, exp: "爱和恨都需要时间，但时间不够，所以更遗憾。芦苇说：爱和恨，都需要时间。" },
    { q: "《广岛之恋》的副歌旋律有什么特点？", opts: ["反复的模进像在追问", "一直下行", "一直上行", "平直无变化"], ans: 0, exp: "旋律反复模进，像在反复问「为什么」。芦苇说：问不出口的话，用旋律问。" },
    { q: "《盛夏的果实》中「时间累积这盛夏的果实」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把时间比作能累积果实的人，时间久了，感情就有了结果。芦苇说：时间会给一切答案。" },
    { q: "《盛夏的果实》中「也许放弃 才能靠近你」这句的矛盾修辞表达了什么？", opts: ["爱到极致是放手", "爱就要占有", "放弃就是放弃", "无所谓"], ans: 0, exp: "有些爱，靠得太近反而会窒息，放手反而能让对方记住你。芦苇说：最深的爱，是给你自由。" },
    { q: "《盛夏的果实》的旋律为什么以中低音为主？", opts: ["表达成熟与沉淀", "高音唱不上去", "随便写的", "模仿别人"], ans: 0, exp: "中低音区像一个人成熟的嗓音，在回忆过去的感情。芦苇说：成熟的标志，是说话越来越小声。" },
    { q: "《盛夏的果实》中「以为你会说什么 才会离开我」用了什么句式？", opts: ["假设期待", "肯定陈述", "否定疑问", "命令式"], ans: 0, exp: "「以为你会说什么」是期待落空的假设，更显失落。芦苇说：等不到的，才是最想要的。" },
    { q: "《电台情歌》中「谁能够将电台情歌关掉」用了什么修辞？", opts: ["拟人", "比喻", "夸张", "排比"], ans: 0, exp: "把电台情歌拟人化，好像它能自己选择播放。芦苇说：关不掉的不只是电台，是回忆。" },
    { q: "《电台情歌》的编曲中，电子音效的作用是什么？", opts: ["营造孤独的都市感", "增加音量", "装饰", "没有作用"], ans: 0, exp: "电子音效像深夜电台的信号声，忽远忽近。芦苇说：深夜听电台的人，都是孤独的。" },
    { q: "《电台情歌》中「我们一直忘了要搭一座桥」的「桥」比喻什么？", opts: ["沟通的桥梁", "实际的路", "爱的连接", "梦想"], ans: 0, exp: "桥是沟通，是理解，是两个人之间的通道。芦苇说：没有桥，两个人就是孤岛。" },
    { q: "《电台情歌》的副歌旋律有什么特点？", opts: ["反复模进像在重复同一句话", "一直上行", "一直下行", "平直无变化"], ans: 0, exp: "旋律反复模进，像在重复说同一句话，说到你记住为止。芦苇说：重要的话，要说很多遍。" },
    { q: "《电台情歌》中「谁能够将天上月亮电源关掉」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "月亮不能关电源，夸张表达了「什么也关不掉」的无奈。芦苇说：关不掉的，不只是月亮。" },
    { q: "《十二楼》这首歌的主题是什么？", opts: ["都市女性的孤独", "爱情甜蜜", "友情温暖", "梦想追逐"], ans: 0, exp: "十二楼是城市的高度，也是孤独的高度。芦苇说：越高，越冷。" },
    { q: "《十二楼》中「日子像是道灰墙」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把日子比作灰墙，单调、沉闷、没有出口。芦苇说：最可怕的不是痛苦，是重复。" },
    { q: "《十二楼》的编曲风格是？", opts: ["慵懒的爵士风", "激烈的摇滚", "古典弦乐", "电子舞曲"], ans: 0, exp: "爵士的慵懒和都市的疏离感完美契合。芦苇说：爵士是城市的声音。" },
    { q: "《十二楼》中「你骂的 还觉得痒」这句歌词表达了什么？", opts: ["麻木与无感", "快乐与兴奋", "愤怒与不满", "平静与释然"], ans: 0, exp: "被骂到没感觉，是麻木，是放弃。芦苇说：最可怕的不是痛，是痛习惯了。" },
    { q: "《单人房双人床》歌名有什么矛盾之处？", opts: ["单人房却有双人床，暗示有人离开", "双人房单人床", "单人房单人床", "双人房双人床"], ans: 0, exp: "房间是一个人的，床却是两个人的，暗示曾经有人。芦苇说：留下的东西，最刺眼。" },
    { q: "《单人房双人床》中「也许你的爱是双人床」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把爱比作双人床，能容下两个人，但太大了。芦苇说：爱太大了，一个人睡不着。" },
    { q: "《单人房双人床》的旋律为什么以中低音为主？", opts: ["表达压抑与孤独", "高音唱不上去", "随便写的", "模仿别人"], ans: 0, exp: "中低音像一个人在房间里自言自语，不敢大声。芦苇说：孤独的时候，说话也会变小声。" },
    { q: "《单人房双人床》中「我一个人的床上 怎么会有双人床」表达了什么？", opts: ["对过去的质问", "对未来的憧憬", "对现在的满足", "对痛苦的逃避"], ans: 0, exp: "在质问空气，也在质问自己。芦苇说：最想问的人，不在。" },
    { q: "莫文蔚的嗓音在这首歌中有什么特点？", opts: ["慵懒中带着疏离感", "高亢激昂", "甜美可爱", "沙哑沧桑"], ans: 0, exp: "她的声音像猫，慵懒又疏离，让你想靠近又不敢。芦苇说：有些声音，像猫一样，抓不住。" },
    { q: "莫文蔚在歌坛被称为「华语乐坛的什么」？", opts: ["百变女王", "情歌天后", "摇滚女王", "创作才女"], ans: 0, exp: "她能唱情歌、爵士、摇滚、民谣，风格多变。芦苇说：百变，是因为足够强。" },
    { q: "莫文蔚的《慢慢喜欢你》中「慢慢喜欢你」的「慢慢」表达了什么？", opts: ["爱情需要时间沉淀", "爱情要快", "爱情不需要时间", "爱情靠缘分"], ans: 0, exp: "慢慢来的爱情，才经得起时间考验。芦苇说：最快的爱，往往走得最快。" },
    { q: "《慢慢喜欢你》的旋律为什么以中速为主？", opts: ["符合「慢慢」的主题", "随便选的", "模仿别人", "快不起来"], ans: 0, exp: "中速的旋律像散步，不急不慢。芦苇说：慢慢走，风景才看得清。" },
    { q: "《慢慢喜欢你》中「书里总爱写到喜出望外的傍晚」用了什么修辞？", opts: ["拟人", "比喻", "夸张", "排比"], ans: 0, exp: "把书拟人化，好像书也渴望爱情。芦苇说：书里写的，都是我们想要的。" },
    { q: "莫文蔚的演唱中常用什么技巧来表达情感？", opts: ["气声和尾音的拿捏", "嘶吼", "喊叫", "美声"], ans: 0, exp: "气声像叹息，尾音的颤音像在忍住不哭。芦苇说：最动人的声音，是快要哭出来的声音。" },
    { q: "莫文蔚《爱》曾在金曲奖获得什么奖项？", opts: ["最佳女演唱人", "最佳歌曲", "最佳专辑", "最佳作词"], ans: 0, exp: "《爱》让莫文蔚拿下第14届金曲奖最佳女演唱人。芦苇说：好歌，值得被记住。" },
    { q: "《爱》中「你还记得吗」的「你」指的是谁？", opts: ["过去的恋人", "现在的恋人", "自己", "朋友"], ans: 0, exp: "「你」可能是某个具体的人，也可能是过去的自己。芦苇说：问别人的时候，也在问自己。" },
    { q: "《阴天》中「男人大可不必百口莫辩」这句揭示了什么？", opts: ["感情里解释无用", "男人要解释", "女人要解释", "不需要沟通"], ans: 0, exp: "当感情走到尽头，解释什么都没用。芦苇说：不爱了，说什么都是借口。" },
    { q: "《如果没有你》中「Hey 我真的好想你」重复了几次？", opts: ["两次，像在强调", "一次", "三次", "四次"], ans: 0, exp: "重复两次像在确认，也是在说服自己。芦苇说：说两次的话，最真。" },
    { q: "《忽然之间》中「我明白 太放不开你的爱」的「放不开」表达了什么？", opts: ["依赖与不舍", "厌恶与逃离", "无所谓", "快乐"], ans: 0, exp: "放不开是因为太依赖，也是因为不舍。芦苇说：放不开的，才是真爱。" },
    { q: "《广岛之恋》中「你早就该拒绝我」的「早」字有什么意义？", opts: ["强调时机已过", "强调现在", "强调未来", "没有意义"], ans: 0, exp: "「早」字暗示已经来不及，是最大的遗憾。芦苇说：最好的时机，永远是当初。" },
    { q: "《盛夏的果实》中「时间累积这盛夏的果实」的「累积」用了什么修辞？", opts: ["拟人", "比喻", "夸张", "排比"], ans: 0, exp: "把时间拟人化，好像它能主动累积东西。芦苇说：时间不说话，但它会给你答案。" },
    { q: "《电台情歌》中「我们一直忘了要搭一座桥」的「忘了」表达了什么？", opts: ["疏忽与遗憾", "故意不做", "做不到", "不想做"], ans: 0, exp: "不是不想搭，是忘记了，更遗憾。芦苇说：最可惜的，是本可以做却没做。" },
    { q: "莫文蔚的音乐风格为什么很难被定义？", opts: ["她尝试了太多风格", "没有风格", "只会一种", "模仿别人"], ans: 0, exp: "从情歌到爵士，从摇滚到电子，她都在尝试。芦苇说：不被定义，才是最大的定义。" },
    { q: "莫文蔚的《不散，不见》这首歌的主题是什么？", opts: ["告别的另一种方式", "永远不分开", "再也不见", "天天见面"], ans: 0, exp: "「不散，不见」是「不散场就不会有见面的机会」。芦苇说：告别，是为了更好的再见。" },
    { q: "《不散，不见》中「不见不散」和「不散不见」的区别是什么？", opts: ["前者是约定，后者是告别", "一样", "相反", "没关系"], ans: 0, exp: "「不见不散」是等你的约定，「不散不见」是告别的无奈。芦苇说：有时候，不散场就没办法重新开始。" },
    { q: "莫文蔚在《忽然之间》中用了什么唱法来表达脆弱感？", opts: ["气声和弱混声", "强混声", "嘶吼", "喊叫"], ans: 0, exp: "气声让声音像快要断掉，表达极致的脆弱。芦苇说：最脆弱的时候，声音也是脆弱的。" },
    { q: "《爱》中「也许我根本喜欢被你浪费」的「根本」二字有什么作用？", opts: ["强调是本质和本能", "表示否定", "表示可能", "没有意义"], ans: 0, exp: "「根本」二字说明这不是选择，是本能。芦苇说：爱一个人，是不需要理由的。" },
    { q: "《广岛之恋》的男女声部交替像什么？", opts: ["两个人的内心独白", "合唱", "独唱", "重唱"], ans: 0, exp: "像两个人在同一空间里各自沉默。芦苇说：最远的距离，是人在旁边，心在别处。" },
    { q: "莫文蔚的《看透》这首歌的主题是什么？", opts: ["看透爱情的本质", "看不透", "爱情的甜蜜", "爱情的痛苦"], ans: 0, exp: "看透之后，是释然也是失望。芦苇说：看透了，就不痛了。" }
],
"张学友": [
    { q: "《吻别》前奏的萨克斯风有什么象征意义？", opts: ["离别的哀愁与无奈", "欢乐与庆祝", "紧张与悬疑", "平静与安详"], ans: 0, exp: "萨克斯风的音色本身就带着一丝沧桑和感伤，像一个人在深夜独自吹奏。芦苇说：萨克斯一响，心就跟着沉下去了。" },
    { q: "《吻别》中「前尘往事成云烟」用了什么修辞手法？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把过去的事比作云烟，看得见抓不住，风一吹就散。芦苇说：往事如烟，不是忘了，是散得找不到了。" },
    { q: "《吻别》副歌「我和你吻别 在无人的街」的旋律走向有什么特点？", opts: ["上行后急转直下，像情绪崩溃", "一直上行", "一直下行", "平直无变化"], ans: 0, exp: "旋律先上行积累情绪，到「吻别」后急转直下，像话说到一半哭了出来。芦苇说：最高音的地方，是最痛的时刻。" },
    { q: "《吻别》中「总在刹那间 有一些了解」的「刹那间」强调了什么？", opts: ["顿悟的瞬间", "漫长的过程", "无所谓的状态", "快乐的心情"], ans: 0, exp: "「刹那间」是突然明白的瞬间，像被雷劈中。芦苇说：有些道理，不是慢慢懂的，是一瞬间就懂了。" },
    { q: "《吻别》的作词人是谁？他的歌词风格在这首歌中如何体现？", opts: ["何启弘，口语化、像在倾诉", "林夕，华丽抽象", "方文山，古风诗意", "姚若龙，温暖治愈"], ans: 0, exp: "「我的世界开始下雪」像在说天气，其实在说心情。芦苇说：最好的比喻，是让你以为是真事。" },
    { q: "《吻别》中「冷得连隐藏的遗憾 都那么的明显」的「冷」字有什么深意？", opts: ["不只是天气冷，是心冷", "真的在说天气", "随便写的", "为了押韵"], ans: 0, exp: "「冷」是天气也是心情，身体的冷和心里的冷叠在一起。芦苇说：最冷的时候，不是冬天，是心凉的时候。" },
    { q: "《吻别》的编曲中，弦乐的作用是什么？", opts: ["烘托悲壮的气氛", "增加音量", "装饰", "没有作用"], ans: 0, exp: "弦乐从弱到强，像情绪慢慢积累，到副歌爆发。芦苇说：弦乐一拉，眼泪就跟着来了。" },
    { q: "《一千个伤心的理由》歌名中的「一千个」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "「一千个」是夸张，不是真的数过，是太多了数不清。芦苇说：伤心的理由，一个就够了。" },
    { q: "《一千个伤心的理由》中「最后我的爱情在故事里慢慢陈旧」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把爱情比作故事，会慢慢陈旧，像一本翻旧的书。芦苇说：爱情不是死了，是旧了。" },
    { q: "《一千个伤心的理由》的副歌旋律为什么反复重复同一乐句？", opts: ["像在反复问同一个问题", "随便写的", "模仿别人", "为了好记"], ans: 0, exp: "反复重复像一个人反复在问「为什么」。芦苇说：想不通的事，就会一直想。" },
    { q: "《一千个伤心的理由》中「被伤过的心还可以爱谁」用了什么句式？", opts: ["反问", "陈述", "疑问", "命令"], ans: 0, exp: "反问句加强无奈感，答案是「不知道」。芦苇说：被伤过的心，不是不能爱，是不敢爱。" },
    { q: "《一千个伤心的理由》的编曲中，钢琴的分解和弦有什么作用？", opts: ["像眼泪一滴一滴落下", "增加音量", "装饰", "没有作用"], ans: 0, exp: "钢琴的分解和弦像眼泪一颗一颗掉下来，不急不慢。芦苇说：最痛的哭，是没有声音的。" },
    { q: "《祝福》这首歌的主题是什么？", opts: ["离别时的祝福", "热恋的甜蜜", "分手的痛苦", "重逢的喜悦"], ans: 0, exp: "不是不伤感，而是把伤感藏在祝福里。芦苇说：最好的告别，是祝你幸福。" },
    { q: "《祝福》中「不要问 不要说」用了什么修辞？", opts: ["排比", "比喻", "拟人", "夸张"], ans: 0, exp: "两个「不」字开头的短句排比，像在告诉自己「别问了」。芦苇说：有些话，问出来就输了。" },
    { q: "《祝福》的副歌旋律有什么特点？", opts: ["上扬的旋律像在抬头看远方", "一直下行", "平直无变化", "快速跳跃"], ans: 0, exp: "上扬的旋律像在抬头看天，把祝福送到远方。芦苇说：抬头的时候，眼泪不会掉下来。" },
    { q: "《祝福》中「伤离别 离别虽然在眼前」的「虽然」表达了什么？", opts: ["转折与不舍", "确定与肯定", "快乐与兴奋", "平静与释然"], ans: 0, exp: "「虽然」是转折，前面是「伤离别」，后面是「说再见」。芦苇说：最难的，是说再见。" },
    { q: "《祝福》的和声进行有什么特点？", opts: ["温暖的大调为主", "悲伤的小调为主", "紧张的不协和", "无调性"], ans: 0, exp: "大调让整首歌充满希望，不是绝望的告别。芦苇说：笑着说的再见，最痛。" },
    { q: "《祝福》中「若有缘 有缘就能期待明天」的「若有缘」用了什么句式？", opts: ["假设", "肯定", "否定", "命令"], ans: 0, exp: "假设句把重逢交给缘分，不是承诺。芦苇说：我不敢说一定会再见，但我希望。" },
    { q: "《祝福》的编曲中，笛子的出现有什么意义？", opts: ["中国风的温暖感", "增加音量", "装饰", "没有作用"], ans: 0, exp: "笛子的音色温暖又略带沧桑，像一个人在远方吹奏。芦苇说：笛声一响，就像有人在喊你回家。" },
    { q: "《李香兰》这首歌的原曲是？", opts: ["日本作曲家玉置浩二的《行かないで》", "周杰伦写的", "林俊杰写的", "原创"], ans: 0, exp: "改编自玉置浩二的《行かないで》（不要走）。芦苇说：好歌不分国界。" },
    { q: "《李香兰》中「恼春风 我心因何恼春风」的「恼」字有什么深意？", opts: ["不是恨春风，是怪自己", "真的恨春风", "随便写的", "为了押韵"], ans: 0, exp: "「恼」的不是春风，是自己为什么会被春风触动。芦苇说：我们气的不是别人，是自己。" },
    { q: "《李香兰》的副歌最高音表达了什么？", opts: ["撕心裂肺的呐喊", "快乐的欢呼", "平静的叙述", "愤怒的爆发"], ans: 0, exp: "最高音像在喊一个名字，喊到声嘶力竭。芦苇说：最高的音，是最放不下的人。" },
    { q: "《李香兰》中「像花虽未红 如冰虽不冻」用了什么修辞？", opts: ["对仗", "排比", "拟人", "夸张"], ans: 0, exp: "「像花虽未红」对「如冰虽不冻」，工整又唯美。芦苇说：最伤的花，是没开就谢了。" },
    { q: "《李香兰》的编曲为什么以钢琴和弦乐为主？", opts: ["营造孤独与空旷感", "增加音量", "装饰", "没有作用"], ans: 0, exp: "钢琴的空旷和弦乐的绵长，像一个人在空旷的房间里。芦苇说：声音越少，越听得到心跳。" },
    { q: "《每天爱你多一些》这首歌的主题是什么？", opts: ["爱会越来越多", "爱会越来越少", "爱不变", "爱消失"], ans: 0, exp: "不是一成不变，而是每天都在增加。芦苇说：最好的爱，是今天比昨天多一点。" },
    { q: "《每天爱你多一些》中「而每过一天 每一天 这醉者」的「醉者」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把自己比作「醉者」，不是醉了酒，是醉在爱里。芦苇说：爱一个人，就像喝醉了，醒不过来。" },
    { q: "《每天爱你多一些》的副歌旋律有什么特点？", opts: ["上行像爱在增长", "一直下行", "平直无变化", "快速跳跃"], ans: 0, exp: "上行旋律像爱在一天天增加，越来越高。芦苇说：爱不是静止的，是每天都在长。" },
    { q: "《每天爱你多一些》中「你可会轻轻柔柔的到」的「轻轻柔柔」用了什么修辞？", opts: ["叠词", "比喻", "拟人", "夸张"], ans: 0, exp: "叠词「轻轻柔柔」像风一样温柔，也像爱一样小心翼翼。芦苇说：爱一个人，会变温柔。" },
    { q: "《每天爱你多一些》的和声进行有什么特点？", opts: ["温暖的大调为主", "悲伤的小调为主", "紧张的不协和", "无调性"], ans: 0, exp: "大调让整首歌充满幸福感，像阳光照进来。芦苇说：爱是暖的。" },
    { q: "《只想一生跟你走》这首歌的主题是什么？", opts: ["一生一世的承诺", "短暂的爱情", "无所谓", "随便"], ans: 0, exp: "「只想」是唯一的选择，不是之一。芦苇说：一辈子，只想跟你走。" },
    { q: "《只想一生跟你走》中「共你有过最美的邂逅」的「最美」表达了什么？", opts: ["极致的完美", "一般的好", "差强人意", "无所谓"], ans: 0, exp: "「最美」是极致，没有更好的了。芦苇说：最美的邂逅，是遇见你。" },
    { q: "《只想一生跟你走》的副歌最高音表达了什么？", opts: ["坚定的承诺", "犹豫的疑问", "快乐的欢呼", "平静的叙述"], ans: 0, exp: "最高音像在喊「我决定了」，是承诺也是决心。芦苇说：最高的音，是最坚定的心。" },
    { q: "《只想一生跟你走》中「求你能在最后」的「求」字有什么深意？", opts: ["卑微的请求", "高傲的命令", "随便说说", "无意义"], ans: 0, exp: "「求」字放低了姿态，是真心的请求。芦苇说：爱一个人，会变得卑微。" },
    { q: "《忘记他》这首歌的主题是什么？", opts: ["想忘记却忘不掉", "已经忘记了", "从没记住", "无所谓"], ans: 0, exp: "歌名叫「忘记他」，但整首歌都在说「忘不掉」。芦苇说：越想忘的，越忘不掉。" },
    { q: "《忘记他》中「忘记他 等于忘掉了一切」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "夸张地说忘记他就等于忘掉一切，说明他有多重要。芦苇说：你是我的全世界。" },
    { q: "《忘记他》的编曲中，低音提琴的作用是什么？", opts: ["营造低沉压抑的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "低音提琴的音色低沉，像心里压着一块石头。芦苇说：最重的，不是石头，是想你。" },
    { q: "《忘记他》中「像忘记我 便是不容易」用了什么句式？", opts: ["否定句加强难度", "肯定句", "疑问句", "命令句"], ans: 0, exp: "否定句「不容易」比直接说「难」更有力量。芦苇说：最难的事，是忘记。" },
    { q: "《忘记他》的旋律为什么以中低音为主？", opts: ["表达压抑与低沉", "高音唱不上去", "随便写的", "模仿别人"], ans: 0, exp: "中低音像一个人低着头在走路，不敢抬头。芦苇说：难过的时候，头是抬不起来的。" },
    { q: "《你的名字我的姓氏》这首歌是张学友送给谁的？", opts: ["老婆罗美薇", "妈妈", "女儿", "粉丝"], ans: 0, exp: "送给妻子罗美薇的歌，用她的姓氏作为承诺。芦苇说：你的名字，加上我的姓氏，就是一辈子。" },
    { q: "《你的名字我的姓氏》中「只需要当天边海角竞赛追逐时」的「竞赛」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把追逐名利比作竞赛，暗示外面的世界很累。芦苇说：外面的世界再大，不如你身边。" },
    { q: "《你的名字我的姓氏》的副歌旋律有什么特点？", opts: ["温暖的上行像承诺", "一直下行", "平直无变化", "快速跳跃"], ans: 0, exp: "上行旋律像在一步步走向未来，坚定又温柔。芦苇说：承诺不是说说，是走下去。" },
    { q: "《你的名字我的姓氏》中「故事平淡但当中有你」的「平淡」表达了什么？", opts: ["平凡中的幸福", "无聊的生活", "痛苦的经历", "快乐的日子"], ans: 0, exp: "「平淡」不是无聊，是安稳，是细水长流。芦苇说：最幸福的事，是和你一起慢慢变老。" },
    { q: "《遥远的她》这首歌的主题是什么？", opts: ["对远方爱人的思念", "对身边人的爱", "对过去的回忆", "对未来的憧憬"], ans: 0, exp: "「遥远的她」是距离也是思念。芦苇说：远的不是距离，是心。" },
    { q: "《遥远的她》中「让晚风轻轻吹送了落霞」营造了什么氛围？", opts: ["黄昏的宁静与思念", "清晨的活力", "中午的热情", "深夜的孤独"], ans: 0, exp: "晚风和落霞，是黄昏，是一天结束的时候，最容易想人。芦苇说：黄昏的时候，最想家。" },
    { q: "《遥远的她》的副歌最高音表达了什么？", opts: ["思念的呐喊", "快乐的欢呼", "平静的叙述", "愤怒的爆发"], ans: 0, exp: "最高音像在喊一个名字，喊到声音沙哑。芦苇说：最远的距离，是你在心里，却在远方。" },
    { q: "《遥远的她》中「遥远的她 仿佛借风声跟我话」的「仿佛」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "「仿佛」是好像不是真的，暗示这只是想象。芦苇说：我听见的风声，是你吗？" },
    { q: "《遥远的她》的原曲是？", opts: ["日本歌手谷村新司的《浪漫铁道》", "周杰伦写的", "林俊杰写的", "原创"], ans: 0, exp: "改编自谷村新司的《浪漫铁道》。芦苇说：好歌跨越国界。" },
    { q: "《分手总要在雨天》这首歌的主题是什么？", opts: ["雨天和分手的关联", "晴天分手", "雪天分手", "任何天气"], ans: 0, exp: "雨天让分手更伤感，雨和泪分不清。芦苇说：下雨的时候，分不清是雨还是泪。" },
    { q: "《分手总要在雨天》中「总要在雨天」的「总要」表达了什么？", opts: ["命中注定的无奈", "可以选择", "随便", "无所谓"], ans: 0, exp: "「总要」暗示是宿命，逃不掉。芦苇说：有些事，像下雨一样，躲不掉。" },
    { q: "《分手总要在雨天》的编曲中，雨声的音效有什么作用？", opts: ["烘托氛围，雨声像泪声", "增加音量", "装饰", "没有作用"], ans: 0, exp: "雨声让听者置身于雨天，雨和泪分不清。芦苇说：雨下得越大，心越冷。" },
    { q: "《分手总要在雨天》中「总要在雨天 人便怀念」的「便」字有什么意义？", opts: ["因果关系，一到雨天就想你", "随便", "无所谓", "没有意义"], ans: 0, exp: "「便」字说明是自然反应，像条件反射。芦苇说：一到下雨天，就想起你。" },
    { q: "《分手总要在雨天》的副歌旋律有什么特点？", opts: ["下行像雨水滑落", "一直上行", "平直无变化", "快速跳跃"], ans: 0, exp: "下行旋律像雨滴落下，也像情绪往下沉。芦苇说：下雨的时候，心情也在下雨。" },
    { q: "《等你等到我心痛》这首歌的主题是什么？", opts: ["等待的煎熬与心痛", "等待的甜蜜", "等待的无所谓", "不等了"], ans: 0, exp: "等到心痛，是等得太久太久了。芦苇说：最痛的，不是等不到，是不知道还要等多久。" },
    { q: "《等你等到我心痛》中「等你等到我心痛」的「心痛」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "「等到心痛」是夸张，心痛是身体的反应，不是等待的必然。芦苇说：等一个人，心真的会痛。" },
    { q: "《等你等到我心痛》的副歌最高音表达了什么？", opts: ["等待的崩溃", "等待的快乐", "等待的平静", "等待的无所谓"], ans: 0, exp: "最高音像在喊「你还要我等多久」。芦苇说：最高音的地方，是最想放弃的时候。" },
    { q: "《等你等到我心痛》中「怎么你变这样」的「变」字表达了什么？", opts: ["对变化的惊讶与不解", "对不变的欣慰", "无所谓", "快乐"], ans: 0, exp: "「变」字暗示对方不是原来的那个人了。芦苇说：最可怕的，是你变了，我还在等。" },
    { q: "《等你等到我心痛》的编曲中，鼓点的节奏有什么特点？", opts: ["缓慢的鼓点像心跳", "快速的鼓点", "没有鼓点", "随便的鼓点"], ans: 0, exp: "缓慢的鼓点像等待时的心跳，一下一下地敲。芦苇说：等一个人的时候，心跳声最大。" },
    { q: "《还是觉得你最好》这首歌的主题是什么？", opts: ["比较之后发现还是你最好", "你本来就好", "别人更好", "无所谓"], ans: 0, exp: "经过了比较，才确定你是最好的。芦苇说：不是一开始就知道，是走了很远才发现。" },
    { q: "《还是觉得你最好》中「即使你离开 我热情未改」的「未改」表达了什么？", opts: ["不变的真心", "已经改变", "随便", "无所谓"], ans: 0, exp: "「未改」是没变，是初心还在。芦苇说：你走了，我的心还在。" },
    { q: "《还是觉得你最好》的副歌旋律有什么特点？", opts: ["温暖的上行像确认", "一直下行", "平直无变化", "快速跳跃"], ans: 0, exp: "上行旋律像在一步步确认「就是你」。芦苇说：走了很远，还是觉得你最好。" },
    { q: "《还是觉得你最好》中「好 终于你投入别人怀抱」的「终于」用了什么修辞？", opts: ["反讽", "比喻", "拟人", "夸张"], ans: 0, exp: "「终于」是反讽，好像在说「你终于还是走了」。芦苇说：最痛的话，是笑着说。" },
    { q: "《还是觉得你最好》的和声进行有什么特点？", opts: ["温暖的大调为主", "悲伤的小调为主", "紧张的不协和", "无调性"], ans: 0, exp: "大调让整首歌有释然感，不是怨恨。芦苇说：不恨你，只是觉得你最好。" }
],"徐良": [
    { q: "《客官不可以》这首歌的歌名用了什么修辞手法？", opts: ["双关", "比喻", "拟人", "夸张"], ans: 0, exp: "「客官」是古代对顾客的称呼，「不可以」是拒绝，合在一起制造了幽默又暧昧的效果。芦苇说：有些拒绝，其实是欲拒还迎。" },
    { q: "《客官不可以》中「客官不可以 你靠的越来越近」的旋律有什么特点？", opts: ["轻快的节奏像在撒娇", "沉重的节奏", "缓慢的节奏", "没有节奏"], ans: 0, exp: "轻快的节奏和俏皮的旋律，让「拒绝」听起来不像拒绝。芦苇说：嘴上说不要，身体很诚实。" },
    { q: "《客官不可以》是徐良与谁合唱的？", opts: ["小凌", "本兮", "阿悄", "庄心妍"], ans: 0, exp: "与女歌手小凌合唱，女声的俏皮和男声的无奈形成对比。芦苇说：一唱一和，像在演一出小剧场。" },
    { q: "《客官不可以》中「这的确是一个很大的败笔」的「败笔」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把感情中的失误比作画中的败笔，暗示这段关系是「作品」也是「错误」。芦苇说：有些错，画上去就改不了了。" },
    { q: "《客官不可以》的副歌反复重复「客官不可以」，用了什么修辞？", opts: ["反复", "排比", "对仗", "拟人"], ans: 0, exp: "反复强调「不可以」，像在说服对方，也在说服自己。芦苇说：说不可以的时候，其实最想可以。" },
    { q: "《客官不可以》的编曲中，电子音效的作用是什么？", opts: ["营造俏皮和网络感", "增加音量", "装饰", "没有作用"], ans: 0, exp: "电子音效和轻快的鼓点，让人一听就知道是网络歌曲时代的产物。芦苇说：那个年代的歌，一听就知道是哪年的。" },
    { q: "《客官不可以》中「你像在演电视剧」的「像」字用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把对方的行为比作演戏，暗示不真实。芦苇说：太假的爱，像在演戏。" },
    { q: "《客官不可以》这首歌代表了哪个时代的网络音乐风格？", opts: ["2010年前后的网络歌曲热潮", "1990年代", "2000年代初期", "2020年代"], ans: 0, exp: "那是QQ空间、MP3、网络歌手爆红的年代。芦苇说：那个年代的音乐，是我们的青春。" },
    { q: "《犯贱》这首歌的歌名有什么争议？", opts: ["「犯贱」是自嘲也是质问", "太粗俗", "太文雅", "太普通"], ans: 0, exp: "「犯贱」是网络用语，用在歌名里既大胆又真实。芦苇说：爱一个人，有时候就是犯贱。" },
    { q: "《犯贱》中「我结婚的时候 你一定要来」为什么让人心痛？", opts: ["来看我娶别人，是最残忍的邀请", "分享喜悦", "随便说说", "无意义"], ans: 0, exp: "邀请最爱的人来看自己娶别人，是炫耀也是折磨。芦苇说：最狠的，是让你看着我幸福。" },
    { q: "《犯贱》中「因为我相信 你只是怕伤害我」的「只是」用了什么修辞？", opts: ["转折", "并列", "递进", "因果"], ans: 0, exp: "「只是」是转折，前面是「你离开我」，后面是「怕伤害我」，自欺欺人。芦苇说：最傻的，是给对方找借口。" },
    { q: "《犯贱》的副歌旋律有什么特点？", opts: ["反复模进像在纠结", "一直上行", "一直下行", "平直无变化"], ans: 0, exp: "旋律反复模进，像在一个问题上绕来绕去出不来。芦苇说：想不通的事，就会一直想。" },
    { q: "《犯贱》中「为什么你对我那么地坏」的「那么地」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "「那么地」是夸张，强调对方的「坏」程度。芦苇说：最坏的人，是你爱过的人。" },
    { q: "《犯贱》的编曲中，钢琴的分解和弦有什么作用？", opts: ["像纠结的心跳", "增加音量", "装饰", "没有作用"], ans: 0, exp: "钢琴的分解和弦一下一下地敲，像在纠结的心跳。芦苇说：纠结的时候，心跳也是乱的。" },
    { q: "《红装》这首歌的主题是什么？", opts: ["穿上红装（嫁衣）的不是我", "穿上红装的快乐", "红装的意义", "红装的美丽"], ans: 0, exp: "「你穿上了红装」意味着你嫁给了别人。芦苇说：最刺眼的红，是嫁衣的红。" },
    { q: "《红装》中「你穿上了红装」的「红装」用了什么修辞？", opts: ["借代", "比喻", "拟人", "夸张"], ans: 0, exp: "用「红装」借代婚礼，暗示你嫁给了别人。芦苇说：红色，是最喜庆也最刺眼的颜色。" },
    { q: "《红装》的副歌最高音表达了什么？", opts: ["不甘与心痛", "快乐与兴奋", "平静与释然", "愤怒与不满"], ans: 0, exp: "最高音像在喊「为什么不是我」。芦苇说：最高的音，是最不甘心的时候。" },
    { q: "《红装》中「我还在原地 你却已经走远」的「原地」和「走远」用了什么修辞？", opts: ["对比", "排比", "拟人", "夸张"], ans: 0, exp: "「原地」和「走远」对比，一个停一个走，距离越来越大。芦苇说：最远的距离，是你在走，我在等。" },
    { q: "《红装》的编曲中，二胡的出现有什么意义？", opts: ["增加中国风的悲凉感", "增加音量", "装饰", "没有作用"], ans: 0, exp: "二胡的音色本就悲凉，像在哭。芦苇说：二胡一拉，眼泪就下来了。" },
    { q: "《坏女孩》这首歌的主题是什么？", opts: ["喜欢上了一个「坏」女孩", "讨厌坏女孩", "坏女孩的定义", "坏女孩的快乐"], ans: 0, exp: "「坏」不是真的坏，是不符合常规，是让人着迷的危险。芦苇说：好女孩让人安心，坏女孩让人心动。" },
    { q: "《坏女孩》中「你说我是坏女孩 我是坏女孩」的重复用了什么修辞？", opts: ["反复", "排比", "对仗", "拟人"], ans: 0, exp: "反复说「我是坏女孩」，像在承认，也像在自嘲。芦苇说：你说我是坏的，我就是坏的。" },
    { q: "《坏女孩》的副歌旋律有什么特点？", opts: ["轻快的节奏像不在乎", "沉重的节奏", "缓慢的节奏", "没有节奏"], ans: 0, exp: "轻快的旋律和歌词的「坏」形成反差，像在说「我不在乎」。芦苇说：越不在乎的人，其实最在乎。" },
    { q: "《坏女孩》中「你爱过我吗」的疑问表达了什么？", opts: ["不确定与不安", "确定与肯定", "无所谓", "快乐"], ans: 0, exp: "问出这个问题的时候，答案已经不重要了。芦苇说：问「你爱过我吗」的时候，已经输了。" },
    { q: "《坏女孩》的编曲中，电子鼓的节奏有什么特点？", opts: ["轻快跳跃像心跳", "沉重缓慢", "没有节奏", "随便的节奏"], ans: 0, exp: "轻快的电子鼓像故作轻松的心情。芦苇说：装作不在乎，是最累的事。" },
    { q: "《七秒钟的记忆》这首歌的主题是什么？", opts: ["鱼的七秒记忆比喻短暂的爱情", "鱼的记忆", "七秒的意义", "记忆的短暂"], ans: 0, exp: "传说鱼只有七秒记忆，比喻爱情短暂到记不住。芦苇说：如果只有七秒，我会在每一秒都记住你。" },
    { q: "《七秒钟的记忆》中「我们的爱 像七秒钟的记忆」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把爱比作七秒的记忆，短暂又脆弱。芦苇说：最短暂的，是最难忘的。" },
    { q: "《七秒钟的记忆》的副歌旋律有什么特点？", opts: ["反复模进像在重复回忆", "一直上行", "一直下行", "平直无变化"], ans: 0, exp: "旋律反复模进，像在反复回忆那七秒。芦苇说：越想记住的，越容易忘。" },
    { q: "《七秒钟的记忆》中「我快要忘记你 却想起」的转折表达了什么？", opts: ["想忘忘不掉的无奈", "真的忘了", "不想忘", "无所谓"], ans: 0, exp: "「快要忘记」是希望，「却想起」是现实。芦苇说：越想忘的，越忘不掉。" },
    { q: "《七秒钟的记忆》的编曲中，钢琴的音色有什么特点？", opts: ["清脆又脆弱像记忆", "沉重", "欢快", "没有特点"], ans: 0, exp: "清脆的钢琴音色像玻璃，一碰就碎。芦苇说：记忆是脆的。" },
    { q: "《天使的翅膀》这首歌的主题是什么？", opts: ["天使的翅膀是守护", "天使的翅膀是束缚", "天使的翅膀是美丽", "天使的翅膀是负担"], ans: 0, exp: "天使的翅膀是守护，即使你不在身边。芦苇说：你走了，翅膀还在。" },
    { q: "《天使的翅膀》中「我相信 你还在这里」的「相信」用了什么修辞？", opts: ["重复", "排比", "对仗", "拟人"], ans: 0, exp: "「相信」是信念，不是事实。芦苇说：我相信你还在，是最大的自欺。" },
    { q: "《天使的翅膀》的副歌最高音表达了什么？", opts: ["信念的坚定", "快乐的欢呼", "平静的叙述", "愤怒的爆发"], ans: 0, exp: "最高音像在喊「我相信」，喊给自己听。芦苇说：最高音的地方，是最需要相信的时候。" },
    { q: "《天使的翅膀》中「你像天使一样 给我依赖 给我力量」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把对方比作天使，是赞美也是依赖。芦苇说：你是我的天使，你走了，谁来守护我？" },
    { q: "《天使的翅膀》的编曲中，弦乐的作用是什么？", opts: ["烘托温暖又悲伤的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "弦乐像天使的翅膀，轻轻包裹着你。芦苇说：弦乐一响，像被抱住了。" },
    { q: "《天真》这首歌的主题是什么？", opts: ["天真的代价", "天真的快乐", "天真的意义", "天真的美好"], ans: 0, exp: "天真是相信童话，代价是被现实伤害。芦苇说：太天真的人，伤得最深。" },
    { q: "《天真》中「我想要的爱情 不是这样」的「不是这样」表达了什么？", opts: ["失望与幻灭", "满足与快乐", "无所谓", "随便"], ans: 0, exp: "「不是这样」是期待落空，是幻想破灭。芦苇说：不是爱情变了，是我想得太美了。" },
    { q: "《天真》的副歌旋律有什么特点？", opts: ["下行像情绪坠落", "一直上行", "平直无变化", "快速跳跃"], ans: 0, exp: "下行旋律像从高处坠落，从天真掉到现实。芦苇说：天真的时候在天上，醒来在地上。" },
    { q: "《天真》中「你说过的谎话 像泡沫一样」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把谎话比作泡沫，美丽又易碎，一碰就破。芦苇说：泡沫再美，也是假的。" },
    { q: "《天真》的编曲中，钢琴的琶音有什么作用？", opts: ["像泡沫一个个破掉", "增加音量", "装饰", "没有作用"], ans: 0, exp: "钢琴的琶音像泡沫一个个浮上来，又一个个破掉。芦苇说：一个谎话，就是一个泡沫。" },

    { q: "《明明说好不哭》的编曲中，钢琴和吉他的配合有什么效果？", opts: ["营造纠结又温柔的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "钢琴的清脆和吉他的温暖交织，像在拉扯。芦苇说：想哭又忍着，最难受。" },
    { q: "《友情出演》这首歌的主题是什么？", opts: ["在爱情里只是友情出演", "主角", "配角", "观众"], ans: 0, exp: "「友情出演」是客串，不是主角，随时可以走。芦苇说：在爱情里演配角，是最心酸的事。" },

    { q: "《友情出演》的编曲中，弦乐的渐弱有什么意义？", opts: ["像电影散场，人慢慢走光", "增加音量", "装饰", "没有作用"], ans: 0, exp: "弦乐渐弱像电影散场，灯光暗了，人走了。芦苇说：散场的时候，最孤独。" },

    { q: "《体会》这首歌的主题是什么？", opts: ["爱情需要亲身体会", "听别人说就够了", "无所谓", "随便"], ans: 0, exp: "爱不是听别人说的，是自己经历的。芦苇说：没痛过，不算爱过。" },
    { q: "《体会》中「爱不到最后 不是谁的错」的「不是谁的错」表达了什么？", opts: ["释然与放下", "怨恨与责怪", "无所谓", "随便"], ans: 0, exp: "不是谁的错，只是不合适。芦苇说：不爱了，不是谁错了。" },
    { q: "《体会》的副歌旋律有什么特点？", opts: ["下行像情绪沉淀", "一直上行", "平直无变化", "快速跳跃"], ans: 0, exp: "下行旋律像从高处慢慢落下，像想通了。芦苇说：想通了，心就放下了。" },
    { q: "《体会》中「这世界 原本就 没有对错」的「原本」用了什么修辞？", opts: ["强调本质", "否定", "肯定", "疑问"], ans: 0, exp: "「原本」是本质，是一开始就是这样的。芦苇说：世界本来就没有对错，只有选择。" },
    { q: "《体会》的和声进行有什么特点？", opts: ["温暖的大调为主", "悲伤的小调为主", "紧张的不协和", "无调性"], ans: 0, exp: "大调让整首歌有释然感，不是怨恨。芦苇说：放下了，就不痛了。" },
    { q: "《某时某刻》这首歌的主题是什么？", opts: ["某个时刻的孤独与自省", "快乐的时刻", "悲伤的时刻", "愤怒的时刻"], ans: 0, exp: "「某时某刻」是某个瞬间，是独处时的自己。芦苇说：独处的时候，最真实。" },
    { q: "《某时某刻》中「这世界 在撒谎」的「撒谎」用了什么修辞？", opts: ["拟人", "比喻", "夸张", "排比"], ans: 0, exp: "把世界拟人化，好像世界在骗你。芦苇说：世界不会骗你，骗你的是你自己。" },
    { q: "《某时某刻》的编曲中，钢琴和电子音效的结合有什么效果？", opts: ["营造孤独又迷幻的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "钢琴的孤独和电子的迷幻，像一个人在空房间里。芦苇说：孤独的时候，房间也变大了。" },
    { q: "《某时某刻》中「我拥有的 都是侥幸」的「侥幸」表达了什么？", opts: ["谦虚与感恩", "骄傲与自满", "无所谓", "随便"], ans: 0, exp: "「侥幸」是运气，不是实力。芦苇说：拥有的，都是运气。" },
    { q: "《某时某刻》的副歌最高音表达了什么？", opts: ["孤独的呐喊", "快乐的欢呼", "平静的叙述", "愤怒的爆发"], ans: 0, exp: "最高音像在喊「有人吗」，喊完发现只有自己。芦苇说：最高音的地方，是最孤独的时候。" },
    { q: "《时间停了》这首歌的主题是什么？", opts: ["希望时间停下", "时间不会停", "时间很快", "时间很慢"], ans: 0, exp: "时间停了，是希望美好停留在那一刻。芦苇说：最好的时刻，希望时间停下。" },
    { q: "《时间停了》中「如果时间停了 我们会不会」的「会不会」用了什么修辞？", opts: ["疑问", "陈述", "肯定", "命令"], ans: 0, exp: "「会不会」是疑问，是假设，是不确定。芦苇说：问「会不会」的时候，已经怕了。" },
    { q: "《时间停了》的副歌旋律有什么特点？", opts: ["平缓像时间静止", "快速跳动", "一直上行", "一直下行"], ans: 0, exp: "平缓的旋律像时间真的停了，一切都慢下来。芦苇说：时间停了，心也停了。" },
    { q: "《时间停了》中「你还会不会 记得我」的「记得我」表达了什么？", opts: ["怕被遗忘", "肯定被记住", "无所谓", "随便"], ans: 0, exp: "怕被遗忘，是每个人心底的恐惧。芦苇说：最怕的，是被忘记。" },
    { q: "《时间停了》的编曲中，钢琴的简单和弦有什么作用？", opts: ["营造纯净又脆弱的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "简单的钢琴和弦像一个人在轻轻说话。芦苇说：声音越小，越认真。" },
    { q: "鹿晗的音乐风格有什么变化？", opts: ["从偶像歌手到音乐人的成长", "一直不变", "越来越差", "没有变化"], ans: 0, exp: "从早期的偶像曲风到后来的电子、摇滚，他一直在尝试。芦苇说：成长，就是不断打破自己。" },
    { q: "鹿晗在EXO时期的定位是什么？", opts: ["主唱、门面", "主舞", "Rapper", "队长"], ans: 0, exp: "在EXO时是主唱和门面，回国后做了更多尝试。芦苇说：离开舒适区，才能长大。" },
    { q: "鹿晗的嗓音特点是什么？", opts: ["清澈透亮有少年感", "沙哑沧桑", "浑厚有力", "甜美温柔"], ans: 0, exp: "他的声音像少年的声音，干净又明亮。芦苇说：少年的声音，最纯粹。" },
    { q: "鹿晗的歌曲中常见的主题是什么？", opts: ["梦想、成长、爱", "悲伤、痛苦", "愤怒、不满", "无所谓"], ans: 0, exp: "他的歌里有很多关于追梦和成长的主题。芦苇说：年轻人，要追梦。" },
    { q: "鹿晗《敢》这首歌的主题是什么？", opts: ["敢做自己", "不敢", "随便", "无所谓"], ans: 0, exp: "「敢」是勇气，是不怕。芦苇说：敢的人，才有机会。" },
    { q: "《敢》中「我不怕 别人怎么说」的「不怕」表达了什么？", opts: ["坚定与自信", "恐惧与退缩", "无所谓", "随便"], ans: 0, exp: "「不怕」是信念，是走自己的路。芦苇说：不怕的人，最自由。" },
    { q: "《敢》的副歌旋律有什么特点？", opts: ["上行像在向前冲", "一直下行", "平直无变化", "快速跳跃"], ans: 0, exp: "上行旋律像在冲向前方，像跑步的节奏。芦苇说：向前冲的时候，不要回头。" },
    { q: "《敢》的编曲中，摇滚吉他的加入有什么作用？", opts: ["增加力量感", "增加音量", "装饰", "没有作用"], ans: 0, exp: "摇滚吉他的失真音色，像在说「我不怕」。芦苇说：摇滚是勇气的音乐。" },
    { q: "鹿晗《超级冠军》这首歌的主题是什么？", opts: ["成为自己的冠军", "打败别人", "赢得比赛", "无所谓"], ans: 0, exp: "超级冠军不是打败别人，是超越自己。芦苇说：最大的对手，是自己。" },
    { q: "《超级冠军》中「我就是超级冠军」的「就是」用了什么修辞？", opts: ["肯定", "否定", "疑问", "命令"], ans: 0, exp: "「就是」是肯定，是自我确认。芦苇说：说「我就是」的时候，最自信。" },
    { q: "《超级冠军》的副歌最高音表达了什么？", opts: ["胜利的宣言", "犹豫的疑问", "快乐的欢呼", "平静的叙述"], ans: 0, exp: "最高音像在喊「我赢了」，是胜利的宣告。芦苇说：最高的音，是最骄傲的时刻。" },
    { q: "《超级冠军》的编曲中，电子和摇滚的结合有什么效果？", opts: ["营造热血又现代的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "电子和摇滚的结合，像未来战士的音乐。芦苇说：未来是电子的，也是摇滚的。" },
    { q: "鹿晗的《Skin to skin》这首歌有什么特点？", opts: ["全英文演唱，氛围感强", "中文演唱", "韩文演唱", "日文演唱"], ans: 0, exp: "全英文演唱，迷幻的电子氛围，像在梦里。芦苇说：好音乐不分语言。" },
    { q: "《Skin to skin》中「I just wanna feel your skin to skin」的「skin to skin」用了什么修辞？", opts: ["重复", "排比", "对仗", "拟人"], ans: 0, exp: "重复「skin to skin」，像在说「想靠近你」。芦苇说：最想靠近的人，是皮肤都想靠近的人。" },
    { q: "《Skin to skin》的编曲风格是什么？", opts: ["迷幻电子", "摇滚", "民谣", "古典"], ans: 0, exp: "迷幻的电子音效和慵懒的人声，像在太空漫游。芦苇说：迷幻的音乐，像在做梦。" },
    { q: "鹿晗《触发》这首歌的主题是什么？", opts: ["被触发的感情", "没有感觉", "无所谓", "随便"], ans: 0, exp: "「触发」是被点燃，是瞬间的悸动。芦苇说：有些感觉，一触即发。" },
    { q: "《触发》中「你一个眼神 就让我沦陷」的「沦陷」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "「沦陷」是夸张，把心动说得像战争。芦苇说：心动的感觉，像被攻陷了。" },
    { q: "《触发》的副歌旋律有什么特点？", opts: ["轻快的上行像心动", "一直下行", "平直无变化", "沉重缓慢"], ans: 0, exp: "轻快的上行旋律像心跳加速，像被触发了。芦苇说：心动的时候，旋律也是快的。" },
    { q: "《触发》的编曲中，电子鼓的节奏有什么特点？", opts: ["轻快跳跃像心跳", "沉重缓慢", "没有节奏", "随便的节奏"], ans: 0, exp: "轻快的电子鼓像心动时的心跳声。芦苇说：心跳的声音，骗不了人。" },
    { q: "鹿晗的音乐中经常使用什么语言？", opts: ["中英韩混合", "只有中文", "只有英文", "只有韩文"], ans: 0, exp: "他的歌里经常中英韩混合，国际化。芦苇说：音乐是世界语言。" },
    { q: "鹿晗在音乐上的追求是什么？", opts: ["做自己想做的音乐", "迎合市场", "赚钱", "出名"], ans: 0, exp: "他一直在尝试不同的风格，做自己想做的。芦苇说：做自己，是最难的。" },
    { q: "鹿晗的歌曲《剧中人》的主题是什么？", opts: ["不想做别人剧本里的角色", "想做主角", "想做配角", "无所谓"], ans: 0, exp: "「剧中人」是别人写的剧本，不是自己的人生。芦苇说：不做别人的剧中人，做自己的导演。" },
    { q: "《剧中人》中「我不是你剧本里的人」的「不是」表达了什么？", opts: ["拒绝与反抗", "接受与顺从", "无所谓", "随便"], ans: 0, exp: "「不是」是拒绝，是不想被安排。芦苇说：我的人生，我自己写。" },
    { q: "《剧中人》的副歌最高音表达了什么？", opts: ["反抗的呐喊", "快乐的欢呼", "平静的叙述", "愤怒的爆发"], ans: 0, exp: "最高音像在喊「我不是」，是反抗的宣言。芦苇说：最高的音，是最坚定的拒绝。" },
    { q: "鹿晗的音乐为什么能吸引年轻人？", opts: ["因为他唱出了年轻人的心声", "因为长得帅", "因为跳舞好", "因为综艺多"], ans: 0, exp: "他的歌里有很多关于梦想、成长、勇敢的主题。芦苇说：年轻人听的，是自己的梦想。" }
],"王心凌": [
    { q: "《爱你》前奏的吉他声营造了什么氛围？", opts: ["清新的校园恋爱感", "悲伤的离别感", "紧张的悬疑感", "庄重的仪式感"], ans: 0, exp: "轻快的木吉他像夏天的风，吹来了恋爱的味道。芦苇说：听到前奏，就想回到那个穿校服的夏天。" },
    { q: "《爱你》中「如果你突然打了个喷嚏 那一定就是我在想你」用了什么修辞手法？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "把打喷嚏和想你联系起来，是夸张也是俏皮。芦苇说：想念一个人的时候，连喷嚏都是有理由的。" },
    { q: "《爱你》的副歌「情话多说一点 想我就多看一眼」的旋律有什么特点？", opts: ["轻快跳跃像撒娇", "缓慢沉重", "平直无变化", "快速激烈"], ans: 0, exp: "轻快的旋律像在蹦蹦跳跳地说「喜欢我嘛」。芦苇说：甜歌的旋律，要像糖果一样化开。" },
    { q: "《爱你》中「多一点点 让我想你 真的太多一点」的「一点点」和「太多一点」是什么关系？", opts: ["矛盾修辞", "递进", "并列", "因果"], ans: 0, exp: "「一点点」是少，「太多一点」是多，矛盾中藏着贪心。芦苇说：爱一个人，给多少都觉得不够。" },
    { q: "《爱你》是王心凌哪部偶像剧的主题曲？", opts: ["《微笑Pasta》", "《天国的嫁衣》", "《桃花小妹》", "《爱上查美乐》"], ans: 0, exp: "《微笑Pasta》的片头曲，甜到爆炸。芦苇说：偶像剧和甜歌，是绝配。" },
    { q: "《爱你》的编曲中，木吉他的分解和弦有什么作用？", opts: ["营造清新自然的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "木吉他的声音像阳光透过树叶，斑驳又温暖。芦苇说：最甜的歌，要用最干净的乐器。" },
    { q: "《爱你》中「如果你突然打了个喷嚏」这句歌词为什么能让人记住？", opts: ["用了日常生活中的小细节", "旋律复杂", "歌词深奥", "押韵好"], ans: 0, exp: "打喷嚏是每个人都经历过的事，代入感强。芦苇说：最动人的，往往是生活中的小事。" },
    { q: "《爱你》的副歌反复重复「多一点」，用了什么修辞？", opts: ["反复", "排比", "对仗", "拟人"], ans: 0, exp: "重复「多一点」，像在撒娇说「还要还要」。芦苇说：爱一个人，永远觉得不够。" },
    { q: "《爱你》在2022年为什么再次爆红？", opts: ["王心凌在《乘风破浪》的舞台表演", "新专辑宣传", "电影上映", "综艺节目"], ans: 0, exp: "《乘风破浪》里她再次唱起《爱你》，全网回忆杀。芦苇说：有些歌，一响起就是整个青春。" },
    { q: "《爱你》代表了哪个年代的流行音乐风格？", opts: ["2000年代的华语甜歌", "1990年代", "2010年代", "2020年代"], ans: 0, exp: "那个年代流行甜美的少女偶像，王心凌是代表。芦苇说：那个年代的甜，是真的甜。" },
    { q: "《当你》这首歌的主题是什么？", opts: ["当你想一个人的时候", "当你不想的时候", "当你不care的时候", "当你无所谓的时候"], ans: 0, exp: "「当你」是假设，是「如果」的另一种说法。芦苇说：说「当你」的时候，其实是在说「我想你」。" },
    { q: "《当你》中「当你的眼睛眯着笑」的「眯着笑」描绘了什么画面？", opts: ["幸福满足的表情", "痛苦的表情", "愤怒的表情", "冷漠的表情"], ans: 0, exp: "眼睛眯着笑是幸福到眼睛都弯了。芦苇说：最幸福的表情，是眼睛笑了。" },
    { q: "《当你》的副歌「好喜欢你 知不知道」的「知不知道」用了什么句式？", opts: ["反问", "陈述", "疑问", "命令"], ans: 0, exp: "反问句加强了「你应该知道」的意味。芦苇说：我喜欢你，你是真的不知道吗？" },
    { q: "《当你》中「我想对你说 却害怕都说错」的「害怕」表达了什么？", opts: ["暗恋的胆怯", "勇敢的表白", "无所谓", "随便"], ans: 0, exp: "暗恋的人，最怕说错话，连朋友都做不成。芦苇说：暗恋，是世界上最怂的事。" },
    { q: "《当你》的副歌旋律有什么特点？", opts: ["上行像在鼓足勇气", "一直下行", "平直无变化", "快速跳跃"], ans: 0, exp: "上行旋律像在深呼吸，然后鼓起勇气说「喜欢你」。芦苇说：表白之前，需要深呼吸。" },
    { q: "《当你》是王心凌哪部偶像剧的主题曲？", opts: ["《微笑Pasta》", "《天国的嫁衣》", "《桃花小妹》", "《爱上查美乐》"], ans: 0, exp: "《微笑Pasta》的插曲，甜甜的暗恋感。芦苇说：暗恋的歌，最戳心。" },
    { q: "《当你》中「当你说今天的烦恼」的「烦恼」用了什么修辞？", opts: ["借代", "比喻", "拟人", "夸张"], ans: 0, exp: "用「烦恼」借代生活中的小事情。芦苇说：想听你说烦恼，是因为想参与你的生活。" },
    { q: "《当你》的编曲中，钢琴的琶音有什么作用？", opts: ["像心跳声", "增加音量", "装饰", "没有作用"], ans: 0, exp: "钢琴的琶音一下一下地敲，像暗恋时的心跳。芦苇说：暗恋的时候，心跳声最大。" },

    { q: "《心痛》的副歌最高音表达了什么？", opts: ["痛到极点的呐喊", "快乐的欢呼", "平静的叙述", "愤怒的爆发"], ans: 0, exp: "最高音像在喊「好痛」，喊完就沉默了。芦苇说：最高的音，是最痛的时候。" },
    { q: "《心痛》中「以为你懂 其实你不懂」的「以为」和「其实」用了什么修辞？", opts: ["转折", "并列", "递进", "因果"], ans: 0, exp: "「以为」是幻想，「其实」是现实，转折最痛。芦苇说：以为你懂，其实你不懂。" },
    { q: "王杰的音乐为什么能打动那么多人？", opts: ["因为唱出了普通人的孤独和无奈", "因为旋律复杂", "因为歌词深奥", "因为制作精良"], ans: 0, exp: "他的歌里没有高高在上的说教，只有普通人的痛。芦苇说：最动人的，是「我也是这样」。" },
    { q: "王杰的《红尘有你》这首歌的主题是什么？", opts: ["红尘中有你就够了", "红尘中不需要你", "红尘中无所谓", "红尘中随便"], ans: 0, exp: "「红尘有你」是拥有你就拥有全世界。芦苇说：有你在，红尘就是天堂。" },
    { q: "《红尘有你》中「红尘有你 就有我无悔的梦」的「无悔」表达了什么？", opts: ["心甘情愿", "被迫接受", "无所谓", "随便"], ans: 0, exp: "「无悔」是不后悔，是心甘情愿。芦苇说：有你，就不后悔。" },

    { q: "王杰的《故事的角色》这首歌的主题是什么？", opts: ["在别人的故事里演配角", "做自己的主角", "无所谓", "随便"], ans: 0, exp: "「故事的角色」是配角，不是自己的故事。芦苇说：在别人的故事里，你永远不是主角。" },

"任然": [
    { q: "《空空如也》副歌第一句「空空如也」重复四次，用了什么修辞手法？", opts: ["反复", "排比", "对仗", "拟人"], ans: 0, exp: "反复强调「空空如也」，像心里空得只剩下回声。芦苇说：空到极致，连回声都是空的。" },

    { q: "《空空如也》中「反正我早已习惯一个人」的「反正」表达了什么？", opts: ["自嘲与无奈", "确定与肯定", "快乐与兴奋", "平静与释然"], ans: 0, exp: "「反正」是自嘲，好像在说「我怎样都行」。芦苇说：说「反正」的时候，最心酸。" },
    { q: "《空空如也》的副歌最高音表达了什么？", opts: ["空洞的呐喊", "快乐的欢呼", "平静的叙述", "愤怒的爆发"], ans: 0, exp: "最高音像在喊「有人吗」，喊完发现只有自己。芦苇说：最高的音，是最空的时候。" },
    { q: "《空空如也》的编曲中，电子鼓的节奏有什么特点？", opts: ["简单重复像心跳", "复杂多变", "快速激烈", "缓慢沉重"], ans: 0, exp: "简单的电子鼓像空洞的心跳，一下一下地敲。芦苇说：空的时候，心跳声最大。" },
    { q: "《无人之岛》这首歌的主题是什么？", opts: ["无人岛的孤独", "无人岛的热闹", "无人岛的自由", "无人岛的束缚"], ans: 0, exp: "无人岛是孤独的，也是无法逃离的。芦苇说：每个人都是一座孤岛。" },

    { q: "《无人之岛》的副歌旋律有什么特点？", opts: ["平缓像海浪", "快速跳跃", "一直上行", "一直下行"], ans: 0, exp: "平缓的旋律像海浪一下一下地拍打孤岛。芦苇说：孤岛上的海浪，最寂寞。" },
    { q: "《无人之岛》中「能不能再听一听 你的声音」的「能不能」用了什么句式？", opts: ["请求", "命令", "陈述", "疑问"], ans: 0, exp: "「能不能」是请求，是卑微的渴望。芦苇说：问「能不能」的时候，已经输了。" },
    { q: "《无人之岛》的编曲中，弦乐的作用是什么？", opts: ["烘托孤独又温柔的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "弦乐的绵长像海风，轻轻吹过孤岛。芦苇说：弦乐一响，像有人来了又走了。" },
    { q: "《无人之岛》中「无人岛 无人知道」的「无人知道」表达了什么？", opts: ["被遗忘的孤独", "被记住的快乐", "无所谓", "随便"], ans: 0, exp: "「无人知道」是没有人记得，是彻底的孤独。芦苇说：最孤独的，是被遗忘。" },
    { q: "《飞鸟和蝉》这首歌的主题是什么？", opts: ["飞鸟和蝉的错过", "飞鸟和蝉的相遇", "飞鸟和蝉的爱情", "飞鸟和蝉的友情"], ans: 0, exp: "飞鸟会飞走，蝉只会活一个夏天，是错过的隐喻。芦苇说：有些人，注定只能陪你一程。" },
    { q: "《飞鸟和蝉》中「你骄傲的飞远 我栖息的夏天」用了什么修辞？", opts: ["对比", "排比", "拟人", "夸张"], ans: 0, exp: "「你飞远」和「我栖息」对比，一个走一个留。芦苇说：你走了，我还在原地。" },
    { q: "《飞鸟和蝉》的副歌旋律有什么特点？", opts: ["上行像飞鸟飞走", "一直下行", "平直无变化", "快速跳跃"], ans: 0, exp: "上行旋律像飞鸟越飞越高，越来越远。芦苇说：飞走的时候，是上行的。" },
    { q: "《飞鸟和蝉》中「说好了的永远 断了线」的「断了线」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把承诺比作风筝线，断了就飞走了。芦苇说：说好了的永远，最容易被剪断。" },
    { q: "《飞鸟和蝉》的编曲中，钢琴的琶音有什么作用？", opts: ["像蝉鸣声", "增加音量", "装饰", "没有作用"], ans: 0, exp: "钢琴的琶音像夏天的蝉鸣，提醒你那个夏天。芦苇说：蝉鸣的时候，最想他。" },
    { q: "《飞鸟和蝉》中「你已不在 我的世界」的「世界」用了什么修辞？", opts: ["借代", "比喻", "拟人", "夸张"], ans: 0, exp: "用「世界」借代生活，你不在，生活就不完整。芦苇说：你是我的全世界。" },
    { q: "《飞鸟和蝉》是任然哪一年的作品？", opts: ["2020年", "2019年", "2021年", "2022年"], ans: 0, exp: "2020年发行，成为年度热歌。芦苇说：那一年，很多人都在听。" },
    { q: "《飞鸟和蝉》的副歌最高音表达了什么？", opts: ["无奈的告别", "快乐的欢呼", "平静的叙述", "愤怒的爆发"], ans: 0, exp: "最高音像在喊「再见」，喊完就飞走了。芦苇说：最高的音，是最痛的再见。" },
    { q: "《后继者》这首歌的主题是什么？", opts: ["谁是下一个", "谁是前任", "谁是现任", "谁是未来"], ans: 0, exp: "「后继者」是下一个，是替代你的人。芦苇说：谁会是你的下一个？" },
    { q: "《后继者》中「谁是你心中的后继者」的「心中」表达了什么？", opts: ["心里的位置", "表面的位置", "无所谓", "随便"], ans: 0, exp: "「心中」是最深的地方，是别人进不去的。芦苇说：心里的位置，只留给一个人。" },
    { q: "《后继者》的副歌旋律有什么特点？", opts: ["反复模进像在反复问", "一直上行", "一直下行", "平直无变化"], ans: 0, exp: "旋律反复模进，像在反复问「是谁」。芦苇说：问多了，就不问了。" },
    { q: "《后继者》中「时间的河 慢慢地流」的「慢慢地」用了什么修辞？", opts: ["叠词", "比喻", "拟人", "夸张"], ans: 0, exp: "「慢慢地」是叠词，强调时间过得很慢。芦苇说：等一个人的时候，时间最慢。" },
    { q: "《后继者》的编曲中，吉他的分解和弦有什么作用？", opts: ["营造温柔又忧伤的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "吉他的分解和弦像时间的河流，慢慢地流。芦苇说：吉他声，像流水。" },
    { q: "《后继者》中「谁又会是谁的后继者」的「又会」表达了什么？", opts: ["循环与无奈", "确定与肯定", "快乐与兴奋", "平静与释然"], ans: 0, exp: "「又会」是循环，走了一个又来一个。芦苇说：谁是谁的替代品？" },
    { q: "《凉城》这首歌的主题是什么？", opts: ["凉城的孤独", "凉城的热闹", "凉城的快乐", "凉城的悲伤"], ans: 0, exp: "「凉城」是冷的城市，也是冷的心。芦苇说：城市是凉的，心也是凉的。" },
    { q: "《凉城》中「凉城无爱」的「无爱」表达了什么？", opts: ["没有爱的城市", "充满爱的城市", "无所谓", "随便"], ans: 0, exp: "「无爱」是没有爱，是冷漠。芦苇说：没有爱的城市，是凉的。" },
    { q: "《凉城》的副歌旋律有什么特点？", opts: ["下行像温度下降", "一直上行", "平直无变化", "快速跳跃"], ans: 0, exp: "下行旋律像温度计的水银柱往下掉，越来越冷。芦苇说：心冷了，旋律也是下的。" },
    { q: "《凉城》中「整个城市 在下雪」的「下雪」用了什么修辞？", opts: ["借代", "比喻", "拟人", "夸张"], ans: 0, exp: "用「下雪」借代寒冷，不仅是天气，也是心情。芦苇说：心里下雪的时候，外面也在下。" },
    { q: "《凉城》的编曲中，钢琴的清澈音色有什么作用？", opts: ["营造清冷又孤独的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "清澈的钢琴像冰，冷又透明。芦苇说：最冷的声音，是钢琴。" },
    { q: "《凉城》中「我走在 空荡的街」的「空荡」表达了什么？", opts: ["没有人", "很多人", "无所谓", "随便"], ans: 0, exp: "「空荡」是没有人，是孤独。芦苇说：空荡的街，只有自己。" },
    { q: "《外愈》这首歌的主题是什么？", opts: ["外表治愈内心未愈", "外表未愈内心治愈", "内外都愈", "内外未愈"], ans: 0, exp: "「外愈」是看起来好了，其实内心还在痛。芦苇说：外表的伤容易好，心里的伤难愈。" },
    { q: "《外愈》中「我假装痊愈 其实还在原地」的「假装」用了什么修辞？", opts: ["副词", "动词", "名词", "形容词"], ans: 0, exp: "「假装」是欺骗，是对外界的表演。芦苇说：假装好了，是最累的事。" },
    { q: "《外愈》的副歌旋律有什么特点？", opts: ["反复模进像在反复掩饰", "一直上行", "一直下行", "平直无变化"], ans: 0, exp: "旋律反复模进，像在反复说「我没事」。芦苇说：说多了，就信了。" },

    { q: "《失恋俱乐部》这首歌的主题是什么？", opts: ["失恋的人聚在一起", "失恋的人独自", "失恋的人快乐", "失恋的人无所谓"], ans: 0, exp: "「失恋俱乐部」是同病相怜的人聚在一起。芦苇说：失恋的人，最懂失恋的人。" },
    { q: "《失恋俱乐部》中「我们都一样 为爱受过伤」的「一样」表达了什么？", opts: ["共鸣与理解", "不同与差异", "无所谓", "随便"], ans: 0, exp: "「一样」是共鸣，是「我懂你」。芦苇说：一样痛过的人，最懂彼此。" },

    { q: "《月光》的副歌旋律有什么特点？", opts: ["中国风的上行", "摇滚的下行", "电子的平直", "古典的跳跃"], ans: 0, exp: "中国风的上行旋律，像月光慢慢升起来。芦苇说：月光是上行的。" },
    { q: "《月光》中「泪断剑 情多长」的「断」字用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "「泪断剑」是夸张，泪能把剑滴断，是多大的悲伤。芦苇说：眼泪，可以滴穿一切。" },

    { q: "《月光》中「过情关 谁敢闯」的「谁敢」用了什么句式？", opts: ["反问", "陈述", "疑问", "命令"], ans: 0, exp: "「谁敢」是反问，答案是「没有人」。芦苇说：情关，最难闯。" },
    { q: "胡彦斌的音乐风格有什么特点？", opts: ["R&B与中国风的融合", "纯摇滚", "纯电子", "纯古典"], ans: 0, exp: "他是华语乐坛R&B中国风的代表人物。芦苇说：中国风，也可以很R&B。" },
    { q: "胡彦斌的嗓音特点是什么？", opts: ["高亢有爆发力", "沙哑沧桑", "甜美可爱", "浑厚有力"], ans: 0, exp: "他的声音高亢，有很强的穿透力。芦苇说：高亢的声音，像在呐喊。" },
    { q: "胡彦斌是哪一年出道的？", opts: ["1999年", "2000年", "2001年", "2002年"], ans: 0, exp: "1999年参加歌唱比赛出道，被誉为「音乐才子」。芦苇说：才子，出道即巅峰。" },
    { q: "胡彦斌的创作能力被称为什么？", opts: ["音乐才子", "偶像歌手", "舞王", "综艺咖"], ans: 0, exp: "他能写能唱能编曲，是全能型音乐人。芦苇说：创作是音乐人的灵魂。" },
    { q: "胡彦斌的《皇帝》这首歌的主题是什么？", opts: ["做自己的皇帝", "做别人的臣子", "无所谓", "随便"], ans: 0, exp: "「皇帝」是主宰自己命运的人。芦苇说：做自己的皇帝，不做别人的奴隶。" },
    { q: "《皇帝》中「我是皇帝 我是自己的皇帝」的「自己的」表达了什么？", opts: ["不依附任何人", "依附别人", "无所谓", "随便"], ans: 0, exp: "「自己的」是不需要别人认可，自己做主。芦苇说：自己说了算，才是皇帝。" },

    { q: "《皇帝》中「我主宰 我的世界」的「主宰」表达了什么？", opts: ["掌控与权力", "放弃与退缩", "无所谓", "随便"], ans: 0, exp: "「主宰」是掌控，是自己的主人。芦苇说：主宰自己，才是最大的权力。" },
    { q: "胡彦斌的《失业情歌》这首歌的主题是什么？", opts: ["失业后的无奈", "失业后的快乐", "失业后的愤怒", "失业后的平静"], ans: 0, exp: "失业是成年人最大的无奈之一。芦苇说：失业的时候，最怕别人问。" },

    { q: "《失业情歌》中「面试官问我有何特长」的「特长」用了什么修辞？", opts: ["反问", "陈述", "疑问", "命令"], ans: 0, exp: "「特长」是面试时最怕被问到的问题。芦苇说：失业的时候，连特长都没有了。" },

    { q: "胡彦斌的《诀别诗》这首歌的主题是什么？", opts: ["诀别的悲壮", "诀别的快乐", "诀别的平静", "诀别的愤怒"], ans: 0, exp: "「诀别诗」是最后的告别，是一首诗的结束。芦苇说：诀别，是一首诗的结尾。" },

    { q: "胡彦斌的《潇湘雨》这首歌的主题是什么？", opts: ["潇湘雨的凄凉", "潇湘雨的快乐", "潇湘雨的平静", "潇湘雨的愤怒"], ans: 0, exp: "潇湘雨是湘江边的雨，凄凉又缠绵。芦苇说：潇湘雨，是思念的雨。" },
    { q: "《潇湘雨》中「雨打梨花深闭门」化用了哪句古诗词？", opts: ["李重元《忆王孙》", "李白《将进酒》", "杜甫《春夜喜雨》", "王维《山居秋暝》"], ans: 0, exp: "化用宋词「雨打梨花深闭门」，意境唯美。芦苇说：古诗词，也可以唱成歌。" },

    { q: "《潇湘雨》中「望断天涯 不见家」的「望断」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "「望断」是夸张，望到眼睛都断了，还是看不见。芦苇说：望断天涯，也望不到家。" },
    { q: "胡彦斌被称为「音乐才子」的原因是什么？", opts: ["创作、演唱、制作全能", "只会唱歌", "只会写歌", "只会编曲"], ans: 0, exp: "他能写、能唱、能编曲，是全能型音乐人。芦苇说：才子，是全面的。" },

"张信哲": [

    { q: "《爱如潮水》中「爱如潮水将我向你推」的「推」字有什么深意？", opts: ["被动地被爱推着走", "主动去爱", "无所谓", "随便"], ans: 0, exp: "「推」是被动的，不是自己想去，是被爱推着走的。芦苇说：有时候，爱是一种推力，推着你往前走。" },

    { q: "《爱如潮水》是张信哲哪一年的作品？", opts: ["1993年", "1994年", "1995年", "1996年"], ans: 0, exp: "1993年发行，成为情歌经典。芦苇说：那一年，每个人都在唱爱如潮水。" },
    { q: "《爱如潮水》中「不问你为何流眼泪」的「不问」表达了什么？", opts: ["不追究原因，只想安慰", "不想知道", "无所谓", "随便"], ans: 0, exp: "「不问」是不想追究原因，只想让你不难过。芦苇说：有时候，不问是最好的安慰。" },

    { q: "《爱如潮水》的作词人是谁？", opts: ["李宗盛", "林夕", "方文山", "姚若龙"], ans: 0, exp: "李宗盛的词，写尽了男人的痴情。芦苇说：李宗盛懂男人，也懂爱。" },
    { q: "《爱如潮水》中「我再也不愿见你在深夜里买醉」的「再也不愿」表达了什么？", opts: ["心疼与不忍", "无所谓", "随便", "快乐"], ans: 0, exp: "「再也不愿」是不忍心看你这样，是心疼。芦苇说：心疼一个人，是爱到极致的表现。" },

    { q: "《别怕我伤心》这首歌的主题是什么？", opts: ["别怕我会伤心，去做你的事", "我会伤心", "无所谓", "随便"], ans: 0, exp: "「别怕我伤心」是安慰对方，也是安慰自己。芦苇说：说别怕我伤心的人，最伤心。" },

    { q: "《别怕我伤心》中「我的爱也曾经 深深温暖你的心灵」的「曾经」表达了什么？", opts: ["过去式，现在可能没有了", "现在也有", "未来也有", "无所谓"], ans: 0, exp: "「曾经」是过去式，是回忆，暗示现在可能没有了。芦苇说：曾经的爱，最难忘。" },

    { q: "刘德华的音乐中常见的主题是什么？", opts: ["痴情、义气、励志", "甜蜜的爱情", "友情的温暖", "梦想的追逐"], ans: 0, exp: "他的歌里有痴情的爱，也有男人的义气。芦苇说：有情有义，是刘德华。" },

"刘宇宁": [
    { q: "《让酒》副歌第一句「一杯敬朝阳 一杯敬月光」中，化用了哪首歌的经典句式？", opts: ["毛不易《消愁》", "李宗盛《山丘》", "周杰伦《稻香》", "陈奕迅《十年》"], ans: 0, exp: "化用毛不易《消愁》的「一杯敬自由 一杯敬死亡」，表达对生活的态度。芦苇说：敬朝阳和月光，是敬每一天的开始和结束。" },
    { q: "《让酒》中「我本桀骜少年臣」的「桀骜」表达了什么？", opts: ["不羁与叛逆", "顺从与听话", "无所谓", "随便"], ans: 0, exp: "「桀骜」是不服管教的少年气，是青春的骄傲。芦苇说：少年臣，桀骜不驯。" },

    { q: "《让酒》中「不信人间有白头」的「不信」表达了什么？", opts: ["不相信爱情会长久", "相信爱情", "无所谓", "随便"], ans: 0, exp: "「不信」是不相信白头偕老，是少年的悲观。芦苇说：少年不信白头，是因为还没爱过。" },
    { q: "《让酒》的编曲中，箫声的出现有什么作用？", opts: ["增添江湖的苍凉感", "增加音量", "装饰", "没有作用"], ans: 0, exp: "箫声的音色苍凉，像江湖里的风。芦苇说：箫声一响，江湖就来了。" },
    { q: "《让酒》是刘宇宁为哪部剧演唱的主题曲？", opts: ["《热血少年》", "《盗墓笔记》", "《长歌行》", "《山河令》"], ans: 0, exp: "电视剧《热血少年》的主题曲，讲的是少年的热血。芦苇说：热血少年，就该喝最烈的酒。" },
    { q: "《让酒》中「我本桀骜少年臣 不信鬼神不信人」的「不信人」表达了什么？", opts: ["不相信任何人", "相信所有人", "无所谓", "随便"], ans: 0, exp: "「不信人」是被伤害过之后的防备。芦苇说：不信人的人，是被伤过的人。" },
    { q: "《让酒》的副歌最高音表达了什么？", opts: ["少年的豪迈与不羁", "悲伤的哭泣", "平静的叙述", "愤怒的爆发"], ans: 0, exp: "最高音像在喊「我不服」，是少年的倔强。芦苇说：最高的音，是最不服输的心。" },
    { q: "刘宇宁的嗓音特点是什么？", opts: ["沙哑有故事感", "清澈透亮", "甜美可爱", "高亢嘹亮"], ans: 0, exp: "他的声音沙哑又有磁性，像在讲一个长长的故事。芦苇说：沙哑的声音，最有故事。" },
    { q: "刘宇宁是从哪里出道的？", opts: ["网络直播平台", "选秀节目", "影视剧", "酒吧驻唱"], ans: 0, exp: "他是在网络直播平台唱歌走红的，是草根逆袭的代表。芦苇说：网络时代，每个人都有机会。" },
    { q: "《想象》这首歌的主题是什么？", opts: ["想象中的美好", "现实中的残酷", "无所谓", "随便"], ans: 0, exp: "「想象」是想出来的，不是真的。芦苇说：想象再美，也不是现实。" },
    { q: "《想象》中「我想象 我飞翔」的「飞翔」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "「飞翔」是比喻，想象自己在飞，是自由的象征。芦苇说：想飞的人，是最渴望自由的人。" },

    { q: "《想象》的编曲中，电子音效的作用是什么？", opts: ["营造梦幻的氛围", "增加音量", "装饰", "没有作用"], ans: 0, exp: "电子音效像梦里的声音，虚幻又美好。芦苇说：梦里的声音，是电子的。" },

    { q: "《乞丐》的副歌旋律有什么特点？", opts: ["下行像卑微到尘埃里", "一直上行", "平直无变化", "快速跳跃"], ans: 0, exp: "下行旋律像从高处往下跪，越来越低。芦苇说：卑微的时候，是下行的。" },
    { q: "《乞丐》中「只要你要 只要我有」的「只要」表达了什么？", opts: ["无条件的付出", "有条件的付出", "无所谓", "随便"], ans: 0, exp: "「只要」是无条件，是你要我就给。芦苇说：爱一个人，是可以给所有的。" },
    { q: "刘宇宁的音乐风格是什么？", opts: ["流行摇滚、古风", "纯电子", "纯民谣", "纯古典"], ans: 0, exp: "他的歌有摇滚的力量，也有古风的韵味。芦苇说：流行摇滚，最有力量。" },
    { q: "刘宇宁的歌曲中常见的主题是什么？", opts: ["少年的热血、爱情的卑微", "甜蜜的爱情", "友情的温暖", "梦想的追逐"], ans: 0, exp: "他的歌里有少年的不羁，也有爱情里的卑微。芦苇说：少年和爱情，是永恒的主题。" },
    { q: "《琉璃》这首歌的主题是什么？", opts: ["琉璃易碎的爱情", "坚硬的爱情", "无所谓", "随便"], ans: 0, exp: "琉璃是美丽的，也是易碎的，像爱情。芦苇说：琉璃碎了，就再也拼不起来了。" },
    { q: "《琉璃》中「你是琉璃 我是尘埃」的「尘埃」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "「尘埃」是卑微的，配不上琉璃的高贵。芦苇说：尘埃配不上琉璃，就像我配不上你。" },
    { q: "《琉璃》的副歌旋律有什么特点？", opts: ["凄美的古风旋律", "轻快的流行", "沉重的摇滚", "安静的民谣"], ans: 0, exp: "凄美的旋律像琉璃碎掉的声音，清脆又痛。芦苇说：琉璃碎的声音，最美也最痛。" },
    { q: "《琉璃》的编曲中，古筝的出现有什么作用？", opts: ["增添古风的韵味", "增加音量", "装饰", "没有作用"], ans: 0, exp: "古筝的音色清脆，像琉璃碎掉的声音。芦苇说：古筝一响，像琉璃碎了。" },

    { q: "《天问》中「问剑 问刀 问世间」的「问」用了什么修辞？", opts: ["反复", "排比", "对仗", "拟人"], ans: 0, exp: "反复「问」，像在质问天地，也像在问自己。芦苇说：问天问地，不如问自己。" },
    { q: "《天问》的副歌旋律有什么特点？", opts: ["豪迈的古风旋律", "轻快的流行", "沉重的摇滚", "安静的民谣"], ans: 0, exp: "豪迈的旋律像江湖里的侠客，仗剑天涯。芦苇说：江湖的歌，要豪迈地唱。" },
    { q: "《天问》的编曲中，弦乐的作用是什么？", opts: ["烘托江湖的苍凉", "增加音量", "装饰", "没有作用"], ans: 0, exp: "弦乐的绵长像江湖里的风，吹不尽。芦苇说：江湖的风，是弦乐。" },
    { q: "刘宇宁被称为「摩登兄弟」的主唱，摩登兄弟是哪里人？", opts: ["辽宁丹东", "北京", "上海", "广州"], ans: 0, exp: "摩登兄弟来自辽宁丹东，是网络直播走红的乐队。芦苇说：东北的声音，最豪迈。" },
    { q: "刘宇宁的《断缘诀》这首歌的主题是什么？", opts: ["断缘的决绝", "续缘的期待", "无所谓", "随便"], ans: 0, exp: "「断缘」是斩断缘分，是决绝的告别。芦苇说：断缘，是最痛的决绝。" },
    { q: "《断缘诀》中「一剑断天涯」的「一剑」用了什么修辞？", opts: ["借代", "比喻", "拟人", "夸张"], ans: 0, exp: "「一剑」借代一把剑，也借代一次决绝的行动。芦苇说：一剑下去，缘分就断了。" },
    { q: "《断缘诀》的副歌旋律有什么特点？", opts: ["悲壮的古风旋律", "轻快的流行", "沉重的摇滚", "安静的民谣"], ans: 0, exp: "悲壮的旋律像拔剑的那一刻，决绝又心痛。芦苇说：拔剑的时候，是悲壮的。" },

    { q: "《凌云寂》中「我站在云端 看人间」的「云端」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "「云端」是高处，是成功后的位置。芦苇说：云端之上，是孤独的。" },
    { q: "刘宇宁的《努力的人》这首歌的主题是什么？", opts: ["努力的人最美丽", "努力没有用", "无所谓", "随便"], ans: 0, exp: "「努力的人」是那些不放弃的人，值得尊敬。芦苇说：努力的人，最美丽。" },
    { q: "《努力的人》中「努力的人 最美丽」的「美丽」用了什么修辞？", opts: ["借代", "比喻", "拟人", "夸张"], ans: 0, exp: "「美丽」借代值得尊敬的品质。芦苇说：努力的人，身上有光。" },
    { q: "刘宇宁为什么能从一个网络主播成为当红歌手？", opts: ["因为他的努力和才华", "因为运气好", "因为长得帅", "因为营销好"], ans: 0, exp: "他的成功是天赋加努力的结果。芦苇说：机会是给有准备的人的。" },
    { q: "刘宇宁的《别来无恙》这首歌的主题是什么？", opts: ["别来无恙的问候", "别来的痛苦", "无所谓", "随便"], ans: 0, exp: "「别来无恙」是久别重逢的问候，也是最生疏的话。芦苇说：说别来无恙的人，最陌生。" },
    { q: "《别来无恙》中「好久不见 你还好吗」的「还好吗」用了什么句式？", opts: ["疑问", "陈述", "肯定", "命令"], ans: 0, exp: "「还好吗」是问候，也是试探。芦苇说：问还好吗的人，最怕听到答案。" },
    { q: "刘宇宁的《无双》这首歌是刘宇宁为哪部剧演唱的主题曲？", opts: ["《无双》", "《有双》", "《成双》", "《对双》"], ans: 0, exp: "电视剧《无双》的主题曲，讲的是独一无二。芦苇说：无双，是唯一。" },
    { q: "《无双》中「天下无双 只为你疯狂」的「疯狂」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "「疯狂」是夸张，爱到失去理智。芦苇说：爱一个人，是会疯狂的。" },
    { q: "刘宇宁的《烟火星辰》这首歌的主题是什么？", opts: ["烟火星辰的浪漫", "人间的平凡", "无所谓", "随便"], ans: 0, exp: "「烟火星辰」是夜空中的美丽，是短暂的浪漫。芦苇说：烟火再美，也会消失。" },
    { q: "《烟火星辰》中「你是烟火 我是星辰」的「你是」「我是」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把对方比作烟火，把自己比作星辰，都是夜空中的光。芦苇说：烟火和星辰，都是光。" },
    { q: "刘宇宁的《黑夜一束光》这首歌的主题是什么？", opts: ["黑夜里的希望", "白天的阳光", "无所谓", "随便"], ans: 0, exp: "「一束光」是黑暗中的希望，是救赎。芦苇说：再黑的夜，也有光。" },
    { q: "《黑夜一束光》中「你是黑夜一束光」的「一束」表达了什么？", opts: ["不多，但够了", "很多", "很少", "没有"], ans: 0, exp: "「一束」是不多，但足够照亮黑暗。芦苇说：一束光，就够了。" },
    { q: "刘宇宁的《虎啸龙吟》这首歌的主题是什么？", opts: ["虎啸龙吟的气势", "轻声细语", "无所谓", "随便"], ans: 0, exp: "「虎啸龙吟」是霸气的，是强者的声音。芦苇说：虎啸龙吟，是王者的声音。" },

  { q: "《决定》中「决定」二字为什么用强音？", "opts": ["决定是需要力量的", "轻轻的", "快的", "慢的"], ans: 0, exp: "决定的音，是强的。芦苇说：决定，是音在强。" },
  { q: "刘若英被称为「文艺天后」，从音乐风格看为什么？", "opts": ["她的歌像散文，有温度有故事", "高音多", "快歌多", "舞曲多"], ans: 0, exp: "她是用唱歌在写文章的人。芦苇说：刘若英，是音在写。" }
],
"李健": [
  { q: "《传奇》中「只是因为在人群中多看了你一眼」的「多看了一眼」表达了什么？", opts: ["缘分的开始", "随便看了一眼", "无所谓", "没意义"], ans: 0, exp: "一眼就是一生，缘分往往始于无意。芦苇说：多看一眼，就忘不掉了。" },
  { q: "《传奇》副歌「想你时你在天边」用了什么修辞？", opts: ["对比", "比喻", "拟人", "夸张"], ans: 0, exp: "天边和眼前对比，思念的遥远与亲近。芦苇说：想你时，你无处不在。" },
  { q: "《传奇》中「宁愿相信我们前世有约」的「前世」表达了什么？", opts: ["缘分的宿命感", "迷信", "无所谓", "随便"], ans: 0, exp: "前世有约，今生才会遇见。芦苇说：前世今生，都是你。" },
  { q: "《传奇》旋律开头有什么特点？", opts: ["空灵的假声渐入", "强烈的鼓点", "快速的节奏", "低沉的贝斯"], ans: 0, exp: "空灵的假声像从远方飘来，慢慢进入。芦苇说：传奇的开头，是空灵的。" },
  { q: "《传奇》中「从此我开始孤单思念」的「孤单思念」表达了什么情绪？", opts: ["一个人的想念", "两个人的甜蜜", "无所谓", "随便"], ans: 0, exp: "孤单思念是你不在身边，但我一直在想。芦苇说：思念，是一个人的事。" },
  { q: "《风吹麦浪》中「远处蔚蓝天空下涌动着金色的麦浪」用了什么修辞？", opts: ["拟人", "比喻", "夸张", "排比"], ans: 0, exp: "「涌动」赋予麦浪生命，像在流动。芦苇说：麦浪涌动，像金色的海。" },
  { q: "《风吹麦浪》中「我们曾在田野里歌唱」营造了什么氛围？", opts: ["青春与回忆", "悲伤与离别", "紧张与冲突", "无所谓"], ans: 0, exp: "田野里歌唱，是青春的美好回忆。芦苇说：风吹麦浪，想起那年夏天。" },
  { q: "《风吹麦浪》副歌中「就像那柔软的长发」比喻什么？", opts: ["麦浪的柔软", "长发的颜色", "无所谓", "随便"], ans: 0, exp: "麦浪像长发一样柔软，是视觉和触觉的通感。芦苇说：麦浪，像她的长发。" },
  { q: "《贝加尔湖畔》中「这一生一世 这时间太少」表达了什么？", opts: ["时光易逝的珍惜", "时间太多", "无所谓", "随便"], ans: 0, exp: "时间太少，不够和你在一起。芦苇说：贝加尔湖再深，深不过遗憾。" },
  { q: "《贝加尔湖畔》中「月光把爱恋 洒满了湖面」用了什么修辞？", opts: ["拟人", "比喻", "夸张", "排比"], ans: 0, exp: "月光「洒」满湖面，把月光拟人化。芦苇说：月光洒在湖面，爱也在上面。" },
  { q: "《贝加尔湖畔》手风琴编曲营造了什么氛围？", opts: ["俄罗斯式的浪漫与忧伤", "欢快的舞曲", "紧张的悬疑", "无所谓"], ans: 0, exp: "手风琴是俄罗斯音乐的标志，浪漫又忧伤。芦苇说：手风琴一响，就到了贝加尔湖。" },
  { q: "《异乡人》中「披星戴月地奔波 只为一扇窗」的「窗」比喻什么？", opts: ["家的温暖", "窗户本身", "无所谓", "随便"], ans: 0, exp: "窗是家的象征，是异乡人的归宿。芦苇说：异乡人，找一扇属于自己的窗。" },
  { q: "《异乡人》中「小小的门口 还有她的温柔」表达了什么？", opts: ["家的牵挂与温暖", "无所谓", "随便", "对门口的描写"], ans: 0, exp: "小小的门口是家的入口，她的温柔是等待。芦苇说：门口很小，温柔很大。" },
  { q: "《异乡人》中「不知不觉把他乡 当作了故乡」表达了什么心理？", opts: ["漂泊者的无奈与适应", "喜欢他乡", "无所谓", "随便"], ans: 0, exp: "漂泊久了，他乡也成了故乡，但心里还记着原来的家。芦苇说：他乡变故乡，是无奈也是习惯。" },
  { q: "《向往》中「我知道并不是 所有鸟儿都飞翔」表达了什么？", opts: ["接纳不完美", "鸟儿都会飞", "无所谓", "随便"], ans: 0, exp: "不是每个人都能飞翔，但依然可以向往。芦苇说：不能飞，也可以向往天空。" },
  { q: "《向往》中「当春风掠过山岗 依然能感觉寒冷」用了什么修辞？", opts: ["对比", "比喻", "拟人", "排比"], ans: 0, exp: "春风本应温暖，却依然寒冷，冷暖对比。芦苇说：春风也冷，是因为心冷。" },
  { q: "《假如爱有天意》中「如今我们已天各一方」的「天各一方」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "天各一方是夸张，形容相隔很远。芦苇说：天各一方，是最远的距离。" },
  { q: "《假如爱有天意》中「年少的我们曾以为 相爱的人就能到永远」表达了什么？", opts: ["年少的天真与现实的残酷", "年少就是对的", "无所谓", "随便"], ans: 0, exp: "年少时以为爱能战胜一切，长大后才知道不是。芦苇说：年少的以为，是最美的以为。" },
  { q: "《美若黎明》这首歌的主题是什么？", opts: ["黎明的希望与美好", "夜晚的黑暗", "无所谓", "随便"], ans: 0, exp: "黎明是新的开始，美若黎明是希望。芦苇说：黎明来了，一切都还来得及。" },
  { q: "《美若黎明》中「趁着你还没醒来 我已悄悄地离开」表达了什么？", opts: ["不忍告别的温柔", "愤怒的离开", "无所谓的走", "随便"], ans: 0, exp: "趁你还在梦中离开，是不忍心说再见。芦苇说：悄悄的离开，是不想让你难过。" },
  { q: "《沧海轻舟》中「蓝天依然 白云散漫」营造了什么氛围？", opts: ["宁静悠远", "紧张激烈", "悲伤绝望", "无所谓"], ans: 0, exp: "蓝天白云，是宁静悠远的画面。芦苇说：沧海轻舟，心也轻了。" },
  { q: "《沧海轻舟》中「跋山涉水 看不见命运」表达了什么？", opts: ["人生的迷茫与追寻", "命运很清晰", "无所谓", "随便"], ans: 0, exp: "走了很远，还是看不清命运的方向。芦苇说：命运，是最难看见的东西。" },
  { q: "李健被称为「音乐诗人」的原因是什么？", opts: ["歌词像诗一样优美", "因为他会写诗", "因为他长得像诗人", "随便说的"], ans: 0, exp: "他的歌词有诗意，旋律如歌。芦苇说：音乐诗人，是把歌唱成诗的人。" },
  { q: "《故乡山川》中「当微风送花草清香 正是我想你的季节」表达了什么？", opts: ["季节触发的思乡", "喜欢花草", "无所谓", "随便"], ans: 0, exp: "闻到花草香，就想起了故乡和你。芦苇说：每个季节，都想你。" },
  { q: "《故乡山川》中「远方的家是否无恙」的「无恙」表达了什么？", opts: ["对家的牵挂与担心", "家很好", "无所谓", "随便"], ans: 0, exp: "无恙是问家还好吗，是游子的牵挂。芦苇说：家，你还好吗？" },
  { q: "《心升明月》中「飞鸟归山林 落日入东海」营造了什么氛围？", opts: ["自然的宁静与禅意", "热闹的聚会", "紧张的追逐", "无所谓"], ans: 0, exp: "飞鸟归林，落日入海，是自然的宁静。芦苇说：心升明月，万物皆静。" },
  { q: "《心升明月》中「这世间繁华 太多」表达了什么？", opts: ["对喧嚣的厌倦", "喜欢繁华", "无所谓", "随便"], ans: 0, exp: "世间繁华太多，反而让人想逃离。芦苇说：繁华虽好，不如心静。" },
  { q: "《依然在路上》这首歌的主题是什么？", opts: ["一直在路上，不停歇", "停下来休息", "回头走", "无所谓"], ans: 0, exp: "依然在路上，是坚持，是不停歇。芦苇说：路还长，我还在走。" },
  { q: "《当你老了》翻唱自哪首诗？", opts: ["叶芝的《当你老了》", "泰戈尔的诗", "徐志摩的诗", "原创"], ans: 0, exp: "翻唱自爱尔兰诗人叶芝的诗。芦苇说：当你老了，诗还在。" },
  { q: "《当你老了》中「只有一个人还爱你虔诚的灵魂」表达了什么？", opts: ["爱灵魂胜过爱外表", "爱外表", "无所谓", "随便"], ans: 0, exp: "真正的爱是爱你的灵魂，不是你的容颜。芦苇说：灵魂，是最美的部分。" },
  { q: "《车站》中「车窗外恋人相拥」营造了什么氛围？", opts: ["离别的伤感", "重逢的喜悦", "无所谓", "随便"], ans: 0, exp: "车站是离别的地方，恋人相拥更显伤感。芦苇说：车站，最懂离别。" },
  { q: "《车站》中「我不知道我还有多少相聚分别」表达了什么？", opts: ["人生的无常与漂泊", "相聚很多", "分别很少", "无所谓"], ans: 0, exp: "不知道还有多少次相聚和分别，人生无常。芦苇说：每一次分别，都可能是最后一次。" },
  { q: "《父亲写的散文诗》中「这是我父亲日记里的文字」用了什么叙事视角？", opts: ["儿子的视角", "父亲的视角", "旁观者", "无所谓"], ans: 0, exp: "儿子看父亲的日记，是后辈的视角。芦苇说：父亲的日记，是儿子的眼泪。" },
  { q: "《父亲写的散文诗》中「几十年后 我看着泪流不止」表达了什么？", opts: ["长大后读懂父爱的感动", "后悔", "无所谓", "随便"], ans: 0, exp: "小时候不懂，几十年后才懂，已经泪流满面。芦苇说：懂的时候，已经晚了。" },
  { q: "《迷雾》中「你可知道在你的故乡」的「故乡」表达了什么？", opts: ["故乡的牵挂", "故乡的讨厌", "无所谓", "随便"], ans: 0, exp: "故乡是回不去的地方，但一直在心里。芦苇说：迷雾再大，也遮不住故乡。" },
  { q: "《拾光》这张专辑的主题是什么？", opts: ["拾起时光的记忆", "扔掉记忆", "无所谓", "随便"], ans: 0, exp: "拾光是捡起过去的时光，是回忆。芦苇说：时光丢了，可以拾起来。" },
  { q: "《水流众生》中「有没有那样的山 能阻挡命运的乌云」表达了什么？", opts: ["对命运的追问", "命运很好", "无所谓", "随便"], ans: 0, exp: "有没有山能挡住命运的苦难？是追问。芦苇说：命运如乌云，谁能挡住？" },
  { q: "《水流众生》中「穿过了黑夜 踏破了边界」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "踏破边界是夸张，形容走得很远。芦苇说：穿过了黑夜，才见光明。" },
  { q: "《想念你》中「我在没有你的城市里」表达了什么？", opts: ["失去后的孤独", "城市的繁华", "无所谓", "随便"], ans: 0, exp: "城市还在，但你已经不在了。芦苇说：没有你的城市，是空城。" },
  { q: "《紫罗兰》中「紫罗兰轻轻地在窗边」营造了什么氛围？", opts: ["温柔与安静", "激烈与热情", "悲伤与绝望", "无所谓"], ans: 0, exp: "紫罗兰在窗边，是安静温柔的陪伴。芦苇说：紫罗兰开了，你在哪？" },
  { q: "《在每个想你的夜里》这首歌的主题是什么？", opts: ["每个夜晚都想你", "白天想你", "不想你", "无所谓"], ans: 0, exp: "每个想你的夜里，思念最浓。芦苇说：夜晚，是最想你的时间。" },
  { q: "《一往情深的恋人》中「所有的爱都是冒险」表达了什么？", opts: ["爱的不可预测", "爱很安全", "无所谓", "随便"], ans: 0, exp: "爱是一场冒险，不知道结果。芦苇说：爱，是最勇敢的冒险。" },
  { q: "《完美坚持》这首歌的主题是什么？", opts: ["对完美的坚持", "放弃完美", "无所谓", "随便"], ans: 0, exp: "完美坚持，是不妥协，是追求极致。芦苇说：坚持，才能完美。" },
  { q: "《恋人》中「哪一天我会离开你」表达了什么？", opts: ["对分离的预感", "不会离开", "无所谓", "随便"], ans: 0, exp: "知道总有一天会分离，所以珍惜现在。芦苇说：离开之前，好好爱你。" },
  { q: "《深海之寻》中「这无穷的深海」比喻什么？", opts: ["人心的深邃", "大海的深", "无所谓", "随便"], ans: 0, exp: "深海比喻人心，深不可测。芦苇说：深海再深，深不过人心。" },
  { q: "《窗台》中「窗台上有只麻雀」营造了什么氛围？", opts: ["日常的宁静", "热闹的场面", "紧张的瞬间", "无所谓"], ans: 0, exp: "麻雀在窗台，是日常生活的宁静画面。芦苇说：窗台上的麻雀，是生活的小确幸。" },
  { q: "《绽放》中「生命如此绽放」表达了什么？", opts: ["生命的美好与热烈", "生命的枯萎", "无所谓", "随便"], ans: 0, exp: "绽放是最美的样子，生命就该这样。芦苇说：绽放吧，像花一样。" },
  { q: "《我始终在这里》这首歌的主题是什么？", opts: ["一直都在的陪伴", "离开", "无所谓", "随便"], ans: 0, exp: "我始终在这里，是不离不弃。芦苇说：你回头，我就在。" },
  { q: "《枫桥夜泊》改编自谁的诗歌？", opts: ["张继的《枫桥夜泊》", "李白的诗", "杜甫的诗", "王维的诗"], ans: 0, exp: "改编自唐代张继的诗。芦苇说：枫桥夜泊，千年的愁。" },
  { q: "《戏迷人生》这首歌的主题是什么？", opts: ["人生如戏", "戏如人生", "无所谓", "随便"], ans: 0, exp: "戏迷人生，是人生像戏一样。芦苇说：人生如戏，你是主角。" },
  { q: "《童年》中「童年的纸飞机」表达了什么？", opts: ["童年的纯真与逝去", "纸飞机好玩", "无所谓", "随便"], ans: 0, exp: "纸飞机是童年的符号，飞走了就回不来了。芦苇说：纸飞机，飞不回童年。" },
  { q: "《松花江》中「松花江水 我童年的记忆」表达了什么？", opts: ["故乡河流的乡愁", "喜欢游泳", "无所谓", "随便"], ans: 0, exp: "松花江是故乡的记忆，是童年的味道。芦苇说：松花江，流着我的童年。" },
  { q: "《丽江》中「丽江的春天」表达了什么？", opts: ["丽江的美好与留恋", "丽江的冬天", "无所谓", "随便"], ans: 0, exp: "丽江的春天，是美好的回忆。芦苇说：丽江的春天，想再去一次。" },
  { q: "《故乡》中「故乡的山 故乡的水」用了什么修辞？", opts: ["排比", "比喻", "拟人", "夸张"], ans: 0, exp: "排比句加强思乡的情感。芦苇说：故乡的山山水水，都在心里。" },
  { q: "《你一言我一语》这首歌的主题是什么？", opts: ["日常对话的温暖", "争吵", "沉默", "无所谓"], ans: 0, exp: "你一言我一语，是平凡的幸福。芦苇说：有话说，就是幸福。" },
  { q: "《月光》中「月光洒在每个人心上」表达了什么？", opts: ["月光下的思乡", "月光很美", "无所谓", "随便"], ans: 0, exp: "月光照在身上，也想念着故乡。芦苇说：月光，是最温柔的乡愁。" },
  { q: "《雨》中「雨打窗台」营造了什么氛围？", opts: ["安静与孤独", "热闹", "紧张", "无所谓"], ans: 0, exp: "雨打窗台，是安静中的孤独感。芦苇说：下雨天，最适合想心事。" },
  { q: "《梦》中「在梦里我见到了你」表达了什么？", opts: ["只能在梦里相见", "现实中常见", "无所谓", "随便"], ans: 0, exp: "现实中见不到，只能去梦里找你。芦苇说：梦，是唯一的相见。" },
  { q: "《黄昏》中「黄昏的地平线」表达了什么？", opts: ["一天的结束", "一天开始", "无所谓", "随便"], ans: 0, exp: "黄昏是一天的结束，也是思念的开始。芦苇说：黄昏，是最温柔的时刻。" },
  { q: "《星空》中「星空下许个愿」表达了什么？", opts: ["星空下的期待", "星空很美", "无所谓", "随便"], ans: 0, exp: "星空下许愿，是期待美好。芦苇说：星空，是最美的许愿池。" },
  { q: "《春天》中「春天花会开」表达了什么？", opts: ["春天的希望", "春天太短", "无所谓", "随便"], ans: 0, exp: "春天花会开，一切都会好起来。芦苇说：春天来了，花就开了。" },
  { q: "《冬天》中「冬天的雪」表达了什么？", opts: ["冬天的纯净", "冬天的寒冷", "无所谓", "随便"], ans: 0, exp: "冬天的雪，是纯净的象征。芦苇说：雪落了，世界就干净了。" },
  { q: "《秋天》中「秋天的落叶」表达了什么？", opts: ["秋天的萧瑟", "秋天的丰收", "无所谓", "随便"], ans: 0, exp: "落叶是秋天的萧瑟，也是生命的轮回。芦苇说：落叶，是秋天的情书。" },
  { q: "《夏天》中「夏天的风」表达了什么？", opts: ["夏天的炎热与青春", "夏天的凉爽", "无所谓", "随便"], ans: 0, exp: "夏天的风，是青春的味道。芦苇说：夏天的风，吹过就回不来了。" },
  { q: "《大海》中「大海啊故乡」表达了什么？", opts: ["大海像故乡一样亲切", "大海很大", "无所谓", "随便"], ans: 0, exp: "大海像故乡，给人安全感。芦苇说：大海，是最宽广的故乡。" },
  { q: "《山》中「山的那一边」表达了什么？", opts: ["未知的向往", "山的这边", "无所谓", "随便"], ans: 0, exp: "山的那一边，是未知的好奇。芦苇说：翻过山，会看见什么？" },
  { q: "《路》中「路在脚下」表达了什么？", opts: ["脚踏实地", "路很远", "无所谓", "随便"], ans: 0, exp: "路在脚下，走好每一步。芦苇说：路再远，也在脚下。" },
  { q: "《远方》中「远方有多远」表达了什么？", opts: ["对远方的追问", "远方很近", "无所谓", "随便"], ans: 0, exp: "远方有多远，没有人知道。芦苇说：远方，是永远到不了的地方。" },
  { q: "《归来》中「你归来的时候」表达了什么？", opts: ["等待归来的期待", "不期待归来", "无所谓", "随便"], ans: 0, exp: "等你归来，是最长情的告白。芦苇说：归来吧，我在等你。" },
  { q: "《送别》中「长亭外古道边」改编自谁的词？", opts: ["李叔同", "胡适", "徐志摩", "鲁迅"], ans: 0, exp: "改编自李叔同的《送别》。芦苇说：长亭外，是离别的开始。" },
  { q: "《毕业歌》中「我们毕业了」表达了什么？", opts: ["毕业的青春与不舍", "毕业很开心", "无所谓", "随便"], ans: 0, exp: "毕业了，青春散场了。芦苇说：毕业，是最痛的成长。" },
  { q: "《青春》中「青春再见」表达了什么？", opts: ["青春的逝去", "青春还在", "无所谓", "随便"], ans: 0, exp: "青春再见，是再也回不去了。芦苇说：青春，是一去不回的火车。" },
  { q: "《时光》中「时光慢些吧」表达了什么？", opts: ["不想让时光流逝", "时光太快", "无所谓", "随便"], ans: 0, exp: "时光慢些吧，不想让你变老。芦苇说：时光，是最残忍的小偷。" },
  { q: "《岁月》中「岁月如歌」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把岁月比作歌，有起有落。芦苇说：岁月如歌，有高有低。" },
  { q: "《人生》中「人生是一场修行」表达了什么？", opts: ["人生的磨砺", "人生很简单", "无所谓", "随便"], ans: 0, exp: "人生是修行，要经历苦难。芦苇说：修行，是一辈子的功课。" },
  { q: "《幸福》中「幸福很简单」表达了什么？", opts: ["对幸福的定义", "幸福很难", "无所谓", "随便"], ans: 0, exp: "幸福其实很简单，只是我们没发现。芦苇说：幸福，是你在我身边。" },
  { q: "《爱情》中「爱情是什么」表达了什么？", opts: ["对爱情的追问", "爱情很简单", "无所谓", "随便"], ans: 0, exp: "爱情是什么，没有人能说清。芦苇说：爱情，是最难解的题。" },
  { q: "《孤独》中「孤独是一种享受」表达了什么？", opts: ["对孤独的正面理解", "孤独很痛苦", "无所谓", "随便"], ans: 0, exp: "孤独可以是一种享受，是独处的时光。芦苇说：孤独，是和自己相处。" },
  { q: "《自由》中「自由像风」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "自由像风，看不见但感受得到。芦苇说：自由，是最难抓住的东西。" },
  { q: "《希望》中「希望在明天」表达了什么？", opts: ["明天的希望", "今天没希望", "无所谓", "随便"], ans: 0, exp: "明天是新的希望。芦苇说：希望，是明天的太阳。" },
  { q: "《梦想》中「梦想在远方」表达了什么？", opts: ["梦想的遥远", "梦想很近", "无所谓", "随便"], ans: 0, exp: "梦想在远方，需要去追。芦苇说：梦想，是远方的光。" },
  { q: "《坚持》中「坚持就是胜利」表达了什么？", opts: ["坚持的意义", "坚持没用", "无所谓", "随便"], ans: 0, exp: "坚持到最后，才会胜利。芦苇说：坚持，是最难的路。" },
  { q: "《勇气》中「勇气是什么」表达了什么？", opts: ["对勇气的追问", "勇气很简单", "无所谓", "随便"], ans: 0, exp: "勇气是害怕但还是去做。芦苇说：勇气，是带着害怕前进。" },
  { q: "《成长》中「我们都在成长」表达了什么？", opts: ["成长的过程", "成长很痛", "无所谓", "随便"], ans: 0, exp: "每个人都在成长，或多或少。芦苇说：成长，是学会告别。" },
  { q: "《改变》中「改变自己」表达了什么？", opts: ["改变的必要", "不需要改变", "无所谓", "随便"], ans: 0, exp: "改变自己，才能改变世界。芦苇说：改变，是最难的开始。" },
  { q: "《选择》中「选择比努力更重要」表达了什么？", opts: ["选择的重要性", "努力更重要", "无所谓", "随便"], ans: 0, exp: "选对了方向，努力才有意义。芦苇说：选择，是人生的岔路口。" },
  { q: "《命运》中「命运掌握在自己手中」表达了什么？", opts: ["对命运的主动", "命运天注定", "无所谓", "随便"], ans: 0, exp: "命运不是天定，是自己选的。芦苇说：命运，是你手里的线。" },
  { q: "《感恩》中「感恩的心」表达了什么？", opts: ["感恩的态度", "不需要感恩", "无所谓", "随便"], ans: 0, exp: "感恩让生活更美好。芦苇说：感恩，是最暖的心。" },
  { q: "《珍惜》中「珍惜眼前人」表达了什么？", opts: ["珍惜当下的重要性", "不用珍惜", "无所谓", "随便"], ans: 0, exp: "眼前人最值得珍惜，不要等失去了才懂。芦苇说：珍惜，是不要等以后。" },
  { q: "《放下》中「放下是一种智慧」表达了什么？", opts: ["放下的意义", "不要放下", "无所谓", "随便"], ans: 0, exp: "放下不是放弃，是智慧。芦苇说：放下，是最难的功课。" },
  { q: "《原谅》中「原谅别人就是原谅自己」表达了什么？", opts: ["原谅的意义", "不要原谅", "无所谓", "随便"], ans: 0, exp: "原谅别人，自己也会轻松。芦苇说：原谅，是给自己的礼物。" }
],
"凤凰传奇": [
  { q: "《月亮之上》中「我在仰望 月亮之上」的「仰望」表达了什么？", opts: ["对远方的向往", "低头看地", "无所谓", "随便"], ans: 0, exp: "仰望是向上看，是渴望和追求。芦苇说：月亮之上，是梦想的地方。" },
  { q: "《月亮之上》中「有多少梦想 在自由的飞翔」用了什么修辞？", opts: ["拟人", "比喻", "夸张", "排比"], ans: 0, exp: "「飞翔」赋予梦想生命力，像鸟一样自由。芦苇说：梦想会飞，你要去追。" },
  { q: "《月亮之上》副歌的节奏特点是什么？", opts: ["强劲的鼓点+民族风", "缓慢抒情", "爵士摇摆", "古典钢琴"], ans: 0, exp: "强劲鼓点加上民族元素，是凤凰传奇的标志。芦苇说：节奏一响，就想跳舞。" },
  { q: "《最炫民族风》中「苍茫的天涯是我的爱」的「苍茫」营造了什么氛围？", opts: ["辽阔与豪迈", "狭窄与压抑", "悲伤与凄凉", "无所谓"], ans: 0, exp: "苍茫是辽阔无边，是草原的豪迈。芦苇说：苍茫天涯，任我闯。" },
  { q: "《最炫民族风》中「悠悠的唱着最炫的民族风」的「悠悠」表达了什么？", opts: ["轻松自在的感觉", "很痛苦", "很快", "无所谓"], ans: 0, exp: "悠悠是慢慢唱，很享受。芦苇说：悠悠的歌，悠悠的心。" },
  { q: "《最炫民族风》中「整个中国都是我的爱」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "整个中国是夸张，表达爱得深沉。芦苇说：爱中国，是认真的。" },
  { q: "《荷塘月色》中「剪一段时光 缓缓流淌」用了什么修辞？", opts: ["拟人", "比喻", "夸张", "对偶"], ans: 0, exp: "时光像水一样「流淌」，是拟人也是比喻。芦苇说：时光可以剪，但回不去了。" },
  { q: "《荷塘月色》中「萤火虫点亮夜的星光」营造了什么氛围？", opts: ["宁静浪漫的夏夜", "喧闹的白昼", "寒冷的冬夜", "无所谓"], ans: 0, exp: "萤火虫和星光，是夏夜的浪漫。芦苇说：荷塘月色，是最美的夜。" },
  { q: "《荷塘月色》与朱自清散文的关系是什么？", opts: ["借用意境和标题", "完全无关", "抄袭", "随便"], ans: 0, exp: "借用了朱自清《荷塘月色》的意境。芦苇说：荷塘月色，文与歌相通。" },
  { q: "《自由飞翔》中「在你的心上 自由地飞翔」表达了什么？", opts: ["向往自由", "被束缚", "无所谓", "随便"], ans: 0, exp: "自由飞翔是每个人都想要的。芦苇说：心上飞翔，是最自由的自由。" },
  { q: "《自由飞翔》中「辽阔的草原 是我最爱」表达了什么地域特色？", opts: ["内蒙古草原", "青藏高原", "江南水乡", "黄土高原"], ans: 0, exp: "草原是内蒙古的符号，是凤凰传奇的标志。芦苇说：草原儿女，最爱草原。" },
  { q: "《我从草原来》中「我从草原来 温暖你心怀」表达了什么？", opts: ["草原人的热情", "草原很冷", "无所谓", "随便"], ans: 0, exp: "草原人带着热情而来，温暖你。芦苇说：草原来的风，是暖的。" },
  { q: "《我从草原来》中「风吹草原 花儿开」用了什么修辞？", opts: ["拟人", "比喻", "夸张", "排比"], ans: 0, exp: "风吹草原让花儿开，赋予风生命力。芦苇说：风吹过，花就开了。" },
  { q: "《奢香夫人》中「越过绵绵的高山」表达了什么？", opts: ["跋山涉水的艰辛", "高山很美", "无所谓", "随便"], ans: 0, exp: "越过重重高山，是不怕艰难。芦苇说：高山再高，也要越过。" },
  { q: "《奢香夫人》中「乌蒙山连着山外山」用了什么修辞？", opts: ["顶真", "比喻", "拟人", "夸张"], ans: 0, exp: "山外山用顶真，层层递进。芦苇说：乌蒙山，一山连一山。" },
  { q: "《奢香夫人》讲述的是谁的故事？", opts: ["明代彝族女政治家奢香", "唐代公主", "宋代女将", "清代王妃"], ans: 0, exp: "奢香夫人是明代彝族女政治家。芦苇说：奢香夫人，巾帼英雄。" },
  { q: "《全是爱》中「如果你不爱我 就把我的心还我」表达了什么？", opts: ["爱里的直率与坦白", "无所谓", "随便", "温柔乞求"], ans: 0, exp: "不爱就把心还我，是直来直往。芦苇说：爱要干脆，不爱也要干脆。" },
  { q: "《全是爱》中「用你的笑容 把我心融化」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "笑容「融化」心，是夸张也是比喻。芦苇说：你的笑，能把冰山融化。" },
  { q: "《天蓝蓝》中「天蓝蓝 秋草香」营造了什么氛围？", opts: ["秋高气爽的草原", "阴雨连绵", "大雪纷飞", "无所谓"], ans: 0, exp: "天蓝草香，是秋天的草原美景。芦苇说：天蓝蓝，心也蓝了。" },
  { q: "《天蓝蓝》中「心爱的人啊 你在何方」表达了什么？", opts: ["对爱人的思念", "爱人就在身边", "无所谓", "随便"], ans: 0, exp: "美景当前，你却不在。芦苇说：天蓝的时候，最想你。" },
  { q: "《等爱的玫瑰》中「我是等爱的玫瑰」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把自己比作玫瑰，美丽但需要被爱。芦苇说：等爱的玫瑰，最让人心疼。" },
  { q: "《等爱的玫瑰》中「花开在太阳下 等着你回来」表达了什么？", opts: ["等待的执着", "不等了", "无所谓", "随便"], ans: 0, exp: "花开着等你，是执着的等待。芦苇说：花儿开了，你还没来。" },
  { q: "《溜溜的情歌》中「溜溜的情歌 溜溜的唱」的「溜溜」来自哪里？", opts: ["康定情歌的「溜溜的」", "随便说的", "英文音译", "藏语"], ans: 0, exp: "借用了《康定情歌》中的「溜溜的」。芦苇说：溜溜的情歌，溜溜的爱。" },
  { q: "《溜溜的情歌》中「跑马溜溜的山上」直接引用了哪首歌？", opts: ["《康定情歌》", "《青藏高原》", "《山路十八弯》", "《小河淌水》"], ans: 0, exp: "直接引用《康定情歌》的歌词。芦苇说：跑马溜溜的山上，一朵溜溜的云。" },
  { q: "《大声唱》中「大声唱 为自己鼓掌」表达了什么？", opts: ["自信与勇气", "害羞", "无所谓", "随便"], ans: 0, exp: "大声唱出来，为自己骄傲。芦苇说：大声唱，你就是最亮的星。" },
  { q: "《大声唱》中「让世界听到我的声音」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "让世界听到，是夸张的表达。芦苇说：声音再小，也要让世界听见。" },
  { q: "《绿旋风》中「你是绿旋风」的「绿旋风」比喻什么？", opts: ["军人的英姿", "绿色的风", "无所谓", "随便"], ans: 0, exp: "绿旋风比喻穿军装的军人，英姿飒爽。芦苇说：绿旋风，是最美的风景。" },
  { q: "《绿旋风》这首歌的主题是什么？", opts: ["歌颂军人", "歌颂爱情", "歌颂草原", "歌颂金钱"], ans: 0, exp: "这是一首军旅歌曲，歌颂军人。芦苇说：军人，是最可爱的人。" },
  { q: "《中国味道》中「这就是中国味道」的「中国味道」指什么？", opts: ["中国的特色与文化", "中国菜", "无所谓", "随便"], ans: 0, exp: "中国味道是中国的文化和精神。芦苇说：中国味道，最对味。" },
  { q: "《中国味道》中「饺子就酒 越喝越有」体现了什么？", opts: ["中国饮食文化", "外国文化", "无所谓", "随便"], ans: 0, exp: "饺子就酒是中国人的饮食习惯。芦苇说：中国味道，是家的味道。" },
  { q: "《远方的远方还是远方》中「远方的远方还是远方」表达了什么？", opts: ["永无止境的追寻", "远方很近", "无所谓", "随便"], ans: 0, exp: "远方后面还有远方，永远追不完。芦苇说：远方，是到不了的地方。" },
  { q: "《远方的远方还是远方》这首歌的主题是什么？", opts: ["永不停歇的行走", "停下来", "回头", "无所谓"], ans: 0, exp: "一直往前走，远方没有尽头。芦苇说：走不完的路，才是人生。" },
