  { q: "《可能》中「可能永远在路上 等人成长」表达了什么？", opts: ["人生的漂泊与等待", "已经成长", "无所谓", "随便"], ans: 0, exp: "永远在路上，永远在等。芦苇说：成长，是最慢的事。" },
  { q: "《可能》中「可能一切的可能 相信才有可能」表达了什么主题？", opts: ["相信的力量", "不需要相信", "无所谓", "随便"], ans: 0, exp: "只有相信可能，才有可能发生。芦苇说：相信，是可能的开始。" },
  { q: "《四季予你》中「送你三月的风 六月的雨 九月的风景」用了什么修辞？", opts: ["排比", "比喻", "拟人", "夸张"], ans: 0, exp: "排比句列出四季的礼物，节奏感强。芦苇说：四季予你，是最好的情书。" },
  { q: "《四季予你》中「让我余生都有关于你」表达了什么？", opts: ["余生的陪伴与承诺", "短暂的相遇", "无所谓", "随便"], ans: 0, exp: "余生都想和你有关，是最深的承诺。芦苇说：余生，都是你。" },
  { q: "《四季予你》这首歌的主题是什么？", opts: ["把四季的美好都给你", "四季的变化", "无所谓", "随便"], ans: 0, exp: "把一年四季的美好都送给你。芦苇说：四季轮转，爱你不变。" },
  { q: "《世界这么大还是遇见你》中「世界这么大还是遇见你」表达了什么？", opts: ["缘分的珍贵", "世界很小", "无所谓", "随便"], ans: 0, exp: "世界很大，但遇见你就是缘分。芦苇说：世界再大，大不过遇见。" },
  { q: "《世界这么大还是遇见你》中「背包塞满青涩的回忆」营造了什么氛围？", opts: ["青春与旅行", "成熟与稳重", "悲伤与绝望", "无所谓"], ans: 0, exp: "背包和青涩回忆，是青春的旅行。芦苇说：背包里，装的是青春。" },
  { q: "《世界这么大还是遇见你》中「跨越山河去拥抱你」表达了什么？", opts: ["为爱奔赴的勇气", "不想见面", "无所谓", "随便"], ans: 0, exp: "跨越山河也要见你，是勇敢。芦苇说：山河再远，也想抱你。" },
  { q: "《等你归来》中「我就在这里 等你披星戴月」的「披星戴月」表达了什么？", opts: ["你赶路的辛苦", "星星月亮很美", "无所谓", "随便"], ans: 0, exp: "披星戴月是你日夜兼程地赶来。芦苇说：披星戴月来见我，是最浪漫的事。" },
  { q: "《等你归来》中「相思化作漫天尘埃」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "相思化尘埃是夸张，思念太多太散。芦苇说：相思成尘，满天都是。" },
  { q: "《等你归来》这首歌的主题是什么？", opts: ["执着的等待", "放弃等待", "无所谓", "随便"], ans: 0, exp: "我在这里一直等你回来。芦苇说：等你，是最长情的告白。" },
  { q: "《人间烟火》中「人间烟火 最抚凡人心」表达了什么？", opts: ["平凡生活的温暖", "烟火很呛", "无所谓", "随便"], ans: 0, exp: "人间的烟火气，最能安慰普通人。芦苇说：烟火气，是最好的味道。" },
  { q: "《人间烟火》中「柴米油盐的日子」表达了什么？", opts: ["平凡的日常生活", "富贵的生活", "无所谓", "随便"], ans: 0, exp: "柴米油盐是最普通但也最真实的日子。芦苇说：柴米油盐，才是生活。" },
  { q: "《人间烟火》中「一半烟火 一半清欢」表达了什么？", opts: ["生活的平衡", "只有烟火", "只有清欢", "无所谓"], ans: 0, exp: "一半热闹一半安静，是最好的生活。芦苇说：烟火清欢，都要有。" },
  { q: "《不再联系》中「我和你不再联系」表达了什么？", opts: ["分手后的决绝", "还想联系", "无所谓", "随便"], ans: 0, exp: "不再联系是最痛的告别。芦苇说：不联系，不代表不想你。" },
  { q: "《不再联系》中「希望你不要介意」表达了什么？", opts: ["最后的客气与温柔", "愤怒", "无所谓", "随便"], ans: 0, exp: "不联系了还希望你别介意，是最后的体面。芦苇说：不联系了，也祝你安好。" },
  { q: "《不再联系》中「不是因为想你才寂寞」表达了什么？", opts: ["寂寞是常态，不是因为想你", "想你了", "无所谓", "随便"], ans: 0, exp: "寂寞一直都在，不是因为你才寂寞。芦苇说：寂寞，是一个人的事。" },
  { q: "《新娘不是我》中「新郎结婚了 新娘不是我」表达了什么？", opts: ["爱而不得的遗憾", "祝福", "无所谓", "随便"], ans: 0, exp: "最爱的人结婚了，新娘不是我。芦苇说：最痛的，是新娘不是我。" },
  { q: "《新娘不是我》中「曾经以为我们会走到最后」表达了什么？", opts: ["预期与现实的落差", "已经走到最后", "无所谓", "随便"], ans: 0, exp: "以为会永远，结果只是以为。芦苇说：以为，是最骗人的词。" },
  { q: "《新娘不是我》中「我穿着伴娘服 看着你笑」营造了什么氛围？", opts: ["心酸的祝福", "开心的婚礼", "无所谓", "随便"], ans: 0, exp: "最爱的人结婚，我是伴娘，心酸。芦苇说：笑着祝福，是最难演的戏。" },
  { q: "《长街万象》中「长街万象」表达了什么？", opts: ["街头的繁华与百态", "一条空街", "无所谓", "随便"], ans: 0, exp: "长街上有世间万象，热闹丰富。芦苇说：长街走一遍，就看透了人间。" },
  { q: "《长街万象》中「车水马龙 人来人往」用了什么修辞？", opts: ["对偶", "比喻", "拟人", "夸张"], ans: 0, exp: "车水马龙和人来人往是对偶，写繁华。芦苇说：车水马龙，才是人间。" },
  { q: "《孤身的人》中「孤身的人 在夜里」表达了什么？", opts: ["夜晚的孤独", "白天的热闹", "无所谓", "随便"], ans: 0, exp: "孤身的人在夜里，孤独更浓。芦苇说：夜里，孤独最容易被听见。" },
  { q: "《孤身的人》中「没有人心疼 没有人问」表达了什么？", opts: ["被遗忘的孤独", "很多人关心", "无所谓", "随便"], ans: 0, exp: "没人关心没人问，是最深的孤独。芦苇说：孤身，就是没人问。" },
  { q: "《孤身的人》中「万家灯火 没有一盏等我」用了什么修辞？", opts: ["对比", "比喻", "拟人", "排比"], ans: 0, exp: "万家灯火和别人家对比自己的孤独。芦苇说：万家灯火，没有我的那一盏。" },
  { q: "《时光洪流》中「时光洪流」比喻什么？", opts: ["时间的力量不可阻挡", "洪水", "无所谓", "随便"], ans: 0, exp: "时光像洪水一样汹涌，冲走一切。芦苇说：时光洪流，谁都挡不住。" },
  { q: "《时光洪流》中「我渺小的像一粒尘埃」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把自己比作尘埃，渺小无助。芦苇说：在时光里，我们都是尘埃。" },
  { q: "《时光洪流》中「回忆像一把刀」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "回忆比作刀，会伤人。芦苇说：回忆，是最利的刀。" },
  { q: "《故事终章》中「故事终章」比喻什么？", opts: ["感情的结束", "故事开始", "无所谓", "随便"], ans: 0, exp: "故事终章是感情的结局。芦苇说：终章到了，故事就结束了。" },
  { q: "《故事终章》中「最后一页 写着再见」表达了什么？", opts: ["故事的结局是告别", "还会再见", "无所谓", "随便"], ans: 0, exp: "最后一页写着再见，是结局。芦苇说：再见，是故事的终章。" },
  { q: "《故事终章》中「我们的故事 没有续集」表达了什么？", opts: ["彻底结束的遗憾", "还有续集", "无所谓", "随便"], ans: 0, exp: "没有续集，是真的结束了。芦苇说：没有续集，是最痛的终章。" },
  { q: "《三生缘》中「三生缘」表达了什么？", opts: ["三生三世的缘分", "一生的缘分", "无所谓", "随便"], ans: 0, exp: "三生缘是前世今生的宿命。芦苇说：三生三世，只为遇见你。" },
  { q: "《三生缘》中「奈何桥上等三年」引用了什么传说？", opts: ["孟婆汤和奈何桥", "鹊桥", "断桥", "廊桥"], ans: 0, exp: "奈何桥是民间传说中投胎转世的地方。芦苇说：奈何桥上，等你三年。" },
  { q: "《三生缘》中「前世的债 今生来还」表达了什么？", opts: ["因果与宿命", "没有前世", "无所谓", "随便"], ans: 0, exp: "前世欠你的，今生来还。芦苇说：今生遇见，是来还债的。" },
  { q: "《千里共婵娟》中「千里共婵娟」出自谁的词？", opts: ["苏轼《水调歌头》", "李白《静夜思》", "杜甫《月夜》", "王维《山居秋暝》"], ans: 0, exp: "出自苏轼《水调歌头·明月几时有》。芦苇说：但愿人长久，千里共婵娟。" },
  { q: "《千里共婵娟》中「月亮代表我的心」引用了哪首歌？", opts: ["《月亮代表我的心》", "《月亮之上》", "《明月几时有》", "《月半小夜曲》"], ans: 0, exp: "引用了经典歌曲《月亮代表我的心》。芦苇说：月亮代表我的心，最老的告白。" },
  { q: "《许你》中「许你一世温柔」表达了什么？", opts: ["一生的承诺", "一时的温柔", "无所谓", "随便"], ans: 0, exp: "许你一世温柔，是最深的承诺。芦苇说：一世温柔，只给你。" },
  { q: "《许你》中「许你岁月静好」表达了什么？", opts: ["平安安稳的幸福", "轰轰烈烈", "无所谓", "随便"], ans: 0, exp: "许你岁月静好，是平淡的幸福。芦苇说：岁月静好，是最好的许愿。" },
  { q: "《你的托付》中「你的托付 我来守护」表达了什么？", opts: ["责任与承诺", "无所谓", "随便", "拒绝托付"], ans: 0, exp: "你托付给我的，我一定会守护。芦苇说：托付，是最重的信任。" },
  { q: "《你的托付》中「无论贫穷或富有」引用了哪里的誓词？", opts: ["婚礼誓词", "毕业誓词", "入职誓词", "入党誓词"], ans: 0, exp: "引用婚礼上的誓词，无论贫穷富有。芦苇说：无论贫穷富有，我都愿意。" },
  { q: "《怎么能忘了》中「怎么能忘了 那些美好」表达了什么？", opts: ["忘不掉的回忆", "已经忘了", "无所谓", "随便"], ans: 0, exp: "那些美好，怎么都忘不掉。芦苇说：忘不掉，就别忘了。" },
  { q: "《怎么能忘了》中「你走的太干脆」表达了什么？", opts: ["分手的决绝", "不想走", "无所谓", "随便"], ans: 0, exp: "你走得太干脆，一点不拖泥带水。芦苇说：干脆的走，最让人痛。" },
  { q: "《一程山路》中「一程山路 一程水」用了什么修辞？", opts: ["对偶", "比喻", "拟人", "夸张"], ans: 0, exp: "山路和水路对偶，写旅途的艰辛。芦苇说：一程山水，一程人生。" },
  { q: "《一程山路》中「翻过这座山 是否就能看到你」表达了什么？", opts: ["对重逢的期待", "不想见你", "无所谓", "随便"], ans: 0, exp: "翻山越岭去找你，期待见到你。芦苇说：翻过山，希望你在那边。" },
  { q: "《一程山路》这首歌的主题是什么？", opts: ["跋山涉水的追寻", "原地等待", "无所谓", "随便"], ans: 0, exp: "走一程山路，去找那个人。芦苇说：路再远，也要去找你。" },
  { q: "《试着忘记》中「试着忘记你」表达了什么？", opts: ["忘记的艰难", "很容易忘记", "无所谓", "随便"], ans: 0, exp: "试着忘记，是因为忘不掉。芦苇说：试着忘记，越试越记得。" },
  { q: "《试着忘记》中「越是想忘记 越是清晰」表达了什么心理学现象？", opts: ["白熊效应", "从众效应", "蝴蝶效应", "破窗效应"], ans: 0, exp: "越不让想，越会想，是白熊效应。芦苇说：忘记，是最难的事。" },
  { q: "《小楷》中「我用小楷写你的名字」表达了什么？", opts: ["用心的书写与思念", "随便写写", "无所谓", "随便"], ans: 0, exp: "用小楷写你的名字，是认真是思念。芦苇说：小楷写你，字字都是心。" },
  { q: "《小楷》中「一撇一捺都是你」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "每个笔画都是你，是夸张也是思念。芦苇说：写的是字，想的是你。" },
  { q: "《小楷》中「宣纸太薄 写不完相思」用了什么修辞？", opts: ["夸张", "比喻", "拟人", "排比"], ans: 0, exp: "宣纸写不完相思，是夸张。芦苇说：相思太多，纸太薄。" },
  { q: "《念》中「念 是一根线」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把念比作线，牵着两个人。芦苇说：念，是最细的线。" },
  { q: "《念》中「一念之间 万水千山」表达了什么？", opts: ["思念让距离消失", "距离很远", "无所谓", "随便"], ans: 0, exp: "一念之间，万水千山都不是距离。芦苇说：念你，你就在身边。" },
  { q: "《分开》中「分开后的第几天」表达了什么？", opts: ["数着日子过，放不下", "时间过得快", "无所谓", "随便"], ans: 0, exp: "分开后每天数着日子，是放不下。芦苇说：分开的日子，一天像一年。" },
  { q: "《分开》中「我还在原地 你已经走远」表达了什么？", opts: ["爱情的不同步", "一起走了", "无所谓", "随便"], ans: 0, exp: "我还在原地等你，你已经走远了。芦苇说：原地的人，最傻。" },
  { q: "《亲爱的你》中「亲爱的你 在哪里」表达了什么？", opts: ["对爱人的呼唤", "知道在哪", "无所谓", "随便"], ans: 0, exp: "亲爱的你在哪里，是想念是呼唤。芦苇说：亲爱的，我想你了。" },
  { q: "《亲爱的你》中「好久不见 十分想念」用了什么修辞？", opts: ["对偶", "比喻", "拟人", "夸张"], ans: 0, exp: "好久不见和十分想念对偶，简洁有力。芦苇说：好久不见，很想你。" },
  { q: "《如果你也听说》中「如果你也听说」表达了什么？", opts: ["对流言的无奈", "听说很开心", "无所谓", "随便"], ans: 0, exp: "如果你也听说了那些关于我的事。芦苇说：听说，是最不靠谱的事。" },
  { q: "《如果你也听说》中「有没有想过我」表达了什么？", opts: ["被想起的期待", "不想被想起", "无所谓", "随便"], ans: 0, exp: "你有没有想过我，是小心翼翼的期待。芦苇说：想过我吗？哪怕一次。" },
  { q: "《不再年轻》中「我们都不再年轻」表达了什么？", opts: ["岁月的流逝", "还很年轻", "无所谓", "随便"], ans: 0, exp: "不再年轻，是承认时间过去了。芦苇说：不再年轻，但还有回忆。" },
  { q: "《不再年轻》中「眼角有了皱纹」表达了什么？", opts: ["衰老的标志", "还很年轻", "无所谓", "随便"], ans: 0, exp: "眼角皱纹是岁月留下的痕迹。芦苇说：皱纹，是时间的吻。" },
  { q: "《不敢打给你》中「不敢打给你」表达了什么心理？", opts: ["想念但不敢联系", "不想联系", "无所谓", "随便"], ans: 0, exp: "很想你，但不敢打电话给你。芦苇说：不敢打给你，是怕打扰。" },
  { q: "《不敢打给你》中「怕听到你的声音 会哭」表达了什么？", opts: ["脆弱与思念", "坚强", "无所谓", "随便"], ans: 0, exp: "怕听到你的声音就忍不住哭。芦苇说：你的声音，是最脆弱的开关。" },
  { q: "《你的心里还有谁》中「你的心里还有谁」表达了什么？", opts: ["对爱情的怀疑", "信任", "无所谓", "随便"], ans: 0, exp: "你心里除了我还有谁，是不安全感。芦苇说：心里只能有我一个。" },
  { q: "《你的心里还有谁》中「我不想问 又忍不住想问」表达了什么心理？", opts: ["矛盾的纠结", "无所谓", "随便", "很干脆"], ans: 0, exp: "不想问但又忍不住，是纠结。芦苇说：想问又不敢问，最难受。" },
  { q: "《怎么会不难过》中「怎么会不难过」用了什么句式？", opts: ["反问", "陈述", "疑问", "命令"], ans: 0, exp: "反问句，表达一定会难过。芦苇说：怎么会不难过，除非不爱。" },
  { q: "《怎么会不难过》中「你走了 天就黑了」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "你走了天就黑了，是把你的离去比作天黑。芦苇说：你就是我的光。" },
  { q: "《只是差一点》中「只是差一点 我们就永远」表达了什么？", opts: ["功亏一篑的遗憾", "已经永远", "无所谓", "随便"], ans: 0, exp: "差一点就能永远，最遗憾。芦苇说：差一点，差一辈子。" },
  { q: "《只是差一点》中「差一点 你就是我的」表达了什么？", opts: ["擦肩而过的遗憾", "已经是我的", "无所谓", "随便"], ans: 0, exp: "差一点你就是我的，是错过。芦苇说：差一点，就是一辈子。" },
  { q: "《给我一杯酒》中「给我一杯酒 忘掉忧愁」表达了什么？", opts: ["借酒消愁", "喜欢喝酒", "无所谓", "随便"], ans: 0, exp: "喝酒是为了忘掉烦恼。芦苇说：借酒消愁，愁更愁。" },
  { q: "《给我一杯酒》中「一醉方休」表达了什么？", opts: ["喝到醉为止", "喝一口", "无所谓", "随便"], ans: 0, exp: "一醉方休是喝到烂醉，彻底放纵。芦苇说：一醉方休，醒来还是愁。" },
  { q: "《别等》中「别等 该来的人自然会来」表达了什么？", opts: ["顺其自然的态度", "一定要等", "无所谓", "随便"], ans: 0, exp: "别等了，该来的自然会来。芦苇说：等不到的人，就别等了。" },
  { q: "《别等》中「别等 不该等的人」表达了什么？", opts: ["及时止损的智慧", "继续等", "无所谓", "随便"], ans: 0, exp: "不该等的人，别浪费时间。芦苇说：不等，是最好的决定。" },
  { q: "《如果你还在》中「如果你还在 该有多好」表达了什么？", opts: ["对过去的怀念", "你不重要", "无所谓", "随便"], ans: 0, exp: "如果你还在就好了，是怀念。芦苇说：如果你还在，该多好。" },
  { q: "《如果你还在》中「我学会了珍惜 但你已不在」表达了什么？", opts: ["迟来的醒悟", "早就会珍惜", "无所谓", "随便"], ans: 0, exp: "学会了珍惜，但你已经不在了。芦苇说：珍惜，是最迟学会的事。" },
  { q: "《因为你》中「因为你 我变成了更好的自己」表达了什么？", opts: ["爱情让人成长", "爱情让人堕落", "无所谓", "随便"], ans: 0, exp: "因为你，我才变得更好。芦苇说：好的爱情，是让你变好。" },
  { q: "《因为你》中「因为你 我学会了爱」表达了什么？", opts: ["爱情的启蒙", "本来就懂", "无所谓", "随便"], ans: 0, exp: "是你教会我怎么去爱。芦苇说：是你，让我懂了爱。" },
  { q: "《勇敢爱》中「勇敢爱 不要怕受伤」表达了什么？", opts: ["鼓励大胆去爱", "不要爱", "无所谓", "随便"], ans: 0, exp: "勇敢去爱，别怕受伤。芦苇说：爱，需要勇敢。" },
  { q: "《勇敢爱》中「爱过就不后悔」表达了什么？", opts: ["不后悔的态度", "会后悔", "无所谓", "随便"], ans: 0, exp: "爱过了，就不后悔。芦苇说：后悔，是最没用的情绪。" },
  { q: "《忘了吧》中「忘了吧 就当是一场梦」表达了什么？", opts: ["劝自己放下", "忘不掉", "无所谓", "随便"], ans: 0, exp: "忘了吧，就当没发生过。芦苇说：忘了吧，但忘不掉。" },
  { q: "《忘了吧》中「醒来以后 没有你」表达了什么？", opts: ["梦醒的失落", "梦里有你", "无所谓", "随便"], ans: 0, exp: "梦醒了，你不在。芦苇说：宁愿在梦里，不醒来。" },
  { q: "《成全你 忘了我》中「成全你 忘了我」表达了什么？", opts: ["牺牲式的成全", "不放手", "无所谓", "随便"], ans: 0, exp: "我成全你，你忘了我。芦苇说：成全，是最痛的爱。" },
  { q: "《成全你 忘了我》中「只要你能幸福 我怎样都行」表达了什么？", opts: ["无私的爱", "自私的爱", "无所谓", "随便"], ans: 0, exp: "只要你幸福，我怎样都可以。芦苇说：你幸福，我就幸福。" }
],
"蔡徐坤": [
  { q: "《情人》中「眼色 是幻觉 夜色 是极夜」用了什么修辞？", opts: ["对偶与押韵", "比喻", "拟人", "夸张"], ans: 0, exp: "眼色对夜色，幻觉对极夜，对偶工整。芦苇说：情人眼里，夜色也迷人。" },
  { q: "《情人》中「危险又迷人」表达了什么？", opts: ["致命的吸引力", "安全又普通", "无所谓", "随便"], ans: 0, exp: "危险和迷人并存，是致命的诱惑。芦苇说：越危险，越迷人。" },
  { q: "《情人》副歌「你轻轻一个吻」中旋律有什么特点？", opts: ["慵懒性感的R&B风格", "高亢激昂", "快速跳跃", "古典优雅"], ans: 0, exp: "慵懒性感的R&B，营造暧昧氛围。芦苇说：情人，是慵懒的性感。" },
  { q: "《情人》中「疯狂又浪漫」表达了什么？", opts: ["爱与激情的矛盾统一", "只有疯狂", "只有浪漫", "无所谓"], ans: 0, exp: "疯狂和浪漫在一起，是爱情的样子。芦苇说：爱，是疯狂又浪漫。" },
  { q: "《情人》中「没日没月 都没差」表达了什么？", opts: ["有你就不需要时间", "时间很重要", "无所谓", "随便"], ans: 0, exp: "有你在，白天黑夜都无所谓。芦苇说：你在，时间就不重要了。" },
  { q: "《Wait Wait Wait》中「Wait wait wait」重复用了什么修辞？", opts: ["反复", "排比", "拟人", "夸张"], ans: 0, exp: "反复出现wait，强调等待的焦灼。芦苇说：等等等，等不到你。" },
  { q: "《Wait Wait Wait》中「所有等待 都值得」表达了什么？", opts: ["对等待的肯定", "不值得等", "无所谓", "随便"], ans: 0, exp: "只要是等你，多久都值得。芦苇说：值得等的人，才叫等待。" },
  { q: "《Wait Wait Wait》中「我站在这里 等你回应」表达了什么？", opts: ["单方面的期待", "双向奔赴", "无所谓", "随便"], ans: 0, exp: "我在这里等你，等你给我回应。芦苇说：等你回应，最煎熬。" },
  { q: "《Home》中「我们都是一家人」表达了什么主题？", opts: ["温暖与团结", "冷漠与疏离", "无所谓", "随便"], ans: 0, exp: "我们是一家人，是温暖和归属。芦苇说：Home，是最暖的地方。" },
  { q: "《Home》中「爱 无处不在」表达了什么？", opts: ["爱的普世与包容", "爱很少见", "无所谓", "随便"], ans: 0, exp: "爱到处都有，只要你用心感受。芦苇说：爱，就在身边。" },
  { q: "《Home》中「别怕 有我在」表达了什么？", opts: ["安全感与陪伴", "我不会在", "无所谓", "随便"], ans: 0, exp: "别怕，我会陪着你。芦苇说：有我在，你就别怕。" },
  { q: "《Pull Up》中「Pull up on me」表达了什么？", opts: ["靠近我的邀请", "离我远点", "无所谓", "随便"], ans: 0, exp: "开到我身边来，是靠近的邀请。芦苇说：Pull up，来我身边。" },
  { q: "《Pull Up》中「心跳加速」表达了什么情绪？", opts: ["心动与紧张", "平静", "无所谓", "随便"], ans: 0, exp: "心跳加速是心动的信号。芦苇说：见你，心跳就快了。" },
  { q: "《You Can Be My GirlFriend》中「你可以做我女朋友吗」用了什么句式？", opts: ["直接问句", "陈述句", "命令句", "反问句"], ans: 0, exp: "直接问，勇敢直接的表白。芦苇说：喜欢你，就直接说。" },
  { q: "《You Can Be My GirlFriend》中「我对你是认真的」表达了什么？", opts: ["真诚的态度", "玩玩而已", "无所谓", "随便"], ans: 0, exp: "我是认真的，不是随便说说。芦苇说：认真，是最重要的。" },
  { q: "《Hard To Get》中「欲擒故纵」表达了什么恋爱心理？", opts: ["故意不主动让对方着急", "直接表白", "无所谓", "随便"], ans: 0, exp: "欲擒故纵是想让你更想我。芦苇说：越得不到，越想要。" },
  { q: "《Hard To Get》中「你越追 我越跑」表达了什么？", opts: ["推拉的游戏", "直接接受", "无所谓", "随便"], ans: 0, exp: "你追我跑，是恋爱的游戏。芦苇说：追跑之间，是心动。" },
  { q: "《It's You》中「It's you」重复表达了什么？", opts: ["认定的唯一", "随便谁都可以", "无所谓", "随便"], ans: 0, exp: "是你，只能是你，是唯一。芦苇说：It's you，只有你。" },
  { q: "《It's You》中「你是我的答案」表达了什么？", opts: ["你就是我找的人", "你不是答案", "无所谓", "随便"], ans: 0, exp: "找来找去，你就是答案。芦苇说：你，是所有的答案。" },
  { q: "《Bigger》中「Bigger than bigger」是什么的变体？", opts: ["苹果广告语", "耐克广告", "阿迪广告", "可口可乐"], ans: 0, exp: "变自苹果的「Bigger than bigger」。芦苇说：更大，是永远追求。" },
  { q: "《Bigger》中「梦想越大 舞台越大」表达了什么？", opts: ["梦想与成就的关系", "梦想没用", "无所谓", "随便"], ans: 0, exp: "梦想越大，舞台就越大。芦苇说：敢想，才能敢做。" },
  { q: "《Dream》中「追梦的路上 不回头」表达了什么？", opts: ["追梦的执着", "半途而废", "无所谓", "随便"], ans: 0, exp: "追梦就不回头，一直走下去。芦苇说：追梦，是一条不归路。" },
  { q: "《Dream》中「梦想是唯一的方向」表达了什么？", opts: ["梦想的指引作用", "梦想不重要", "无所谓", "随便"], ans: 0, exp: "梦想就是指南针，指向我要去的地方。芦苇说：梦想，是最亮的光。" },
  { q: "《重生》中「浴火重生」表达了什么？", opts: ["经历磨难后变得更强大", "被摧毁", "无所谓", "随便"], ans: 0, exp: "浴火重生是在痛苦中站起来。芦苇说：重生，是最强的反击。" },
  { q: "《重生》中「打不倒我的 让我更强大」表达了什么精神？", opts: ["反脆弱", "脆弱", "无所谓", "随便"], ans: 0, exp: "打不倒我的，都会让我更强。芦苇说：击不倒我的，都是养料。" },
  { q: "《蒙着眼》中「蒙着眼」比喻什么？", opts: ["对偏见的无视与反抗", "真的看不见", "无所谓", "随便"], ans: 0, exp: "蒙着眼是不看偏见，坚持自己。芦苇说：蒙着眼，走自己的路。" },
  { q: "《蒙着眼》中「就算世界与我为敌」表达了什么？", opts: ["孤军奋战的勇气", "随波逐流", "无所谓", "随便"], ans: 0, exp: "全世界都反对我，我也不怕。芦苇说：与全世界为敌，也要做自己。" },
  { q: "《蒙着眼》中「谣言像刀子」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "谣言比作刀子，会伤人。芦苇说：谣言，是软刀子。" },
  { q: "《感受她》中「感受她 感受她的温柔」表达了什么？", opts: ["细腻的情感体验", "不需要感受", "无所谓", "随便"], ans: 0, exp: "去感受她的温柔，是细腻的爱。芦苇说：感受，是最深的懂得。" },
  { q: "《感受她》中「她的眼神 藏着秘密」表达了什么？", opts: ["神秘与吸引", "很普通", "无所谓", "随便"], ans: 0, exp: "眼神里有秘密，让人想探索。芦苇说：眼神，是最深的湖。" },
  { q: "《没有意外》中「没有意外 你就是我的意外」用了什么修辞？", opts: ["矛盾修辞", "比喻", "拟人", "夸张"], ans: 0, exp: "你是唯一的意外，矛盾又浪漫。芦苇说：你，是最美的意外。" },
  { q: "《没有意外》中「所有的安排 都是因为你」表达了什么？", opts: ["命中注定的宿命感", "随机发生", "无所谓", "随便"], ans: 0, exp: "一切都是为了遇见你而安排。芦苇说：遇见你，是安排好的。" },
  { q: "《1%》中「1%的可能 我也要试试」表达了什么？", opts: ["不放弃的态度", "直接放弃", "无所谓", "随便"], ans: 0, exp: "只有1%的可能，我也要试。芦苇说：1%，也要抓住。" },
  { q: "《1%》中「奇迹会发生」表达了什么？", opts: ["对奇迹的相信", "不信奇迹", "无所谓", "随便"], ans: 0, exp: "相信奇迹，奇迹就会发生。芦苇说：奇迹，是相信的人创造的。" },
  { q: "《标签》中「撕掉标签」表达了什么？", opts: ["拒绝被定义", "接受标签", "无所谓", "随便"], ans: 0, exp: "撕掉别人贴的标签，做自己。芦苇说：标签，是用来撕的。" },
  { q: "《标签》中「我就是我 不一样的烟火」引用了谁的歌词？", opts: ["张国荣《我》", "王菲《浮躁》", "那英《征服》", "刘德华《一起走过的日子》"], ans: 0, exp: "引用张国荣《我》中的经典歌词。芦苇说：不一样的烟火，是最美的。" },
  { q: "《YOUNG》中「We are young」表达了什么？", opts: ["青春的活力", "衰老", "无所谓", "随便"], ans: 0, exp: "我们正年轻，有无限可能。芦苇说：年轻，是最好的资本。" },
  { q: "《YOUNG》中「活成自己想要的样子」表达了什么？", opts: ["自我实现", "活成别人想要的样子", "无所谓", "随便"], ans: 0, exp: "活成自己想要的样子，而不是别人的期待。芦苇说：做自己，最酷。" },
  { q: "《现象》中「现象级」表达了什么？", opts: ["引起广泛关注的事物", "很普通", "无所谓", "随便"], ans: 0, exp: "现象级是影响力很大。芦苇说：现象，是被人看见。" },
  { q: "《现象》中「打破常规」表达了什么精神？", opts: ["创新与突破", "守旧", "无所谓", "随便"], ans: 0, exp: "打破常规，不走寻常路。芦苇说：常规，就是用来打破的。" },
  { q: "《默片》中「默片」比喻什么？", opts: ["无声的回忆或感情", "有声电影", "无所谓", "随便"], ans: 0, exp: "默片是没有声音的，像回不去的过去。芦苇说：回忆，是无声的默片。" },
  { q: "《默片》中「黑白画面」表达了什么？", opts: ["过去的美好与遥远", "彩色的", "无所谓", "随便"], ans: 0, exp: "黑白画面是过去的记忆，褪色了。芦苇说：回忆，是黑白的。" },
  { q: "《爱与痛》中「爱与痛是并存的」表达了什么？", opts: ["爱情的双面性", "只有爱没有痛", "只有痛没有爱", "无所谓"], ans: 0, exp: "爱有多深，痛就有多深。芦苇说：爱和痛，是一起的。" },
  { q: "《爱与痛》中「越爱越痛 越痛越爱」用了什么修辞？", opts: ["回文", "比喻", "拟人", "夸张"], ans: 0, exp: "回文结构，爱与痛的循环。芦苇说：爱痛循环，走不出来。" },
  { q: "《修行》中「爱是一场修行」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把爱比作修行，需要学习和磨砺。芦苇说：爱，是最难的修行。" },
  { q: "《修行》中「修成正果」表达了什么？", opts: ["爱情的成功", "失败", "无所谓", "随便"], ans: 0, exp: "修成正果是爱情有了好结果。芦苇说：修成正果，是最美的结局。" },
  { q: "《迷》中「你是个谜」表达了什么？", opts: ["神秘与吸引力", "很透明", "无所谓", "随便"], ans: 0, exp: "你是个谜，让人想解。芦苇说：谜，是最迷人的。" },
  { q: "《迷》中「猜不透 才想猜」表达了什么心理？", opts: ["好奇心与吸引力", "不想猜", "无所谓", "随便"], ans: 0, exp: "越猜不透，越想猜。芦苇说：猜不透，才有趣。" },
  { q: "《HAHA》中「HAHA」表达了什么情绪？", opts: ["笑着面对一切的洒脱", "真开心", "无所谓", "随便"], ans: 0, exp: "HAHA是笑对一切的态度。芦苇说：笑一笑，没什么大不了。" },
  { q: "《HAHA》中「笑看风云」表达了什么？", opts: ["豁达的人生观", "纠结", "无所谓", "随便"], ans: 0, exp: "笑看风云，是豁达和从容。芦苇说：风云再大，笑着看。" },
  { q: "《nobody cares》中「nobody cares」表达了什么？", opts: ["孤独与无助", "被关注", "无所谓", "随便"], ans: 0, exp: "没人关心，是孤独的呐喊。芦苇说：没人关心，最孤独。" },
  { q: "《nobody cares》中「只有我自己」表达了什么？", opts: ["孤军奋战的处境", "有很多人陪", "无所谓", "随便"], ans: 0, exp: "只有我自己，是孤独也是坚强。芦苇说：一个人，也要走下去。" },
  { q: "《地心引力》中「你像地心引力」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把你比作地心引力，无法抗拒。芦苇说：你，是我逃不开的引力。" },
  { q: "《地心引力》中「被你吸引 无法自拔」表达了什么？", opts: ["被强烈吸引", "很容易挣脱", "无所谓", "随便"], ans: 0, exp: "被你吸引，陷进去出不来。芦苇说：你，是我的黑洞。" },
  { q: "《氧气》中「你是我的氧气」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把你比作氧气，没有你活不了。芦苇说：你，是我活着的理由。" },
  { q: "《氧气》中「没有你 我不能呼吸」表达了什么？", opts: ["对你的依赖", "没有你也可以", "无所谓", "随便"], ans: 0, exp: "没有你，就像不能呼吸。芦苇说：你，是我的空气。" },
  { q: "《热带雨林》中「热带雨林」比喻什么？", opts: ["茂盛狂热的感情", "寒冷的感情", "无所谓", "随便"], ans: 0, exp: "热带雨林是热情茂盛的爱。芦苇说：爱如雨林，热烈又潮湿。" },
  { q: "《热带雨林》中「潮湿的心」表达了什么？", opts: ["敏感湿润的情绪", "干燥的心", "无所谓", "随便"], ans: 0, exp: "潮湿的心是敏感、易感动的。芦苇说：心潮湿了，就容易下雨。" },
  { q: "《海的女儿》中「海的女儿」引用什么童话？", opts: ["安徒生《海的女儿》", "格林童话", "一千零一夜", "伊索寓言"], ans: 0, exp: "引用安徒生童话《海的女儿》。芦苇说：海的女儿，为爱变成泡沫。" },
  { q: "《海的女儿》中「为了爱 变成泡沫」表达了什么？", opts: ["为爱牺牲", "爱自己", "无所谓", "随便"], ans: 0, exp: "像美人鱼一样，为爱牺牲自己。芦苇说：为爱牺牲，是最痛的。" },
  { q: "《未知数》中「未来是未知数」表达了什么？", opts: ["对未来的不确定", "未来已定", "无所谓", "随便"], ans: 0, exp: "未来不知道会怎样，是未知。芦苇说：未知，才值得期待。" },
  { q: "《未知数》中「解不开的方程」比喻什么？", opts: ["复杂难解的感情", "简单", "无所谓", "随便"], ans: 0, exp: "感情像复杂的方程，解不开。芦苇说：你，是最难解的题。" },
  { q: "《狂热》中「狂热」表达了什么情绪？", opts: ["极度热情", "冷漠", "无所谓", "随便"], ans: 0, exp: "狂热是爱到沸腾。芦苇说：狂热，是爱最烫的时候。" },
  { q: "《狂热》中「燃烧自己」表达了什么？", opts: ["为爱付出一切", "保留自己", "无所谓", "随便"], ans: 0, exp: "为你燃烧自己，是奉献。芦苇说：燃烧，是最亮的光。" },
  { q: "《纯粹》中「纯粹的爱」表达了什么？", opts: ["不掺杂质的爱", "复杂的爱", "无所谓", "随便"], ans: 0, exp: "纯粹的爱，是最干净的。芦苇说：纯粹，是最难得的。" },
  { q: "《纯粹》中「像水晶一样透明」用了什么修辞？", opts: ["比喻", "拟人", "夸张", "排比"], ans: 0, exp: "把爱比作水晶，透明纯净。芦苇说：水晶般的爱，最易碎。" },
  { q: "《孤独》中「孤独是一种享受」表达了什么？", opts: ["对孤独的正面态度", "孤独很痛苦", "无所谓", "随便"], ans: 0, exp: "孤独不一定是坏事，可以享受。芦苇说：孤独，是与自己对话。" },
  { q: "《孤独》中「一个人也很好」表达了什么？", opts: ["自洽的独处", "需要人陪", "无所谓", "随便"], ans: 0, exp: "一个人也可以过得很好。芦苇说：一个人，也很精彩。" }

"林宥嘉": [
  { q: "《说谎》前奏使用了哪种和弦进行？", opts: ["Ⅰ–Ⅴ–Ⅵm–Ⅳ 卡农进行", "Ⅰ–Ⅳ–Ⅴ 蓝调进行", "Ⅱ–Ⅴ–Ⅰ 爵士进行", "Ⅵm–Ⅲ–Ⅳ–Ⅰ 小调进行"], ans: 0, exp: "卡农进行（1564）稳定中带循环感，像走不出的谎言迷宫。芦苇说：和弦不骗人，人骗人。" },
  { q: "《说谎》主歌到副歌的音域变化如何推动情绪？", opts: ["主歌中低音区压抑，副歌跳至高音区崩溃", "全程高音", "全程低音", "先高后低"], ans: 0, exp: "低音区是「忍住不说」，高音区是「撑不住了」。芦苇说：音域是情绪的楼梯。" },
  { q: "《说谎》中「我没有说谎 我何必说谎」两次旋律相同但情绪不同，这是什么编曲手法？", opts: ["旋律重复+配器/力度变化", "转调", "切分音", "倒影对位"], ans: 0, exp: "旋律一样，但弦乐更浓、力度更强，谎越说越心虚。芦苇说：同样的话，多说一次就假了。" },
  { q: "《说谎》副歌中「人生已经如此的艰难 有些事情就不要拆穿」表达了什么深层心理？", opts: ["善意的隐瞒与自我保护", "直接对抗", "无所谓", "逃避现实"], ans: 0, exp: "生活已经够难了，有些真相不如不拆穿。芦苇说：拆穿是最痛的温柔。" },
  { q: "《说谎》结尾「人生已经如此的艰难」再次重复，这种手法叫什么？", opts: ["再现部", "变奏", "即兴", "华彩"], ans: 0, exp: "音乐中的再现部，主题回归，情绪沉淀。芦苇说：再说一次，更难过了。" },
  { q: "《残酷月光》副歌使用了哪类调式来制造「温柔又残忍」的矛盾感？", opts: ["自然小调+大调和弦借用", "全音阶", "多利亚调式", "布鲁斯音阶"], ans: 0, exp: "小调底色是忧伤，借用大调和弦是假希望，更残忍。芦苇说：最伤的温柔是给完再收走。" },
  { q: "《残酷月光》中「我一直都在流浪」的旋律走向是哪一类？", opts: ["级进下行，像疲惫的叹息", "大跳上行", "同音反复", "半音阶爬升"], ans: 0, exp: "音一步步往下掉，像流浪到没力气。芦苇说：流浪的人，音也是往下走的。" },
  { q: "《残酷月光》中「我以为的遗忘 原来躺在你手上」用了什么修辞？", opts: ["拟物化", "比喻", "夸张", "对偶"], ans: 0, exp: "把「遗忘」拟物化，像物件一样躺在你手上。芦苇说：忘不掉的东西，都在你那里。" },
  { q: "《残酷月光》中「残酷」一词如何理解？", opts: ["温柔的伤害最残忍", "真的很残酷", "随便说说", "反讽"], ans: 0, exp: "月光本温柔，却因思念变得残酷。芦苇说：最温柔的最残忍。" },
  { q: "《自然醒》前奏的鼓点节奏型叫什么？", opts: ["半时摇滚节奏（Half-time feel）", "桑巴", "波萨诺瓦", "三连音 shuffle"], ans: 0, exp: "Half-time 让速度感降下来，更显「被吵醒」的慵懒。芦苇说：节奏慢了，起床气大了。" },
  { q: "《自然醒》副歌吉他失真音色表达了什么？", opts: ["烦躁与破坏感", "浪漫", "空灵", "诡异"], ans: 0, exp: "失真像心里那声「烦死了」。芦苇说：失真就是心里那个炸毛的自己。" },
  { q: "《自然醒》中「一觉睡到自然醒」表达了什么生活态度？", opts: ["对自由与放松的渴望", "懒惰", "无所谓", "逃避"], ans: 0, exp: "自然醒是成年人奢侈的自由。芦苇说：能自然醒，就是幸福。" },
  { q: "《浪费》主歌大量使用同音反复，有什么情绪效果？", opts: ["麻木、机械、像自我催眠", "激昂", "欢快", "紧张"], ans: 0, exp: "同音反复像一直念叨「没事」，念到信了。芦苇说：同音是麻木的嘴。" },
  { q: "《浪费》最后一遍副歌升调（转调）的作用是什么？", opts: ["情绪最后一次失控/破罐破摔到极致", "增加流行度", "炫技", "凑时长"], ans: 0, exp: "升调是「我不装了」的终极爆发。芦苇说：升一次调，伤一次心。" },
  { q: "《浪费》中「没关系你也不用给我机会 反正我还有一生可以浪费」中的「浪费」表达了什么态度？", opts: ["自嘲式的执着与卑微", "真的很浪费", "无所谓", "豪爽"], ans: 0, exp: "用「浪费」自嘲，其实是爱你爱到不惜一生。芦苇说：浪费在你身上，不是浪费。" },
  { q: "《想自由》前奏弦乐的音色与情绪关系是什么？", opts: ["温暖但暗淡，像想逃又舍不得", "明亮刺耳", "冰冷机械", "诡异神秘"], ans: 0, exp: "弦乐在中低音区揉弦，像心被揉皱。芦苇说：弦乐一揉，心就皱了。" },
  { q: "《想自由》中「每个人都缺乏什么 我们才会瞬间就不快乐」表达了什么人性洞察？", opts: ["人的不满足与欲望", "人很完美", "无所谓", "外界原因"], ans: 0, exp: "因为缺少什么，所以容易不快乐。芦苇说：缺的，才是最想要的。" },
  { q: "《想自由》中「或许只有你 懂得我 所以你没逃脱」表达了什么关系？", opts: ["被理解的珍贵与依赖", "被控制", "无所谓", "随便"], ans: 0, exp: "懂我的人不多，你没走，所以我依赖你。芦苇说：懂得，是最深的羁绊。" },
  { q: "《心酸》主歌使用钢琴高音区加简单分解和弦，营造了什么画面？", opts: ["青春的脆弱与易碎", "宏大悲壮", "诡异", "狂野"], ans: 0, exp: "高音区像玻璃杯，一碰就碎。芦苇说：青春就是这种声音。" },
  { q: "《心酸》中「我曾拥有你 真叫人心酸」中的「心酸」与「拥有」形成什么关系？", opts: ["反衬——拥有过更让人心酸", "直白描述", "无所谓", "夸张"], ans: 0, exp: "拥有过反而更心酸，因为失去了。芦苇说：拥有过，是最心酸的事。" },
  { q: "《心酸》中「青春兵荒马乱 我们潦草地离散」中的「兵荒马乱」比喻什么？", opts: ["青春的手忙脚乱与遗憾", "战争", "无所谓", "游戏"], ans: 0, exp: "把青春比作战场，手忙脚乱就分开了。芦苇说：青春，是一场乱仗。" },
  { q: "《傻子》副歌的旋律音域为什么缩窄？", opts: ["表现麻木、自我封闭", "表现兴奋", "表现愤怒", "表现期待"], ans: 0, exp: "音域窄像把自己包起来。芦苇说：傻子才不需要大声。" },
  { q: "《傻子》中「做一个傻子多么好」的尾音处理方式是什么？", opts: ["渐弱+叹气式下滑", "强收", "突然停止", "延长高音"], ans: 0, exp: "像说完就认了。芦苇说：叹气，是最诚实的回答。" },
  { q: "《傻子》中「我不需要 也不重要 做一个傻子多么好」中的「傻子」表达了什么？", opts: ["装傻的自保与逃避", "真傻", "聪明", "无所谓"], ans: 0, exp: "傻子不用想那么多，不会痛。芦苇说：傻一点，快乐一点。" },
  { q: "《兜圈》吉他编曲使用了哪种右手指法？", opts: ["Fingerpicking 指弹分解", "扫弦到底", "闷音", "拍弦"], ans: 0, exp: "指弹像走路，一圈一圈。芦苇说：吉他指弹，是脚步的声音。" },
  { q: "《兜圈》中「绕了一圈」对应的旋律出现临时变化音，作用是什么？", opts: ["制造「偏离轨道再回来」的感觉", "炫技", "凑数", "模仿流行"], ans: 0, exp: "变化音像走错路，再绕回来。芦苇说：走偏了，才叫绕圈。" },
  { q: "《兜圈》中「人生是 兜兜转转 回到起点」表达了什么？", opts: ["循环与回归", "直线前进", "后退", "无所谓"], ans: 0, exp: "兜了一圈，发现最珍贵的还是最初。芦苇说：兜兜转转，还是你。" },
  { q: "《突然想起你》编曲在副歌加入大量混响，代表什么？", opts: ["空旷与孤独", "热闹", "愤怒", "兴奋"], ans: 0, exp: "混响像一个人在空房间里喊。芦苇说：混响越大，人越少。" },
  { q: "《突然想起你》中「一个人的夜 我的心 应该放在哪里」表达了什么？", opts: ["失恋后的空虚与迷茫", "充实", "无所谓", "开心"], ans: 0, exp: "夜晚一个人，心无处安放。芦苇说：心没了你，就没了位置。" },
  { q: "《伯乐》中「感谢你不爱我」的旋律为何放在中低音区？", opts: ["无奈、接受，不是愤怒", "愤怒", "撒娇", "无所谓"], ans: 0, exp: "低音是认了。芦苇说：真放下了，反而声小了。" },
  { q: "《伯乐》中「你是我的伯乐」把爱人比作什么？", opts: ["发现我价值的伯乐", "老师", "父母", "朋友"], ans: 0, exp: "伯乐发现千里马，你是那个懂我的人。芦苇说：你是伯乐，我是你的马。" },
  { q: "《天真有邪》副歌使用假声演唱，表达什么心理？", opts: ["脆弱、诱惑、不真实", "力量", "愤怒", "坚定"], ans: 0, exp: "假声是「我不信我自己」。芦苇说：假声，是心里那个小孩。" },
  { q: "《天真有邪》的和弦中频繁使用m7b5（半减七），带来什么色彩？", opts: ["不安、悬疑、美丽但危险", "快乐", "平淡", "坚定"], ans: 0, exp: "m7b5是「笑着的坏人」。芦苇说：最毒的药，最甜。" },
  { q: "《天真有邪》中「天真有邪」这个歌名怎么理解？", opts: ["天真中带着邪恶的诱惑", "天真是好的", "有邪是坏的", "随便"], ans: 0, exp: "看似天真，实则有毒。芦苇说：最天真的，最危险。" },
  { q: "《让世界毁灭》使用失真人声（distortion）效果，意图是什么？", opts: ["理性崩溃，情绪暴力化", "可爱", "温柔", "梦幻"], ans: 0, exp: "人声失真代表「我已经不是我了」。芦苇说：失真，是崩溃的第一个音。" },
  { q: "《让世界毁灭》中摇滚编曲的失真吉他有什么作用？", opts: ["表达愤怒与绝望", "表达开心", "装饰", "无意义"], ans: 0, exp: "失真吉他是愤怒和绝望的声音。芦苇说：失真，是心碎的声音。" },
  { q: "《我总是一个人在练习一个人》全曲只用钢琴+极简弦乐，编曲意图是什么？", opts: ["孤独不需要伴奏团", "省成本", "流行趋势", "炫技"], ans: 0, exp: "越简单，越像一个人。芦苇说：乐器越少，人越真。" },
  { q: "《我总是一个人在练习一个人》中歌名的重复「一个人」有什么作用？", opts: ["强化孤独感", "凑字数", "无所谓", "押韵"], ans: 0, exp: "反复说一个人，更孤独。芦苇说：一个人，说多了就真一个人了。" },
  { q: "《慢一点》的BPM（速度）比一般流行歌慢多少？", opts: ["慢约20-30 BPM", "更快", "一样", "时快时慢"], ans: 0, exp: "速度本身就是态度：我不想快。芦苇说：慢，是反抗。" },
  { q: "《慢一点》中「慢一点 再慢一点」表达了什么？", opts: ["对快节奏生活的反抗", "想快一点", "无所谓", "随便"], ans: 0, exp: "太快了，想慢下来。芦苇说：慢一点，才能看见风景。" },
  { q: "《再别康桥》改编自谁的诗？", opts: ["徐志摩《再别康桥》", "胡适的诗", "闻一多的诗", "戴望舒的诗"], ans: 0, exp: "改编自徐志摩的经典诗作。芦苇说：再别康桥，是诗也是歌。" },
  { q: "《再别康桥》中「轻轻的我走了」的旋律处理有什么特点？", opts: ["轻柔高音像轻手轻脚", "沉重低音", "快速", "跳跃"], ans: 0, exp: "轻柔高音，真的像轻轻地走。芦苇说：轻轻的，最怕惊动谁。" },
  { q: "《再别康桥》中「轻轻的我走了」旋律线呈下行弧线，为什么？", opts: ["模拟「轻轻放下、离开」", "模拟「飞走」", "模仿说话", "随意"], ans: 0, exp: "旋律往下走，是不惊动任何人。芦苇说：轻轻的，是怕你听见。" },
  { q: "《思凡》融合了哪两种冲突的曲风？", opts: ["古典+摇滚", "爵士+民乐", "电子+乡村", "雷鬼+金属"], ans: 0, exp: "古典是「天上」，摇滚是「想造反」。芦苇说：思凡就是古典皮摇滚骨。" },
  { q: "《思凡》中「思凡」出自什么典故？", opts: ["仙女思凡下凡", "凡人想成仙", "无所谓", "随便"], ans: 0, exp: "仙女羡慕人间，动了凡心。芦苇说：思凡，是最美的堕落。" },
  { q: "《越反越爱》副歌使用上行模进，对应什么心理？", opts: ["越压制越往上冲", "放弃", "平静", "无所谓"], ans: 0, exp: "音越来越高，像顶嘴。芦苇说：你越不让，我越要。" },
  { q: "《越反越爱》中「越反越爱」表达了什么心理？", opts: ["叛逆的吸引力", "顺从", "无所谓", "随便"], ans: 0, exp: "越不让爱，越要爱。芦苇说：反对，是最强的催化剂。" },
  { q: "《不换》中「不换」表达了什么？", opts: ["认定的坚定", "可以换", "无所谓", "随便"], ans: 0, exp: "不换，是你就是最好的。芦苇说：不换，是最硬的态度。" },
  { q: "《如果我变成一首歌》中「如果我变成一首歌」用了什么修辞？", opts: ["假设与拟物", "比喻", "夸张", "排比"], ans: 0, exp: "把自己比作一首歌，被传唱。芦苇说：变成歌，就不会被忘。" },
  { q: "《如果我变成一首歌》中「唱到你心里」表达了什么？", opts: ["希望被记住", "无所谓", "随便", "希望被忘记"], ans: 0, exp: "唱到你心里，你就不会忘了我。芦苇说：住进心里，就出不去了。" },
  { q: "《纪念品》中「纪念品」比喻什么？", opts: ["关于过去的回忆", "礼物", "无所谓", "随便"], ans: 0, exp: "你是我的纪念品，留着过去的痕迹。芦苇说：纪念品，是最难扔的。" },
  { q: "《勿忘你》中「勿忘你 勿忘我」用了什么修辞？", opts: ["回文与互文", "比喻", "拟人", "夸张"], ans: 0, exp: "勿忘你勿忘我，你和我互相记住。芦苇说：别忘了彼此，是最深的约定。" },
  { q: "《勿忘你》中「时间偷走了什么」把时间比作什么？", opts: ["小偷", "朋友", "敌人", "老师"], ans: 0, exp: "时间是小偷，偷走了青春和记忆。芦苇说：时间，是最沉默的小偷。" },
  { q: "《白昼之月》中「白昼之月」比喻什么？", opts: ["不该存在却存在的东西", "月亮", "太阳", "星星"], ans: 0, exp: "白天不该有月亮，却存在。芦苇说：不该有的，最难忘。" },
  { q: "《飞》中「我要飞 飞得很高」表达了什么？", opts: ["对自由与梦想的追求", "不想飞", "无所谓", "随便"], ans: 0, exp: "飞是挣脱束缚，去追梦。芦苇说：飞吧，越高越好。" },
  { q: "《如同悲伤被下载了两次》中歌名用了什么修辞？", opts: ["网络时代的新比喻", "传统比喻", "夸张", "拟人"], ans: 0, exp: "把悲伤比作文件，可以下载。芦苇说：悲伤，是可以重复下载的。" },
  { q: "《歇斯底里》中「歇斯底里」表达了什么情绪状态？", opts: ["情绪失控的爆发", "平静", "无所谓", "开心"], ans: 0, exp: "爱到失控，情绪崩溃。芦苇说：歇斯底里，是因为太爱。" },
  { q: "《早开的晚霞》中「早开的晚霞」这个意象怎么理解？", opts: ["不该早来却来了的美好", "晚霞很美", "无所谓", "随便"], ans: 0, exp: "早开意味着早谢，美好但短暂。芦苇说：早开的晚霞，最美也最痛。" },
  { q: "《4号病房》中「4号病房」象征什么？", opts: ["精神上的囚禁与病态", "医院", "无所谓", "随便"], ans: 0, exp: "4号病房是心理的病室。芦苇说：谁心里没有一间病房？" },
  { q: "《飘》中「飘」这个意象表达了什么？", opts: ["无根与漂泊的状态", "稳定", "无所谓", "随便"], ans: 0, exp: "飘着，没有落脚的地方。芦苇说：飘，是最累的状态。" },
  { q: "《解high人》中「解high人」指什么样的人？", opts: ["破坏气氛的人", "活跃气氛的人", "无所谓", "随便"], ans: 0, exp: "总在大家开心时扫兴的人。芦苇说：解high的人，自己最不快乐。" },
  { q: "《Runaway Mama》中「Runaway Mama」表达了什么？", opts: ["对家庭束缚的反抗", "顺从", "无所谓", "随便"], ans: 0, exp: "妈妈也想逃跑，也想自由。芦苇说：妈妈，也曾经是少女。" },
  { q: "《口的形状》中「口的形状」比喻什么？", opts: ["说话的方式与沟通", "嘴巴", "无所谓", "随便"], ans: 0, exp: "口形不同，说出的话不同。芦苇说：说什么话，长什么口形。" },
  { q: "《脆弱》中「我比你脆弱」表达了什么？", opts: ["承认弱点的勇气", "逞强", "无所谓", "随便"], ans: 0, exp: "承认自己脆弱，需要勇气。芦苇说：脆弱，是最真的样子。" },
  { q: "《一点点》中「一点点 就好」表达了什么？", opts: ["知足的态度", "贪心", "无所谓", "随便"], ans: 0, exp: "只要一点点，就很满足。芦苇说：一点点，就是全部。" },
  { q: "《新预感》中「新预感」表达了什么？", opts: ["对未来的期待与不安", "确定", "无所谓", "随便"], ans: 0, exp: "新预感是说不清的感觉。芦苇说：预感，是最准的直觉。" },
  { q: "《热血无赖》中「热血无赖」表达了什么？", opts: ["又热血又无赖的矛盾", "只有热血", "只有无赖", "无所谓"], ans: 0, exp: "热血和无赖并存，是复杂的人。芦苇说：热血的无赖，最可爱。" },
  { q: "林宥嘉大量使用「小调借用和弦（modal interchange）」，本质带来什么听感？", opts: ["又甜又苦，情绪复杂", "纯粹快乐", "纯粹悲伤", "无情绪"], ans: 0, exp: "和弦背叛了调性，像人背叛了自己。芦苇说：最好的情歌都是借来的和弦。" },
  { q: "林宥嘉的咬字经常落在节拍后半拍（off-beat），造成什么效果？", opts: ["犹豫、有话说不出口", "干净利落", "机械", "太快"], ans: 0, exp: "慢半拍，是怕说出来就错了。芦苇说：林宥嘉的拍子，是心拍的。" },
  { q: "整体上，林宥嘉情歌最核心的「乐理—情感」绑定是什么？", opts: ["用小调/半音/假声表现不完美的真实", "用大调表现快乐", "用快节奏表现热情", "用简单和弦表现直白"], ans: 0, exp: "他不唱英雄，唱躲在角落的人。芦苇说：林宥嘉的歌，是懦夫的情书。" }
],
"张敬轩": [
  { q: "《春秋》前奏钢琴使用哪种音型？", opts: ["重复三连音，像时间滴水", "八度强音", "快速音阶", "随机和弦"], ans: 0, exp: "三连音像水滴石穿的时间。芦苇说：春秋不等人，琴声等。" },
  { q: "《春秋》副歌转调（升半音）的作用？", opts: ["情绪从「遗憾」推向「不甘」", "让歌曲更长", "炫技", "凑巧"], ans: 0, exp: "升调是不甘心就这样了。芦苇说：再高一点，也回不去。" },
  { q: "《春秋》中「我没有为你伤春悲秋」的旋律为何使用大量小二度（半音）？", opts: ["纠结、说不清的情绪", "欢快", "坚定", "愤怒"], ans: 0, exp: "半音像在否认和承认之间反复。芦苇说：半音是嘴硬的声音。" },
  { q: "《樱花树下》弦乐编曲采用了哪类风格？", opts: ["日式唯美+港乐磅礴", "重金属", "爵士大乐队", "无调性"], ans: 0, exp: "像日剧配乐，但更大。芦苇说：樱花落的时候，弦乐最大声。" },
  { q: "《樱花树下》副歌旋律最高音落在哪个字？为什么？", opts: ["「错过」——最痛的词最高", "「樱花」", "「你」", "「我」"], ans: 0, exp: "最高音给「错过」，像喊出来。芦苇说：最高音，是最悔的事。" },
  { q: "《酷爱》副歌使用了哪类节奏型？", opts: ["大量切分与反拍", "均匀四分音符", "慢三拍", "复合拍"], ans: 0, exp: "切分像心跳乱掉。芦苇说：酷爱就是心电图乱了。" },
  { q: "《酷爱》中「只爱到盲」的和弦用了减七和弦，带来什么效果？", opts: ["扭曲、疯狂、爱到不正常", "温暖", "平静", "喜悦"], ans: 0, exp: "减七和弦是「不对劲」。芦苇说：爱到不对劲才是爱。" },
  { q: "《余震》的钢琴编曲为何大量使用低音区持续音？", opts: ["模拟余震的压抑与低频震动", "模拟心跳", "炫技", "填充"], ans: 0, exp: "低音像地震后的闷响。芦苇说：余震不在表面，在底下。" },
  { q: "《余震》副歌旋律走向为什么反复「上不去」？", opts: ["想喊但喊不出，压抑", "轻松", "兴奋", "无所谓"], ans: 0, exp: "音总卡在同一个高音，像被掐住。芦苇说：上不去，是最痛的遗憾。" },
  { q: "《不吐不快》全曲几乎没有重复副歌，这种结构叫什么？", opts: ["通谱体（through-composed）", "二段体", "回旋曲", "变奏曲"], ans: 0, exp: "像一封信，不回头。芦苇说：不重复，是因为说不完。" },
  { q: "《不吐不快》中「任何密友」这一段演唱气息极长，乐理意义是什么？", opts: ["用生理窒息表现情绪窒息", "炫技", "节省时间", "模仿说话"], ans: 0, exp: "气不够用，心也不够用。芦苇说：长句子，是憋了很久的话。" },
  { q: "《青春常驻》前奏用童声合唱，作用是什么？", opts: ["童年与时间的对比", "热闹", "恐怖", "喜庆"], ans: 0, exp: "童声是回不去的自己。芦苇说：童声一响，就哭了。" },
  { q: "《青春常驻》副歌和弦停在Ⅵ级（阻碍终止），效果是什么？", opts: ["不想结束，像拒绝长大", "完美结束", "突然停止", "转调"], ans: 0, exp: "不回家，是不想承认。芦苇说：停在不该停的地方，是赖着不走。" },
  { q: "《缺》的钢琴节奏型大量使用附点，表现什么？", opts: ["脚步不稳、一瘸一拐", "平稳", "飞快", "兴奋"], ans: 0, exp: "附点是「缺了脚的节奏」。芦苇说：缺了点什么，走路都怪。" },
  { q: "《缺》中「缺」字的旋律处理如何？", opts: ["突然下沉，像掉下去", "上扬", "平直", "跳跃"], ans: 0, exp: "掉下去是因为少了支撑。芦苇说：缺了，就站不稳。" },
  { q: "《笑忘书》的节拍是几几拍？情绪效果？", opts: ["6/8拍，摇曳像勉强微笑", "4/4拍工整", "2/4拍急促", "5/4拍怪异"], ans: 0, exp: "摇曳像笑着但站不稳。芦苇说：6/8是摇晃的笑。" },
  { q: "《笑忘书》中「笑着忘记」的旋律使用了上行后突然下行，代表什么？", opts: ["刚想乐观就垮掉", "一直乐观", "一直悲观", "无所谓"], ans: 0, exp: "笑一半就哭了。芦苇说：微笑的弧线，往下掉。" },
  { q: "《追风筝的孩子》前奏木管乐器代表什么？", opts: ["童年、天真", "悲伤", "愤怒", "诡异"], ans: 0, exp: "木管是风里的孩子。芦苇说：木管一吹，就回到小时候。" },
  { q: "《PS I Love You》中使用大量钢琴延音踏板，效果是什么？", opts: ["回忆模糊、重叠、不清晰", "干净利落", "混乱", "干涩"], ans: 0, exp: "延音像回忆叠在一起。芦苇说：踏板是眼泪的延迟。" },
  { q: "《PS I Love You》副歌的跨度（音程大跳）表现什么？", opts: ["想靠近但又不敢", "轻松", "愤怒", "无所谓"], ans: 0, exp: "跳一大步，又缩回来。芦苇说：大跳是犹豫的样子。" },
  { q: "《罗宾》以轻快的Funk节奏写友情，编曲意图？", opts: ["反衬沉重主题", "就是快乐", "随便", "炫技"], ans: 0, exp: "用最快乐的节奏，讲最感谢的人。芦苇说：开心的事，值得开心地唱。" },
  { q: "《不同班同学》最后一段转调，歌词对应什么？", opts: ["大家都老了，时间走了", "更快乐", "更悲伤", "无所谓"], ans: 0, exp: "转调是时间翻页的声音。芦苇说：转一次调，翻一页人生。" },
  { q: "《过客别墅》钢琴以五声音阶为主，代表什么？", opts: ["中国式乡愁", "西方古典", "流行套路", "随意"], ans: 0, exp: "五声是骨子里的东方。芦苇说：五声音阶，是回家的路。" },
  { q: "《骚灵情歌》采用了哪类风格？", opts: ["Soul / R&B 与福音元素", "摇滚", "电子", "民谣"], ans: 0, exp: "骚灵是灵魂的音乐。芦苇说：骚灵就是喉咙里的教堂。" },
  { q: "《骚灵情歌》中使用管风琴音色，为什么？", opts: ["教堂般的圣洁与深情", "恐怖", "古板", "随便"], ans: 0, exp: "管风琴一响，爱就成了信仰。芦苇说：管风琴是爱的身高。" },
  { q: "《我的天》副歌全部使用假声，代表什么？", opts: ["脆弱、无力、像问天", "力量", "愤怒", "无所谓"], ans: 0, exp: "假声是人的渺小。芦苇说：问天的时候，声音是薄的。" },
  { q: "张敬轩在录音中经常保留呼吸声，为什么？", opts: ["真实、脆弱、不修边幅", "修不掉", "风格", "随便"], ans: 0, exp: "呼吸就是还活着。芦苇说：留一口气，留一条命。" },
  { q: "《衬》的弦乐写作方式属于哪一类？", opts: ["复调，多条旋律线交织", "单音齐奏", "纯低音", "无旋律"], ans: 0, exp: "复调是各说各话。芦苇说：弦乐打架，像心里吵架。" },
  { q: "《披星戴月》副歌节奏突然收紧（加速），代表什么？", opts: ["时间不够用的焦虑", "放松", "无所谓", "开心"], ans: 0, exp: "节奏快了，是追不上。芦苇说：披星戴月的人，拍子最急。" },
  { q: "张敬轩常被称为「港乐最后的工匠」，从乐理角度指什么？", opts: ["精微的转调/半音/配器层次", "只会高音", "只会慢歌", "只会炫技"], ans: 0, exp: "他连一个呼吸都算过。芦苇说：工匠，是把每个音当人。" },
  { q: "《春秋》中「隔夜那杯茶」用了什么修辞手法？", opts: ["借代，用剩茶代指过期的感情", "比喻", "拟人", "夸张"], ans: 0, exp: "隔夜茶不能喝，像过了期的感情。芦苇说：隔夜茶，倒掉吧。" },
  { q: "《樱花树下》中「那场恋爱如烟火」用了什么修辞？", opts: ["比喻，爱情的短暂与绚烂", "拟人", "夸张", "排比"], ans: 0, exp: "烟火美但短暂，像樱花树下的爱情。芦苇说：烟火散了，人也散了。" },
  { q: "《酷爱》中「酷」字在粤语里的双重含义是什么？", opts: ["冷酷又热烈，矛盾的酷", "凉爽", "酷炫", "无所谓"], ans: 0, exp: "外表冷酷内心酷热。芦苇说：酷，是冷也是热。" },
  { q: "《余震》中「断了线」的旋律处理是什么？", opts: ["突然下行，像断线坠落", "上行", "平直", "跳跃"], ans: 0, exp: "断线是往下掉，音也是。芦苇说：断了的线，接不上了。" },
  { q: "《不吐不快》歌名有什么深意？", opts: ["不说不快，说出来更不快", "说完了就快", "不说也快", "无所谓"], ans: 0, exp: "说不出口的，才是最痛的。芦苇说：有些话，说不吐不快，吐了更不快。" },
  { q: "《青春常驻》中「叮当」指的是什么？", opts: ["机器猫叮当，童年的符号", "铃声", "名字", "玩具"], ans: 0, exp: "叮当是80后的集体回忆。芦苇说：叮当老了，我们也老了。" },
  { q: "《缺》中「缺」这个字在全曲出现了几次？代表什么？", opts: ["反复出现，像缺点的回响", "一次", "两次", "没有"], ans: 0, exp: "每个缺都在提醒不完整。芦苇说：缺，是最不想说的字。" },
  { q: "《笑忘书》歌名是模仿哪本书？", opts: ["《笑忘录》米兰·昆德拉", "《忏悔录》", "《回忆录》", "《备忘录》"], ans: 0, exp: "笑着忘记是一辈子的课题。芦苇说：笑忘，是笑着哭着都忘不掉。" },
  { q: "《PS I Love You》中的「PS」代表什么？", opts: ["附言，说不出口的补充", "歌手名", "情书", "无所谓"], ans: 0, exp: "PS是信写完了还想说的话。芦苇说：PS，是最说不出口的真话。" },
  { q: "《罗宾》中把朋友比作罗宾（蝙蝠侠助手），表达了什么？", opts: ["朋友是英雄身边的那个", "朋友是主角", "朋友是反派", "无所谓"], ans: 0, exp: "真正的朋友，是愿意做你身边的罗宾。芦苇说：罗宾，是最容易被忘记的英雄。" },
  { q: "《不同班同学》中「不同班」指什么？", opts: ["同龄但不同命运", "不同年龄", "不同班级", "不同学校"], ans: 0, exp: "同岁不同命。芦苇说：同学是一时的，人生是一辈子的。" },
  { q: "《过客别墅》中「别墅」比喻什么？", opts: ["曾经住过但已离开的地方", "豪宅", "梦想", "无所谓"], ans: 0, exp: "每个人都是世界上的过客。芦苇说：别墅，是暂时的家。" },
  { q: "《骚灵情歌》中「骚灵」是什么？", opts: ["soul的音译，灵魂音乐", "骚动的灵魂", "骚味", "无所谓"], ans: 0, exp: "骚灵是灵魂在骚动。芦苇说：骚灵，是心在跳。" },
  { q: "《我的天》中「天」为什么用假声唱？", opts: ["天太高了，假声才能到", "真声也行", "随便", "低音"], ans: 0, exp: "问天的时候，声音是向上的。芦苇说：天的音，是高的。" },
  { q: "张敬轩被称为「轩仔」，这个称呼体现了什么？", opts: ["亲切，像邻家大男孩", "高傲", "冷漠", "无所谓"], ans: 0, exp: "轩仔是粉丝和圈内对他的亲切称呼。芦苇说：轩仔，是大男孩的歌唱。" },
  { q: "《衬》歌名是什么意思？", opts: ["衬托、相衬、般配", "衬衫", "衬里", "衬垫"], ans: 0, exp: "人和人之间，是互相衬托的。芦苇说：衬，是你的影子。" },
  { q: "《披星戴月》中「披星戴月」这个成语用了什么修辞？", opts: ["夸张，形容日夜奔波", "比喻", "拟人", "对偶"], ans: 0, exp: "披星戴月是时间的重量。芦苇说：披星戴月，是追时间的人。" },
  { q: "张敬轩在《歌手》节目中演唱的《酷爱》有什么不同？", opts: ["加长版华彩和高音爆发", "降调", "改词", "改曲"], ans: 0, exp: "竞技舞台上的爆发更震撼。芦苇说：歌手舞台，是轩仔的考场。" },
  { q: "《春秋》的副歌为什么是反问句？", opts: ["反问比陈述更有力量", "陈述也行", "随便", "不知道"], ans: 0, exp: "反问是在问自己，也在问天。芦苇说：反问，是最没底气的肯定。" },
  { q: "《樱花树下》中「树」的旋律为什么低沉？", opts: ["树是稳重的、扎根的", "高音", "中音", "随便"], ans: 0, exp: "树在地上，音也是低的。芦苇说：树的音，是根。" },
  { q: "《余震》的MV和歌名有什么关系？", opts: ["废墟与断壁残垣", "快乐", "喜庆", "浪漫"], ans: 0, exp: "画面像地震后的城市。芦苇说：余震的MV，是心里的废墟。" },
  { q: "《不吐不快》中「不吐不快」的旋律为什么拉长？", opts: ["不说出来就难受，但说出来也难受", "短促", "跳跃", "下行"], ans: 0, exp: "长音是憋着的气。芦苇说：不吐不快，是憋了很久。" },
  { q: "《青春常驻》中「常驻」的旋律为什么不是长音？", opts: ["常驻是愿望，愿望往往不长", "长音", "短促", "跳跃"], ans: 0, exp: "常驻只是愿望，现实是青春不常驻。芦苇说：常驻的音，反而是短的。" },

"潘玮柏": [
  { q: "《快乐崇拜》中，主歌说唱与副歌旋律段落的节奏对比是什么？", opts: ["说唱为密集十六分音符（紧张），副歌为宽松四分/八分（释放）", "完全一样", "说唱慢副歌快", "说唱快副歌更快"], ans: 0, exp: "说唱的密集感像焦虑和压力，副歌打开是放下一切。芦苇说：先碎碎念，再大声唱，是快乐的逻辑。" },
  { q: "《快乐崇拜》副歌「快乐会传染」的旋律走向有什么特点？", opts: ["上行跳进，像扩散、传递", "下行级进", "同音反复", "半音下滑"], ans: 0, exp: "音往上走，像声音传出去，也像心情飞起来。芦苇说：快乐的音，是往上长的。" },
  { q: "《快乐崇拜》中电子合成器与摇滚吉他同时出现，属于哪种编曲思维？", opts: ["融合（Fusion）——电子+摇滚的双重刺激", "单一风格", "复古", "极简"], ans: 0, exp: "电子是未来感，吉他是情绪感。芦苇说：两个加在一起，是嗨到顶点。" },
  { q: "《壁虎漫步》的Groove（律动）核心来源于哪类节奏型？", opts: ["Funk切分+嘻哈反拍", "华尔兹三拍", "波萨诺瓦", "古典进行曲"], ans: 0, exp: "切分是「爬行感」，反拍是「滑步感」。芦苇说：壁虎走路，也是带节奏的。" },
  { q: "《壁虎漫步》中歌词「慢动作」对应的编曲处理是什么？", opts: ["人声加混响/延迟，拉伸时间感", "加快速度", "突然静音", "改用真乐器"], ans: 0, exp: "混响像在空旷空间，延迟像回声。芦苇说：慢动作的时候，声音也会拉长。" },
  { q: "《不得不爱》前奏的分解和弦使用哪种音色？情绪铺垫是什么？", opts: ["原声吉他+钢琴，制造温暖/犹豫", "失真吉他", "电子合成", "管风琴"], ans: 0, exp: "吉他像呼吸前奏，钢琴像心跳。芦苇说：不得不爱的前奏，是深呼吸。" },
  { q: "《不得不爱》副歌男女声对唱中，节奏配合采用了什么技法？", opts: ["卡农式交替（你一句我一句叠加）", "齐唱", "男唱女和", "自由即兴"], ans: 0, exp: "叠在一起像两个人同时说「我离不开你」。芦苇说：卡农是各说各话，但都爱。" },
  { q: "《不得不爱》桥段的转调（升调）出现在哪一句？表达了什么？", opts: ["「天天都需要你爱」——从犹豫到确定", "第一句", "间奏", "尾奏"], ans: 0, exp: "升调是「我不装了，我就是需要你」。芦苇说：音高一级，爱深一丈。" },
  { q: "《反转地球》的BPM（速度）大概在多少？适合什么场景？", opts: ["约100-110 BPM，适合跳跃/头部律动", "60慢歌", "140极快", "80摇摆"], ans: 0, exp: "不快不慢，刚好让你点头。芦苇说：反转地球的节奏，是让世界先摇起来。" },
  { q: "《反转地球》中「用我的旋律 改变世界的温度」使用了什么修辞？", opts: ["通感（旋律→温度）", "比喻", "拟人", "排比"], ans: 0, exp: "旋律不是声音，是温度。芦苇说：好歌是夏天冰可乐，冬天热茶。" },
  { q: "《反转地球》的编曲使用了大量电子合成贝斯（Synth Bass），作用是什么？", opts: ["制造低频冲击感与压迫性节奏", "制造温柔氛围", "模仿原声贝斯", "无意义"], ans: 0, exp: "低频是地壳在动。芦苇说：反转地球，先从脚底开始。" },
  { q: "《谁是MVP》这首歌的节奏型主要借鉴了哪个嘻哈分支？", opts: ["East Coast Boom Bap（重鼓点+采样）", "Trap", "G-Funk", "Jazz Hip Hop"], ans: 0, exp: "大鼓小鼓干净有力，像擂台脚步。芦苇说：MVP的节奏，是拳头。" },
  { q: "《谁是MVP》中歌词「我是MVP」的旋律为何使用下行音阶？", opts: ["自信到不需要喊上去，反而更酷（反高潮）", "不会唱高音", "随意", "模仿失败者"], ans: 0, exp: "真正的王者是低音说的。芦苇说：MVP，不吼。" },
  { q: "《不得不爱》的主和弦进行是哪一种？情绪特点是什么？", opts: ["Ⅵ-Ⅴ-Ⅳ-Ⅲ 下行循环，舍不得前进", "Ⅰ-Ⅳ-Ⅴ 上行", "Ⅱ-Ⅴ-Ⅰ 爵士", "Ⅶ-Ⅰ 小调"], ans: 0, exp: "一直往下但又回来，像原地绕圈。芦苇说：不得不爱，是走不掉。" },
  { q: "潘玮柏在《壁虎漫步》中大量使用「Talk Box」（人声效果器），创造了什么感觉？", opts: ["机械与非人感，像会说话的动物", "自然", "悲伤", "古典"], ans: 0, exp: "Talk Box 像壁虎在说话。芦苇说：非人的声音，最像动物的灵魂。" },
  { q: "《我们都会错》副歌使用大量七和弦（7th chord），带来什么色彩？", opts: ["想解决但解决不了，悬着的心", "完全快乐", "完全悲伤", "平淡"], ans: 0, exp: "七和弦是「我错了但还爱」。芦苇说：不完美的和弦，才像人。" },
  { q: "《我们都会错》中「是爱不是爱」的旋律突然翻高，代表什么？", opts: ["从疑问到自我说服", "平静", "愤怒", "无所谓"], ans: 0, exp: "高音是「我需要相信它是爱」。芦苇说：越不确定，越要唱高。" },
  { q: "《我想更懂你》说唱部分采用哪种节奏切分？用于表达什么关系？", opts: ["密集卡顿，像吵架", "流畅", "缓慢", "均匀"], ans: 0, exp: "断断续续像说话被打断。芦苇说：母子之间，节奏总是乱。" },
  { q: "《我想更懂你》副歌旋律为什么放在中低音区？", opts: ["无奈、疲惫，不是愤怒", "激昂", "愤怒", "兴奋"], ans: 0, exp: "低音是「算了」的叹息。芦苇说：懂一个人，最后往往是沉默。" },
  { q: "《玩酷》的编曲使用大量失真合成器贝斯，目的是什么？", opts: ["制造侵略性与叛逆感", "制造温柔", "浪漫", "怀旧"], ans: 0, exp: "失真是「我不在乎你怎么想」。芦苇说：玩酷的人，声音最脏。" },
  { q: "《来电》前奏使用反向镲片（Reverse Cymbal），效果是什么？", opts: ["倒吸一口气，像惊喜或紧张", "打拍子", "填充", "随意"], ans: 0, exp: "反向镲是「呼吸反了」。芦苇说：来电的时候，气是倒着吸的。" },
  { q: "《双人舞》副歌采用规整的四拍+切分，与舞蹈的关系是什么？", opts: ["一拍一个动作，切分是停顿与旋转", "随意", "摇滚", "慢动作"], ans: 0, exp: "规整是脚步，切分是转身。芦苇说：双人舞的节奏，是两个人的默契。" },
  { q: "《双人舞》中「一步两步三步四步」的旋律反复，模仿了什么？", opts: ["数拍子，也像心跳", "无所谓", "愤怒", "悲伤"], ans: 0, exp: "数到第四拍，就是下一步。芦苇说：数拍子，也是在数心跳。" },
  { q: "《忘记拥抱》使用大量钢琴延音，效果是什么？", opts: ["记忆模糊、情感滞留", "清晰", "干涩", "愤怒"], ans: 0, exp: "延音是忘不掉。芦苇说：钢琴的尾巴，是忘不掉的你。" },
  { q: "《忘记拥抱》副歌旋律的最高音落在哪个字？为什么？", opts: ["「忘记」——最高最痛", "「拥抱」", "「爱」", "「你」"], ans: 0, exp: "忘记是最需要力量的事。芦苇说：最高音，送给最难的事。" },
  { q: "潘玮柏的歌曲经常将「中文说唱」与「旋律副歌」交替，这种结构叫什么？", opts: ["Rap + Melodic Chorus（嘻哈流行结构）", "古典奏鸣曲", "变奏曲", "无结构"], ans: 0, exp: "说唱是「说出来的痛」，副歌是「唱出来的释怀」。芦苇说：先说话，再唱歌，是成长。" },
  { q: "潘玮柏的许多快歌使用「四小节循环编曲」，目的是什么？", opts: ["制造律动稳定感和舞池惯性", "复杂化", "古典传统", "随机"], ans: 0, exp: "循环是让人不用思考就能动。芦苇说：好舞曲，是身体自动反应。" },

  { q: "整体上，潘玮柏的节奏感核心是什么？", opts: ["嘻哈的骨 + 流行的肉 + 舞曲的脚", "只有嘻哈", "只有舞曲", "只有流行"], ans: 0, exp: "骨是节奏，肉是旋律，脚是律动。芦苇说：潘玮柏的歌，是身体先听懂。" },
  { q: "《快乐崇拜》中「忘记了姓名的请跟我来」的旋律走向是什么？", opts: ["上行大跳，像呼喊", "下行", "平直", "同音"], ans: 0, exp: "大跳像在人群里喊人。芦苇说：快乐，是需要召唤的。" },
  { q: "《壁虎漫步》中「我是壁虎，在漫步」的节奏为什么是切分的？", opts: ["壁虎走路是断断续续的", "连续", "快速", "慢速"], ans: 0, exp: "切分像壁虎的停顿。芦苇说：壁虎的脚，是断的。" },
  { q: "《不得不爱》中「天天都需要你爱」的「天天」为什么重复？", opts: ["强调每一天，一天都不能少", "凑字数", "押韵", "随意"], ans: 0, exp: "天天是每一天，是必须。芦苇说：天天的音，是重复的。" },
  { q: "《反转地球》中「舌头是刷子」用了什么修辞？", opts: ["比喻，舌头像刷子刷节奏", "拟人", "夸张", "排比"], ans: 0, exp: "舌头刷出节奏。芦苇说：舌头是最小的刷子。" },
  { q: "《谁是MVP》中「MVP」的旋律为什么短促有力？", opts: ["MVP是快准狠的", "长音", "平直", "下行"], ans: 0, exp: "MVP的音，是短的。芦苇说：MVP，不拖泥带水。" },

        { q: "《怎么了》中「怎么了」重复三次，这种技法叫什么？为什么能让人记住？", opts: ["反复/迭词，制造洗脑记忆点", "排比", "顶真", "对偶"], ans: 0, exp: "重复是下沉市场最有效的记忆术。一句话说三遍，听一遍就忘不掉。", insight: "芦苇心得：下沉用户听歌不是「品味」，是「陪伴」。他们不需要复杂的隐喻，需要的是「有人替我说了我想说的话，还说了三遍」。重复不是啰嗦，是给情绪一个回声。当你在深夜的车里听到「怎么了怎么了怎么了」，你不是在听歌，你是在听自己心里的回声。", luwei: "芦苇说：写词不是写诗，是写进耳朵里。" },
        { q: "「赐我一场相爱」这句歌词为什么比「给我爱情」更有传播力？", opts: ["「赐我」有祈求感，卑微更能共情", "字数少", "押韵", "有英文"], ans: 0, exp: "「赐我」是向上天求，不是向人要。卑微感让听者自动代入「我也求过」。", insight: "芦苇心得：下沉歌词的第一定律——「我求过」。城市情歌写「我们相爱」，下沉苦情歌写「求求你爱我」。一个站着，一个跪着。跪着的歌，更容易让跪着生活的人共鸣。他们不是不想站着爱，是生活已经让他们跪久了。", luwei: "芦苇说：求来的爱，最像自己的故事。" },
        { q: "「旧梦一场」四个字，如果换成「旧梦已碎」，哪个更好？为什么？", opts: ["「一场」比「已碎」更轻，轻才痛。太重反而假。", "「已碎」更好", "一样", "都不好"], ans: 0, exp: "下沉歌词的秘诀：痛不能说痛，要轻描淡写。", insight: "芦苇心得：这是下沉创作最反直觉的一条——越痛的事，越要轻说。你哭得稀里哗啦的时候，别人觉得你矫情。你笑一下说「没事」，别人反而心疼。「旧梦一场」是笑着说的，「旧梦已碎」是哭着喊的。谁更痛？", luwei: "芦苇说：最痛的话，要笑着说。" },
        { q: "「穷极一生到天涯」中，「穷极」为什么比「用尽」好？", opts: ["「穷极」更书面，有古风感，拉高情绪档次", "「用尽」更好", "一样", "无所谓"], ans: 0, exp: "下沉不等于土。加一点书面词，让苦情有「悲壮感」。", insight: "芦苇心得：下沉市场最怕被说「土」。他们想要高级，但高级不是复杂，是「陌生又熟悉」。「穷极」比「用尽」高级一档，但谁都听得懂。这是分寸。太熟了没劲，太生了听不懂。刚刚好，是下沉创作的命门。", luwei: "芦苇说：穷，是最体面的穷。" },
        { q: "「忘川的河」这个歌名，如果改成「忘川河」，哪个更好？为什么？", opts: ["「忘川的河」有停顿，像在说：忘川…那条河", "「忘川河」更好", "一样", "无所谓"], ans: 0, exp: "加一个「的」，节奏就慢了。慢下来才有画面感。", insight: "芦苇心得：歌名的节奏，就是听者进入情绪的速度。「忘川河」三个字一口气读完，像新闻标题。「忘川的河」多了一个停顿，像有人在你耳边说——忘川…有一条河。你脑子里就开始有画面了。一个好歌名，是一个邀请，不是一个通知。", luwei: "芦苇说：歌名要像说话，不是报站名。" },
        { q: "「渡我不渡她」中，「我」和「她」的顺序为什么不能换？", opts: ["先「我」后「她」，「我」是主语，代入感强", "可以换", "无所谓", "都行"], ans: 0, exp: "先说自己，再提别人。听者先代入「我」，再心疼「我」。", insight: "芦苇心得：下沉歌词的叙事逻辑永远是「我」第一。不是「她走了」，是「她走了，我怎么办」。不是「爱错了」，是「我愛錯了」。听众不关心那个「她」，听众只关心那个「我」。因为那个「我」就是他们自己。", luwei: "芦苇说：先说自己，别人才会心疼你。" },
        { q: "「情难断」三个字，如果写成「情断难」，情绪有什么变化？", opts: ["「情难断」是无奈，「情断难」是结果，无奈更虐", "一样", "都不好", "无所谓"], ans: 0, exp: "下沉歌词的黄金句法：动词+难+动词。", insight: "芦苇心得：「难」字是下沉苦情歌的万能药。断不了、忘不掉、回不去、放不下。这些「不+动词」是反抗，「动词+难」是认命。反抗是青春，认命是下沉。下沉的人，已经认了，只是还在难受。", luwei: "芦苇说：难字，是下沉的魂。" },
        { q: "「奈何岁月」中，「奈何」为什么比「可是」好？", opts: ["「奈何」是古风词，有宿命感；「可是」太日常，没劲", "「可是」更好", "一样", "无所谓"], ans: 0, exp: "下沉不等于低端。古风词能拉高情绪档次。", insight: "芦苇心得：下沉用户不想要「低端的自己」，他们想要「高级的自己」在受苦。「奈何」比「可是」高级，但谁都知道什么意思。这是给他们一个体面的身份——我不是在抱怨，我是在感慨命运。", luwei: "芦苇说：奈何，是最好的借口。" },
        { q: "为什么「赐我一场相爱」这类歌词在抖音15秒就能爆？", opts: ["副歌第一句就是情绪顶点，不用铺垫", "歌词长", "节奏快", "编曲复杂"], ans: 0, exp: "抖音的逻辑：3秒抓耳，5秒入戏，15秒高潮。前奏不要，直接上高潮。", insight: "芦苇心得：我们活在一个没有耐心的时代。用户刷到一条视频，前3秒不抓住，就划走了。所以下沉歌曲的前奏越来越短，副歌越来越靠前。不是创作者不想铺垫，是用户不给时间。适应媒介，是生存法则。", luwei: "芦苇说：短视频时代，前奏是奢侈品。" },
        { q: "洋澜一的歌为什么被称为「车载emo神曲」？", opts: ["中低频饱满，高速行驶不刺耳+情绪直给", "高音多", "鼓点重", "说唱多"], ans: 0, exp: "开车听歌的场景：不能太吵，不能太静，刚好在「想哭但没哭」的区间。", insight: "芦苇心得：场景决定一切。高速上，风声、胎噪、引擎声。一首歌如果太静，听不见；太吵，耳朵累。洋澜一的歌正好卡在那个「刚好听得见」的声压里。而且，深夜高速上，一个人，眼泪可以不被看见。这是最安全的哭法。", luwei: "芦苇说：车载，是给眼泪找借口。" },
        { q: "下沉苦情歌的用户主要是谁？他们的心理需求是什么？", opts: ["小镇青年、打工者、卡车司机；需要被理解、被看见", "都市白领", "学生", "老年人"], ans: 0, exp: "他们的生活没有诗，但需要有歌唱。", insight: "芦苇心得：写下沉歌曲，第一件事不是打开音乐软件，是打开地图——看看那些没有星巴克、没有Livehouse的地方，人们怎么活。他们的喜怒哀乐，也需要被表达。主流乐坛不写他们，他们自己写。下沉不是降级，是另一种真实。", luwei: "芦苇说：下沉不是降级，是另一种真实。" },
        { q: "为什么翻唱版比原版更容易在短视频火？", opts: ["翻唱版更慢、更碎、更气声，情绪更浓", "原版更好", "一样", "无所谓"], ans: 0, exp: "原版是「唱」，翻唱是「说」。说比唱更容易让人「对号入座」。", insight: "芦苇心得：原版是「作品」，翻唱是「情绪」。听原版你听的是歌手，听翻唱你听的是自己。下沉翻唱不是炫技，是降维——把唱改成说，把技巧改成气声，把表演改成分享。每一个气声，都是「我也有过这种时候」。", luwei: "芦苇说：翻唱不是抄，是重新哭一次。" },
        { q: "洋澜一的歌大多是什么调式？为什么？", opts: ["小调，小调自带悲伤底色", "大调", "五声", "布鲁斯"], ans: 0, exp: "小调一响，心就沉了。听前三个音就知道要哭。", insight: "芦苇心得：大调是白天的歌，小调是凌晨的歌。下沉用户听歌的时间，大多是深夜、独处、疲惫时。小调不是选择，是本能。你不需要告诉听众「这首歌很悲伤」，小调自己会说话。", luwei: "芦苇说：小调，是苦情歌的身份证。" },
        { q: "为什么下沉苦情歌的BPM大多在70-80之间？", opts: ["慢下来才有时间想那个人", "快歌没人听", "随便定的", "没原因"], ans: 0, exp: "70-80是心跳偏慢的速度，接近「失落时的心率」。", insight: "芦苇心得：人激动的时候心跳100+，平静的时候60+。失落的时候，心跳在70-80之间，不上不下，像卡在胸腔里。下沉苦情歌的BPM，不是编曲选的，是心跳选的。你听着歌，心率被同步，然后眼泪就来了。", luwei: "芦苇说：节奏慢了，心才能掉进去。" },
        { q: "「你还在心上」这句，怎么改能更走心？", opts: ["「你还在心上，只是不敢碰了」加一个动作", "不需要改", "删掉", "换词"], ans: 0, exp: "走心要加「动作」。「在心上」是状态，「不敢碰」是动作。", insight: "芦苇心得：人更容易记住动作，而不是状态。「他走了」没有力量，「他关上门，钥匙留在桌上」有画面。走心不是写心情，是写动作。心情是结果，动作是原因。给一个动作，听众自己会脑补心情。", luwei: "芦苇说：走心不是写心情，是写动作。" },
        { q: "「故事还长」这句，为什么比「还没结束」好？", opts: ["「故事」有画面感，「还长」有期待感", "「还没结束」更好", "一样", "都差"], ans: 0, exp: "故事让人联想两个人，「还长」让人想等。", insight: "芦苇心得：下沉金句的秘诀——「让听众自己填空」。「还没结束」是陈述句，关上了门。「故事还长」是邀请，留了缝隙。听众会自己问：什么故事？和谁？后来呢？好的句子不给答案，只给问题。", luwei: "芦苇说：好歌词让人自己填空。" },
        { q: "写一首苦情歌，第一句应该怎么写？", opts: ["直接写「我」+「一个动作」，比如「我走在街角」", "写风景", "写时间", "写天气"], ans: 0, exp: "第一句要让听者「进去」。先写「我」在做什么，比写天气快10倍代入。", insight: "芦苇心得：听众只有一个问题——「这跟我有什么关系？」。写风景、写时间、写天气，都在绕路。直接写「我」在做什么，听众一秒代入。因为所有人都有「我」，都有「动作」。第一句就让人进去，后面才好哭。", luwei: "芦苇说：第一句，要让读者当主角。" },
        { q: "「奈何岁月」中，如果让你加一句更走心的，你会加什么？", opts: ["「奈何岁月，偷走了你的名字」", "「奈何岁月，我好累」", "「奈何岁月，别走」", "不加"], ans: 0, exp: "「偷走了名字」比「偷走了你」更虐。名字是最小的单位，丢了就找不回来了。", insight: "芦苇心得：走心的最高级，是「用小东西说大事」。不要说「我失去了一切」，说「抽屉里的照片发黄了」。不要说「我好想你」，说「你的牙刷还在杯子里」。越小越具体，越具体越痛。", luwei: "芦苇说：最小的东西丢了，最痛。" },
        { q: "「三生三幸」这个歌名，如果改成「三生有幸」，哪个更好？", opts: ["「三生三幸」是编的，有陌生感；「三生有幸」太熟", "「三生有幸」更好", "一样", "都差"], ans: 0, exp: "下沉歌词要「熟中生新」。改一个字，熟悉里带陌生，才记得住。", insight: "芦苇心得：太熟的词，像白开水，喝了没感觉。太生的词，像石头，咽不下去。好词是「熟悉的陌生人」——你好像听过，但又不太一样。三生有幸是成语，三生三幸是创造成语。听众会觉得新鲜，又不需要重新学习。", luwei: "芦苇说：好歌名，是熟悉的陌生人。" },
        { q: "「孤单的人」这个标题，怎么改能更吸引点击？", opts: ["「凌晨三点的孤单」加时间", "不用改", "删掉", "换词"], ans: 0, exp: "加一个「具体时间」或「具体地点」，画面感翻倍。", insight: "芦苇心得：抽象的词是地图，具体的词是导航。孤单是地图上的点，凌晨三点是导航路线。听众不需要被告诉「你孤单」，他们需要被告诉「你什么时候孤单」。时间+地点+动作，是下沉重磅炸弹。", luwei: "芦苇说：孤单不是形容词，是凌晨三点。" },
        { q: "原词「爱过就够了」，芦苇会怎么改？", opts: ["「爱过就够了，够我回忆一辈子」加后果", "不改", "删掉", "换词"], ans: 0, exp: "「够了」没力量，「够我回忆一辈子」才有重量。", insight: "芦苇心得：下沉歌词要给后果。不能说「我很难受」，要说「我三天没吃饭」。不能说「我舍不得」，要说「我把聊天记录看了100遍」。后果越具体，痛感越真实。", luwei: "芦苇说：好词要给后果。" },
        { q: "原词「我还是想你」，芦苇会怎么改？", opts: ["「我还是想你，在每个凌晨三点」加时间", "不改", "删掉", "换词"], ans: 0, exp: "凌晨三点是全世界最孤独的时刻。加一个时间点，所有人都能「看到」。", insight: "芦苇心得：时间是最好的情绪放大器。凌晨三点、下雨天、冬天第一场雪——这些时间自带情绪。你不需要写「我很孤单」，只需要写「凌晨三点，下雨了」。听众会自动补全剩下的。", luwei: "芦苇说：想你不是动词，是凌晨三点。" },
        { q: "原词「我们回不去了」，芦苇会怎么改？", opts: ["「我们回不去了，连那条路都拆了」加具象", "不改", "删掉", "换词"], ans: 0, exp: "路都拆了，连回去的机会都没有。", insight: "芦苇心得：抽象的词，要用具体的东西砸碎。「回不去了」是窗户纸，一捅就破。「连那条路都拆了」是墙，撞上去会痛。用具象砸抽象，砸得越碎，听众心越疼。", luwei: "芦苇说：抽象的词，要用具体的东西砸碎。" },
        { q: "原词「祝你幸福」，芦苇会怎么改？", opts: ["「祝你幸福，只是别说我也来过」加一句卑微", "不改", "删掉", "换词"], ans: 0, exp: "「别说我来过」是最后的体面，也是最后的放不下。", insight: "芦苇心得：祝福里带刺，才像真的。纯粹的祝福是圣人，卑微的祝福是人。加一句「别说我来过」，是祝福也是请求，是体面也是卑微。听众听完，心里会咯噔一下——那就是「下沉」的瞬间。", luwei: "芦苇说：祝福里带刺，才像真的。" },
        { q: "原词「我一个人」，芦苇会怎么改？", opts: ["「我一个人，把双人床睡成了单人间」加画面", "不改", "删掉", "换词"], ans: 0, exp: "双人床变成单人间，一张床就是一部剧。", insight: "芦苇心得：一个好画面，胜过一百个形容词。不要说「我失去了你」，说「双人床空了一半」。不要说「我习惯了孤独」，说「我把双人床睡成了单人间」。画面是钩子，钩住听众的眼，才能钩住听众的心。", luwei: "芦苇说：一个好画面，胜过一百个形容词。" },
        { q: "下沉苦情歌的歌词，最高频的10个字是哪些？", opts: ["我、你、爱、忘、心、痛、梦、泪、风、月", "好、的、了、吗", "天、地、人、和", "是、不、也、都"], ans: 0, exp: "这些是「情绪词」，不是「信息词」。下沉歌词不说事，只说情绪。", insight: "芦苇心得：下沉歌词不叙事。它们不告诉你「发生了什么」，只告诉你「我怎么了」。因为发生了什么不重要，重要的是情绪。听众不想知道你被谁甩了，他们想知道你有多痛。痛是通用的，故事不是。", luwei: "芦苇说：苦情歌不说发生了什么，只说你怎么了。" },
        { q: "为什么下沉苦情歌喜欢用「前世今生」「忘川」「渡」这类词？", opts: ["把普通失恋「古风化」，显得命该如此，不是自己不行", "显得高级", "押韵", "好听"], ans: 0, exp: "普通人说不出的「命」，用古风词替他说。", insight: "芦苇心得：人最难承认的是「我搞砸了」。把失恋归结为「命」，比归结为「我不好」更容易接受。古风词是给「命」一个名字。不是我不行，是前世欠的；不是我不好，是忘川的水太冷。", luwei: "芦苇说：古风不是古，是给苦找一个理由。" },
        { q: "写一句能火的下沉歌词，有公式吗？", opts: ["「我」+「动作」+「结果」，例：我放开了手，弄丢了整个宇宙", "有", "没有", "不知道"], ans: 0, exp: "公式：我是主语，动作是画面，结果是夸张。", insight: "芦苇心得：我放开了手（小动作），弄丢了整个宇宙（大结果）。把小事夸大，是下沉的母题。因为下沉用户的人生里，小事就是大事。失业是塌天，分手是世界的末日。不是他们夸张，是他们只有这些。", luwei: "芦苇说：下沉金句 = 我做了个小事，世界塌了。" },
        { q: "下沉苦情歌和主流苦情歌最大的区别是什么？", opts: ["下沉更直给，不铺垫；主流更含蓄，要细品", "下沉更好", "主流更好", "没区别"], ans: 0, exp: "下沉是「第一句就哭」，主流是「听完才哭」。场景不同，写法不同。", insight: "芦苇心得：不是下沉写不好，是写给等不及的人。主流用户愿意花4分钟听一个故事，下沉用户只有15秒。没有高低，只有不同。", luwei: "芦苇说：下沉不是写不好，是写给等不及的人。" },

// 下沉分类配置
const sinkCategories = [
    { name: " 短视频新生代女歌手", artists: ["洋澜一"] },
    { name: "️ 短视频新生代男歌手", artists: ["王琪", "大欢", "马健涛"] },
    { name: " 彩铃时代老牌男歌手", artists: ["郑源", "欢子", "冷漠", "六哲", "高安", "姜玉阳"] },
    { name: " 下沉古风赛道歌手", artists: ["等什么君", "阿yueyue", "平生不晚", "M哥"] }
];
let currentSinkCategory = null;
let currentSinkArtist = null;
let sinkStreak = 0;
let sinkQuestions = [];
let sinkIdx = 0;
// 构建下沉分类UI
function buildSinkUI() {
    const container = document.getElementById("sinkCategoryList");
    if (!container) return;
    sinkCategories.forEach(cat => {
        const catBtn = document.createElement("button");
        catBtn.className = "category-btn";
        catBtn.innerText = cat.name;
        catBtn.onclick = () => loadSinkCategory(cat);
        container.appendChild(catBtn);
    });
}
// 加载分类下的歌手列表
function loadSinkCategory(category) {
    currentSinkCategory = category;
    const panel = document.getElementById("sinkQuizPanel");
    let artistsHtml = `<div style="color:#F2C94C; margin-bottom:12px"> ${category.name}</div>`;
    artistsHtml += `<div class="artist-grid" id="sinkArtistGrid"></div>`;
    panel.innerHTML = artistsHtml;
    const grid = document.getElementById("sinkArtistGrid");
    category.artists.forEach(artist => {
        const btn = document.createElement("button");
        btn.className = "artist-btn";
        btn.innerText = artist;
        btn.onclick = () => loadSinkArtist(artist);
        grid.appendChild(btn);
    });
}
// 加载歌手题库
function loadSinkArtist(artist) {
    if (!sinkCreatorBank[artist]) {
        document.getElementById("sinkQuizPanel").innerHTML = `<div class="feedback">✨ 《${artist}》题库创作中，敬请期待～</div>`;
        return;
    }
    currentSinkArtist = artist;
    sinkStreak = 0;
    sinkIdx = 0;
    sinkQuestions = [...sinkCreatorBank[artist]].sort(() => 0.5 - Math.random()).slice(0, 5);
    const panel = document.getElementById("sinkQuizPanel");
    panel.innerHTML = `
        <div style="color:#F2C94C; margin-bottom:8px">️ ${artist} · 芦苇创作课（连续答对5题得勋章）</div>
        <div id="sinkQ"></div>
        <div id="sinkFeed" class="feedback"></div>
    `;
    nextSinkQuestion();
}
function nextSinkQuestion() {
    if (sinkStreak >= sinkQuestions.length) {
        document.getElementById("sinkFeed").innerHTML = " 获得「下沉词人」勋章！";
        addScore(50, `通关下沉创作课：${currentSinkArtist}`);
        return;
    }
    const q = sinkQuestions[sinkStreak];
    document.getElementById("sinkQ").innerHTML = `
        <div class="lyric-question">${q.q}</div>
        <div class="lyric-options" id="sinkOpts"></div>
        <div id="sinkInsight" style="margin-top:12px; padding:12px; background:rgba(255,255,255,0.05); border-radius:16px; font-size:0.75rem; color:#C8E6C9; display:none;"></div>
    `;
    const optsDiv = document.getElementById("sinkOpts");
    optsDiv.innerHTML = "";
    q.opts.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "lyric-opt-btn";
        btn.innerText = opt;
        btn.onclick = () => {
            if (i === q.ans) {
                sinkStreak++;
                const insightDiv = document.getElementById("sinkInsight");
                insightDiv.style.display = "block";
                insightDiv.innerHTML = `<div style="margin-bottom:6px;">✅ 正确！${sinkStreak}/${sinkQuestions.length}</div>
                                        <div style="color:#FFD966; margin-bottom:6px;"> ${q.insight || "芦苇心得："}</div>
                                        <div style="font-style:italic; color:#D9C9B5;"> ${q.luwei || "芦苇说：用心写词，用情动人。"}</div>`;
                addScore(5, `${currentSinkArtist}创作课答题正确`);
                nextSinkQuestion();
            } else {
                sinkStreak = 0;
                sinkIdx = 0;
                sinkQuestions = [...sinkCreatorBank[currentSinkArtist]].sort(() => 0.5 - Math.random()).slice(0, 5);
                const insightDiv = document.getElementById("sinkInsight");
                insightDiv.style.display = "block";
                insightDiv.innerHTML = `<div style="margin-bottom:6px;">❌ 错误！正确答案：${q.opts[q.ans]}</div>
                                        <div>${q.exp}</div>
                                        <div style="margin-top:8px; color:#FFD966;"> ${q.insight || "芦苇心得："}</div>
                                        <div style="font-style:italic; color:#D9C9B5;"> ${q.luwei || "芦苇说：用心写词，用情动人。"}</div>`;
                setTimeout(() => nextSinkQuestion(), 2000);
            }
        };
        optsDiv.appendChild(btn);
    });
}
// 初始化下沉板块UI
buildSinkUI();
