<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创作工坊 · 和弦模板库 | 芦苇音乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #1a3a2a 0%, #0e2a1f 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e8e9f0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #FFD966, #E69A2E);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #AAD4B0;
            font-size: 0.9rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: #0f281dcc;
            border-radius: 60px;
            padding: 12px 20px;
            margin-bottom: 24px;
            border: 1px solid #F2C94C;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stat {
            background: #2a4a3a;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
        }

        .stat span {
            color: #FFD966;
            font-weight: bold;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }

        .filter-group {
            background: #0f281dcc;
            border-radius: 40px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #F2C94C;
        }

        .filter-group label {
            font-size: 0.75rem;
            color: #AAD4B0;
        }

        select, input {
            background: #2a4a3a;
            border: 1px solid #F2C94C;
            border-radius: 30px;
            padding: 6px 12px;
            color: #F5ECD7;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
        }

        .search-input {
            width: 200px;
        }

        .reset-btn {
            background: rgba(230, 154, 46, 0.2);
            border: 1px solid rgba(230, 154, 46, 0.4);
            border-radius: 30px;
            padding: 6px 16px;
            color: #FFD966;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #E69A2E;
            color: #2D1E0C;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 20px;
            background: #0f281dcc;
            border: 1px solid #F2C94C;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        th {
            background: rgba(15, 40, 29, 0.9);
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            color: #FFD966;
            position: sticky;
            top: 0;
            cursor: pointer;
            border-bottom: 1px solid #F2C94C;
        }

        th:hover {
            background: #2a4a3a;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(242, 201, 76, 0.1);
            vertical-align: top;
        }

        tr:hover {
            background: rgba(31, 62, 46, 0.5);
        }

        .emotion-tag {
            display: inline-block;
            background: rgba(100, 150, 120, 0.3);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #C8E6C9;
        }

        .progress {
            color: #AAD4B0;
            font-size: 0.75rem;
            margin-top: 20px;
            text-align: center;
            padding: 15px;
        }

        /* 和弦速查侧边栏 */
        .chord-lookup-overlay {
            position: fixed;
            top: 0;
            right: -450px;
            width: 450px;
            height: 100vh;
            background: #0f281dcc;
            backdrop-filter: blur(10px);
            border-left: 2px solid #F2C94C;
            z-index: 10000;
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 20px;
            box-shadow: -5px 0 20px rgba(0,0,0,0.3);
        }

        .chord-lookup-overlay.open {
            right: 0;
        }

        .chord-lookup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #F2C94C;
        }

        .chord-lookup-header h3 {
            color: #FFD966;
            font-size: 1.2rem;
        }

        .chord-lookup-close {
            background: none;
            border: none;
            color: #FFD966;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .root-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(242,201,76,0.3);
        }

        .root-btn {
            background: rgba(60, 110, 74, 0.6);
            border: 1px solid rgba(242,201,76,0.3);
            border-radius: 30px;
            padding: 6px 14px;
            color: #C8E6C9;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .root-btn:hover, .root-btn.active {
            background: #E69A2E;
            color: #2D1E0C;
            border-color: #E69A2E;
        }

        .chord-list {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .chord-category {
            margin-bottom: 20px;
        }

        .chord-category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            margin-bottom: 12px;
        }

        .chord-category-title {
            color: #E69A2E;
            font-size: 0.85rem;
            font-weight: bold;
            padding-left: 8px;
            border-left: 3px solid #E69A2E;
        }

        .collapse-icon {
            color: #E69A2E;
            font-size: 0.7rem;
            background: rgba(230,154,46,0.2);
            padding: 2px 8px;
            border-radius: 20px;
            transition: transform 0.2s;
        }

        .collapse-icon.collapsed {
            transform: rotate(-90deg);
        }

        .chord-category-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .chord-category-content.collapsed {
            max-height: 0;
        }

        .chord-item {
            background: rgba(31, 62, 46, 0.6);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chord-name {
            color: #FFD966;
            font-weight: bold;
            font-family: monospace;
            min-width: 70px;
        }

        .chord-notes {
            color: #C8E6C9;
            font-family: monospace;
            flex: 1;
        }

        .chord-formula {
            color: #AAD4B0;
            font-size: 0.6rem;
            font-family: monospace;
        }

        @media (max-width: 768px) {
            th, td {
                font-size: 0.7rem;
                padding: 8px;
            }
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                justify-content: space-between;
            }
            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<script src="checkAuth.js"></script>
<div class="container">
    <div class="header">
        <h1>🎵 创作工坊 · 和弦模板库</h1>
        <p>85条经典和弦进行 · 可筛选 · 可搜索 · 乐理详解 · 芦苇说</p>

    </div>

    <div class="filters">
        <div class="filter-group">
            <label>🎭 情绪筛选</label>
            <select id="emotionFilter">
                <option value="all">全部情绪</option>

                <option value="灵动优雅">灵动优雅</option>
                <option value="独立孤独">独立孤独</option>
                <option value="力量叛逆">力量叛逆</option>
                <option value="华丽期待">华丽期待</option>
                <option value="解决圆满">解决圆满</option>
            </select>
        </div>
        <div class="filter-group">
            <label>📂 分类</label>
            <select id="categoryFilter">
                <option value="all">全部分类</option>
                <option value="流行抒情">🎵 流行抒情</option>
                <option value="伤感_emo">😢 伤感/emo</option>
                <option value="民谣_清新">🎸 民谣/清新</option>
                <option value="爵士_R_B">🎷 爵士/R&B</option>
                <option value="独立民谣">🏔️ 独立民谣</option>
                <option value="布鲁斯_摇滚">🔥 布鲁斯/摇滚</option>
                <option value="离调_过渡">✨ 离调/过渡</option>
                <option value="经典终止式">🏁 经典终止式</option>
            </select>
        </div>
        <div class="filter-group">
            <label>🔍 搜索</label>
            <input type="text" id="searchInput" class="search-input" placeholder="搜索名称、进行、歌曲...">
        </div>
        <button class="reset-btn" id="resetBtn">重置筛选</button>
        <button class="reset-btn" id="chordLookupBtn" style="background:#E69A2E; color:#2D1E0C;">🎵 和弦构成音速查</button>
    </div>

    <div class="table-container">
        <table id="chordTable">
            <thead>
                <tr>
                    <th data-sort="id">编号</th>
                    <th data-sort="name">模板名称</th>
                    <th>和弦进行（C大调示例）</th>
                    <th>乐理原理 / 芦苇说</th>
                    <th data-sort="emotion">情绪</th>
                    <th>参考歌曲</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align:center; padding:40px;">加载中... 🎵</td></tr>
            </tbody>
        </table>
    </div>
    <div class="progress" id="progressInfo"></div>
</div>

        { id: "CL-02", 名称: "文艺复兴终止式", 进行: "4 — 5 — 3m — 6m — 2m — 5 — 1", 示例: "F — G — Em — Am — Dm — G — C", 乐理: "卡农进行。", 情绪: "圆满、治愈", 歌曲: "《卡农》", 芦苇说: "卡农是治愈。" },

        { id: "CL-05", 名称: "假终止式", 进行: "5 — 6m", 示例: "G — Am", 乐理: "预期到1，却到6m。", 情绪: "意外、温柔", 歌曲: "《Yesterday》The Beatles", 芦苇说: "假终止是骗你眼泪。" },
        { id: "CL-06", 名称: "流行终止式2", 进行: "4 — 5 — 1", 示例: "F — G — C", 乐理: "最基础的终止式。", 情绪: "明亮、圆满", 歌曲: "无数流行歌", 芦苇说: "4-5-1是句号。" }

};

// ==================== 渲染表格功能 ====================
let allItems = [];

function loadData() {
    allItems = [];
    for (const [cat, items] of Object.entries(chordData)) {
        items.forEach(item => {
            allItems.push({ ...item, category: cat });
        });
    }
    updateStats();
    renderTable();
}

function updateStats() {
    const total = allItems.length;
    document.getElementById("totalCount").innerText = total;
    document.getElementById("countPL").innerText = allItems.filter(i => i.category === "流行抒情").length;
    document.getElementById("countEM").innerText = allItems.filter(i => i.category === "伤感_emo").length;
    document.getElementById("countFL").innerText = allItems.filter(i => i.category === "民谣_清新").length;
    document.getElementById("countJZ").innerText = allItems.filter(i => i.category === "爵士_R_B").length;
    document.getElementById("countID").innerText = allItems.filter(i => i.category === "独立民谣").length;
    document.getElementById("countBR").innerText = allItems.filter(i => i.category === "布鲁斯_摇滚").length;
    document.getElementById("countMD").innerText = allItems.filter(i => i.category === "离调_过渡").length;
    document.getElementById("countCL").innerText = allItems.filter(i => i.category === "经典终止式").length;
    document.getElementById("progressInfo").innerHTML = `🎵 共 ${total} 条和弦模板 | 芦苇创作工坊 · 持续更新中`;
}

function renderTable() {
    const emotionFilter = document.getElementById("emotionFilter").value;
    const categoryFilter = document.getElementById("categoryFilter").value;
    const searchTerm = document.getElementById("searchInput").value.toLowerCase();

    let filtered = allItems.filter(item => {
        if (categoryFilter !== "all" && item.category !== categoryFilter) return false;
        if (emotionFilter !== "all" && !item.情绪.includes(emotionFilter)) return false;
        if (searchTerm) {
            const searchFields = [item.名称, item.进行, item.歌曲, item.芦苇说].join(" ").toLowerCase();
            if (!searchFields.includes(searchTerm)) return false;
        }
        return true;
    });

    const tbody = document.getElementById("tableBody");
    if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px;">🎵 没有找到匹配的模板，试试其他筛选条件 ~</td></tr>`;
        return;
    }

    tbody.innerHTML = filtered.map(item => `
        <tr>
            <td style="white-space: nowrap;">${item.id}</td>
            <td style="font-weight: 500;">${item.名称}</td>
            <td style="font-family: monospace;">${item.进行}<br><span style="font-size:0.65rem; color:#8f9eb0;">${item.示例 || ""}</span></td>
            <td style="max-width: 320px;">
                ${item.乐理}
                <div style="margin-top: 6px; font-style: italic; color: #c9b6a0;">🍃 ${item.芦苇说}</div>
            </td>
            <td><span class="emotion-tag">${item.情绪}</span></td>
            <td style="font-size: 0.7rem;">${item.歌曲 || "—"}</td>
        </tr>
    `).join("");
}// 筛选器事件
document.getElementById("emotionFilter").addEventListener("change", renderTable);
document.getElementById("categoryFilter").addEventListener("change", renderTable);
document.getElementById("searchInput").addEventListener("input", renderTable);
document.getElementById("resetBtn").addEventListener("click", () => {
    document.getElementById("emotionFilter").value = "all";
    document.getElementById("categoryFilter").value = "all";
    document.getElementById("searchInput").value = "";
    renderTable();
});

// 表头排序
let sortColumn = "id";
let sortDirection = "asc";
document.querySelectorAll("th[data-sort]").forEach(th => {
    th.addEventListener("click", () => {
        const column = th.getAttribute("data-sort");
        if (sortColumn === column) {
            sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
            sortColumn = column;
            sortDirection = "asc";
        }
        allItems.sort((a, b) => {
            let valA = sortColumn === "id" ? a.id : (sortColumn === "name" ? a.名称 : a.情绪);
            let valB = sortColumn === "id" ? b.id : (sortColumn === "name" ? b.名称 : b.情绪);
            if (valA < valB) return sortDirection === "asc" ? -1 : 1;
            if (valA > valB) return sortDirection === "asc" ? 1 : -1;
            return 0;
        });
        renderTable();
    });
});

// ==================== 和弦速查功能 ====================
const noteMap = {
    "C": 0, "C#": 1, "Db": 1, "D": 2, "D#": 3, "Eb": 3,
    "E": 4, "F": 5, "F#": 6, "Gb": 6, "G": 7, "G#": 8,
    "Ab": 8, "A": 9, "A#": 10, "Bb": 10, "B": 11
};
const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

const chordFormulas2 = {
    "maj": { name: "大三和弦", intervals: [0, 4, 7], suffix: "", formula: "1 3 5" },
    "min": { name: "小三和弦", intervals: [0, 3, 7], suffix: "m", formula: "1 b3 5" },
    "aug": { name: "增三和弦", intervals: [0, 4, 8], suffix: "aug", formula: "1 3 #5" },
    "dim": { name: "减三和弦", intervals: [0, 3, 6], suffix: "dim", formula: "1 b3 b5" },
    "maj7": { name: "大七和弦", intervals: [0, 4, 7, 11], suffix: "maj7", formula: "1 3 5 7" },
    "7": { name: "属七和弦", intervals: [0, 4, 7, 10], suffix: "7", formula: "1 3 5 b7" },
    "m7": { name: "小七和弦", intervals: [0, 3, 7, 10], suffix: "m7", formula: "1 b3 5 b7" },
    "m7b5": { name: "半减七和弦", intervals: [0, 3, 6, 10], suffix: "m7b5", formula: "1 b3 b5 b7" },
    "dim7": { name: "减七和弦", intervals: [0, 3, 6, 9], suffix: "dim7", formula: "1 b3 b5 bb7" },
    "maj9": { name: "大九和弦", intervals: [0, 4, 7, 11, 14], suffix: "maj9", formula: "1 3 5 7 9" },
    "9": { name: "属九和弦", intervals: [0, 4, 7, 10, 14], suffix: "9", formula: "1 3 5 b7 9" },
    "m9": { name: "小九和弦", intervals: [0, 3, 7, 10, 14], suffix: "m9", formula: "1 b3 5 b7 9" },
    "11": { name: "属十一和弦", intervals: [0, 4, 7, 10, 14, 17], suffix: "11", formula: "1 3 5 b7 9 11" },
    "13": { name: "属十三和弦", intervals: [0, 4, 7, 10, 14, 17, 21], suffix: "13", formula: "1 3 5 b7 9 11 13" },
    "sus2": { name: "挂二和弦", intervals: [0, 2, 7], suffix: "sus2", formula: "1 2 5" },
    "sus4": { name: "挂四和弦", intervals: [0, 5, 7], suffix: "sus4", formula: "1 4 5" },
    "add9": { name: "加九和弦", intervals: [0, 4, 7, 14], suffix: "add9", formula: "1 3 5 9" },
    "madd9": { name: "小加九和弦", intervals: [0, 3, 7, 14], suffix: "madd9", formula: "1 b3 5 9" },
    "6": { name: "六和弦", intervals: [0, 4, 7, 9], suffix: "6", formula: "1 3 5 6" },
    "m6": { name: "小六和弦", intervals: [0, 3, 7, 9], suffix: "m6", formula: "1 b3 5 6" },
    "5": { name: "五和弦", intervals: [0, 7], suffix: "5", formula: "1 5" }
};

const slashChords = [
    { name: "C/E", notes: "E C G", formula: "C大三，低音 E" },
    { name: "C/G", notes: "G C E", formula: "C大三，低音 G" },
    { name: "C/Bb", notes: "Bb C E G", formula: "C大三，低音 Bb" },
    { name: "Dm/F", notes: "F D A", formula: "Dm，低音 F" },
    { name: "Dm7/F", notes: "F D A C", formula: "Dm7，低音 F" },
    { name: "Dm7/G", notes: "G D F A C", formula: "Dm7，低音 G (2m7/5)" },
    { name: "Em/G", notes: "G E B", formula: "Em，低音 G" },
    { name: "Em7/G", notes: "G E B D", formula: "Em7，低音 G" },
    { name: "F/A", notes: "A F C", formula: "F大三，低音 A" },
    { name: "Fm/Ab", notes: "Ab F C", formula: "Fm，低音 Ab" },
    { name: "Fmaj7/A", notes: "A F C E", formula: "Fmaj7，低音 A" },
    { name: "G/B", notes: "B G D", formula: "G大三，低音 B" },
    { name: "G7/B", notes: "B G D F", formula: "G7，低音 B" },
    { name: "Am/C", notes: "C A E", formula: "Am，低音 C" },
    { name: "Am7/C", notes: "C A E G", formula: "Am7，低音 C" },
    { name: "Bm/D", notes: "D B F#", formula: "Bm，低音 D" },
    { name: "Bm7/D", notes: "D B F# A", formula: "Bm7，低音 D" },
    { name: "Bb/D", notes: "D Bb F", formula: "Bb大三，低音 D" },
    { name: "Bb7/D", notes: "D Bb F Ab", formula: "Bb7，低音 D" }
];

const allRoots = ["C", "C#", "Db", "D", "D#", "Eb", "E", "F", "F#", "Gb", "G", "G#", "Ab", "A", "A#", "Bb", "B"];
const chordTypeKeys2 = ["maj", "min", "aug", "dim", "maj7", "7", "m7", "m7b5", "dim7", "maj9", "9", "m9", "11", "13", "sus2", "sus4", "add9", "madd9", "6", "m6", "5"];

function getChord(root, typeKey) {
    const formula = chordFormulas2[typeKey];
    if (!formula) return null;
    const rootNum = noteMap[root];
    if (rootNum === undefined) return null;
    const notes = formula.intervals.map(interval => {
        const noteNum = (rootNum + interval) % 12;
        return noteNames[noteNum];
    });
    const uniqueNotes = [...new Map(notes.map(n => [n, n])).values()];
    return {
        name: root + formula.suffix,
        notes: uniqueNotes.join(" "),
        formula: formula.formula,
        category: formula.name
    };
}

function getChordListByRoot(root) {
    const result = {};
    for (const typeKey of chordTypeKeys2) {
        const chord = getChord(root, typeKey);
        if (chord) {
            if (!result[chord.category]) result[chord.category] = [];
            result[chord.category].push(chord);
        }
    }
    return result;
}

let currentRoot = "C";
let lookupPanel = null;

function buildChordLookupContent(root) {
    const chordByCategory = getChordListByRoot(root);
    let html = `
        <div class="chord-lookup-header">
            <h3>🎵 和弦构成音速查 · ${root}</h3>
            <button class="chord-lookup-close" id="closeLookupBtn">✕</button>
        </div>
        <div class="root-selector" id="rootSelector">
    `;
    for (const r of allRoots) {
        html += `<button class="root-btn ${r === root ? 'active' : ''}" data-root="${r}">${r}</button>`;
    }
    html += `</div><div class="chord-list">`;
    
    // 转位和弦
    if (slashChords.length > 0) {
        html += `<div class="chord-category">
            <div class="chord-category-header" data-category="slash">
                <div class="chord-category-title">🎸 转位/斜线和弦（${slashChords.length}个）</div>
                <span class="collapse-icon" id="icon_slash">▼</span>
            </div>
            <div class="chord-category-content" id="content_slash">`;
        slashChords.forEach(chord => {
            html += `<div class="chord-item"><span class="chord-name">${chord.name}</span><span class="chord-notes">${chord.notes}</span><span class="chord-formula">${chord.formula}</span></div>`;
        });
        html += `</div></div>`;
    }
    
    for (const [category, chords] of Object.entries(chordByCategory)) {
        const categoryId = "cat_" + category.replace(/[^a-zA-Z0-9]/g, '_');
        html += `
            <div class="chord-category">
                <div class="chord-category-header" data-category="${categoryId}">
                    <div class="chord-category-title">${category}（${chords.length}个）</div>
                    <span class="collapse-icon" id="icon_${categoryId}">▼</span>
                </div>
                <div class="chord-category-content" id="content_${categoryId}">
        `;
        chords.forEach(chord => {
            html += `<div class="chord-item"><span class="chord-name">${chord.name}</span><span class="chord-notes">${chord.notes}</span><span class="chord-formula">${chord.formula}</span></div>`;
        });
        html += `</div></div>`;
    }
    html += `</div>`;
    return html;
}

function bindCollapseFeatures() {
    const headers = document.querySelectorAll('.chord-category-header');
    headers.forEach(header => {
        header.removeEventListener('click', header._handler);
        const handler = () => {
            const categoryId = header.dataset.category;
            const content = document.getElementById(`content_${categoryId}`);
            const icon = document.getElementById(`icon_${categoryId}`);
            if (content && icon) {
                if (content.classList.contains('collapsed')) {
                    content.classList.remove('collapsed');
                    icon.classList.remove('collapsed');
                    icon.textContent = '▼';
                } else {
                    content.classList.add('collapsed');
                    icon.classList.add('collapsed');
                    icon.textContent = '▶';
                }
            }
        };
        header.addEventListener('click', handler);
        header._handler = handler;
    });
}

function bindRootButtons() {
    document.querySelectorAll('#rootSelector .root-btn').forEach(btn => {
        btn.removeEventListener('click', btn._handler);
        const handler = () => {
            const newRoot = btn.dataset.root;
            if (newRoot && newRoot !== currentRoot) {
                currentRoot = newRoot;
                if (lookupPanel) {
                    // 只改这里：刷新内容，不关闭
                    const oldOpen = lookupPanel.classList.contains('open');
                    lookupPanel.innerHTML = buildChordLookupContent(currentRoot);
                    bindRootButtons();
                    bindCollapseFeatures();
                    const closeBtn = document.getElementById('closeLookupBtn');
                    if (closeBtn) closeBtn.onclick = () => lookupPanel.classList.remove('open');
                    if (oldOpen) lookupPanel.classList.add('open');
                }
            }
        };
        btn.addEventListener('click', handler);
        btn._handler = handler;
    });
}

function openChordLookup() {
    if (lookupPanel) {
        lookupPanel.classList.add('open');
        return;
    }
    lookupPanel = document.createElement('div');
    lookupPanel.className = 'chord-lookup-overlay';
    lookupPanel.innerHTML = buildChordLookupContent(currentRoot);
    document.body.appendChild(lookupPanel);
    
    bindRootButtons();
    bindCollapseFeatures();
    const closeBtn = document.getElementById('closeLookupBtn');
    if (closeBtn) closeBtn.onclick = () => lookupPanel.classList.remove('open');
    
    lookupPanel.classList.add('open');
}

const chordLookupBtn = document.getElementById('chordLookupBtn');
if (chordLookupBtn) {
    chordLookupBtn.addEventListener('click', openChordLookup);
}

document.addEventListener('click', (e) => {
    if (lookupPanel && lookupPanel.classList.contains('open')) {
        if (!lookupPanel.contains(e.target) && e.target.id !== 'chordLookupBtn') {
            lookupPanel.classList.remove('open');
        }
    }
});

loadData();
</script>
