<script>
// ==================== 用户界面 ====================
function updateUserUI() {
    const user = getCurrentUser();
    const userNameSpan = document.getElementById('userName');
    const userScoreSpan = document.getElementById('userScore');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    if (user) {
        userNameSpan.innerText = user.nickname || '芦苇同学';
        userScoreSpan.innerText = `积分 ${user.score || 0}`;
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'block';
    } else {
        userNameSpan.innerText = '未登录';
        userScoreSpan.innerText = '积分 0';
        loginBtn.style.display = 'block';
        logoutBtn.style.display = 'none';
    }
}
// 登录/退出
document.getElementById('loginBtn')?.addEventListener('click', () => { showLoginModal(); });
document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); location.reload(); });
// 登录成功回调
window.onLoginSuccess = function(user) {
    updateUserUI();
};

// 显示芦苇乐理手册内容
function showTheoryContent(category) {
    const data = theoryHandbook[category];
    if (!data) return;
    const container = document.getElementById("theoryContent");
    container.innerHTML = data.map(item => `
        <div class="content-card">
            <h3> ${item.title}</h3>
            <p>${item.content}</p>
            <div class="note"> ${item.note}</div>
        </div>
    `).join("");
    // 记录阅读（可选，加分）
    const user = getCurrentUser();
    if (user) {
        // 可以在这里加阅读积分
    }
}
// 显示中国传统音乐内容
function showChineseContent(category) {
    const data = chineseHandbook[category];
    if (!data) return;
    const container = document.getElementById("chineseContent");
    container.innerHTML = data.map(item => `
        <div class="content-card">
            <h3> ${item.title}</h3>
            <p>${item.content}</p>
            <div class="note"> ${item.note}</div>
        </div>
    `).join("");
}
// 构建芦苇乐理手册UI
function buildTheoryUI() {
    const container = document.getElementById("theoryCategories");
    const categories = Object.keys(theoryHandbook);
    categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "category-btn";
        btn.innerText = cat;
        btn.onclick = () => showTheoryContent(cat);
        container.appendChild(btn);
    });
    // 默认显示第一个分类
    if(categories.length > 0) showTheoryContent(categories[0]);
}
