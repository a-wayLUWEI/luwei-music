<!DOCTYPE html>

    <style>
        * {

        }
        body {
            background: #0a0a1a;
            overflow: hidden;

        }

        #starCanvas {

        }

        .top-right {
            position: fixed;
            top: 24px;

            display: flex;
            gap: 16px;
            align-items: center;
        }
        .top-right a {
    color: rgba(255, 255, 255, 0.5);
    text-decoration: none;
    font-size: 0.85rem;
    letter-spacing: 2px;
    transition: 0.3s;
    padding: 6px 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.03);
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
}
.top-right a:hover {
    color: rgba(255, 255, 255, 0.8);
    border-color: rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.06);
}
        .top-right a:hover {
            color: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .top-right .icon-btn {
    font-size: 1.6rem;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.35);
    transition: 0.3s;
    padding: 4px 8px;
    border-radius: 50%;
}
.top-right .icon-btn:hover {
    color: rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.04);
}

        .bottle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            cursor: pointer;
            transition: all 0.5s ease;
        }
        .bottle-container.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.6);
            pointer-events: none;
        }
        .bottle-emoji {
    font-size: 120px;
    opacity: 0.35;  /* 从 0.25 调高到 0.35 */
    filter: grayscale(1) brightness(1.8);
    transition: opacity 0.4s ease;
    display: inline-block;
    line-height: 1.2;
}
.bottle-emoji:hover {
    opacity: 0.6;  /* 从 0.5 调高到 0.6 */
}
       .bottle-label {
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.95rem;
    letter-spacing: 8px;
    margin-top: 4px;
    font-weight: 300;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.08), 0 0 80px rgba(255, 255, 255, 0.04);
}
        .click-hint {
    color: rgba(255, 255, 255, 0.35);
    font-size: 0.75rem;
    letter-spacing: 4px;
    margin-top: 16px;
    animation: pulseHint 4s ease-in-out infinite;
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
}
        @keyframes pulseHint {
            0%,
            100% { opacity: 0.2; }
            50% { opacity: 0.7; }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 20, 0.7);
            backdrop-filter: blur(14px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }

        .modal-card {
            background: rgba(10, 12, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 40px 36px 32px;
            max-width: 460px;
            width: 92%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            position: relative;
            animation: modalIn 0.5s ease;
        }
        @keyframes modalIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-card .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-card .close-btn:hover {
            color: rgba(255, 255, 255, 0.4);
        }

        .modal-card h2 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
        }
        .modal-card .sub {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .modal-card label {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 4px;
        }
        .modal-card input,

            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);

            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            font-family: inherit;

        }
        .modal-card input:focus,
        .modal-card textarea:focus {
            border-color: rgba(180, 200, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }
        .modal-card textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-card .btn-send {
            width: 100%;
            padding: 14px;
            background: rgba(180, 200, 255, 0.04);
            border: 1px solid rgba(180, 200, 255, 0.08);
            border-radius: 30px;
            color: rgba(180, 200, 255, 0.4);
            font-size: 0.9rem;
            letter-spacing: 4px;

            transition: 0.3s;

            letter-spacing: 2px;

        .bottle-result .empty {

        @media (max-width: 480px) {
            .bottle-emoji { font-size: 70px; }

        .global-music {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }

        // ============================================================
        // 2. 星海 Canvas
        // ============================================================
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, centerX, centerY;
        let mouseX = -9999, mouseY = -9999;
        let mouseTrail = [];
        let stars = [];
        let burstParticles = [];
        let nebulaOffset = 0;
        const STAR_COUNT = 380;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            centerX = W / 2;
            centerY = H / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * Math.max(W, H) * 0.45;
                stars.push({
                    angle,
                    radius,
                    baseRadius: radius,
                    speed: (Math.random() - 0.5) * 0.018 + 0.006,
                    size: Math.random() * 5 + 1,
                    breathOffset: Math.random() * Math.PI * 2,
                    breathSpeed: Math.random() * 0.008 + 0.003,
                    alpha: Math.random() * 0.5 + 0.3,
                    hue: Math.random() * 30 - 10
                });
            }
        }
        initStars();

        document.addEventListener('mousemove', function(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
            mouseTrail.push({ x: mouseX, y: mouseY, life: 1 });
            if (mouseTrail.length > 50) mouseTrail.shift();
        });

        function draw() {
            // ===== 极光背景 =====
            const time2 = Date.now() * 0.0216;
            const hue1 = 220 + Math.sin(time2 * 0.3) * 30;
            const hue2 = 140 + Math.sin(time2 * 0.4 + 1.5) * 35;
            const hue3 = 280 + Math.sin(time2 * 0.25 + 3) * 25;
            const hue4 = 260 + Math.sin(time2 * 0.35 + 2) * 20;
            const hue5 = 0 + Math.sin(time2 * 0.2 + 4) * 10;

            const cx1 = W * 0.3 + Math.cos(time2 * 0.2) * 200;
            const cy1 = H * 0.2 + Math.sin(time2 * 0.2) * 150;
            const cx2 = W * 0.7 + Math.cos(time2 * 0.22 + 1) * 220;
            const cy2 = H * 0.8 + Math.sin(time2 * 0.22 + 2) * 160;
            const cx3 = W * 0.5 + Math.cos(time2 * 0.25 + 3) * 180;
            const cy3 = H * 0.4 + Math.sin(time2 * 0.25 + 4) * 140;
            const cx4 = W * 0.2 + Math.cos(time2 * 0.28 + 5) * 160;
            const cy4 = H * 0.6 + Math.sin(time2 * 0.28 + 6) * 130;
            const cx5 = W * 0.9 + Math.cos(time2 * 0.18 + 7) * 150;
            const cy5 = H * 0.3 + Math.sin(time2 * 0.18 + 8) * 120;

            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, W, H);

            const bgGrad1 = ctx.createRadialGradient(cx1, cy1, 50, cx1, cy1, Math.max(W, H) * 0.7);
            bgGrad1.addColorStop(0, `hsla(${hue1}, 65%, 18%, 0.9)`);
            bgGrad1.addColorStop(0.5, `hsla(${hue1 + 20}, 55%, 12%, 0.6)`);
            bgGrad1.addColorStop(1, `hsla(${hue1}, 40%, 6%, 0)`);
            ctx.fillStyle = bgGrad1;
            ctx.fillRect(0, 0, W, H);

            const bgGrad2 = ctx.createRadialGradient(cx2, cy2, 80, cx2, cy2, Math.max(W, H) * 0.6);
            bgGrad2.addColorStop(0, `hsla(${hue2}, 55%, 16%, 0.8)`);
            bgGrad2.addColorStop(0.5, `hsla(${hue2 + 30}, 45%, 10%, 0.5)`);
            bgGrad2.addColorStop(1, `hsla(${hue2}, 35%, 5%, 0)`);
            ctx.fillStyle = bgGrad2;
            ctx.fillRect(0, 0, W, H);

            const bgGrad3 = ctx.createRadialGradient(cx3, cy3, 60, cx3, cy3, Math.max(W, H) * 0.5);
            bgGrad3.addColorStop(0, `hsla(${hue3}, 60%, 16%, 0.7)`);
            bgGrad3.addColorStop(0.6, `hsla(${hue3 + 20}, 50%, 10%, 0.4)`);
            bgGrad3.addColorStop(1, `hsla(${hue3}, 40%, 5%, 0)`);
            ctx.fillStyle = bgGrad3;
            ctx.fillRect(0, 0, W, H);

            const bgGrad4 = ctx.createRadialGradient(cx4, cy4, 70, cx4, cy4, Math.max(W, H) * 0.55);
            bgGrad4.addColorStop(0, `hsla(${hue4}, 70%, 20%, 0.7)`);
            bgGrad4.addColorStop(0.5, `hsla(${hue4 + 15}, 60%, 14%, 0.4)`);
            bgGrad4.addColorStop(1, `hsla(${hue4}, 50%, 8%, 0)`);

                                <span style="color:rgba(255,255,255,0.15);font-size:0.6rem;letter-spacing:2px;">🧴 星愿瓶</span>
                                <span class="status" style="color:${statusColor};">${status}</span>
                            </div>
                            <div class="preview">${preview}</div>
                            <div class="time"> ${new Date(w.created_at).toLocaleString()}</div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('myBottlesModal').classList.add('show');
        }

        function closeMyBottles() {
            document.getElementById('myBottlesModal').classList.remove('show');
        }

// ===== 打开漂流瓶收件箱 =====
async function openBottleInbox() {
    const currentUser = getCurrentAuthUser();
    if (!currentUser) { showToast('请先登录'); return; }
    const userId = currentUser.user_id;

    const { data, error } = await supabase
        .from('wishes')
        .select('id, content, anonymous_name, created_at, is_read')
        .eq('type', 'bottle')
        .eq('receiver_id', userId)
        .order('created_at', { ascending: false });

    if (error) { showToast('加载失败'); return; }

    const modal = document.getElementById('bottleInboxModal');
    const list = document.getElementById('bottleInboxList');  // ← 加上这行
    document.getElementById('bottleInboxOverlay').style.display = 'block';
    modal.style.display = 'block';

    if (data.length === 0) {
        list.innerHTML = `<div style="text-align:center;padding:40px 0;color:rgba(255,255,255,0.15);">
            <div style="font-size:3rem;opacity:0.2;">🧴</div>
            <div style="font-size:0.85rem;letter-spacing:2px;color:rgba(255,255,255,0.3);">还没有人捞到你的瓶子</div>
            <div style="font-size:0.65rem;color:rgba(255,255,255,0.06);margin-top:4px;">瓶子还在星海里漂流</div>
        </div>`;
    } else {
        list.innerHTML = data.map(w => {
            const lines = w.content.split('\n');
            const fromLine = lines.find(l => l.includes('寄件人')) || '匿名';
            const msg = lines.filter(l => !l.includes('寄件人') && !l.includes('收件人')).join('\n');
            return `
                <div style="background:rgba(255,255,255,0.02);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.03);">
                    <div style="color:rgba(255,255,255,0.2);font-size:0.65rem;letter-spacing:1px;margin-bottom:4px;">${fromLine}</div>
                    <div style="color:rgba(255,255,255,0.7);font-size:0.9rem;line-height:1.8;white-space:pre-wrap;">${msg}</div>
                    <div style="color:rgba(255,255,255,0.06);font-size:0.55rem;text-align:right;margin-top:4px;">🌊 ${new Date(w.created_at).toLocaleString()}</div>
                </div>
            `;
        }).join('');
    }

    document.getElementById('bottleBadge').style.display = 'none';
}

function closeBottleInbox() {
    const modal = document.getElementById('bottleInboxModal');
    modal.classList.remove('show');
    setTimeout(() => {
        modal.style.display = 'none';
        document.getElementById('bottleInboxOverlay').style.display = 'none';
    }, 300);
}

        // ============================================================
        // 7. Toast
        // ============================================================
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = `
                position: fixed;
                bottom: 30%;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(10, 12, 30, 0.7);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255,255,255,0.06);
                border-radius: 20px;
                padding: 16px 28px;
                color: rgba(255,255,255,0.7);
                font-size: 0.9rem;
                letter-spacing: 2px;
                z-index: 9999;
                max-width: 90%;
                text-align: center;
                animation: toastFade 0.4s ease;
                font-family: 'Georgia', 'Songti SC', serif;
                box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'opacity 0.8s ease';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 800);
            }, 3000);
        }

// ===== 检查漂流瓶红点 =====
async function checkBottleRedDot() {
    const currentUser = getCurrentAuthUser();
    if (!currentUser) return;
    const userId = currentUser.user_id;

    const { data, error } = await supabase
        .from('wishes')
        .select('id')
        .eq('type', 'bottle')
        .eq('receiver_id', userId)
        .eq('is_read', false);

    if (error) return;
    const count = data ? data.length : 0;
    const badge = document.getElementById('bottleBadge');
    if (badge) {
        if (count > 0) {
            badge.style.display = 'block';
            badge.textContent = count > 99 ? '99+' : count;
        } else {
            badge.style.display = 'none';
        }
    }
}

// ===== Tab 切换 =====
function switchBottleTab(tab) {
    const sentList = document.getElementById('myBottlesList');
    const receivedList = document.getElementById('bottleInboxList');
    const tabSent = document.getElementById('tabSent');
    const tabReceived = document.getElementById('tabReceived');

    if (tab === 'sent') {
        sentList.style.display = 'block';
        receivedList.style.display = 'none';
        tabSent.style.color = 'rgba(255,255,255,0.4)';
        tabSent.style.borderBottomColor = 'rgba(255,215,0,0.3)';
        tabReceived.style.color = 'rgba(255,255,255,0.15)';
        tabReceived.style.borderBottomColor = 'transparent';
    } else {
        sentList.style.display = 'none';
        receivedList.style.display = 'block';
        tabReceived.style.color = 'rgba(255,255,255,0.4)';
        tabReceived.style.borderBottomColor = 'rgba(255,215,0,0.3)';
        tabSent.style.color = 'rgba(255,255,255,0.15)';
        tabSent.style.borderBottomColor = 'transparent';
        // 切换到漂流瓶时加载数据
        loadBottleInbox();
    }
}
