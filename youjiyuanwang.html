<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>邮寄愿望 · 愿望回收箱</title>
    <style>
@keyframes commentBgFlow {
    0% { background-position: 0% 0%; }
    25% { background-position: 50% 100%; }
    50% { background-position: 100% 50%; }
    75% { background-position: 50% 0%; }
    100% { background-position: 0% 100%; }
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a2a1a 0%, #4a6a5a 15%, #2a4a3a 30%, #d4a843 40%, #1a2a3a 50%, #3a4a6a 65%, #2a4a3a 80%, #d4a843 88%, #1a2a1a 100%);
            background-size: 300% 300%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: auroraFlow 14s ease-in-out infinite alternate;
        }
        @keyframes auroraFlow {
            0% { background-position: 0% 0%; }
            25% { background-position: 50% 100%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 0%; }
            100% { background-position: 0% 100%; }
        }
/* ===== 星光背景（固定在弹窗背后，不随内容滚动） ===== */
.star-field-modal {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 28px;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
    display: none;
}
.star-field-modal span {
    position: absolute;
    display: block;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    animation: starTwinkle 3s ease-in-out infinite alternate;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
}

/* 弹窗打开时显示星光 */
.modal-box.show ~ .star-field-modal,
.modal-box.show + .star-field-modal {
    display: block;
}

        /* ===== 流星雨 Canvas ===== */
        #meteorCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes moonBreath {
            0% {
                box-shadow: 0 0 60px rgba(180, 210, 230, 0.12), 0 0 120px rgba(180, 210, 230, 0.06), 0 0 200px rgba(180, 210, 230, 0.03);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 80px rgba(180, 210, 230, 0.2), 0 0 160px rgba(180, 210, 230, 0.1), 0 0 250px rgba(180, 210, 230, 0.05);
                transform: scale(1.02);
            }
        }
        @keyframes moonBeamSweep {
            0% {
                transform: rotate(-20deg) translateX(-100%);
                opacity: 0;
            }
            30% { opacity: 1; }
            70% { opacity: 1; }
            100% {
                transform: rotate(-20deg) translateX(100%);
                opacity: 0;
            }
        }

        .container {
            max-width: 680px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .back {
            display: inline-block;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .back:hover { color: rgba(255, 255, 255, 0.6); }

        .title {
            font-size: 2rem;
            color: rgba(255, 215, 0, 0.7);
            font-weight: 200;
            letter-spacing: 6px;
        }
        .desc {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
            margin-top: 4px;
        }
        .divider {
            width: 40px;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 16px auto;
        }

        /* ===== 池子 ===== */
        .pool-area {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 30px 28px 28px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            min-height: 400px;
            position: relative;
            margin: 10px 0 20px;
            overflow: hidden;
        }
        #poolCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            border-radius: 24px;
        }
        #starContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
            border-radius: 24px;
        }

        /* ===== 邮寄表单（在池子里） ===== */
        .mail-form {
            position: relative;
            z-index: 3;
            text-align: left;
        }
        .mail-form .form-group {
            margin-bottom: 14px;
        }
        .mail-form label {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.7rem;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 4px;
        }
        .mail-form input,
        .mail-form textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }
        .mail-form input:focus,
        .mail-form textarea:focus {
            border-color: rgba(255, 215, 0, 0.2);
            background: rgba(255, 255, 255, 0.06);
        }
        .mail-form textarea {
            resize: vertical;
            min-height: 80px;
        }
        .mail-form .btn-send {
            width: 100%;
            padding: 14px;
            background: rgba(255, 215, 0, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.12);
            border-radius: 20px;
            color: rgba(255, 215, 0, 0.5);
            font-size: 1rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .mail-form .btn-send:hover {
            background: rgba(255, 215, 0, 0.12);
            color: rgba(255, 215, 0, 0.7);
        }
        .mail-form .hint {
            margin-top: 12px;
            text-align: center;
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.6rem;
            letter-spacing: 2px;
        }

        /* ===== 愿望箱入口（右上角） ===== */
        #wishBoxIcon {
            position: fixed;
            top: 20px;
            right: 80px;
            z-index: 999;
            cursor: pointer;
            font-size: 1.8rem;
            transition: 0.3s;
        }
        #wishBoxIcon:hover {
            transform: scale(1.1);
        }
        #wishBoxBadge {
            position: absolute;
            top: -6px;
            right: -10px;
            background: #ff3b3b;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            display: none;
            min-width: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 59, 59, 0.3);
        }

        /* ===== 回收按钮（池子下方） ===== */
        .recycle-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            position: relative;
            z-index: 1;
            justify-content: center;
            flex-wrap: wrap;
        }
        .recycle-area button {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .recycle-area button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
        }
        .btn-recycle {
            background: rgba(255, 215, 0, 0.08) !important;
            border-color: rgba(255, 215, 0, 0.15) !important;
            color: rgba(255, 215, 0, 0.5) !important;
        }
        .btn-recycle:hover {
            background: rgba(255, 215, 0, 0.15) !important;
            color: rgba(255, 215, 0, 0.7) !important;
        }

        .bottom-text {
            margin-top: 30px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.38);
            letter-spacing: 3px;
        }

        /* ===== 愿望箱弹窗 ===== */
/* ===== 愿望箱弹窗 - 星光光点版 ===== */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(6px);
    z-index: 999;
    display: none;
}

@keyframes commentBgFlow {
    0% { background-position: 0% 0%; }
    25% { background-position: 50% 100%; }
    50% { background-position: 100% 50%; }
    75% { background-position: 50% 0%; }
    100% { background-position: 0% 100%; }
}

@keyframes starTwinkle {
    0% { opacity: 0.1; transform: scale(0.8); }
    50% { opacity: 0.9; transform: scale(1.2); }
    100% { opacity: 0.1; transform: scale(0.8); }
}

.modal-box {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.96);
    background: linear-gradient(135deg, 
        #e8e8e8 0%, 
        #8a8a8a 15%, 
        #1a1a1a 30%, 
        #d4a843 45%, 
        #6a5a9a 60%, 
        #2a4a3a 75%, 
        #6a5a9a 85%, 
        #3a3a4a 100%
    );
    background-size: 300% 300%;
    animation: commentBgFlow 10s ease-in-out infinite alternate;
    border-radius: 28px;
    padding: 36px 32px 32px;
    max-width: 480px;
    width: 92%;
    z-index: 1000;
    display: none;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    transition: all 0.3s ease;
    max-height: 90vh;
    overflow-y: auto;
    scrollbar-width: none;
}
.modal-box::-webkit-scrollbar {
    display: none;
}
.modal-box.show {
    transform: translate(-50%, -50%) scale(1);
}

/* ===== 星光光点（纯 CSS） ===== */
.star-field {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 28px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}
.star-field span {
    position: absolute;
    display: block;
    width: 4px;
    height: 4px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    animation: starTwinkle 3s ease-in-out infinite alternate;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.2), 0 0 24px rgba(255, 255, 255, 0.05);
}
.star-field span:nth-child(1) { top: 8%; left: 10%; animation-delay: 0s; width: 2px; height: 2px; }
.star-field span:nth-child(2) { top: 15%; left: 80%; animation-delay: 0.4s; width: 5px; height: 5px; }
.star-field span:nth-child(3) { top: 25%; left: 25%; animation-delay: 0.8s; width: 1.5px; height: 1.5px; }
.star-field span:nth-child(4) { top: 35%; left: 60%; animation-delay: 1.2s; width: 2.5px; height: 2.5px; }
.star-field span:nth-child(5) { top: 45%; left: 5%; animation-delay: 0.2s; width: 2px; height: 2px; }
.star-field span:nth-child(6) { top: 50%; left: 90%; animation-delay: 0.6s; width: 6px; height: 6px; }
.star-field span:nth-child(7) { top: 60%; left: 35%; animation-delay: 1s; width: 1.5px; height: 1.5px; }
.star-field span:nth-child(8) { top: 70%; left: 70%; animation-delay: 0.3s; width: 2px; height: 2px; }
.star-field span:nth-child(9) { top: 80%; left: 15%; animation-delay: 0.7s; width: 2.5px; height: 2.5px; }
.star-field span:nth-child(10) { top: 90%; left: 50%; animation-delay: 1.1s; width: 1.5px; height: 1.5px; }
.star-field span:nth-child(11) { top: 5%; left: 45%; animation-delay: 0.5s; width: 2px; height: 2px; }
.star-field span:nth-child(12) { top: 12%; left: 55%; animation-delay: 0.9s; width: 5px; height: 5px; }
.star-field span:nth-child(13) { top: 30%; left: 75%; animation-delay: 0.1s; width: 1.5px; height: 1.5px; }
.star-field span:nth-child(14) { top: 42%; left: 40%; animation-delay: 0.5s; width: 2px; height: 2px; }
.star-field span:nth-child(15) { top: 55%; left: 20%; animation-delay: 0.9s; width: 2.5px; height: 2.5px; }
.star-field span:nth-child(16) { top: 68%; left: 55%; animation-delay: 0.3s; width: 1.5px; height: 1.5px; }
.star-field span:nth-child(17) { top: 75%; left: 85%; animation-delay: 0.7s; width: 2px; height: 2px; }
.star-field span:nth-child(18) { top: 85%; left: 30%; animation-delay: 1.1s; width: 6px; height: 6px; }
.star-field span:nth-child(19) { top: 95%; left: 70%; animation-delay: 0.2s; width: 1.5px; height: 1.5px; }
.star-field span:nth-child(20) { top: 20%; left: 95%; animation-delay: 0.6s; width: 2px; height: 2px; }

.modal-header {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}
.modal-header h3 {
    color: rgba(255, 255, 255, 0.75);
    font-size: 1.6rem;
    letter-spacing: 2px;
    font-weight: 300;
}
.modal-close {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.2);
    font-size: 1.6rem;
    cursor: pointer;
    transition: 0.3s;
}
.modal-close:hover {
    color: rgba(255, 255, 255, 0.5);
}

#inboxList {
    position: relative;
    z-index: 1;
}

.inbox-item {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 16px;
    padding: 18px 16px;
    margin-bottom: 14px;
}
.inbox-item.unread {
    border-color: rgba(255, 215, 0, 0.12);
}
.inbox-header {
    color: rgba(255, 255, 255, 0.25);
    font-size: 0.65rem;
    letter-spacing: 1px;
    margin-bottom: 8px;
    line-height: 1.6;
}
.inbox-body {
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.8;
    white-space: pre-wrap;
    font-size: 0.95rem;
}
.inbox-time {
    color: rgba(255, 255, 255, 0.08);
    font-size: 0.6rem;
    margin-top: 8px;
    text-align: right;
}
.inbox-empty {
    position: relative;
    z-index: 1;
    color: rgba(255, 255, 255, 0.25);
    text-align: center;
    padding: 40px 0;
    line-height: 2.5;
}
.inbox-empty span {
    font-size: 0.8rem;
    display: block;
    color: rgba(255, 255, 255, 0.06);
}

        /* ===== 音乐控制器 ===== */
        .global-music {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.34);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .global-music:hover {
            background: rgba(255,255,255,0.36);
            border-color: rgba(255,255,255,0.28);
        }
        .global-music button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .global-music button:hover { color: rgba(255,255,255,0.6); }
        .global-music .label {
            color: rgba(255,255,255,0.5);
            font-size: 0.75rem;
            letter-spacing: 1px;
            min-width: 60px;
            text-align: left;
        }

        /* ===== 移动端适配 ===== */
        @media (max-width: 480px) {
            .container { padding: 0 4px; }
            .pool-area { padding: 20px 14px; }
            .icon-big { font-size: 2.8rem; }
            .title { font-size: 1.2rem; }
            .global-music { bottom: 16px; right: 16px; padding: 6px 14px; }
            .global-music button { font-size: 0.7rem; }
            .global-music .label { font-size: 0.45rem; min-width: 40px; }
        }
@media (max-width: 480px) {
    .右上角容器 {
        gap: 8px;
    }
    .回收按钮 {
        font-size: 0.65rem;
        padding: 6px 12px;
    }
    .愿望箱图标 {
        font-size: 1.5rem;
    }
}
    </style>
</head>

        // ============================================================
        // 2. 池水波纹（Canvas）
        // ============================================================
        (function() {
            const canvas = document.getElementById('poolCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h, time = 0;
            const particles = [];

            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                w = canvas.width = rect.width;
                h = canvas.height = rect.height;
            }
            window.addEventListener('resize', resize);
            resize();
            for (let i = 0; i < 30; i++) {
                particles.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 3 + 1, speed: Math.random() *
                        0.005 + 0.002, phase: Math.random() * Math.PI * 2 });
            }

            function draw() {
                time += 0.02;
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < 8; i++) {
                    const offset = i * 1.0,
                        amp = 10 + i * 3,
                        freq = 0.025 + i * 0.004,
                        speed = 0.5 + i * 0.06,
                        alphaBase = 0.025 + i * 0.012,
                        lineWidth = 1 + i * 0.25,
                        yBase = h * (0.3 + i * 0.055);
                    ctx.beginPath();
                    for (let x = 0; x < w; x += 2) {
                        const y = yBase + Math.sin(x * freq + time * speed + offset) * amp + Math.sin(x * (freq * 1.6) +
                            time * (speed * 0.7) + offset * 0.5) * (amp * 0.5);
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    const alpha = alphaBase + Math.sin(time * 0.2 + i) * 0.012 + 0.008;
                    ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
                    ctx.lineWidth = lineWidth;
                    ctx.stroke();
                }
                for (let p = 0; p < particles.length; p++) {
                    const pt = particles[p];
                    const px = pt.x + Math.sin(time * pt.speed * 10 + pt.phase) * 10;
                    const py = pt.y + Math.cos(time * pt.speed * 8 + pt.phase) * 8;
                    const alpha = 0.15 + Math.sin(time * pt.speed * 5 + pt.phase) * 0.08 + 0.08;
                    const glow = ctx.createRadialGradient(px, py, 0, px, py, pt.r * 6);
                    glow.addColorStop(0, 'rgba(212,184,150,' + alpha + ')');
                    glow.addColorStop(0.3, 'rgba(212,184,150,' + (alpha * 0.3) + ')');
                    glow.addColorStop(1, 'rgba(212,184,150,0)');
                    ctx.beginPath();
                    ctx.arc(px, py, pt.r * 6, 0, Math.PI * 2);
                    ctx.fillStyle = glow;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(px, py, pt.r * 1.2, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,240,220,' + (alpha * 0.6) + ')';
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

async function recycleWish() {
    const currentUser = getCurrentAuthUser();

    if (blocked.some(w => reply.includes(w))) {

        let meteorAnimationId = null;
        let meteors = [];
        let meteorCtx = null;
        let meteorCanvas = null;

        function initMeteorCanvas() {
            meteorCanvas = document.getElementById('meteorCanvas');
            if (!meteorCanvas) return;
            meteorCtx = meteorCanvas.getContext('2d');
            const rect = document.body.getBoundingClientRect();
            meteorCanvas.width = rect.width;
            meteorCanvas.height = rect.height;
            meteors = [];
            for (let i = 0; i < 52; i++) {
                meteors.push(createMeteor());
            }
            drawMeteors();
        }

        function createMeteor() {
            const canvas = meteorCanvas;
            return {
                x: Math.random() * canvas.width * 0.8,
                y: Math.random() * canvas.height * 0.3,
                length: Math.random() * 80 + 40,
                speed: Math.random() * 4 + 3,
                angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
                opacity: Math.random() * 0.6 + 0.3,
                life: Math.random() * 120 + 80,
                maxLife: 200,
                delay: Math.random() * 200
            };
        }

        function drawMeteors() {
            if (!meteorCtx || !meteorCanvas) return;
            const ctx = meteorCtx;
            const canvas = meteorCanvas;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            meteors.forEach(meteor => {
                if (meteor.delay > 0) { meteor.delay--; return; }
                meteor.x += Math.cos(meteor.angle) * meteor.speed;
                meteor.y += Math.sin(meteor.angle) * meteor.speed;
                meteor.life--;
                const lifeRatio = meteor.life / meteor.maxLife;
                const alpha = meteor.opacity * Math.min(1, lifeRatio * 2);
                const tailLength = meteor.length * lifeRatio;
                const gradient = ctx.createLinearGradient(
                    meteor.x, meteor.y,
                    meteor.x - Math.cos(meteor.angle) * tailLength,
                    meteor.y - Math.sin(meteor.angle) * tailLength
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
                gradient.addColorStop(0.3, `rgba(255, 240, 220, ${alpha * 0.6})`);
                gradient.addColorStop(1, `rgba(255, 220, 200, 0)`);
                ctx.beginPath();
                ctx.moveTo(meteor.x, meteor.y);
                ctx.lineTo(
                    meteor.x - Math.cos(meteor.angle) * tailLength,
                    meteor.y - Math.sin(meteor.angle) * tailLength
                );
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.stroke();

                const glow = ctx.createRadialGradient(meteor.x, meteor.y, 0, meteor.x, meteor.y, 6);
                glow.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.8})`);
                glow.addColorStop(1, `rgba(255, 255, 255, 0)`);
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(meteor.x, meteor.y, 6, 0, Math.PI * 2);
                ctx.fill();

                if (meteor.life <= 0) {
                    Object.assign(meteor, createMeteor());
                    meteor.x = Math.random() * canvas.width * 0.8;
                    meteor.y = Math.random() * canvas.height * 0.2;
                    meteor.delay = Math.random() * 100 + 50;
                }
            });
            meteorAnimationId = requestAnimationFrame(drawMeteors);
        }

                label.style.fontSize = '0.8rem';
                label.style.color = 'rgba(255,255,255,0.5)';
            }
        });

    // ===== 音乐控制 =====
    document.addEventListener('DOMContentLoaded', function() {
        // 歌名显示调大
        var label = document.getElementById('musicLabel');
        if (label) {
            label.style.fontSize = '0.8rem';
            label.style.color = 'rgba(255,255,255,0.5)';
        }
    });
// ============================================================
// 寄件记录
// ============================================================
async function openSentBox() {
    const currentUser = getCurrentAuthUser();
    if (!currentUser) { alert('请先登录'); return; }
    const userId = currentUser.user_id;

    const { data, error } = await supabase
        .from('wishes')
        .select('id, receiver_id, content, anonymous_name, created_at, is_read, is_public')
        .eq('sender_id', userId)
        .order('created_at', { ascending: false });

    if (error) { alert('加载失败'); return; }

    const modal = document.getElementById('sentModal');
    const list = document.getElementById('sentList');
    document.getElementById('sentOverlay').style.display = 'block';
    modal.style.display = 'block';
    setTimeout(() => { modal.classList.add('show'); }, 10);

    if (data.length === 0) {
        list.innerHTML = `
            <div style="text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.15); line-height: 2.5;">
                <div style="font-size: 3rem; opacity: 0.2; margin-bottom: 16px;">📭</div>
                <div style="font-size: 1rem; letter-spacing: 4px; font-weight: 200;">你还没有寄过信</div>
                <div style="font-size: 0.75rem; letter-spacing: 2px; color: rgba(255,255,255,0.06);">
                    去写一封信吧，会有人收到的
                </div>
            </div>
        `;
    } else {
        list.innerHTML = data.map(w => {
            const preview = w.content.length > 30 ? w.content.substring(0, 30) + '...' : w.content;
            let status = '📭 回收箱';
            let statusColor = 'rgba(255,255,255,0.15)';
            if (w.receiver_id) {
                if (w.is_read) {
                    status = '✅ 已读';
                    statusColor = 'rgba(100,220,180,0.5)';
                } else {
                    status = '⏳ 未读';
                    statusColor = 'rgba(255,215,0,0.4)';
                }
            }
            return `
                <div style="
                    background: rgba(255,255,255,0.02);
                    border-radius: 16px;
                    padding: 16px 18px;
                    margin-bottom: 12px;
                    border: 1px solid rgba(255,255,255,0.03);
                ">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="color: rgba(255,255,255,0.25); font-size: 0.65rem; letter-spacing: 1px;">
                            ${w.receiver_id ? '📬 寄给：' + (w.anonymous_name || '匿名用户') : '📭 公共回收箱'}
                        </span>
                        <span style="color: ${statusColor}; font-size: 0.6rem; letter-spacing: 1px;">
                            ${status}
                        </span>
                    </div>
                    <div style="color: rgba(255,255,255,0.6); font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap;">
                        ${preview}
                    </div>
                    <div style="color: rgba(255,255,255,0.06); font-size: 0.55rem; margin-top: 6px; text-align: right;">
                        🌙 ${new Date(w.created_at).toLocaleString()}
                    </div>
                </div>
            `;
        }).join('');
    }
}

function closeSentBox() {
    document.getElementById('sentModal').classList.remove('show');
    setTimeout(() => {
        document.getElementById('sentModal').style.display = 'none';
        document.getElementById('sentOverlay').style.display = 'none';
    }, 250);
}
    </script>
